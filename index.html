,"q":"Which endocrine organ stores and releases hormones produced in the hypothalamus, including ADH and oxytocin?","opts":["A. Hypothalamus","B. Posterior pituitary","C. Pineal gland","D. Anterior pituitary"],"a":"B. Posterior pituitary"},{"id":"s2-step-e36","ch":17,"section":"Step","q":"Which hormone is secreted by the adrenal cortex and plays a key role in glucose metabolism during stress?","opts":["A. Aldosterone","B. Norepinephrine","C. Cortisol","D. Epinephrine"],"a":"C. Cortisol"},{"id":"s2-step-e37","ch":17,"section":"Step","q":"Which of the following is a steroid hormone?","opts":["A. Growth hormone","B. Insulin","C. ADH","D. Aldosterone"],"a":"D. Aldosterone"},{"id":"s2-step-e38","ch":17,"section":"Step","q":"What is the primary action of ANP (atrial natriuretic peptide) as described in secondary endocrine organs?","opts":["A. Stimulate erythropoietin","B. Reduce blood volume and Na+ concentration","C. Increase blood glucose","D. Promote calcium absorption"],"a":"B. Reduce blood volume and Na+ concentration"},{"id":"s2-step-e39","ch":17,"section":"Step","q":"Which hormone directly stimulates osteoclast activity to raise blood calcium levels?","opts":["A. Thyroid-stimulating hormone (TSH)","B. Calcitonin","C. Parathyroid hormone (PTH)","D. Calcitriol (vitamin D)"],"a":"C. Parathyroid hormone (PTH)"},{"id":"s2-step-e40","ch":17,"section":"Step","q":"Which hormone is synthesized and stored in the posterior pituitary but produced in the hypothalamus?","opts":["A. Growth hormone (GH)","B. Prolactin (PRL)","C. Antidiuretic hormone (ADH)","D. Oxytocin"],"a":"C. Antidiuretic hormone (ADH)"},{"id":"s2-step-e41","ch":17,"section":"Step","q":"Which gland secretes mineralocorticoids that regulate sodium and water balance?","opts":["A. Adrenal cortex","B. Thyroid gland","C. Adrenal medulla","D. Pituitary gland"],"a":"A. Adrenal cortex"},{"id":"s2-step-e42","ch":17,"section":"Step","q":"Which hormone decreases blood calcium levels by inhibiting osteoclast activity?","opts":["A. Vitamin D","B. Calcitriol","C. PTH","D. Calcitonin"],"a":"D. Calcitonin"},{"id":"s2-step-e43","ch":17,"section":"Step","q":"Which organ’s endocrine function includes producing renin, affecting blood pressure indirectly?","opts":["A. Heart","B. Kidneys","C. Thymus","D. Liver"],"a":"B. Kidneys"},{"id":"s2-step-e44","ch":17,"section":"Step","q":"FSH and LH are secreted by which anterior pituitary structure?","opts":["A. Thyrotrophs","B. Gonadotrophs (gonadotropic cells)","C. Corticotrophs","D. Mammotrophs"],"a":"B. Gonadotrophs (gonadotropic cells)"},{"id":"s2-step-e45","ch":17,"section":"Step","q":"Which of the following hormones is produced by the thymus and supports T lymphocyte development?","opts":["A. Glucagon","B. Thymosins","C. Thyroxine","D. Insulin"],"a":"B. Thymosins"},{"id":"s2-step-e46","ch":17,"section":"Step","q":"Which cells of the pancreatic islets secrete glucagon?","opts":["A. Pancreatic polypeptide cells","B. Beta cells","C. Delta cells","D. Alpha cells"],"a":"D. Alpha cells"},{"id":"s2-step-e47","ch":17,"section":"Step","q":"Which hormone family includes estrogen, testosterone, and progesterone?","opts":["A. Glycoproteins","B. Steroid hormones","C. Biogenic amines","D. Peptide hormones"],"a":"B. Steroid hormones"},{"id":"s2-step-e48","ch":17,"section":"Step","q":"Which organ produces erythropoietin as part of the endocrine system’s interaction with blood cell production?","opts":["A. Liver","B. Pancreas","C. Thymus","D. Kidneys"],"a":"D. Kidneys"},{"id":"s2-step-e49","ch":17,"section":"Step","q":"Which hormone is primarily responsible for uterine contractions and milk ejection?","opts":["A. Oxytocin","B. ADH","C. FSH","D. LH"],"a":"A. Oxytocin"},{"id":"s2-step-e50","ch":17,"section":"Step","q":"The hormone responsible for reabsorption of water in the kidneys is secreted by which gland?","opts":["A. Posterior pituitary (ADH)","B. Anterior pituitary (GH)","C. Adrenal cortex (Aldosterone)","D. Thyroid gland (Calcitonin)"],"a":"A. Posterior pituitary (ADH)"},{"id":"s2-step-e51","ch":17,"section":"Step","q":"Which structure serves as a neuroendocrine link between the nervous system and the endocrine system by producing releasing hormones?","opts":["A. Thymus","B. Pituitary gland","C. Hypothalamus","D. Pineal gland"],"a":"C. Hypothalamus"},{"id":"s2-step-e52","ch":17,"section":"Step","q":"Which gland contains parafollicular (C) cells that secrete calcitonin?","opts":["A. Pituitary gland","B. Thyroid gland","C. Thyroglobulin","D. Parathyroid glands"],"a":"B. Thyroid gland"}]},{"key":"s2m2","name":"Module 2","sub":"Blood (18) · Heart (19) · Blood Vessels (20)","semester":2,"cards":[{"id":"s2-c18-rq5","ch":18,"section":"RQ","q":"Which of the following statements about blood is true?","opts":["A. Blood is about 92 percent water.","B. Blood is slightly more acidic than water.","C. Blood is slightly more viscous than water.","D. Blood is slightly more salty than seawater."],"a":"C. Blood is slightly more viscous than water."},{"id":"s2-c18-rq6","ch":18,"section":"RQ","q":"Which of the following statements about albumin is true?","opts":["A. It draws water out of the blood vessels and into the body’s tissues.","B. It is the most abundant plasma protein.","C. It is produced by specialized leukocytes called plasma cells.","D. All of the above are true."],"a":"B. It is the most abundant plasma protein."},{"id":"s2-c18-rq7","ch":18,"section":"RQ","q":"Which of the following plasma proteins is not produced by the liver?","opts":["A. fibrinogen","B. alpha globulin","C. beta globulin","D. immunoglobulin"],"a":"D. immunoglobulin"},{"id":"s2-c18-rq8","ch":18,"section":"RQ","q":"Which of the formed elements arise from myeloid stem cells?","opts":["A. B cells","B. natural killer cells","C. platelets","D. all of the above"],"a":"C. platelets"},{"id":"s2-c18-rq9","ch":18,"section":"RQ","q":"Which of the following statements about erythropoietin is true?","opts":["A. It facilitates the proliferation and differentiation of the erythrocyte lineage.","B. It is a hormone produced by the thyroid gland.","C. It is a hemopoietic growth factor that prompts lymphoid stem cells to leave the bone marrow.","D. Both a and b are true."],"a":"A. It facilitates the proliferation and differentiation of the erythrocyte lineage."},{"id":"s2-c18-rq10","ch":18,"section":"RQ","q":"Interleukins are associated primarily with which of the following?","opts":["A. production of various lymphocytes","B. immune responses","C. inflammation","D. all of the above 768     18 • Review Questions Access for free at openstax.org"],"a":"D. all of the above 768     18 • Review Questions Access for free at openstax.org"},{"id":"s2-c18-rq11","ch":18,"section":"RQ","q":"Which of the following statements about mature, circulating erythrocytes is true?","opts":["A. They have no nucleus.","B. They are packed with mitochondria.","C. They survive for an average of 4 days.","D. All of the above"],"a":"A. They have no nucleus."},{"id":"s2-c18-rq12","ch":18,"section":"RQ","q":"A molecule of hemoglobin ________.","opts":["A. is shaped like a biconcave disk packed almost entirely with iron","B. contains four glycoprotein units studded with oxygen","C. consists of four globin proteins, each bound to a molecule of heme","D. can carry up to 120 molecules of oxygen"],"a":"C. consists of four globin proteins, each bound to a molecule of heme"},{"id":"s2-c18-rq13","ch":18,"section":"RQ","q":"The production of healthy erythrocytes depends upon the availability of ________.","opts":["A. copper","B. zinc","C. vitamin B12","D. copper, zinc, and vitamin B12"],"a":"D. copper, zinc, and vitamin B12"},{"id":"s2-c18-rq14","ch":18,"section":"RQ","q":"Aging and damaged erythrocytes are removed from the circulation by ________.","opts":["A. myeoblasts","B. monocytes","C. macrophages","D. mast cells"],"a":"C. macrophages"},{"id":"s2-c18-rq15","ch":18,"section":"RQ","q":"A patient has been suffering for 2 months with a chronic, watery diarrhea. A blood test is likely to reveal ________.","opts":["A. a hematocrit below 30 percent","B. hypoxemia","C. anemia","D. polycythemia"],"a":"D. polycythemia"},{"id":"s2-c18-rq16","ch":18,"section":"RQ","q":"The process by which leukocytes squeeze through adjacent cells in a blood vessel wall is called ________.","opts":["A. leukocytosis","B. positive chemotaxis","C. emigration","D. cytoplasmic extending"],"a":"C. emigration"},{"id":"s2-c18-rq17","ch":18,"section":"RQ","q":"Which of the following describes a neutrophil?","opts":["A. abundant, agranular, especially effective against cancer cells","B. abundant, granular, especially effective against bacteria","C. rare, agranular, releases antimicrobial defensins","D. rare, granular, contains multiple granules packed with histamine"],"a":"B. abundant, granular, especially effective against bacteria"},{"id":"s2-c18-rq18","ch":18,"section":"RQ","q":"T and B lymphocytes ________.","opts":["A. are polymorphonuclear","B. are involved with specific immune function","C. proliferate excessively in leukopenia","D. are most active against parasitic worms"],"a":"B. are involved with specific immune function"},{"id":"s2-c18-rq19","ch":18,"section":"RQ","q":"A patient has been experiencing severe, persistent allergy symptoms that are reduced when she takes an antihistamine. Before the treatment, this patient was likely to have had increased activity of which leukocyte?","opts":["A. basophils","B. neutrophils 18 • Review Questions     769","C. monocytes","D. natural killer cells"],"a":"A. basophils"},{"id":"s2-c18-rq20","ch":18,"section":"RQ","q":"Thrombocytes are more accurately called ________.","opts":["A. clotting factors","B. megakaryoblasts","C. megakaryocytes","D. platelets"],"a":"D. platelets"},{"id":"s2-c18-rq21","ch":18,"section":"RQ","q":"The first step in hemostasis is ________.","opts":["A. vascular spasm","B. conversion of fibrinogen to fibrin","C. activation of the intrinsic pathway","D. activation of the common pathway"],"a":"A. vascular spasm"},{"id":"s2-c18-rq22","ch":18,"section":"RQ","q":"Prothrombin is converted to thrombin during the ________.","opts":["A. intrinsic pathway","B. extrinsic pathway","C. common pathway","D. formation of the platelet plug"],"a":"C. common pathway"},{"id":"s2-c18-rq23","ch":18,"section":"RQ","q":"Hemophilia is characterized by ________.","opts":["A. inadequate production of heparin","B. inadequate production of clotting factors","C. excessive production of fibrinogen","D. excessive production of platelets"],"a":"B. inadequate production of clotting factors"},{"id":"s2-c18-rq24","ch":18,"section":"RQ","q":"The process in which antibodies attach to antigens, causing the formation of masses of linked cells, is called ________.","opts":["A. sensitization","B. coagulation","C. agglutination","D. hemolysis"],"a":"C. agglutination"},{"id":"s2-c18-rq25","ch":18,"section":"RQ","q":"People with ABO blood type O ________.","opts":["A. have both antigens A and B on their erythrocytes","B. lack both antigens A and B on their erythrocytes","C. have neither anti-A nor anti-B antibodies circulating in their blood plasma","D. are considered universal recipients"],"a":"B. lack both antigens A and B on their erythrocytes"},{"id":"s2-c18-rq26","ch":18,"section":"RQ","q":"Hemolytic disease of the newborn is a risk during a subsequent pregnancy in which ________.","opts":["A. a type AB person is carrying a type O fetus","B. a type O person is carrying a type AB fetus","C. an Rh+ person is carrying an Rh− fetus","D. an Rh− person is carrying a second Rh+ fetus"],"a":"D. an Rh− person is carrying a second Rh+ fetus"},{"id":"s2-c18-ct27","ch":18,"section":"CT","q":"A patient’s hematocrit is 42 percent. Approximately what percentage of the patient’s blood is plasma?","a":"The patient’s blood is approximately 58 percent plasma (since the buffy coat is less than 1 percent)."},{"id":"s2-c18-ct28","ch":18,"section":"CT","q":"Why would it be incorrect to refer to the formed elements as cells?","a":"The formed elements include erythrocytes and leukocytes, which are cells (although mature erythrocytes do not have a nucleus); however, the formed elements also include platelets, which are not true cells but cell fragments."},{"id":"s2-c18-ct29","ch":18,"section":"CT","q":"True or false: The buffy coat is the portion of a blood sample that is made up of its proteins.","a":"False. The buffy coat is the portion of blood that is made up of its leukocytes and platelets."},{"id":"s2-c18-ct30","ch":18,"section":"CT","q":"Myelofibrosis is a disorder in which inflammation and scar tissue formation in the bone marrow impair hemopoiesis. One sign is an enlarged spleen. Why?","a":"When disease impairs the ability of the bone marrow to participate in hemopoiesis, extramedullary hemopoiesis begins in the patient’s liver and spleen. This causes the spleen to enlarge."},{"id":"s2-c18-ct31","ch":18,"section":"CT","q":"Would you expect a patient with a form of cancer called acute myelogenous leukemia to experience impaired production of erythrocytes, or impaired production of lymphocytes? Explain your choice.","a":"The adjective myelogenous suggests a condition originating from (generated by) myeloid cells. Acute myelogenous leukemia impairs the production of erythrocytes and other mature formed elements of the myeloid stem cell lineage. Lymphocytes arise from the lymphoid stem cell line."},{"id":"s2-c18-ct32","ch":18,"section":"CT","q":"A young woman has been experiencing unusually heavy menstrual bleeding for several years. She follows a strict vegan diet (no animal foods). She is at risk for what disorder, and why?","a":"She is at risk for anemia, because her unusually heavy menstrual bleeding results in excessive loss of erythrocytes each month. At the same time, her vegan diet means that she does not have dietary sources of heme iron. The non-heme iron she consumes in plant foods is not as well absorbed as heme iron."},{"id":"s2-c18-ct33","ch":18,"section":"CT","q":"A patient has thalassemia, a genetic disorder characterized by abnormal synthesis of globin proteins and excessive destruction of erythrocytes. This patient is jaundiced and is found to have an excessive level of bilirubin in his blood. Explain the connection.","a":"Bilirubin is a breakdown product of the non-iron component of heme, which is cleaved from globin when erythrocytes are degraded. Excessive erythrocyte destruction would deposit excessive bilirubin in the blood. Bilirubin is a yellowish pigment, and high blood levels can manifest as yellowed skin"},{"id":"s2-c18-ct34","ch":18,"section":"CT","q":"One of the more common adverse effects of cancer chemotherapy is the destruction of leukocytes. Before his next scheduled chemotherapy treatment, a patient undergoes a blood test called an absolute neutrophil count (ANC), which reveals that his neutrophil count is 1900 cells per microliter. Would his healthcare team be likely to proceed with his chemotherapy treatment? Why?","a":"A neutrophil count below 1800 cells per microliter is considered abnormal. Thus, this patient’s ANC is at the low end of the normal range and there would be no reason to delay chemotherapy. In clinical practice, most patients are given chemotherapy if their ANC is above 1000."},{"id":"s2-c18-ct35","ch":18,"section":"CT","q":"A patient was admitted to the burn unit the previous evening suffering from a severe burn involving his left upper extremity and shoulder. A blood test reveals that he is experiencing leukocytosis. Why is this an expected finding?","a":"Any severe stress can increase the leukocyte count, resulting in leukocytosis. A burn is especially likely to increase the proliferation of leukocytes in order to ward off infection, a significant risk when the barrier function of the skin is destroyed."},{"id":"s2-c18-ct36","ch":18,"section":"CT","q":"A lab technician collects a blood sample in a glass tube. After about an hour, she harvests serum to continue her blood analysis. Explain what has happened during the hour that the sample was in the glass tube.","a":"When blood contacts glass, the intrinsic coagulation pathway is initiated. This leads to the common pathway, and the blood clots. Within about 30 minutes, the clot begins to shrink. After an hour, it is about half its original size. Its heavier weight will cause it to fall to the bottom of the tube during centrifugation, allowing the lab technician to harvest the serum remaining at the top."},{"id":"s2-c18-ct37","ch":18,"section":"CT","q":"Explain why administration of a thrombolytic agent is a first intervention for someone who has suffered a thrombotic stroke.","a":"In a thrombotic stroke, a blood vessel to the brain has been blocked by a thrombus, an aggregation of platelets and erythrocytes within a blood vessel. A thrombolytic agent is a medication that promotes the breakup of thrombi."},{"id":"s2-c18-ct38","ch":18,"section":"CT","q":"Following a motor vehicle accident, a patient is rushed to the emergency department with multiple traumatic injuries, causing severe bleeding. The patient’s condition is critical, and there is no time for determining his blood type. What type of blood is transfused, and why?","a":"In emergency situations, blood type O− will be infused until cross matching can be done. Blood type O− is called the universal donor blood because the erythrocytes have neither A nor B antigens on their surface, and the Rh factor is negative."},{"id":"s2-c18-ct39","ch":18,"section":"CT","q":"In preparation for a scheduled surgery, a patient visits the hospital lab for a blood draw. The technician collects a blood sample and performs a test to determine its type. She places a sample of the patient’s blood in two wells. To the first well she adds anti-A antibody. To the second she adds anti-B antibody. Both samples visibly agglutinate. Has the technician made an error, or is this a normal response? If normal, what blood type does this indicate?","a":"The lab technician has not made an error. Blood type AB has both A and B surface antigens, and neither anti-A nor anti-B antibodies circulating in the plasma. When anti-A antibodies (added to the first well) contact A antigens on AB erythrocytes, they will cause agglutination. Similarly, when anti-B antibodies contact B antigens on AB erythrocytes, they will cause agglutination. Anatomy &amp; Physiology Unit 4: Fluids and Transport"},{"id":"s2-c19-rq2","ch":19,"section":"RQ","q":"Which of the following is not important in preventing backflow of blood?","opts":["A. chordae tendineae","B. papillary muscles","C. AV valves","D. endocardium"],"a":"D. endocardium"},{"id":"s2-c19-rq3","ch":19,"section":"RQ","q":"Which valve separates the left atrium from the left ventricle?","opts":["A. mitral","B. tricuspid","C. pulmonary","D. aortic"],"a":"A. mitral"},{"id":"s2-c19-rq4","ch":19,"section":"RQ","q":"Which of the following lists the valves in the order through which the blood flows from the vena cava through the heart?","opts":["A. tricuspid, pulmonary semilunar, bicuspid, aortic semilunar","B. mitral, pulmonary semilunar, bicuspid, aortic semilunar","C. aortic semilunar, pulmonary semilunar, tricuspid, bicuspid","D. bicuspid, aortic semilunar, tricuspid, pulmonary semilunar"],"a":"A. tricuspid, pulmonary semilunar, bicuspid, aortic semilunar"},{"id":"s2-c19-rq5","ch":19,"section":"RQ","q":"Which chamber initially receives blood from the systemic circuit?","opts":["A. left atrium","B. left ventricle","C. right atrium","D. right ventricle"],"a":"C. right atrium"},{"id":"s2-c19-rq6","ch":19,"section":"RQ","q":"The ________ layer secretes chemicals that help to regulate ionic environments and strength of contraction and serve as powerful vasoconstrictors. 828     19 • Interactive Link Questions Access for free at openstax.org","opts":["A. pericardial sac","B. endocardium","C. myocardium","D. epicardium"],"a":"B. endocardium"},{"id":"s2-c19-rq7","ch":19,"section":"RQ","q":"The myocardium would be the thickest in the ________.","opts":["A. left atrium","B. left ventricle","C. right atrium","D. right ventricle"],"a":"B. left ventricle"},{"id":"s2-c19-rq8","ch":19,"section":"RQ","q":"In which septum is it normal to find openings in the adult?","opts":["A. interatrial septum","B. interventricular septum","C. atrioventricular septum","D. all of the above"],"a":"C. atrioventricular septum"},{"id":"s2-c19-rq9","ch":19,"section":"RQ","q":"Which of the following is unique to cardiac muscle cells?","opts":["A. Only cardiac muscle contains a sarcoplasmic reticulum.","B. Only cardiac muscle has gap junctions.","C. Only cardiac muscle is capable of autorhythmicity","D. Only cardiac muscle has a high concentration of mitochondria."],"a":"C. Only cardiac muscle is capable of autorhythmicity"},{"id":"s2-c19-rq10","ch":19,"section":"RQ","q":"The influx of which ion accounts for the plateau phase?","opts":["A. sodium","B. potassium","C. chloride","D. calcium"],"a":"D. calcium"},{"id":"s2-c19-rq11","ch":19,"section":"RQ","q":"Which portion of the ECG corresponds to repolarization of the atria?","opts":["A. P wave","B. QRS complex","C. T wave","D. none of the above: atrial repolarization is masked by ventricular depolarization"],"a":"D. none of the above: atrial repolarization is masked by ventricular depolarization"},{"id":"s2-c19-rq12","ch":19,"section":"RQ","q":"Which component of the heart conduction system would have the slowest rate of firing?","opts":["A. atrioventricular node","B. atrioventricular bundle","C. bundle branches","D. Purkinje fibers"],"a":"D. Purkinje fibers"},{"id":"s2-c19-rq13","ch":19,"section":"RQ","q":"The cardiac cycle consists of a distinct relaxation and contraction phase. Which term is typically used to refer ventricular contraction while no blood is being ejected?","opts":["A. systole","B. diastole","C. quiescent","D. isovolumic contraction"],"a":"D. isovolumic contraction"},{"id":"s2-c19-rq14","ch":19,"section":"RQ","q":"Most blood enters the ventricle during ________.","opts":["A. atrial systole","B. atrial diastole","C. ventricular systole","D. isovolumic contraction 19 • Review Questions     829"],"a":"B. atrial diastole"},{"id":"s2-c19-rq15","ch":19,"section":"RQ","q":"The first heart sound represents which portion of the cardiac cycle?","opts":["A. atrial systole","B. ventricular systole","C. closing of the atrioventricular valves","D. closing of the semilunar valves"],"a":"C. closing of the atrioventricular valves"},{"id":"s2-c19-rq16","ch":19,"section":"RQ","q":"Ventricular relaxation immediately follows ________.","opts":["A. atrial depolarization","B. ventricular repolarization","C. ventricular depolarization","D. atrial repolarization"],"a":"B. ventricular repolarization"},{"id":"s2-c19-rq17","ch":19,"section":"RQ","q":"The force the heart must overcome to pump blood is known as ________.","opts":["A. preload","B. afterload","C. cardiac output","D. stroke volume"],"a":"B. afterload"},{"id":"s2-c19-rq18","ch":19,"section":"RQ","q":"The cardiovascular centers are located in which area of the brain?","opts":["A. medulla oblongata","B. pons","C. mesencephalon (midbrain)","D. cerebrum"],"a":"A. medulla oblongata"},{"id":"s2-c19-rq19","ch":19,"section":"RQ","q":"In a healthy young adult, what happens to cardiac output when heart rate increases above 160 bpm?","opts":["A. It increases.","B. It decreases.","C. It remains constant.","D. There is no way to predict."],"a":"B. It decreases."},{"id":"s2-c19-rq20","ch":19,"section":"RQ","q":"What happens to preload when there is venous constriction in the veins?","opts":["A. It increases.","B. It decreases.","C. It remains constant.","D. There is no way to predict."],"a":"A. It increases."},{"id":"s2-c19-rq21","ch":19,"section":"RQ","q":"Which of the following is a positive inotrope?","opts":["A. Na+","B. K+","C. Ca2+","D. both Na+ and K+"],"a":"C. Ca2+"},{"id":"s2-c19-rq22","ch":19,"section":"RQ","q":"The earliest organ to form and begin function within the developing human is the ________.","opts":["A. brain","B. stomach","C. lungs","D. heart"],"a":"D. heart"},{"id":"s2-c19-rq23","ch":19,"section":"RQ","q":"Of the three germ layers that give rise to all adult tissues and organs, which gives rise to the heart?","opts":["A. ectoderm","B. endoderm","C. mesoderm","D. placenta 830     19 • Review Questions Access for free at openstax.org"],"a":"C. mesoderm"},{"id":"s2-c19-rq24","ch":19,"section":"RQ","q":"The two tubes that eventually fuse to form the heart are referred to as the ________.","opts":["A. primitive heart tubes","B. endocardial tubes","C. cardiogenic region","D. cardiogenic tubes"],"a":"D. cardiogenic tubes"},{"id":"s2-c19-rq25","ch":19,"section":"RQ","q":"Which primitive area of the heart will give rise to the right ventricle?","opts":["A. bulbus cordis","B. primitive ventricle","C. sinus venosus","D. truncus arteriosus"],"a":"A. bulbus cordis"},{"id":"s2-c19-rq26","ch":19,"section":"RQ","q":"The pulmonary trunk and aorta are derived from which primitive heart structure?","opts":["A. bulbus cordis","B. primitive ventricle","C. sinus venosus","D. truncus arteriosus"],"a":"D. truncus arteriosus"},{"id":"s2-c19-ct27","ch":19,"section":"CT","q":"Describe how the valves keep the blood moving in one direction.","a":"When the ventricles contract and pressure begins to rise in the ventricles, there is an initial tendency for blood to flow back (regurgitate) to the atria. However, the papillary muscles also contract, placing tension on the chordae tendineae and holding the atrioventricular valves (tricuspid and mitral) in place to prevent the valves from prolapsing and being forced back into the atria. The semilunar valves (pulmonary and aortic) lack chordae tendineae and papillary muscles, but do not face the same pressure gradients as do the atrioventricular valves. As the ventricles relax and pressure drops within the ventricles, there is a tendency for the blood to flow backward. However, the valves, consisting of reinforced endothelium and connective tissue, fill with blood and seal off the opening preventing the return of blood."},{"id":"s2-c19-ct28","ch":19,"section":"CT","q":"Why is the pressure in the pulmonary circulation lower than in the systemic circulation?","a":"The pulmonary circuit consists of blood flowing to and from the lungs, whereas the systemic circuit carries blood to and from the entire body. The systemic circuit is far more extensive, consisting of far more vessels and offers much greater resistance to the flow of blood, so the heart must generate a higher pressure to overcome this resistance. This can be seen in the thickness of the myocardium in the ventricles."},{"id":"s2-c19-ct29","ch":19,"section":"CT","q":"Why is the plateau phase so critical to cardiac muscle function?","a":"It prevents additional impulses from spreading through the heart prematurely, thereby allowing the muscle sufficient time to contract and pump blood effectively"},{"id":"s2-c19-ct30","ch":19,"section":"CT","q":"How does the delay of the impulse at the atrioventricular node contribute to cardiac function?","a":"It ensures sufficient time for the atrial muscle to contract and pump blood into the ventricles prior to the impulse being conducted into the lower chambers."},{"id":"s2-c19-ct31","ch":19,"section":"CT","q":"How do gap junctions and intercalated disks aid contraction of the heart?","a":"Gap junctions within the intercalated disks allow impulses to spread from one cardiac muscle cell to another, allowing sodium, potassium, and calcium ions to flow between adjacent cells, propagating the action potential, and ensuring coordinated contractions."},{"id":"s2-c19-ct32","ch":19,"section":"CT","q":"Why do the cardiac muscles cells demonstrate autorhythmicity?","a":"Without a true resting potential, there is a slow influx of sodium ions through slow channels that produces a prepotential that gradually reaches threshold."},{"id":"s2-c19-ct33","ch":19,"section":"CT","q":"Describe one cardiac cycle, beginning with both atria and ventricles relaxed.","a":"The cardiac cycle comprises a complete relaxation and contraction of both the atria and ventricles, and lasts approximately 0.8 seconds. Beginning with all chambers in diastole, blood flows passively from the veins into the atria and past the atrioventricular valves into the ventricles. The atria begin to contract following depolarization of the atria and pump blood into the ventricles. The ventricles begin to contract, raising pressure within the ventricles. When ventricular pressure rises above the pressure in the two major arteries, blood pushes open the two semilunar valves and moves into the pulmonary trunk and aorta in the ventricular ejection phase. Following ventricular repolarization, the ventricles begin to relax, and pressure within the ventricles drops. When the pressure falls below that of the atria, blood moves from the atria into the ventricles, opening the atrioventricular valves and marking one complete heart cycle."},{"id":"s2-c19-ct34","ch":19,"section":"CT","q":"Why does increasing EDV increase contractility?","a":"Increasing EDV increases the sarcomeres’ lengths within the cardiac muscle cells, allowing more cross bridge formation between the myosin and actin and providing for a more powerful contraction. This relationship is described in the Frank-Starling mechanism."},{"id":"s2-c19-ct35","ch":19,"section":"CT","q":"Why is afterload important to cardiac function?","a":"Afterload represents the resistance within the arteries to the flow of blood ejected from the ventricles. If uncompensated, if afterload increases, flow will decrease. In order for the heart to maintain adequate flow to overcome increasing afterload, it must pump more forcefully. This is one of the negative consequences of high blood pressure or hypertension."},{"id":"s2-c19-ct36","ch":19,"section":"CT","q":"Why is it so important for the human heart to develop early and begin functioning within the developing embryo?","a":"The human embryo is rapidly growing and has great demands for nutrients and oxygen, while producing waste products including carbon dioxide. All of these materials must be received from or delivered to the mother for processing. Without an efficient early circulatory system, this would be impossible."},{"id":"s2-c19-ct37","ch":19,"section":"CT","q":"Describe how the major pumping chambers, the ventricles, form within the developing heart.","a":"After fusion of the two endocardial tubes into the single primitive heart, five regions quickly become visible. From the head, these are the truncus arteriosus, bulbus cordis, primitive ventricle, primitive atrium, and sinus venosus. Contractions propel the blood from the sinus venosus to the truncus arteriosus. About day 23, the heart begins to form an S-shaped structure within the pericardium. The bulbus cordis develops into the right ventricle, whereas the primitive ventricle becomes the left ventricle. The interventricular septum separating these begins to form about day 28. The atrioventricular valves form between weeks five to eight. At this point, the heart ventricles resemble the adult structure. Anatomy &amp; Physiology Unit 4: Fluids and Transport"},{"id":"s2-c20-rq3","ch":20,"section":"RQ","q":"The endothelium is found in the ________.","opts":["A. tunica intima","B. tunica media","C. tunica externa","D. lumen"],"a":"A. tunica intima"},{"id":"s2-c20-rq4","ch":20,"section":"RQ","q":"Nervi vasorum control ________.","opts":["A. vasoconstriction","B. vasodilation","C. capillary permeability","D. both vasoconstriction and vasodilation"],"a":"D. both vasoconstriction and vasodilation"},{"id":"s2-c20-rq5","ch":20,"section":"RQ","q":"Closer to the heart, arteries would be expected to have a higher percentage of ________.","opts":["A. endothelium","B. smooth muscle fibers","C. elastic fibers","D. collagenous fibers"],"a":"C. elastic fibers"},{"id":"s2-c20-rq6","ch":20,"section":"RQ","q":"Which of the following best describes veins?","opts":["A. thick walled, small lumens, low pressure, lack valves","B. thin walled, large lumens, low pressure, have valves","C. thin walled, small lumens, high pressure, have valves","D. thick walled, large lumens, high pressure, lack valves"],"a":"B. thin walled, large lumens, low pressure, have valves"},{"id":"s2-c20-rq7","ch":20,"section":"RQ","q":"An especially leaky type of capillary found in the liver and certain other tissues is called a ________.","opts":["A. capillary bed","B. fenestrated capillary","C. sinusoid capillary","D. metarteriole"],"a":"C. sinusoid capillary"},{"id":"s2-c20-rq8","ch":20,"section":"RQ","q":"In a blood pressure measurement of 110/70, the number 70 is the ________.","opts":["A. systolic pressure","B. diastolic pressure 20 • Interactive Link Questions     913","C. pulse pressure","D. mean arterial pressure"],"a":"B. diastolic pressure 20 • Interactive Link Questions     913"},{"id":"s2-c20-rq9","ch":20,"section":"RQ","q":"A healthy elastic artery ________.","opts":["A. is compliant","B. reduces blood flow","C. is a resistance artery","D. has a thin wall and irregular lumen"],"a":"A. is compliant"},{"id":"s2-c20-rq15","ch":20,"section":"RQ","q":"Which of the following statements is true?","opts":["A. In one day, more fluid exits the capillary through filtration than enters through reabsorption.","B. In one day, approximately 35 mm of blood are filtered and 7 mm are reabsorbed.","C. In one day, the capillaries of the lymphatic system absorb about 20.4 liters of fluid.","D. None of the above are true."],"a":"A. In one day, more fluid exits the capillary through filtration than enters through reabsorption."},{"id":"s2-c20-rq11","ch":20,"section":"RQ","q":"Slight vasodilation in an arteriole prompts a ________.","opts":["A. slight increase in resistance","B. huge increase in resistance","C. slight decrease in resistance","D. huge decrease in resistance"],"a":"D. huge decrease in resistance"},{"id":"s2-c20-rq12","ch":20,"section":"RQ","q":"Venoconstriction increases which of the following?","opts":["A. blood pressure within the vein","B. blood flow within the vein","C. return of blood to the heart","D. all of the above"],"a":"D. all of the above"},{"id":"s2-c20-rq13","ch":20,"section":"RQ","q":"Hydrostatic pressure is ________.","opts":["A. greater than colloid osmotic pressure at the venous end of the capillary bed","B. the pressure exerted by fluid in an enclosed space","C. about zero at the midpoint of a capillary bed","D. all of the above"],"a":"B. the pressure exerted by fluid in an enclosed space"},{"id":"s2-c20-rq14","ch":20,"section":"RQ","q":"Net filtration pressure is calculated by ________.","opts":["A. adding the capillary hydrostatic pressure to the interstitial fluid hydrostatic pressure","B. subtracting the fluid drained by the lymphatic vessels from the total fluid in the interstitial fluid","C. adding the blood colloid osmotic pressure to the capillary hydrostatic pressure","D. subtracting the blood colloid osmotic pressure from the capillary hydrostatic pressure"],"a":"D. subtracting the blood colloid osmotic pressure from the capillary hydrostatic pressure"},{"id":"s2-c20-rq16","ch":20,"section":"RQ","q":"Clusters of neurons in the medulla oblongata that regulate blood pressure are known collectively as ________.","opts":["A. baroreceptors","B. angioreceptors","C. the cardiomotor mechanism","D. the cardiovascular center"],"a":"D. the cardiovascular center"},{"id":"s2-c20-rq17","ch":20,"section":"RQ","q":"In the renin-angiotensin-aldosterone mechanism, ________. 914     20 • Review Questions Access for free at openstax.org","opts":["A. decreased blood pressure prompts the release of renin from the liver","B. aldosterone prompts increased urine output","C. aldosterone prompts the kidneys to reabsorb sodium","D. all of the above"],"a":"C. aldosterone prompts the kidneys to reabsorb sodium"},{"id":"s2-c20-rq18","ch":20,"section":"RQ","q":"In the myogenic response, ________.","opts":["A. muscle contraction promotes venous return to the heart","B. ventricular contraction strength is decreased","C. vascular smooth muscle responds to stretch","D. endothelins dilate muscular arteries"],"a":"C. vascular smooth muscle responds to stretch"},{"id":"s2-c20-rq19","ch":20,"section":"RQ","q":"A form of circulatory shock common in young children with severe diarrhea or vomiting is ________.","opts":["A. hypovolemic shock","B. anaphylactic shock","C. obstructive shock","D. hemorrhagic shock"],"a":"A. hypovolemic shock"},{"id":"s2-c20-rq20","ch":20,"section":"RQ","q":"The coronary arteries branch off of the ________.","opts":["A. aortic valve","B. ascending aorta","C. aortic arch","D. thoracic aorta"],"a":"B. ascending aorta"},{"id":"s2-c20-rq22","ch":20,"section":"RQ","q":"Arteries serving the stomach, pancreas, and liver all branch from the ________.","opts":["A. superior mesenteric artery","B. inferior mesenteric artery","C. celiac trunk","D. splenic artery"],"a":"C. celiac trunk"},{"id":"s2-c20-rq23","ch":20,"section":"RQ","q":"The right and left brachiocephalic veins ________.","opts":["A. drain blood from the right and left internal jugular veins","B. drain blood from the right and left subclavian veins","C. drain into the superior vena cava","D. all of the above are true"],"a":"D. all of the above are true"},{"id":"s2-c20-rq24","ch":20,"section":"RQ","q":"The hepatic portal system delivers blood from the digestive organs to the ________.","opts":["A. liver","B. hypothalamus","C. spleen","D. left atrium"],"a":"A. liver"},{"id":"s2-c20-rq25","ch":20,"section":"RQ","q":"Blood islands are ________.","opts":["A. clusters of blood-filtering cells in the placenta","B. masses of pluripotent stem cells scattered throughout the fetal bone marrow","C. vascular tubes that give rise to the embryonic tubular heart","D. masses of developing blood vessels and formed elements scattered throughout the embryonic disc 20 • Review Questions     915"],"a":"D. masses of developing blood vessels and formed elements scattered throughout the embryonic disc 20 • Review Questions     915"},{"id":"s2-c20-rq27","ch":20,"section":"RQ","q":"The ductus venosus is a shunt that allows ________.","opts":["A. fetal blood to flow from the right atrium to the left atrium","B. fetal blood to flow from the right ventricle to the left ventricle","C. most freshly oxygenated blood to flow into the fetal heart","D. most oxygen-depleted fetal blood to flow directly into the fetal pulmonary trunk"],"a":"C. most freshly oxygenated blood to flow into the fetal heart"},{"id":"s2-c20-ct28","ch":20,"section":"CT","q":"Arterioles are often referred to as resistance vessels. Why?","a":"Arterioles have a relatively thick smooth-muscle tunica media around a small lumen, and their diameter changes dramatically with vasoconstriction/vasodilation. Because resistance rises steeply as radius falls, arterioles provide most of the resistance to blood flow and regulate its distribution and blood pressure."},{"id":"s2-c20-ct29","ch":20,"section":"CT","q":"Cocaine use causes vasoconstriction. Is this likely to increase or decrease blood pressure, and why?","a":"Increase. Vasoconstriction narrows the vessels, raising peripheral resistance; since blood pressure rises with resistance (BP ∝ cardiac output × resistance), the pressure goes up."},{"id":"s2-c20-ct30","ch":20,"section":"CT","q":"A blood vessel with a few smooth muscle fibers and connective tissue, and only a very thin tunica externa conducts blood toward the heart. What type of vessel is this?","a":"A vein (a small vein/venule) — thin tunica externa, few smooth-muscle fibers, and it carries blood toward the heart."},{"id":"s2-c20-ct31","ch":20,"section":"CT","q":"You measure a patient’s blood pressure at 130/85. Calculate the patient’s pulse pressure and mean arterial pressure. Determine whether each pressure is low, normal, or high.","a":"Pulse pressure = 130 − 85 = 45 mmHg (normal). MAP = diastolic + 1/3(pulse pressure) = 85 + 15 = 100 mmHg (normal/upper-normal). Systolic 130 is normal-to-slightly-elevated."},{"id":"s2-c20-ct32","ch":20,"section":"CT","q":"An obese patient comes to the clinic complaining of swollen feet and ankles, fatigue, shortness of breath, and often feeling “spaced out.” She is a cashier in a grocery store, a job that requires her to stand all day. Outside of work, she engages in no physical activity. She confesses that, because of her weight, she finds even walking uncomfortable. Explain how the skeletal muscle pump might play a role in this patient’s signs and symptoms.","a":"Standing still all day with no muscle activity means the skeletal-muscle pump isn’t squeezing the leg veins to return blood upward. Blood pools in the legs, raising capillary hydrostatic pressure so fluid leaks into the tissues (swollen feet/ankles). Poor venous return also lowers cardiac output and brain/tissue perfusion, causing fatigue, shortness of breath, and feeling ‘spaced out.’"},{"id":"s2-c20-ct33","ch":20,"section":"CT","q":"A patient arrives at the emergency department with dangerously low blood pressure. The patient’s blood colloid osmotic pressure is normal. How would you expect this situation to affect the patient’s net filtration pressure?","a":"Low blood pressure means low capillary hydrostatic pressure. With colloid osmotic pressure normal (pulling fluid in) but the outward hydrostatic push reduced, net filtration pressure falls — less filtration and relatively more reabsorption."},{"id":"s2-c20-ct34","ch":20,"section":"CT","q":"True or false? The plasma proteins suspended in blood cross the capillary cell membrane and enter the tissue fluid via facilitated diffusion. Explain your thinking.","a":"False. Plasma proteins are too large to cross the capillary wall; they stay in the blood and create the blood colloid osmotic pressure. They are not moved into tissue fluid by facilitated diffusion (which handles small solutes via carriers)."},{"id":"s2-c20-ct35","ch":20,"section":"CT","q":"A patient arrives in the emergency department with a blood pressure of 70/45 confused and complaining of thirst. Why?","a":"70/45 is dangerously low (hypovolemia/shock). Too little blood reaches the brain, causing confusion; the body senses the low volume/pressure and triggers thirst (via the hypothalamus/RAAS) to restore fluid volume."},{"id":"s2-c20-ct36","ch":20,"section":"CT","q":"Nitric oxide is broken down very quickly after its release. Why?","a":"Nitric oxide is a small, highly reactive free-radical gas that reacts rapidly (with oxygen/hemoglobin) and diffuses away, so it lasts only seconds. This short life allows precise, local, moment-to-moment control of vasodilation."},{"id":"s2-c20-ct37","ch":20,"section":"CT","q":"Identify the ventricle of the heart that pumps oxygen depleted blood and the arteries of the body that carry oxygen-depleted blood.","a":"The RIGHT ventricle pumps oxygen-depleted blood (to the lungs). The pulmonary arteries (pulmonary trunk and branches) carry oxygen-depleted blood — the only systemic exception being the umbilical arteries in the fetus."},{"id":"s2-c20-ct38","ch":20,"section":"CT","q":"What organs do the gonadal veins drain?","a":"The gonadal veins drain the gonads — the ovaries in females and the testes in males."},{"id":"s2-c20-ct39","ch":20,"section":"CT","q":"What arteries play the leading roles in supplying blood to the brain?","a":"The internal carotid arteries and the vertebral arteries (which together form the cerebral arterial circle / circle of Willis)."},{"id":"s2-c20-ct40","ch":20,"section":"CT","q":"All tissues, including malignant tumors, need a blood supply. Explain why drugs called angiogenesis inhibitors would be used in cancer treatment.","a":"Tumors need new blood vessels (angiogenesis) to grow beyond a tiny size and get oxygen and nutrients. Angiogenesis inhibitors block new vessel formation, starving the tumor and limiting its growth and spread."},{"id":"s2-c20-ct41","ch":20,"section":"CT","q":"Explain the location and importance of the ductus arteriosus in fetal circulation.","a":"Anatomy &amp; Physiology Unit 4: Fluids and Transport"},{"id":"s2-step-b1","ch":18,"section":"Step","q":"An individual who is blood type AB negative can ________.","opts":["A. receive any blood type in moderate amounts except that with the Rh antigen","B. donate to all blood types in moderate amounts","C. receive types A, B, and AB, but not type O","D. donate to types A, B, and AB, but not to type O"],"a":"A. receive any blood type in moderate amounts except that with the Rh antigen"},{"id":"s2-step-b2","ch":18,"section":"Step","q":"Blood reticulocyte counts provide information regarding ________.","opts":["A. rate of erythrocyte formation","B. rate of platelet formation","C. clotting ability of the blood","D. WBC ability to defend the body against disease"],"a":"A. rate of erythrocyte formation"},{"id":"s2-step-b4","ch":18,"section":"Step","q":"Lucas's blood was determined to be AB positive. What does this mean?","opts":["A. There are no antibodies to A, to B, or to Rh antigens in the plasma.","B. Antibodies to A and B are present in the red cells.","C. His blood lacks Rh factor.","D. He can only receive blood from a donor who is AB positive."],"a":"A. There are no antibodies to A, to B, or to Rh antigens in the plasma."},{"id":"s2-step-b5","ch":18,"section":"Step","q":"No visible cytoplasmic granules are present in ________.","opts":["A. monocytes","B. basophils","C. eosinophils","D. neutrophils"],"a":"A. monocytes"},{"id":"s2-step-b6","ch":18,"section":"Step","q":"Platelets ________.","opts":["A. stick to the damaged area of a blood vessel and help seal the break","B. have a life span of about 120 days","C. are the precursors of leukocytes","D. have multiple nuclei"],"a":"A. stick to the damaged area of a blood vessel and help seal the break"},{"id":"s2-step-b7","ch":18,"section":"Step","q":"What type of cell makes up almost half the volume of blood?","opts":["A. erythrocyte","B. leukocyte","C. platelet","D. monocyte"],"a":"A. erythrocyte"},{"id":"s2-step-b8","ch":18,"section":"Step","q":"Which blood type is generally called the universal donor?","opts":["A. A","B. B","C. AB","D. O"],"a":"D. O"},{"id":"s2-step-b9","ch":18,"section":"Step","q":"Which of the following is true about blood plasma?","opts":["A. It is the same as serum but without the clotting proteins.","B. The main protein component is hemoglobin.","C. It is about 90% water.","D. It contains about 20 dissolved components."],"a":"C. It is about 90% water."},{"id":"s2-step-b11","ch":18,"section":"Step","q":"Identify blood component A in this blood slide.","opts":["A. platelets","B. erythrocytes","C. monocyte","D. neutrophils"],"a":"A. platelets","img":"images/step/m2_blood_img01.png"},{"id":"s2-step-b12","ch":18,"section":"Step","q":"Identify this blood cell type model.","opts":["A. Erythrocyte","B. Platelet","C. Neutrophil","D. Eosinophil"],"a":"A. Erythrocyte","img":"images/step/m2_blood_img02.png"},{"id":"s2-step-b13","ch":18,"section":"Step","q":"Identify this blood cell type model.","opts":["A. Monocyte","B. Eosinophil","C. Neutrophil","D. erythrocyte"],"a":"A. Monocyte","img":"images/step/m2_blood_img03.png"},{"id":"s2-step-b14","ch":18,"section":"Step","q":"Normal blood has _____% formed elements namely red blood cells, white blood cells, and platelets.","opts":["A. 55","B. 45","C. 35","D. 65"],"a":"B. 45"},{"id":"s2-step-b15","ch":18,"section":"Step","q":"Plasma is the liquid portion of blood and is about ________ % of normal blood.","opts":["A. 55","B. 45","C. 35","D. 65"],"a":"A. 55"},{"id":"s2-step-b16","ch":18,"section":"Step","q":"The most abundant plasma protein is __________.","opts":["A. albumin","B. globulin","C. fibrinogen","D. pepsin"],"a":"A. albumin"},{"id":"s2-step-b17","ch":18,"section":"Step","q":"A hemoglobin molecule contains","opts":["A. three protein chains, four heme groups, and two iron ions.","B. two protein chains, two heme groups, and four iron ions.","C. four protein chains, two heme groups, and two iron ions.","D. four protein chains, four heme groups, and four iron ions.","E. four protein chains, six heme groups, and two iron ions."],"a":"D. four protein chains, four heme groups, and four iron ions."},{"id":"s2-step-b18","ch":18,"section":"Step","q":"Formation of red blood cells is called","opts":["A. thrombopoiesis.","B. leukocytosis.","C. leukopoiesis.","D. erythropoiesis.","E. erythrocytosis."],"a":"D. erythropoiesis."},{"id":"s2-step-b19","ch":18,"section":"Step","q":"The function of hemoglobin is to","opts":["A. bind and transport oxygen and carbon dioxide.","B. protect the body against pathogens.","C. aid in the process of blood clotting.","D. carry nutrients from the intestine to the body's cells.","E. absorb and neutralize the acids generated by active tissues."],"a":"A. bind and transport oxygen and carbon dioxide."},{"id":"s2-step-b20","ch":18,"section":"Step","q":"________ are the most abundant cell population of the formed elements of blood.","opts":["A. Erythrocytes","B. Platelets","C. Neutrophils","D. Lymphocytes","E. Monocytes"],"a":"A. Erythrocytes"},{"id":"s2-step-b21","ch":18,"section":"Step","q":"During their formation RBCs","opts":["A. flatten.","B. multiply their mitochondria.","C. eject their nucleus.","D. are saturated with oxygen.","E. recycle hemoglobin into iron and pigment molecules."],"a":"C. eject their nucleus."},{"id":"s2-step-b22","ch":18,"section":"Step","q":"Red blood cells result from the divisions of cells called","opts":["A. hemocytoblasts.","B. lymphoblasts.","C. monoblasts.","D. myeloblasts.","E. progenitor cells."],"a":"A. hemocytoblasts."},{"id":"s2-step-b23","ch":18,"section":"Step","q":"________ is a condition in which the oxygen-carrying capacity of RBCs is reduced.","opts":["A. Erythropoiesis","B. Lymphopoiesis","C. Anemia","D. Leukopenia","E. Leukemia"],"a":"C. Anemia"},{"id":"s2-step-b24","ch":18,"section":"Step","q":"________ is released in response to a decrease in blood volume.","opts":["A. Renin","B. Erythropoietin","C. ADH","D. ACTH","E. Angiotensin"],"a":"C. ADH"},{"id":"s2-step-b25","ch":18,"section":"Step","q":"Which organ synthesizes more than 90 percent of plasma proteins?","opts":["A. kidney","B. spleen","C. liver","D. bone marrow","E. thymus"],"a":"C. liver"},{"id":"s2-step-b28","ch":18,"section":"Step","q":"Identify blood component B in this blood slide.","opts":["A. platelets","B. erythrocytes","C. monocyte","D. neutrophils"],"a":"B. erythrocytes","img":"images/step/m2_blood_img04.png"},{"id":"s2-step-b29","ch":18,"section":"Step","q":"Identify blood component C in this blood slide.","opts":["A. platelets","B. erythrocytes","C. monocyte","D. neutrophils"],"a":"C. monocyte","img":"images/step/m2_blood_img05.png"},{"id":"s2-step-b30","ch":18,"section":"Step","q":"Identify this blood cell type model.","opts":["A. Basophil","B. Eosinophil","C. Neutrophil","D. monocyte"],"a":"C. Neutrophil","img":"images/step/m2_blood_img06.png"},{"id":"s2-step-b31","ch":18,"section":"Step","q":"Identify this blood cell type model.","opts":["A. Monocyte","B. Eosinophil","C. Neutrophil","D. erythrocyte"],"a":"A. Monocyte","img":"images/step/m2_blood_img07.png"},{"id":"s2-step-b32","ch":18,"section":"Step","q":"Which of the following is not a functional characteristic of WBCs?","opts":["A. granulosis","B. diapedesis","C. ameboid motion","D. positive chemotaxis"],"a":"A. granulosis"},{"id":"s2-step-b33","ch":18,"section":"Step","q":"Which of the choices below is the parent cell for all formed elements of blood?","opts":["A. megakaryocyte","B. normoblast","C. hemocytoblast","D. polymorphonuclear cell"],"a":"C. hemocytoblast"},{"id":"s2-step-b35","ch":18,"section":"Step","q":"Which of the following is not a distribution function of blood?","opts":["A. delivery of oxygen to body cells","B. transport of metabolic wastes from cells","C. transport of hormones to their target organs","D. transport of salts to maintain blood volume"],"a":"D. transport of salts to maintain blood volume"},{"id":"s2-step-b38","ch":18,"section":"Step","q":"Select the incorrect statement regarding blood cell formation.","opts":["A. Erythrocytes are formed from normoblasts.","B. Eosinophils are formed from myeloblasts,","C. Lymphocytes are formed from lymphoblasts.","D. Platelets are formed from myeloblasts."],"a":"D. Platelets are formed from myeloblasts."},{"id":"s2-step-b39","ch":18,"section":"Step","q":"Blood volume restorers include all of the following except ________.","opts":["A. dextran","B. albumin","C. packed cells","D. saline solutions"],"a":"C. packed cells"},{"id":"s2-step-b40","ch":18,"section":"Step","q":"David has a hemoglobin measurement of 16 g/100 ml blood. This is ________.","opts":["A. above normal","B. normal only if James is an infant","C. abnormally low","D. within the normal range"],"a":"D. within the normal range"},{"id":"s2-step-b42","ch":18,"section":"Step","q":"Which of the following is not a phase of hemostasis?","opts":["A. vascular spasm","B. fibrinolysis","C. platelet plug formation","D. coagulation"],"a":"B. fibrinolysis"},{"id":"s2-step-b43","ch":18,"section":"Step","q":"Which of the following is not a structural characteristic that contributes to erythrocyte gas transport functions?","opts":["A. biconcave shape","B. hemoglobin containing-sack","C. produces energy anaerobically","D. mitotically active"],"a":"D. mitotically active"},{"id":"s2-step-b44","ch":18,"section":"Step","q":"Thromboembolic disorders ________.","opts":["A. result in uncontrolled bleeding","B. include thrombus formation, a clot in a broken blood vessel","C. include embolus formation, a clot moving within the circulatory system","D. are caused by vitamin K deficiency"],"a":"C. include embolus formation, a clot moving within the circulatory system"},{"id":"s2-step-b45","ch":18,"section":"Step","q":"Which of the following is not a cause of bleeding disorders?","opts":["A. thrombocytopenia, a condition of decreased circulating platelets","B. excess secretion of platelet-derived growth factor (PDGF)","C. a defect in the clotting cascade","D. vitamin K deficiency"],"a":"B. excess secretion of platelet-derived growth factor (PDGF)"},{"id":"s2-step-b46","ch":18,"section":"Step","q":"Which of the following is characteristic of all leukocytes?","opts":["A. They are nucleated.","B. They have cytoplasmic granules.","C. They are phagocytic.","D. They are the most numerous of the formed elements in blood."],"a":"A. They are nucleated."},{"id":"s2-step-b50","ch":18,"section":"Step","q":"Which of the following would not be a possible cause of sickling of red blood cells in someone with sickle-cell anemia?","opts":["A. travel at high altitude","B. vigorous exercise","C. malaria and travel at high altitude","D. sleeping in a well-ventilated room"],"a":"D. sleeping in a well-ventilated room"},{"id":"s2-step-b51","ch":18,"section":"Step","q":"All of the following conditions impair coagulation except ________.","opts":["A. vascular spasm","B. vitamin K deficiency","C. severe hypocalcemia","D. liver disease"],"a":"A. vascular spasm"},{"id":"s2-step-b52","ch":18,"section":"Step","q":"What organ in the body regulates erythrocyte production?","opts":["A. kidney","B. brain","C. liver","D. pancreas"],"a":"A. kidney"},{"id":"s2-step-b53","ch":18,"section":"Step","q":"Which organ is the major regulator of erythropoiesis by secreting erythropoietin in response to hypoxia?","opts":["A. Kidneys","B. Spleen","C. Brain","D. Liver"],"a":"A. Kidneys"},{"id":"s2-step-b54","ch":18,"section":"Step","q":"What is diapedesis?","opts":["A. Binding of antibodies to antigens","B. Movement of platelets to a wound","C. Missile migration of erythrocytes","D. The movement of leukocytes through intact capillary walls into tissue"],"a":"D. The movement of leukocytes through intact capillary walls into tissue"},{"id":"s2-step-b55","ch":18,"section":"Step","q":"Which formed element is the most abundant cell type in blood?","opts":["A. Platelets","B. Erythrocytes","C. Leukocytes","D. Plasma cells"],"a":"B. Erythrocytes"},{"id":"s2-step-b56","ch":18,"section":"Step","q":"Which component of blood primarily functions in gas transport, particularly oxygen and carbon dioxide?","opts":["A. Erythrocytes (red blood cells)","B. Leukocytes (white blood cells)","C. Plasma","D. Platelets"],"a":"A. Erythrocytes (red blood cells)"},{"id":"s2-step-b57","ch":18,"section":"Step","q":"What is the normal reference range for adult blood volume as a percentage of body weight in liters?","opts":["A. About 15% (9 L)","B. About 20% (14 L)","C. About 7% of body weight (roughly 5 L in an average adult)","D. About 1% (0.5 L)"],"a":"C. About 7% of body weight (roughly 5 L in an average adult)"},{"id":"s2-step-b58","ch":18,"section":"Step","q":"Which statement best describes the purpose of blood tests in clinical practice?","opts":["A. To assess only electrolyte balance without regard to other systems","B. To assess oxygen delivery, waste removal, and organ system functioning","C. To measure only blood pressure indirectly","D. To replace diagnostic imaging entirely"],"a":"B. To assess oxygen delivery, waste removal, and organ system functioning"},{"id":"s2-step-b59","ch":18,"section":"Step","q":"What laboratory value is most indicative of anemia?","opts":["A. Low hematocrit (packed cell volume)","B. High hematocrit","C. Low total plasma protein","D. Elevated platelet count"],"a":"A. Low hematocrit (packed cell volume)"},{"id":"s2-step-b60","ch":18,"section":"Step","q":"Which leukocyte would be most elevated during a bacterial infection?","opts":["A. Lymphocyte","B. Neutrophil","C. Eosinophil","D. Basophil"],"a":"B. Neutrophil"},{"id":"s2-step-b61","ch":18,"section":"Step","q":"Which protein on red blood cells determines blood type compatibility?","opts":["A. A/B antigens (in addition to Rh antigen in some systems)","B. Hemoglobin","C. Albumin","D. Fibrinogen"],"a":"A. A/B antigens (in addition to Rh antigen in some systems)"},{"id":"s2-step-b62","ch":18,"section":"Step","q":"Which condition is characterized by a reduced oxygen-carrying capacity of blood due to abnormal hemoglobin?","opts":["A. Thrombocytopenia","B. Polycythemia","C. Leukocytosis","D. Sickle cell disease or anemia"],"a":"D. Sickle cell disease or anemia"},{"id":"s2-step-b63","ch":18,"section":"Step","q":"Which choice best describes hematocrit?","opts":["A. Percentage of plasma in blood","B. Number of white blood cells per microliter","C. Rate of erythropoietin production","D. Percentage of blood volume occupied by red blood cells"],"a":"D. Percentage of blood volume occupied by red blood cells"},{"id":"s2-step-b64","ch":18,"section":"Step","q":"Which component of blood is most affected by dehydration, leading to a relative increase in hematocrit?","opts":["A. Platelet function increases dramatically","B. Plasma volume decrease with preserved formed elements","C. Leukocyte count decreases","D. Erythrocyte count increases due to production"],"a":"B. Plasma volume decrease with preserved formed elements"},{"id":"s2-step-b65","ch":18,"section":"Step","q":"Which blood component can migrate out of capillaries into tissues in response to inflammatory signals?","opts":["A. Platelets","B. Leukocytes (white blood cells)","C. Plasma proteins","D. Erythrocytes"],"a":"B. Leukocytes (white blood cells)"},{"id":"s2-step-b66","ch":18,"section":"Step","q":"Which vessel type is primarily responsible for exchange of gases and nutrients with tissues?","opts":["A. Arterioles","B. Veins","C. Arteries","D. Capillaries"],"a":"D. Capillaries"},{"id":"s2-step-b67","ch":18,"section":"Step","q":"What is the primary site of hematopoiesis in an adult?","opts":["A. Spleen","B. Yellow marrow","C. Liver","D. Red bone marrow"],"a":"D. Red bone marrow"},{"id":"s2-step-b68","ch":18,"section":"Step","q":"Which component of blood is primarily responsible for clot formation?","opts":["A. Platelets","B. Leukocytes","C. Erythrocytes","D. Plasma"],"a":"A. Platelets"},{"id":"s2-step-b69","ch":18,"section":"Step","q":"Which plasma component is primarily responsible for blood’s viscosity and color, as well as buffering capacity?","opts":["A. Plasma proteins and water content","B. Electrolytes only","C. Hormones only","D. Nucleic acids"],"a":"A. Plasma proteins and water content"},{"id":"s2-step-b70","ch":18,"section":"Step","q":"Which enzyme initiates the coagulation cascade by converting fibrinogen to fibrin?","opts":["A. Thrombin","B. Plasmin","C. Changease","D. Kallikrein"],"a":"A. Thrombin"},{"id":"s2-step-b71","ch":18,"section":"Step","q":"Which blood type is universally accepted by recipients, though it may cause hemolysis if antibodies are present?","opts":["A. AB positive","B. B positive","C. O negative (universal donor)","D. A negative"],"a":"C. O negative (universal donor)"},{"id":"s2-step-b72","ch":18,"section":"Step","q":"Which plasma protein is essential for maintaining osmotic pressure and is produced mainly by the liver?","opts":["A. Albumin","B. Globulins","C. Fibrinogen","D. Immunoglobulins"],"a":"A. Albumin"},{"id":"s2-step-b73","ch":18,"section":"Step","q":"Identify the blood type of this patient:","opts":["A. A-","B. Correct: A+","C. B+","D. O+","E. B-","F. O- Option G AB+"],"a":"B. Correct: A+","img":"images/step/m2_blood_img08.png"},{"id":"s2-step-b74","ch":18,"section":"Step","q":"Identify the blood type of this patient:","opts":["A. A-","B. A+","C. B+","D. O+","E. B-","F. Correct: O- Option G AB+"],"a":"F. Correct: O- Option G AB+","img":"images/step/m2_blood_img09.png"},{"id":"s2-step-h1","ch":19,"section":"Step","q":"Compared to skeletal muscle, cardiac muscle ________.","opts":["A. has gap junctions that allow it to act as a functional syncytium","B. lacks striations","C. has more nuclei per cell","D. cells are larger than skeletal muscle cells"],"a":"A. has gap junctions that allow it to act as a functional syncytium"},{"id":"s2-step-h2","ch":19,"section":"Step","q":"Identify the correct sequence of blood flow through the chambers of the heart.","opts":["A. Right ventricle, left ventricle, left atrium, lungs, right atrium","B. Left atrium, left ventricle, right ventricle, right atrium, and lungs","C. Right atrium, right ventricle, lungs, left atrium, left ventricle"],"a":"C. Right atrium, right ventricle, lungs, left atrium, left ventricle"},{"id":"s2-step-h3","ch":19,"section":"Step","q":"The endocardium is composed of","opts":["A. simple cuboidal epithelium.","B. simple squamous epithelium.","C. cardiac muscle cells.","D. simple columnar epithelium."],"a":"B. simple squamous epithelium."},{"id":"s2-step-h5","ch":19,"section":"Step","q":"The heart is surrounded by the","opts":["A. pleural cavity.","B. peritoneal cavity.","C. cardiac skeleton.","D. pericardial cavity."],"a":"D. pericardial cavity."},{"id":"s2-step-h6","ch":19,"section":"Step","q":"The left ventricular wall of the heart is thicker than the right wall in order to ________.","opts":["A. accommodate a greater volume of blood","B. expand the thoracic cage during diastole","C. pump blood with greater pressure","D. pump blood through a smaller valve"],"a":"C. pump blood with greater pressure"},{"id":"s2-step-h7","ch":19,"section":"Step","q":"The right atrium receives blood from the systemic circuit and pumps it to the","opts":["A. aorta.","B. left atrium.","C. right ventricle.","D. pulmonary trunk."],"a":"C. right ventricle."},{"id":"s2-step-h8","ch":19,"section":"Step","q":"The tricuspid valve is located","opts":["A. in the opening of the aorta.","B. in the opening of the pulmonary trunk.","C. where the vena cavae join the right atrium.","D. between the right atrium and right ventricle."],"a":"D. between the right atrium and right ventricle."},{"id":"s2-step-h10","ch":19,"section":"Step","q":"The wall between the atria is called the","opts":["A. ventricle.","B. coronary sulcus.","C. auricle.","D. interatrial septum."],"a":"D. interatrial septum."},{"id":"s2-step-h11","ch":19,"section":"Step","q":"Abnormal patterns of cardiac activity are known as","opts":["A. automaticity.","B. ischemias.","C. defibrillations.","D. arrhythmias.","E. contractility."],"a":"D. arrhythmias."},{"id":"s2-step-h12","ch":19,"section":"Step","q":"As blood travels from the aorta toward the capillaries,","opts":["A. cardiovascular pressure decreases.","B. vascular resistance decreases.","C. vascular flow increases.","D. viscosity decreases.","E. both cardiovascular pressure and vascular flow increase."],"a":"A. cardiovascular pressure decreases."},{"id":"s2-step-h13","ch":19,"section":"Step","q":"As blood travels through the venous system toward the heart, why do the veins become larger in diameter?","opts":["A. The transition causes the resistance to increase further so that the flow rate of blood increases.","B. The transition causes the resistance to decrease further so that the flow rate of blood increases.","C. The transition causes the resistance to decrease further so that the flow rate of blood decreases.","D. The transition causes the resistance to increase further so that the flow rate of blood decreases.","E. The transition reflects no change in the resistance, but causes the flow rate of blood to increase."],"a":"B. The transition causes the resistance to decrease further so that the flow rate of blood increases."},{"id":"s2-step-h14","ch":19,"section":"Step","q":"Atrioventricular valves prevent backflow into the","opts":["A. ventricles.","B. atria.","C. venae cavae.","D. aorta.","E. pulmonary trunk."],"a":"B. atria."},{"id":"s2-step-h15","ch":19,"section":"Step","q":"Blood flowing from the left atrium to the left ventricle flows through the ________ valve.","opts":["A. aortic","B. tricuspid","C. pulmonary","D. bicuspid","E. papillary"],"a":"D. bicuspid"},{"id":"s2-step-h16","ch":19,"section":"Step","q":"Relaxation of the heart chambers is called","opts":["A. diastole.","B. systole.","C. depolarization.","D. hyperpolarization.","E. repolarization."],"a":"A. diastole."},{"id":"s2-step-h17","ch":19,"section":"Step","q":"The QRS complex on an ECG tracing represents","opts":["A. atrial depolarization.","B. atrial repolarization.","C. ventricular depolarization.","D. ventricular repolarization.","E. ventricular contraction."],"a":"C. ventricular depolarization."},{"id":"s2-step-h18","ch":19,"section":"Step","q":"The cardiac pacemaker cells are located in which of the following?","opts":["A. Purkinje fibers","B. SA node","C. AV node","D. bundle branches","E. bundle of His"],"a":"B. SA node"},{"id":"s2-step-h19","ch":19,"section":"Step","q":"The function of the cardiac skeleton is to","opts":["A. convey blood away from the heart.","B. supply blood to the muscle tissue of the heart.","C. reduce friction between the opposing surfaces of the pericardial sac.","D. stabilize the position of the heart valves.","E. provide for the movement of ions and small molecules."],"a":"D. stabilize the position of the heart valves."},{"id":"s2-step-h20","ch":19,"section":"Step","q":"EPO is released when","opts":["A. oxygen levels in the blood increase.","B. oxygen levels in the blood decrease.","C. carbon dioxide levels in the blood increase.","D. carbon dioxide levels in the blood decrease.","E. protein levels in the blood increase."],"a":"B. oxygen levels in the blood decrease."},{"id":"s2-step-h21","ch":19,"section":"Step","q":"Identify structure U in this heart diagram.","opts":["A. right pulmonary veins.","B. pulmonary trunk.","C. right pulmonary arteries.","D. superior vena cava."],"a":"D. superior vena cava.","img":"images/step/m2_heart_img01.jpeg"},{"id":"s2-step-h22","ch":19,"section":"Step","q":"Label L represents the","opts":["A. aortic arch.","B. pulmonary trunk.","C. superior vena cava.","D. inferior vena cava."],"a":"D. inferior vena cava.","img":"images/step/m2_heart_img02.jpeg"},{"id":"s2-step-h23","ch":19,"section":"Step","q":"Label O represents the ___________. These are the strong, fibrous connections between the valve leaflets and the papillary muscles .","opts":["A. trabeculae carneae.","B. chordae tendineae.","C. auricle."],"a":"B. chordae tendineae.","img":"images/step/m2_heart_img03.jpeg"},{"id":"s2-step-h24","ch":19,"section":"Step","q":"Label Q represents the","opts":["A. right atrium.","B. left atrium.","C. right ventricle.","D. left ventricle."],"a":"A. right atrium.","img":"images/step/m2_heart_img04.jpeg"},{"id":"s2-step-h25","ch":19,"section":"Step","q":"Identify heart valve labelled A in this diagram.","opts":["A. Tricuspid valve","B. Bicuspid or mitral valve","C. Pulmonary valve","D. Aortic valve"],"a":"A. Tricuspid valve","img":"images/step/m2_heart_img05.png"},{"id":"s2-step-h26","ch":19,"section":"Step","q":"Identify heart valve labelled B in this diagram.","opts":["A. Tricuspid valve","B. Bicuspid or mitral valve","C. Pulmonary valve","D. Aortic valve"],"a":"B. Bicuspid or mitral valve","img":"images/step/m2_heart_img06.png"},{"id":"s2-step-h27","ch":19,"section":"Step","q":"Identify heart valve labelled C in this diagram.","opts":["A. Tricuspid valve","B. Bicuspid or mitral valve","C. Pulmonary valve","D. Aortic valve"],"a":"D. Aortic valve","img":"images/step/m2_heart_img07.png"},{"id":"s2-step-h28","ch":19,"section":"Step","q":"Identify heart valve labelled D in this diagram.","opts":["A. Tricuspid valve","B. Bicuspid or mitral valve","C. Pulmonary valve","D. Aortic valve"],"a":"C. Pulmonary valve","img":"images/step/m2_heart_img08.png"},{"id":"s2-step-h29","ch":19,"section":"Step","q":"Identify this microscope slide:","opts":["A. heart muscle tissue","B. blood smear","C. artery wall cross section","D. vein wall cross section"],"a":"A. heart muscle tissue","img":"images/step/m2_heart_img09.jpeg"},{"id":"s2-step-h30","ch":19,"section":"Step","q":"Which of the following structures is responsible for the electrical and mechanical connection between cardiac muscle cells?","opts":["A. Sarcomeres","B. Intercalated Discs","C. Z lines","D. M Lines"],"a":"B. Intercalated Discs","img":"images/step/m2_heart_img10.jpeg"},{"id":"s2-step-v5","ch":20,"section":"Step","q":"Identify A in this diagram.","opts":["A. Tunica intima","B. Tunica media","C. Tunica externa","D. Tunica lumina"],"a":"A. Tunica intima","img":"images/step/m2_vessels_img01.png"},{"id":"s2-step-v6","ch":20,"section":"Step","q":"Identify C in this diagram.","opts":["A. Tunica intima","B. Tunica media","C. Tunica externa","D. Tunica lumina"],"a":"C. Tunica externa","img":"images/step/m2_vessels_img02.png"},{"id":"s2-step-v13","ch":20,"section":"Step","q":"The muscular layer of blood vessels is the","opts":["A. tunica intima.","B. tunica externa.","C. tunica media.","D. tunica adventitia."],"a":"C. tunica media."},{"id":"s2-step-v14","ch":20,"section":"Step","q":"Thick-walled vessels, which are large and extremely resilient, are called ________ arteries.","opts":["A. coronary","B. pulmonary","C. elastic","D. muscular"],"a":"C. elastic"},{"id":"s2-step-v16","ch":20,"section":"Step","q":"Label B represents the","opts":["A. ascending aorta.","B. right pulmonary arteries.","C. right pulmonary veins.","D. superior vena cava."],"a":"D. superior vena cava.","img":"images/step/m2_vessels_img05.png"},{"id":"s2-step-v17","ch":20,"section":"Step","q":"What does label A represent?","opts":["A. Aorta","B. alveolar capillary","C. inferior vena cava","D. brachial artery"],"a":"A. Aorta","img":"images/step/m2_vessels_img06.png"},{"id":"s2-step-v18","ch":20,"section":"Step","q":"What does label E represent?","opts":["A. inferior vena cava","B. alveolar capillary","C. superior vena cava","D. descending aorta"],"a":"A. inferior vena cava","img":"images/step/m2_vessels_img07.png"},{"id":"s2-step-v20","ch":20,"section":"Step","q":"Blood reaches the brain by two routes: through the ________ and the ________ arteries.","opts":["A. internal; external carotid","B. internal carotid; vertebral","C. external carotid; vertebral","D. posterior; anterior cerebral","E. anterior; posterior communicating"],"a":"B. internal carotid; vertebral"},{"id":"s2-step-v21","ch":20,"section":"Step","q":"Blood returning directly from the systemic circulation enters the","opts":["A. right atrium.","B. right ventricle.","C. left atrium.","D. left ventricle.","E. pulmonary trunk."],"a":"A. right atrium."},{"id":"s2-step-v22","ch":20,"section":"Step","q":"Choose the correct description of a typical medium-sized vein.","opts":["A. In these vessels, the thin tunica media is surrounded by a thick tunica externa composed of mostly collagen fibers.","B. Ranging from 2 mm to 9 mm in diameter, its thin tunica media consists of one to two layers of smooth muscle cells.","C. It has a diameter of approximately 0.4 cm and has more smooth muscle cells and fewer elastic fibers.","D. It ranges from 2 mm to 9 mm in diameter, and the relatively thick tunica externa has longitudinal bundles of elastic and collagen fibers.","E. It has a diameter up to 2.5 cm, and its tunica media is dominated by elastic fibers rather than smooth muscle cells."],"a":"D. It ranges from 2 mm to 9 mm in diameter, and the relatively thick tunica externa has longitudinal bundles of elastic and collagen fibers."},{"id":"s2-step-v23","ch":20,"section":"Step","q":"Identify the correct match between the blood vessel and its corresponding characteristic.","opts":["A. artery/largest lumen","B. arteriole/controls blood pressure","C. capillary/has valves","D. venule/most permeable","E. vein/may be elastic or muscular"],"a":"B. arteriole/controls blood pressure"},{"id":"s2-step-v24","ch":20,"section":"Step","q":"In general, for a vessel of a given size, a typical artery ________ compared to a typical vein.","opts":["A. is more elastic","B. has less smooth muscle in its tunica media","C. has no endothelium","D. has thinner walls","E. has a larger lumen"],"a":"A. is more elastic"},{"id":"s2-step-v25","ch":20,"section":"Step","q":"The instrument used to measure blood pressure is the","opts":["A. stethoscope.","B. thermometer.","C. endoscope.","D. sphygmomanometer.","E. hydrostatic pressure cuff."],"a":"D. sphygmomanometer."},{"id":"s2-step-v27","ch":20,"section":"Step","q":"When necessary, blood bypasses a capillary bed through","opts":["A. an arterial anastomosis.","B. venous valves.","C. arteriovenous anastomoses.","D. precapillary sphincters.","E. venules."],"a":"C. arteriovenous anastomoses."},{"id":"s2-step-v28","ch":20,"section":"Step","q":"Which of the following supplies blood to major sections of the intestinal tract and the pancreas?","opts":["A. phrenic arteries","B. superior mesenteric artery","C. lumbar artery","D. lateral sacral artery","E. celiac artery"],"a":"B. superior mesenteric artery"},{"id":"s2-step-v29","ch":20,"section":"Step","q":"Why do veins have relatively thin walls?","opts":["A. It allows a typical vein to change the diameter of its lumen.","B. It allows a typical vein to be stretched as its diameter increases during ventricular systole.","C. A typical vein's wall allows exchange to occur quickly by diffusion across endothelial cells or through gaps between adjacent endothelial cells.","D. A typical vein does not need to withstand much pressure.","E. There are sphincters associated with the walls of veins, which allow vasomotion to occur."],"a":"D. A typical vein does not need to withstand much pressure."},{"id":"s2-step-v30","ch":20,"section":"Step","q":"Which of the following correctly represents the layers associated with the heart from superficial to deep?","opts":["A. parietal pericardium, visceral pericardium, endocardium, myocardium","B. endocardium, myocardium, visceral pericardium, parietal pericardium","C. visceral pericardium, parietal pericardium, myocardium, endocardium","D. parietal pericardium, visceral pericardium, myocardium, endocardium","E. myocardium, visceral pericardium, endocardium, parietal pericardium"],"a":"D. parietal pericardium, visceral pericardium, myocardium, endocardium"},{"id":"s2-step-v31","ch":20,"section":"Step","q":"Which measurement device is used to directly measure arterial blood pressure in a clinical setting?","opts":["A. Oximeter","B. Stethoscope","C. Electrocardiograph","D. Sphygmomanometer","E. Ambulatory BP monitor"],"a":"D. Sphygmomanometer"},{"id":"s2-step-v32","ch":20,"section":"Step","q":"Which of the following best describes the role of baroreceptors in short-term BP regulation?","opts":["A. They are located in the ventricles","B. They detect changes in arterial pressure and adjust autonomic output","C. They regulate long-term fluid balance only","D. They control erythrocyte production","E. They measure venous pressure directly"],"a":"B. They detect changes in arterial pressure and adjust autonomic output"},{"id":"s2-step-v33","ch":20,"section":"Step","q":"Which component of the autonomic nervous system most directly increases blood pressure during a stress response?","opts":["A. Sympathetic nervous system","B. Enteric nervous system","C. Somatic nervous system","D. Parasympathetic nervous system","E. Endocrine insulin pathway"],"a":"A. Sympathetic nervous system"},{"id":"s2-step-v34","ch":20,"section":"Step","q":"The difference between systolic and diastolic pressure is known as:","opts":["A. Hydrostatic pressure","B. Mean arterial pressure","C. Pulse pressure","D. Capillary pressure","E. Venous pressure"],"a":"C. Pulse pressure"},{"id":"s2-step-v35","ch":20,"section":"Step","q":"Which factor is most directly responsible for generating systolic blood pressure during a cardiac cycle?","opts":["A. Peripheral venous pooling","B. Venous return","C. Atrioventricular valve closure","D. Diastolic heart sound (S2)","E. Left ventricular contraction (systole)"],"a":"E. Left ventricular contraction (systole)"},{"id":"s2-step-v36","ch":20,"section":"Step","q":"Which measurement value represents the pressure during the heart's relaxation phase?","opts":["A. Diastolic pressure","B. Mean arterial pressure","C. Systolic pressure","D. Capillary pressure","E. Pulse pressure"],"a":"A. Diastolic pressure"},{"id":"s2-step-v37","ch":20,"section":"Step","q":"Arterioles primarily regulate blood pressure by adjusting which parameter?","opts":["A. Systemic vascular resistance","B. Capillary hydrostatic pressure","C. Heart rate","D. Blood viscosity","E. Venous capacitance"],"a":"A. Systemic vascular resistance"},{"id":"s2-step-v38","ch":20,"section":"Step","q":"What is the typical range for normal systolic blood pressure in healthy adults?","opts":["A. 130–160 mmHg","B. 60–80 mmHg","C. Approximately 90–120 mmHg","D. 40–60 mmHg","E. Over 180 mmHg"],"a":"C. Approximately 90–120 mmHg"},{"id":"s2-step-v39","ch":20,"section":"Step","q":"Which vessel type is most involved in regulating blood flow to capillary beds?","opts":["A. capillaries","B. venules","C. arteries","D. arterioles"],"a":"D. arterioles"},{"id":"s2-step-v40","ch":20,"section":"Step","q":"Which type of blood vessel primarily carries blood away from the heart?","opts":["A. veins","B. capillaries","C. venules","D. arteries"],"a":"D. arteries"},{"id":"s2-step-v41","ch":20,"section":"Step","q":"Which type of vessel is primarily responsible for maintaining blood pressure and blood flow distribution?","opts":["A. capillaries","B. veins","C. arteries","D. venules"],"a":"C. arteries"},{"id":"s2-step-v42","ch":20,"section":"Step","q":"What term describes the smallest arteries that control blood flow into capillary beds?","opts":["A. veins","B. arteries","C. venules","D. arterioles"],"a":"D. arterioles"},{"id":"s2-step-v43","ch":20,"section":"Step","q":"Which vessel type lacks a complete layer of smooth muscle in the tunica media, contributing to its high permeability?","opts":["A. capillaries","B. arteries","C. venules","D. veins"],"a":"A. capillaries"},{"id":"s2-step-v44","ch":20,"section":"Step","q":"Which layer of a blood vessel contains smooth muscle and is responsible for vasoconstriction and vasodilation?","opts":["A. endothelium","B. tunica media","C. tunica externa","D. tunica adventitia
