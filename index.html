xtra79","ch":1,"section":"Extra","q":"What does the suffix '-plasm' mean?","a":"Formed material (e.g., cytoplasm = cell material)"},{"id":"m1x-extra80","ch":1,"section":"Extra","q":"What does the prefix 'poly-' mean?","a":"Many (e.g., polysaccharide = many sugars)"},{"id":"m1x-extra81","ch":1,"section":"Extra","q":"What does the prefix 'post-' mean?","a":"After, behind (e.g., postnatal = after birth)"},{"id":"m1x-extra82","ch":1,"section":"Extra","q":"What does the prefix 'pre-' mean?","a":"Before, in front of (e.g., prenatal = before birth)"},{"id":"m1x-extra83","ch":1,"section":"Extra","q":"What does the root 'pulmon/o-' mean?","a":"Lung (e.g., pulmonary artery = artery to the lungs)"},{"id":"m1x-extra84","ch":1,"section":"Extra","q":"What does the root 'ren/o-' or 'nephr/o-' mean?","a":"Kidney (e.g., renal = pertaining to kidney; nephritis = kidney inflammation)"},{"id":"m1x-extra85","ch":1,"section":"Extra","q":"What does the prefix 'retro-' mean?","a":"Behind, backward (e.g., retroperitoneal = behind the peritoneum)"},{"id":"m1x-extra86","ch":1,"section":"Extra","q":"What does the prefix 'sub-' mean?","a":"Below, under (e.g., subcutaneous = below the skin)"},{"id":"m1x-extra87","ch":1,"section":"Extra","q":"What does the prefix 'super-' or 'supra-' mean?","a":"Above, over (e.g., supraclavicular = above the clavicle)"},{"id":"m1x-extra88","ch":1,"section":"Extra","q":"What does the prefix 'tachy-' mean?","a":"Fast (e.g., tachycardia = fast heart rate)"},{"id":"m1x-extra89","ch":1,"section":"Extra","q":"What does the prefix 'trans-' mean?","a":"Across, through (e.g., transverse = across the body)"},{"id":"m1x-extra90","ch":1,"section":"Extra","q":"What does the prefix 'tri-' mean?","a":"Three (e.g., triceps = three heads)"},{"id":"m1x-extra91","ch":1,"section":"Extra","q":"What does the prefix 'uni-' mean?","a":"One (e.g., unilateral = one-sided)"},{"id":"m1x-extra92","ch":1,"section":"Extra","q":"What does the root 'vas/o-' or 'vascul/o-' mean?","a":"Vessel (e.g., vascular = pertaining to vessels)"},{"id":"m1x-extra93","ch":1,"section":"Extra","q":"What does the suffix '-osis' mean?","a":"Condition / disease (e.g., osteoporosis = bone-loss condition)"}]},{"key":"m2lab4","name":"Module 2 Lab — Chapter 4","sub":"Tissues & glands + Ch 4 book images","cards":[{"id":"m2lab-tid-s5","ch":4,"section":"TID","img":"images/S05_Simple_Squamous_Epithelium.jpg","q":"Identify this tissue.","a":"Simple Squamous Epithelium — Single layer of flat, thin cells with disc-shaped central nuclei. Lines alveoli (air sacs), capillaries, serous membranes (endothelium, mesothelium). Function: diffusion and filtration."},{"id":"m2lab-tid-s6","ch":4,"section":"TID","img":"images/S06_Simple_Cuboidal_Epithelium.jpg","q":"Identify this tissue.","a":"Simple Cuboidal Epithelium — Single layer of cube-shaped cells with large spherical central nuclei. Found in kidney tubules, gland ducts, ovary surface. Function: secretion and absorption."},{"id":"m2lab-tid-s7","ch":4,"section":"TID","img":"images/S07_Simple_Columnar_Epithelium.jpg","q":"Identify this tissue.","a":"Simple Columnar Epithelium — Single layer of tall, rectangular cells with oval nuclei near the basal end. Lines the stomach, intestines, gallbladder. Often has microvilli (or cilia in fallopian tubes). Function: absorption + secretion (with goblet cells)."},{"id":"m2lab-tid-s8","ch":4,"section":"TID","img":"images/S08_Pseudostratified_Columnar_Epithelium.jpg","q":"Identify this tissue.","a":"Pseudostratified Ciliated Columnar Epithelium — Appears layered but is one layer — all cells touch basement membrane, nuclei at different heights. Lines the trachea and most upper respiratory tract. Cilia + goblet cells = mucociliary escalator (sweeps trapped particles up out of airways)."},{"id":"m2lab-tid-s9","ch":4,"section":"TID","img":"images/S09_Stratified_Squamous_Epithelium.jpg","q":"Identify this tissue.","a":"Stratified Squamous Epithelium — Many layers with FLAT cells at the apical surface; basal cells may be cuboidal/columnar. Keratinized = epidermis of skin. Non-keratinized = mouth, esophagus, vagina, anus. Function: protection against abrasion."},{"id":"m2lab-tid-s10","ch":4,"section":"TID","img":"images/S10_Transitional_Epithelium.jpg","q":"Identify this tissue.","a":"Transitional Epithelium — Multi-layered with DOME-SHAPED cells on top that flatten when stretched. Lines the urinary bladder, ureters, urethra. Function: stretches to accommodate filling/emptying of urinary organs."},{"id":"m2lab-tid-s13","ch":4,"section":"TID","img":"images/S13_Areolar_Loose_Connective_Tissue.jpg","q":"Identify this tissue.","a":"Areolar (Loose) Connective Tissue — Gel-like ground substance with all three fiber types (collagen, elastic, reticular) plus fibroblasts, macrophages, and mast cells. Widely distributed under epithelia (e.g., lamina propria). Function: packs and cushions organs; supports blood vessels and nerves."},{"id":"m2lab-tid-s14","ch":4,"section":"TID","img":"images/S14_Adipose_Loose_Connective_Tissue.jpg","q":"Identify this tissue.","a":"Adipose Tissue — Closely packed signet-ring shaped adipocytes — large lipid droplet pushes nucleus to one side. Found in hypodermis, around kidneys/heart, breasts, eye sockets. Function: energy storage, insulation, cushioning, hormone secretion (leptin)."},{"id":"m2lab-tid-s15","ch":4,"section":"TID","img":"images/S15_Reticular_Loose_Connective_Tissue.jpg","q":"Identify this tissue.","a":"Reticular Connective Tissue — Network of fine reticular fibers (type III collagen) forming a STROMA (framework) for soft organs. Found in lymph nodes, spleen, bone marrow, liver. Function: supports free blood cells in lymphoid organs."},{"id":"m2lab-tid-s16","ch":4,"section":"TID","img":"images/S16_Dense_Regular_Connective_Tissue.jpg","q":"Identify this tissue.","a":"Dense Regular Connective Tissue — Tightly packed PARALLEL collagen fibers with fibroblast nuclei in rows between them. Found in tendons (muscle→bone), ligaments (bone→bone), aponeuroses. Function: high tensile strength in ONE direction."},{"id":"m2lab-tid-s17","ch":4,"section":"TID","img":"images/S17_Dense_Irregular_Connective_Tissue.jpg","q":"Identify this tissue.","a":"Dense Irregular Connective Tissue — Tightly packed collagen fibers running in MULTIPLE directions (woven). Found in the dermis of skin, organ capsules (kidney, liver), fibrous joint capsules. Function: resists stretching/tearing forces from many directions."},{"id":"m2lab-tid-s18","ch":4,"section":"TID","img":"images/S18_Hyaline_Cartilage.jpg","q":"Identify this tissue.","a":"Hyaline Cartilage — Glassy blue-white matrix with chondrocytes sitting in LACUNAE; no visible fibers. MOST COMMON cartilage. Found at articular surfaces of bones, costal cartilages, nose, trachea/larynx rings, embryonic skeleton. Function: smooth low-friction joint surfaces; supports."},{"id":"m2lab-tid-s19","ch":4,"section":"TID","img":"images/S19_Elastic_Cartilage.jpg","q":"Identify this tissue.","a":"Elastic Cartilage — Like hyaline but matrix is packed with dark wavy ELASTIC FIBERS visible between lacunae. Found in the external ear (pinna), epiglottis, auditory (Eustachian) tube. Function: maintains shape while allowing flexibility."},{"id":"m2lab-tid-s20","ch":4,"section":"TID","img":"images/S20_Fibrocartilage.jpg","q":"Identify this tissue.","a":"Fibrocartilage — Rows of chondrocytes in lacunae sandwiched between PARALLEL COLLAGEN BUNDLES. Found in intervertebral discs, menisci of knee, pubic symphysis, TMJ disc. Function: absorbs compression and resists tension/shear."},{"id":"m2lab-tid-s21","ch":4,"section":"TID","img":"images/S21_Bone_Osseous_Tissue.jpg","q":"Identify this tissue.","a":"Bone (Osseous) Tissue — OSTEONS = concentric lamellae of calcified matrix around a central (Haversian) canal. Osteocytes sit in lacunae connected by canaliculi. Functions: support, protection, leverage, mineral (Ca, P) storage, fat storage, hematopoiesis."},{"id":"m2lab-tid-s22","ch":4,"section":"TID","img":"images/S22_Blood.jpg","q":"Identify this tissue.","a":"Blood (Fluid Connective Tissue) — Red blood cells (biconcave, no nucleus) suspended in liquid PLASMA matrix; occasional white blood cells (with nuclei) and platelets. Function: transport O2/CO2, nutrients, hormones, wastes; immunity; clotting."},{"id":"m2lab-tid-s23","ch":4,"section":"TID","img":"images/S23_Nervous_Tissue.jpg","q":"Identify this tissue.","a":"Nervous Tissue — Large NEURONS with prominent cell bodies, dendrites, axons, surrounded by smaller neuroglia. Found in brain, spinal cord, peripheral nerves. Function: rapid communication via electrical/chemical signals; sensation; control."},{"id":"m2lab-tid-s24","ch":4,"section":"TID","img":"images/S24_Skeletal_Muscle.jpg","q":"Identify this tissue.","a":"Skeletal Muscle — Long, cylindrical, MULTINUCLEATED fibers with peripheral nuclei; visible STRIATIONS (dark/light bands). Attaches to bones via tendons. Function: voluntary movement, posture, heat production."},{"id":"m2lab-tid-s25","ch":4,"section":"TID","img":"images/S25_Cardiac_Muscle.jpg","q":"Identify this tissue.","a":"Cardiac Muscle — BRANCHED striated fibers with 1 (sometimes 2) CENTRAL nucleus, joined by dark INTERCALATED DISCS. Only in the heart. Function: involuntary, rhythmic contraction to pump blood (autorhythmic via gap junctions in discs)."},{"id":"m2lab-tid-s26","ch":4,"section":"TID","img":"images/S26_Smooth_Muscle.jpg","q":"Identify this tissue.","a":"Smooth Muscle — Spindle-shaped (fusiform) cells with ONE central oval nucleus, NO striations. Found in walls of hollow organs — intestines, blood vessels, bladder, uterus, airways. Function: involuntary contraction — peristalsis, vasoconstriction, etc."},{"id":"m2lab-prac-01","ch":4,"section":"Practice","q":"The four main tissue categories are muscle, neural, connective and ___________ tissue.","a":"Epithelial."},{"id":"m2lab-prac-02","ch":4,"section":"Practice","q":"The tissue that always has a \"top\" and a \"bottom\" is _______________ tissue.","a":"Epithelial (it has apical and basal surfaces — polarity)."},{"id":"m2lab-prac-03","ch":4,"section":"Practice","q":"The junction type that lets neighboring cells exchange small molecules is the ________ junction.","a":"Gap junction (made of connexons; allows ions/small molecules to pass directly cell-to-cell)."},{"id":"m2lab-prac-04","ch":4,"section":"Practice","q":"Epithelial cells adapted for absorption or secretion usually have ___________ at their free surface.","a":"Microvilli (small finger-like projections that increase surface area). Cilia are also a free-surface modification."},{"id":"m2lab-prac-05","ch":4,"section":"Practice","q":"Epithelium is connected to underlying connective tissue by a basal _________.","a":"Lamina (basal lamina) — together with the deeper reticular lamina it forms the basement membrane."},{"id":"m2lab-prac-06","ch":4,"section":"Practice","q":"Which tissue lines the small intestine and the stomach?","a":"Simple columnar epithelium (with microvilli in the small intestine; with gastric glands in the stomach)."},{"id":"m2lab-prac-07","ch":4,"section":"Practice","q":"A layer of glycoproteins that prevents leakage of materials from connective tissues into epithelia is the lamina ____________.","a":"Densa (the lamina densa is the type-IV-collagen / glycoprotein filter layer of the basement membrane)."},{"id":"m2lab-prac-08","ch":4,"section":"Practice","q":"Epithelia specialized for providing sensations of smell, taste, sight, equilibrium, and hearing are known as __________________.","a":"Sensory epithelia (neuroepithelium / neuroepithelial cells)."},{"id":"m2lab-prac-09","ch":4,"section":"Practice","q":"Close exam of a healthy organ reveals a lining of several layers of cells. The layers contain no blood vessels and one surface lines the cavity. This tissue is a type of ___________________.","a":"Stratified epithelium (epithelial tissue is avascular and has a free apical surface)."},{"id":"m2lab-prac-10","ch":4,"section":"Practice","q":"_________________ epithelium is found lining the urinary bladder.","a":"Transitional epithelium — stretches to accommodate filling."},{"id":"m2lab-prac-11","ch":4,"section":"Practice","q":"The heart and blood vessels are lined by simple squamous epithelium. You would find ____________________ columnar epithelium lining the trachea.","a":"Pseudostratified ciliated columnar epithelium (with goblet cells — mucociliary escalator)."},{"id":"m2lab-prac-12","ch":4,"section":"Practice","q":"Cells that are flat and thin are classified as ____________.","a":"Squamous."},{"id":"m2lab-prac-13","ch":4,"section":"Practice","q":"Glands that secrete hormones into the interstitial fluid (and blood) are ______________ glands.","a":"Endocrine glands (ductless — secrete hormones directly into blood)."},{"id":"m2lab-prac-14","ch":4,"section":"Practice","q":"The epithelium that forms air sacs in the lungs is ________________ epithelium.","a":"Simple squamous epithelium (type I pneumocytes — thin enough for gas diffusion)."},{"id":"m2lab-prac-15","ch":4,"section":"Practice","q":"The Pap test for cervical cancer utilizes ____________________ cytology.","a":"Exfoliative cytology (examines cells shed/scraped from the cervical epithelium)."},{"id":"m2lab-prac-16","ch":4,"section":"Practice","q":"Which cell produces the protein fibers in areolar connective tissue?","a":"Fibroblasts."},{"id":"m2lab-prac-17","ch":4,"section":"Practice","q":"Blood is which type of tissue?","a":"Fluid connective tissue (cells in a liquid matrix called plasma)."},{"id":"m2lab-prac-18","ch":4,"section":"Practice","q":"Cells that store fat are called __________________.","a":"Adipocytes (fat cells)."},{"id":"m2lab-prac-19","ch":4,"section":"Practice","q":"The dominant fiber type in dense connective tissue is ___________.","a":"Collagen (specifically type I collagen — for tensile strength)."},{"id":"m2lab-prac-20","ch":4,"section":"Practice","q":"______________ attaches skeletal muscles to bones, and ______________ connect one bone to another.","a":"Tendons; ligaments. Both are dense regular connective tissue."},{"id":"m2lab-prac-21","ch":4,"section":"Practice","q":"The three types of protein fibers in connective tissue are _________, reticular, and elastic.","a":"Collagen (the three are collagen, reticular, and elastic fibers)."},{"id":"m2lab-prac-22","ch":4,"section":"Practice","q":"Osseous tissue is also called ___________.","a":"Bone."},{"id":"m2lab-prac-23","ch":4,"section":"Practice","q":"Which type of connective tissue is found in the trachea and between the ribs and sternum?","a":"Hyaline cartilage (tracheal rings; costal cartilages of the ribs)."},{"id":"m2lab-prac-24","ch":4,"section":"Practice","q":"A tissue with a gel matrix and cells inside lacunae is _____________.","a":"Cartilage (chondrocytes sit in spaces called lacunae within the chondroitin-rich matrix)."},{"id":"m2lab-prac-25","ch":4,"section":"Practice","q":"The reduction of friction between the parietal and visceral surfaces of an internal cavity is the function of __________________ membranes.","a":"Serous membranes (pleural, pericardial, peritoneal) — they secrete serous fluid for lubrication."},{"id":"m2lab-prac-26","ch":4,"section":"Practice","q":"Explain why sunburned skin peels rather than being shed as a powder.","a":"UV radiation damages many keratinocytes simultaneously in deeper epidermal layers (basale + spinosum), triggering mass apoptosis. Because adjacent damaged cells are still held together by intact desmosomes, they slough off in SHEETS rather than as single cells. Normal shedding from the stratum corneum is single-cell, so it appears as fine dander/powder."},{"id":"m2lab-prac-27","ch":4,"section":"Practice","q":"What type of epithelium would you expect to find lining the alveoli (air sacs) in the lungs?","a":"Simple squamous epithelium — single, thin layer allows rapid gas exchange via diffusion (alongside the simple squamous endothelium of pulmonary capillaries)."},{"id":"m2lab4-img-01","ch":4,"section":"Image ID","img":"images/ch4-cell-junctions.jpg","q":"Identify the 4 types of cell junctions.","a":"TIGHT JUNCTIONS — claudins/occludins seal cells; leak-proof barrier; maintain polarity.\nADHERENS JUNCTIONS — cadherins linked to actin; cell-to-cell mechanical anchor.\nDESMOSOMES — cadherins (desmogleins) linked to intermediate filaments (keratin); 'spot welds' resist shearing.\nGAP JUNCTIONS — connexons form channels; allow direct ion/small-molecule passage cell-to-cell.\nHEMIDESMOSOMES — integrins anchor cell to BASEMENT MEMBRANE (not cell-to-cell).","imgBack":"images/labeled-ch4-cell-junctions-pdf.jpg"},{"id":"m2lab4-img-02","ch":4,"section":"Image ID","img":"images/ch4-glands-types.jpg","q":"Identify endocrine vs exocrine glands.","a":"ENDOCRINE — ductless; secrete HORMONES into BLOOD/interstitial fluid. Ex: thyroid, pituitary, adrenal, pancreas (islets).\nEXOCRINE — duct opens to a surface; secrete onto skin or into lumen. Ex: sweat, salivary, sebaceous, mammary, pancreas (acini).\nGOBLET CELLS — unicellular exocrine glands (secrete mucus directly without duct).","imgBack":"images/labeled-ch4-gland-types-pdf.jpg"},{"id":"m2lab4-img-03","ch":4,"section":"Image ID","img":"images/ch4-secretion-modes.jpg","q":"Identify the 3 modes of glandular secretion.","a":"MEROCRINE (eccrine) — secretion released by EXOCYTOSIS; cell stays intact. Ex: salivary, eccrine sweat, pancreas.\nAPOCRINE — APICAL portion of cell pinches off with secretion; cell repairs and resumes. Ex: apocrine sweat (axilla), mammary.\nHOLOCRINE — ENTIRE CELL RUPTURES, releasing contents; cell is replaced from basal stem cells. Ex: sebaceous (oil) glands.","imgBack":"images/labeled-ch4-secretion-modes-pdf.jpg"},{"id":"m2lab4-img-04","ch":4,"section":"Image ID","img":"images/ch4-goblet-cell.jpg","q":"Identify this cell and its function.","a":"GOBLET CELL — UNICELLULAR EXOCRINE GLAND. Goblet-shaped; secretes MUCIN that swells with water to form mucus.\nLocation: scattered in simple columnar (intestine) and pseudostratified ciliated columnar (trachea) epithelia.\nFunction: protective mucus layer; traps particles in airways (cleared by cilia); lubricates intestinal lining.","imgBack":"images/labeled-ch4-goblet-cell-pdf.jpg"},{"id":"m2lab4-img-05","ch":4,"section":"Image ID","img":"images/ch4-sebaceous-glands.jpg","q":"Identify this gland type, mode of secretion, and product.","a":"SEBACEOUS (OIL) GLAND. Multicellular, simple branched alveolar gland.\nMode: HOLOCRINE — entire cells rupture to release secretion.\nProduct: SEBUM (oily mix of triglycerides, cholesterol, proteins, electrolytes).\nFunction: lubricate skin + hair, slow water loss, antibacterial. Found everywhere except palms/soles.","imgBack":"images/labeled-ch4-sebaceous-glands-pdf.jpg"},{"id":"m2lab4-img-06","ch":4,"section":"Image ID","img":"images/ch4-neuron.jpg","q":"Identify the parts of a neuron.","a":"DENDRITES — receive signals.\nCELL BODY (SOMA / PERIKARYON) — contains nucleus + organelles.\nAXON HILLOCK — where action potential starts.\nAXON — long process that conducts action potentials.\nMYELIN SHEATH (from Schwann cells in PNS, oligodendrocytes in CNS) — insulation.\nNODES OF RANVIER — gaps between myelin segments; saltatory conduction.\nAXON TERMINALS / SYNAPTIC BOUTONS — release neurotransmitters.","imgBack":"images/labeled-ch4-neuron-pdf.jpg"},{"id":"m2lab4-img-07","ch":4,"section":"Image ID","img":"images/ch4-nervous-tissue.jpg","q":"Identify the cell types and structures in this nervous tissue micrograph.","a":"NEURONS — large cell bodies with prominent nuclei and visible processes (dendrites + axons).\nNEUROGLIA — smaller surrounding support cells (astrocytes, oligodendrocytes, microglia in CNS; Schwann + satellite in PNS).\nFunctions: communication, control, integration.","imgBack":"images/labeled-ch4-nervous-tissue-pdf.jpg"},{"id":"m2lab4-img-08","ch":4,"section":"Image ID","img":"images/ch4-tissue-repair.jpg","q":"Identify the steps of tissue repair.","a":"1. INFLAMMATION — blood clot forms; chemicals trigger redness, heat, swelling, pain.\n2. ORGANIZATION (granulation) — clot replaced by granulation tissue; new capillaries grow (angiogenesis); fibroblasts deposit collagen; macrophages clean debris.\n3. REGENERATION + FIBROSIS — surviving cells repair; if labile/stable tissue (skin, liver), full regeneration. If permanent tissue (cardiac, neural), scar tissue replaces.\n4. SCAR (fibrosis) — collagen-rich fibrous tissue if regeneration incomplete.","imgBack":"images/labeled-ch4-tissue-repair-pdf.jpg"},{"id":"m2lab4-img-09","ch":4,"section":"Image ID","img":"images/ch4-epithelial-tissue-summary.jpg","q":"Fill in the blank epithelial tissue type labels in this summary table.","a":"Top to bottom: SIMPLE SQUAMOUS epithelium; SIMPLE CUBOIDAL epithelium; SIMPLE COLUMNAR epithelium; PSEUDOSTRATIFIED COLUMNAR epithelium; STRATIFIED SQUAMOUS epithelium; STRATIFIED CUBOIDAL epithelium; STRATIFIED COLUMNAR epithelium; TRANSITIONAL epithelium. Use the location/function clues to confirm each tissue type.","imgBack":"images/labeled-ch4-epithelial-tissue-summary.jpg"}]},{"key":"m2lab5","name":"Module 2 Lab — Chapter 5","sub":"Integumentary system · 50 cards","cards":[{"id":"m2skin-prac-01","ch":5,"section":"Practice","q":"The two components of the integumentary system are the _______________ membrane and accessory structures.","a":"Cutaneous membrane (skin itself). Accessory structures = hair, nails, glands (sebaceous, sudoriferous), sensory receptors."},{"id":"m2skin-prac-02","ch":5,"section":"Practice","q":"The type of cell that forms the strata in the epidermis are _______________.","a":"Keratinocytes (they produce keratin and make up the bulk of the epidermis)."},{"id":"m2skin-prac-03","ch":5,"section":"Practice","q":"The tough \"horny\" superficial layer of the epidermis is known as the stratum _____________ where large quantities of keratin are found.","a":"Corneum (stratum corneum — 15–30 layers of dead, keratinized cells; the waterproof barrier)."},{"id":"m2skin-prac-04","ch":5,"section":"Practice","q":"The layer of the epidermis that contains abundant desmosomes is the stratum ___________.","a":"Spinosum (the 'spiny layer' — 8–10 layers of keratinocytes bound by desmosomes; appearance comes from cells shrinking and cytoskeletons sticking out)."},{"id":"m2skin-prac-05","ch":5,"section":"Practice","q":"The layer of the skin that provides a barrier against bacteria, chemical, and mechanical injuries is the ____________.","a":"Epidermis (specifically the keratinized stratum corneum)."},{"id":"m2skin-prac-06","ch":5,"section":"Practice","q":"_________________ are cells in the epidermis that are part of the immune system.","a":"Dendritic (Langerhans) cells. Found in stratum spinosum; act as macrophages — engulf bacteria, foreign particles, damaged cells."},{"id":"m2skin-prac-07","ch":5,"section":"Practice","q":"The epidermis of the skin is composed of keratinized stratified ______________ epithelium.","a":"Squamous."},{"id":"m2skin-prac-08","ch":5,"section":"Practice","q":"The layer of stem cells that constantly divide to renew the epidermis is the stratum ______________.","a":"Basale (a.k.a. stratum germinativum — basal/germinative cells undergo mitosis)."},{"id":"m2skin-prac-09","ch":5,"section":"Practice","q":"The protein that reduces water loss at the skin surface is ____________.","a":"Keratin (tough fibrous waterproof protein, also found in hair and nails)."},{"id":"m2skin-prac-10","ch":5,"section":"Practice","q":"The primary pigments contained in the epidermis are carotene and _____________. (An albino lacks the ability to produce _______ melanin.)","a":"Melanin. An albino lacks the ability to produce melanin altogether. UV exposure increases melanin production."},{"id":"m2skin-prac-11","ch":5,"section":"Practice","q":"The _____________ in keratinocytes protects the epidermis and dermis from the harmful effects of sunlight.","a":"Melanin (taken up from melanocytes via melanosomes; absorbs UV)."},{"id":"m2skin-prac-12","ch":5,"section":"Practice","q":"An important vitamin formed in the skin when exposed to sunlight is vitamin _____.","a":"Vitamin D (cholecalciferol → liver → kidneys → calcitriol, the active form). Needed for Ca/P absorption."},{"id":"m2skin-prac-13","ch":5,"section":"Practice","q":"Children in northern regions experience inadequate sunlight. To prevent abnormal bone development, what essential organic nutrient is necessary in the diet?","a":"Vitamin D (dietary or fortified milk — prevents rickets in children, osteomalacia in adults)."},{"id":"m2skin-prac-14","ch":5,"section":"Practice","q":"The layer of the skin that contains the blood vessels and nerves CLOSEST to the surface is the _________________ layer.","a":"Papillary layer of the dermis (areolar CT with capillaries, lymphatics, Meissner corpuscles; sits just under the epidermis)."},{"id":"m2skin-prac-15","ch":5,"section":"Practice","q":"The layer of the skin that contains bundles of collagen and elastic fibers responsible for the strength of the skin is the _________________ layer.","a":"Reticular layer of the dermis (dense irregular CT — collagen + elastic fibers; the thicker, deeper part)."},{"id":"m2skin-prac-16","ch":5,"section":"Practice","q":"The protein that permits stretching and recoiling of the skin is __________.","a":"Elastin (elastic fibers in the reticular layer of the dermis)."},{"id":"m2skin-prac-17","ch":5,"section":"Practice","q":"Skin inflammation that primarily involves the papillary layer is termed ____________.","a":"Dermatitis."},{"id":"m2skin-prac-18","ch":5,"section":"Practice","q":"After pinching the skin on the back of the hand it remains peaked. This is a sign of ____________.","a":"Dehydration (the skin loses turgor; sometimes called 'tenting'). In aging it can also reflect loss of elastic fibers."},{"id":"m2skin-prac-19","ch":5,"section":"Practice","q":"When the _______________ pili muscles contract, \"goose bumps\" are formed.","a":"Arrector pili (small smooth-muscle bundles attached to hair follicles)."},{"id":"m2skin-prac-20","ch":5,"section":"Practice","q":"Glands that discharge an oily secretion into hair follicles are ________ glands.","a":"Sebaceous (oil) glands — holocrine glands that secrete sebum."},{"id":"m2skin-c-01","ch":5,"section":"Lecture","q":"Name the 5 layers of the epidermis from DEEP to SUPERFICIAL.","a":"1. Stratum BASALE  2. Stratum SPINOSUM  3. Stratum GRANULOSUM  4. Stratum LUCIDUM (thick skin only)  5. Stratum CORNEUM.  Mnemonic: 'Bears Slurp Granola Like Crackers.'"},{"id":"m2skin-c-02","ch":5,"section":"Lecture","q":"Which stratum is found ONLY in thick skin? Where is thick skin located?","a":"Stratum LUCIDUM. Thick skin = palms of hands, soles of feet, and the digits (high friction areas)."},{"id":"m2skin-c-03","ch":5,"section":"Lecture","q":"What 3 cell types are found in the stratum basale?","a":"(1) Basal/germinative cells (stem cells that divide to make keratinocytes), (2) Melanocytes (make melanin), (3) Merkel cells (light touch receptors)."},{"id":"m2skin-c-04","ch":5,"section":"Lecture","q":"What cell is found in the stratum spinosum and what does it do?","a":"Dendritic (Langerhans) cell — antigen-presenting cell of the immune system; engulfs foreign particles, damaged cells, and bacteria like a macrophage."},{"id":"m2skin-c-05","ch":5,"section":"Lecture","q":"What two proteins are produced in the stratum granulosum, and what do they do?","a":"Keratin (tough fibrous, waterproof protein) and Keratohyalin (cross-links the keratin fibers, giving the layer a grainy appearance)."},{"id":"m2skin-c-06","ch":5,"section":"Lecture","q":"What is the difference between insensible and sensible perspiration?","a":"INSENSIBLE perspiration = interstitial fluid lost by evaporation through the stratum corneum (~500 mL/day, you don't feel it). SENSIBLE perspiration = water actively excreted by sweat glands."},{"id":"m2skin-c-07","ch":5,"section":"Lecture","q":"What are the 2 layers of the dermis and what tissue makes each?","a":"PAPILLARY (superficial) — areolar CT, capillaries, sensory neurons, dermal papillae. RETICULAR (deep) — dense IRREGULAR CT, collagen + elastic fibers, larger vessels."},{"id":"m2skin-c-08","ch":5,"section":"Lecture","q":"Dermal papillae project up into the epidermis. What do they form on fingertips?","a":"Epidermal ridges = FINGERPRINTS. They also increase the surface area of attachment between epidermis and dermis."},{"id":"m2skin-c-09","ch":5,"section":"Lecture","q":"Name the 3 dermal blood plexuses.","a":"(1) Papillary plexus — small arteries in papillary layer.  (2) Cutaneous plexus — network in reticular layer.  (3) Venous plexus — drains capillary blood back deep to papillary plexus."},{"id":"m2skin-c-10","ch":5,"section":"Lecture","q":"What is a contusion?","a":"Damage to blood vessels in the skin (or deeper) producing visible bruising ('black-and-blue' marks)."},{"id":"m2skin-c-11","ch":5,"section":"Lecture","q":"What tissues make up the hypodermis (subcutaneous layer)?","a":"Elastic AREOLAR tissue + ADIPOSE tissue. Well vascularized; provides insulation and cushioning; site of subcutaneous (hypodermic) injections. Note: hypodermis is NOT part of the skin."},{"id":"m2skin-c-12","ch":5,"section":"Lecture","q":"List the 3 parts of a hair and their location.","a":"(1) Hair shaft — the visible part above the skin surface.  (2) Hair root — the part below the skin surface.  (3) Hair follicle — the tube of cells in the dermis containing the root; surrounded by dense CT and sensory nerves (root hair plexus)."},{"id":"m2skin-c-13","ch":5,"section":"Lecture","q":"What muscle makes hairs stand up and produces goose bumps?","a":"Arrector pili — involuntary SMOOTH muscle attached to the hair follicle."},{"id":"m2skin-c-14","ch":5,"section":"Lecture","q":"Compare the three modified sweat glands: apocrine, merocrine (eccrine), and sebaceous.","a":"APOCRINE — large; armpits, areola, groin; secrete into hair follicles; activate at puberty; sticky/cloudy → body odor when broken down by bacteria.\nMEROCRINE (ECCRINE) — widely distributed (esp palms/soles); coiled tubular; discharge directly onto skin; cool skin, excrete water/electrolytes (merocrine = exocytosis).\nSEBACEOUS (OIL) — simple branched alveolar; associated with hair follicles; HOLOCRINE (whole cell ruptures); secrete sebum (lipids — lubricate, antibacterial)."},{"id":"m2skin-c-15","ch":5,"section":"Lecture","q":"Name the 5 parts of a nail labeled in the lab.","a":"(1) Nail body — visible part covering nail bed.  (2) Nail root — embedded in epidermal fold; site of growth.  (3) Lunula — pale crescent at base of nail body.  (4) Hyponychium — skin beneath the free edge.  (5) Eponychium (cuticle) — visible nail emerges here at the proximal nail fold."},{"id":"m2skin-c-16","ch":5,"section":"Lecture","q":"Where is light touch detected vs deep pressure?","a":"LIGHT TOUCH — Meissner's corpuscles (upper dermis, dermal papillae) + Merkel discs (stratum basale).\nDEEP PRESSURE / vibration — Pacinian (lamellated) corpuscles, deep dermis or hypodermis."},{"id":"m2skin-c-17","ch":5,"section":"Lecture","q":"What are the 4 types of body membranes?","a":"(1) MUCOUS — line cavities open to exterior (digestive, respiratory, urinary, reproductive).  (2) SEROUS — line sealed internal body cavities (pleural, pericardial, peritoneal); secrete transudate.  (3) CUTANEOUS — skin; covers outer body.  (4) SYNOVIAL — line freely-movable joint cavities; produce synovial fluid."},{"id":"m2skin-c-18","ch":5,"section":"Lecture","q":"What is the 'two-point discrimination' test measuring?","a":"The relative DENSITY of touch receptors in different skin areas — the smaller the distance at which you can distinguish 2 points, the higher the receptor density. Fingertips have very high density; back has low."},{"id":"m2skin-c-19","ch":5,"section":"Lecture","q":"What 7 listed functions does the integumentary system perform?","a":"(1) Protection of underlying tissues/organs (against infection, desiccation, abrasion, chemicals, radiation).  (2) Excretion of salts, water, organic wastes via sweat glands.  (3) Maintenance of body temperature (insulation + evaporation).  (4) Production of melanin.  (5) Production of keratin.  (6) Synthesis of vitamin D3 (sunlight).  (7) Detection of touch, pressure, pain, temperature."},{"id":"m2skin-c-20","ch":5,"section":"Lecture","q":"How does the epidermis get its nutrients if it's avascular?","a":"Nutrients and oxygen DIFFUSE from capillaries in the papillary layer of the underlying dermis up through the basement membrane into the epidermis."},{"id":"m2skin-c-21","ch":5,"section":"Lecture","q":"What is the difference between the cutaneous plexus and papillary plexus?","a":"Cutaneous plexus runs along the RETICULAR layer (deep dermis) — supplies the dermis and hypodermis. Papillary plexus is the smaller branching vessels in the PAPILLARY layer feeding the dermal papillae just under the epidermis."},{"id":"m2skin-img-01","ch":5,"section":"Image ID","img":"images/skin-structure.jpg","q":"Identify ALL labeled structures in this skin diagram.","a":"Structures you should be able to label (epidermis → hypodermis): epidermis, dermis (papillary + reticular layers), hypodermis (subcutaneous), hair shaft, hair root + follicle, arrector pili muscle, sebaceous gland, sweat gland (eccrine), nerve, artery, vein, sensory receptors (Meissner / Pacinian corpuscles). The epidermis sits on the basement membrane; dermal papillae interlock with epidermal ridges.","imgBack":"images/labeled-skin-structure-pdf.jpg"},{"id":"m2skin-img-02","ch":5,"section":"Image ID","img":"images/skin-epidermis-layers.jpg","q":"Identify the 5 strata of the epidermis (deep → superficial).","a":"1. Stratum BASALE (germinativum) — anchors to basement membrane.  2. Stratum SPINOSUM — spiny cells, desmosomes, Langerhans cells.  3. Stratum GRANULOSUM — keratin + keratohyalin produced.  4. Stratum LUCIDUM — thick skin only; clear flat dead cells.  5. Stratum CORNEUM — dead keratinized waterproof outer layer.","imgBack":"images/labeled-skin-epidermis-layers-pdf.jpg"},{"id":"m2skin-img-03","ch":5,"section":"Image ID","img":"images/skin-epidermal-cells.jpg","q":"Identify the cells found in the epidermis.","a":"KERATINOCYTE — bulk of epidermis, produces keratin.  MELANOCYTE — produces melanin (stratum basale).  MERKEL CELL — light touch receptor (stratum basale).  DENDRITIC (LANGERHANS) CELL — immune cell, antigen-presenting (stratum spinosum).","imgBack":"images/labeled-skin-epidermal-cells-pdf.jpg"},{"id":"m2skin-img-04","ch":5,"section":"Image ID","img":"images/skin-hair.jpg","q":"Identify the parts of a hair and follicle.","a":"Hair SHAFT (above surface) — Hair ROOT (below surface) — Hair FOLLICLE (tube around root) — Hair BULB (base, with matrix and papilla supplying blood) — ARRECTOR PILI muscle — SEBACEOUS gland feeding into follicle — Sensory nerves wrap follicle (root hair plexus).","imgBack":"images/labeled-skin-hair-pdf.jpg"},{"id":"m2skin-img-05","ch":5,"section":"Image ID","img":"images/skin-nails.jpg","q":"Identify the parts of a nail.","a":"NAIL BODY (visible, lies on nail bed).  NAIL ROOT (embedded in skin; growth site).  LUNULA (pale crescent at base).  EPONYCHIUM = cuticle (proximal nail fold).  HYPONYCHIUM (under free distal edge).  Lateral nail grooves + lateral nail folds (sides).","imgBack":"images/labeled-skin-nails-pdf.jpg"},{"id":"m2skin-img-06","ch":5,"section":"Image ID","img":"images/skin-eccrine-gland.jpg","q":"Identify this gland type and its key features.","a":"ECCRINE (MEROCRINE) SWEAT GLAND. Simple coiled tubular gland in the dermis/hypodermis. Duct opens directly onto skin surface via a pore. Discharges sweat by exocytosis (merocrine). Function: thermoregulation (cools by evaporation) and excretes water + electrolytes.","imgBack":"images/labeled-skin-eccrine-gland-pdf.jpg"},{"id":"m2skin-img-07","ch":5,"section":"Image ID","img":"images/skin-burns.jpg","q":"Identify the rule-of-nines burn areas and percentages.","a":"RULE OF NINES ? Head and neck: 9%. Each upper limb: 9%. Anterior trunk: 18%. Posterior trunk: 18%. Genitalia/perineum: 1%. Each lower limb: 18%. Burn-depth reminder: FIRST DEGREE ? Epidermis only (red, painful, no blisters). SECOND DEGREE ? Epidermis + part of dermis (blisters, very painful; partial-thickness). THIRD DEGREE ? Epidermis + all of dermis (leathery/white or charred; full-thickness, may be less painful if nerves are destroyed).","imgBack":"images/labeled-skin-burns-pdf.jpg"},{"id":"m2lab5-img-01","ch":5,"section":"Image ID","img":"images/ch5-melanocytes.jpg","q":"Identify how melanocytes deliver pigment to keratinocytes.","a":"MELANOCYTE — sits in stratum basale; produces MELANIN inside MELANOSOMES.\nMelanocyte processes (dendrites) extend up through stratum spinosum and transfer melanosomes to KERATINOCYTES.\nKeratinocytes store melanin caps over their nuclei to absorb UV and protect DNA.\nSkin color difference = AMOUNT/TYPE of melanin produced, NOT the number of melanocytes.","imgBack":"images/labeled-skin-melanocytes-pdf.jpg"},{"id":"m2lab5-img-02","ch":5,"section":"Image ID","img":"images/ch5-acne.jpg","q":"Identify the steps in acne formation.","a":"1. Sebaceous (oil) gland produces excess sebum (often hormone-driven).\n2. Dead keratinocytes + sebum CLOG the hair follicle/pore.\n3. CLOGGED FOLLICLE forms a comedone — closed (whitehead) or open (blackhead — oxidized melanin/keratin, NOT dirt).\n4. Propionibacterium acnes proliferates in trapped sebum.\n5. Inflammation — papule/pustule (immune response = pus).\n6. Severe: cyst/nodule + scarring if dermis is damaged.","imgBack":"images/labeled-skin-acne-pdf.jpg"}]},{"key":"m2lab6","name":"Module 2 Lab — Chapter 6","sub":"Bone tissue + osteology · 98 cards","cards":[{"id":"m2bone-prac-01","ch":6,"section":"Practice","q":"Write the functions of the skeletal system.","a":"(1) SUPPORT — framework.  (2) PROTECTION — skull→brain, ribs→heart/lungs, vertebrae→cord, pelvis→reproductive organs.  (3) MOVEMENT/LEVERAGE — bones act as levers, muscles pull.  (4) MINERAL STORAGE — Ca and phosphate.  (5) FAT STORAGE — yellow marrow.  (6) HEMATOPOIESIS — blood cell formation in red marrow."},{"id":"m2bone-prac-02","ch":6,"section":"Practice","q":"The tip of a long bone is called the ___________. The humerus is an example of a(n) ________ bone. The carpals are examples of ________ bones. A rib is an example of a ________ bone.","a":"EPIPHYSIS. LONG bone (humerus). SHORT bones (carpals). FLAT bone (rib)."},{"id":"m2bone-prac-03","ch":6,"section":"Practice","q":"Small, oddly shaped bones that fill gaps between bones of the skull are called ________ bones. A hole through a bone is termed a __________.","a":"SUTURAL (or Wormian) bones. A hole through a bone = FORAMEN."},{"id":"m2bone-prac-04","ch":6,"section":"Practice","q":"The large proximal projection on the femur is the __________. The smooth, rounded articular process of a bone is a _____________. A shallow depression on a bone is a ___________.","a":"TROCHANTER (greater trochanter of femur). Rounded articular process = CONDYLE (or head). Shallow depression = FOSSA."},{"id":"m2bone-prac-05","ch":6,"section":"Practice","q":"Cells that secrete the organic components of the bone matrix are called _____________. The space occupied by an osteocyte is called a _________.","a":"OSTEOBLASTS secrete osteoid (organic matrix = mostly collagen). The space is a LACUNA."},{"id":"m2bone-prac-06","ch":6,"section":"Practice","q":"The narrow passageways that contain cytoplasmic extensions of osteocytes are called ____________. The central canal of an osteon contains blood vessels.","a":"CANALICULI (tiny channels connecting lacunae)."},{"id":"m2bone-prac-07","ch":6,"section":"Practice","q":"The structural units of mature compact bone are called ___________. Fat is stored within the ____________ cavity.","a":"OSTEONS (Haversian systems). Fat is stored in the MEDULLARY cavity (yellow bone marrow)."},{"id":"m2bone-prac-08","ch":6,"section":"Practice","q":"The lining of the medullary cavity is called the _________________.","a":"ENDOSTEUM (delicate CT lining)."},{"id":"m2bone-prac-09","ch":6,"section":"Practice","q":"Excessive growth hormone PRIOR to puberty could result in ___________.","a":"GIGANTISM (excessive growth at open epiphyseal plates). After plates close it produces ACROMEGALY (thicker bones in face, hands, jaw)."},{"id":"m2bone-prac-10","ch":6,"section":"Practice","q":"A child with rickets often has __________ legs.","a":"BOWED (bent) legs — soft, under-mineralized bones bend under weight. Rickets = vitamin D deficiency in children → poor Ca absorption."},{"id":"m2bone-prac-11","ch":6,"section":"Practice","q":"Bone plays a central role in the regulation of blood levels of ______________.","a":"CALCIUM (and phosphate). Controlled by PTH (raises Ca via osteoclasts/kidney/gut) and calcitonin (lowers Ca)."},{"id":"m2bone-prac-12","ch":6,"section":"Practice","q":"A condition in which bone becomes riddled with holes is called ______________.","a":"OSTEOPOROSIS (bone resorption exceeds deposition — common postmenopausal due to estrogen drop)."},{"id":"m2bone-prac-13","ch":6,"section":"Practice","q":"The adult skeleton contains ________ major bones.","a":"206 (varies a bit by age/genetic variation; ~270 at birth, decreases via fusion during adolescence)."},{"id":"m2bone-prac-14","ch":6,"section":"Practice","q":"In bone, the calcium phosphate forms crystals of ________________.","a":"HYDROXYAPATITE — Ca₁₀(PO₄)₆(OH)₂. The inorganic component (~2/3 of bone weight) responsible for hardness."},{"id":"m2bone-prac-15","ch":6,"section":"Practice","q":"Cells that free calcium from bone to maintain blood calcium levels are called ____________.","a":"OSTEOCLASTS (multinucleated bone-resorbing cells derived from monocytes). PTH stimulates them."},{"id":"m2bone-mark-01","ch":6,"section":"Markings","q":"BONE MARKING — define: ARTICULATION","a":"Where two bones meet (e.g., knee joint)."},{"id":"m2bone-mark-02","ch":6,"section":"Markings","q":"BONE MARKING — define: HEAD","a":"Prominent rounded surface — articulating (e.g., head of femur, head of humerus)."},{"id":"m2bone-mark-03","ch":6,"section":"Markings","q":"BONE MARKING — define: FACET","a":"Flat (smooth) surface for articulation (e.g., articular facets of vertebrae)."},{"id":"m2bone-mark-04","ch":6,"section":"Markings","q":"BONE MARKING — define: CONDYLE","a":"C-shaped rounded articular surface (e.g., occipital condyles, medial/lateral condyles of femur)."},{"id":"m2bone-mark-05","ch":6,"section":"Markings","q":"BONE MARKING — define: PROJECTION","a":"Raised marking (general category — includes processes, tubercles, etc.)."},{"id":"m2bone-mark-06","ch":6,"section":"Markings","q":"BONE MARKING — define: PROTUBERANCE","a":"Protruding bump (e.g., mental protuberance — the chin)."},{"id":"m2bone-mark-07","ch":6,"section":"Markings","q":"BONE MARKING — define: PROCESS","a":"Projection or outgrowth from a bone (e.g., transverse process of vertebra; mastoid process)."},{"id":"m2bone-mark-08","ch":6,"section":"Markings","q":"BONE MARKING — define: SPINE","a":"Sharp, slender, pointed process (e.g., ischial spine; spine of the scapula)."},{"id":"m2bone-mark-09","ch":6,"section":"Markings","q":"BONE MARKING — define: TUBERCLE","a":"Small, rounded process (e.g., greater + lesser tubercles of the humerus)."},{"id":"m2bone-mark-10","ch":6,"section":"Markings","q":"BONE MARKING — define: TUBEROSITY","a":"Larger rough/raised surface for attachment (e.g., deltoid tuberosity of humerus; ischial tuberosity)."},{"id":"m2bone-mark-11","ch":6,"section":"Markings","q":"BONE MARKING — define: LINE","a":"Slight, elongated ridge (e.g., temporal lines of the skull)."},{"id":"m2bone-mark-12","ch":6,"section":"Markings","q":"BONE MARKING — define: CREST","a":"Sharp ridge (e.g., iliac crest of the hip)."},{"id":"m2bone-mark-13","ch":6,"section":"Markings","q":"BONE MARKING — define: FOSSA","a":"Shallow depression (e.g., mandibular fossa; coronoid fossa of humerus)."},{"id":"m2bone-mark-14","ch":6,"section":"Markings","q":"BONE MARKING — define: FOVEA","a":"Small pit or depression (e.g., fovea capitis on the head of the femur)."},{"id":"m2bone-mark-15","ch":6,"section":"Markings","q":"BONE MARKING — define: SULCUS","a":"Groove (e.g., intertubercular sulcus of humerus; sigmoid sulcus)."},{"id":"m2bone-mark-16","ch":6,"section":"Markings","q":"BONE MARKING — define: CANAL","a":"Passage(way) through bone (e.g., auditory canal; optic canal)."},{"id":"m2bone-mark-17","ch":6,"section":"Markings","q":"BONE MARKING — define: FISSURE","a":"Slit-like opening through bone (e.g., superior orbital fissure)."},{"id":"m2bone-mark-18","ch":6,"section":"Markings","q":"BONE MARKING — define: FORAMEN","a":"Hole through bone (e.g., foramen magnum; obturator foramen)."},{"id":"m2bone-mark-19","ch":6,"section":"Markings","q":"BONE MARKING — define: MEATUS","a":"Tube-like opening into a canal (e.g., external auditory meatus)."},{"id":"m2bone-mark-20","ch":6,"section":"Markings","q":"BONE MARKING — define: SINUS","a":"Air-filled space inside a bone (e.g., paranasal/nasal sinuses)."},{"id":"m2bone-mark-21","ch":6,"section":"Markings","q":"FACET vs CONDYLE — quick contrast","a":"FACET = flat surface. CONDYLE = rounded C-shaped surface. Both are articular but very different shapes."},{"id":"m2bone-c-01","ch":6,"section":"Lecture","q":"How many bones in the adult skeleton vs at birth?","a":"Adult ≈ 206. Birth ≈ 270. Number decreases during adolescence by fusion (e.g., sacrum from 5 vertebrae, coccyx from 4, ilium+ischium+pubis → coxa)."},{"id":"m2bone-c-02","ch":6,"section":"Lecture","q":"Axial skeleton — how many bones and what's included?","a":"80 bones. Includes: SKULL (29 — cranium 8, face 14, ear ossicles 6, hyoid 1), VERTEBRAL COLUMN (26), THORAX (25 — ribs + sternum)."},{"id":"m2bone-c-03","ch":6,"section":"Lecture","q":"Appendicular skeleton — how many bones and what's included?","a":"126 bones. UPPER: pectoral girdle (4) + arms (60). LOWER: pelvic girdle (2) + legs (60)."},{"id":"m2bone-c-04","ch":6,"section":"Lecture","q":"Name the 5 bone shape classifications with an example of each.","a":"LONG (femur), SHORT (carpals), FLAT (sternum), IRREGULAR (vertebrae), SESAMOID (patella). Plus SUTURAL (Wormian) — extras between cranial sutures."},{"id":"m2bone-c-05","ch":6,"section":"Lecture","q":"4 types of bone cells and their function.","a":"OSTEOPROGENITOR — stem cells (only ones that divide) → give rise to osteoblasts.  OSTEOBLASTS — BUILD bone (secrete osteoid).  OSTEOCYTES — mature, in lacunae, maintain matrix.  OSTEOCLASTS — RESORB bone (release Ca to blood; from monocytes; multinucleated)."},{"id":"m2bone-c-06","ch":6,"section":"Lecture","q":"3 vitamins critical for bone health and what they do.","a":"Vit D — required for Ca ABSORPTION (sunlight + diet).  Vit A — needed for bone RESORPTION/remodeling.  Vit C — required for COLLAGEN synthesis (no collagen = scurvy)."},{"id":"m2bone-c-07","ch":6,"section":"Lecture","q":"What are the 3 linings/coverings of a long bone?","a":"PERIOSTEUM — outer fibrous CT covering, continuous with ligaments + tendons.  ENDOSTEUM — delicate inner CT lining of medullary cavity + canals.  ARTICULAR CARTILAGE — thin hyaline cartilage on joint surfaces (no friction)."},{"id":"m2bone-c-08","ch":6,"section":"Lecture","q":"What is the diaphysis vs epiphyses?","a":"DIAPHYSIS — the long shaft. Mostly COMPACT bone with osteons; yellow marrow inside medullary cavity.  EPIPHYSES — expanded ends. Mostly SPONGY bone; contain RED marrow (hematopoietic)."},{"id":"m2bone-c-09","ch":6,"section":"Lecture","q":"Where is red bone marrow found in adults?","a":"Spongy bone of the EPIPHYSES of long bones (femur, humerus head), plus FLAT and IRREGULAR bones (sternum, ilium, vertebrae, ribs). Site of hematopoiesis."},{"id":"m2bone-c-10","ch":6,"section":"Lecture","q":"Where is yellow bone marrow found and what does it contain?","a":"Inside the MEDULLARY CAVITY of the diaphysis of long bones. Mostly FAT (adipocytes). Inactive in hematopoiesis but can convert to red marrow in emergency."},{"id":"m2bone-c-11","ch":6,"section":"Lecture","q":"What is the epiphyseal line?","a":"Remnant of the EPIPHYSEAL DISK (growth plate). Forms when cartilage fully ossifies (early 20s) — bone stops growing in length."},{"id":"m2bone-c-12","ch":6,"section":"Lecture","q":"Parts of an OSTEON (Haversian system).","a":"CENTRAL (HAVERSIAN) CANAL — contains blood vessels + nerve.  CONCENTRIC LAMELLAE — rings of calcified matrix around canal.  LACUNAE — small spaces housing osteocytes.  CANALICULI — tiny channels connecting lacunae.  Plus surrounding INTERSTITIAL LAMELLAE (remnants of old osteons) and CIRCUMFERENTIAL LAMELLAE (around bone perimeter)."},{"id":"m2bone-c-13","ch":6,"section":"Lecture","q":"What is a Volkmann's (perforating) canal?","a":"A canal that runs PERPENDICULAR to the central (Haversian) canals — connects them to each other and to the periosteum. Carries blood vessels and nerves between osteons."},{"id":"m2bone-c-14","ch":6,"section":"Lecture","q":"Spongy bone structure — what are TRABECULAE?","a":"Tiny needle-like or flat 'spicules' of bone arranged in a 3-D network with marrow spaces between. Aligned along stress lines for strength with low weight. Have osteocytes in lacunae just like compact bone, but no osteons."},{"id":"m2bone-c-15","ch":6,"section":"Lecture","q":"What is appositional growth?","a":"Bone growth in WIDTH — osteoblasts under the periosteum add bone to the outer surface while osteoclasts remove bone from the inner surface, widening the bone and the medullary cavity. Also responsible for bone REMODELING in response to stress (Wolff's law)."},{"id":"m2bone-c-16","ch":6,"section":"Lecture","q":"Wolff's law in one sentence.","a":"Bone is laid down where stress is applied and resorbed where it is not — more stress → more bone deposition; less stress (cast, bedrest) → bone wastes away."},{"id":"m2bone-img-01","ch":6,"section":"Image ID","img":"images/bone-long-anatomy.jpg","q":"Identify all labeled structures of this long bone.","a":"PROXIMAL EPIPHYSIS (top end with spongy bone).  ARTICULAR CARTILAGE (covers joint surfaces).  SPONGY (cancellous) bone.  EPIPHYSEAL LINE (remnant of growth plate).  METAPHYSIS (transition zone).  DIAPHYSIS (shaft).  COMPACT bone.  MEDULLARY CAVITY (with yellow marrow).  PERIOSTEUM (outer CT covering).  ENDOSTEUM (inner lining).  NUTRIENT FORAMEN + nutrient artery.  DISTAL EPIPHYSIS (bottom end).","imgBack":"images/labeled-bone-long-anatomy-pdf.jpg"},{"id":"m2bone-img-02","ch":6,"section":"Image ID","img":"images/bone-classification.jpg","q":"Identify the 5 bone shape categories shown.","a":"LONG (e.g., humerus, femur — longer than wide).  SHORT (carpals, tarsals — cube-like).  FLAT (sternum, skull, ribs — thin, parallel surfaces).  IRREGULAR (vertebrae, facial bones — complex shape).  SESAMOID (patella — embedded in tendon).","imgBack":"images/labeled-bone-classification-pdf.jpg"},{"id":"m2bone-img-03","ch":6,"section":"Image ID","img":"images/bone-compact.jpg","q":"Identify the labeled parts of this compact bone (osteon view).","a":"OSTEON (Haversian system).  CENTRAL (Haversian) CANAL — vessels/nerve inside.  CONCENTRIC LAMELLAE — rings of matrix.  LACUNAE — spaces with osteocytes.  CANALICULI — tiny channels connecting lacunae.  PERFORATING (Volkmann's) CANAL — perpendicular vessel canal.  INTERSTITIAL LAMELLAE (remnants between osteons).  CIRCUMFERENTIAL LAMELLAE (outer ring).","imgBack":"images/labeled-bone-compact-pdf.jpg"},{"id":"m2bone-img-04","ch":6,"section":"Image ID","img":"images/bone-spongy.jpg","q":"Identify the labeled parts of this spongy bone.","a":"TRABECULAE — the bony spicules forming the network.  RED MARROW in the spaces between trabeculae (hematopoiesis).  Osteocytes in LACUNAE within trabeculae.  No osteons (vessels run between trabeculae instead).","imgBack":"images/labeled-bone-spongy-pdf.jpg"},{"id":"m2bone-img-05","ch":6,"section":"Image ID","img":"images/bone-cells.jpg","q":"Identify the 4 bone cell types shown.","a":"OSTEOPROGENITOR (osteogenic) — stem cell; in periosteum/endosteum; only one that divides.  OSTEOBLAST — builds bone, secretes osteoid.  OSTEOCYTE — mature cell in lacuna; maintains matrix.  OSTEOCLAST — multinucleated; resorbs bone; from monocyte lineage.","imgBack":"images/labeled-bone-cells-pdf.jpg"},{"id":"m2bone-img-06","ch":6,"section":"Image ID","img":"images/bone-markings.jpg","q":"Identify the bone markings shown (general categories).","a":"Categories shown: ARTICULATIONS (head, facet, condyle), PROJECTIONS (process, spine, tubercle, tuberosity, line, crest), DEPRESSIONS (fossa, fovea, sulcus), HOLES/OPENINGS (foramen, fissure, meatus, canal, sinus).","imgBack":"images/labeled-bone-markings-pdf.jpg"},{"id":"m2bone-img-07","ch":6,"section":"Image ID","img":"images/bone-endochondral.jpg","q":"Identify the stages of ENDOCHONDRAL ossification.","a":"1. Hyaline cartilage MODEL forms.  2. Cartilage calcifies and a periosteal bone collar forms around diaphysis.  3. PRIMARY ossification center forms in shaft; osteoblasts replace cartilage with bone.  4. MEDULLARY CAVITY hollows out as osteoclasts resorb central bone.  5. SECONDARY ossification centers form in epiphyses.  6. EPIPHYSEAL PLATES remain between primary + secondary centers; allow continued growth.  7. Plates close in early 20s — leaves epiphyseal LINE.","imgBack":"images/labeled-bone-endochondral-pdf.jpg"},{"id":"m2bone-img-08","ch":6,"section":"Image ID","img":"images/bone-intramembranous.jpg","q":"Identify the steps of INTRAMEMBRANOUS ossification.","a":"1. Mesenchymal cells cluster → OSSIFICATION CENTER.  2. Cells differentiate into osteoblasts → secrete OSTEOID → matrix calcifies.  3. Trabeculae form around blood vessels → SPONGY BONE.  4. Periosteum forms outside; outer trabeculae remodel into COMPACT BONE.  Used for: FLAT BONES of the skull, clavicle, mandible, patella.","imgBack":"images/labeled-bone-intramembranous-pdf.jpg"},{"id":"m2bone-img-09","ch":6,"section":"Image ID","img":"images/bone-fractures.jpg","q":"Identify the 9+ fracture types.","a":"TRANSVERSE — perpendicular break.  LINEAR — parallel to long axis.  OBLIQUE — diagonal.  SPIRAL — twisting break.  COMMINUTED — shattered into pieces.  COMPRESSION — crushed (vertebrae).  GREENSTICK — incomplete break (children).  EPIPHYSEAL — through growth plate.  IMPACTED — ends driven into each other.  COMPOUND (open) — pierces skin.  SIMPLE (closed) — skin intact.  COLLES — distal radius (fall on outstretched hand).  POTT — ankle malleoli.","imgBack":"images/labeled-bone-fractures-pdf.jpg"},{"id":"m2bone-img-10","ch":6,"section":"Image ID","img":"images/bone-fracture-repair.jpg","q":"Identify the 4 stages of fracture repair.","a":"1. HEMATOMA — blood clot at fracture site.  2. FIBROCARTILAGE CALLUS (soft callus) — fibroblasts + chondroblasts form internal + external callus.  3. BONY CALLUS (hard callus) — callus is replaced by spongy bone.  4. REMODELING — spongy bone is replaced by compact bone; excess removed; bone returns to (near) original shape.","imgBack":"images/labeled-bone-fracture-repair-pdf.jpg"},{"id":"m2bm-wb-01","ch":6,"section":"Skeleton word bank","q":"What is the Clavicle?","a":"Collarbone — S-shaped; sternum to acromion. Part of pectoral girdle."},{"id":"m2bm-wb-02","ch":6,"section":"Skeleton word bank","q":"What is the Scapula?","a":"Shoulder blade — flat, triangular. Part of pectoral girdle."},{"id":"m2bm-wb-03","ch":6,"section":"Skeleton word bank","q":"What is the Humerus?","a":"Upper arm bone (long)."},{"id":"m2bm-wb-04","ch":6,"section":"Skeleton word bank","q":"What is the Ulna?","a":"Medial forearm bone (with the olecranon for the elbow)."},{"id":"m2bm-wb-05","ch":6,"section":"Skeleton word bank","q":"What is the Radius?","a":"Lateral forearm bone (rotates around ulna)."},{"id":"m2bm-wb-06","ch":6,"section":"Skeleton word bank","q":"What is the Carpals?","a":"8 wrist bones (short)."},{"id":"m2bm-wb-07","ch":6,"section":"Skeleton word bank","q":"What is the Metacarpals?","a":"5 hand bones (palm)."},{"id":"m2bm-wb-08","ch":6,"section":"Skeleton word bank","q":"What is the Phalanges?","a":"Finger / toe bones (14 per hand or foot)."},{"id":"m2bm-wb-09","ch":6,"section":"Skeleton word bank","q":"What is the Femur?","a":"Thigh — longest/strongest bone."},{"id":"m2bm-wb-10","ch":6,"section":"Skeleton word bank","q":"What is the Patella?","a":"Kneecap (sesamoid)."},{"id":"m2bm-wb-11","ch":6,"section":"Skeleton word bank","q":"What is the Tibia?","a":"Medial leg bone — weight-bearing 'shin.'"},{"id":"m2bm-wb-12","ch":6,"section":"Skeleton word bank","q":"What is the Fibula?","a":"Lateral leg bone — non-weight-bearing."},{"id":"m2bm-wb-13","ch":6,"section":"Skeleton word bank","q":"What is the Tarsals?","a":"7 ankle bones (talus, calcaneus, etc.)."},{"id":"m2bm-wb-14","ch":6,"section":"Skeleton word bank","q":"What is the Metatarsals?","a":"5 foot bones."},{"id":"m2bm-wb-15","ch":6,"section":"Skeleton word bank","q":"What is the Frontal?","a":"Forehead bone of the cranium."},{"id":"m2bm-wb-16","ch":6,"section":"Skeleton word bank","q":"What is the Parietal?","a":"Lateral/superior cranial bones (paired)."},{"id":"m2bm-wb-17","ch":6,"section":"Skeleton word bank","q":"What is the Occipital?","a":"Posterior + base of cranium."},{"id":"m2bm-wb-18","ch":6,"section":"Skeleton word bank","q":"What is the Mandible?","a":"Lower jaw — only movable skull bone."},{"id":"m2bm-wb-19","ch":6,"section":"Skeleton word bank","q":"What is the Maxillae?","a":"Upper jaw (paired)."},{"id":"m2bm-wb-20","ch":6,"section":"Skeleton word bank","q":"What is the Sternum?","a":"Breastbone (flat); part of axial skeleton."},{"id":"m2bm-wb-21","ch":6,"section":"Skeleton word bank","q":"What is the Ribs?","a":"12 pairs; thoracic cage."},{"id":"m2bm-wb-22","ch":6,"section":"Skeleton word bank","q":"What is the Vertebrae?","a":"26 bones of the vertebral column."},{"id":"m2bm-wb-23","ch":6,"section":"Skeleton word bank","q":"What is the Sacrum?","a":"5 fused vertebrae forming posterior pelvis."},{"id":"m2bm-wb-24","ch":6,"section":"Skeleton word bank","q":"What is the Coccyx?","a":"Tailbone — 4 fused vertebrae."},{"id":"m2bm-wb-25","ch":6,"section":"Skeleton word bank","q":"What is the Ilium?","a":"Superior portion of coxa (hip)."},{"id":"m2bm-wb-26","ch":6,"section":"Skeleton word bank","q":"What is the Ischium?","a":"Inferior-posterior coxa — 'sit bone.'"},{"id":"m2bm-wb-27","ch":6,"section":"Skeleton word bank","q":"What is the Pubis?","a":"Anterior coxa."},{"id":"m2lab6-img-01","ch":6,"section":"Image ID","img":"images/ch6-bone-marrow.jpg","q":"Identify red vs yellow bone marrow — where and what they do.","a":"RED BONE MARROW — found in SPONGY bone of epiphyses (long bones) + flat/irregular bones (sternum, ilium, vertebrae, ribs). Site of HEMATOPOIESIS (RBC, WBC, platelet production).\nYELLOW BONE MARROW — fills MEDULLARY CAVITY of long-bone shafts. Mostly fat (adipocytes); inactive in hematopoiesis but can convert to red marrow in emergencies (severe anemia, blood loss).","imgBack":"images/labeled-bone-marrow-pdf.jpg"},{"id":"m2lab6-img-02","ch":6,"section":"Image ID","img":"images/ch6-flat-bone.jpg","q":"Identify the layers of a flat bone (skull/sternum).","a":"DIPLOË (Greek for 'double') — spongy bone layer in the middle of a flat bone, sandwiched between two layers of compact bone.\nOuter + inner tables of COMPACT BONE.\nPERIOSTEUM covers outer surface; ENDOSTEUM lines internal trabecular spaces.\nSpongy/diploë spaces contain RED MARROW (e.g., in sternum — common biopsy site).","imgBack":"images/labeled-bone-flat-pdf.jpg"},{"id":"m2lab6-img-03","ch":6,"section":"Image ID","img":"images/ch6-bone-blood-supply.jpg","q":"Identify the blood supply structures of a long bone.","a":"NUTRIENT ARTERY enters via NUTRIENT FORAMEN — supplies diaphysis and marrow.\nMETAPHYSEAL/EPIPHYSEAL arteries supply the ends.\nPERIOSTEAL arteries supply outer compact bone via perforating canals.\nInside compact bone: vessels run in CENTRAL (Haversian) canals (lengthwise) and PERFORATING (Volkmann's) canals (perpendicular).\nVEINS exit alongside arteries via the foramina.","imgBack":"images/labeled-bone-blood-supply-pdf.jpg"},{"id":"m2lab6-img-04","ch":6,"section":"Image ID","img":"images/ch6-compact-bone-diagram.jpg","q":"Identify all structures in this compact bone diagram.","a":"OSTEON (Haversian system) — basic structural unit.\nCENTRAL (Haversian) CANAL — vessel/nerve runs longitudinally.\nCONCENTRIC LAMELLAE — rings of calcified matrix around canal.\nLACUNAE — small spaces with osteocytes inside.\nCANALICULI — tiny channels linking lacunae for nutrient diffusion.\nPERFORATING (Volkmann's) CANALS — perpendicular vessel canals.\nINTERSTITIAL LAMELLAE — remnants of old osteons between current ones.\nCIRCUMFERENTIAL LAMELLAE — outermost rings under periosteum + innermost under endosteum.\nPERIOSTEUM (outer covering); ENDOSTEUM (inner lining).","imgBack":"images/labeled-bone-compact-pdf.jpg"},{"id":"m2lab6-img-05","ch":6,"section":"Image ID","img":"images/ch6-periosteum-endosteum.jpg","q":"Identify periosteum and endosteum.","a":"PERIOSTEUM — outer fibrous CT covering of bone (everywhere except articular cartilage). 2 layers:\n  • Outer FIBROUS layer (dense irregular CT) — anchors tendons, ligaments via Sharpey's fibers.\n  • Inner CELLULAR layer — contains osteogenic cells, osteoblasts, osteoclasts for growth/repair.\nENDOSTEUM — delicate inner CT lining of medullary cavity, central canals, and trabeculae. Contains osteogenic cells, osteoblasts, osteoclasts.","imgBack":"images/labeled-bone-periosteum-endosteum-pdf.jpg"},{"id":"m2lab6-img-06","ch":6,"section":"Image ID","img":"images/ch6-long-bone-growth.jpg","q":"Identify the zones of the EPIPHYSEAL PLATE (growth plate) — direction of growth.","a":"From EPIPHYSIS side → DIAPHYSIS side (in order growth happens):\n1. ZONE OF RESERVE CARTILAGE — resting chondrocytes anchor plate to epiphysis.\n2. ZONE OF PROLIFERATION — chondrocytes divide rapidly, stacking in columns (pushes epiphysis away from diaphysis).\n3. ZONE OF HYPERTROPHY — chondrocytes enlarge.\n4. ZONE OF CALCIFICATION — matrix calcifies; chondrocytes die (no nutrients).\n5. ZONE OF OSSIFICATION — osteoblasts invade and replace calcified cartilage with bone matrix.\nClosure (early 20s): plate becomes epiphyseal LINE; no more growth in length.","imgBack":"images/labeled-bone-longitudinal-growth-pdf.jpg"},{"id":"m2lab6-img-07","ch":6,"section":"Image ID","img":"images/ch6-epiphyseal-plate-line.jpg","q":"Identify the epiphyseal plate vs epiphyseal line — when each occurs.","a":"EPIPHYSEAL PLATE — actively growing HYALINE CARTILAGE disc between epiphysis and metaphysis during adolescence. Visible as a clear band on X-ray.\nEPIPHYSEAL LINE — what's left AFTER growth stops (early 20s); the cartilage has been fully replaced by bone, leaving only a faint LINE. Indicates closed growth plate; no more longitudinal growth.","imgBack":"images/labeled-bone-epiphyseal-plate-line-pdf.jpg"},{"id":"m2lab6-img-08","ch":6,"section":"Image ID","img":"images/ch6-pagets.jpg","q":"Identify and explain what's happening in Paget's disease.","a":"PAGET'S DISEASE OF BONE — chronic disorder of bone remodeling. Overactive OSTEOCLASTS resorb bone too fast; osteoblasts compensate by making excessive disorganized new bone (mosaic pattern).\nResult: weak, enlarged, deformed bones that fracture easily.\nCommon sites: pelvis, femur, spine, skull. Bowed legs, enlarged skull, hearing loss (cranial nerve compression).\nTreatment: bisphosphonates (inhibit osteoclasts).","imgBack":"images/labeled-bone-pagets-pdf.jpg"},{"id":"m2lab6-img-09","ch":6,"section":"Image ID","img":"images/ch6-longitudinal-growth.jpg","q":"Identify how longitudinal bone growth occurs (alternative diagram).","a":"Hyaline CARTILAGE in the epiphyseal plate gets ADDED to on the EPIPHYSEAL side (chondrocyte proliferation), while it's REPLACED BY BONE on the DIAPHYSEAL side.\nNet result: epiphysis moves AWAY from diaphysis → bone grows longer.\nDriven by GROWTH HORMONE (pituitary) and SEX HORMONES (which eventually CLOSE the plate at puberty's end).\nOnce plate closes (epiphyseal LINE), no more length growth — only WIDTH via appositional growth.","imgBack":"images/labeled-bone-longitudinal-growth-pdf.jpg"}]},{"key":"s2m1","name":"Module 1","sub":"Special Senses (Ch 14) · Autonomic NS (15) · Endocrine (17)","semester":2,"cards":[{"id":"s2-c14-rq12","ch":14,"section":"RQ","q":"What type of receptor cell is responsible for transducing pain stimuli?","opts":["A. mechanoreceptor","B. nociceptor","C. osmoreceptor","D. photoreceptor"],"a":"B. nociceptor"},{"id":"s2-c14-rq13","ch":14,"section":"RQ","q":"Which of these cranial nerves is part of the gustatory system?","opts":["A. olfactory","B. trochlear","C. trigeminal","D. facial"],"a":"D. facial"},{"id":"s2-c14-rq14","ch":14,"section":"RQ","q":"Which submodality of taste is sensitive to the pH of saliva?","opts":["A. umami","B. sour","C. bitter","D. sweet"],"a":"B. sour"},{"id":"s2-c14-rq15","ch":14,"section":"RQ","q":"Axons from which neuron in the retina make up the optic nerve?","opts":["A. amacrine cells 602     14 • Review Questions Access for free at openstax.org","B. photoreceptors","C. bipolar cells","D. retinal ganglion cells"],"a":"D. retinal ganglion cells"},{"id":"s2-c14-rq16","ch":14,"section":"RQ","q":"What type of receptor cell is involved in the sensations of sound and balance?","opts":["A. photoreceptor","B. chemoreceptor","C. mechanoreceptor","D. nociceptor"],"a":"C. mechanoreceptor"},{"id":"s2-c14-rq17","ch":14,"section":"RQ","q":"Which of these sensory modalities does not pass through the ventral posterior thalamus?","opts":["A. gustatory","B. proprioception","C. audition","D. nociception"],"a":"C. audition"},{"id":"s2-c14-rq18","ch":14,"section":"RQ","q":"Which nucleus in the medulla is connected to the inferior colliculus?","opts":["A. solitary nucleus","B. vestibular nucleus","C. chief sensory nucleus","D. cochlear nucleus"],"a":"D. cochlear nucleus"},{"id":"s2-c14-rq19","ch":14,"section":"RQ","q":"Visual stimuli in the upper-left visual field will be processed in what region of the primary visual cortex?","opts":["A. inferior right","B. inferior left","C. superior right","D. superior left"],"a":"A. inferior right"},{"id":"s2-c14-rq20","ch":14,"section":"RQ","q":"Which location on the body has the largest region of somatosensory cortex representing it, according to the sensory homunculus?","opts":["A. lips","B. thigh","C. elbow","D. neck"],"a":"A. lips"},{"id":"s2-c14-rq21","ch":14,"section":"RQ","q":"Which of the following is a direct target of the vestibular ganglion?","opts":["A. superior colliculus","B. cerebellum","C. thalamus","D. optic chiasm"],"a":"B. cerebellum"},{"id":"s2-c14-rq22","ch":14,"section":"RQ","q":"Which region of the frontal lobe is responsible for initiating movement by directly connecting to cranial and spinal motor neurons?","opts":["A. prefrontal cortex","B. supplemental motor area","C. premotor cortex","D. primary motor cortex"],"a":"D. primary motor cortex"},{"id":"s2-c14-rq23","ch":14,"section":"RQ","q":"Which extrapyramidal tract incorporates equilibrium sensations with motor commands to aid in posture and movement?","opts":["A. tectospinal tract","B. vestibulospinal tract","C. reticulospinal tract 14 • Review Questions     603","D. corticospinal tract"],"a":"B. vestibulospinal tract"},{"id":"s2-c14-rq24","ch":14,"section":"RQ","q":"Which region of gray matter in the spinal cord contains motor neurons that innervate skeletal muscles?","opts":["A. ventral horn","B. dorsal horn","C. lateral horn","D. lateral column"],"a":"A. ventral horn"},{"id":"s2-c14-rq25","ch":14,"section":"RQ","q":"What type of reflex can protect the foot when a painful stimulus is sensed?","opts":["A. stretch reflex","B. gag reflex","C. withdrawal reflex","D. corneal reflex"],"a":"C. withdrawal reflex"},{"id":"s2-c14-rq26","ch":14,"section":"RQ","q":"What is the name for the topographical representation of the sensory input to the somatosensory cortex?","opts":["A. homunculus","B. homo sapiens","C. postcentral gyrus","D. primary cortex"],"a":"A. homunculus"},{"id":"s2-c14-ct27","ch":14,"section":"CT","q":"The sweetener known as stevia can replace glucose in food. What does the molecular similarity of stevia to glucose mean for the gustatory sense?","a":"The stevia molecule is similar to glucose such that it will bind to the glucose receptor in sweet-sensitive taste buds. However, it is not a substrate for the ATP-generating metabolism within cells."},{"id":"s2-c14-ct28","ch":14,"section":"CT","q":"Why does the blind spot from the optic disc in either eye not result in a blind spot in the visual field?","a":"The visual field for each eye is projected onto the retina as light is focused by the lens. The visual information from the right visual field falls on the left side of the retina and vice versa. The optic disc in the right eye is on the medial side of the fovea, which would be the left side of the retina. However, the optic disc in the left eye would be on the right side of that fovea, so the right visual field falls on the side of the retina in the left field where there is no blind spot."},{"id":"s2-c14-ct29","ch":14,"section":"CT","q":"Following a motorcycle accident, the victim loses the ability to move the right leg but has normal control over the left one, suggesting a hemisection somewhere in the thoracic region of the spinal cord. What sensory deficits would be expected in terms of touch versus pain? Explain your answer.","a":"The right leg would feel painful stimuli, but not touch, because the spinothalamic tract decussates at the level of entry, which would be below the injury, whereas the dorsal column system does not decussate until reaching the brain stem, which would be above the injury and thus those fibers would be damaged."},{"id":"s2-c14-ct30","ch":14,"section":"CT","q":"A pituitary tumor can cause perceptual losses in the lateral visual field. The pituitary gland is located directly inferior to the hypothalamus. Why would this happen?","a":"As the tumor enlarges, it would press against the optic chiasm, and fibers from the medial retina would be disrupted. These fibers carry information about the lateral visual field because the visual scene is reversed as the light passes through the pupil and lens."},{"id":"s2-c14-ct31","ch":14,"section":"CT","q":"The prefrontal lobotomy is a drastic—and largely out-of-practice—procedure used to disconnect that portion of the cerebral cortex from the rest of the frontal lobe and the diencephalon as a psychiatric therapy. Why would this have been thought necessary for someone with a potentially uncontrollable behavior?","a":"The prefrontal cortex is involved in decision-making functions that lead to motor responses through connections to the more posterior motor regions. These early aspects of behavior are often associated with a person’s personality, so disrupting those connections will lead to severe changes in behavior."},{"id":"s2-c14-ct32","ch":14,"section":"CT","q":"If a reflex is a limited circuit within the somatic system, why do physical and neurological exams include them to test the health of an individual?","a":"Though reflexes are simple circuits within the nervous system, they are representative of the more involved circuits of the somatic nervous system and can be used to quickly assess the state of neurological function for a person. Anatomy &amp; Physiology Unit 3: Regulation, Integration, and Control"},{"id":"s2-c15-rq7","ch":15,"section":"RQ","q":"Which of these physiological changes would not be considered part of the sympathetic fight-or-flight response?","opts":["A. increased heart rate","B. increased sweating","C. dilated pupils","D. increased stomach motility"],"a":"D. increased stomach motility"},{"id":"s2-c15-rq8","ch":15,"section":"RQ","q":"Which type of fiber could be considered the longest?","opts":["A. preganglionic parasympathetic","B. preganglionic sympathetic","C. postganglionic parasympathetic","D. postganglionic sympathetic"],"a":"A. preganglionic parasympathetic"},{"id":"s2-c15-rq9","ch":15,"section":"RQ","q":"Which signaling molecule is most likely responsible for an increase in digestive activity?","opts":["A. epinephrine","B. norepinephrine","C. acetylcholine","D. adrenaline"],"a":"C. acetylcholine"},{"id":"s2-c15-rq10","ch":15,"section":"RQ","q":"Which of these cranial nerves contains preganglionic parasympathetic fibers?","opts":["A. optic, CN II","B. facial, CN VII","C. trigeminal, CN V","D. hypoglossal, CN XII"],"a":"B. facial, CN VII"},{"id":"s2-c15-rq11","ch":15,"section":"RQ","q":"Which of the following is not a target of a sympathetic preganglionic fiber?","opts":["A. intermural ganglion","B. collateral ganglion","C. adrenal gland","D. chain ganglion"],"a":"A. intermural ganglion"},{"id":"s2-c15-rq12","ch":15,"section":"RQ","q":"Which of the following represents a sensory input that is not part of both the somatic and autonomic systems?","opts":["A. vision","B. taste","C. baroreception","D. proprioception"],"a":"C. baroreception"},{"id":"s2-c15-rq13","ch":15,"section":"RQ","q":"What is the term for a reflex that does not include a CNS component?","opts":["A. long reflex","B. visceral reflex","C. somatic reflex","D. short reflex"],"a":"D. short reflex"},{"id":"s2-c15-rq14","ch":15,"section":"RQ","q":"What neurotransmitter will result in constriction of the pupil?","opts":["A. norepinephrine","B. acetylcholine","C. epinephrine 15 • Review Questions     637","D. serotonin"],"a":"B. acetylcholine"},{"id":"s2-c15-rq15","ch":15,"section":"RQ","q":"What gland produces a secretion that causes fight-or-flight responses in effectors?","opts":["A. adrenal medulla","B. salivatory gland","C. reproductive gland","D. thymus"],"a":"A. adrenal medulla"},{"id":"s2-c15-rq16","ch":15,"section":"RQ","q":"Which of the following is an incorrect pairing?","opts":["A. norepinephrine dilates the pupil","B. epinephrine increases blood pressure","C. acetylcholine decreases digestion","D. norepinephrine increases heart rate"],"a":"C. acetylcholine decreases digestion"},{"id":"s2-c15-rq17","ch":15,"section":"RQ","q":"Which of these locations in the forebrain is the master control center for homeostasis through the autonomic and endocrine systems?","opts":["A. hypothalamus","B. thalamus","C. amygdala","D. cerebral cortex"],"a":"A. hypothalamus"},{"id":"s2-c15-rq18","ch":15,"section":"RQ","q":"Which nerve projects to the hypothalamus to indicate the level of light stimuli in the retina?","opts":["A. glossopharyngeal","B. oculomotor","C. optic","D. vagus"],"a":"C. optic"},{"id":"s2-c15-rq19","ch":15,"section":"RQ","q":"What region of the limbic lobe is responsible for generating stress responses via the hypothalamus?","opts":["A. hippocampus","B. amygdala","C. mammillary bodies","D. prefrontal cortex"],"a":"B. amygdala"},{"id":"s2-c15-rq20","ch":15,"section":"RQ","q":"What is another name for the preganglionic sympathetic fibers that project to the heart?","opts":["A. solitary tract","B. vasomotor nerve","C. vagus nerve","D. cardiac accelerator nerve"],"a":"D. cardiac accelerator nerve"},{"id":"s2-c15-rq21","ch":15,"section":"RQ","q":"What central fiber tract connects forebrain and brain stem structures with the hypothalamus?","opts":["A. cardiac accelerator nerve","B. medial forebrain bundle","C. dorsal longitudinal fasciculus","D. corticospinal tract"],"a":"B. medial forebrain bundle"},{"id":"s2-c15-rq22","ch":15,"section":"RQ","q":"A drug that affects both divisions of the autonomic system is going to bind to, or block, which type of neurotransmitter receptor?","opts":["A. nicotinic","B. muscarinic","C. α-adrenergic","D. β-adrenergic"],"a":"A. nicotinic"},{"id":"s2-c15-rq23","ch":15,"section":"RQ","q":"A drug is called an agonist if it ________. 638     15 • Review Questions Access for free at openstax.org","opts":["A. blocks a receptor","B. interferes with neurotransmitter reuptake","C. acts like the endogenous neurotransmitter by binding to its receptor","D. blocks the voltage-gated calcium ion channel"],"a":"C. acts like the endogenous neurotransmitter by binding to its receptor"},{"id":"s2-c15-rq24","ch":15,"section":"RQ","q":"Which type of drug would be an antidote to atropine poisoning?","opts":["A. nicotinic agonist","B. anticholinergic","C. muscarinic agonist","D. α-blocker"],"a":"C. muscarinic agonist"},{"id":"s2-c15-rq25","ch":15,"section":"RQ","q":"Which kind of drug would have anti-anxiety effects?","opts":["A. nicotinic agonist","B. anticholinergic","C. muscarinic agonist","D. α-blocker"],"a":"D. α-blocker"},{"id":"s2-c15-rq26","ch":15,"section":"RQ","q":"Which type of drug could be used to treat asthma by opening airways wider?","opts":["A. sympatholytic drug","B. sympathomimetic drug","C. anticholinergic drug","D. parasympathomimetic drug"],"a":"B. sympathomimetic drug"},{"id":"s2-c15-ct27","ch":15,"section":"CT","q":"In the context of a lioness hunting on the savannah, why would the sympathetic system not activate the digestive system?","a":"Whereas energy is needed for running away from the threat, blood needs to be sent to the skeletal muscles for oxygen supply. The additional fuel, in the form of carbohydrates, probably wouldn’t improve the ability to escape the threat as much as the diversion of oxygen-rich blood would hinder it."},{"id":"s2-c15-ct28","ch":15,"section":"CT","q":"A target effector, such as the heart, receives input from the sympathetic and parasympathetic systems. What is the actual difference between the sympathetic and parasympathetic divisions at the level of those connections (i.e., at the synapse)?","a":"The postganglionic sympathetic fiber releases norepinephrine, whereas the postganglionic parasympathetic fiber releases acetylcholine. Specific locations in the heart have adrenergic receptors and muscarinic receptors. Which receptors are bound is the signal that determines how the heart responds."},{"id":"s2-c15-ct29","ch":15,"section":"CT","q":"Damage to internal organs will present as pain associated with a particular surface area of the body. Why would something like irritation to the diaphragm, which is between the thoracic and abdominal cavities, feel like pain in the shoulder or neck?","a":"The nerves that carry sensory information from the diaphragm enter the spinal cord in the cervical region where somatic sensory fibers from the shoulder and neck would enter. The brain superimposes this experience onto the sensory homunculus where the somatic nerves are connected."},{"id":"s2-c15-ct30","ch":15,"section":"CT","q":"Medical practice is paying more attention to the autonomic system in considering disease states. Why would autonomic tone be important in considering cardiovascular disease?","a":"Within the cardiovascular system, different aspects demonstrate variation in autonomic tone. Heart rate is under parasympathetic tone, and blood pressure is under sympathetic tone. Pharmaceuticals that treat cardiovascular disorders may be more effective if they work with the normal state of the autonomic system. Alternatively, some disorders may be exacerbated by autonomic deficits and common therapies might not be as effective."},{"id":"s2-c15-ct31","ch":15,"section":"CT","q":"Horner’s syndrome is a condition that presents with changes in one eye, such as pupillary constriction and dropping of eyelids, as well as decreased sweating in the face. Why could a tumor in the thoracic cavity have an effect on these autonomic functions?","a":"Pupillary dilation and sweating, two functions lost in Horner’s syndrome, are caused by the sympathetic system. A tumor in the thoracic cavity may interrupt the output of the thoracic ganglia that project to the head and face."},{"id":"s2-c15-ct32","ch":15,"section":"CT","q":"The cardiovascular center is responsible for regulating the
