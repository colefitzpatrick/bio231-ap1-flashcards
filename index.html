. neuroglia","C. oligodendrocytes","D. astrocytes"]},{"id":"m2-c4-q28","ch":4,"section":"RQ","q":"Which of the following processes is not a cardinal sign of inflammation?","a":"C. fever","opts":["A. redness","B. heat","C. fever","D. swelling"]},{"id":"m2-c4-q29","ch":4,"section":"RQ","q":"When a mast cell reacts to an irritation, which of the following chemicals does it release?","a":"B. histamine","opts":["A. collagen","B. histamine","C. hyaluronic acid","D. meylin"]},{"id":"m2-c4-q30","ch":4,"section":"RQ","q":"Atrophy refers to ________.","a":"B. loss of mass","opts":["A. loss of elasticity","B. loss of mass","C. loss of rigidity","D. loss of permeability"]},{"id":"m2-c4-q31","ch":4,"section":"RQ","q":"Individuals can slow the rate of aging by modifying all of these lifestyle aspects except for ________.","a":"C. genetic factors","opts":["A. diet","B. exercise","C. genetic factors","D. stress"]},{"id":"m2-c4-q32","ch":4,"section":"CT","q":"Identify the four types of tissue in the body, and describe the major functions of each tissue.","a":"The four types of tissue in the body are epithelial, connective, muscle, and nervous. Epithelial tissue is made of layers of cells that cover the surfaces of the body that come into contact with the exterior world, line internal cavities, and form glands. Connective tissue binds the cells and organs of the body together and performs many functions, especially in the protection, support, and integration of the body. Muscle tissue, which responds to stimulation and contracts to provide movement, is divided into three major types: skeletal (voluntary) muscles, smooth muscles, and the cardiac muscle in the heart. Nervous tissue allows the body to receive signals and transmit information as electric impulses from one region of the body to another."},{"id":"m2-c4-q33","ch":4,"section":"CT","q":"The zygote is described as totipotent because it ultimately gives rise to all the cells in your body including the highly specialized cells of your nervous system. Describe this transition, discussing the steps and processes that lead to these specialized cells.","a":"The zygote divides into many cells. As these cells become specialized, they lose their ability to differentiate into all tissues. At first they form the three primary germ layers. Following the cells of the ectodermal germ layer, they too become more restricted in what they can form. Ultimately, some of these ectodermal cells become further restricted and differentiate in to nerve cells."},{"id":"m2-c4-q34","ch":4,"section":"CT","q":"What is the function of synovial membranes?","a":"Synovial membranes are a type of connective tissue membrane that supports mobility in joints. The membrane lines the joint cavity and contains fibroblasts that produce hyaluronan, which leads to the production of synovial fluid, a natural lubricant that enables the bones of a joint to move freely against one another."},{"id":"m2-c4-q35","ch":4,"section":"CT","q":"The structure of a tissue usually is optimized for its function. Describe how the structure of individual cells and tissue arrangement of the intestine lining matches its main function, to absorb nutrients.","a":"Columnar epithelia, which form the lining of the digestive tract, can be either simple or stratified. The cells are long and narrow. The nucleus is elongated and located on the basal side of the cell. Ciliated columnar epithelium is composed of simple columnar epithelial cells that display cilia on their apical surfaces."},{"id":"m2-c4-q36","ch":4,"section":"CT","q":"One of the main functions of connective tissue is to integrate organs and organ systems in the body. Discuss how blood fulfills this role.","a":"Blood is a fluid connective tissue, a variety of specialized cells that circulate in a watery fluid containing salts, nutrients, and dissolved proteins in a liquid extracellular matrix. Blood contains formed elements derived from bone marrow. Erythrocytes, or red blood cells, transport the gases oxygen and carbon dioxide. Leukocytes, or white blood cells, are responsible for the defense of the organism against potentially harmful microorganisms or molecules. Platelets are cell fragments involved in blood clotting. Some cells have the ability to cross the endothelial layer that lines vessels and enter adjacent tissues. Nutrients, salts, and waste are dissolved in the liquid matrix and transported through the body."},{"id":"m2-c4-q37","ch":4,"section":"CT","q":"Why does an injury to cartilage, especially hyaline cartilage, heal much more slowly than a bone fracture?","a":"A layer of dense irregular connective tissue covers cartilage. No blood vessels supply cartilage tissue. Injuries to cartilage heal very slowly because cells and nutrients needed for repair diffuse slowly to the injury site."},{"id":"m2-c4-q38","ch":4,"section":"CT","q":"You are watching cells in a dish spontaneously contract. They are all contracting at different rates; some fast, some slow. After a while, several cells link up and they begin contracting in synchrony. Discuss what is going on and what type of cells you are looking at.","a":"The cells in the dish are cardiomyocytes, cardiac muscle cells. They have an intrinsic ability to contract. When they link up, they form intercalating discs that allow the cells to communicate with each other and begin contracting in synchrony."},{"id":"m2-c4-q39","ch":4,"section":"CT","q":"Why does skeletal muscle look striated?","a":"Under the light microscope, cells appear striated due to the arrangement of the contractile proteins actin and myosin."},{"id":"m2-c4-q40","ch":4,"section":"CT","q":"Which morphological adaptations of neurons make them suitable for the transmission of nerve impulse?","a":"Neurons are well suited for the transmission of nerve impulses because short extensions, dendrites, receive impulses from other neurons, while a long tail extension, an axon, carries electrical impulses away from the cell to other neurons."},{"id":"m2-c4-q41","ch":4,"section":"CT","q":"What are the functions of astrocytes?","a":"Astrocytes regulate ions and uptake and/or breakdown of some neurotransmitters and contribute to the formation of the blood-brain-barrier."},{"id":"m2-c4-q42","ch":4,"section":"CT","q":"Why is it important to watch for increased redness, swelling and pain after a cut or abrasion has been cleaned and bandaged?","a":"These symptoms would indicate that infection is present."},{"id":"m2-c4-q43","ch":4,"section":"CT","q":"Aspirin is a non-steroidal anti-inflammatory drug (NSAID) that inhibits the formation of blood clots and is taken regularly by individuals with a heart condition. Steroids such as cortisol are used to control some autoimmune diseases and severe arthritis by down regulating the inflammatory response. After reading the role of inflammation in the body’s response to infection, can you predict an undesirable consequence of taking anti-inflammatory drugs on a regular basis?","a":"Since NSAIDs or other anti-inflammatory drugs inhibit the formation of blood clots, regular and prolonged use of these drugs may promote internal bleeding, such as bleeding in the stomach. Excessive levels of cortisol would suppress inflammation, which could slow the wound healing process."},{"id":"m2-c4-q44","ch":4,"section":"CT","q":"As an individual ages, a constellation of symptoms begins the decline to the point where an individual’s functioning is compromised. Identify and discuss two factors that have a role in factors leading to the compromised situation.","a":"The genetic makeup and the lifestyle of each individual are factors which determine the degree of decline in cells, tissues, and organs as an individual ages."},{"id":"m2-c4-q45","ch":4,"section":"CT","q":"Discuss changes that occur in cells as a person ages.","a":"All cells experience changes with aging. They become larger, and many cannot divide and regenerate. Because of alterations in cell membranes, transport of oxygen and nutrients into the cell and removal of carbon dioxide and waste products are not as efficient in the elderly. Cells lose their ability to function, or they begin to function abnormally, leading to disease and cancer."},{"id":"m2quiz-ch4-q01","ch":4,"section":"Quiz","q":"A tissue with a gel matrix and cells inside lacunae is","opts":["A. areolar connective tissue.","B. cartilage.","C. bone.","D. epithelium.","E. dense regular connective tissue."],"a":"B. cartilage"},{"id":"m2quiz-ch4-q02","ch":4,"section":"Quiz","q":"Antibodies are produced by","opts":["A. macrophages.","B. microphages.","C. plasmocytes.","D. mast cells.","E. fibroblasts."],"a":"C. plasmocytes"},{"id":"m2quiz-ch4-q03","ch":4,"section":"Quiz","q":"Blood is which type of tissue?","opts":["A. mesenchyme","B. nerve","C. epithelial","D. muscle","E. connective"],"a":"E. connective"},{"id":"m2quiz-ch4-q04","ch":4,"section":"Quiz","q":"Cartilage is separated from surrounding tissues by a fibrous","opts":["A. perichondrium.","B. lacunae.","C. periosteum.","D. canaliculi.","E. matrix."],"a":"A. perichondrium"},{"id":"m2quiz-ch4-q05","ch":4,"section":"Quiz","q":"Cells that are flat and thin are classified as","opts":["A. columnar.","B. squamous.","C. blasts.","D. transitional.","E. cuboidal."],"a":"B. squamous"},{"id":"m2quiz-ch4-q06","ch":4,"section":"Quiz","q":"Cells that are specialized for secretion","opts":["A. have a free surface that is flat.","B. have a small nucleus.","C. are usually squamous.","D. exhibit polarity.","E. are found only in the digestive system."],"a":"D. exhibit polarity"},{"id":"m2quiz-ch4-q07","ch":4,"section":"Quiz","q":"Cells that engulf bacteria or cell debris within loose connective tissue are","opts":["A. fibroblasts.","B. macrophages.","C. adipocytes.","D. mast cells.","E. melanocytes."],"a":"B. macrophages"},{"id":"m2quiz-ch4-q08","ch":4,"section":"Quiz","q":"Cells that store fat are called","opts":["A. cellulocytes.","B. macrocytes.","C. adipocytes.","D. podocytes.","E. melanocytes."],"a":"C. adipocytes"},{"id":"m2quiz-ch4-q09","ch":4,"section":"Quiz","q":"Cells that respond to injury by dividing to assist in connective tissue repair are","opts":["A. mast cells.","B. fibroblasts.","C. plasmocytes.","D. mesenchymal stem cells.","E. lymphocytes."],"a":"D. mesenchymal stem cells"},{"id":"m2quiz-ch4-q10","ch":4,"section":"Quiz","q":"Chondroitin sulfate is abundant in the matrix of","opts":["A. epithelial tissue.","B. cartilage.","C. areolar tissue.","D. elastic connective tissue.","E. adipose tissue."],"a":"B. cartilage"},{"id":"m2quiz-ch4-q11","ch":4,"section":"Quiz","q":"Chondrocytes are to cartilage as osteocytes are to","opts":["A. blood.","B. epithelium.","C. fat.","D. bone.","E. neural tissue."],"a":"D. bone"},{"id":"m2quiz-ch4-q12","ch":4,"section":"Quiz (MISSED)","q":"Dead skin cells are shed in thin sheets because they are held together by \"spots\" of proteoglycan reinforced by intermediate filaments. Such strong intercellular connections are called","opts":["A. gap junctions.","B. intermediate junctions.","C. tight junctions.","D. desmosomes.","E. junctional complexes."],"a":"D. desmosomes\n\n🔴 YOU MISSED THIS — She picked: tight junctions\n💡 Why desmosomes: desmosomes are 'spot weld' mechanical connections with proteoglycan plaques reinforced by INTERMEDIATE FILAMENTS. Tight junctions seal cells with claudin/occludin (leak-proof barrier) but don't anchor against shearing."},{"id":"m2quiz-ch4-q13","ch":4,"section":"Quiz","q":"Epithelial cells exhibit modifications that adapt them for","opts":["A. contraction.","B. conduction.","C. secretion.","D. circulation.","E. support."],"a":"C. secretion"},{"id":"m2quiz-ch4-q14","ch":4,"section":"Quiz","q":"Epithelia specialized for providing sensations of smell, taste, sight, equilibrium, and hearing are known as","opts":["A. neuroepithelia.","B. psychoepithelia.","C. neuropsychoepithelia.","D. multilaminar epithelia.","E. protective epithelia."],"a":"A. neuroepithelia"},{"id":"m2quiz-ch4-q15","ch":4,"section":"Quiz","q":"Epithelial cells that are adapted for absorption or secretion usually have ________ at their free surface.","opts":["A. mitochondria","B. cilia","C. microvilli","D. junctional complexes","E. Golgi complexes"],"a":"C. microvilli"},{"id":"m2quiz-ch4-q16","ch":4,"section":"Quiz","q":"Germinative cells","opts":["A. start in the superficial layers of epithelial tissue.","B. cannot divide.","C. make up most of the epithelial type of tissue.","D. divide continually to produce new epithelial cells.","E. cannot function in the repair of epithelial tissue."],"a":"D. divide continually to produce new epithelial cells"},{"id":"m2quiz-ch4-q17","ch":4,"section":"Quiz","q":"Intercalated discs and pacemaker cells are characteristic of","opts":["A. smooth muscle tissue.","B. cardiac muscle tissue.","C. skeletal muscle tissue.","D. all types of muscle tissue.","E. nerve tissue."],"a":"B. cardiac muscle tissue"},{"id":"m2quiz-ch4-q18","ch":4,"section":"Quiz","q":"Glands that secrete their product by the bursting of cells are","opts":["A. apocrine glands.","B. sudoriferous glands.","C. holocrine glands.","D. endocrine glands.","E. merocrine glands."],"a":"C. holocrine glands"},{"id":"m2quiz-ch4-q19","ch":4,"section":"Quiz","q":"Glands that secrete hormones into the interstitial fluid are","opts":["A. endocrine glands.","B. interstitial glands.","C. exocrine glands.","D. merocrine glands.","E. holocrine glands."],"a":"A. endocrine glands"},{"id":"m2quiz-ch4-q20","ch":4,"section":"Quiz","q":"Mesothelium is to the body cavities as endothelium is to the","opts":["A. kidneys.","B. heart and blood vessels.","C. urinary bladder.","D. mouth.","E. large intestine."],"a":"B. heart and blood vessels"},{"id":"m2quiz-ch4-q21","ch":4,"section":"Quiz","q":"The epithelium that forms air sacs in the lungs is","opts":["A. stratified squamous epithelium.","B. simple cuboidal epithelium.","C. simple squamous epithelium.","D. transitional epithelium.","E. simple columnar epithelium."],"a":"C. simple squamous epithelium"},{"id":"m2quiz-ch4-q22","ch":4,"section":"Quiz","q":"The epithelia that line body cavities and blood vessels are classified as","opts":["A. simple squamous.","B. stratified squamous.","C. simple cuboidal.","D. stratified cuboidal.","E. transitional."],"a":"A. simple squamous"},{"id":"m2quiz-ch4-q23","ch":4,"section":"Quiz","q":"The dominant fiber type in dense connective tissue is","opts":["A. collagen.","B. elastin.","C. actin.","D. myosin.","E. connectin."],"a":"A. collagen"},{"id":"m2quiz-ch4-q24","ch":4,"section":"Quiz (MISSED)","q":"The Pap test for cervical cancer utilizes","opts":["A. histology.","B. physiology.","C. anatomy.","D. embryology.","E. exfoliative cytology."],"a":"E. exfoliative cytology\n\n🔴 YOU MISSED THIS — She picked: histology\n💡 Why exfoliative cytology: Pap test scrapes/exfoliates CELLS from the cervix — that's cytology (cells), not histology (tissue)."},{"id":"m2quiz-ch4-q25","ch":4,"section":"Quiz","q":"The heart and blood vessels are lined by","opts":["A. pseudostratified columnar epithelium.","B. transitional epithelium.","C. simple cuboidal epithelium.","D. simple columnar epithelium.","E. simple squamous epithelium."],"a":"E. simple squamous epithelium"},{"id":"m2quiz-ch4-q26","ch":4,"section":"Quiz","q":"The function of simple cuboidal epithelium is","opts":["A. support.","B. protection.","C. phagocytosis.","D. absorption and secretion.","E. storage."],"a":"D. absorption and secretion"},{"id":"m2quiz-ch4-q27","ch":4,"section":"Quiz","q":"The pancreas produces ________ secretions.","opts":["A. serous","B. mucous","C. merocrine","D. exocrine and endocrine","E. secretory"],"a":"D. exocrine and endocrine"},{"id":"m2quiz-ch4-q28","ch":4,"section":"Quiz","q":"The muscle tissue that shows no striations is ________ muscle.","opts":["A. skeletal","B. cardiac","C. smooth","D. voluntary","E. multinucleated"],"a":"C. smooth"},{"id":"m2quiz-ch4-q29","ch":4,"section":"Quiz","q":"The most common type of cartilage is ________ cartilage.","opts":["A. ligamentous","B. hyaline","C. elastic","D. fibrous","E. osseous"],"a":"B. hyaline"},{"id":"m2quiz-ch4-q30","ch":4,"section":"Quiz (MISSED)","q":"Two types of microphages include","opts":["A. mesenchymal cells and melanocytes.","B. mast cells and basophils.","C. fixed macrophages and free macrophages.","D. neutrophils and eosinophils.","E. microphages and adipocytes."],"a":"D. neutrophils and eosinophils\n\n🔴 YOU MISSED THIS — She picked: fixed macrophages and free macrophages\n💡 Why neutrophils + eosinophils: MICROphages = small WBC phagocytes. The two types are neutrophils and eosinophils. MACROphages (fixed/free) are LARGE tissue phagocytes — different category."},{"id":"m2quiz-ch4-q31","ch":4,"section":"Quiz","q":"Tissues that provide strength and support for areas subjected to stresses from many directions are","opts":["A. tendons.","B. ligaments.","C. dense irregular connective tissues.","D. reticular tissues.","E. areolar tissue."],"a":"C. dense irregular connective tissues"},{"id":"m2quiz-ch4-q32","ch":4,"section":"Quiz","q":"Tissue that is specialized for the conduction of electrical impulses is ________ tissue.","opts":["A. connective","B. neural","C. areolar","D. osseous","E. epithelial"],"a":"B. neural"},{"id":"m2quiz-ch4-q33","ch":4,"section":"Quiz","q":"Tissue that is specialized for contraction is ________ tissue.","opts":["A. loose connective","B. dense connective","C. epithelial","D. nerve","E. muscle"],"a":"E. muscle"},{"id":"m2quiz-ch4-q34","ch":4,"section":"Quiz","q":"The two major types of cell layering in epithelia are","opts":["A. simple and proper.","B. stratified and pseudostratified.","C. squamous and simple.","D. simple and stratified.","E. cuboidal and columnar."],"a":"D. simple and stratified"},{"id":"m2quiz-ch4-q35","ch":4,"section":"Quiz","q":"The tissue that always has a \"top\" and a \"bottom\" is","opts":["A. epithelial tissue.","B. connective tissue.","C. muscle tissue.","D. basal tissue.","E. apical tissue."],"a":"A. epithelial tissue"},{"id":"m2quiz-ch4-q36","ch":4,"section":"Quiz","q":"The three types of protein fibers in connective tissue are","opts":["A. tendons, ligaments, and elastic ligaments.","B. loose, dense, and irregular.","C. cartilage, bone, and collagen.","D. collagen, reticular, and elastic.","E. polar, cellular, and permeable."],"a":"D. collagen, reticular, and elastic"},{"id":"m2quiz-ch4-q37","ch":4,"section":"Quiz (MISSED)","q":"You would find pseudostratified columnar epithelium lining the","opts":["A. trachea.","B. urinary bladder.","C. secretory portions of the pancreas.","D. surface of the skin.","E. stomach."],"a":"A. trachea\n\n🔴 YOU MISSED THIS — She picked: urinary bladder\n💡 Why trachea: pseudostratified ciliated columnar with goblet cells = mucociliary escalator (trachea + bronchi). Bladder = transitional. Stomach = simple columnar."},{"id":"m2quiz-ch4-q38","ch":4,"section":"Quiz","q":"________ attach skeletal muscles to bones, and ________ connect one bone to another.","opts":["A. Ligaments; tendons","B. Ligaments; aponeuroses","C. Tendons; ligaments","D. Aponeuroses; tendons","E. Reticular tissues; tendons"],"a":"C. Tendons; ligaments"},{"id":"m2quiz-ch4-q39","ch":4,"section":"Quiz","q":"Which type of connective tissue is found in the trachea and between the ribs and sternum?","opts":["A. areolar","B. hyaline cartilage","C. elastic","D. fibrous","E. dense regular"],"a":"B. hyaline cartilage"},{"id":"m2quiz-ch4-q40","ch":4,"section":"Quiz","q":"Which tissue lines the small intestine and the stomach?","opts":["A. simple squamous epithelium","B. simple cuboidal epithelium","C. simple columnar epithelium","D. pseudostratified ciliated columnar epithelium","E. stratified squamous epithelium"],"a":"C. simple columnar epithelium"},{"id":"m2-c5-ilq-01","ch":5,"section":"ILQ","q":"The skin consists of two layers and a closely associated layer. View this animation (http://openstaxcollege.org/l/layers) to learn more about layers of the skin. What are the basic functions of each of these layers?","a":"The epidermis provides protection, the dermis provides support and flexibility, and the hypodermis (fat layer) provides insulation and padding"},{"id":"m2-c5-ilq-02","ch":5,"section":"ILQ","q":"Figure 5.4 If you zoom on the cells at the outermost layer of this section of skin, what do you notice about the cells?","a":"These cells do not have nuclei, so you can deduce that they are dead. They appear to be sloughing off."},{"id":"m2-c5-ilq-03","ch":5,"section":"ILQ","q":"Figure 5.6 If you zoom on the cells of the stratum spinosum, what is distinctive about them?","a":"These cells have desmosomes, which give the cells their spiny appearance."},{"id":"m2-c5-ilq-04","ch":5,"section":"ILQ","q":"This ABC video follows the story of a pair of fraternal African-American twins, one of whom is albino. Watch this video (http://openstaxcollege.org/l/albino) to learn about the challenges these children and their family face. Which ethnicities do you think are exempt from the possibility of albinism?","a":"There are none."},{"id":"m2-c5-q5","ch":5,"section":"RQ","q":"The papillary layer of the dermis is most closely associated with which layer of the epidermis?","a":"D. stratum basale","opts":["A. stratum spinosum","B. stratum corneum","C. stratum granulosum","D. stratum basale"]},{"id":"m2-c5-q6","ch":5,"section":"RQ","q":"Langerhans cells are commonly found in the ________.","a":"A. stratum spinosum","opts":["A. stratum spinosum","B. stratum corneum","C. stratum granulosum","D. stratum basale"]},{"id":"m2-c5-q7","ch":5,"section":"RQ","q":"The papillary and reticular layers of the dermis are composed mainly of ________.","a":"C. connective tissue","opts":["A. melanocytes","B. keratinocytes","C. connective tissue","D. adipose tissue"]},{"id":"m2-c5-q8","ch":5,"section":"RQ","q":"Collagen lends ________ to the skin.","a":"B. structure","opts":["A. elasticity","B. structure","C. color","D. UV protection"]},{"id":"m2-c5-q9","ch":5,"section":"RQ","q":"Which of the following is not a function of the hypodermis?","a":"C. source of blood vessels in the epidermis","opts":["A. protects underlying organs","B. helps maintain body temperature","C. source of blood vessels in the epidermis","D. a site to long-term energy storage"]},{"id":"m2-c5-q10","ch":5,"section":"RQ","q":"In response to stimuli from the sympathetic nervous system, the arrector pili ________.","a":"C. are responsible for goose bumps","opts":["A. are glands on the skin surface","B. can lead to excessive sweating","C. are responsible for goose bumps","D. secrete sebum"]},{"id":"m2-c5-q11","ch":5,"section":"RQ","q":"The hair matrix contains ________.","a":"D. a layer of basal cells","opts":["A. the hair follicle","B. the hair shaft","C. the glassy membrane","D. a layer of basal cells"]},{"id":"m2-c5-q12","ch":5,"section":"RQ","q":"Eccrine sweat glands ________.","a":"B. are present in the skin throughout the body and produce watery sweat","opts":["A. are present on hair","B. are present in the skin throughout the body and produce watery sweat","C. produce sebum","D. act as a moisturizer"]},{"id":"m2-c5-q13","ch":5,"section":"RQ","q":"Sebaceous glands ________.","a":"B. are associated with hair follicles","opts":["A. are a type of sweat gland","B. are associated with hair follicles","C. may function in response to touch","D. release a watery solution of salt and metabolic waste"]},{"id":"m2-c5-q14","ch":5,"section":"RQ","q":"Similar to the hair, nails grow continuously throughout our lives. Which of the following is furthest from the nail growth center?","a":"B. hyponychium","opts":["A. nail bed","B. hyponychium","C. nail root","D. eponychium"]},{"id":"m2-c5-q15","ch":5,"section":"RQ","q":"In humans, exposure of the skin to sunlight is required for ________.","a":"A. vitamin D synthesis","opts":["A. vitamin D synthesis","B. arteriole constriction","C. folate production","D. thermoregulation"]},{"id":"m2-c5-q16","ch":5,"section":"RQ","q":"One of the functions of the integumentary system is protection. Which of the following does not directly contribute to that function?","a":"C. folic acid synthesis","opts":["A. stratum lucidum","B. desmosomes","C. folic acid synthesis","D. Merkel cells"]},{"id":"m2-c5-q17","ch":5,"section":"RQ","q":"An individual using a sharp knife notices a small amount of blood where he just cut himself. Which of the following layers of skin did he have to cut into in order to bleed?","a":"C. papillary dermis","opts":["A. stratum corneum","B. stratum basale","C. papillary dermis","D. stratum granulosum"]},{"id":"m2-c5-q18","ch":5,"section":"RQ","q":"As you are walking down the beach, you see a dead, dry, shriveled-up fish. Which layer of your epidermis keeps you from drying out?","a":"A. stratum corneum","opts":["A. stratum corneum","B. stratum basale","C. stratum spinosum","D. stratum granulosum"]},{"id":"m2-c5-q19","ch":5,"section":"RQ","q":"If you cut yourself and bacteria enter the wound, which of the following cells would help get rid of the bacteria?","a":"C. Langerhans cells","opts":["A. Merkel cells","B. keratinocytes","C. Langerhans cells","D. melanocytes"]},{"id":"m2-c5-q20","ch":5,"section":"RQ","q":"In general, skin cancers ________.","a":"C. can be reduced by limiting exposure to the sun","opts":["A. are easily treatable and not a major health concern","B. occur due to poor hygiene","C. can be reduced by limiting exposure to the sun","D. affect only the epidermis"]},{"id":"m2-c5-q21","ch":5,"section":"RQ","q":"Bedsores ________.","a":"C. are preventable by eliminating pressure points","opts":["A. can be treated with topical moisturizers","B. can result from deep massages","C. are preventable by eliminating pressure points","D. are caused by dry skin"]},{"id":"m2-c5-q22","ch":5,"section":"RQ","q":"An individual has spent too much time sun bathing. Not only is his skin painful to touch, but small blisters have appeared in the affected area. This indicates that he has damaged which layers of his skin?","a":"D. epidermis and dermis","opts":["A. epidermis only","B. hypodermis only","C. epidermis and hypodermis","D. epidermis and dermis"]},{"id":"m2-c5-q23","ch":5,"section":"RQ","q":"After a skin injury, the body initiates a wound-healing response. The first step of this response is the formation of a blood clot to stop bleeding. Which of the following would be the next response?","a":"B. increased production of connective tissue","opts":["A. increased production of melanin by melanocytes","B. increased production of connective tissue","C. an increase in Pacinian corpuscles around the wound","D. an increased activity in the stratum lucidum"]},{"id":"m2-c5-q24","ch":5,"section":"RQ","q":"Squamous cell carcinomas are the second most common of the skin cancers and are capable of metastasizing if not treated. This cancer affects which cells?","a":"C. keratinocytes of the stratum spinosum","opts":["A. basal cells of the stratum basale","B. melanocytes of the stratum basale","C. keratinocytes of the stratum spinosum","D. Langerhans cells of the stratum lucidum"]},{"id":"m2-c5-q25","ch":5,"section":"CT","q":"What determines the color of skin, and what is the process that darkens skin when it is exposed to UV light?","a":"The pigment melanin, produced by melanocytes, is primarily responsible for skin color. Melanin comes in different shades of brown and black. Individuals with darker skin have darker, more abundant melanin, whereas fair-skinned individuals have a lighter shade of skin and less melanin. Exposure to UV irradiation stimulates the melanocytes to produce and secrete more melanin."},{"id":"m2-c5-q26","ch":5,"section":"CT","q":"Cells of the epidermis derive from stem cells of the stratum basale. Describe how the cells change as they become integrated into the different layers of the epidermis.","a":"As the cells move into the stratum spinosum, they begin the synthesis of keratin and extend cell processes, desmosomes, which link the cells. As the stratum basale continues to produce new cells, the keratinocytes of the stratum spinosum are pushed into the stratum granulosum. The cells become flatter, their cell membranes thicken, and they generate large amounts of the proteins keratin and keratohyalin. The nuclei and other cell organelles disintegrate as the cells die, leaving behind the keratin, keratohyalin, and cell membranes that form the stratum lucidum and the stratum corneum. The keratinocytes in these layers are mostly dead and flattened. Cells in the stratum corneum are periodically shed."},{"id":"m2-c5-q27","ch":5,"section":"CT","q":"Explain the differences between eccrine and apocrine sweat glands.","a":"Eccrine sweat glands are all over the body, especially the forehead and palms of the hand. They release a watery sweat, mixed with some metabolic waste and antibodies. Apocrine glands are associated with hair follicles. They are larger than eccrine sweat glands and lie deeper in the dermis, sometimes even reaching the hypodermis. They release a thicker sweat that is often decomposed by bacteria on the skin, resulting in an unpleasant odor."},{"id":"m2-c5-q28","ch":5,"section":"CT","q":"Describe the structure and composition of nails.","a":"Nails are composed of densely packed dead keratinocytes. They protect the fingers and toes from mechanical stress. The nail body is formed on the nail bed, which is at the nail root. Nail folds, folds of skin that overlap the nail on its side, secure the nail to the body. The crescent-shaped region at the base of the nail is the lunula."},{"id":"m2-c5-q29","ch":5,"section":"CT","q":"Why do people sweat excessively when exercising outside on a hot day?","a":"Sweating cools the body when it becomes warm. When the body temperature rises, such as when exercising on a hot day, the dermal blood vessels dilate, and the sweat glands begin to secrete more sweat. The evaporation of the sweat from the surface of the skin cools the body by dissipating heat."},{"id":"m2-c5-q30","ch":5,"section":"CT","q":"Explain your skin’s response to a drop in body core temperature.","a":"When the core body temperature drops, the body switches to heat-conservation mode. This can include an inhibition to excessive sweating and a decrease of blood flow to the papillary layers of the skin. This reduction of blood flow helps conserve body heat."},{"id":"m2-c5-q31","ch":5,"section":"CT","q":"Why do teenagers often experience acne?","a":"Acne results from a blockage of sebaceous glands by sebum. The blockage causes blackheads to form, which are susceptible to infection. The infected tissue then becomes red and inflamed. Teenagers experience this at high rates because the sebaceous glands become active during puberty. Hormones that are especially active during puberty stimulate the release of sebum, leading in many cases to blockages."},{"id":"m2-c5-q32","ch":5,"section":"CT","q":"Why do scars look different from surrounding skin?","a":"Scars are made of collagen and do not have the cellular structure of normal skin. The tissue is fibrous and does not allow for the regeneration of accessory structures, such as hair follicles, and sweat or sebaceous glands."},{"id":"m2quiz-ch5-q01","ch":5,"section":"Quiz","q":"A surgical incision parallel to the lines of cleavage","opts":["A. closes and heals with relatively little scarring.","B. has a tendency to reopen.","C. heals slower than incisions made perpendicular to the lines of cleavage.","D. does not affect the healing process.","E. requires no sutures."],"a":"A. closes and heals with relatively little scarring"},{"id":"m2quiz-ch5-q02","ch":5,"section":"Quiz","q":"An albino individual lacks the ability to produce","opts":["A. melanin.","B. keratin.","C. carotene.","D. perspiration.","E. eleidin."],"a":"A. melanin"},{"id":"m2quiz-ch5-q03","ch":5,"section":"Quiz","q":"An important vitamin that is formed in the skin when it is exposed to sunlight is","opts":["A. vitamin A.","B. vitamin B.","C. vitamin C.","D. vitamin D.","E. vitamin E."],"a":"D. vitamin D"},{"id":"m2quiz-ch5-q04","ch":5,"section":"Quiz","q":"Characteristics of the epidermis include:","opts":["A. multilayered","B. flexible","C. contains desmosomes","D. serves as UV radiation protection","E. All of the answers are correct."],"a":"E. All of the answers are correct"},{"id":"m2quiz-ch5-q05","ch":5,"section":"Quiz","q":"Earwax is produced by ________ glands.","opts":["A. sebaceous","B. apocrine sweat","C. merocrine sweat","D. ceruminous","E. eccrine sweat"],"a":"D. ceruminous"},{"id":"m2quiz-ch5-q06","ch":5,"section":"Quiz (MISSED)","q":"________ sweat glands are widely distributed across the body surface, ________ glands are located wherever hair follicles exist, and ________ sweat glands are found only in a few areas.","opts":["A. Sebaceous; merocrine; apocrine","B. Apocrine; merocrine; sebaceous","C. Merocrine; sebaceous; apocrine","D. Merocrine; apocrine; sebaceous","E. Apocrine; sebaceous; merocrine"],"a":"C. Merocrine; sebaceous; apocrine\n\n🔴 YOU MISSED THIS — She picked: Merocrine; apocrine; sebaceous\n💡 Why merocrine; sebaceous; apocrine: MEROCRINE (eccrine) sweat = widely distributed. SEBACEOUS = wherever there are hair follicles. APOCRINE sweat = restricted to axilla, areola, groin."},{"id":"m2quiz-ch5-q07","ch":5,"section":"Quiz","q":"________ are cells in the epidermis that are part of the immune system.","opts":["A. Dendritic cells","B. Basal cells","C. Merkel cells","D. Squamous cells","E. Melanocytes"],"a":"A. Dendritic cells"},{"id":"m2quiz-ch5-q08","ch":5,"section":"Quiz","q":"Thin skin contains ________ layer(s) of keratinocytes, and thick skin contains ________ layers.","opts":["A. 1; 2","B. 2; 3","C. 3; 4","D. 4; 5","E. 5; 6"],"a":"D. 4; 5"},{"id":"m2quiz-ch5-q09","ch":5,"section":"Quiz","q":"The type of cells that form the strata in the epidermis are","opts":["A. adipocytes.","B. keratinocytes.","C. fibroblasts.","D. melanocytes.","E. dendritic cells."],"a":"B. keratinocytes"},{"id":"m2quiz-ch5-q10","ch":5,"section":"Quiz (MISSED)","q":"The tough \"horny\" superficial layer of the epidermis is known as the","opts":["A. stratum corneum.","B. stratum lucidum.","C. stratum germinativum.","D. stratum granulosum.","E. stratum spinosum."],"a":"A. stratum corneum\n\n🔴 YOU MISSED THIS — She picked: stratum spinosum\n💡 Why stratum corneum: 'horny' = Latin cornu (horn). Stratum CORNEUM = dead, keratinized outer layer. Spinosum = 'spiny' (cytoskeletons sticking out)."},{"id":"m2quiz-ch5-q11","ch":5,"section":"Quiz","q":"The two components of the integumentary system are the","opts":["A. epidermis and dermis.","B. cutaneous membrane and hypodermis.","C. cutaneous membrane and accessory structures.","D. integument and hypodermis.","E. epidermis and superficial fascia."],"a":"C. cutaneous membrane and accessory structures"},{"id":"m2quiz-ch5-q12","ch":5,"section":"Quiz","q":"The stratum corneum just under the free-edge of a nail is the","opts":["A. hyponychium.","B. lunula.","C. eponychium.","D. nail root.","E. cuticle."],"a":"A. hyponychium"},{"id":"m2quiz-ch5-q13","ch":5,"section":"Quiz (MISSED)","q":"The protein that reduces water loss at the skin surface is","opts":["A. eleidin.","B. collagen.","C. mucin.","D. keratin.","E. melanin."],"a":"D. keratin\n\n🔴 YOU MISSED THIS — She picked: eleidin\n💡 Why keratin: keratin is the body-wide waterproofing protein. Eleidin is found only in stratum lucidum (thick skin) — too localized to be the answer."},{"id":"m2quiz-ch5-q14","ch":5,"section":"Quiz","q":"The primary pigments contained in the epidermis are","opts":["A. carotene and xanthophyll.","B. carotene and melanin.","C. melanin and chlorophyll.","D. xanthophyll and melanin.","E. melanin and chromatin."],"a":"B. carotene and melanin"},{"id":"m2quiz-ch5-q15","ch":5,"section":"Quiz","q":"The protein that permits stretching and recoiling of the skin is","opts":["A. collagen.","B. melanin.","C. keratin.","D. elastin.","E. carotene."],"a":"D. elastin"},{"id":"m2quiz-ch5-q16","ch":5,"section":"Quiz","q":"The layer of hard keratin that coats the hair is termed the","opts":["A. medulla.","B. cuticle.","C. hair bulb.","D. root.","E. shaft."],"a":"B. cuticle"},{"id":"m2quiz-ch5-q17","ch":5,"section":"Quiz (MISSED)","q":"The layer of stem cells that constantly divide to renew the epidermis is the","opts":["A. stratum corneum.","B. stratum germinativum.","C. papillary layer.","D. basal lamina.","E. stratum granulosum."],"a":"B. stratum germinativum\n\n🔴 YOU MISSED THIS — She picked: basal lamina\n💡 Why stratum germinativum (= stratum basale): the question asks for a LAYER OF CELLS. Stratum germinativum is the deepest CELL layer where mitosis happens. Basal lamina is the basement MEMBRANE — an acellular protein layer."},{"id":"m2quiz-ch5-q18","ch":5,"section":"Quiz","q":"The layer of the epidermis that contains abundant desmosomes is the","opts":["A. stratum corneum.","B. stratum lucidum.","C. stratum germinativum.","D. stratum granulosum.","E. stratum spinosum."],"a":"E. stratum spinosum"},{"id":"m2quiz-ch5-q19","ch":5,"section":"Quiz","q":"The layer of the skin that contains bundles of collagen and elastic fibers responsible for the strength of the skin is the ________ layer.","opts":["A. papillary","B. reticular","C. epidermal","D. subcutaneous","E. hypodermal"],"a":"B. reticular"},{"id":"m2quiz-ch5-q20","ch":5,"section":"Quiz","q":"The layer of the skin that contains the blood vessels and nerves that are closest to the surface of the skin is the ________ layer.","opts":["A. papillary","B. reticular","C. epidermal","D. subcutaneous","E. hypodermal"],"a":"A. papillary"},{"id":"m2quiz-ch5-q21","ch":5,"section":"Quiz (MISSED)","q":"The layer of the skin that provides a barrier against bacteria as well as chemical and mechanical injuries is the","opts":["A. dermis.","B. subcutaneous layer.","C. epidermis.","D. stratum corneum.","E. sebum layer."],"a":"C. epidermis\n\n🔴 YOU MISSED THIS — She picked: stratum corneum\n💡 Why epidermis: the Q lists THREE injury types (bacteria + chemical + mechanical). The whole EPIDERMIS provides all three. Stratum corneum is one piece — the broader 'epidermis' is the textbook answer."},{"id":"m2quiz-ch5-q22","ch":5,"section":"Quiz","q":"The cuticle around a nail is the","opts":["A. eponychium.","B. hyponychium.","C. free edge.","D. perinychium.","E. lunula."],"a":"A. eponychium"},{"id":"m2quiz-ch5-q23","ch":5,"section":"Quiz","q":"Merocrine sweat glands","opts":["A. are compound alveolar glands.","B. produce organic secretions that are metabolized by bacteria to produce body odor.","C. secrete a watery fluid directly onto the surface of the skin.","D. increase in number and activity with aging.","E. primarily function in lubricating the hairs."],"a":"C. secrete a watery fluid directly onto the surface of the skin"},{"id":"m2quiz-ch5-q24","ch":5,"section":"Quiz","q":"The ________ in keratinocytes protects the epidermis and dermis from the harmful effects of sunlight.","opts":["A. sebum","B. hemoglobin","C. melanin","D. carotene","E. keratin"],"a":"C. melanin"},{"id":"m2quiz-ch5-q25","ch":5,"section":"Quiz","q":"Accessory structures of the skin include all of the following, except","opts":["A. hair follicles.","B. sebaceous glands.","C. sweat glands.","D. epidermis.","E. nails."],"a":"D. epidermis"},{"id":"m2-c6-q1","ch":6,"section":"RQ","q":"Which function of the skeletal system would be especially important if you were in a car accident?","a":"B. protection of internal organs","opts":["A. storage of minerals","B. protection of internal organs","C. facilitation of movement","D. fat storage"]},{"id":"m2-c6-q2","ch":6,"section":"RQ","q":"Bone tissue can be described as ________.","a":"D. dense, hard connective tissue","opts":["A. dead calcified tissue","B. cartilage","C. the skeletal system","D. dense, hard connective tissue"]},{"id":"m2-c6-q3","ch":6,"section":"RQ","q":"Without red marrow, bones would not be able to ________.","a":"C. make blood cells","opts":["A. store phosphate","B. store calcium","C. make blood cells","D. move like levers"]},{"id":"m2-c6-q4","ch":6,"section":"RQ","q":"Yellow marrow has been identified as ________.","a":"A. an area of fat storage","opts":["A. an area of fat storage","B. a point of attachment for muscles","C. the hard portion of bone","D. the cause of kyphosis"]},{"id":"m2-c6-q5","ch":6,"section":"RQ","q":"Which of the following can be found in areas of movement?","a":"B. cartilage","opts":["A. hematopoiesis","B. cartilage","C. yellow marrow","D. red marrow"]},{"id":"m2-c6-q6","ch":6,"section":"RQ","q":"The skeletal system is made of ________.","a":"B. bones and cartilage","opts":["A. muscles and tendons","B. bones and cartilage","C. vitreous humor","D. minerals and fat"]},{"id":"m2-c6-q7","ch":6,"section":"RQ","q":"Most of the bones of the arms and hands are long bones; however, the bones in the wrist are categorized as ________.","a":"B. short bones","opts":["A. flat bones","B. short bones","C. sesamoid bones","D. irregular bones"]},{"id":"m2-c6-q8","ch":6,"section":"RQ","q":"Sesamoid bones are found embedded in ________.","a":"D. tendons","opts":["A. joints","B. muscles","C. ligaments","D. tendons"]},{"id":"m2-c6-q9","ch":6,"section":"RQ","q":"Bones that surround the spinal cord are classified as ________ bones.","a":"A. irregular","opts":["A. irregular","B. sesamoid","C. flat","D. short"]},{"id":"m2-c6-q10","ch":6,"section":"RQ","q":"Which category of bone is among the most numerous in the skeleton?","a":"A. long bone","opts":["A. long bone","B. sesamoid bone","C. short bone","D. flat bone"]},{"id":"m2-c6-q11","ch":6,"section":"RQ","q":"Long bones enable body movement by acting as a ________.","a":"C. lever","opts":["A. counterweight","B. resistive force","C. lever","D. fulcrum"]},{"id":"m2-c6-q12","ch":6,"section":"RQ","q":"Which of the following occurs in the spongy bone of the epiphysis?","a":"C. hematopoiesis","opts":["A. bone growth","B. bone remodeling","C. hematopoiesis","D. shock absorption"]},{"id":"m2-c6-q13","ch":6,"section":"RQ","q":"The diaphysis contains ________.","a":"B. fat stores","opts":["A. the metaphysis","B. fat stores","C. spongy bone","D. compact bone"]},{"id":"m2-c6-q14","ch":6,"section":"RQ","q":"The fibrous membrane covering the outer surface of the bone is the ________.","a":"A. periosteum","opts":["A. periosteum","B. epiphysis","C. endosteum","D. diaphysis"]},{"id":"m2-c6-q15","ch":6,"section":"RQ","q":"Which of the following are incapable of undergoing mitosis?","a":"C. osteoblasts and osteocytes — both are terminally differentiated bone cells that do not divide. Osteoblasts have committed to secreting osteoid; osteocytes are trapped in lacunae. OSTEOGENIC (osteoprogenitor) cells ARE the stem cells that divide. Note: osteoclasts also don't divide (multinucleated, from monocytes), but they're paired here with osteogenic cells, which DO divide — so options A, B, D all contain one cell that CAN divide.","opts":["A. osteoblasts and osteoclasts","B. osteoclasts and osteogenic cells","C. osteoblasts and osteocytes","D. osteogenic cells and osteocytes"]},{"id":"m2-c6-q16","ch":6,"section":"RQ","q":"Which cells do not originate from osteogenic cells?","a":"D. osteoprogenitor cells","opts":["A. osteoblasts","B. osteoclasts","C. osteocytes","D. osteoprogenitor cells"]},{"id":"m2-c6-q17","ch":6,"section":"RQ","q":"Which of the following are found in compact bone and cancellous bone?","a":"C. lamellae","opts":["A. Haversian systems","B. Haversian canals","C. lamellae","D. lacunae"]},{"id":"m2-c6-q18","ch":6,"section":"RQ","q":"Which of the following are only found in cancellous bone?","a":"C. trabeculae","opts":["A. canaliculi","B. Volkmann's canals","C. trabeculae","D. calcium salts"]},{"id":"m2-c6-q19","ch":6,"section":"RQ","q":"The area of a bone where the nutrient foramen passes forms what kind of bone marking?","a":"A. a hole","opts":["A. a hole","B. a facet","C. a canal","D. a fissure"]},{"id":"m2-c6-q20","ch":6,"section":"RQ","q":"Why is cartilage slow to heal?","a":"C. because it does not have a blood supply","opts":["A. because it eventually develops into bone","B. because it is semi-solid and flexible","C. because it does not have a blood supply","D. because endochondral ossification replaces all cartilage with bone"]},{"id":"m2-c6-q21","ch":6,"section":"RQ","q":"Why are osteocytes spread out in bone tissue?","a":"D. Formation of osteoid spreads out the osteoblasts that formed the ossification centers.","opts":["A. They develop from mesenchymal cells.","B. They are surrounded by osteoid.","C. They travel through the capillaries.","D. Formation of osteoid spreads out the osteoblasts that formed the ossification centers."]},{"id":"m2-c6-q22","ch":6,"section":"RQ","q":"In endochondral ossification, what happens to the chondrocytes?","a":"B. They die in the calcified matrix that surrounds them and form the medullary cavity.","opts":["A. They develop into osteocytes.","B. They die in the calcified matrix that surrounds them and form the medullary cavity.","C. They grow and form the periosteum.","D. They group together to form the primary ossification center."]},{"id":"m2-c6-q23","ch":6,"section":"RQ","q":"Which of the following bones is (are) formed by intramembranous ossification?","a":"D. the flat bones of the cranium","opts":["A. the metatarsals","B. the femur","C. the ribs","D. the flat bones of the cranium"]},{"id":"m2-c6-q24","ch":6,"section":"RQ","q":"Bones grow in length due to activity in the ________.","a":"A. epiphyseal plate","opts":["A. epiphyseal plate","B. perichondrium","C. periosteum","D. medullary cavity"]},{"id":"m2-c6-q25","ch":6,"section":"RQ","q":"Bones grow in diameter due to bone formation ________.","a":"B. beneath the periosteum","opts":["A. in the medullary cavity","B. beneath the periosteum","C. in the epiphyseal plate","D. within the metaphysis"]},{"id":"m2-c6-q26","ch":6,"section":"RQ","q":"Which of the following represents the correct sequence of zones in the epiphyseal plate?","a":"C. calcification, maturation, proliferation, reserved","opts":["A. proliferation, reserved, maturation, calcification","B. maturation, proliferation, reserved, calcification","C. calcification, maturation, proliferation, reserved","D. calcification, reserved, proliferation, maturation"]},{"id":"m2-c6-q27","ch":6,"section":"RQ","q":"A fracture can be both ________.","a":"B. open and transverse","opts":["A. open and closed","B. open and transverse","C. transverse and greenstick","D. greenstick and comminuted"]},{"id":"m2-c6-q28","ch":6,"section":"RQ","q":"How can a fractured diaphysis release fat globules into the bloodstream?","a":"B. The yellow marrow in the diaphysis is exposed and damaged.","opts":["A. The bone pierces fat stores in the skin.","B. The yellow marrow in the diaphysis is exposed and damaged.","C. The injury triggers the body to release fat from healthy bones.","D. The red marrow in the fractured bone releases fat to heal the fracture."]},{"id":"m2-c6-q29","ch":6,"section":"RQ","q":"In a compound fracture, ________.","a":"D. broken bone pierces the skin","opts":["A. the break occurs at an angle to the bone","B. the broken bone does not tear the skin","C. one fragment of broken bone is compressed into the other","D. broken bone pierces the skin"]},{"id":"m2-c6-q30","ch":6,"section":"RQ","q":"The internal and external calli are replaced by ________.","a":"B. trabecular bone","opts":["A. hyaline cartilage","B. trabecular bone","C. osteogenic cells","D. osteoclasts"]},{"id":"m2-c6-q31","ch":6,"section":"RQ","q":"The first type of bone to form during fracture repair is ________ bone.","a":"C. spongy","opts":["A. compact","B. lamellar","C. spongy","D. dense"]},{"id":"m2-c6-q32","ch":6,"section":"RQ","q":"Wolff’s law, which describes the effect of mechanical forces in bone modeling/remodeling, would predict that ________","a":"A. a right-handed pitcher will have thicker bones in his right arm compared to his left.","opts":["A. a right-handed pitcher will have thicker bones in his right arm compared to his left.","B. a right-handed cyclist will have thicker bones in her right leg compared to her left.","C. a broken bone will heal thicker than it was before the fracture.","D. a bed-ridden patient will have thicker bones than an athlete."]},{"id":"m2-c6-q33","ch":6,"section":"RQ","q":"Calcium cannot be absorbed from the small intestine if ________ is lacking.","a":"A. vitamin D","opts":["A. vitamin D","B. vitamin K","C. calcitonin","D. fluoride"]},{"id":"m2-c6-q34","ch":6,"section":"RQ","q":"Which one of the following foods is best for bone health? a","a":"C. leafy green vegetables","opts":["A. carrots","B. liver","C. leafy green vegetables","D. oranges"]},{"id":"m2-c6-q35","ch":6,"section":"RQ","q":"Which of the following hormones are responsible for the adolescent growth spurt?","a":"A. estrogen and testosterone","opts":["A. estrogen and testosterone","B. calcitonin and calcitriol","C. growth hormone and parathyroid hormone","D. thyroxine and progesterone"]},{"id":"m2-c6-q36","ch":6,"section":"RQ","q":"With respect to their direct effects on osseous tissue, which pair of hormones has actions that oppose each other?","a":"D. calcitonin and parathyroid hormone","opts":["A. estrogen and testosterone","B. calcitonin and calcitriol","C. estrogen and progesterone","D. calcitonin and parathyroid hormone"]},{"id":"m2-c6-q37","ch":6,"section":"RQ","q":"When calcium levels are too high or too low, which body system is primarily affected?","a":"D. nervous system","opts":["A. skeletal system","B. endocrine system","C. digestive system","D. nervous system"]},{"id":"m2-c6-q38","ch":6,"section":"RQ","q":"All of the following play a role in calcium homeostasis except","a":"A. thyroxine","opts":["A. thyroxine","B. calcitonin","C. parathyroid hormone","D. vitamin D"]},{"id":"m2-c6-q39","ch":6,"section":"RQ","q":"Which of the following is most likely to be released when blood calcium levels are elevated?","a":"B. calcitonin","opts":["A. thyroxine","B. calcitonin","C. parathyroid hormone","D. vitamin D"]},{"id":"m2-c6-q40","ch":6,"section":"CT","q":"The skeletal system is composed of bone and cartilage and has many functions. Choose three of these functions and discuss what features of the skeletal system allow it to accomplish these functions.","a":"It supports the body. The rigid, yet flexible skeleton acts as a framework to support the other organs of the body. It facilitates movement. The movable joints allow the skeleton to change shape and positions; that is, move. It protects internal organs. Parts of the skeleton enclose or partly enclose various organs of the body including our brain, ears, heart, and lungs. Any trauma to these organs has to be mediated through the skeletal system. It produces blood cells. The central cavity of long bones is filled with marrow. The red marrow is responsible for forming red and white blood cells. It stores and releases minerals and fat. The mineral component of bone, in addition to providing hardness to bone, provides a mineral reservoir that can be tapped as needed. Additionally, the yellow marrow, which is found in the central cavity of long bones along with red marrow, serves as a storage site for fat."},{"id":"m2-c6-q41","ch":6,"section":"CT","q":"What are the structural and functional differences between a tarsal and a metatarsal?","a":"Structurally, a tarsal is a short bone, meaning its length, width, and thickness are about equal, while a metatarsal is a long bone whose length is greater than its width. Functionally, the tarsal provides limited motion, while the metatarsal acts as a lever."},{"id":"m2-c6-q42","ch":6,"section":"CT","q":"What are the structural and functional differences between the femur and the patella?","a":"Structurally, the femur is a long bone, meaning its length is greater than its width, while the patella, a sesamoid bone, is small and round. Functionally, the femur acts as a lever, while the patella protects the patellar tendon from compressive forces."},{"id":"m2-c6-q43","ch":6,"section":"CT","q":"If the articular cartilage at the end of one of your long bones were to degenerate, what symptoms do you think you would experience? Why?","a":"If the articular cartilage at the end of one of your long bones were to deteriorate, which is actually what happens in osteoarthritis, you would experience joint pain at the end of that bone and limitation of motion at that joint because there would be no cartilage to reduce friction between adjacent bones and there would be no cartilage to act as a shock absorber."},{"id":"m2-c6-q44","ch":6,"section":"CT","q":"In what ways is the structural makeup of compact and spongy bone well suited to their respective functions?","a":"The densely packed concentric rings of matrix in compact bone are ideal for resisting compressive forces, which is the function of compact bone. The open spaces of the trabeculated network of spongy bone allow spongy bone to support shifts in weight distribution, which is the function of spongy bone."},{"id":"m2-c6-q45","ch":6,"section":"CT","q":"In what ways do intramembranous and endochondral ossification differ?","a":"In intramembranous ossification, bone develops directly from sheets of mesenchymal connective tissue, but in endochondral ossification, bone develops by replacing hyaline cartilage. Intramembranous ossification is complete by the end of the adolescent growth spurt, while endochondral ossification lasts into young adulthood. The flat bones of the face, most of the cranial bones, and a good deal of the clavicles (collarbones) are formed via intramembranous ossification, while bones at the base of the skull and the long bones form via endochondral ossification."},{"id":"m2-c6-q46","ch":6,"section":"CT","q":"Considering how a long bone develops, what are the similarities and differences between a primary and a secondary ossification center?","a":"A single primary ossification center is present, during endochondral ossification, deep in the periosteal collar. Like the primary ossification center, secondary ossification centers are present during endochondral ossification, but they form later, and there are two of them, one in each epiphysis"},{"id":"m2-c6-q47","ch":6,"section":"CT","q":"What is the difference between closed reduction and open reduction? In what type of fracture would closed reduction most likely occur? In what type of fracture would open reduction most likely occur?","a":"In closed reduction, the broken ends of a fractured bone can be reset without surgery. Open reduction requires surgery to return the broken ends of the bone to their correct anatomical position. A partial fracture would likely require closed reduction. A compound fracture would require open reduction."},{"id":"m2-c6-q48","ch":6,"section":"CT","q":"In terms of origin and composition, what are the differences between an internal callus and an external callus?","a":"The internal callus is produced by cells in the endosteum and is composed of a fibrocartilaginous matrix. The external callus is produced by cells in the periosteum and consists of hyaline cartilage and bone."},{"id":"m2-c6-q49","ch":6,"section":"CT","q":"If you were a dietician who had a young female patient with a family history of osteoporosis, what foods would you suggest she include in her diet? Why?","a":"Since maximum bone mass is achieved by age 30, I would want this patient to have adequate calcium and vitamin D in her diet. To do this, I would recommend ingesting milk and other dairy foods, green leafy vegetables, and intact canned sardines so she receives sufficient calcium. Intact salmon would be a good source for calcium and vitamin D. Other fatty fish would also be a good vitamin D source."},{"id":"m2-c6-q50","ch":6,"section":"CT","q":"During the early years of space exploration our astronauts, who had been floating in space, would return to earth showing significant bone loss dependent on how long they were in space. Discuss how this might happen and what could be done to alleviate this condition.","a":"Astronauts floating in space were not exerting significant pressure on their bones; they were “weightless.” Without the force of gravity exerting pressure on the bones, bone mass was lost. To alleviate this condition, astronauts now do resistive exercise designed to apply forces to the bones and thus help keep them healthy."},{"id":"m2-c6-q51","ch":6,"section":"CT","q":"An individual with very low levels of vitamin D presents themselves to you complaining of seemingly fragile bones. Explain how these might be connected.","a":"Vitamin D is required for calcium absorption by the gut. Low vitamin D could lead to insufficient levels of calcium in the blood so the calcium is being released from the bones. The reduction of calcium from the bones can make them weak and subject to fracture."},{"id":"m2-c6-q52","ch":6,"section":"CT","q":"Describe the effects caused when the parathyroid gland fails to respond to calcium bound to its receptors.","a":"Under “normal” conditions, receptors in the parathyroid glands bind blood calcium. When the receptors are full, the parathyroid gland stops secreting PTH. In the condition described, the parathyroid glands are not responding to the signal that there is sufficient calcium in the blood and they keep releasing PTH, which causes the bone to release more calcium into the blood. Ultimately, the bones become fragile and hypercalcemia can result."},{"id":"m2quiz-ch6-q01","ch":6,"section":"Quiz","q":"A condition in which bone becomes riddled with holes is called","opts":["A. osteopenia.","B. osteoporosis.","C. osteomyelitis.","D. osteitis.","E. osteomalacia."],"a":"B. osteoporosis"},{"id":"m2quiz-ch6-q02","ch":6,"section":"Quiz","q":"A hole through a bone is termed a","opts":["A. ramus.","B. foramen.","C. linea.","D. tubercle.","E. facet."],"a":"B. foramen"},{"id":"m2quiz-ch6-q03","ch":6,"section":"Quiz","q":"A rib is an example of a ________ bone.","opts":["A. long","B. short","C. flat","D. sutural","E. sesamoid"],"a":"C. flat"},{"id":"m2quiz-ch6-q04","ch":6,"section":"Quiz","q":"A shallow depression on a bone is termed a","opts":["A. fossa.","B. sulcus.","C. facet.","D. fissure.","E. line."],"a":"A. fossa"},{"id":"m2quiz-ch6-q05","ch":6,"section":"Quiz","q":"Bone growth in length occurs by mitosis of","opts":["A. concentric lamellae.","B. cartilage cells in the epiphyseal side of the metaphysis.","C. growth of trabeculae.","D. osteoblasts in the endosteum.","E. cartilage cells in the diaphyseal side of the metaphysis."],"a":"B. cartilage cells in the epiphyseal side of the metaphysis"},{"id":"m2quiz-ch6-q06","ch":6,"section":"Quiz","q":"Bone is composed of ________ percent cells.","opts":["A. 25","B. 10","C. 2","D. 15","E. 50"],"a":"C. 2"},{"id":"m2quiz-ch6-q07","ch":6,"section":"Quiz","q":"Bone plays a central role in the regulation of blood levels of","opts":["A. potassium.","B. iron.","C. sulfate.","D. calcium.","E. sodium."],"a":"D. calcium"},{"id":"m2quiz-ch6-q08","ch":6,"section":"Quiz","q":"Bone tissue formation begins when osteoblasts secrete","opts":["A. collagen fibers.","B. mesenchyme.","C. silica.","D. hydroxyapatite.","E. calcium."],"a":"A. collagen fibers"},{"id":"m2quiz-ch6-q09","ch":6,"section":"Quiz (MISSED)","q":"Bones that develop within tendons are called ________ bones.","opts":["A. irregular","B. sesamoid","C. sutural","D. Wormian","E. tendon"],"a":"B. sesamoid\n\n🔴 YOU MISSED THIS — She picked: sutural\n💡 Why sesamoid: SESAMOID bones develop WITHIN TENDONS — the patella (kneecap) is the largest example. SUTURAL (Wormian) bones are extra small bones between cranial sutures of the skull — totally different concept."},{"id":"m2quiz-ch6-q10","ch":6,"section":"Quiz","q":"Cells that secrete the organic components of the bone matrix are called","opts":["A. osteocytes.","B. osteoprogenitor cells.","C. osteoblasts.","D. osteoclasts.","E. chondrocytes."],"a":"C. osteoblasts"},{"id":"m2quiz-ch6-q11","ch":6,"section":"Quiz","q":"During appositional growth","opts":["A. bones grow longer.","B. bones grow wider.","C. bone is replaced by cartilage.","D. the epiphysis fuses with the diaphysis.","E. osteoblasts are overwhelmed by osteocytes."],"a":"B. bones grow wider"},{"id":"m2quiz-ch6-q12","ch":6,"section":"Quiz","q":"Fat is stored within the","opts":["A. medullary cavity.","B. metaphysis.","C. spongy bone.","D. epiphysis.","E. diaphysis."],"a":"A. medullary cavity"},{"id":"m2quiz-ch6-q13","ch":6,"section":"Quiz","q":"How is vitamin D (vitamin D3) related to calcium homeostasis in bone?","opts":["A. Vitamin D provides a framework for calcium in the matrix.","B. Vitamin D is regulated by osteoclast activity.","C. Vitamin D is produced by osteoblasts during endochondral ossification.","D. Vitamin D is involved in calcium absorption by the digestive tract so calcium is available for ossification and remodeling.","E. Vitamin D replaces calcium in the skeleton."],"a":"D. Vitamin D is involved in calcium absorption by the digestive tract so calcium is available for ossification and remodeling"},{"id":"m2quiz-ch6-q14","ch":6,"section":"Quiz","q":"Hundreds of years ago explorers often died of scurvy. How can this bone-related disease be prevented?","opts":["A. Supplement the diet with more calcium from meat.","B. Increase levels of testosterone to stimulate bone repair.","C. Supplement the diet with fresh fruit rich in vitamin C.","D. Drink more water to promote bone remodeling and repair.","E. Amputate fractured limbs to prevent the spread of scurvy."],"a":"C. Supplement the diet with fresh fruit rich in vitamin C"},{"id":"m2quiz-ch6-q15","ch":6,"section":"Quiz","q":"If osteoclasts are more active than osteoblasts, bones will become","opts":["A. denser.","B. thicker.","C. osteopenic.","D. stronger.","E. calcified."],"a":"C. osteopenic"},{"id":"m2quiz-ch6-q16","ch":6,"section":"Quiz","q":"Intramembranous ossification","opts":["A. produces flat bones as in the bones of the roof of the skull.","B. explains how a juvenile's bone can grow in length.","C. occurs in the diaphysis of a long bone.","D. occurs inside a bag of cartilage.","E. occurs in all bones before birth."],"a":"A. produces flat bones as in the bones of the roof of the skull"},{"id":"m2quiz-ch6-q17","ch":6,"section":"Quiz","q":"Parathyroid hormone functions in all of the following ways, except that it","opts":["A. stimulates osteoclast activity.","B. increases the rate of calcium absorption.","C. decreases the rate of calcium excretion.","D. raises the level of calcium ion in the blood.","E. inhibits calcitonin secretion."],"a":"E. inhibits calcitonin secretion"},{"id":"m2quiz-ch6-q18","ch":6,"section":"Quiz","q":"Primary ossification centers develop in long bones in the","opts":["A. proximal epiphysis.","B. periosteum.","C. metaphysis.","D. distal epiphysis.","E. diaphysis."],"a":"E. diaphysis"},{"id":"m2quiz-ch6-q19","ch":6,"section":"Quiz (MISSED)","q":"Small, oddly shaped bones that fill gaps between bones of the skull are called ________ bones.","opts":["A. irregular","B. sesamoid","C. sutural","D. sagittal","E. tendon"],"a":"C. sutural\n\n🔴 YOU MISSED THIS — She picked: irregular\n💡 Why sutural: SUTURAL (Wormian) bones are the small, oddly shaped extra bones that fill gaps between the regular cranial bones at suture lines. IRREGULAR bones are the major shape-classified ones (vertebrae, facial bones) that have complex shapes — not extras filling gaps."},{"id":"m2quiz-ch6-q20","ch":6,"section":"Quiz","q":"The carpal bones are examples of ________ bones.","opts":["A. long","B. short","C. flat","D. irregular","E. sesamoid"],"a":"B. short"},{"id":"m2quiz-ch6-q21","ch":6,"section":"Quiz","q":"The central canal of an osteon contains","opts":["A. bone marrow.","B. osteocytes.","C. concentric lamellae.","D. blood vessels.","E. lacunae."],"a":"D. blood vessels"},{"id":"m2quiz-ch6-q22","ch":6,"section":"Quiz","q":"The condition known as osteopenia","opts":["A. affects mostly women.","B. causes a gradual reduction in bone mass.","C. is caused by too much vitamin D in the diet.","D. is rarely seen as people age.","E. only affects the femur."],"a":"B. causes a gradual reduction in bone mass"},{"id":"m2quiz-ch6-q23","ch":6,"section":"Quiz (MISSED)","q":"The femur can withstand ________ times the body weight without breaking.","opts":["A. 3","B. 5 to 10","C. 8","D. 10 to 15","E. 30"],"a":"D. 10 to 15\n\n🔴 YOU MISSED THIS — She picked: 5 to 10\n💡 Why 10 to 15×: the femur, longest and strongest bone in the body, can withstand 10–15 times body weight without breaking. This is a specific OpenStax stat — memorize the range."},{"id":"m2quiz-ch6-q24","ch":6,"section":"Quiz","q":"The hormone calcitonin functions to","opts":["A. stimulate osteoclast activity.","B. decrease the rate of calcium excretion.","C. decrease the rate of calcium absorption.","D. decrease the level of calcium ion in the blood.","E. stimulate osteoblasts and inhibit osteoclasts."],"a":"D. decrease the level of calcium ion in the blood"},{"id":"m2quiz-ch6-q25","ch":6,"section":"Quiz","q":"The lacunae of osseous tissue contain","opts":["A. blood cells.","B. osteocytes.","C. chondroblasts.","D. bone marrow.","E. capillaries."],"a":"B. osteocytes"},{"id":"m2quiz-ch6-q26","ch":6,"section":"Quiz","q":"The lining of the medullary cavity is called the","opts":["A. endosteum.","B. periosteum.","C. epimysium.","D. perimysium.","E. perichondrium."],"a":"A. endosteum"},{"id":"m2quiz-ch6-q27","ch":6,"section":"Quiz","q":"The most abundant cell type in bone is","opts":["A. osteoclasts.","B. osteoblasts.","C. osteolytes.","D. osteoprogenitor cells.","E. osteocytes."],"a":"E. osteocytes"},{"id":"m2quiz-ch6-q28","ch":6,"section":"Quiz","q":"The most abundant mineral in the human body is","opts":["A. sodium.","B. potassium.","C. phosphorus.","D. calcium.","E. hydrogen."],"a":"D. calcium"},{"id":"m2quiz-ch6-q29","ch":6,"section":"Quiz","q":"The smooth, rounded articular process of a bone is termed a","opts":["A. crest.","B. ridge.","C. head.","D. condyle.","E. trochlea."],"a":"D. condyle"},{"id":"m2quiz-ch6-q30","ch":6,"section":"Quiz","q":"The space occupied by an osteocyte is called a","opts":["A. Volkmann's canal.","B. lacuna.","C. trabecula.","D. Haversian canal.","E. Venetian canal."],"a":"B. lacuna"},{"id":"m2quiz-ch6-q31","ch":6,"section":"Quiz","q":"The structural units of mature compact bone are called","opts":["A. lacunae.","B. osteocytes.","C. osteons.","D. canaliculi.","E. lamellae."],"a":"C. osteons"},{"id":"m2quiz-ch6-q32","ch":6,"section":"Quiz","q":"The tip of a long bone is called the","opts":["A. epiphysis.","B. diaphysis.","C. epiphyseal plate.","D. metaphysis.","E. lamella."],"a":"A. epiphysis"},{"id":"m2quiz-ch6-q33","ch":6,"section":"Quiz","q":"The trabeculae of spongy bone","opts":["A. are organized parallel to the long axis of the bone.","B. are organized along stress lines.","C. are composed mostly of cartilage.","D. will collapse under stress.","E. are concentrated in the cortex of the diaphysis."],"a":"B. are organized along stress lines"},{"id":"m2quiz-ch6-q34","ch":6,"section":"Quiz","q":"________ account(s) for almost two-thirds of the weight of bone.","opts":["A. Water","B. Calcium carbonate","C. Collagen fibers","D. Fluoride","E. Calcium phosphate"],"a":"E. Calcium phosphate"},{"id":"m2quiz-ch6-q35","ch":6,"section":"Quiz","q":"A child with rickets often has","opts":["A. oversized facial bones.","B. long fingers.","C. frequent bruises.","D. bowed legs.","E. inadequate muscle development."],"a":"D. bowed legs"}]},{"key":"m2x","name":"Module 2 Extra","sub":"High-yield notes/map sweep for Ch 4-6 exam coverage","cards":[{"id":"m2x-c4-001","ch":4,"section":"Ch 4 Core","q":"What is a tissue?","a":"A group of cells similar in structure and function."},{"id":"m2x-c4-002","ch":4,"section":"Ch 4 Core","q":"What are the four primary tissue types?","a":"Epithelial, connective, muscle, and nervous tissue."},{"id":"m2x-c4-003","ch":4,"section":"Ch 4 Core","q":"What does histology study?","a":"The microscopic structure of tissues."},{"id":"m2x-c4-004","ch":4,"section":"Ch 4 Core","q":"Which germ layer forms epidermis and nervous tissue?","a":"Ectoderm."},{"id":"m2x-c4-005","ch":4,"section":"Ch 4 Core","q":"Which germ layer forms muscle and most connective tissues?","a":"Mesoderm."},{"id":"m2x-c4-006","ch":4,"section":"Ch 4 Core","q":"Which germ layer forms digestive and respiratory epithelial linings?","a":"Endoderm."},{"id":"m2x-c4-007","ch":4,"section":"Ch 4 Core","q":"What are the four tissue membrane types?","a":"Cutaneous, mucous, serous, and synovial membranes."},{"id":"m2x-c4-008","ch":4,"section":"Ch 4 Core","q":"Which membrane lines cavities open to the exterior?","a":"Mucous membrane: epithelium plus lamina propria; lines digestive, respiratory, urinary, and reproductive tracts."},{"id":"m2x-c4-009","ch":4,"section":"Ch 4 Core","q":"Which membrane lines closed ventral cavities?","a":"Serous membrane; it has parietal and visceral layers and secretes serous fluid."},{"id":"m2x-c4-010","ch":4,"section":"Ch 4 Core","q":"Which membrane lacks epithelium and lines joint cavities?","a":"Synovial membrane."},{"id":"m2x-c4-011","ch":4,"section":"Ch 4 Epithelium","q":"What are the defining features of epithelial tissue?","a":"Tightly packed cells, polarity, basement membrane, little matrix, avascular but innervated, and high regeneration."},{"id":"m2x-c4-012","ch":4,"section":"Ch 4 Epithelium","q":"What do apical and basal mean in epithelial polarity?","a":"Apical = free surface; basal = attached to basement membrane/underlying connective tissue."},{"id":"m2x-c4-013","ch":4,"section":"Ch 4 Epithelium","q":"How are epithelial tissues named?","a":"Number of layers plus apical cell shape: simple/stratified/pseudostratified plus squamous/cuboidal/columnar."},{"id":"m2x-c4-014","ch":4,"section":"Ch 4 Epithelium","q":"What does simple epithelium mean?","a":"One cell layer; best for diffusion, filtration, secretion, or absorption."},{"id":"m2x-c4-015","ch":4,"section":"Ch 4 Epithelium","q":"What does stratified epithelium mean?","a":"Two or more layers; best for protection; named by the apical cells."},{"id":"m2x-c4-016","ch":4,"section":"Ch 4 Epithelium","q":"What does pseudostratified mean?","a":"Looks multilayered because nuclei sit at different heights, but every cell touches the basement membrane."},{"id":"m2x-c4-017","ch":4,"section":"Ch 4 Epithelium","q":"What is transitional epithelium specialized for?","a":"Stretching; dome-shaped surface cells flatten when stretched; found in urinary bladder/ureters."},{"id":"m2x-c4-018","ch":4,"section":"Ch 4 Epithelium","q":"Where is simple squamous epithelium found, and what is it good for?","a":"Alveoli, capillaries, serous membranes; rapid diffusion/filtration and low-friction lining."},{"id":"m2x-c4-019","ch":4,"section":"Ch 4 Epithelium","q":"Where is simple cuboidal epithelium found?","a":"Kidney tubules, gland ducts, ovary surface; secretion and absorption."},{"id":"m2x-c4-020","ch":4,"section":"Ch 4 Epithelium","q":"Where is simple columnar epithelium found?","a":"Stomach/intestines/gallbladder; absorption and secretion; may have microvilli or cilia."},{"id":"m2x-c4-021","ch":4,"section":"Ch 4 Epithelium","q":"What is the classic airway epithelium for moving mucus?","a":"Pseudostratified ciliated columnar epithelium with goblet cells."},{"id":"m2x-c4-022","ch":4,"section":"Ch 4 Epithelium","q":"Where is stratified squamous epithelium found?","a":"Keratinized: epidermis. Non-keratinized: mouth, esophagus, vagina, anus. Function: protection."},{"id":"m2x-c4-023","ch":4,"section":"Ch 4 Epithelium","q":"What do tight junctions do?","a":"Seal neighboring cells to limit leakage and maintain polarity."},{"id":"m2x-c4-024","ch":4,"section":"Ch 4 Epithelium","q":"What do desmosomes do?","a":"Strong spot-like cell-to-cell anchoring; resist shearing; important in skin and heart."},{"id":"m2x-c4-025","ch":4,"section":"Ch 4 Epithelium","q":"What do hemidesmosomes do?","a":"Anchor epithelial cells to the basement membrane."},{"id":"m2x-c4-026","ch":4,"section":"Ch 4 Epithelium","q":"What do gap junctions do?","a":"Allow ions and small molecules to pass between neighboring cells; important in cardiac/smooth muscle communication."},{"id":"m2x-c4-027","ch":4,"section":"Ch 4 Epithelium","q":"What is the difference between endocrine and exocrine glands?","a":"Endocrine glands are ductless and secrete hormones into blood/interstitial fluid; exocrine glands secrete through ducts onto a surface/lumen."},{"id":"m2x-c4-028","ch":4,"section":"Ch 4 Epithelium","q":"What is a goblet cell?","a":"A unicellular exocrine gland that secretes mucin/mucus."},{"id":"m2x-c4-029","ch":4,"section":"Ch 4 Epithelium","q":"Compare merocrine, apocrine, and holocrine secretion.","a":"Merocrine = exocytosis; apocrine = apical portion pinches off; holocrine = whole cell ruptures."},{"id":"m2x-c4-030","ch":4,"section":"Ch 4 Connective","q":"What are the three essential components of connective tissue?","a":"Cells, ground substance, and protein fibers."},{"id":"m2x-c4-031","ch":4,"section":"Ch 4 Connective","q":"What is extracellular matrix?","a":"Ground substance plus fibers around connective-tissue cells."},{"id":"m2x-c4-032","ch":4,"section":"Ch 4 Connective","q":"What does collagen provide?","a":"Tensile strength and resistance to pulling."},{"id":"m2x-c4-033","ch":4,"section":"Ch 4 Connective","q":"What do elastic fibers provide?","a":"Stretch and recoil."},{"id":"m2x-c4-034","ch":4,"section":"Ch 4 Connective","q":"What do reticular fibers provide?","a":"Fine supportive networks/stroma in soft organs."},{"id":"m2x-c4-035","ch":4,"section":"Ch 4 Connective","q":"What cell makes most connective-tissue fibers and matrix?","a":"Fibroblast."},{"id":"m2x-c4-036","ch":4,"section":"Ch 4 Connective","q":"What do adipocytes, mast cells, macrophages, and plasma cells do?","a":"Adipocytes store fat; mast cells release histamine; macrophages phagocytose debris/pathogens; plasma cells make antibodies."},{"id":"m2x-c4-037","ch":4,"section":"Ch 4 Connective","q":"What are the three loose connective tissues?","a":"Areolar, adipose, and reticular."},{"id":"m2x-c4-038","ch":4,"section":"Ch 4 Connective","q":"What are the three dense connective tissues?","a":"Dense regular, dense irregular, and dense elastic connective tissue."},{"id":"m2x-c4-039","ch":4,"section":"Ch 4 Connective","q":"Tendon vs ligament?","a":"Tendon connects muscle to bone; ligament connects bone to bone; both are dense regular connective tissue."},{"id":"m2x-c4-040","ch":4,"section":"Ch 4 Connective","q":"Why does cartilage heal slowly?","a":"It is avascular, so nutrients diffuse slowly through matrix."},{"id":"m2x-c4-041","ch":4,"section":"Ch 4 Connective","q":"What are the three major cartilage types?","a":"Hyaline, fibrocartilage, and elastic cartilage."},{"id":"m2x-c4-042","ch":4,"section":"Ch 4 Connective","q":"Where is hyaline cartilage found?","a":"Articular surfaces, costal cartilages, nose, trachea/larynx, embryonic skeleton."},{"id":"m2x-c4-043","ch":4,"section":"Ch 4 Connective","q":"Where is fibrocartilage found?","a":"Intervertebral discs, menisci, pubic symphysis; strongest cartilage for compression/tension."},{"id":"m2x-c4-044","ch":4,"section":"Ch 4 Connective","q":"Where is elastic cartilage found?","a":"External ear and epiglottis; flexible support."},{"id":"m2x-c4-045","ch":4,"section":"Ch 4 Connective","q":"What cells live in lacunae in cartilage and bone?","a":"Chondrocytes in cartilage; osteocytes in bone."},{"id":"m2x-c4-046","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"Compare the three muscle tissues.","a":"Skeletal: voluntary, striated, multinucleated. Cardiac: striated, branched, intercalated discs. Smooth: nonstriated, spindle-shaped, involuntary."},{"id":"m2x-c4-047","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"What are intercalated discs?","a":"Specialized junctions between cardiac muscle cells; support synchronized contraction."},{"id":"m2x-c4-048","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"What are the main parts of a neuron?","a":"Cell body/soma, dendrites, axon, axon terminals."},{"id":"m2x-c4-049","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"Dendrite vs axon?","a":"Dendrites receive signals; axons conduct signals away from the cell body."},{"id":"m2x-c4-050","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"Name the CNS neuroglia and their core roles.","a":"Astrocytes support/BBB, oligodendrocytes myelinate CNS axons, microglia are immune/phagocytes, ependymal cells help with CSF."},{"id":"m2x-c4-051","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"Name the PNS neuroglia and their core roles.","a":"Schwann cells myelinate PNS axons; satellite cells support neuron cell bodies in ganglia."},{"id":"m2x-c4-052","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"What are the cardinal signs of inflammation?","a":"Redness, heat, swelling, pain, and often loss of function."},{"id":"m2x-c4-053","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"Regeneration vs fibrosis?","a":"Regeneration replaces damaged tissue with the same tissue type; fibrosis repairs with scar collagen."},{"id":"m2x-c4-054","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"What happens in tissue repair?","a":"Inflammation/clot, granulation tissue and fibroblast collagen deposition, then maturation/remodeling."},{"id":"m2x-c4-055","ch":4,"section":"Ch 4 Muscle/Nerve/Repair","q":"How does aging affect tissues?","a":"Slower repair, thinner epithelia, less collagen/elastin, reduced elasticity, and lower functional reserve."},{"id":"m2x-c5-001","ch":5,"section":"Ch 5 Core","q":"What are the two components of the integumentary system?","a":"Cutaneous membrane (skin) and accessory structures: hair, nails, glands, and receptors."},{"id":"m2x-c5-002","ch":5,"section":"Ch 5 Core","q":"What are the main functions of skin?","a":"Protection, thermoregulation, sensation, vitamin D synthesis, excretion, lipid storage, blood reservoir, and melanin/keratin production."},{"id":"m2x-c5-003","ch":5,"section":"Ch 5 Core","q":"What tissue is the epidermis made of?","a":"Keratinized stratified squamous epithelium; avascular."},{"id":"m2x-c5-004","ch":5,"section":"Ch 5 Core","q":"What cells are found in the epidermis?","a":"Keratinocytes, melanocytes, dendritic/Langerhans cells, and Merkel/tactile cells."},{"id":"m2x-c5-005","ch":5,"section":"Ch 5 Core","q":"What are the epidermal strata deep to superficial?","a":"Basale, spinosum, granulosum, lucidum, corneum."},{"id":"m2x-c5-006","ch":5,"section":"Ch 5 Core","q":"Which stratum is the mitotic stem-cell layer?","a":"Stratum basale/germinativum."},{"id":"m2x-c5-007","ch":5,"section":"Ch 5 Core","q":"Which stratum contains many desmosomes and Langerhans cells?","a":"Stratum spinosum."},{"id":"m2x-c5-008","ch":5,"section":"Ch 5 Core","q":"Which stratum starts keratinization with keratohyalin/lamellar granules?","a":"Stratum granulosum."},{"id":"m2x-c5-009","ch":5,"section":"Ch 5 Core","q":"Which stratum appears only in thick skin?","a":"Stratum lucidum, found in palms/soles."},{"id":"m2x-c5-010","ch":5,"section":"Ch 5 Core","q":"Which stratum is the dead keratinized barrier layer?","a":"Stratum corneum."},{"id":"m2x-c5-011","ch":5,"section":"Ch 5 Core","q":"Thin skin vs thick skin?","a":"Thin skin has 4 epidermal strata and hair/glands; thick skin has 5 strata including lucidum, no hair, palms/soles."},{"id":"m2x-c5-012","ch":5,"section":"Ch 5 Core","q":"What are the layers of the dermis?","a":"Papillary layer (areolar CT, dermal papillae, capillaries, Meissner corpuscles) and reticular layer (dense irregular CT, vessels, glands, follicles, Pacinian corpuscles)."},{"id":"m2x-c5-013","ch":5,"section":"Ch 5 Core","q":"Merkel, Meissner, and Pacinian receptors?","a":"Merkel cells = light touch; Meissner corpuscles = light touch in dermal papillae; Pacinian corpuscles = deep pressure/vibra
