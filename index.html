heart and blood vessels through homeostatic mechanisms. What tone does each component of the cardiovascular system have? What connections does the cardiovascular center invoke to keep these two systems in their resting tone?","a":"The heart—based on the resting heart rate—is under parasympathetic tone, and the blood vessels—based on the lack of parasympathetic input—are under sympathetic tone. The vagus nerve contributes to the lowered resting heart rate, whereas the vasomotor nerves maintain the slight constriction of systemic blood vessels."},{"id":"s2-c15-ct33","ch":15,"section":"CT","q":"Why does smoking increase the risk of heart disease? Provide two reasons based on autonomic function.","a":"Blood vessels, and therefore blood pressure, are primarily influenced by only the sympathetic system. There is no parasympathetic influence on blood pressure, so nicotine activation of autonomic ganglia will preferentially increase blood pressure. Also, cardiac muscle tissue is only modulated by autonomic inputs, so the conflicting information from both sympathetic and parasympathetic postganglionic fibers will cause arrhythmias. Both hypertension and arrhythmias are cardiac risk factors."},{"id":"s2-c15-ct34","ch":15,"section":"CT","q":"Why might topical, cosmetic application of atropine or scopolamine from the belladonna plant not cause fatal poisoning, as would occur with ingestion of the plant?","a":"Drops of these substances into the eyes, as was once done cosmetically, blocks the muscarinic receptors in the smooth muscle of the iris. The concentration of this direct application is probably below the concentration that would cause poisoning if it got into the bloodstream. The possibility of that concentration being wrong and causing poisoning is too great, however, for atropine to be used as a cosmetic. Anatomy &amp; Physiology Unit 3: Regulation, Integration, and Control"},{"id":"s2-c17-rq6","ch":17,"section":"RQ","q":"Endocrine glands ________.","opts":["A. secrete hormones that travel through a duct to the target organs 724     17 • Interactive Link Questions Access for free at openstax.org","B. release neurotransmitters into the synaptic cleft","C. secrete chemical messengers that travel in the bloodstream","D. include sebaceous glands and sweat glands"],"a":"C. secrete chemical messengers that travel in the bloodstream"},{"id":"s2-c17-rq7","ch":17,"section":"RQ","q":"Chemical signaling that affects neighboring cells is called ________.","opts":["A. autocrine","B. paracrine","C. endocrine","D. neuron"],"a":"B. paracrine"},{"id":"s2-c17-rq8","ch":17,"section":"RQ","q":"A newly developed pesticide has been observed to bind to an intracellular hormone receptor. If ingested, residue from this pesticide could disrupt levels of ________.","opts":["A. melatonin","B. thyroid hormone","C. growth hormone","D. insulin"],"a":"B. thyroid hormone"},{"id":"s2-c17-rq9","ch":17,"section":"RQ","q":"A small molecule binds to a G protein, preventing its activation. What direct effect will this have on signaling that involves cAMP?","opts":["A. The hormone will not be able to bind to the hormone receptor.","B. Adenylyl cyclase will not be activated.","C. Excessive quantities of cAMP will be produced.","D. The phosphorylation cascade will be initiated."],"a":"B. Adenylyl cyclase will not be activated."},{"id":"s2-c17-rq10","ch":17,"section":"RQ","q":"A student is in a car accident, and although not hurt, immediately experiences pupil dilation, increased heart rate, and rapid breathing. What type of endocrine system stimulus did the student receive?","opts":["A. humoral","B. hormonal","C. neural","D. positive feedback"],"a":"C. neural"},{"id":"s2-c17-rq11","ch":17,"section":"RQ","q":"The hypothalamus is functionally and anatomically connected to the posterior pituitary lobe by a bridge of ________.","opts":["A. blood vessels","B. nerve axons","C. cartilage","D. bone"],"a":"B. nerve axons"},{"id":"s2-c17-rq12","ch":17,"section":"RQ","q":"Which of the following is an anterior pituitary hormone?","opts":["A. ADH","B. oxytocin","C. TSH","D. cortisol"],"a":"C. TSH"},{"id":"s2-c17-rq13","ch":17,"section":"RQ","q":"How many hormones are produced by the posterior pituitary?","opts":["A. 0","B. 1","C. 2","D. 6"],"a":"A. 0"},{"id":"s2-c17-rq14","ch":17,"section":"RQ","q":"Which of the following hormones contributes to the regulation of the body’s fluid and electrolyte balance?","opts":["A. adrenocorticotropic hormone","B. antidiuretic hormone 17 • Review Questions     725","C. luteinizing hormone","D. all of the above"],"a":"B. antidiuretic hormone 17 • Review Questions     725"},{"id":"s2-c17-rq15","ch":17,"section":"RQ","q":"Which of the following statements about the thyroid gland is true?","opts":["A. It is located anterior to the trachea and inferior to the larynx.","B. The parathyroid glands are embedded within it.","C. It manufactures three hormones.","D. all of the above"],"a":"D. all of the above"},{"id":"s2-c17-rq16","ch":17,"section":"RQ","q":"The secretion of thyroid hormones is controlled by ________.","opts":["A. TSH from the hypothalamus","B. TSH from the anterior pituitary","C. thyroxine from the anterior pituitary","D. thyroglobulin from the thyroid’s parafollicular cells"],"a":"B. TSH from the anterior pituitary"},{"id":"s2-c17-rq17","ch":17,"section":"RQ","q":"The development of a goiter indicates that ________.","opts":["A. the anterior pituitary is abnormally enlarged","B. there is hypertrophy of the thyroid’s follicle cells","C. there is an excessive accumulation of colloid in the thyroid follicles","D. the anterior pituitary is secreting excessive growth hormone"],"a":"C. there is an excessive accumulation of colloid in the thyroid follicles"},{"id":"s2-c17-rq18","ch":17,"section":"RQ","q":"Iodide ions cross from the bloodstream into follicle cells via ________.","opts":["A. simple diffusion","B. facilitated diffusion","C. active transport","D. osmosis"],"a":"C. active transport"},{"id":"s2-c17-rq19","ch":17,"section":"RQ","q":"When blood calcium levels are low, PTH stimulates ________.","opts":["A. urinary excretion of calcium by the kidneys","B. a reduction in calcium absorption from the intestines","C. the activity of osteoblasts","D. the activity of osteoclasts"],"a":"D. the activity of osteoclasts"},{"id":"s2-c17-rq20","ch":17,"section":"RQ","q":"Which of the following can result from hyperparathyroidism?","opts":["A. increased bone deposition","B. fractures","C. convulsions","D. all of the above"],"a":"B. fractures"},{"id":"s2-c17-rq21","ch":17,"section":"RQ","q":"The adrenal glands are attached superiorly to which organ?","opts":["A. thyroid","B. liver","C. kidneys","D. hypothalamus"],"a":"C. kidneys"},{"id":"s2-c17-rq22","ch":17,"section":"RQ","q":"What secretory cell type is found in the adrenal medulla?","opts":["A. chromaffin cells","B. neuroglial cells","C. follicle cells","D. oxyphil cells"],"a":"A. chromaffin cells"},{"id":"s2-c17-rq23","ch":17,"section":"RQ","q":"Cushing’s disease is a disorder caused by ________.","opts":["A. abnormally low levels of cortisol 726     17 • Review Questions Access for free at openstax.org","B. abnormally high levels of cortisol","C. abnormally low levels of aldosterone","D. abnormally high levels of aldosterone"],"a":"B. abnormally high levels of cortisol"},{"id":"s2-c17-rq24","ch":17,"section":"RQ","q":"Which of the following responses is not part of the fight-or-flight response?","opts":["A. pupil dilation","B. increased oxygen supply to the lungs","C. suppressed digestion","D. reduced mental activity"],"a":"D. reduced mental activity"},{"id":"s2-c17-rq25","ch":17,"section":"RQ","q":"What cells secrete melatonin?","opts":["A. melanocytes","B. pinealocytes","C. suprachiasmatic nucleus cells","D. retinal cells"],"a":"B. pinealocytes"},{"id":"s2-c17-rq26","ch":17,"section":"RQ","q":"The production of melatonin is inhibited by ________.","opts":["A. declining levels of light","B. exposure to bright light","C. the secretion of serotonin","D. the activity of pinealocytes"],"a":"B. exposure to bright light"},{"id":"s2-c17-rq27","ch":17,"section":"RQ","q":"The gonads produce what class of hormones?","opts":["A. amine hormones","B. peptide hormones","C. steroid hormones","D. catecholamines"],"a":"C. steroid hormones"},{"id":"s2-c17-rq28","ch":17,"section":"RQ","q":"The production of FSH by the anterior pituitary is reduced by which hormone?","opts":["A. estrogens","B. progesterone","C. relaxin","D. inhibin"],"a":"D. inhibin"},{"id":"s2-c17-rq29","ch":17,"section":"RQ","q":"The function of the placental hormone human placental lactogen (hPL) is to ________.","opts":["A. prepare the breasts for lactation","B. nourish the placenta","C. regulate the menstrual cycle","D. all of the above"],"a":"A. prepare the breasts for lactation"},{"id":"s2-c17-rq30","ch":17,"section":"RQ","q":"If an autoimmune disorder targets the alpha cells, production of which hormone would be directly affected?","opts":["A. somatostatin","B. pancreatic polypeptide","C. insulin","D. glucagon"],"a":"D. glucagon"},{"id":"s2-c17-rq31","ch":17,"section":"RQ","q":"Which of the following statements about insulin is true?","opts":["A. Insulin acts as a transport protein, carrying glucose across the cell membrane.","B. Insulin facilitates the movement of intracellular glucose transporters to the cell membrane.","C. Insulin stimulates the breakdown of stored glycogen into glucose.","D. Insulin stimulates the kidneys to reabsorb glucose into the bloodstream."],"a":"B. Insulin facilitates the movement of intracellular glucose transporters to the cell membrane."},{"id":"s2-c17-rq32","ch":17,"section":"RQ","q":"The walls of the atria produce which hormone? 17 • Review Questions     727","opts":["A. cholecystokinin","B. atrial natriuretic peptide","C. renin","D. calcitriol"],"a":"B. atrial natriuretic peptide"},{"id":"s2-c17-rq33","ch":17,"section":"RQ","q":"The end result of the RAAS is to ________.","opts":["A. reduce blood volume","B. increase blood glucose","C. reduce blood pressure","D. increase blood pressure"],"a":"D. increase blood pressure"},{"id":"s2-c17-rq34","ch":17,"section":"RQ","q":"Athletes may take synthetic EPO to boost their ________.","opts":["A. blood calcium levels","B. secretion of growth hormone","C. blood oxygen levels","D. muscle mass"],"a":"C. blood oxygen levels"},{"id":"s2-c17-rq35","ch":17,"section":"RQ","q":"Hormones produced by the thymus play a role in the ________.","opts":["A. development of T cells","B. preparation of the body for childbirth","C. regulation of appetite","D. release of hydrochloric acid in the stomach"],"a":"A. development of T cells"},{"id":"s2-c17-rq36","ch":17,"section":"RQ","q":"The anterior pituitary gland develops from which embryonic germ layer?","opts":["A. oral ectoderm","B. neural ectoderm","C. mesoderm","D. endoderm"],"a":"A. oral ectoderm"},{"id":"s2-c17-rq37","ch":17,"section":"RQ","q":"In the elderly, decreased thyroid function causes ________.","opts":["A. increased tolerance for cold","B. decreased basal metabolic rate","C. decreased body fat","D. osteoporosis"],"a":"B. decreased basal metabolic rate"},{"id":"s2-c17-ct38","ch":17,"section":"CT","q":"Describe several main differences in the communication methods used by the endocrine system and the nervous system.","a":"The endocrine system uses chemical signals called hormones to convey information from one part of the body to a distant part of the body. Hormones are released from the endocrine cell into the extracellular environment, but then travel in the bloodstream to target tissues. This communication and response can take seconds to days. In contrast, neurons transmit electrical signals along their axons. At the axon terminal, the electrical signal prompts the release of a chemical signal called a neurotransmitter that carries the message across the synaptic cleft to elicit a response in the neighboring cell. This method of communication is nearly instantaneous, of very brief duration, and is highly specific."},{"id":"s2-c17-ct39","ch":17,"section":"CT","q":"Compare and contrast endocrine and exocrine glands.","a":"Endocrine glands are ductless. They release their secretion into the surrounding fluid, from which it enters the bloodstream or lymph to travel to distant cells. Moreover, the secretions of endocrine glands are hormones. Exocrine glands release their secretions through a duct that delivers the secretion to the target location. Moreover, the secretions of exocrine glands are not hormones, but compounds that have an immediate physiologic function. For example, pancreatic juice contains enzymes that help digest food."},{"id":"s2-c17-ct40","ch":17,"section":"CT","q":"True or false: Neurotransmitters are a special class of paracrines. Explain your answer.","a":"True. Neurotransmitters can be classified as paracrines because, upon their release from a neuron’s axon terminals, they travel across a microscopically small cleft to exert their effect on a nearby neuron or muscle cell."},{"id":"s2-c17-ct41","ch":17,"section":"CT","q":"Compare and contrast the signaling events involved with the second messengers cAMP and IP3.","a":"In both cAMP and IP3–calcium signaling, a hormone binds to a cell membrane hormone receptor that is coupled to a G protein. The G protein becomes activated when the hormone binds. In the case of cAMP signaling, the activated G protein activates adenylyl cyclase, which causes ATP to be converted to cAMP. This second messenger can then initiate other signaling events, such as a phosphorylation cascade. In the case of IP3–calcium signaling, the activated G protein activates phospholipase C, which cleaves a membrane phospholipid compound into DAG and IP3. IP3 causes the release of calcium, another second messenger, from intracellular stores. This causes further signaling events."},{"id":"s2-c17-ct42","ch":17,"section":"CT","q":"Describe the mechanism of hormone response resulting from the binding of a hormone with an intracellular receptor.","a":"An intracellular hormone receptor is located within the cell. A hydrophobic hormone diffuses through the cell membrane and binds to the intracellular hormone receptor, which may be in the cytosol or in the cell nucleus. This hormone–receptor complex binds to a segment of DNA. This initiates the transcription of a target gene, the end result of which is protein assembly and the hormonal response."},{"id":"s2-c17-ct43","ch":17,"section":"CT","q":"Compare and contrast the anatomical relationship of the anterior and posterior lobes of the pituitary gland to the hypothalamus.","a":"The anterior lobe of the pituitary gland is connected to the hypothalamus by vasculature, which allows regulating hormones from the hypothalamus to travel to the anterior pituitary. In contrast, the posterior lobe is connected to the hypothalamus by a bridge of nerve axons called the hypothalamic–hypophyseal tract, along which the hypothalamus sends hormones produced by hypothalamic nerve cell bodies to the posterior pituitary for storage and release into the circulation."},{"id":"s2-c17-ct44","ch":17,"section":"CT","q":"Name the target tissues for prolactin.","a":"The mammary glands are the target tissues for prolactin."},{"id":"s2-c17-ct45","ch":17,"section":"CT","q":"Explain why maternal iodine deficiency might lead to neurological impairment in the fetus.","a":"Iodine deficiency in a pregnant woman would also deprive the fetus. Iodine is required for the synthesis of thyroid hormones, which contribute to fetal growth and development, including maturation of the nervous system. Insufficient amounts would impair these functions."},{"id":"s2-c17-ct46","ch":17,"section":"CT","q":"Define hyperthyroidism and explain why one of its symptoms is weight loss.","a":"Hyperthyroidism is an abnormally elevated blood level of thyroid hormones due to an overproduction of T3 and T4. An individual with hyperthyroidism is likely to lose weight because one of the primary roles of thyroid hormones is to increase the body’s basal metabolic rate, increasing the breakdown of nutrients and the production of ATP."},{"id":"s2-c17-ct47","ch":17,"section":"CT","q":"Describe the role of negative feedback in the function of the parathyroid gland.","a":"The production and secretion of PTH is regulated by a negative feedback loop. Low blood calcium levels initiate the production and secretion of PTH. PTH increases bone resorption, calcium absorption from the intestines, and calcium reabsorption by the kidneys. As a result, blood calcium levels begin to rise. This, in turn, inhibits the further production and secretion of PTH."},{"id":"s2-c17-ct48","ch":17,"section":"CT","q":"Explain why someone with a parathyroid gland tumor might develop kidney stones.","a":"A parathyroid gland tumor can prompt hypersecretion of PTH. This can raise blood calcium levels so excessively that calcium deposits begin to accumulate throughout the body, including in the kidney tubules, where they are referred to as kidney stones."},{"id":"s2-c17-ct49","ch":17,"section":"CT","q":"What are the three regions of the adrenal cortex and what hormones do they produce?","a":"The outer region is the zona glomerulosa, which produces mineralocorticoids such as aldosterone; the next region is the zona fasciculata, which produces glucocorticoids such as cortisol; the inner region is the zona reticularis, which produces androgens."},{"id":"s2-c17-ct50","ch":17,"section":"CT","q":"If innervation to the adrenal medulla were disrupted, what would be the physiological outcome?","a":"Damage to the innervation of the adrenal medulla would prevent the adrenal glands from responding to the hypothalamus during the fight-or-flight response. Therefore, the response would be reduced."},{"id":"s2-c17-ct51","ch":17,"section":"CT","q":"Compare and contrast the short-term and long-term stress response.","a":"The short-term stress response involves the hormones epinephrine and norepinephrine, which work to increase the oxygen supply to organs important for extreme muscular action such as the brain, lungs, and muscles. In the long-term stress response, the hormone cortisol is involved in catabolism of glycogen stores, proteins, and triglycerides, glucose and ketone synthesis, and downregulation of the immune system."},{"id":"s2-c17-ct52","ch":17,"section":"CT","q":"Seasonal affective disorder (SAD) is a mood disorder characterized by, among other symptoms, increased appetite, sluggishness, and increased sleepiness. It occurs most commonly during the winter months, especially in regions with long winter nights. Propose a role for melatonin in SAD and a possible non-drug therapy.","a":"SAD is thought to occur in part because low levels and duration of sunlight allow excessive and prolonged secretion of melatonin. Light therapy—daytime exposure to very bright lighting—is one common therapy."},{"id":"s2-c17-ct53","ch":17,"section":"CT","q":"Retinitis pigmentosa (RP) is a disease that causes deterioration of the retinas of the eyes. Describe the impact RP would have on melatonin levels.","a":"The retina is important for melatonin production because it senses light. Bright light inhibits the production of melatonin, whereas low light levels promote the production of melatonin. Therefore, deterioration of the retinas would most likely disturb the sleep-wake pattern because melatonin production would be elevated."},{"id":"s2-c17-ct54","ch":17,"section":"CT","q":"Compare and contrast the role of estrogens and progesterone.","a":"Both estrogens and progesterone are steroid hormones produced by the ovaries that help regulate the menstrual cycle. Estrogens play an important role in the development of the female reproductive tract and secondary sex characteristics. They also help maintain pregnancy. Progesterone prepares the body for pregnancy and helps maintain pregnancy."},{"id":"s2-c17-ct55","ch":17,"section":"CT","q":"Describe the role of placental secretion of relaxin in preparation for childbirth.","a":"Relaxin produced by the placenta is thought to soften and widen the pubic symphysis. This increases the size of the pelvic outlet, the birth canal through which the fetus passes during vaginal childbirth."},{"id":"s2-c17-ct56","ch":17,"section":"CT","q":"What would be the physiological consequence of a disease that destroyed the beta cells of the pancreas?","a":"The beta cells produce the hormone insulin, which is important in the regulation of blood glucose levels. All insulin-dependent cells of the body require insulin in order to take up glucose from the bloodstream. Destruction of the beta cells would result in an inability to produce and secrete insulin, leading to abnormally high blood glucose levels and the disease called type 1 diabetes mellitus."},{"id":"s2-c17-ct57","ch":17,"section":"CT","q":"Why is foot care extremely important for people with diabetes mellitus?","a":"Excessive blood glucose levels damage the blood vessels and nerves of the body’s extremities, increasing the risk for injury, infection, and tissue death. Loss of sensation to the feet means that a diabetic patient will not be able to feel foot trauma, such as from ill-fitting shoes. Even minor injuries commonly lead to infection, which, can progress to tissue death without proper care, requiring amputation."},{"id":"s2-c17-ct58","ch":17,"section":"CT","q":"Summarize the role of GI tract hormones following a meal.","a":"The presence of food in the GI tract stimulates the release of hormones that aid in digestion. For example, gastrin is secreted in response to stomach distention and causes the release of hydrochloric acid in the stomach. Secretin is secreted when acidic chyme enters the small intestine, and stimulates the release of pancreatic bicarbonate. In the presence of fat and protein in the duodenum, CCK stimulates the release of pancreatic digestive enzymes and bile from the gallbladder. Other GI tract hormones aid in glucose metabolism and other functions."},{"id":"s2-c17-ct59","ch":17,"section":"CT","q":"Compare and contrast the thymus gland in infancy and adulthood.","a":"The thymus gland is important for the development and maturation of T cells. During infancy and early childhood, the thymus gland is large and very active, as the immune system is still developing. During adulthood, the thymus gland atrophies because the immune system is already developed."},{"id":"s2-c17-ct60","ch":17,"section":"CT","q":"Distinguish between the effects of menopause and andropause on fertility","a":"Menopause occurs as the result of a progressive decline in the function of the ovaries, resulting in low estrogen and progesterone levels. Ovulation ceases, and postmenopausal woman can no longer conceive a child. In contrast, andropause is a much more gradual and subtle decline in testosterone levels and functioning. A man typically maintains fertility until very old age, although the quantity, quality, and motility of the sperm he produces may be reduced. Anatomy &amp; Physiology Unit 4: Fluids and Transport"},{"id":"s2-c14-lab1","ch":14,"section":"Lab","q":"Olfactory information is first received by which part of the brain?","a":"The olfactory bulb (which relays to the olfactory cortex, bypassing the thalamus)."},{"id":"s2-c14-lab2","ch":14,"section":"Lab","q":"Which of these special senses can replace its damaged neural receptors?","a":"Olfaction (smell) — olfactory receptor neurons are regenerated from basal stem cells."},{"id":"s2-c14-lab3","ch":14,"section":"Lab","q":"Olfactory receptors send axons through the cribriform plate. They synapse on neurons in the ___ bulb.","a":"olfactory"},{"id":"s2-c14-lab4","ch":14,"section":"Lab","q":"___ receptors are located on the surface of the tongue.","a":"Taste (gustatory) receptors"},{"id":"s2-c14-lab5","ch":14,"section":"Lab","q":"Destruction to your left ___ nerve would result in a reduction in ability to identify sour and bitter foods.","a":"glossopharyngeal (CN IX) — carries taste from the posterior 1/3 of the tongue"},{"id":"s2-c14-lab6","ch":14,"section":"Lab","q":"An adult has approximately ___ taste buds.","a":"About 10,000 taste buds."},{"id":"s2-c14-lab7","ch":14,"section":"Lab","q":"The taste sensation that is triggered by the amino acid glutamate is known as ___.","a":"umami (savory)"},{"id":"s2-c14-lab8","ch":14,"section":"Lab","q":"What structure changes the shape of the lens for far and near vision?","a":"The ciliary muscle (of the ciliary body)."},{"id":"s2-c14-lab9","ch":14,"section":"Lab","q":"The palpebrae (eyelids) are connected at the ___.","a":"canthus (medial and lateral canthi/commissures)"},{"id":"s2-c14-lab10","ch":14,"section":"Lab","q":"The space between the iris/ciliary body and the lens is the ___ chamber.","a":"posterior"},{"id":"s2-c14-lab11","ch":14,"section":"Lab","q":"Which structure produces a lipid-rich secretion that prevents the eyelids from sticking together at their edges?","a":"The tarsal (Meibomian) glands."},{"id":"s2-c14-lab12","ch":14,"section":"Lab","q":"The space between the cornea and the iris is the ___ chamber.","a":"anterior"},{"id":"s2-c14-lab13","ch":14,"section":"Lab","q":"The shape of the lens is controlled by the ___ muscles.","a":"ciliary"},{"id":"s2-c14-lab14","ch":14,"section":"Lab","q":"The ___ covers most of the exposed surface of the eye.","a":"conjunctiva (bulbar conjunctiva)"},{"id":"s2-c14-lab15","ch":14,"section":"Lab","q":"The part of the eye that determines eye color is the ___. The opening through which light passes is the ___.","a":"iris; pupil"},{"id":"s2-c14-lab16","ch":14,"section":"Lab","q":"What is the function of tears?","a":"Clean, lubricate, and moisten the eye, wash away debris, and provide antibacterial protection (lysozyme)."},{"id":"s2-c14-lab17","ch":14,"section":"Lab","q":"A ray of light entering the eye passes: conjunctiva → ___ → aqueous humor → lens → ___ → retina.","a":"cornea; vitreous humor"},{"id":"s2-c14-lab18","ch":14,"section":"Lab","q":"The gelatinous material that gives the eyeball its basic shape is the ___.","a":"vitreous humor (vitreous body)"},{"id":"s2-c14-lab19","ch":14,"section":"Lab","q":"Parasympathetic activation causes pupillary ___, and sympathetic activation causes ___.","a":"constriction (miosis); dilation (mydriasis)"},{"id":"s2-c14-lab20","ch":14,"section":"Lab","q":"During accommodation, the ciliary muscle ___, the suspensory ligaments become ___, and the lens becomes ___.","a":"contracts; relaxed/slack; more rounded (more convex)"},{"id":"s2-c14-lab21","ch":14,"section":"Lab","q":"What structure regulates the amount of light that passes to the photoreceptors of the eye?","a":"The iris (by adjusting pupil size)."},{"id":"s2-c14-lab22","ch":14,"section":"Lab","q":"The three types of cones are sensitive to red, green, and ___.","a":"blue"},{"id":"s2-c14-lab23","ch":14,"section":"Lab","q":"The cell of the retina that produces an action potential that goes to the brain is a(n) ___ cell.","a":"ganglion"},{"id":"s2-c14-lab24","ch":14,"section":"Lab","q":"The first step in photoreception is the absorption of a ___ by a visual pigment.","a":"photon (of light)"},{"id":"s2-c14-lab25","ch":14,"section":"Lab","q":"Adjusting to a dark room takes time because rods must regenerate ___.","a":"rhodopsin (visual pigment)"},{"id":"s2-c14-lab26","ch":14,"section":"Lab","q":"Where are the visual pigments located in the rods and cones?","a":"In the membranous discs of the outer segments."},{"id":"s2-c14-lab27","ch":14,"section":"Lab","q":"The ___ ear collects sound waves and transmits them to the ___ ear, which contains the auditory ossicles.","a":"external (outer); middle"},{"id":"s2-c14-lab28","ch":14,"section":"Lab","q":"The external acoustic meatus ends at the ___ membrane.","a":"tympanic (eardrum)"},{"id":"s2-c14-lab29","ch":14,"section":"Lab","q":"The auditory ___ connect the tympanic membrane to the oval window.","a":"ossicles (malleus, incus, stapes)"},{"id":"s2-c14-lab30","ch":14,"section":"Lab","q":"Vibrations of the tympanic membrane are transferred to the oval window by the ___ ossicles.","a":"auditory (malleus, incus, stapes)"},{"id":"s2-c14-lab31","ch":14,"section":"Lab","q":"The middle ear communicates with the nasopharynx through the auditory tube or ___ tube.","a":"Eustachian (pharyngotympanic) tube"},{"id":"s2-c14-lab32","ch":14,"section":"Lab","q":"Hearing/equilibrium receptors are in the Organ of ___, supported by the ___ membrane.","a":"Corti (spiral organ); basilar membrane"},{"id":"s2-c14-lab33","ch":14,"section":"Lab","q":"Gravity and linear acceleration are sensed in the ___ and utricle.","a":"saccule"},{"id":"s2-c14-lab34","ch":14,"section":"Lab","q":"The olfactory receptors are highly modified ___ neurons.","a":"bipolar"},{"id":"s2-c14-lab35","ch":14,"section":"Lab","q":"The sense of taste is also known as ___.","a":"gustation"},{"id":"s2-c14-lab36","ch":14,"section":"Lab","q":"Taste buds are clusters of individual ___ receptors.","a":"gustatory (taste receptor) cells"},{"id":"s2-c14-lab37","ch":14,"section":"Lab","q":"An irregularity in curvature of the cornea or lens, called ___, reduces visual acuity.","a":"astigmatism"},{"id":"s2-c14-lab38","ch":14,"section":"Lab","q":"Nearsightedness = ___; farsightedness = ___; age-related farsightedness from lens stiffening = ___.","a":"myopia; hyperopia; presbyopia"},{"id":"s2-c14-lab39","ch":14,"section":"Lab","q":"Photoreceptors most useful in dim light are ___; those that convey color are ___.","a":"rods; cones"},{"id":"s2-c14-lab40","ch":14,"section":"Lab","q":"Earwax is produced by ___ glands.","a":"ceruminous"},{"id":"s2-c14-lab41","ch":14,"section":"Lab","q":"___ deafness results from conditions in the outer/middle ear that block transfer of vibrations.","a":"Conductive"},{"id":"s2-c14-lab42","ch":14,"section":"Lab","q":"Abnormal jumpy eye movements after brainstem or inner-ear damage are called ___.","a":"nystagmus"},{"id":"s2-c14-lab43","ch":14,"section":"Lab","q":"The formal term for the sense of balance and equilibrium is the ___ sense.","a":"vestibular (equilibrium) sense"},{"id":"s2-c14-lab44","ch":14,"section":"Lab","q":"When you spin quickly you feel dizzy. Which inner-ear component generates this sensation?","a":"The semicircular canals (detect rotational/angular acceleration via the crista ampullaris)."},{"id":"s2-c17-lab1","ch":17,"section":"Lab","q":"___ are chemical messengers released by cells and transported in blood to alter specific target cells. Catecholamines are derivatives of the amino acid ___. Peptide hormones are composed of ___.","a":"Hormones; tyrosine; amino acids"},{"id":"s2-c17-lab2","ch":17,"section":"Lab","q":"Calcium ions serve as messengers, often in combination with the intracellular protein called ___.","a":"calmodulin"},{"id":"s2-c17-lab3","ch":17,"section":"Lab","q":"Why do steroid hormones use receptors inside target cells, whereas protein/peptide/amino-acid hormones do not?","a":"Steroids are lipid-soluble and diffuse through the membrane to bind intracellular (cytoplasmic/nuclear) receptors; the others are water-soluble and bind surface receptors."},{"id":"s2-c17-lab4","ch":17,"section":"Lab","q":"The hypothalamus acts as both a neural and a(n) ___ organ.","a":"endocrine"},{"id":"s2-c17-lab5","ch":17,"section":"Lab","q":"Hormone chemical categories include peptides, ___, eicosanoids, and amino acid derivatives.","a":"steroids"},{"id":"s2-c17-lab6","ch":17,"section":"Lab","q":"The link between a first messenger and a second messenger in cells responding to peptide hormones is usually a ___ protein.","a":"G protein"},{"id":"s2-c17-lab7","ch":17,"section":"Lab","q":"After a steroid hormone binds its receptor to form an active complex, gene ___ is initiated.","a":"transcription"},{"id":"s2-c17-lab8","ch":17,"section":"Lab","q":"Which hormones are water-soluble and bind extracellular (surface) receptors?","a":"Peptide/protein hormones and catecholamines (e.g., insulin, glucagon, GH, ADH, oxytocin, FSH, LH, TSH, ACTH, PTH, calcitonin, epinephrine). (Thyroid hormone and steroids are the lipid-soluble exceptions.)"},{"id":"s2-step-e19","ch":17,"section":"Step","q":"All ___________ cells have hormone receptors.","opts":["A. target","B. stem","C. totipotent","D. receptor"],"a":"A. target"},{"id":"s2-c17-lab10","ch":17,"section":"Lab","q":"If adenylyl cyclase activity of liver cells were missing, which hormones could no longer stimulate glucose release?","a":"Glucagon (and epinephrine) — they act via the cAMP second-messenger system, which needs adenylyl cyclase."},{"id":"s2-c17-lab11","ch":17,"section":"Lab","q":"Destruction of the supraoptic nucleus of the hypothalamus would have what result?","a":"Loss of ADH production → diabetes insipidus (excess dilute urine, dehydration, intense thirst)."},{"id":"s2-c17-lab12","ch":17,"section":"Lab","q":"The primary function of ADH is to ___ the amount of water lost at the kidneys.","a":"decrease (reduce)"},{"id":"s2-c17-lab13","ch":17,"section":"Lab","q":"If the hypophyseal portal system is destroyed, the hypothalamus can no longer control secretion of which hormones?","a":"The anterior pituitary hormones: GH, TSH, ACTH, FSH, LH, and prolactin."},{"id":"s2-c17-lab14","ch":17,"section":"Lab","q":"Changes in blood osmotic pressure would most affect the secretion of ___.","a":"ADH (antidiuretic hormone)"},{"id":"s2-c17-lab15","ch":17,"section":"Lab","q":"Supraoptic/paraventricular nuclei make ADH and ___. The adenohypophysis releases FSH, TSH, ACTH and ___.","a":"oxytocin; GH, LH, and prolactin"},{"id":"s2-c17-lab16","ch":17,"section":"Lab","q":"The main action of ___ is increased water conservation by the kidneys.","a":"antidiuretic hormone (ADH)"},{"id":"s2-c17-lab17","ch":17,"section":"Lab","q":"Excess secretion of growth hormone during early development will cause ___.","a":"gigantism"},{"id":"s2-c17-lab18","ch":17,"section":"Lab","q":"Name the organs that contain target cells for oxytocin.","a":"The uterus (smooth muscle) and the mammary glands. (Also the prostate gland in males.)"},{"id":"s2-c17-lab19","ch":17,"section":"Lab","q":"The posterior pituitary secretes ___. The pars intermedia hormone in early childhood is ___. Oxytocin is produced in the ___.","a":"ADH and oxytocin; MSH (melanocyte-stimulating hormone); hypothalamus"},{"id":"s2-c17-lab20","ch":17,"section":"Lab","q":"The hormone ___ promotes uterine contractions, milk expression, and prostate contraction.","a":"oxytocin"},{"id":"s2-c15-lab1","ch":15,"section":"Lab","q":"The ___ division of the autonomic nervous system functions during “rest and digest.”","a":"parasympathetic"},{"id":"s2-c15-lab2","ch":15,"section":"Lab","q":"Ganglionic neurons innervate smooth muscle, cardiac muscle, adipose tissue, and ___.","a":"glands"},{"id":"s2-c15-lab3","ch":15,"section":"Lab","q":"The parasympathetic nervous system is especially active during which state?","a":"Rest and digestion (relaxed state; conserving/restoring energy)."},{"id":"s2-c15-lab4","ch":15,"section":"Lab","q":"A visceral motor neuron whose cell body is within the CNS is called a ___ neuron.","a":"preganglionic"},{"id":"s2-c15-lab5","ch":15,"section":"Lab","q":"Sympathetic preganglionic neurons are ___ and have ___ axons.","a":"myelinated; short"},{"id":"s2-c15-lab6","ch":15,"section":"Lab","q":"In the sympathetic nervous system, where are the preganglionic neurons located?","a":"Lateral gray horns of the spinal cord, segments T1–L2 (thoracolumbar)."},{"id":"s2-c15-lab7","ch":15,"section":"Lab","q":"Clusters of ganglionic sympathetic neurons alongside the spinal cord are the sympathetic ___ ganglia.","a":"chain (paravertebral) ganglia"},{"id":"s2-c15-lab8","ch":15,"section":"Lab","q":"Clusters of sympathetic ganglionic neurons that innervate abdominopelvic organs are the ___ ganglia.","a":"collateral (prevertebral) ganglia"},{"id":"s2-c15-lab9","ch":15,"section":"Lab","q":"Injury to the neurons of a collateral ganglion would affect the function of the ___ tract.","a":"digestive (gastrointestinal) tract"},{"id":"s2-c15-lab10","ch":15,"section":"Lab","q":"___ axons usually are unmyelinated.","a":"postganglionic"},{"id":"s2-c15-lab11","ch":15,"section":"Lab","q":"___ nerves contain short preganglionic fibers and longer postganglionic fibers.","a":"sympathetic"},{"id":"s2-c15-lab12","ch":15,"section":"Lab","q":"Racing heart, dilated pupils, and hairs standing up are the result of the ___ response.","a":"sympathetic (“fight-or-flight”) response"},{"id":"s2-c15-lab13","ch":15,"section":"Lab","q":"Drugs known as ___ blockers may be useful for treating excessive heart rate.","a":"beta (beta-adrenergic) blockers"},{"id":"s2-c15-lab14","ch":15,"section":"Lab","q":"The neurotransmitter ___ is always excitatory at the synapses of the sympathetic nervous system.","a":"acetylcholine (ACh) — at the preganglionic→postganglionic (nicotinic) synapse"},{"id":"s2-c15-lab15","ch":15,"section":"Lab","q":"___ innervation refers to an organ receiving both sympathetic and parasympathetic innervation.","a":"dual"},{"id":"s2-c15-lab16","ch":15,"section":"Lab","q":"The parasympathetic division is also called the ___ division; the sympathetic division is also called the ___ division.","a":"craniosacral; thoracolumbar"},{"id":"s2-c15-lab17","ch":15,"section":"Lab","q":"“Rest and digest” is the response of the ___ division of the ANS.","a":"parasympathetic"},{"id":"s2-c15-lab18","ch":15,"section":"Lab","q":"The ganglia located lateral to the vertebral column are part of the ___ (sympathetic).","a":"chain (paravertebral / sympathetic trunk) ganglia"},{"id":"s2-c17-histo1","ch":17,"section":"Histo","q":"Identify this endocrine tissue (organ) and its magnification.","img":"images/histo/h1.jpg","imgBack":"images/histo/h1_full.jpg","a":"Pituitary gland (100×) — posterior pituitary (pale neural tissue with pituicytes) vs anterior pituitary (darker, hormone-secreting cells)"},{"id":"s2-c17-histo2","ch":17,"section":"Histo","q":"Identify this endocrine tissue (organ) and its magnification.","img":"images/histo/h2.jpg","imgBack":"images/histo/h2_full.jpg","a":"Pituitary gland (400×) — anterior lobe acidophils (pink) & basophils (dark purple); posterior lobe pituicyte nuclei"},{"id":"s2-c17-histo3","ch":17,"section":"Histo","q":"Identify this endocrine tissue (organ) and its magnification.","img":"images/histo/h3.jpg","imgBack":"images/histo/h3_full.jpg","a":"Thyroid gland (400×) — follicles filled with pink colloid, lined by cuboidal follicular epithelium"},{"id":"s2-c17-histo4","ch":17,"section":"Histo","q":"Identify this endocrine tissue (organ) and its magnification.","img":"images/histo/h4.jpg","imgBack":"images/histo/h4_full.jpg","a":"Thyroid gland (1000×) — colloid, follicular (cuboidal) epithelium, and parafollicular (C) cells between follicles"},{"id":"s2-c17-histo5","ch":17,"section":"Histo","q":"Identify this endocrine tissue (organ) and its magnification.","img":"images/histo/h5.jpg","imgBack":"images/histo/h5_full.jpg","a":"Parathyroid gland (400×) — abundant small chief cells (secrete PTH) with scattered larger, pink oxyphil cells"},{"id":"s2-c17-histo6","ch":17,"section":"Histo","q":"Identify this endocrine tissue (organ) and its magnification.","img":"images/histo/h6.jpg","imgBack":"images/histo/h6_full.jpg","a":"Adrenal gland (40×) — capsule, cortex (outer, darker) and medulla (inner, paler)"},{"id":"s2-c17-histo7","ch":17,"section":"Histo","q":"Identify this endocrine tissue (organ) and its magnification.","img":"images/histo/h7.jpg","imgBack":"images/histo/h7_full.jpg","a":"Adrenal gland (40×) — capsule, cortex and medulla (whole-gland section)"},{"id":"s2-c17-histo8","ch":17,"section":"Histo","q":"Identify this endocrine tissue (organ) and its magnification.","img":"images/histo/h8.jpg","imgBack":"images/histo/h8_full.jpg","a":"Adrenal gland cortex (100×) — zona glomerulosa, zona fasciculata, zona reticularis (cortex) over the medulla; capsule outside"},{"id":"s2-step-a1","ch":15,"section":"Step","q":"The ________ division of the autonomic nervous system is said to function during \"rest and digest.\"","opts":["A. Sympathetic","B. Parasympathetic","C. Thoracolumbar","D. Visceral","E. Lumbosacral"],"a":"B. Parasympathetic"},{"id":"s2-step-a2","ch":15,"section":"Step","q":"The division of the autonomic nervous system that prepares the body for emergencies is the","opts":["A. sympathetic division.","B. parasympathetic division.","C. craniosacral division.","D. arachnoid division.","E. somatic motor division."],"a":"A. sympathetic division."},{"id":"s2-step-a3","ch":15,"section":"Step","q":"The sympathetic division of the ANS is also known as which of the following?","opts":["A. somatic division","B. craniosacral division","C. resting division","D. thoracolumbar division","E. Lumbosacral"],"a":"D. thoracolumbar division"},{"id":"s2-step-a4","ch":15,"section":"Step","q":"Which of the following effects is characteristic of the parasympathetic nervous system:","opts":["A. decreases activity of the digestive system","B. stimulates sweat glands to produce perspiration","C. decreases urine output","D. increases metabolic rate","E. decreases heart rate"],"a":"E. decreases heart rate"},{"id":"s2-step-a7","ch":17,"section":"Step","q":"A drug is called an agonist if it ________.","opts":["A. blocks a receptor","B. interferes with neurotransmitter reuptake","C. acts like the endogenous neurotransmitter by binding to its receptor","D. blocks the voltage-gated calcium ion channel"],"a":"C. acts like the endogenous neurotransmitter by binding to its receptor"},{"id":"s2-step-a8","ch":15,"section":"Step","q":"Autonomic ganglia contain ________.","opts":["A. an outer connective tissue capsule around the cell bodies of preganglionic motor neurons","B. synapses between postganglionic fibers and their effectors","C. the cell bodies of motor neurons","D. both somatic afferent and efferent neurons"],"a":"C. the cell bodies of motor neurons"},{"id":"s2-step-a9","ch":17,"section":"Step","q":"Beta-blockers ________.","opts":["A. increase a dangerously low heart rate","B. decrease heart rate and blood pressure","C. have widespread sympathetic effects","D. are potent antidepressants"],"a":"B. decrease heart rate and blood pressure"},{"id":"s2-step-a10","ch":15,"section":"Step","q":"Clusters of ganglionic sympathetic neurons lying along either side of the spinal cord are called sympathetic ________ ganglia.","opts":["A. intramural","B. collateral","C. chain","D. road"],"a":"C. chain"},{"id":"s2-step-a11","ch":17,"section":"Step","q":"Destruction of the supraoptic nucleus of the hypothalamus would have what results?","opts":["A. loss of ADH secretion","B. increased ADH secretion","C. loss of TSH secretion","D. increased TSH secretion","E. loss of PRL secretion"],"a":"A. loss of ADH secretion"},{"id":"s2-step-a12","ch":15,"section":"Step","q":"Effects produced by the parasympathetic branch of the autonomic nervous system include","opts":["A. dilation of the pupils.","B. increased secretion by digestive glands.","C. dilation of respiratory passages.","D. increased heart rate.","E. increased tissue metabolism."],"a":"B. increased secretion by digestive glands."},{"id":"s2-step-a13","ch":17,"section":"Step","q":"This division of the ANS increases both the rate and force of contraction of the heart.","opts":["A. sympathetic","B. parasympathetic","C. both sympathetic and parasympathetic"],"a":"A. sympathetic"},{"id":"s2-step-a15","ch":17,"section":"Step","q":"Which of the following does not describe the ANS?","opts":["A. a system of motor neurons that innervates smooth and cardiac muscle and glands","B. a system of motor neurons that innervates all muscle cells","C. involuntary nervous system","D. general visceral motor system"],"a":"B. a system of motor neurons that innervates all muscle cells"},{"id":"s2-step-a16","ch":15,"section":"Step","q":"Which of the following is not a result of parasympathetic stimulation?","opts":["A. salivation","B. dilation of the pupils","C. increased peristalsis of the digestive viscera","D. elimination of urine"],"a":"B. dilation of the pupils"},{"id":"s2-step-a18","ch":15,"section":"Step","q":"Which of these effectors is not directly controlled by the autonomic nervous system?","opts":["A. smooth muscle","B. cardiac muscle","C. skeletal muscle","D. most glands"],"a":"C. skeletal muscle"},{"id":"s2-step-a21","ch":17,"section":"Step","q":"Which of the following responses s not part of the fight-or-flight response?","opts":["A. pupil dilation","B. increased oxygen supply to the lungs","C. suppressed digestion","D. reduced mental activity"],"a":"D. reduced mental activity"},{"id":"s2-step-a22","ch":15,"section":"Step","q":"Which subdivision of the autonomic nervous system operates using the neurotransmitters norepinephrine and epinephrine:","opts":["A. parasympathetic","B. somatic","C. sympathetic","D. peripheral","E. central"],"a":"C. sympathetic"},{"id":"s2-step-a25","ch":15,"section":"Step","q":"The ganglia of the parasympathetic division of the ANS are located ________.","opts":["A. within the walls of, or close to, the organs served","B. in two trunks (or chains), one on each side of the vertebral column","C. in a collateral or prevertebral ganglion"],"a":"A. within the walls of, or close to, the organs served"},{"id":"s2-step-a26","ch":15,"section":"Step","q":"The sympathetic pathway has ________ preganglionic fibers and ________ postganglionic fibers.","opts":["A. long; short","B. short; long","C. long; long"],"a":"B. short; long"},{"id":"s2-step-a29","ch":17,"section":"Step","q":"The secretions of the adrenal medulla act to supplement the effects of ________.","opts":["A. parasympathetic innervation","B. sympathetic stimulation","C. vagus nerve activity","D. neurosecretory substances"],"a":"B. sympathetic stimulation"},{"id":"s2-step-a30","ch":17,"section":"Step","q":"Which statement correctly describes the enteric nervous system?","opts":["A. It is solely responsible for heart rate control","B. It uses only acetylcholine as a transmitter","C. It governs the function of the gastrointestinal tract largely independent of central input","D. It is another name for the sympathetic trunk"],"a":"C. It governs the function of the gastrointestinal tract largely independent of central input"},{"id":"s2-step-a31","ch":17,"section":"Step","q":"Which of the following statements best defines cholinergic neurons?","opts":["A. Neurons that release dopamine","B. Neurons that use acetylcholine as their neurotransmitter","C. Neurons that are part of the somatic motor pathway only","D. Neurons that use norepinephrine"],"a":"B. Neurons that use acetylcholine as their neurotransmitter"},{"id":"s2-step-a32","ch":15,"section":"Step","q":"What is the primary effect of parasympathetic activation on the digestive system?","opts":["A. No change in digestive activities","B. Increased secretion and motility","C. Decreased secretion and motility","D. Inhibition of smooth muscle contraction"],"a":"B. Increased secretion and motility"},{"id":"s2-step-a33","ch":17,"section":"Step","q":"Which receptors are primarily stimulated by epinephrine and norepinephrine in peripheral tissues?","opts":["A. Cholinergic receptors","B. Adrenergic receptors","C. GABAergic receptors","D. Glutamatergic receptors"],"a":"B. Adrenergic receptors"},{"id":"s2-step-a34","ch":15,"section":"Step","q":"What type of receptor is primarily engaged by parasympathetic postganglionic neurotransmitters at target organs?","opts":["A. Muscarinic acetylcholine receptors","B. Adrenergic receptors","C. GABA receptors","D. Nicotinic receptors on all targets"],"a":"A. Muscarinic acetylcholine receptors"},{"id":"s2-step-a35","ch":15,"section":"Step","q":"Which receptor class is most commonly associated with sympathetic adrenergic signaling?","opts":["A. Glutamate receptors","B. GABA receptors","C. Adrenergic receptors (alpha and beta receptors)","D. Cholinergic receptors (nicotinic and muscarinic)"],"a":"C. Adrenergic receptors (alpha and beta receptors)"},{"id":"s2-step-a36","ch":17,"section":"Step","q":"Which statement accurately describes dual innervation effects on the pupil?","opts":["A. Sympathetic constricts and parasympathetic constricts as well","B. Neither system affects pupil size","C. Parasympathetic constricts the pupil while sympathetic dilates it","D. Both systems cause dilation under normal conditions"],"a":"C. Parasympathetic constricts the pupil while sympathetic dilates it"},{"id":"s2-step-a37","ch":15,"section":"Step","q":"What is the term for neurons that release acetylcholine as their neurotransmitter in the autonomic nervous system?","opts":["A. GABAergic neurons","B. Cholinergic neurons","C. Dopaminergic neurons","D. Adrenergic neurons"],"a":"B. Cholinergic neurons"},{"id":"s2-step-a38","ch":15,"section":"Step","q":"The sympathetic and parasympathetic divisions typically exert what kind of influence on most organs?","opts":["A. Parasympathetic dominates all organs at all times","B. No innervation by parasympathetic to the heart","C. Dual innervation with opposite effects","D. Each organ is innervated only by one division"],"a":"C. Dual innervation with opposite effects"},{"id":"s2-step-a39","ch":17,"section":"Step","q":"Which division of the ANS tends to produce a “fight-or-flight” response?","opts":["A. Sympathetic division","B. Parasympathetic division","C. Enteric division","D. Central division"],"a":"A. Sympathetic division"},{"id":"s2-step-a40","ch":17,"section":"Step","q":"Which statement about the adrenal medulla is true?","opts":["A. It acts like a modified sympathetic ganglion that releases epinephrine and norepinephrine into the blood","B. It is innervated only by parasympathetic fibers","C. It releases acetylcholine directly into organs","D. It serves as a major site for somatic motor neuron control"],"a":"A. It acts like a modified sympathetic ganglion that releases epinephrine and norepinephrine into the blood"},{"id":"s2-step-a61","ch":15,"section":"Step","q":"This division of the autonomic nervous system labelled 2 in the picture refers to __________________ .","opts":["A. sympathetic","B. parasympathetic"],"a":"B. parasympathetic","img":"images/step/ans_img03.png"},{"id":"s2-step-a66","ch":15,"section":"Step","q":"The neurotransmitter produced by the post-synaptic neuron in Sympathetic division of ANS ________.","opts":["A. Acetylcholine.","B. Norepinephrine (NE)","C. GABA","D. Histamine"],"a":"B. Norepinephrine (NE)"},{"id":"s2-step-a67","ch":17,"section":"Step","q":"The neurotransmitter produced by the presynaptic neuron is always ________.","opts":["A. Acetylcholine.","B. Epinephrine","C. Nor-epinephrine","D. GABA"],"a":"A. Acetylcholine."},{"id":"s2-step-a68","ch":15,"section":"Step","q":"The parasympathetic division of the autonomic nervous system is also called the ________ division.","opts":["A. craniosacral","B. cervicothoracic","C. thoraciolumbar","D. collateral"],"a":"A. craniosacral"},{"id":"s2-step-a75","ch":15,"section":"Step","q":"This division of the autonomic nervous system labelled 1 in the picture refers to __________________ .","opts":["A. Correct: sympathetic","B. parasympathetic","C. enteric"],"a":"A. Correct: sympathetic","img":"images/step/ans_img04.png"},{"id":"s2-step-a76","ch":15,"section":"Step","q":"This division of the autonomic nervous system labelled 2 in the picture refers to __________________ .","opts":["A. sympathetic","B. Correct: parasympathetic","C. enteric"],"a":"B. Correct: parasympathetic","img":"images/step/ans_img05.png"},{"id":"s2-step-a77","ch":17,"section":"Step","q":"What is the neurotransmitter at the effector B?","opts":["A. epinephrine","B. Correct: acetylcholine","C. norepinephrine","D. dopamine"],"a":"B. Correct: acetylcholine","img":"images/step/ans_img06.png"},{"id":"s2-step-a78","ch":17,"section":"Step","q":"What is the neurotransmitter at the effector A?","opts":["A. epinephrine","B. acetylcholine","C. Incorrect: norepinephrine","D. dopamine"],"a":"B. acetylcholine","img":"images/step/ans_img07.png"},{"id":"s2-step-a79","ch":15,"section":"Step","q":"________________ chain ganglia 'A' deliver information to the body about stress and impending danger, and are responsible for the familiar fight-or-flight response.","opts":["A. Correct: Sympathetic","B. Parasympathetic","C. Enteric","D. Collateral"],"a":"A. Correct: Sympathetic","img":"images/step/ans_img08.png"},{"id":"s2-step-a80","ch":17,"section":"Step","q":"What is the term for receptors that respond to epinephrine and norepinephrine?","opts":["A. Glutamatergic receptors","B. GABA receptors","C. Cholinergic receptors","D. Adrenergic receptors"],"a":"D. Adrenergic receptors"},{"id":"s2-step-a81","ch":15,"section":"Step","q":"Which receptor class is predominantly associated with sympathetic adrenergic signaling?","opts":["A. Adrenergic receptors (alpha and beta)","B. Cholinergic receptors (nicotinic)","C. Muscarinic receptors","D. Nicotinic receptors"],"a":"A. Adrenergic receptors (alpha and beta)"},{"id":"s2-step-a82","ch":17,"section":"Step","q":"Which of the following best defines cholinergic neurons?","opts":["A. Neurons that use acetylcholine as their neurotransmitter","B. Neurons that inhibit acetylcholine release","C. Neurons that only exist in the CNS","D. Neurons that use norepinephrine as their neurotransmitter"],"a":"A. Neurons that use acetylcholine as their neurotransmitter"},{"id":"s2-step-a83","ch":15,"section":"Step","q":"Which of the following best describes the enteric nervous system’s autonomy?","opts":["A. It can regulate GI tract function with minimal central input","B. It controls voluntary muscle movements","C. It requires constant brainstem modulation","D. It is identical to the sympathetic chain"],"a":"A. It can regulate GI tract function with minimal central input"},{"id":"s2-step-a84","ch":15,"section":"Step","q":"Which nerve contains preganglionic parasympathetic fibers serving the head and thorax?","opts":["A. Accessory nerve (CN XI)","B. Hypoglossal nerve (CN XII)","C. Vagus nerve (CN X)","D. Optic nerve (CN II)"],"a":"C. Vagus nerve (CN X)"},{"id":"s2-step-a85","ch":17,"section":"Step","q":"Which of the following drugs would most likely act as a muscarinic agonist?","opts":["A. A drug that blocks adrenergic receptors","B. A drug that mimics acetylcholine at muscarinic receptors","C. A drug that inhibits acetylcholinesterase only at nicotinic sites","D. A drug that blocks nicotinic receptors"],"a":"B. A drug that mimics acetylcholine at muscarinic receptors"},{"id":"s2-step-a86","ch":17,"section":"Step","q":"Which receptor subtype is most commonly activated by norepinephrine at peripheral target tissues?","opts":["A. Adrenergic receptors (alpha and beta)","B. Cholinergic receptors","C. Nicotinic receptors only","D. Muscarinic receptors only"],"a":"A. Adrenergic receptors (alpha and beta)"},{"id":"s2-step-a87","ch":15,"section":"Step","q":"Which type of receptor does acetylcholine primarily bind to on smooth muscle and gland targets in the parasympathetic system?","opts":["A. Muscarinic acetylcholine receptors","B. Adrenergic receptors","C. Purine receptors","D. Nicotinic receptors"],"a":"A. Muscarinic acetylcholine receptors"},{"id":"s2-step-a88","ch":15,"section":"Step","q":"Which statement correctly describes the adrenal medulla in autonomic control?","opts":["A. It only responds to parasympathetic stimulation","B. It acts like a modified sympathetic ganglion that releases epinephrine and norepinephrine into the blood","C. It is part of the somatic nervous system","D. It releases acetylcholine directly into target organs"],"a":"B. It acts like a modified sympathetic ganglion that releases epinephrine and norepinephrine into the blood"},{"id":"s2-step-a89","ch":17,"section":"Step","q":"What is the general role of the enteric nervous system?","opts":["A. It processes reflexes for voluntary movement","B. It controls skeletal muscles only","C. It controls gastrointestinal tract function largely independently of central input","D. It integrates sensory input from the skin"],"a":"C. It controls gastrointestinal tract function largely independently of central input"},{"id":"s2-step-a90","ch":15,"section":"Step","q":"Which of these correctly identifies a receptor targeted by parasympathetic postganglionic signaling at the effector organ?","opts":["A. Adrenergic receptors","B. Nicotinic receptors","C. Beta-adrenergic receptors","D. Muscarinic acetylcholine receptors"],"a":"D. Muscarinic acetylcholine receptors"},{"id":"s2-step-n2","ch":14,"section":"Step","q":"Axons of ganglion cells form the optic tract. These fibers synapse in the ________.","opts":["A. hypothalamus","B. thalamus","C. visual cortex"],"a":"B. thalamus"},{"id":"s2-step-n3","ch":14,"section":"Step","q":"Ear wax is also referred to as _______.","opts":["A. cerumen","B. plasma","C. lacrimal fluid","D. endolymph"],"a":"A. cerumen"},{"id":"s2-step-n4","ch":14,"section":"Step","q":"From outermost to innermost layers, the wall of the eye consists of these three layers.","opts":["A. fibrous, vascular, sensory","B. vascular, fibrous, sensory","C. sensory, vascular, fibrous"],"a":"A. fibrous, vascular, sensory"},{"id":"s2-step-n5","ch":14,"section":"Step","q":"Identify the structures labeled \"8.\"","opts":["A. cochlea","B. auditory ossicles","C. auricle","D. tympanic membrane","E. vestibule"],"a":"B. auditory ossicles","img":"images/step/noans_img01.png"},{"id":"s2-step-n6","ch":14,"section":"Step","q":"Sound vibrations from the eardrum go through the ____ _____ into the inner ear.","opts":["A. Oval window","B. tympanic membrane","C. Eustachian tube","D. round window"],"a":"A. Oval window"},{"id":"s2-step-n7","ch":14,"section":"Step","q":"The ________ is a blind spot on the retina, while the ________ contains only cones and is the retinal area of greatest visual acuity.","opts":["A. optic disc, fovea centralis","B. fovea centralis, optic disc","C. fundus, macula lutea"],"a":"A. optic disc, fovea centralis"},{"id":"s2-step-n8","ch":14,"section":"Step","q":"The ________ of the retina detect color and function only in ________ light.","opts":["A. cones, bright","B. cones, low","C. rods, bright"],"a":"A. cones, bright"},{"id":"s2-step-n9","ch":14,"section":"Step","q":"The anterior segment of the eye contains a fluid called ________.","opts":["A. lacrimal humor","B. aqueous humor","C. vitreous humor","D. Answer: B"],"a":"B. aqueous humor"},{"id":"s2-step-n10","ch":14,"section":"Step","q":"The basilar membrane is present between","opts":["A. scala vestibule and scala media","B. scala media and scala tympani","C. scala vestibule and scala tympani","D. the outer and inner ear"],"a":"B. scala media and scala tympani"},{"id":"s2-step-n11","ch":14,"section":"Step","q":"The ciliary zonule (suspensory ligament) holds this structure in front of the pupil.","opts":["A. conjunctiva","B. cornea","C. lens"],"a":"C. lens"},{"id":"s2-step-n12","ch":14,"section":"Step","q":"The lacrimal apparatus produces a watery solution known as ________.","opts":["A. modified sweat","B. sebaceous fluid","C. tears"],"a":"C. tears"},{"id":"s2-step-n13","ch":14,"section":"Step","q":"The membranous labyrinth contains","opts":["A. Cystolymph","B. Otolymph","C. Perilymph","D. Endolymph"],"a":"D. Endolymph"},{"id":"s2-step-n14","ch":14,"section":"Step","q":"The otoliths are the crystals of —— carbonate?","opts":["A. calcium","B. potassium","C. sodium","D. magnesium"],"a":"A. calcium"},{"id":"s2-step-n15","ch":14,"section":"Step","q":"The photoreceptors in the retina that detect light are ________.","opts":["A. bipolar cells","B. ganglion cells","C. rods and cones"],"a":"C. rods and cones"},{"id":"s2-step-n16","ch":14,"section":"Step","q":"The retinal cells that are closest to the vascular layer are the ________.","opts":["A. rods and cones","B. bipolar cells","C. ganglion cells"],"a":"A. rods and cones"},{"id":"s2-step-n17","ch":14,"section":"Step","q":"The structure that separates the cochlear duct from the scala tympani is the","opts":["A. tectorial membrane.","B. basilar membrane.","C. vestibular duct.","D. organ of Corti.","E. malleus."],"a":"B. basilar membrane."},{"id":"s2-step-n18","ch":14,"section":"Step","q":"The structures in the inner ear involved with hearing are the","opts":["A. Vestibule and semicircular canals","B. Vestibule and cochlea","C. semicircular canals and cochlea","D. Cochlea and organ of Corti"],"a":"D. Cochlea and organ of Corti"},{"id":"s2-step-n19","ch":14,"section":"Step","q":"The tube that runs from the middle ear to the throat is called the:","opts":["A. external auditory canal","B. tympanic cavity","C. Eustachian tube"],"a":"C. Eustachian tube"},{"id":"s2-step-n20","ch":14,"section":"Step","q":"The vibration of sound waves causes the eardrum to vibrate against the first ossicle, known as","opts":["A. stapes","B. malleus","C. incus","D. otolith"],"a":"B. malleus"},{"id":"s2-step-n21","ch":14,"section":"Step","q":"This extrinsic eye muscle elevates the eye and turns it medially.","opts":["A. medial rectus","B. superior rectus","C. inferior oblique","D. Answer: B"],"a":"B. superior rectus"},{"id":"s2-step-n22","ch":14,"section":"Step","q":"This mucous membrane covers the surface of the eyeball and lines the eyelid.","opts":["A. palpebral mucosa","B. bulbar epithelium","C. conjunctiva"],"a":"C. conjunctiva"},{"id":"s2-step-n23","ch":14,"section":"Step","q":"This ossicle vibrates against the inner ear via the oval window","opts":["A. Malleus","B. Stapes","C. Incus","D. Cochlea"],"a":"B. Stapes"},{"id":"s2-step-n24","ch":14,"section":"Step","q":"This structure, present in the cow eye but not in the human eye, is a special iridescent reflecting surface that helps animals to see in low light conditions.","opts":["A. tapetum lucidum","B. pigmented sclera","C. ciliary body"],"a":"A. tapetum lucidum"},{"id":"s2-step-n25","ch":14,"section":"Step","q":"When you spin quickly, you may feel dizzy. Which component of the ear generates the sensations that can lead to this feeling?","opts":["A. cochlea","B. vestibule","C. saccule","D. semicircular canals"],"a":"D. semicircular canals"},{"id":"s2-step-n26","ch":14,"section":"Step","q":"Which structure contains the receptors for hearing?","opts":["A. 6","B. 8","C. 9","D. 10","E. 11"],"a":"E. 11","img":"images/step/noans_img02.png"},{"id":"s2-step-n27","ch":14,"section":"Step","q":"Which structure contains the receptors for hearing?","opts":["A. Vestibule","B. Ampulla","C. Organ of Corti","D. Macula"],"a":"C. Organ of Corti"},{"id":"s2-step-n28","ch":14,"section":"Step","q":"Which structure is known as the vestibule?","opts":["A. 6","B. 8","C. 9","D. 10","E. 11"],"a":"D. 10","img":"images/step/noans_img03.png"},{"id":"s2-step-n29","ch":14,"section":"Step","q":"Identify the structure A of Organ of Corti.","opts":["A. scala vestibuli","B. scala tympani","C. scala media","D. cochlear duct"],"a":"A. scala vestibuli","img":"images/step/noans_img04.png"},{"id":"s2-step-n30","ch":14,"section":"Step","q":"Identify the structure B of Organ of Corti.","opts":["A. scala vestibuli","B. tympanic membrane","C. tectorial membrane","D. basilar membrane"],"a":"D. basilar membrane","img":"images/step/noans_img05.png"},{"id":"s2-step-n31","ch":14,"section":"Step","q":"Light rays refract or bend when they go through","opts":["A. J.","B. L.","C. B.","D. X.","E. R."],"a":"C. B.","img":"images/step/noans_img06.png"},{"id":"s2-step-n32","ch":14,"section":"Step","q":"Light rays refract or bend when they go through","opts":["A. J.","B. L.","C. B.","D. X.","E. R."],"a":"D. X.","img":"images/step/noans_img07.png"},{"id":"s2-step-n33","ch":14,"section":"Step","q":"Structure B is the","opts":["A. choroid.","B. Cornea","C. sclera.","D. lens."],"a":"B. Cornea","img":"images/step/noans_img08.png"},{"id":"s2-step-n34","ch":14,"section":"Step","q":"Structure C is the","opts":["A. choroid.","B. iris.","C. sclera.","D. ciliary body.","E. lens."],"a":"E. lens.","img":"images/step/noans_img09.png"},{"id":"s2-step-n35","ch":14,"section":"Step","q":"Structure C is the","opts":["A. choroid.","B. iris.","C. sclera.","D. ciliary body.","E. lens."],"a":"E. lens.","img":"images/step/noans_img10.png"},{"id":"s2-step-n36","ch":14,"section":"Step","q":"Structure G is the","opts":["A. choroid.","B. sclera","C. sclera.","D. ciliary body."],"a":"A. choroid.","img":"images/step/noans_img11.png"},{"id":"s2-step-n37","ch":14,"section":"Step","q":"Structure or location L is the","opts":["A. choroid.","B. fovea","C. sclera.","D. ciliary body."],"a":"B. fovea","img":"images/step/noans_img12.png"},{"id":"s2-step-n38","ch":14,"section":"Step","q":"A blind spot in the retina occurs","opts":["A. at the fovea.","B. where ganglion cells synapse with bipolar cells.","C. at the optic disc.","D. where rod cells are clustered to form the macula.","E. where amacrine cells are located."],"a":"C. at the optic disc."},{"id":"s2-step-n39","ch":14,"section":"Step","q":"A person suffering from ________ can see distant objects more clearly than those that are close.","opts":["A. myopia","B. hyperopia","C. glaucoma","D. emmetropia","E. cataracts"],"a":"B. hyperopia"},{"id":"s2-step-n40","ch":14,"section":"Step","q":"Normal eye focusing is termed","opts":["A. hyperopia.","B. myopia.","C. presbyopia.","D. emmetropia.","E. refraction."],"a":"D. emmetropia."},{"id":"s2-step-n41","ch":14,"section":"Step","q":"The ciliary muscle helps to","opts":["A. control the amount of light reaching the retina.","B. pull the lens into a more rounded shape.","C. control the production of aqueous humor.","D. move the eyeball.","E. produce the vitreous body."],"a":"B. pull the lens into a more rounded shape."},{"id":"s2-step-n43","ch":14,"section":"Step","q":"The photoreceptors of the retina are called","opts":["A. bipolar cells.","B. horizontal cells.","C. amacrine cells.","D. ganglion cells.","E. rods and cones."],"a":"E. rods and cones."},{"id":"s2-step-n46","ch":14,"section":"Step","q":"The shape of the lens is controlled by the","opts":["A. pupillary constrictor muscles.","B. pupillary dilator muscles.","C. ciliary muscle.","D. conjunctiva.","E. aqueous body."],"a":"C. ciliary muscle."},{"id":"s2-step-n49","ch":14,"section":"Step","q":"Motion-induced vertigo and balance disturbances can be linked to dysfunction in which otolithic organs?","opts":["A. Semicircular canals only","B. Utricle and saccule (otolith organs)","C. Cochlea","D. Tympanic membrane"],"a":"B. Utricle and saccule (otolith organs)"},{"id":"s2-step-n50","ch":14,"section":"Step","q":"The auditory nerve carries signals from the cochlea to the brain via which cranial nerve?","opts":["A. Cranial nerve VIII (vestibulocochlear nerve)","B. Cranial nerve II (optic nerve)","C. Cranial nerve VII (facial nerve)","D. Cranial nerve V (trigeminal)"],"a":"A. Cranial nerve VIII (vestibulocochlear nerve)"},{"id":"s2-step-n51","ch":14,"section":"Step","q":"Which component of the inner ear contains endolymph and participates in hearing and balance?","opts":["A. Bony labyrinth","B. Perilymphatic space","C. Otolith organs only","D. Membranous labyrinth"],"a":"D. Membranous labyrinth"},{"id":"s2-step-n52","ch":14,"section":"Step","q":"The photoreceptors responsible for high-acuity color vision in bright light are called:","opts":["A. Ganglion cells","B. Cones","C. Bipolar cells","D. Rods"],"a":"B. Cones"},{"id":"s2-step-n53","ch":14,"section":"Step","q":"The retina contains several layers. Which layer contains rods and cones as the photoreceptors?","opts":["A. Photoreceptor layer (outer nuclear layer contains photoreceptor cell bodies)","B. Ganglion cell layer","C. Inner nuclear layer","D. Retinal pigment epithelium only"],"a":"A. Photoreceptor layer (outer nuclear layer contains photoreceptor cell bodies)"},{"id":"s2-step-n54","ch":14,"section":"Step","q":"Which part of the eye is responsible for central vision and high visual acuity, containing the fovea centralis?","opts":["A. Sclera","B. Optic nerve","C. Retina (fovea centralis region)","D. Choroid"],"a":"C. Retina (fovea centralis region)"},{"id":"s2-step-n55","ch":14,"section":"Step","q":"Which structure separates the cochlear duct from the scala tympani?","opts":["A. Round window","B. Basilar membrane","C. Roof of cochlear duct","D. Tectorial membrane"],"a":"B. Basilar membrane"},{"id":"s2-step-n56","ch":14,"section":"Step","q":"The aqueous humor is produced by the ciliary processes and drains primarily through which structure?","opts":["A. Canal of Schlemm directly into the venous system","B. Lacrimal gland ducts","C. Optic canal","D. Trabecular (scleral) meshwork into Schlemm's canal"],"a":"D. Trabecular (scleral) meshwork into Schlemm's canal"},{"id":"s2-step-n57","ch":14,"section":"Step","q":"Color blindness most commonly results from malfunction of which photoreceptors?","opts":["A. Bipolar cells","B. Cones (especially L- and M-cones for red/green)","C. Rods","D. Ganglion cells"],"a":"B. Cones (especially L- and M-cones for red/green)"},{"id":"s2-step-n58","ch":14,"section":"Step","q":"Which condition is characterized by progressive clouding of the eye's lens leading to blurred vision?","opts":["A. Cataracts","B. Retinal detachment","C. Macular degeneration","D. Glaucoma"],"a":"A. Cataracts"},{"id":"s2-step-n59","ch":14,"section":"Step","q":"The lens changes focal distance by changing its shape via which muscle?","opts":["A. Ciliary muscle","B. Orbicularis oculi","C. Iris sphincter","D. Lateral rectus"],"a":"A. Ciliary muscle"},{"id":"s2-step-n60","ch":14,"section":"Step","q":"Which ear structure contains receptors for dynamic (rotational) equilibrium?","opts":["A. Semicircular canals","B. Utricle","C. Cochlea","D. Saccule"],"a":"A. Semicircular canals"},{"id":"s2-step-n61","ch":14,"section":"Step","q":"Motion sickness is commonly caused by stimulation of receptors in which part of the inner ear?","opts":["A. Cochlea","B. Saccule","C. Semicircular canals","D. Utricle"],"a":"C. Semicircular canals"},{"id":"s2-step-n62","ch":14,"section":"Step","q":"Which layer of the eye is primarily responsible for refracting light and contains dense fibrous tissue that gives the eye its shape?","opts":["A. Pigmented layer (choroid)","B. Fibrous layer (sclera and cornea)","C. Neural layer (retina)","D. Vascular layer (uvea)"],"a":"B. Fibrous layer (sclera and cornea)"},{"id":"s2-step-n63","ch":14,"section":"Step","q":"Which of the following is a common ocular disorder associated with aging and affects central vision due to macular degeneration?","opts":["A. Glaucoma","B. Cataracts","C. Macular degeneration","D. Retinitis pigmentosa"],"a":"C. Macular degeneration"},{"id":"s2-step-n64","ch":14,"section":"Step","q":"Which structure contains the pigmented epithelium and absorbs excess light to prevent scattering within the eye?","opts":["A. Corneal epithelium","B. Ciliary body","C. Pigmented layer of retina / retinal pigmented epithelium","D. Anterior chamber"],"a":"C. Pigmented layer of retina / retinal pigmented epithelium"},{"id":"s2-step-n65","ch":14,"section":"Step","q":"The receptor cells for olfaction form synapses with axons of which type of neurons to reach the olfactory bulb?","opts":["A. Hair cells","B. Olfactory receptor neurons (bipolar neurons) that project to mitral and tufted cells","C. Purkinje cells","D. Photoreceptors"],"a":"B. Olfactory receptor neurons (bipolar neurons) that project to mitral and tufted cells"},{"id":"s2-step-n66","ch":14,"section":"Step","q":"Which of the following best describes the neural pathway for taste from the tongue to the brain?","opts":["A. Taste buds → cranial nerves VII, IX, X → solitary nucleus → thalamus → gustatory cortex","B. Taste buds → cerebellum → motor cortex","C. Taste buds → optic nerve → visual cortex","D. Taste buds → spinal cord → thalamus → occipital cortex"],"a":"A. Taste buds → cranial nerves VII, IX, X → solitary nucleus → thalamus → gustatory cortex"},{"id":"s2-step-n67","ch":14,"section":"Step","q":"What is the primary fluid-filled cavity of the eye located posterior to the lens called?","opts":["A. Vitreous humor","B. Ciliary body fluid","C. Canal of Schlemm","D. Aqueous humor"],"a":"A. Vitreous humor"},{"id":"s2-step-n68","ch":14,"section":"Step","q":"Which receptors are primarily responsible for detecting linear acceleration and head position relative to gravity?","opts":["A. Cristae ampullares","B. Hair cells of the cochlea","C. Photoreceptors in the retina","D. Maculae of the utricle and saccule"],"a":"D. Maculae of the utricle and saccule"},{"id":"s2-step-n69","ch":14,"section":"Step","q":"The mucous membrane that lines the inner surface of the eyelids and covers the eyeball is called what?","opts":["A. Conjunctival sac","B. Conjunctiva","C. Lacrimal gland","D. Cornea"],"a":"B. Conjunctiva"},{"id":"s2-step-n70","ch":14,"section":"Step","q":"What term describes the loss or impairment of the sense of smell?","opts":["A. Hyposmia","B. Phantosmia","C. Anosmia","D. Ageusia"],"a":"C. Anosmia"},{"id":"s2-step-n71","ch":14,"section":"Step","q":"Which taste modality is primarily detected by receptors for amino acids such as glutamate and is associated with a savory flavor?","opts":["A. Bitter","B. Sweet","C. Umami","D. Sour"],"a":"C. Umami"},{"id":"s2-step-n72","ch":14,"section":"Step","q":"Damage to which part of the ear typically results in conduction deafness?","opts":["A. Oval window","B. Organ of Corti","C. Cochlea","D. External or middle ear (e.g., earwax or ossicle disruption)"],"a":"D. External or middle ear (e.g., earwax or ossicle disruption)"},{"id":"s2-step-n73","ch":14,"section":"Step","q":"The chamber of the eye that contains endolymph and houses the organ of Corti is known as which structure?","opts":["A. Scala vestibuli","B. Canal of Schlemm","C. Scala tympani","D. Scala media (cochlear duct)"],"a":"D. Scala media (cochlear duct)"},{"id":"s2-step-n74","ch":14,"section":"Step","q":"Which cranial nerves are involved in carrying taste information from the anterior two-thirds of the tongue?","opts":["A. CN VII (facial nerve)","B. CN IX (glossopharyngeal)","C. CN X (vagus)","D. CN V (trigeminal)"],"a":"A. CN VII (facial nerve)"},{"id":"s2-step-n75","ch":14,"section":"Step","q":"The olfactory pathway first projects to which brain structure before reaching the olfactory cortex?","opts":["A. Olfactory bulb","B. Hypothalamus","C. Thalamus","D. Amygdala"],"a":"A. Olfactory bulb"},{"id":"s2-step-n76","ch":14,"section":"Step","q":"The auditory pathway ultimately projects to which primary cortical area for sound perception?","opts":["A. Occipital cortex","B. Parietal cortex","C. Auditory cortex in the temporal lobe","D. Prefrontal cortex"],"a":"C. Auditory cortex in the temporal lobe"},{"id":"s2-step-n77","ch":14,"section":"Step","q":"In the pathway of vision, where do the optic nerves partially decussate?","opts":["A. Optic nerve","B. Lateral geniculate nucleus","C. Optic chiasm","D. Superior colliculus"],"a":"C. Optic chiasm"},{"id":"s2-step-n78","ch":14,"section":"Step","q":"Which sensory modality involves transduction by hair cells in the cochlea?","opts":["A. Hearing","B. Taste","C. Equilibrium","D. Smell"],"a":"A. Hearing"},{"id":"s2-step-n79","ch":14,"section":"Step","q":"Which nerve is primarily responsible for motor control of the superior oblique eye muscle?","opts":["A. Cranial nerve III (oculomotor)","B. Cranial nerve VI (abducens)","C. Cranial nerve II (optic)","D. Cranial nerve IV (trochlear nerve)"],"a":"D. Cranial nerve IV (trochlear nerve)"},{"id":"s2-step-n80","ch":14,"section":"Step","q":"Identify this histology slide:","opts":["A. olfactory receptors","B. retina","C. vallate papillae","D. scala tympani"],"a":"B. retina","img":"images/step/noans_img13.png"},{"id":"s2-step-n81","ch":14,"section":"Step","q":"When this muscle contracts, it laterally rotates the eye.","opts":["A. A","B. B","C. E","D. C"],"a":"C. E","img":"images/step/noans_img14.png"},{"id":"s2-step-n82","ch":14,"section":"Step","q":"Identify this histology slide.","opts":["A. Corneal Epithelium","B. Olfactory Epithelium","C. Taste Buds (on papillae)","D. Vestibular Epithelium"],"a":"B. Olfactory Epithelium","img":"images/step/noans_img15.png"},{"id":"s2-step-e4","ch":17,"section":"Step","q":"Identify the hormone labeled \"1.\"","opts":["A. mineralocorticoid","B. cortisol","C. dopamine","D. corticotropin (ACTH)","E. aldosterone"],"a":"D. corticotropin (ACTH)","img":"images/step/endo_img01.png"},{"id":"s2-step-e5","ch":17,"section":"Step","q":"Identify the hormone labeled \"4.\"","opts":["A. thyroid-releasing hormone","B. thyroid-stimulating hormone","C. thyroxin","D. thyrotropin","E. calcitonin"],"a":"B. thyroid-stimulating hormone","img":"images/step/endo_img02.png"},{"id":"s2-step-e6","ch":17,"section":"Step","q":"Identify the hormone labeled \"5.\"","opts":["A. thyroid-releasing hormone","B. thyroid-stimulating hormone","C. thyroxin","D. thyrotropin","E. parathyroid hormone (PTH)"],"a":"C. thyroxin","img":"images/step/endo_img03.png"},{"id":"s2-step-e9","ch":17,"section":"Step","q":"The human endocrine system","opts":["A. releases neurotransmitters into the bloodstream for distribution throughout the body.","B. produces effects that last for seconds or minutes.","C. is not involved in homeostasis.","D. relies on the release of chemicals that bind to target cells."],"a":"D. relies on the release of chemicals that bind to target cells."},{"id":"s2-step-e10","ch":17,"section":"Step","q":"When you do not eat timely meals your blood glucose levels fall and __________,","opts":["A. insulin is released.","B. glucagon is released.","C. skeletal muscle cells convert glucose into glycogen for storage.","D. protein synthesis increases."],"a":"B. glucagon is released."},{"id":"s2-step-e13","ch":17,"section":"Step","q":"Identify this endocrine gland.","opts":["A. pituitary gland","B. parathyroid gland","C. thyroid gland","D. adrenal glands"],"a":"A. pituitary gland","img":"images/step/endo_img04.png"},{"id":"s2-step-e14","ch":17,"section":"Step","q":"Identify this endocrine gland.","opts":["A. pituitary gland","B. parathyroid gland","C. thyroid gland","D. adrenal glands"],"a":"C. thyroid gland","img":"images/step/endo_img05.png"},{"id":"s2-step-e15","ch":17,"section":"Step","q":"Identify this endocrine gland.","opts":["A. pituitary gland","B. parathyroid gland","C. thyroid gland","D. adrenal glands"],"a":"C. thyroid gland","img":"images/step/endo_img06.png"},{"id":"s2-step-e16","ch":17,"section":"Step","q":"Identify this endocrine gland.","opts":["A. Correct: pancreas","B. parathyroid gland","C. thyroid gland","D. adrenal glands"],"a":"A. Correct: pancreas","img":"images/step/endo_img07.jpeg"},{"id":"s2-step-e17","ch":17,"section":"Step","q":"Identify this endocrine gland.","opts":["A. pituitary gland","B. parathyroid gland","C. thyroid gland","D. adrenal glands"],"a":"B. parathyroid gland","img":"images/step/endo_img08.png"},{"id":"s2-step-e18","ch":17,"section":"Step","q":"Identify this endocrine gland.","opts":["A. pituitary gland","B. parathyroid gland","C. thyroid gland","D. adrenal glands"],"a":"D. adrenal glands","img":"images/step/endo_img09.png"},{"id":"s2-step-e30","ch":17,"section":"Step","q":"Diabetes insipidus can be caused by","opts":["A. decreased levels of insulin.","B. decreased numbers of insulin receptors.","C. failure of the kidneys to respond to ADH.","D. increased numbers of ADH receptors.","E. increased levels of ADH."],"a":"C. failure of the kidneys to respond to ADH."},{"id":"s2-step-e33","ch":17,"section":"Step","q":"Which of the following hormones is a peptide secreted by the anterior pituitary?","opts":["A. Thyroxine (T4)","B. Aldosterone","C. Growth hormone (GH)","D. Cortisol"],"a":"C. Growth hormone (GH)"},{"id":"s2-step-e34","ch":17,"section":"Step","q":"Which gland is primarily responsible for regulating circadian rhythms through melatonin secretion?","opts":["A. Adrenal gland","B. Pituitary gland","C. Thyroid gland","D. Pineal gland"],"a":"D. Pineal gland"},{"id":"s2-step-e35","ch":17,"section":"Step"
