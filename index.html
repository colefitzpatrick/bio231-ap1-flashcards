<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#273449;--text:#e2e8f0;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--accent:#38bdf8;--border:#334155;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px;}
h1{font-size:20px;margin:6px 0 2px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
.offline-status{display:inline-block;color:var(--muted);font-size:12px;border:1px solid var(--border);border-radius:999px;padding:6px 10px;margin:0 0 14px;background:rgba(30,41,59,.7);}
.offline-status.ready{color:#bbf7d0;border-color:rgba(34,197,94,.55);background:rgba(20,83,45,.24);}
.module{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.module h2{font-size:16px;margin:0 0 2px;}
.module .msub{color:var(--muted);font-size:12px;margin-bottom:10px;}
.stats{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap;}
.stats b{color:var(--text);}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-weight:600;}
.btn-all{background:var(--accent);color:#04222e;flex:1;min-width:120px;}
.btn-missed{background:var(--panel2);color:var(--text);border:1px solid var(--border);flex:1;min-width:120px;}
button:disabled{opacity:.4;cursor:not-allowed;}
.link{background:none;color:var(--muted);text-decoration:underline;padding:6px;font-weight:500;font-size:13px;}
#study,#result{display:none;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);}
.tally .g{color:var(--green);font-weight:700;}
.tally .r{color:var(--red);font-weight:700;}
.progress{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:14px;}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px;text-align:center;cursor:pointer;user-select:none;}
#cardimg{margin-bottom:14px;display:none;}
#cardimg img{max-width:100%;max-height:62vh;border-radius:10px;border:1px solid var(--border);background:#fff;}
.imghint{font-size:11px;color:var(--muted);margin-top:6px;}
.qlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.qtext{font-size:20px;line-height:1.45;}
.atext{font-size:19px;line-height:1.5;color:#bbf7d0;}
.opts{margin-top:16px;text-align:left;}
.opt{font-size:16px;line-height:1.55;color:#cbd5e1;padding:3px 2px;}
.hint{color:var(--muted);font-size:12px;margin-top:18px;}
.controls{display:flex;gap:12px;margin-top:14px;}
.btn-green{background:var(--green);color:#052e16;flex:1;padding:16px;font-size:16px;}
.btn-red{background:var(--red);color:#450a0a;flex:1;padding:16px;font-size:16px;}
.btn-flip{background:var(--accent);color:#04222e;width:100%;padding:16px;font-size:16px;margin-top:14px;}
.result-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center;}
.result-box h2{margin:0 0 6px;}
.big{font-size:34px;font-weight:800;margin:12px 0;}
.big .mut{color:var(--muted);font-size:20px;font-weight:600;}
</style>
</head>

      <div class="row" style="margin-top:18px;">

        <button class="btn-missed" id="againBtn">Study round again</button>

<script>
const MODULES = [{"key":"m1","name":"Module 1","sub":"Ch 1–3 · Intro · Chemical · Cellular","cards":[{"id":"m1-c1-q6","ch":1,"section":"RQ","q":"Which of the following specialties might focus on studying all of the structures of the ankle and foot?","a":"C. regional anatomy","opts":["A. microscopic anatomy","B. muscle anatomy","C. regional anatomy","D. systemic anatomy"]},{"id":"m1-c1-q7","ch":1,"section":"RQ","q":"A scientist wants to study how the body uses foods and fluids during a marathon run. This scientist is most likely a(n) ________.","a":"A. exercise physiologist","opts":["A. exercise physiologist","B. microscopic anatomist","C. regional physiologist","D. systemic anatomist"]},{"id":"m1-c1-q8","ch":1,"section":"RQ","q":"The smallest independently functioning unit of an organism is a(n) ________.","a":"A. cell","opts":["A. cell","B. molecule","C. organ","D. tissue"]},{"id":"m1-c1-q9","ch":1,"section":"RQ","q":"A collection of similar tissues that performs a specific function is an ________.","a":"A. organ","opts":["A. organ","B. organelle","C. organism","D. organ system"]},{"id":"m1-c1-q10","ch":1,"section":"RQ","q":"The body system responsible for structural support and movement is the ________.","a":"D. skeletal system","opts":["A. cardiovascular system","B. endocrine system","C. muscular system","D. skeletal system"]},{"id":"m1-c1-q11","ch":1,"section":"RQ","q":"Metabolism can be defined as the ________.","a":"D. sum of all chemical reactions in an organism","opts":["A. adjustment by an organism to external or internal changes","B. process whereby all unspecialized cells become specialized to perform distinct functions","C. process whereby new cells are formed to replace worn-out cells","D. sum of all chemical reactions in an organism"]},{"id":"m1-c1-q12","ch":1,"section":"RQ","q":"Adenosine triphosphate (ATP) is an important molecule because it ________.","a":"C. stores energy for use by body cells","opts":["A. is the result of catabolism","B. releases energy in uncontrolled bursts","C. stores energy for use by body cells","D. All of the above"]},{"id":"m1-c1-q13","ch":1,"section":"RQ","q":"Cancer cells can be characterized as “generic” cells that perform no specialized body function. Thus cancer cells lack ________.","a":"A. differentiation","opts":["A. differentiation","B. reproduction","C. responsiveness","D. both reproduction and responsiveness"]},{"id":"m1-c1-q14","ch":1,"section":"RQ","q":"Humans have the most urgent need for a continuous supply of ________.","a":"C. oxygen","opts":["A. food","B. nitrogen","C. oxygen","D. water"]},{"id":"m1-c1-q15","ch":1,"section":"RQ","q":"Which of the following statements about nutrients is true?","a":"A. All classes of nutrients are essential to human survival","opts":["A. All classes of nutrients are essential to human survival","B. Because the body cannot store any micronutrients, they need to be consumed nearly every day","C. Carbohydrates, lipids, and proteins are micronutrients","D. Macronutrients are vitamins and minerals"]},{"id":"m1-c1-q16","ch":1,"section":"RQ","q":"C.J. is stuck in her car during a bitterly cold blizzard. Her body responds to the cold by ________.","a":"C. breaking down stored energy","opts":["A. increasing the blood to the hands and feet","B. becoming lethargic to conserve heat","C. breaking down stored energy","D. significantly increasing blood oxygen levels"]},{"id":"m1-c1-q17","ch":1,"section":"RQ","q":"After you eat lunch, nerve cells in your stomach respond to the distension (the stimulus) resulting from the food. They relay this information to ________.","a":"A. a control center","opts":["A. a control center","B. a set point","C. effectors","D. sensors"]},{"id":"m1-c1-q18","ch":1,"section":"RQ","q":"Stimulation of the heat-loss center causes ________.","a":"C. sweat glands to increase their output","opts":["A. blood vessels in the skin to constrict","B. breathing to become slow and shallow","C. sweat glands to increase their output","D. All of the above"]},{"id":"m1-c1-q19","ch":1,"section":"RQ","q":"Which of the following is an example of a normal physiologic process that uses a positive feedback loop?","a":"B. childbirth","opts":["A. blood pressure regulation","B. childbirth","C. regulation of fluid balance","D. temperature regulation"]},{"id":"m1-c1-q20","ch":1,"section":"RQ","q":"What is the position of the body when it is in the “normal anatomical position?”","a":"D. None of the above","opts":["A. The person is prone with upper limbs, including palms, touching sides and lower limbs touching at sides","B. The person is standing facing the observer, with upper limbs extended out at a ninety-degree angle from the torso and lower limbs in a wide stance with feet pointing laterally","C. The person is supine with upper limbs, including palms, touching sides and lower limbs touching at sides","D. None of the above"]},{"id":"m1-c1-q21","ch":1,"section":"RQ","q":"To make a banana split, you halve a banana into two long, thin, right and left sides along the ________.","a":"C. midsagittal plane","opts":["A. coronal plane","B. longitudinal plane","C. midsagittal plane","D. transverse plane"]},{"id":"m1-c1-q22","ch":1,"section":"RQ","q":"The lumbar region is ________.","a":"D. superior to the popliteal region","opts":["A. inferior to the gluteal region","B. inferior to the umbilical region","C. superior to the cervical region","D. superior to the popliteal region"]},{"id":"m1-c1-q23","ch":1,"section":"RQ","q":"The heart is within the ________.","a":"B. mediastinum","opts":["A. cranial cavity","B. mediastinum","C. posterior (dorsal) cavity","D. All of the above"]},{"id":"m1-c1-q24","ch":1,"section":"RQ","q":"In 1901, Wilhelm Röntgen was the first person to win the Nobel Prize for physics. For what discovery did he win?","a":"D. X-rays","opts":["A. nuclear physics","B. radiopharmaceuticals","C. the link between radiation and cancer","D. X-rays"]},{"id":"m1-c1-q25","ch":1,"section":"RQ","q":"Which of the following imaging techniques would be best to use to study the uptake of nutrients by rapidly multiplying cancer cells?","a":"C. PET","opts":["A. CT","B. MRI","C. PET","D. ultrasonography"]},{"id":"m1-c1-q26","ch":1,"section":"RQ","q":"Which of the following imaging studies can be used most safely during pregnancy?","a":"C. ultrasound","opts":["A. CT scans","B. PET scans","C. ultrasounds","D. X-rays"]},{"id":"m1-c1-q27","ch":1,"section":"RQ","q":"What are two major disadvantages of MRI scans?","a":"B. high cost and the need for shielding from the magnetic signals","opts":["A. release of radiation and poor quality images","B. high cost and the need for shielding from the magnetic signals","C. can only view metabolically active tissues and inadequate availability of equipment","D. release of radiation and the need for a patient to be confined to metal tube for up to 30 minutes"]},{"id":"m1-c1-q28","ch":1,"section":"CT","q":"Name at least three reasons to study anatomy and physiology.","a":"An understanding of anatomy and physiology is essential for any career in the health professions. It can also help you make choices that promote your health, respond appropriately to signs of illness, make sense of health-related news, and help you in your roles as a parent, spouse, partner, friend, colleague, and caregiver."},{"id":"m1-c1-q29","ch":1,"section":"CT","q":"For whom would an appreciation of the structural characteristics of the human heart come more easily: an alien who lands on Earth, abducts a human, and dissects his heart, or an anatomy and physiology student performing a dissection of the heart on her very first day of class? Why?","a":"A student would more readily appreciate the structures revealed in the dissection. Even though the student has not yet studied the workings of the heart and blood vessels in her class, she has experienced her heart beating every moment of her life, has probably felt her pulse, and likely has at least a basic understanding of the role of the heart in pumping blood throughout her body. This understanding of the heart’s function (physiology) would support her study of the heart’s form (anatomy)."},{"id":"m1-c1-q30","ch":1,"section":"CT","q":"Name the six levels of organization of the human body","a":"Chemical, cellular, tissue, organ, organ system, organism."},{"id":"m1-c1-q31","ch":1,"section":"CT","q":"The female ovaries and the male testes are a part of which body system? Can these organs be members of more than one organ system? Why or why not?","a":"The female ovaries and the male testes are parts of the reproductive system. But they also secrete hormones, as does the endocrine system, therefore ovaries and testes function within both the endocrine and reproductive systems."},{"id":"m1-c1-q32","ch":1,"section":"CT","q":"Explain why the smell of smoke when you are sitting at a campfire does not trigger alarm, but the smell of smoke in your residence hall does.","a":"When you are sitting at a campfire, your sense of smell adapts to the smell of smoke. Only if that smell were to suddenly and dramatically intensify would you be likely to notice and respond. In contrast, the smell of even a trace of smoke would be new and highly unusual in your residence hall, and would be perceived as danger."},{"id":"m1-c1-q33","ch":1,"section":"CT","q":"Identify three different ways that growth can occur in the human body.","a":"Growth can occur by increasing the number of existing cells, increasing the size of existing cells, or increasing the amount of non-cellular material around cells."},{"id":"m1-c1-q34","ch":1,"section":"CT","q":"When you open a bottle of sparkling water, the carbon dioxide gas in the bottle form bubbles. If the bottle is left open, the water will eventually “go flat.” Explain these phenomena in terms of atmospheric pressure.","a":"In a sealed bottle of sparkling water, carbon dioxide gas is kept dissolved in the water under a very high pressure. When you open the bottle, the pressure of the gas above the liquid changes from artificially high to normal atmospheric pressure. The dissolved carbon dioxide gas expands, and rises in bubbles to the surface. When a bottle of sparkling water is left open, it eventually goes flat because its gases continue to move out of solution until the pressure in the water is approximately equal to atmospheric pressure."},{"id":"m1-c1-q35","ch":1,"section":"CT","q":"On his midsummer trek through the desert, Josh ran out of water. Why is this particularly dangerous?","a":"The primary way that the body responds to high environmental heat is by sweating; however, sweating requires water, which comes from body fluids, including blood plasma. If Josh becomes dehydrated, he will be unable to sweat adequately to cool his body, and he will be at risk for heat stroke as his blood pressure drops too much from the loss of water from the blood plasma."},{"id":"m1-c1-q36","ch":1,"section":"CT","q":"Identify the four components of a negative feedback loop and explain what would happen if secretion of a body chemical controlled by a negative feedback system became too great.","a":"The four components of a negative feedback loop are: stimulus, sensor, control center, and effector. If too great a quantity of the chemical were excreted, sensors would activate a control center, which would in turn activate an effector. In this case, the effector (the secreting cells) would be adjusted downward."},{"id":"m1-c1-q37","ch":1,"section":"CT","q":"What regulatory processes would your body use if you were trapped by a blizzard in an unheated, uninsulated cabin in the woods?","a":"Any prolonged exposure to extreme cold would activate the brain’s heat-gain center. This would reduce blood flow to your skin, and shunt blood returning from your limbs away from the digits and into a network of deep veins. Your brain’s heat-gain center would also increase your muscle contraction, causing you to shiver. This increases the energy consumption of skeletal muscle and generates more heat. Your body would also produce thyroid hormone and epinephrine, chemicals that promote increased metabolism and heat production."},{"id":"m1-c1-q38","ch":1,"section":"CT","q":"In which direction would an MRI scanner move to produce sequential images of the body in the frontal plane, and in which direction would an MRI scanner move to produce sequential images of the body in the sagittal plane?","a":"If the body were supine or prone, the MRI scanner would move from top to bottom to produce frontal sections, which would divide the body into anterior and posterior portions, as in “cutting” a deck of cards. Again, if the body were supine or prone, to produce sagittal sections, the scanner would move from left to right or from right to left to divide the body lengthwise into left and right portions."},{"id":"m1-c1-q39","ch":1,"section":"CT","q":"If a bullet were to penetrate a lung, which three anterior thoracic body cavities would it enter, and which layer of the serous membrane would it encounter first?","a":"The bullet would enter the ventral, thoracic, and pleural cavities, and it would encounter the parietal layer of serous membrane first."},{"id":"m1-c1-q40","ch":1,"section":"CT","q":"Which medical imaging technique is most dangerous to use repeatedly, and why?","a":"CT scanning subjects patients to much higher levels of radiation than X-rays, and should not be performed repeatedly."},{"id":"m1-c1-q41","ch":1,"section":"CT","q":"Explain why ultrasound imaging is the technique of choice for studying fetal growth and development.","a":"Ultrasonography does not expose a mother or fetus to radiation, to radiopharmaceuticals, or to magnetic fields. At this time, there are no known medical risks of ultrasonography."},{"id":"m1-c2-q4","ch":2,"section":"RQ","q":"Together, just four elements make up more than 95 percent of the body’s mass. These include ________.","a":"D. oxygen, carbon, hydrogen, and nitrogen","opts":["A. calcium, magnesium, iron, and carbon","B. oxygen, calcium, iron, and nitrogen","C. sodium, chlorine, carbon, and hydrogen","D. oxygen, carbon, hydrogen, and nitrogen"]},{"id":"m1-c2-q5","ch":2,"section":"RQ","q":"The smallest unit of an element that still retains the distinctive behavior of that element is an ________.","a":"B. atom","opts":["A. electron","B. atom","C. elemental particle","D. isotope"]},{"id":"m1-c2-q6","ch":2,"section":"RQ","q":"The characteristic that gives an element its distinctive properties is its number of ________.","a":"A. protons","opts":["A. protons","B. neutrons","C. electrons","D. atoms"]},{"id":"m1-c2-q7","ch":2,"section":"RQ","q":"On the periodic table of the elements, mercury (Hg) has an atomic number of 80 and a mass number of 200.59. It has seven stable isotopes. The most abundant of these probably have ________.","a":"C. more than 80 neutrons each","opts":["A. about 80 neutrons each","B. fewer than 80 neutrons each","C. more than 80 neutrons each","D. more electrons than neutrons"]},{"id":"m1-c2-q8","ch":2,"section":"RQ","q":"Nitrogen has an atomic number of seven. How many electron shells does it likely have?","a":"B. two","opts":["A. one","B. two","C. three","D. four"]},{"id":"m1-c2-q9","ch":2,"section":"RQ","q":"Which of the following is a molecule, but not a compound?","a":"C. H2","opts":["A. H2O","B. 2H","C. H2","D. H+"]},{"id":"m1-c2-q10","ch":2,"section":"RQ","q":"A molecule of ammonia contains one atom of nitrogen and three atoms of hydrogen. These are linked with ________.","a":"C. polar covalent bonds","opts":["A. ionic bonds","B. nonpolar covalent bonds","C. polar covalent bonds","D. hydrogen bonds"]},{"id":"m1-c2-q11","ch":2,"section":"RQ","q":"When an atom donates an electron to another atom, it becomes","a":"A. an ion","opts":["A. an ion","B. an anion","C. nonpolar","D. all of the above"]},{"id":"m1-c2-q12","ch":2,"section":"RQ","q":"A substance formed of crystals of equal numbers of cations and anions held together by ionic bonds is called a(n) ________.","a":"B. salt","opts":["A. noble gas","B. salt","C. electrolyte","D. dipole"]},{"id":"m1-c2-q13","ch":2,"section":"RQ","q":"Which of the following statements about chemical bonds is true?","a":"A. Covalent bonds are stronger than ionic bonds.","opts":["A. Covalent bonds are stronger than ionic bonds in biological systems","B. Hydrogen bonds occur between two atoms of hydrogen","C. Bonding readily occurs between nonpolar and polar molecules","D. A molecule of water is unlikely to bond with an ion"]},{"id":"m1-c2-q14","ch":2,"section":"RQ","q":"The energy stored in a foot of snow on a steep roof is ________.","a":"A. potential energy","opts":["A. potential energy","B. kinetic energy","C. radiant energy","D. activation energy"]},{"id":"m1-c2-q15","ch":2,"section":"RQ","q":"The bonding of calcium, phosphorus, and other elements produces mineral crystals that are found in bone. This is an example of a(n) ________ reaction.","a":"B. synthesis","opts":["A. catabolic","B. synthesis","C. decomposition","D. exchange"]},{"id":"m1-c2-q16","ch":2,"section":"RQ","q":"AB → A + B is a general notation for a(n) ________ reaction.","a":"C. decomposition","opts":["A. anabolic","B. endergonic","C. decomposition","D. exchange"]},{"id":"m1-c2-q17","ch":2,"section":"RQ","q":"________ reactions release energy.","a":"D. Catabolic, exergonic, and decomposition","opts":["A. Catabolic","B. Exergonic","C. Decomposition","D. Catabolic, exergonic, and decomposition"]},{"id":"m1-c2-q18","ch":2,"section":"RQ","q":"Which of the following combinations of atoms is most likely to result in a chemical reaction?","a":"A. hydrogen and hydrogen","opts":["A. hydrogen and hydrogen","B. hydrogen and helium","C. helium and helium","D. neon and helium"]},{"id":"m1-c2-q19","ch":2,"section":"RQ","q":"Chewing a bite of bread mixes it with saliva and facilitates its chemical breakdown. This is most likely due to the fact that ________.","a":"D. saliva contains enzymes","opts":["A. the inside of the mouth maintains a very high temperature","B. chewing stores potential energy","C. chewing facilitates synthesis reactions","D. saliva contains enzymes"]},{"id":"m1-c2-q20","ch":2,"section":"RQ","q":"CH4 is methane. This compound is ________.","a":"B. organic","opts":["A. inorganic","B. organic","C. reactive","D. a crystal"]},{"id":"m1-c2-q21","ch":2,"section":"RQ","q":"Which of the following is most likely to be found evenly distributed in water in a homogeneous solution?","a":"A. sodium ions and chloride ions","opts":["A. sodium ions and chloride ions","B. NaCl molecules","C. salt crystals","D. red blood cells"]},{"id":"m1-c2-q22","ch":2,"section":"RQ","q":"Jenny mixes up a batch of pancake batter, then stirs in some chocolate chips. As she is waiting for the first few pancakes to cook, she notices the chocolate chips sinking to the bottom of the clear glass mixing bowl. The chocolate-chip batter is an example of a ________.","a":"D. suspension","opts":["A. solvent","B. solute","C. solution","D. suspension"]},{"id":"m1-c2-q23","ch":2,"section":"RQ","q":"A substance dissociates into K+ and Cl- in solution. The substance is a(n) ________.","a":"C. salt","opts":["A. acid","B. base","C. salt","D. buffer"]},{"id":"m1-c2-q24","ch":2,"section":"RQ","q":"Ty is three years old and as a result of a “stomach bug” has been vomiting for about 24 hours. His blood pH is 7.48. What does this mean?","a":"B. Ty's blood is slightly alkaline","opts":["A. Ty's blood is slightly acidic","B. Ty's blood is slightly alkaline","C. Ty's blood is highly acidic","D. Ty's blood is within the normal range"]},{"id":"m1-c2-q25","ch":2,"section":"RQ","q":"C6 H12 O6 is the chemical formula for a ________.","a":"C. hexose monosaccharide","opts":["A. polymer of carbohydrate","B. pentose monosaccharide","C. hexose monosaccharide","D. all of the above"]},{"id":"m1-c2-q26","ch":2,"section":"RQ","q":"What organic compound do brain cells primarily rely on for fuel?","a":"A. glucose","opts":["A. glucose","B. glycogen","C. galactose","D. glycerol"]},{"id":"m1-c2-q27","ch":2,"section":"RQ","q":"Which of the following is a functional group that is part of a building block of proteins?","a":"C. amino","opts":["A. phosphate","B. adenine","C. amino","D. ribose"]},{"id":"m1-c2-q28","ch":2,"section":"RQ","q":"A pentose sugar is a part of the monomer used to build which type of macromolecule?","a":"B. nucleic acids","opts":["A. polysaccharides","B. nucleic acids","C. phosphorylated glucose","D. glycogen"]},{"id":"m1-c2-q29","ch":2,"section":"RQ","q":"A phospholipid ________.","a":"A. has both polar and nonpolar regions","opts":["A. has both polar and nonpolar regions","B. is made up of a triglyceride bonded to a phosphate group","C. is a building block of ATP","D. can donate both cations and anions in solution"]},{"id":"m1-c2-q30","ch":2,"section":"RQ","q":"In DNA, nucleotide bonding forms a compound with a characteristic shape known as a(n) ________.","a":"D. double helix","opts":["A. beta chain","B. pleated sheet","C. alpha helix","D. double helix"]},{"id":"m1-c2-q31","ch":2,"section":"RQ","q":"Uracil ________.","a":"D. all of the above (contains nitrogen, is a pyrimidine, is found in RNA)","opts":["A. contains nitrogen","B. is a pyrimidine","C. is found in RNA","D. all of the above"]},{"id":"m1-c2-q32","ch":2,"section":"RQ","q":"The ability of an enzyme’s active sites to bind only substrates of compatible shape and charge is known as ________.","a":"B. specificity","opts":["A. selectivity","B. specificity","C. subjectivity","D. specialty"]},{"id":"m1-c2-q33","ch":2,"section":"CT","q":"The most abundant elements in the foods and beverages you consume are oxygen, carbon, hydrogen, and nitrogen. Why might having these elements in consumables be useful?","a":"These four elements—oxygen, carbon, hydrogen, and nitrogen—together make up more than 95 percent of the mass of the human body, and the body cannot make elements, so it is helpful to have them in consumables."},{"id":"m1-c2-q34","ch":2,"section":"CT","q":"Oxygen, whose atomic number is eight, has three stable isotopes: 16O, 17O, and 18O. Explain what this means in terms of the number of protons and neutrons.","a":"Oxygen has eight protons. In its most abundant stable form, it has eight neutrons, too, for a mass number of 16. In contrast, 17O has nine neutrons, and 18O has 10 neutrons."},{"id":"m1-c2-q35","ch":2,"section":"CT","q":"Magnesium is an important element in the human body, especially in bones. Magnesium’s atomic number is 12. Is it stable or reactive? Why? If it were to react with another atom, would it be more likely to accept or to donate one or more electrons?","a":"Magnesium’s 12 electrons are distributed as follows: two in the first shell, eight in the second shell, and two in its valence shell. According to the octet rule, magnesium is unstable (reactive) because its valence shell has just two electrons. It is therefore likely to participate in chemical reactions in which it donates two electrons."},{"id":"m1-c2-q36","ch":2,"section":"CT","q":"Explain why CH4 is one of the most common molecules found in nature. Are the bonds between the atoms ionic or covalent?","a":"A carbon atom has four electrons in its valence shell. According to the octet rule, it will readily participate in chemical reactions that result in its valence shell having eight electrons. Hydrogen, with one electron, will complete its valence shell with two. Electron sharing between an atom of carbon and four atoms of hydrogen meets the requirements of all atoms. The bonds are covalent because the electrons are shared: although hydrogen often participates in ionic bonds, carbon does not because it is highly unlikely to donate or accept four electrons."},{"id":"m1-c2-q37","ch":2,"section":"CT","q":"In a hurry one day, you merely rinse your lunch dishes with water. As you are drying your salad bowl, you notice that it still has an oily film. Why was the water alone not effective in cleaning the bowl?","a":"Water is a polar molecule. It has a region of weakly positive charge and a region of weakly negative charge. These regions are attracted to ions as well as to other polar molecules. Oils are nonpolar, and are repelled by water."},{"id":"m1-c2-q38","ch":2,"section":"CT","q":"Could two atoms of oxygen engage in ionic bonding? Why or why not?","a":"Identical atoms have identical electronegativity and cannot form ionic bonds. Oxygen, for example, has six electrons in its valence shell. Neither donating nor accepting the valence shell electrons of the other will result in the oxygen atoms completing their valence shells. Two atoms of the same element always form covalent bonds."},{"id":"m1-c2-q39","ch":2,"section":"CT","q":"AB + CD → AD + BE Is this a legitimate example of an exchange reaction? Why or why not?","a":"It is not. An exchange reaction might be AB + CD → AC + BD or AB + CD → AD + BC. In all chemical reactions, including exchange reactions, the components of the reactants are identical to the components of the products. A component present among the reactants cannot disappear, nor can a component not present in the reactants suddenly appear in the products."},{"id":"m1-c2-q40","ch":2,"section":"CT","q":"When you do a load of laundry, why do you not just drop a bar of soap into the washing machine? In other words, why is laundry detergent sold as a liquid or powder?","a":"Recall that the greater the surface area of the reactants, the more quickly and easily they will interact. It takes energy to separate particles of a substance. Powder and liquid laundry detergents, with relatively more surface area per unit, can quickly dissolve into their reactive components when added to the water."},{"id":"m1-c2-q41","ch":2,"section":"CT","q":"The pH of lemon juice is 2, and the pH of orange juice is 4. Which of these is more acidic, and by how much? What does this mean?","a":"Lemon juice is one hundred times more acidic than orange juice. This means that lemon juice has a one hundred-fold greater concentration of hydrogen ions."},{"id":"m1-c2-q42","ch":2,"section":"CT","q":"During a party, Eli loses a bet and is forced to drink a bottle of lemon juice. Not long thereafter, he begins complaining of having difficulty breathing, and his friends take him to the local emergency room. There, he is given an intravenous solution of bicarbonate. Why?","a":"Lemon juice, like any acid, releases hydrogen ions in solution. As excessive H+ enters the digestive tract and is absorbed into blood, Eli’s blood pH falls below 7.35. Recall that bicarbonate is a buffer, a weak base that accepts hydrogen ions. By administering bicarbonate intravenously, the emergency department physician helps raise Eli’s blood pH back toward neutral."},{"id":"m1-c2-q43","ch":2,"section":"CT","q":"If the disaccharide maltose is formed from two glucose monosaccharides, which are hexose sugars, how many atoms of carbon, hydrogen, and oxygen does maltose contain and why?","a":"Maltose contains 12 atoms of carbon, but only 22 atoms of hydrogen and 11 atoms of oxygen, because a molecule of water is removed during its formation via dehydration synthesis."},{"id":"m1-c2-q44","ch":2,"section":"CT","q":"Once dietary fats are digested and absorbed, why can they not be released directly into the bloodstream?","a":"All lipids are hydrophobic and unable to dissolve in the watery environment of blood. They are packaged into lipoproteins, whose outer protein envelope enables them to transport fats in the bloodstream."},{"id":"m1-c3-q6","ch":3,"section":"RQ","q":"Because they are embedded within the membrane, ion channels are examples of ________.","a":"B. integral proteins","opts":["A. receptor proteins","B. integral proteins","C. peripheral proteins","D. glycoproteins"]},{"id":"m1-c3-q7","ch":3,"section":"RQ","q":"The diffusion of substances within a solution tends to move those substances ________ their ________ gradient.","a":"D. down; concentration","opts":["A. up; electrical","B. up; electrochemical","C. down; pressure","D. down; concentration"]},{"id":"m1-c3-q8","ch":3,"section":"RQ","q":"Ion pumps and phagocytosis are both examples of ________.","a":"C. active transport","opts":["A. endocytosis","B. passive transport","C. active transport","D. facilitated diffusion"]},{"id":"m1-c3-q9","ch":3,"section":"RQ","q":"Choose the answer that best completes the following analogy: Diffusion is to ________ as endocytosis is to ________.","a":"B. osmosis; pinocytosis","opts":["A. filtration; phagocytosis","B. osmosis; pinocytosis","C. solutes; fluid","D. gradient; chemical energy"]},{"id":"m1-c3-q10","ch":3,"section":"RQ","q":"Choose the term that best completes the following analogy: Cytoplasm is to cytosol as a swimming pool containing chlorine and flotation toys is to ________.","a":"D. the water","opts":["A. the walls of the pool","B. the pool water containing chlorine","C. the flotation toys","D. the water"]},{"id":"m1-c3-q11","ch":3,"section":"RQ","q":"The rough ER has its name due to what associated structures?","a":"B. ribosomes","opts":["A. Golgi apparatus","B. ribosomes","C. lysosomes","D. proteins"]},{"id":"m1-c3-q12","ch":3,"section":"RQ","q":"Which of the following is a function of the rough ER?","a":"A. production of proteins","opts":["A. production of proteins","B. detoxification of certain substances","C. synthesis of steroid hormones","D. regulation of intracellular calcium concentration"]},{"id":"m1-c3-q13","ch":3,"section":"RQ","q":"Which of the following is a feature common to all three components of the cytoskeleton?","a":"C. They are all polymers of protein subunits","opts":["A. They all serve to scaffold the organelles within the cell","B. They are all characterized by roughly the same diameter","C. They are all polymers of protein subunits","D. They all help the cell resist compression and tension"]},{"id":"m1-c3-q14","ch":3,"section":"RQ","q":"Which of the following organelles produces large quantities of ATP when both glucose and oxygen are available to the cell?","a":"A. mitochondria","opts":["A. mitochondria","B. peroxisomes","C. lysosomes","D. ER"]},{"id":"m1-c3-q15","ch":3,"section":"RQ","q":"The nucleus and mitochondria share which of the following features?","a":"B. a double cell membrane","opts":["A. protein-lined membrane pores","B. a double cell membrane","C. the synthesis of ribosomes","D. the production of cellular energy"]},{"id":"m1-c3-q16","ch":3,"section":"RQ","q":"Which of the following structures could be found within the nucleolus?","a":"C. ribosomes","opts":["A. chromatin","B. histones","C. ribosomes","D. nucleosomes"]},{"id":"m1-c3-q17","ch":3,"section":"RQ","q":"Which of the following sequences on a DNA molecule would be complementary to GCTTATAT?","a":"C. CGAATATA","opts":["A. TAGGCGCG","B. ATCCGCGC","C. CGAATATA","D. TGCCTCTC"]},{"id":"m1-c3-q18","ch":3,"section":"RQ","q":"Place the following structures in order from least to most complex organization: chromatin, nucleosome, DNA, chromosome","a":"A. DNA, nucleosome, chromatin, chromosome","opts":["A. DNA, nucleosome, chromatin, chromosome","B. nucleosome, DNA, chromosome, chromatin","C. DNA, chromatin, nucleosome, chromosome","D. nucleosome, chromatin, DNA, chromosome"]},{"id":"m1-c3-q19","ch":3,"section":"RQ","q":"Which of the following is part of the elongation step of DNA synthesis?","a":"B. attaching complementary nucleotides to the template strand","opts":["A. pulling apart the two DNA strands","B. attaching complementary nucleotides to the template strand","C. untwisting the DNA helix","D. none of the above"]},{"id":"m1-c3-q20","ch":3,"section":"RQ","q":"Which of the following is not a difference between DNA and RNA?","a":"C. DNA contains alternating sugar-phosphate molecules whereas RNA does not contain sugars","opts":["A. DNA contains thymine whereas RNA contains uracil","B. DNA contains deoxyribose and RNA contains ribose","C. DNA contains alternating sugar-phosphate molecules whereas RNA does not contain sugars","D. RNA is single stranded and DNA is double stranded"]},{"id":"m1-c3-q21","ch":3,"section":"RQ","q":"Transcription and translation take place in the ________ and ________, respectively.","a":"A. nucleus; cytoplasm","opts":["A. nucleus; cytoplasm","B. nucleolus; nucleus","C. nucleolus; cytoplasm","D. cytoplasm; nucleus"]},{"id":"m1-c3-q22","ch":3,"section":"RQ","q":"How many “letters” of an RNA molecule, in sequence, does it take to provide the code for a single amino acid?","a":"C. 3","opts":["A. 1","B. 2","C. 3","D. 4"]},{"id":"m1-c3-q23","ch":3,"section":"RQ","q":"Which of the following is not made out of RNA?","a":"B. the ribosome","opts":["A. the carriers that shuttle amino acids to a growing polypeptide strand","B. the ribosome","C. the messenger molecule that provides the code for protein synthesis","D. the intron"]},{"id":"m1-c3-q24","ch":3,"section":"RQ","q":"Which of the following phases is characterized by preparation for DNA synthesis?","a":"B. G1","opts":["A. G0","B. G1","C. G2","D. S"]},{"id":"m1-c3-q25","ch":3,"section":"RQ","q":"A mutation in the gene for a cyclin protein might result in which of the following?","a":"D. any of the above (a cell with additional genetic material than normal, cancer, a cell with less genetic material than normal)","opts":["A. a cell with additional genetic material than normal","B. cancer","C. a cell with less genetic material than normal","D. any of the above"]},{"id":"m1-c3-q26","ch":3,"section":"RQ","q":"What is a primary function of tumor suppressor genes?","a":"B. stop certain cells from dividing","opts":["A. stop all cells from dividing","B. stop certain cells from dividing","C. help oncogenes produce oncoproteins","D. allow the cell to skip certain phases of the cell cycle"]},{"id":"m1-c3-q27","ch":3,"section":"RQ","q":"Arrange the following terms in order of increasing specialization: oligopotency, pleuripotency, unipotency, multipotency.","a":"D. pleuripotency, multipotency, oligopotency, unipotency","opts":["A. multipotency, pleuripotency, oligopotency, unipotency","B. pleuripotency, oligopotency, multipotency unipotency","C. oligopotency, pleuripotency, unipotency, multipotency","D. pleuripotency, multipotency, oligopotency, unipotency"]},{"id":"m1-c3-q28","ch":3,"section":"RQ","q":"Which type of stem cell gives rise to red and white blood cells?","a":"C. hematopoietic","opts":["A. endothelial","B. epithelial","C. hematopoietic","D. mesenchymal"]},{"id":"m1-c3-q29","ch":3,"section":"RQ","q":"What multipotent stem cells from children sometimes banked by parents?","a":"C. cells from the umbilical cord and from baby teeth","opts":["A. fetal stem cells","B. embryonic stem cells","C. cells from the umbilical cord and from baby teeth","D. hematopoietic stem cells from red and white blood cells"]},{"id":"m1-c3-q30","ch":3,"section":"CT","q":"What materials can easily diffuse through the lipid bilayer, and why?","a":"Only materials that are relatively small and nonpolar can easily diffuse through the lipid bilayer. Large particles cannot fit in between the individual phospholipids that are packed together, and polar molecules are repelled by the hydrophobic/nonpolar lipids that line the inside of the bilayer."},{"id":"m1-c3-q31","ch":3,"section":"CT","q":"Why is receptor-mediated endocytosis said to be more selective than phagocytosis or pinocytosis?","a":"Receptor-mediated endocytosis is more selective because the substances that are brought into the cell are the specific ligands that could bind to the receptors being endocytosed. Phagocytosis or pinocytosis, on the other hand, have no such receptor-ligand specificity, and bring in whatever materials happen to be close to the membrane when it is enveloped."},{"id":"m1-c3-q32","ch":3,"section":"CT","q":"What do osmosis, diffusion, filtration, and the movement of ions away from like charge all have in common? In what way do they differ?","a":"These four phenomena are similar in the sense that they describe the movement of substances down a particular type of gradient. Osmosis and diffusion involve the movement of water and other substances down their concentration gradients, respectively. Filtration describes the movement of particles down a pressure gradient, and the movement of ions away from like charge describes their movement down their electrical gradient."},{"id":"m1-c3-q33","ch":3,"section":"CT","q":"Explain why the structure of the ER, mitochondria, and Golgi apparatus assist their respective functions.","a":"The structure of the Golgi apparatus is suited to its function because it is a series of flattened membranous discs; substances are modified and packaged in sequential steps as they travel from one disc to the next. The structure of Golgi apparatus also involves a receiving face and a sending face, which organize cellular products as they enter and leave the Golgi apparatus. The ER and the mitochondria both have structural specializations that increase their surface area. In the mitochondria, the inner membrane is extensively folded, which increases surface area for ATP production. Likewise, the ER is elaborately wound throughout the cell, increasing its surface area for functions like lipid synthesis, Ca++ storage, and protein synthesis."},{"id":"m1-c3-q34","ch":3,"section":"CT","q":"Compare and contrast lysosomes with peroxisomes: name at least two similarities and one difference.","a":"Peroxisomes and lysosomes are both cellular organelles bound by lipid bilayer membranes, and they both contain many enzymes. However, peroxisomes contain enzymes that detoxify substances by transferring hydrogen atoms and producing H2O2, whereas the enzymes in lysosomes function to break down and digest various unwanted materials."},{"id":"m1-c3-q35","ch":3,"section":"CT","q":"Explain in your own words why DNA replication is said to be “semiconservative”?","a":"DNA replication is said to be semiconservative because, after replication is complete, one of the two parent DNA strands makes up half of each new DNA molecule. The other half is a newly synthesized strand. Therefore, half (“semi”) of each daughter DNA molecule is from the parent molecule and half is a new molecule."},{"id":"m1-c3-q36","ch":3,"section":"CT","q":"Why is it important that DNA replication take place before cell division? What would happen if cell division of a body cell took place without DNA replication, or when DNA replication was incomplete?","a":"During cell division, one cell divides to produce two new cells. In order for all of the cells in your body to maintain a full genome, each cell must replicate its DNA before it divides so that a full genome can be allotted to each of its offspring cells. If DNA replication did not take place fully, or at all, the offspring cells would be missing some or all of the genome. This could be disastrous if a cell was missing genes necessary for its function and health."},{"id":"m1-c3-q37","ch":3,"section":"CT","q":"Briefly explain the similarities between transcription and DNA replication.","a":"Transcription and DNA replication both involve the synthesis of nucleic acids. These processes share many common features—particularly, the similar processes of initiation, elongation, and termination. In both cases the DNA molecule must be untwisted and separated, and the coding (i.e., sense) strand will be used as a template. Also, polymerases serve to add nucleotides to the growing DNA or mRNA strand. Both processes are signaled to terminate when completed."},{"id":"m1-c3-q38","ch":3,"section":"CT","q":"Contrast transcription and translation. Name at least three differences between the two processes.","a":"Transcription is really a “copy” process and translation is really an “interpretation” process, because transcription involves copying the DNA message into a very similar RNA message whereas translation involves converting the RNA message into the very different amino acid message. The two processes also differ in their location: transcription occurs in the nucleus and translation in the cytoplasm. The mechanisms by which the two processes are performed are also completely different: transcription utilizes polymerase enzymes to build mRNA whereas translation utilizes different kinds of RNA to build protein."},{"id":"m1-c3-q39","ch":3,"section":"CT","q":"What would happen if anaphase proceeded even though the sister chromatids were not properly attached to their respective microtubules and lined up at the metaphase plate?","a":"One or both of the new daughter cells would accidently receive duplicate chromosomes and/or would be missing certain chromosomes."},{"id":"m1-c3-q40","ch":3,"section":"CT","q":"What are cyclins and cyclin-dependent kinases, and how do they interact?","a":"A cyclin is one of the primary classes of cell cycle control molecules, while a cyclin-dependent kinase (is one of a group of molecules that work together with cyclins to determine progression past cell checkpoints. By interacting with many additional molecules, these triggers push the cell cycle forward unless prevented from doing so by “stop” signals, if for some reason the cell is not ready."},{"id":"m1-c3-q41","ch":3,"section":"CT","q":"Explain how a transcription factor ultimately determines whether or not a protein will be present in a given cell?","a":"Transcription factors bind to DNA and either promote or inhibit the transcription of a gene. If they promote the transcription of a particular gene, then that gene will be transcribed and the mRNA subsequently translated into protein. If gene transcription is inhibited, then there will be no way of synthesizing the gene’s corresponding protein."},{"id":"m1-c3-q42","ch":3,"section":"CT","q":"Discuss two reasons why the therapeutic use of embryonic stem cells can present a problem.","a":"Embryonic stem cells derive from human embryos, which are destroyed to obtain the cells. The destruction of human embryos is an ethical problem. And, the DNA in an embryonic stem cell would differ from the DNA of the person being treated, which could result in immune problems or rejected of tissue."},{"id":"m1-c1-mc1","ch":1,"section":"MC","q":"A midsagittal section of the body would pass through the","a":"C. heart.","opts":["A. kidney.","B. lung.","C. heart.","D. spleen.","E. leg."]},{"id":"m1-c1-mc2","ch":1,"section":"MC","q":"A person experiencing hypothermia would have which of the following symptoms?","a":"B. Low body temperature","opts":["A. High metabolism","B. Low body temperature","C. Elevated heart rate","D. Excessive sweating"]},{"id":"m1-c1-mc3","ch":1,"section":"MC","q":"Which structure is part of the lymphatic system?","a":"A. Spleen","opts":["A. Spleen","B. Heart","C. Lungs","D. Liver"]},{"id":"m1-c1-mc4","ch":1,"section":"MC","q":"What does the term 'distal' refer to?","a":"D. Farther from the point of attachment","opts":["A. Closer to the midline","B. Nearer to the head","C. Towards the front of the body","D. Farther from the point of attachment"]},{"id":"m1-c1-mc5","ch":1,"section":"MC","q":"Which anatomical plane divides the body into anterior and posterior sections?","a":"C. Frontal plane","opts":["A. Sagittal plane","B. Midsagittal plane","C. Frontal plane","D. Transverse plane"]},{"id":"m1-c1-mc6","ch":1,"section":"MC","q":"What best describes a serous membrane?","a":"D. Lines body cavities and covers organs","opts":["A. Supports organs by providing nutrients","B. Connects muscles to bones","C. Protects against mechanical injury","D. Lines body cavities and covers organs"]},{"id":"m1-c1-mc7","ch":1,"section":"MC","q":"What does 'anatomical position' refer to?","a":"A. Standing upright with arms at the side and palms facing forward","opts":["A. Standing upright with arms at the side and palms facing forward","B. Lying face down","C. Standing with arms raised above the head","D. Seated with legs crossed"]},{"id":"m1-c1-mc8","ch":1,"section":"MC","q":"Which of the following is considered a negative feedback mechanism?","a":"C. Regulation of blood sugar levels","opts":["A. Childbirth contractions","B. Blood clotting","C. Regulation of blood sugar levels","D. Adrenaline rush"]},{"id":"m1-c1-mc9","ch":1,"section":"MC","q":"A person lying face down is in the ________ position.","a":"prone"},{"id":"m1-c1-mc10","ch":1,"section":"MC","q":"A person lying on the bed and gazing at the ceiling is in the ________ position.","a":"B. supine","opts":["A. prone","B. supine","C. anatomical","D. dorsal","E. caudal"]},{"id":"m1-c1-mc11","ch":1,"section":"MC","q":"A person who is standing facing forward with hands at the sides and palms facing forward is in the","a":"C. anatomical position.","opts":["A. supine position.","B. prone position.","C. anatomical position.","D. frontal position.","E. sagittal position."]},{"id":"m1-c1-mc12","ch":1,"section":"MC","q":"An anatomical term that means the same as ventral:","a":"D. anterior","opts":["A. posterior","B. inferior","C. abdominal","D. anterior","E. superior"]},{"id":"m1-c1-mc13","ch":1,"section":"MC","q":"An example of a receptor in a negative feedback loop controlling body temperature would be","a":"A. temperature sensors on the skin that detect a stimulus.","opts":["A. temperature sensors on the skin that detect a stimulus.","B. sweat glands that increase secretion.","C. regulatory centers that send commands to an effector.","D. effectors that cause blood vessels to dilate.","E. sweat glands that act like effectors."]},{"id":"m1-c1-mc14","ch":1,"section":"MC","q":"Anatomy is to ________ as physiology is to ________.","a":"C. structure; function","opts":["A. function; form","B. form; structure","C. structure; function","D. structure; form","E. growth; form"]},{"id":"m1-c1-mc15","ch":1,"section":"MC","q":"Anatomy uses a special language, called ________ terminology, that involves the use of word roots, prefixes, suffixes, and combining forms to construct terms related to the body in health and disease.","a":"medical"},{"id":"m1-c1-mc16","ch":1,"section":"MC","  pathological physiology.","E. histology."]},{"id":"m1-c1-mc25","ch":1,"section":"MC","q":"The heart is ________ to the lungs.","a":"B. medial","opts":["A. lateral","B. medial","C. posterior","D. proximal","E. distal"]},{"id":"m1-c1-mc26","ch":1,"section":"MC","q":"The right pleural cavity contains:","a":"D. right lung","opts":["A. heart","B. trachea","C. left lung","D. right lung","E. both lungs"]},{"id":"m1-c1-mc27","ch":1,"section":"MC","q":"The kidneys and ureters are organs of the ________ system.","a":"D. urinary","opts":["A. endocrine","B. digestive","C. respiratory","D. urinary","E. lymphatic"]},{"id":"m1-c1-mc28","ch":1,"section":"MC","q":"The liver is primarily located in the ________ quadrant.","a":"A. right upper","opts":["A. right upper","B. left upper","C. right lower","D. left lower","E. hepatic"]},{"id":"m1-c1-mc29","ch":1,"section":"MC","q":"The mediastinum","a":"E. separates the pleural cavities and includes the pericardial cavity.","opts":["A. contains the pleural cavities.","B. separates the pleural cavities.","C. contains the pericardial cavity.","D. contains the pleural cavities and pericardial cavity.","E. separates the pleural cavities and includes the pericardial cavity."]},{"id":"m1-c1-mc30","ch":1,"section":"MC","q":"The pituitary gland and thyroid gland are organs of the ________ system.","a":"A. endocrine","opts":["A. endocrine","B. cardiovascular","C. respiratory","D. lymphatic","E. digestive"]},{"id":"m1-c1-mc31","ch":1,"section":"MC","q":"The plane that separates the abdominal and the pelvic cavities is","a":"C. transverse at the hips.","opts":["A. the mediastinum.","B. sagittal on the brachium.","C. transverse at the hips.","D. midsagittal on the trunk.","E. superior to the thorax."]},{"id":"m1-c1-mc32","ch":1,"section":"MC","q":"Skin, hair, and nails are associated with the ________ system.","a":"C. integumentary","opts":["A. skeletal","B. muscular","C. integumentary","D. endocrine","E. immune"]},{"id":"m1-c2-mc1","ch":2,"section":" oton","E. a neutron"]},{"id":"m1-c2-mc8","ch":2,"section":"MC","q":"An important buffer in body fluids is","a":"D. NaHCO3.","opts":["A. NaCl.","B. NaOH.","C. HCl.","D. NaHCO3.","E. H2O."]},{"id":"m1-c2-mc9","ch":2,"section":"MC","q":"An unequal sharing of electrons results in what type of chemical bonds?","a":"A. polar covalent","opts":["A. polar covalent","B. covalent","C. ionic","D. hydrogen","E. peptide"]},{"id":"m1-c2-mc10","ch":2,"section":"MC","q":"Chemical reactions that yield energy, such as heat, are said to be","a":"C. exergonic.","opts":["A. endergonic.","B. activated.","C. exergonic.","D. neutral.","E. thermonuclear."]},{"id":"m1-c2-mc11","ch":2,"section":"MC","q":"Cholesterol, phospholipids, and glycolipids are examples of","a":"C. structural lipids.","opts":["A. dietary fats.","B. prostaglandins.","C. structural lipids.","D. lipid drugs.","E. steroids."]},{"id":"m1-c2-mc12","ch":2,"section":"MC","q":"Each amino acid differs from another in the","a":"D. nature of the side chain.","opts":["A. number of central carbon atoms.","B. size of the amino group.","C. number of carboxyl groups.","D. nature of the side chain.","E. number of peptide bonds in the molecule."]},{"id":"m1-c2-mc13","ch":2,"section":"MC","q":"Elements that have atoms with full outer shells of electrons","a":"E. are inert gases.","opts":["A. will form many compounds.","B. will normally form anions.","C. will normally form cations.","D. frequently form hydrogen bonds.","E. are inert gases."]},{"id":"m1-c2-mc14","ch":2,"section":"MC","q":"In hydrolysis reactions, compounds react with","a":"C. water, causing decomposition.","opts":["A. hydrogen, causing decomposition.","B. glucose, causing decomposition.","C. water, causing decomposition.","D. carbon, causing decomposition.","E. water, causing synthesis."]},{"id":"m1-c2-mc15","ch":2,"section":"MC","q":"In dehydration synthesis reactions, compounds","a":"A. lose water molecules.","opts":["A. lose water molecules.","B. gain water molecules.","C. convert water molecules to hydrogen and oxygen.","D. convert hydrogen and oxygen to water.","E. gain electrons."]},{"id":"m1-c2-mc16","ch":2,"section":"MC","q":"Ionic bonds are formed when","a":"B. an electron or electrons are completely transferred from one atom to another.","opts":["A. atoms share electrons.","B. an electron or electrons are completely transferred from one atom to another.","C. a pair of electrons is shared unequally by two atoms.","D. hydrogen forms bonds with negatively charged atoms.","E. two or more atoms lose electrons at the same time."]},{"id":"m1-c2-mc17","ch":2,"section":"MC","q":"Lipids are composed of fatty acids and","a":"A. glycerol.","opts":["A. glycerol.","B. amino acids.","C. sugars.","D. monosaccharides.","E. polypeptides."]},{"id":"m1-c2-mc18","ch":2,"section":"MC","q":"The nucleus of an atom consists of","a":"D. protons + neutrons.","opts":["A. electrons.","B. protons.","C. neutrons.","D. protons + neutrons.","E. protons + electrons."]},{"id":"m1-c2-mc19","ch":2,"section":"MC","q":"The phosphorylation of adenosine forms","a":"C. AMP.","opts":["A. ADP.","B. ATP.","C. AMP.","D. 2ATP.","E. ribose."]},{"id":"m1-c2-mc20","ch":2,"section":"MC","q":"The structure of RNA differs from DNA in that","a":"A. the backbone of RNA contains ribose.","opts":["A. the backbone of RNA contains ribose.","B. RNA contains pyrimidines but not purines.","C. RNA contains purines but not pyrimidines.","D. DNA contains pyrimidines but not purines.","E. DNA contains purines but not pyrimidines."]},{"id":"m1-c2-mc21","ch":2,"section":"MC","q":"The weakest bond between two atoms is the ________ bond.","a":"E. hydrogen","opts":["A. ionic","B. covalent","C. polar","D. nonpolar","E. hydrogen"]},{"id":"m1-c2-mc22","ch":2,"section":"MC","q":"When two monosaccharides undergo a dehydration synthesis,","a":"B. a disaccharide is formed.","opts":["A. two new monosaccharides are formed.","B. a disaccharide is formed.","C. a polysaccharide is formed.","D. a starch is formed.","E. hydrolysis occurs."]},{"id":"m1-c2-mc23","ch":2,"section":"MC","q":"Which has the greater concentration of hydrogen ions, a substance with a pH of 5 or a substance with a pH of 4?","a":"A. A pH of 4 is greater.","opts":["A. A pH of 4 is greater.","B. A pH of 5 is greater.","C. They are both equal; 4 and 5 are relative values.","D. pH 9, if you mixed the solutions.","E. There is not enough information to determine."]},{"id":"m1-c2-mc24","ch":2,"section":"MC","q":"Which pH is closest to normal body pH?","a":"A. pH 7","opts":["A. pH 7","B. pH 8","C. pH 4","D. pH 3","E. pH 2"]},{"id":"m1-c2-mc25","ch":2,"section":"MC","q":"If a substance has a pH that is greater than 7, it is","a":"C. alkaline.","opts":["A. neutral.","B. acidic.","C. alkaline.","D. a buffer.","E. a salt."]},{"id":"m1-c3-mc1","ch":3,"section":"MC","q":"A DNA nucleotide is composed of","a":"C. one nitrogen base, deoxyribose sugar, and a phosphate group.","opts":["A. three amino acids.","B. a codon and an anticodon.","C. one nitrogen base, deoxyribose sugar, and a phosphate group.","D. four nitrogen bases.","E. protein, lipid, and ribose sugar."]},{"id":"m1-c3-mc2","ch":3,"section":"MC","q":"A defense cell engulfing a bacterium illustrates","a":"D. phagocytosis.","opts":["A. pinocytosis.","B. endocytosis.","C. exocytosis.","D. phagocytosis.","E. receptor-mediated endocytosis."]},{"id":"m1-c3-mc3","ch":3,"section":"MC","q":"A gene is a set of specific instructions that","a":"D. indicates the sequence of amino acids in a protein molecule.","opts":["A. produces amino acids for proteins.","B. copies DNA strands for mitosis.","C. controls the process of mitosis.","D. indicates the sequence of amino acids in a protein molecule.","E. directs carbohydrate synthesis."]},{"id":"m1-c3-mc4","ch":3,"section":"MC","q":"A mature red blood cell lacks a nucleus; therefore, it","a":"E. cannot make new proteins and will be worn out within a few months.","opts":["A. can repair itself readily.","B. is malformed."," ns","opts":["A. RNA; carbohydrates","B. DNA; lipids","C. DNA; proteins","D. water; RNA","E. RNA; proteins"]},{"id":"m1-c3-mc11","ch":3,"section":"MC","q":"Compared to the extracellular fluid, cytosol contains","a":"A. a higher concentration of potassium ions.","opts":["A. a higher concentration of potassium ions.","B. a lower concentration of dissolved proteins.","C. almost no glycogen.","D. a higher concentration of amino acids.","E. almost no lipids."]},{"id":"m1-c3-mc12","ch":3,"section":"MC","q":"Components of the cytoskeleton may include all of the following, except","a":"C. microsomes.","opts":["A. microfilaments.","B. intermediate filaments.","C. microsomes.","D. microtubules.","E. thick filaments."]},{"id":"m1-c3-mc13","ch":3,"section":"MC","q":"During mitosis, chromatids separate into daughter chromosomes during","a":"E. anaphase.","opts":["A. prophase.","B. metaphase.","C. interphase.","D. telophase.","E. anaphase."]},{"id":"m1-c3-mc14","ch":3,"section":"MC","q":"Endocytosis is","a":"A. a method for transporting substances into the cell.","opts":["A. a method for transporting substances into the cell.","B. a method for metabolizing within the cytosol.","C. a form of anabolism.","D. a viral infection.","E. a method for packaging secretions."]},{"id":"m1-c3-mc15","ch":3,"section":"MC","q":"Each of the following is an example of a nonmembranous organelle, except","a":"A. lysosomes.","opts":["A. lysosomes.","B. cilia.","C. centrioles.","D. ribosomes.","E. cytoskeleton."]},{"id":"m1-c3-mc16","ch":3,"section":"MC","q":"Facilitated diffusion differs from ordinary diffusion in that","a":"C. the rate of molecular movement is limited by the number of available carrier molecules.","opts":["A. facilitated diffusion consumes no ATP.","B. facilitated diffusion moves molecules from an area of higher concentration to lower concentration.","C. the rate of molecular movement is limited by the number of available carrier molecules.","D. facilitated diffusion never eliminates ":3,"section":"MC","q":"Most of a cell's DNA is located in its","a":"D. nucleus.","opts":["A. ribosomes.","B. lysosomes.","C. Golgi apparatus.","D. nucleus.","E. nucleolus."]},{"id":"m1-c3-mc25","ch":3,"section":"MC","q":"The anticodon for the triplet UCA is","a":"A. AGU.","opts":["A. AGU.","B. AGC.","C. TCA.","D. TGT.","E. AGT."]},{"id":"m1-c3-mc26","ch":3,"section":"MC","q":"The DNA molecule is like a twisted ladder. What molecules form the 'sides' of the DNA ladder?","a":"A. alternating molecules of sugar and phosphate groups","opts":["A. alternating molecules of sugar and phosphate groups","B. carbohydrates and lipids","C. repeating molecules of acids and bases","D. amino acids and protein","E. nitrogen bases and sugar molecules"]},{"id":"m1-c3-mc27","ch":3,"section":"MC","q":"Synthesis of lipids and glycogen takes place at the","a":"C. smooth ER.","opts":["A. ribosomes.","B. rough ER.","C. smooth ER.","D. Golgi apparatus.","E. mitochondria."]},{"id":"m1-c3-mc28","ch":3,"section":"MC","q":"The control center for cellular operations is the","a":"A. nucleus.","opts":["A. nucleus.","B. mitochondria.","C. Golgi apparatus.","D. endoplasmic reticulum.","E. ribosome."]},{"id":"m1-c3-mc29","ch":3,"section":"MC","q":"The components of ribosomes are formed within","a":"E. nucleoli.","opts":["A. the endoplasmic reticulum.","B. Golgi complexes.","C. lysosomes.","D. mitochondria.","E. nucleoli."]},{"id":"m1-c3-mc30","ch":3,"section":"MC","q":"The genetically programmed death of cells is called","a":"C. apoptosis.","opts":["A. differentiation.","B. replication.","C. apoptosis.","D. metastasis.","E. mitosis."]},{"id":"m1-c3-mc31","ch":3,"section":"MC","q":"The functional units of DNA that contain the instructions for making one or more proteins are","a":"B. genes.","opts":["A. chromosomes.","B. genes.","C. ribosomes.","D. codons.","E. RNA."]},{"id":"m1-c3-mc32","ch":3,"section":"MC","q":"The plasma membrane is composed of","a":"B. a bilayer of phospholipids.","opts":["A. a bilayer of proteins.","B. a bilayer of phospholipids.","C. carbohydrate molecules.","D. carbohydrates and proteins.","E. carbohydrates and lipids."]},{"id":"m1-c3-mc33","ch":3,"section":"MC","q":"The plasmalemma includes","a":"E. All of the answers are correct.","opts":["A. integral proteins.","B. glycolipids.","C. phospholipids.","D. cholesterol.","E. All of the answers are correct."]},{"id":"m1-c3-mc34","ch":3,"section":"MC","q":"The mRNA sequence that is complementary to the sequence ATC on DNA is","a":"C. UAG.","opts":["A. ATC.","B. TAG.","C. UAG.","D. AUG.","E. AUC."]},{"id":"m1-c3-mc35","ch":3,"section":"MC","q":"The smallest living unit within the human body is","a":"B. the cell.","opts":["A. a protein.","B. the cell.","C. a tissue.","D. an organ.","E. an organ system."]},{"id":"m1-c3-mc36","ch":3,"section":"MC","q":"The tails of a phospholipid molecule are","a":"C. hydrophobic.","opts":["A. hydrophilic.","B. composed of amino acids.","C. hydrophobic.","D. facing the cytosol.","E. interlocked to provide membrane strength."]},{"id":"m1-c3-mc37","ch":3,"section":"MC","q":"Two types of vesicular transport include","a":"B. endocytosis and exocytosis.","opts":["A. endocytosis and retrocytosis.","B. endocytosis and exocytosis.","C. exocytosis and retrocytosis.","D. pinocytosis and active transport.","E. passive diffusion and active diffusion."]},{"id":"m1-c3-mc38","ch":3,"section":"MC","q":"When is DNA replicated?","a":"A. interphase","opts":["A. interphase","B. anaphase","C. metaphase","D. telophase","E. interkinesis"]},{"id":"m1-c3-mc39","ch":3,"section":"MC","q":"What would the complimentary DNA template strand be to produce the mRNA sequence of UGU - CAA?","a":"A. ACA - GTT","opts":["A. ACA - GTT","B. UCU - GUU","C. CGC - ATT","D. ACA - GUU","E. TCT - GTT"]},{"id":"m1-c3-mc40","ch":3,"section":"MC","q":"mRNA is needed to synthesize ________ in the cytoplasm.","a":"C. proteins","opts":["A. carbohydrates","B. lipids","C. proteins","D. phospholipids","E. salts"]},{"id":"m1-c1-lab1","ch":1,"section":"Lab","q":"Which organ system controls cell function with hormones, and its major organs include the thyroid, pancreas, and adrenal glands?","a":"E. endocrine","opts":["A. integumentary","B. lymphatic","C. nervous","D. urinary","E. endocrine"]},{"id":"m1-c1-lab2","ch":1,"section":"Lab","q":"The membrane on the surface of the lung is called the:","a":"D. visceral pleura","opts":["A. visceral peritoneum","B. parietal pleura","C. parietal peritoneum","D. visceral pleura"]},{"id":"m1-c1-lab3","ch":1,"section":"Lab","q":"The trachea is ____________ to the esophagus.","a":"C. anterior","opts":["A. medial","B. inferior","C. anterior","D. posterior","E. lateral"]},{"id":"m1-c1-lab4","ch":1,"section":"Lab","q":"Which organ system returns fluid to the bloodstream and provides protection against pathogens?","a":"E. lymphatic / immune","opts":["A. respiratory","B. reproductive","C. urinary","D. integumentary","E. lymphatic / immune"]},{"id":"m1-c1-lab5","ch":1,"section":"Lab","q":"The anatomical term meaning 'on the other side of the body' is:","a":"E. contralateral","opts":["A. ipsilateral","B. intermediate","C. distal","D. medial","E. contralateral"]},{"id":"m1-c1-lab6","ch":1,"section":"Lab","q":"A plane which divides the body into anterior and posterior portions is called a:","a":"B. frontal plane","opts":["A. cross-sectional plane","B. frontal plane","C. midsagittal plane","D. sagittal plane","E. horizontal plane"]},{"id":"m1-c1-lab7","ch":1,"section":"Lab","q":"This organ system includes the skin, hair, and nails:","a":"D. integumentary","opts":["A. lymphatic","B. muscular","C. skeletal","D. integumentary","E. endocrine"]},{"id":"m1-c1-lab8","ch":1,"section":"Lab","q":"The 'shoulder' (region) is:","a":"B. acromial","opts":["A. coxal","B. acromial","C. cephalic","D. otic","E. olecranal"]},{"id":"m1-c1-lab9","ch":1,"section":"Lab","q":"The 'armpit' region is:","a":"E. axillary","opts":["A. crural","B. brachial","C. buccal","D. antecubital","E. axillary"]},{"id":"m1-c1-lab10","ch":1,"section":"Lab","q":"The 'fingers or toes' are:","a":"D. digits","opts":["A. tarsals","B. popliteals","C. carpals","D. digits","E. inguinals"]},{"id":"m1-c1-lab11","ch":1,"section":"Lab","q":"A ___ section is the same as a horizontal section.","a":"C. transverse","opts":["A. frontal","B. sagittal","C. transverse","D. midsagittal","E. coronal"]},{"id":"m1-c1-lab12","ch":1,"section":"Lab","q":"Which organ lies in the thoracic cavity?","a":"A. heart","opts":["A. heart","B. kidney","C. liver","D. stomach","E. spleen"]},{"id":"m1-c1-lab13","ch":1,"section":"Lab","q":"Femoral refers to the:","a":"B. thigh","opts":["A. cheek","B. thigh","C. foot","D. forearm","E. back"]},{"id":"m1-c1-lab14","ch":1,"section":"Lab","q":"True or false: The fingers are proximal to the wrist.","a":"B. false","opts":["A. true","B. false"]},{"id":"m1-c1-lab15","ch":1,"section":"Lab","q":"True or false: The bones are deep to the skin.","a":"A. true","opts":["A. true","B. false"]},{"id":"m1-c1-lab16","ch":1,"section":"Lab","q":"True or false: The sternum is anterior to the vertebral column.","a":"A. true","opts":["A. true","B. false"]},{"id":"m1-c1-lab17","ch":1,"section":"Lab","q":"The organ system that contains the liver is the:","a":"E. digestive","opts":["A. urinary","B. immune","C. integumentary","D. endocrine","E. digestive"]},{"id":"m1-c1-lab18","ch":1,"section":"Lab","q":"The ________ is located in the pelvic body cavity.","a":"A. urinary bladder","opts":["A. urinary bladder","B. brain","C. lungs","D. heart","E. diaphragm"]},{"id":"m1-c1-lab19","ch":1,"section":"Lab","q":"True or false: The testes and ovaries fall into both the endocrine and reproductive systems.","a":"A. true","opts":["A. true","B. false"]},{"id":"m1-c1-lab20","ch":1,"section":"Lab","q":"The organ system that contains the spleen is the:","a":"B. lymphatic / immune","opts":["A. urinary","B. lymphatic / immune","C. integumentary","D. endocrine","E. digestive"]},{"id":"m1-c1-anat21","ch":1,"section":"Anat","q":"What is the anatomical term for the neck?","a":"cervical"},{"id":"m1-c1-anat22","ch":1,"section":"Anat","q":"What is the anatomical term for the head (skull)?","a":"cranial / cephalic"},{"id":"m1-c1-anat23","ch":1,"section":"Anat","q":"What is the anatomical term for the face?","a":"facial"},{"id":"m1-c1-anat24","ch":1,"section":"Anat","q":"What is the anatomical term for the forehead?","a":"frontal"},{"id":"m1-c1-anat25","ch":1,"section":"Anat","q":"What is the anatomical term for the eye?","a":"orbital"},{"id":"m1-c1-anat26","ch":1,"section":"Anat","q":"What is the anatomical term for the ear?","a":"otic"},{"id":"m1-c1-anat27","ch":1,"section":"Anat","q":"What is the anatomical term for the cheek?","a":"buccal"},{"id":"m1-c1-anat28","ch":1,"section":"Anat","q":"What is the anatomical term for the nose?","a":"nasal"},{"id":"m1-c1-anat29","ch":1,"section":"Anat","q":"What is the anatomical term for the mouth?","a":"oral"},{"id":"m1-c1-anat30","ch":1,"section":"Anat","q":"What is the anatomical term for the chin?","a":"mental"},{"id":"m1-c1-anat31","ch":1,"section":"Anat","q":"What is the anatomical term for the chest?","a":"thoracic"},{"id":"m1-c1-anat32","ch":1,"section":"Anat","q":"What is the anatomical term for the breast?","a":"mammary"},{"id":"m1-c1-anat33","ch":1,"section":"Anat","q":"What is the anatomical term for the armpit?","a":"axillary"},{"id":"m1-c1-anat34","ch":1,"section":"Anat","q":"What is the anatomical term for the (upper) arm?","a":"brachial"},{"id":"m1-c1-anat35","ch":1,"section":"Anat","q":"What is the anatomical term for the forearm?","a":"antebrachial"},{"id":"m1-c1-anat36","ch":1,"section":"Anat","q":"What is the anatomical term for the front of the elbow?","a":"antecubital"},{"id":"m1-c1-anat37","ch":1,"section":"Anat","q":"What is the anatomical term for the wrist?","a":"carpal"},{"id":"m1-c1-anat38","ch":1,"section":"Anat","q":"What is the anatomical term for the palm of the hand?","a":"palmar"},{"id":"m1-c1-anat39","ch":1,"section":"Anat","q":"What is the anatomical term for the hand?","a":"manual"},{"id":"m1-c1-anat40","ch":1,"section":"Anat","q":"What is the anatomical term for the fingers or toes?","a":"digital"},{"id":"m1-c1-anat41","ch":1,"section":"Anat","q":"What is the anatomical term for the abdomen?","a":"abdominal"},{"id":"m1-c1-anat42","ch":1,"section":"Anat","q":"What is the anatomical term for the navel?","a":"umbilical"},{"id":"m1-c1-anat43","ch":1,"section":"Anat","q":"What is the anatomical term for the groin?","a":"inguinal"},{"id":"m1-c1-anat44","ch":1,"section":"Anat","q":"What is the anatomical term for the pubic region?","a":"pubic"},{"id":"m1-c1-anat45","ch":1,"section":"Anat","q":"What is the anatomical term for the pelvis?","a":"pelvic"},{"id":"m1-c1-anat46","ch":1,"section":"Anat","q":"What is the anatomical term for the hip?","a":"coxal"},{"id":"m1-c1-anat47","ch":1,"section":"Anat","q":"What is the anatomical term for the thigh?","a":"femoral"},{"id":"m1-c1-anat48","ch":1,"section":"Anat","q":"What is the anatomical term for the kneecap (front of knee)?","a":"patellar"},{"id":"m1-c1-anat49","ch":1,"section":"Anat","q":"What is the anatomical term for the leg / shin (front)?","a":"crural"},{"id":"m1-c1-anat50","ch":1,"section":"Anat","q":"What is the anatomical term for the ankle?","a":"tarsal"},{"id":"m1-c1-anat51","ch":1,"section":"Anat","q":"What is the anatomical term for the foot?","a":"pedal"},{"id":"m1-c1-anat52","ch":1,"section":"Anat","q":"What is the anatomical term for the back of the head?","a":"occipital"},{"id":"m1-c1-anat53","ch":1,"section":"Anat","q":"What is the anatomical term for the shoulder (top)?","a":"acromial"},{"id":"m1-c1-anat54","ch":1,"section":"Anat","q":"What is the anatomical term for the back of the elbow?","a":"olecranal"},{"id":"m1-c1-anat55","ch":1,"section":"Anat","q":"What is the anatomical term for the back?","a":"dorsal"},{"id":"m1-c1-anat56","ch":1,"section":"Anat","q":"What is the anatomical term for the lower back?","a":"lumbar"},{"id":"m1-c1-anat57","ch":1,"section":"Anat","q":"What is the anatomical term for the buttock?","a":"gluteal"},{"id":"m1-c1-anat58","ch":1,"section":"Anat","q":"What is the anatomical term for the back of the knee?","a":"popliteal"},{"id":"m1-c1-anat59","ch":1,"section":"Anat","q":"What is the anatomical term for the calf?","a":"sural"},{"id":"m1-c1-anat60","ch":1,"section":"Anat","q":"What is the anatomical term for the heel?","a":"calcaneal"},{"id":"m1-c1-anat61","ch":1,"section":"Anat","q":"What is the anatomical term for the sole of the foot?","a":"plantar"}]},{"key":"m2","name":"Module 2","sub":"Ch 4-6 OpenStax end-of-chapter questions + all 100 quiz questions","cards":[{"id":"m2-c4-ilq-01","ch":4,"section":"ILQ","q":"View this slideshow (http://openstaxcollege.org/l/stemcells) to learn more about stem cells. How do somatic stem cells differ from embryonic stem cells?","a":"Most somatic stem cells give rise to only a few cell types."},{"id":"m2-c4-ilq-02","ch":4,"section":"ILQ","q":"Watch this video (http://openstaxcollege.org/l/etissues) to find out more about the anatomy of epithelial tissues. Where in the body would one find non-keratinizing stratified squamous epithelium?","a":"The inside of the mouth, esophagus, vaginal canal, and anus."},{"id":"m2-c4-ilq-03","ch":4,"section":"ILQ","q":"Visit this link (http://openstaxcollege.org/l/10quiz) to test your connective tissue knowledge with this 10-question quiz. Can you name the 10 tissue types shown in the histology slides?","a":"Click at the bottom of the quiz for the answers."},{"id":"m2-c4-ilq-04","ch":4,"section":"ILQ","q":"Watch this video (http://openstaxcollege.org/l/musctissue) to learn more about muscle tissue. In looking through a microscope how could you distinguish skeletal muscle tissue from smooth muscle?","a":"Skeletal muscle cells are striated."},{"id":"m2-c4-ilq-05","ch":4,"section":"ILQ","q":"Follow this link (http://openstaxcollege.org/l/nobel) to learn more about nervous tissue. What are the main parts of a nerve cell?","a":"Dendrites, cell body, and the axon."},{"id":"m2-c4-ilq-06","ch":4,"section":"ILQ","q":"Watch this video (http://openstaxcollege.org/l/healinghand) to see a hand heal. Over what period of time do you think these images were taken?","a":"Approximately one month."},{"id":"m2-c4-ilq-07","ch":4,"section":"ILQ","q":"Watch this video (http://openstaxcollege.org/l/tumor) to learn more about tumors. What is a tumor?","a":"A mass of cancer cells that continue to grow and divide."},{"id":"m2-c4-q8","ch":4,"section":"RQ","q":"Which of the following is not a type of tissue?","a":"C. embryonic","opts":["A. muscle","B. nervous","C. embryonic","D. epithelial"]},{"id":"m2-c4-q9","ch":4,"section":"RQ","q":"The process by which a less specialized cell matures into a more specialized cell is called ________.","a":"A. differentiation","opts":["A. differentiation","B. maturation","C. modification","D. specialization"]},{"id":"m2-c4-q10","ch":4,"section":"RQ","q":"Differentiated cells in a developing embryo derive from ________.","a":"B. ectoderm, mesoderm, and endoderm","opts":["A. endothelium, mesothelium, and epithelium","B. ectoderm, mesoderm, and endoderm","C. connective tissue, epithelial tissue, and muscle tissue","D. epidermis, mesoderm, and endothelium"]},{"id":"m2-c4-q11","ch":4,"section":"RQ","q":"Which of the following lines the body cavities exposed to the external environment?","a":"D. mucosa","opts":["A. mesothelium","B. lamina propria","C. mesenteries","D. mucosa"]},{"id":"m2-c4-q12","ch":4,"section":"RQ","q":"In observing epithelial cells under a microscope, the cells are arranged in a single layer and look tall and narrow, and the nucleus is located close to the basal side of the cell. The specimen is what type of epithelial tissue?","a":"A. columnar","opts":["A. columnar","B. stratified","C. squamous","D. transitional"]},{"id":"m2-c4-q13","ch":4,"section":"RQ","q":"Which of the following is the epithelial tissue that lines the interior of blood vessels?","a":"C. simple squamous","opts":["A. columnar","B. pseudostratified","C. simple squamous","D. transitional"]},{"id":"m2-c4-q14","ch":4,"section":"RQ","q":"Which type of epithelial tissue specializes in moving particles across its surface?","a":"B. stratified columnar (official OpenStax Review Q answer key). Study note: for airway lining/lab ID, pseudostratified ciliated columnar is the classic tissue that moves mucus and trapped particles.","opts":["A. transitional","B. stratified columnar","C. pseudostratified ciliated columnar","D. stratified squamous"]},{"id":"m2-c4-q15","ch":4,"section":"RQ","q":"The ________ exocrine gland stores its secretion until the glandular cell ruptures, whereas the ________ gland releases its apical region and reforms.","a":"A. holocrine; apocrine","opts":["A. holocrine; apocrine","B. eccrine; endocrine","C. apocrine; holocrine","D. eccrine; apocrine"]},{"id":"m2-c4-q16","ch":4,"section":"RQ","q":"Connective tissue is made of which three essential components?","a":"B. cells, ground substance, and protein fibers","opts":["A. cells, ground substance, and carbohydrate fibers","B. cells, ground substance, and protein fibers","C. collagen, ground substance, and protein fibers","D. matrix, ground substance, and fluid"]},{"id":"m2-c4-q17","ch":4,"section":"RQ","q":"Under the microscope, a tissue specimen shows cells located in spaces scattered in a transparent background. This is probably ________.","a":"D. hyaline cartilage","opts":["A. loose connective tissue","B. a tendon","C. bone","D. hyaline cartilage"]},{"id":"m2-c4-q18","ch":4,"section":"RQ","q":"Which connective tissue specializes in storage of fat?","a":"B. adipose tissue","opts":["A. tendon","B. adipose tissue","C. reticular tissue","D. dense connective tissue"]},{"id":"m2-c4-q19","ch":4,"section":"RQ","q":"Ligaments connect bones together and withstand a lot of stress. What type of connective tissue should you expect ligaments to contain?","a":"C. dense regular connective tissue","opts":["A. areolar tissue","B. adipose tissue","C. dense regular connective tissue","D. dense irregular connective tissue"]},{"id":"m2-c4-q20","ch":4,"section":"RQ","q":"In adults, new connective tissue cells originate from the ________.","a":"B. mesenchyme","opts":["A. mesoderm","B. mesenchyme","C. ectoderm","D. endoderm"]},{"id":"m2-c4-q21","ch":4,"section":"RQ","q":"In bone, the main cells are ________.","a":"D. osteocytes","opts":["A. fibroblasts","B. chondrocytes","C. lymphocytes","D. osteocytes"]},{"id":"m2-c4-q22","ch":4,"section":"RQ","q":"Striations, cylindrical cells, and multiple nuclei are observed in ________.","a":"A. skeletal muscle only","opts":["A. skeletal muscle only","B. cardiac muscle only","C. smooth muscle only","D. skeletal and cardiac muscles"]},{"id":"m2-c4-q23","ch":4,"section":"RQ","q":"The cells of muscles, myocytes, develop from ________.","a":"A. myoblasts","opts":["A. myoblasts","B. endoderm","C. fibrocytes","D. chondrocytes"]},{"id":"m2-c4-q24","ch":4,"section":"RQ","q":"Skeletal muscle is composed of very hard working cells. Which organelles do you expect to find in abundance in skeletal muscle cell?","a":"D. mitochondria","opts":["A. nuclei","B. striations","C. golgi bodies","D. mitochondria"]},{"id":"m2-c4-q25","ch":4,"section":"RQ","q":"The cells responsible for the transmission of the nerve impulse are ________.","a":"A. neurons","opts":["A. neurons","B. oligodendrocytes","C. astrocytes","D. microglia"]},{"id":"m2-c4-q26","ch":4,"section":"RQ","q":"The nerve impulse travels down a(n) ________, away from the cell body.","a":"B. axon","opts":["A. dendrite","B. axon","C. microglia","D. collagen fiber"]},{"id":"m2-c4-q27","ch":4,"section":"RQ","q":"Which of the following central nervous system cells regulate ions, regulate the uptake and/or breakdown of some neurotransmitters, and contribute to the formation of the blood-brain barrier?","a":"D. astrocytes","opts":["A. microglia","B
