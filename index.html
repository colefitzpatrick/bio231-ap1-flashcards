tion."},{"id":"m2x-c5-014","ch":5,"section":"Ch 5 Core","q":"What is the hypodermis?","a":"Subcutaneous areolar/adipose tissue that anchors skin, cushions, insulates, stores energy; not technically part of skin."},{"id":"m2x-c5-015","ch":5,"section":"Ch 5 Core","q":"What pigments contribute to skin color?","a":"Melanin, carotene, and hemoglobin."},{"id":"m2x-c5-016","ch":5,"section":"Ch 5 Core","q":"How do melanocytes protect skin?","a":"They make melanin in melanosomes and transfer it to keratinocytes, where it forms UV-protective caps over nuclei."},{"id":"m2x-c5-017","ch":5,"section":"Ch 5 Accessories/Functions","q":"What are the key hair structures?","a":"Hair shaft, root, follicle, bulb, matrix, dermal papilla, arrector pili muscle, and sebaceous gland."},{"id":"m2x-c5-018","ch":5,"section":"Ch 5 Accessories/Functions","q":"What does the hair matrix do?","a":"Actively divides to produce hair growth."},{"id":"m2x-c5-019","ch":5,"section":"Ch 5 Accessories/Functions","q":"What does arrector pili do?","a":"Contracts to create goose bumps and helps squeeze sebum from sebaceous glands."},{"id":"m2x-c5-020","ch":5,"section":"Ch 5 Accessories/Functions","q":"What are the main nail structures?","a":"Nail body, free edge, root, bed, matrix, lunula, eponychium/cuticle, hyponychium, lateral nail fold/groove."},{"id":"m2x-c5-021","ch":5,"section":"Ch 5 Accessories/Functions","q":"What do sebaceous glands secrete and how?","a":"Sebum by holocrine secretion; usually into hair follicles; lubricates/waterproofs skin and hair."},{"id":"m2x-c5-022","ch":5,"section":"Ch 5 Accessories/Functions","q":"Eccrine vs apocrine sweat glands?","a":"Eccrine/merocrine: widespread, watery sweat, thermoregulation, opens to skin surface. Apocrine: axilla/groin/areola, opens into follicles, active at puberty, odor after bacteria act."},{"id":"m2x-c5-023","ch":5,"section":"Ch 5 Accessories/Functions","q":"What are ceruminous and mammary glands?","a":"Modified sweat glands: ceruminous make earwax; mammary make milk."},{"id":"m2x-c5-024","ch":5,"section":"Ch 5 Accessories/Functions","q":"What does skin do when body temperature rises?","a":"Dermal vessels dilate and eccrine sweat increases; evaporation cools the body."},{"id":"m2x-c5-025","ch":5,"section":"Ch 5 Accessories/Functions","q":"What does skin do when core temperature drops?","a":"Vasoconstriction reduces heat loss; sweating decreases; arrector pili may contract."},{"id":"m2x-c5-026","ch":5,"section":"Ch 5 Accessories/Functions","q":"How does skin synthesize vitamin D?","a":"UV light converts a skin precursor into vitamin D pathway products; vitamin D supports calcium absorption."},{"id":"m2x-c5-027","ch":5,"section":"Ch 5 Clinical","q":"Compare basal cell carcinoma, squamous cell carcinoma, and melanoma.","a":"Basal cell: most common/least dangerous. Squamous cell: stratum spinosum, can metastasize. Melanoma: melanocytes, deadliest, early metastasis."},{"id":"m2x-c5-028","ch":5,"section":"Ch 5 Clinical","q":"What are the ABCDE melanoma warning signs?","a":"Asymmetry, Border irregularity, Color variation, Diameter over about 6 mm, Evolving/elevated/enlarging lesion."},{"id":"m2x-c5-029","ch":5,"section":"Ch 5 Clinical","q":"Compare first-, second-, and third-degree burns.","a":"First: epidermis only. Second: epidermis plus part of dermis, blisters. Third: full thickness through dermis, may need grafting."},{"id":"m2x-c5-030","ch":5,"section":"Ch 5 Clinical","q":"What is the rule of nines used for?","a":"Estimating percent of body surface burned: head/neck 9, each arm 9, trunk 36, each leg 18, genitalia 1."},{"id":"m2x-c5-031","ch":5,"section":"Ch 5 Clinical","q":"Why are serious burns dangerous?","a":"Fluid/electrolyte loss, infection risk, impaired thermoregulation, and tissue destruction."},{"id":"m2x-c5-032","ch":5,"section":"Ch 5 Clinical","q":"What causes acne?","a":"Sebum plus shed keratin plugs a follicle; bacteria proliferate; inflammation produces pimples/cysts."},{"id":"m2x-c5-033","ch":5,"section":"Ch 5 Clinical","q":"What are calluses/corns and stretch marks?","a":"Calluses/corns are thickened keratinized skin from friction; stretch marks reflect dermal tearing from stretching."},{"id":"m2x-c5-034","ch":5,"section":"Ch 5 Clinical","q":"What is a decubitus ulcer/bed sore?","a":"Skin breakdown from pressure and poor blood supply."},{"id":"m2x-c5-035","ch":5,"section":"Ch 5 Clinical","q":"Albinism vs vitiligo?","a":"Albinism = inherited inability to make melanin; vitiligo = patchy loss of melanocytes/pigmentation."},{"id":"m2x-c5-036","ch":5,"section":"Ch 5 Clinical","q":"Eczema vs psoriasis?","a":"Eczema = inflammatory itchy rash; psoriasis = overactive keratinocyte production causing scaly plaques."},{"id":"m2x-c5-037","ch":5,"section":"Ch 5 Clinical","q":"Why do scars differ from normal skin?","a":"Scar tissue is collagen-rich fibrosis and lacks normal accessory structures like hair follicles/glands."},{"id":"m2x-c5-038","ch":5,"section":"Ch 5 Clinical","q":"What are lines of cleavage?","a":"Collagen fiber orientation in dermis; incisions parallel to them heal with less scarring."},{"id":"m2x-c6-001","ch":6,"section":"Ch 6 Core","q":"What are the major functions of the skeletal system?","a":"Support, protection, movement/leverage, mineral storage, fat storage, and blood-cell formation."},{"id":"m2x-c6-002","ch":6,"section":"Ch 6 Core","q":"What is the skeletal system made of?","a":"Bones and cartilage."},{"id":"m2x-c6-003","ch":6,"section":"Ch 6 Core","q":"What is red marrow for?","a":"Hematopoiesis: making RBCs, WBCs, and platelets."},{"id":"m2x-c6-004","ch":6,"section":"Ch 6 Core","q":"What is yellow marrow for?","a":"Fat storage in the medullary cavity."},{"id":"m2x-c6-005","ch":6,"section":"Ch 6 Core","q":"Classify bones by shape with examples.","a":"Long: femur/humerus. Short: carpals/tarsals. Flat: ribs/sternum/skull. Irregular: vertebrae/facial bones. Sesamoid: patella."},{"id":"m2x-c6-006","ch":6,"section":"Ch 6 Core","q":"What are sutural/Wormian bones?","a":"Small extra bones that can fill gaps between skull bones at sutures."},{"id":"m2x-c6-007","ch":6,"section":"Ch 6 Core","q":"What are the parts of a long bone?","a":"Diaphysis, epiphyses, metaphyses, articular cartilage, periosteum, endosteum, medullary cavity, compact and spongy bone."},{"id":"m2x-c6-008","ch":6,"section":"Ch 6 Core","q":"Diaphysis vs epiphysis vs metaphysis?","a":"Diaphysis = shaft; epiphyses = ends; metaphysis = transition region containing epiphyseal plate/line."},{"id":"m2x-c6-009","ch":6,"section":"Ch 6 Core","q":"Where are red and yellow marrow in a long bone?","a":"Red marrow in spongy bone of epiphyses; yellow marrow in medullary cavity of diaphysis."},{"id":"m2x-c6-010","ch":6,"section":"Ch 6 Core","q":"Periosteum vs endosteum?","a":"Periosteum covers outer bone except articular cartilage; endosteum lines medullary cavity and internal bone surfaces."},{"id":"m2x-c6-011","ch":6,"section":"Ch 6 Core","q":"What is articular cartilage?","a":"Hyaline cartilage covering joint surfaces of epiphyses to reduce friction."},{"id":"m2x-c6-012","ch":6,"section":"Ch 6 Core","q":"What is diploe?","a":"Spongy bone layer between compact bone layers in flat bones of skull/sternum."},{"id":"m2x-c6-013","ch":6,"section":"Ch 6 Bone Tissue","q":"Compact bone vs spongy bone?","a":"Compact bone is dense and organized into osteons; spongy bone is trabecular, lighter, and houses marrow."},{"id":"m2x-c6-014","ch":6,"section":"Ch 6 Bone Tissue","q":"What is an osteon?","a":"The structural unit of compact bone: central canal plus concentric lamellae with lacunae/canaliculi."},{"id":"m2x-c6-015","ch":6,"section":"Ch 6 Bone Tissue","q":"What is inside the central/Haversian canal?","a":"Blood vessels and nerves."},{"id":"m2x-c6-016","ch":6,"section":"Ch 6 Bone Tissue","q":"What do perforating/Volkmann canals do?","a":"Run perpendicular to central canals and connect blood/nerve supply across osteons."},{"id":"m2x-c6-017","ch":6,"section":"Ch 6 Bone Tissue","q":"What are lamellae, lacunae, and canaliculi?","a":"Lamellae = rings/layers of matrix; lacunae = spaces with osteocytes; canaliculi = tiny channels connecting lacunae."},{"id":"m2x-c6-018","ch":6,"section":"Ch 6 Bone Tissue","q":"What are trabeculae?","a":"Bony struts of spongy bone organized along stress lines; no osteons."},{"id":"m2x-c6-019","ch":6,"section":"Ch 6 Bone Tissue","q":"What are the four major bone cell types?","a":"Osteogenic cells, osteoblasts, osteocytes, and osteoclasts."},{"id":"m2x-c6-020","ch":6,"section":"Ch 6 Bone Tissue","q":"Osteogenic cell vs osteoblast?","a":"Osteogenic cells are dividing stem cells; osteoblasts build bone by secreting osteoid."},{"id":"m2x-c6-021","ch":6,"section":"Ch 6 Bone Tissue","q":"Osteoblast vs osteocyte vs osteoclast?","a":"Osteoblast builds bone, osteocyte maintains matrix in lacuna, osteoclast resorbs bone."},{"id":"m2x-c6-022","ch":6,"section":"Ch 6 Bone Tissue","q":"Where do osteoclasts come from?","a":"Monocyte/macrophage lineage; they are large multinucleated cells."},{"id":"m2x-c6-023","ch":6,"section":"Ch 6 Bone Tissue","q":"What are the organic and inorganic parts of bone matrix?","a":"Organic osteoid/collagen gives flexibility/tensile strength; inorganic hydroxyapatite/calcium phosphate gives hardness/compression resistance."},{"id":"m2x-c6-024","ch":6,"section":"Ch 6 Bone Tissue","q":"What mineral accounts for much of bone weight and is most abundant in the body?","a":"Calcium, mostly as calcium phosphate/hydroxyapatite."},{"id":"m2x-c6-025","ch":6,"section":"Ch 6 Bone Tissue","q":"What are major bone-marking categories?","a":"Articulations, projections, depressions, and openings/holes."},{"id":"m2x-c6-026","ch":6,"section":"Ch 6 Growth/Repair","q":"Intramembranous vs endochondral ossification?","a":"Intramembranous: bone directly from mesenchyme (flat skull bones, clavicle). Endochondral: hyaline cartilage model replaced by bone (most bones)."},{"id":"m2x-c6-027","ch":6,"section":"Ch 6 Growth/Repair","q":"What are the core steps of intramembranous ossification?","a":"Mesenchymal ossification center forms, osteoblasts secrete osteoid, trabeculae/spongy bone form, compact bone and periosteum develop."},{"id":"m2x-c6-028","ch":6,"section":"Ch 6 Growth/Repair","q":"What are the core steps of endochondral ossification?","a":"Cartilage model forms, bone collar/calcification starts, primary ossification center in diaphysis, medullary cavity forms, secondary centers in epiphyses, cartilage remains as articular cartilage/epiphyseal plate."},{"id":"m2x-c6-029","ch":6,"section":"Ch 6 Growth/Repair","q":"Where does length growth occur?","a":"At the epiphyseal plate by cartilage proliferation on the epiphyseal side and replacement by bone on the diaphyseal side."},{"id":"m2x-c6-030","ch":6,"section":"Ch 6 Growth/Repair","q":"What are the epiphyseal plate zones from epiphysis to diaphysis?","a":"Reserve cartilage, proliferation, hypertrophy/maturation, calcification, ossification."},{"id":"m2x-c6-031","ch":6,"section":"Ch 6 Growth/Repair","q":"What is the epiphyseal line?","a":"The bony remnant after the growth plate closes."},{"id":"m2x-c6-032","ch":6,"section":"Ch 6 Growth/Repair","q":"How does bone grow in width?","a":"Appositional growth: osteoblasts under periosteum add bone externally while osteoclasts remodel internally."},{"id":"m2x-c6-033","ch":6,"section":"Ch 6 Growth/Repair","q":"What is Wolff's law?","a":"Bone remodels in response to mechanical stress; loaded bone strengthens and disused bone weakens."},{"id":"m2x-c6-034","ch":6,"section":"Ch 6 Growth/Repair","q":"Name common fracture types.","a":"Closed/simple, open/compound, transverse, oblique, spiral, comminuted, impacted, compression, greenstick."},{"id":"m2x-c6-035","ch":6,"section":"Ch 6 Growth/Repair","q":"What are the four stages of fracture repair?","a":"Fracture hematoma, fibrocartilaginous/soft callus, bony/hard callus, remodeling."},{"id":"m2x-c6-036","ch":6,"section":"Ch 6 Growth/Repair","q":"Internal vs external callus?","a":"Internal callus arises from endosteum and fills the break; external callus arises from periosteum and stabilizes outside."},{"id":"m2x-c6-037","ch":6,"section":"Ch 6 Calcium/Clinical","q":"Which nutrients support bone health?","a":"Calcium, phosphate, vitamin D for absorption, vitamin C for collagen, vitamin K and adequate protein."},{"id":"m2x-c6-038","ch":6,"section":"Ch 6 Calcium/Clinical","q":"What does PTH do to blood calcium?","a":"Raises blood calcium by increasing osteoclast activity, kidney calcium reabsorption, and vitamin D activation/gut absorption."},{"id":"m2x-c6-039","ch":6,"section":"Ch 6 Calcium/Clinical","q":"What does calcitonin do to blood calcium?","a":"Lowers blood calcium mainly by inhibiting osteoclast activity."},{"id":"m2x-c6-040","ch":6,"section":"Ch 6 Calcium/Clinical","q":"Why is vitamin D essential for bone?","a":"It increases calcium absorption from the digestive tract."},{"id":"m2x-c6-041","ch":6,"section":"Ch 6 Calcium/Clinical","q":"What can hypocalcemia cause?","a":"Overexcitable nerves/muscles, cramps, tetany."},{"id":"m2x-c6-042","ch":6,"section":"Ch 6 Calcium/Clinical","q":"What can hypercalcemia cause?","a":"Lethargy, weakness, confusion, and reduced neuromuscular excitability."},{"id":"m2x-c6-043","ch":6,"section":"Ch 6 Calcium/Clinical","q":"Osteopenia vs osteoporosis?","a":"Osteopenia = reduced bone mass; osteoporosis = more severe porous, fragile bone with higher fracture risk."},{"id":"m2x-c6-044","ch":6,"section":"Ch 6 Calcium/Clinical","q":"Rickets vs osteomalacia?","a":"Both are poor mineralization from vitamin D/calcium problems; rickets affects children/growth plates, osteomalacia affects adults."},{"id":"m2x-c6-045","ch":6,"section":"Ch 6 Calcium/Clinical","q":"What is Paget's disease of bone?","a":"Disordered remodeling: excessive resorption followed by excessive, weak, disorganized bone formation."},{"id":"m2x-c6-046","ch":6,"section":"Ch 6 Calcium/Clinical","q":"What is osteomyelitis?","a":"Bone infection/inflammation, often bacterial."},{"id":"m2x-c6-047","ch":6,"section":"High-yield traps","q":"Sesamoid vs sutural bones?","a":"Sesamoid bones develop in tendons (patella); sutural/Wormian bones fill gaps between skull bones."},{"id":"m2x-c6-048","ch":6,"section":"High-yield traps","q":"Which bones are classic shape examples?","a":"Carpals = short; rib/sternum = flat; vertebra = irregular; femur/humerus = long; patella = sesamoid."},{"id":"m2x-c6-049","ch":6,"section":"High-yield traps","q":"What is the strongest/longest bone stat from the quiz?","a":"Femur can withstand about 10-15 times body weight without breaking."},{"id":"m2x-c6-050","ch":6,"section":"High-yield traps","q":"Which cells cannot divide in the paired OpenStax RQ?","a":"Osteoblasts and osteocytes are the keyed pair; osteogenic cells are the dividing stem cells."},{"id":"m2x-c6-051","ch":6,"section":"High-yield traps","q":"Which side of the epiphyseal plate grows cartilage?","a":"Epiphyseal side adds cartilage by chondrocyte proliferation; diaphyseal side replaces cartilage with bone."}]},{"key":"m3","name":"Module 3","sub":"Ch 7–9 · Axial · Appendicular · Joints","cards":[{"id":"m3-c7-q7","ch":7,"section":"RQ","q":"Which of the following is part of the axial skeleton?","a":"D. vertebral column","opts":["A. shoulder bones","B. thigh bone","C. foot bones","D. vertebral column"]},{"id":"m3-c7-q8","ch":7,"section":"RQ","q":"Which of the following is a function of the axial skeleton?","a":"C. supports trunk of body","opts":["A. allows for movement of the wrist and hand","B. protects nerves and blood vessels at the elbow","C. supports trunk of body","D. allows for movements of the ankle and foot"]},{"id":"m3-c7-q9","ch":7,"section":"RQ","q":"The axial skeleton ________.","a":"B. forms the vertical axis of the body","opts":["A. consists of 126 bones","B. forms the vertical axis of the body","C. includes all bones of the body trunk and limbs","D. includes only the bones of the lower limbs"]},{"id":"m3-c7-q10","ch":7,"section":"RQ","q":"Which of the following is a bone of the brain case?","a":"A. parietal bone","opts":["A. parietal bone","B. zygomatic bone","C. maxillary bone","D. lacrimal bone"]},{"id":"m3-c7-q11","ch":7,"section":"RQ","q":"The lambdoid suture joins the parietal bone to the ________.","a":"B. occipital bone","opts":["A. frontal bone","B. occipital bone","C. other parietal bone","D. temporal bone"]},{"id":"m3-c7-q12","ch":7,"section":"RQ","q":"The middle cranial fossa ________.","a":"D. has the foramen rotundum, foramen ovale, and foramen spinosum","opts":["A. is bounded anteriorly by the petrous ridge","B. is bounded posteriorly by the lesser wing of the sphenoid bone","C. is divided at the midline by a small area of the ethmoid bone","D. has the foramen rotundum, foramen ovale, and foramen spinosum"]},{"id":"m3-c7-q13","ch":7,"section":"RQ","q":"The paranasal sinuses are ________.","a":"A. air-filled spaces found within the frontal, maxilla, sphenoid, and ethmoid bones only","opts":["A. air-filled spaces found within the frontal, maxilla, sphenoid, and ethmoid bones only","B. air-filled spaces found within all bones of the skull","C. not connected to the nasal cavity","D. divided at the midline by the nasal septum"]},{"id":"m3-c7-q14","ch":7,"section":"RQ","q":"Parts of the sphenoid bone include the ________.","a":"A. sella turcica","opts":["A. sella turcica","B. squamous portion","C. glabella","D. zygomatic process"]},{"id":"m3-c7-q15","ch":7,"section":"RQ","q":"The bony openings of the skull include the ________.","a":"D. hypoglossal canal, which is located in the posterior cranial fossa","opts":["A. carotid canal, which is located in the anterior cranial fossa","B. superior orbital fissure, which is located at the superior margin of the anterior orbit","C. mental foramen, which is located just below the orbit","D. hypoglossal canal, which is located in the posterior cranial fossa"]},{"id":"m3-c7-q16","ch":7,"section":"RQ","q":"The cervical region of the vertebral column consists of ________.","a":"A. seven vertebrae","opts":["A. seven vertebrae","B. 12 vertebrae","C. five vertebrae","D. a single bone derived from the fusion of five vertebrae"]},{"id":"m3-c7-q17","ch":7,"section":"RQ","q":"The primary curvatures of the vertebral column ________.","a":"B. are remnants of the original fetal curvature","opts":["A. include the lumbar curve","B. are remnants of the original fetal curvature","C. include the cervical curve","D. develop after the time of birth"]},{"id":"m3-c7-q18","ch":7,"section":"RQ","q":"A typical vertebra has ________.","a":"C. lamina that spans between the transverse process and spinous process","opts":["A. a vertebral foramen that passes through the body","B. a superior articular process that projects downward to articulate with the superior portion of the next lower vertebra","C. lamina that spans between the transverse process and spinous process","D. a pair of laterally projecting spinous processes"]},{"id":"m3-c7-q19","ch":7,"section":"RQ","q":"A typical lumbar vertebra has ________.","a":"A. a short, rounded spinous process","opts":["A. a short, rounded spinous process","B. a bifid spinous process","C. articulation sites for ribs","D. a transverse foramen"]},{"id":"m3-c7-q20","ch":7,"section":"RQ","q":"Which is found only in the cervical region of the vertebral column?","a":"A. nuchal ligament","opts":["A. nuchal ligament","B. ligamentum flavum","C. supraspinous ligament","D. anterior longitudinal ligament"]},{"id":"m3-c7-q21","ch":7,"section":"RQ","q":"The sternum ________.","a":"B. has the sternal angle located between the manubrium and body","opts":["A. consists of only two parts, the manubrium and xiphoid process","B. has the sternal angle located between the manubrium and body","C. receives direct attachments from the costal cartilages of all 12 pairs of ribs","D. articulates directly with the thoracic vertebrae"]},{"id":"m3-c7-q22","ch":7,"section":"RQ","q":"The sternal angle is the ________.","a":"D. junction between the manubrium and body","opts":["A. junction between the body and xiphoid process","B. site for attachment of the clavicle","C. site for attachment of the floating ribs","D. junction between the manubrium and body"]},{"id":"m3-c7-q23","ch":7,"section":"RQ","q":"The tubercle of a rib ________.","a":"A. is for articulation with the transverse process of a thoracic vertebra","opts":["A. is for articulation with the transverse process of a thoracic vertebra","B. is for articulation with the body of a thoracic vertebra","C. provides for passage of blood vessels and a nerve","D. is the area of greatest rib curvature"]},{"id":"m3-c7-q24","ch":7,"section":"RQ","q":"True ribs are ________.","a":"D. attached via their costal cartilage directly to the sternum","opts":["A. ribs 8–12","B. attached via their costal cartilage to the next higher rib","C. made entirely of bone, and thus do not have a costal cartilage","D. attached via their costal cartilage directly to the sternum"]},{"id":"m3-c7-q25","ch":7,"section":"RQ","q":"Embryonic development of the axial skeleton involves ________.","a":"B. endochondral ossification, which forms the ribs and sternum","opts":["A. intramembranous ossification, which forms the facial bones","B. endochondral ossification, which forms the ribs and sternum","C. the notochord, which produces the cartilage models for the vertebrae","D. the formation of hyaline cartilage models, which give rise to the flat bones of the skull"]},{"id":"m3-c7-q26","ch":7,"section":"RQ","q":"A fontanelle ________.","a":"D. is the area of fibrous connective tissue found at birth between the brain case bones","opts":["A. is the cartilage model for a vertebra that later is converted into bone","B. gives rise to the facial bones and vertebrae","C. is the rod-like structure that runs the length of the early embryo","D. is the area of fibrous connective tissue found at birth between the brain case bones"]},{"id":"m3-c7-q27","ch":7,"section":"CT","q":"Define the two divisions of the skeleton.","a":"The axial skeleton forms the vertical axis of the body and includes the bones of the head, neck, back, and chest of the body. It consists of 80 bones that include the skull, vertebral column, and thoracic cage. The appendicular skeleton consists of 126 bones and includes all bones of the upper and lower limbs."},{"id":"m3-c7-q28","ch":7,"section":"CT","q":"Discuss the functions of the axial skeleton","a":"The axial skeleton supports the head, neck, back, and chest of the body and allows for movements of these body regions. It also gives bony protections for the brain, spinal cord, heart, and lungs; stores fat and minerals; and houses the blood-cell producing tissue."},{"id":"m3-c7-q29","ch":7,"section":"CT","q":"Define and list the bones that form the brain case or support the facial structures.","a":"The brain case is that portion of the skull that surrounds and protects the brain. It is subdivided into the rounded top of the skull, called the calvaria, and the base of the skull. There are eight bones that form the brain case. These are the paired parietal and temporal bones, plus the unpaired frontal, occipital, sphenoid, and ethmoid bones. The facial bones support the facial structures, and form the upper and lower jaws, nasal cavity, nasal septum, and orbit. There are 14 facial bones. These are the paired maxillary, palatine, zygomatic, nasal, lacrimal, and inferior nasal conchae bones, and the unpaired vomer and mandible bones."},{"id":"m3-c7-q30","ch":7,"section":"CT","q":"Identify the major sutures of the skull, their locations, and the bones united by each.","a":"The coronal suture passes across the top of the anterior skull. It unites the frontal bone anteriorly with the right and left parietal bones. The sagittal suture runs at the midline on the top of the skull. It unites the right and left parietal bones with each other. The squamous suture is a curved suture located on the lateral side of the skull. It unites the squamous portion of the temporal bone to the parietal bone. The lambdoid suture is located on the posterior skull and has an inverted V-shape. It unites the occipital bone with the right and left parietal bones."},{"id":"m3-c7-q31","ch":7,"section":"CT","q":"Describe the anterior, middle, and posterior cranial fossae and their boundaries, and give the midline structure that divides each into right and left areas.","a":"The anterior cranial fossa is the shallowest of the three cranial fossae. It extends from the frontal bone anteriorly to the lesser wing of the sphenoid bone posteriorly. It is divided at the midline by the crista galli and cribriform plates of the ethmoid bone. The middle cranial fossa is located in the central skull, and is deeper than the anterior fossa. The middle fossa extends from the lesser wing of the sphenoid bone anteriorly to the petrous ridge posteriorly. It is divided at the midline by the sella turcica. The posterior cranial fossa is the deepest fossa. It extends from the petrous ridge anteriorly to the occipital bone posteriorly. The large foramen magnum is located at the midline of the posterior fossa."},{"id":"m3-c7-q32","ch":7,"section":"CT","q":"Describe the parts of the nasal septum in both the dry and living skull.","a":"There are two bony parts of the nasal septum in the dry skull. The perpendicular plate of the ethmoid bone forms the superior part of the septum. The vomer bone forms the inferior and posterior parts of the septum. In the living skull, the septal cartilage completes the septum by filling in the anterior area between the bony components and extending outward into the nose."},{"id":"m3-c7-q33","ch":7,"section":"CT","q":"Describe the vertebral column and define each region.","a":"The adult vertebral column consists of 24 vertebrae, plus the sacrum and coccyx. The vertebrae are subdivided into cervical, thoracic, and lumbar regions. There are seven cervical vertebrae (C1–C7), 12 thoracic vertebrae (T1–T12), and five lumbar vertebrae (L1–L5). The sacrum is derived from the fusion of five sacral vertebrae and the coccyx is formed by the fusion of four small coccygeal vertebrae."},{"id":"m3-c7-q34","ch":7,"section":"CT","q":"Describe a typical vertebra.","a":"A typical vertebra consists of an anterior body and a posterior vertebral arch. The body serves for weight bearing. The vertebral arch surrounds and protects the spinal cord. The vertebral arch is formed by the pedicles, which are attached to the posterior side of the vertebral body, and the lamina, which come together to form the top of the arch. A pair of transverse processes extends laterally from the vertebral arch, at the junction between each pedicle and lamina. The spinous process extends posteriorly from the top of the arch. A pair of superior articular processes project upward and a pair of inferior articular processes project downward. Together, the notches found in the margins of the pedicles of adjacent vertebrae form an intervertebral foramen."},{"id":"m3-c7-q35","ch":7,"section":"CT","q":"Describe the sacrum.","a":"The sacrum is a single, triangular-shaped bone formed by the fusion of five sacral vertebrae. On the posterior sacrum, the median sacral crest is derived from the fused spinous processes, and the lateral sacral crest results from the fused transverse processes. The sacral canal contains the sacral spinal nerves, which exit via the anterior (ventral) and posterior (dorsal) sacral foramina. The sacral promontory is the anterior lip. The sacrum also forms the posterior portion of the pelvis."},{"id":"m3-c7-q36","ch":7,"section":"CT","q":"Describe the structure and function of an intervertebral disc.","a":"An intervertebral disc fills in the space between adjacent vertebrae, where it provides padding and weight-bearing ability, and allows for movements between the vertebrae. It consists of an outer anulus fibrosus and an inner nucleus pulposus. The anulus fibrosus strongly anchors the adjacent vertebrae to each other, and the high water content of the nucleus pulposus resists compression for weight bearing and can change shape to allow for vertebral column movements."},{"id":"m3-c7-q37","ch":7,"section":"CT","q":"Define the ligaments of the vertebral column.","a":"The anterior longitudinal ligament is attached to the vertebral bodies on the anterior side of the vertebral column. The supraspinous ligament is located on the posterior side, where it interconnects the thoracic and lumbar spinous processes. In the posterior neck, this ligament expands to become the nuchal ligament, which attaches to the cervical spinous processes and the base of the skull. The posterior longitudinal ligament and ligamentum flavum are located inside the vertebral canal. The posterior longitudinal ligament unites the posterior sides of the vertebral bodies. The ligamentum flavum unites the lamina of adjacent vertebrae."},{"id":"m3-c7-q38","ch":7,"section":"CT","q":"Define the parts and functions of the thoracic cage.","a":"The thoracic cage is formed by the 12 pairs of ribs with their costal cartilages and the sternum. The ribs are attached posteriorly to the 12 thoracic vertebrae and most are anchored anteriorly either directly or indirectly to the sternum. The thoracic cage functions to protect the heart and lungs."},{"id":"m3-c7-q39","ch":7,"section":"CT","q":"Describe the parts of the sternum.","a":"The sternum consists of the manubrium, body, and xiphoid process. The manubrium forms the expanded, superior end of the sternum. It has a jugular (suprasternal) notch, a pair of clavicular notches for articulation with the clavicles, and receives the costal cartilage of the first rib. The manubrium is joined to the body of the sternum at the sternal angle, which is also the site for attachment of the second rib costal cartilages. The body receives the costal cartilage attachments for ribs 3–7. The small xiphoid process forms the inferior tip of the sternum."},{"id":"m3-c7-q40","ch":7,"section":"CT","q":"Discuss the parts of a typical rib.","a":"A typical rib is a flattened, curved bone. The head of a rib is attached posteriorly to the costal facets of the thoracic vertebrae. The rib tubercle articulates with the transverse process of a thoracic vertebra. The angle is the area of greatest rib curvature and forms the largest portion of the thoracic cage. The body (shaft) of a rib extends anteriorly and terminates at the attachment to its costal cartilage. The shallow costal groove runs along the inferior margin of a rib and carries blood vessels and a nerve."},{"id":"m3-c7-q41","ch":7,"section":"CT","q":"Define the classes of ribs.","a":"Ribs are classified based on if and how their costal cartilages attach to the sternum. True (vertebrosternal) ribs are ribs 1–7. The costal cartilage for each of these attaches directly to the sternum. False (vertebrochondral) ribs, 8–12, are attached either indirectly or not at all to the sternum. Ribs 8–10 are attached indirectly to the sternum. For these ribs, the costal cartilage of each attaches to the cartilage of the next higher rib. The last false ribs (11–12) are also called floating (vertebral) ribs, because these ribs do not attach to the sternum at all. Instead, the ribs and their small costal cartilages terminate within the muscles of the lateral abdominal wall."},{"id":"m3-c7-q42","ch":7,"section":"CT","q":"Discuss the processes by which the brain-case bones of the skull are formed and grow during skull enlargement.","a":"The brain-case bones that form the top and sides of the skull are produced by intramembranous ossification. In this, mesenchyme from the sclerotome portion of the somites accumulates at the site of the future bone and differentiates into bone-producing cells. These generate areas of bone that are initially separated by wide regions of fibrous connective tissue called fontanelles. After birth, as the bones enlarge, the fontanelles disappear. However, the bones remain separated by the sutures, where bone and skull growth can continue until the adult size is obtained."},{"id":"m3-c7-q43","ch":7,"section":"CT","q":"Discuss the process that gives rise to the base and facial bones of the skull.","a":"The facial bones and base of the skull arise via the process of endochondral ossification. This process begins with the localized accumulation of mesenchyme tissue at the sites of the future bones. The mesenchyme differentiates into hyaline cartilage, which forms a cartilage model of the future bone. The cartilage allows for growth and enlargement of the model. It is gradually converted into bone over time."},{"id":"m3-c7-q44","ch":7,"section":"CT","q":"Discuss the development of the vertebrae, ribs, and sternum.","a":"The vertebrae, ribs, and sternum all develop via the process of endochondral ossification. Mesenchyme tissue from the sclerotome portion of the somites accumulates on either side of the notochord and produces hyaline cartilage models for each vertebra. In the thorax region, a portion of this cartilage model splits off to form the ribs. Similarly, mesenchyme forms cartilage models for the right and left halves of the sternum. The ribs then become attached anteriorly to the developing sternum, and the two halves of sternum fuse together. Ossification of the cartilage model into bone occurs within these structures over time. This process continues until each is converted into bone, except for the sternal ends of the ribs, which remain as the costal cartilages."},{"id":"m3-c8-q10","ch":8,"section":"RQ","q":"Which part of the clavicle articulates with the manubrium?","a":"B. sternal end","opts":["A. shaft","B. sternal end","C. acromial end","D. coracoid process"]},{"id":"m3-c8-q11","ch":8,"section":"RQ","q":"A shoulder separation results from injury to the ________.","a":"C. acromioclavicular joint","opts":["A. glenohumeral joint","B. costoclavicular joint","C. acromioclavicular joint","D. sternoclavicular joint"]},{"id":"m3-c8-q12","ch":8,"section":"RQ","q":"Which feature lies between the spine and superior border of the scapula?","a":"D. supraspinous fossa","opts":["A. suprascapular notch","B. glenoid cavity","C. superior angle","D. supraspinous fossa"]},{"id":"m3-c8-q13","ch":8,"section":"RQ","q":"What structure is an extension of the spine of the scapula?","a":"A. acromion","opts":["A. acromion","B. coracoid process","C. supraglenoid tubercle","D. glenoid cavity"]},{"id":"m3-c8-q14","ch":8,"section":"RQ","q":"Name the short, hook-like bony process of the scapula that projects anteriorly.","a":"C. coracoid process","opts":["A. acromial process","B. clavicle","C. coracoid process","D. glenoid fossa"]},{"id":"m3-c8-q15","ch":8,"section":"RQ","q":"How many bones are there in the upper limbs combined?","a":"D. 60","opts":["A. 20","B. 30","C. 40","D. 60"]},{"id":"m3-c8-q16","ch":8,"section":"RQ","q":"Which bony landmark is located on the lateral side of the proximal humerus?","a":"A. greater tubercle","opts":["A. greater tubercle","B. trochlea","C. lateral epicondyle","D. lesser tubercle"]},{"id":"m3-c8-q17","ch":8,"section":"RQ","q":"Which region of the humerus articulates with the radius as part of the elbow joint?","a":"C. capitulum","opts":["A. trochlea","B. styloid process","C. capitulum","D. olecranon process"]},{"id":"m3-c8-q18","ch":8,"section":"RQ","q":"Which is the lateral-most carpal bone of the proximal row?","a":"D. scaphoid","opts":["A. trapezium","B. hamate","C. pisiform","D. scaphoid"]},{"id":"m3-c8-q19","ch":8,"section":"RQ","q":"The radius bone ________.","a":"B. has a head that articulates with the radial notch of the ulna","opts":["A. is found on the medial side of the forearm","B. has a head that articulates with the radial notch of the ulna","C. does not articulate with any of the carpal bones","D. has the radial tuberosity located near its distal end"]},{"id":"m3-c8-q20","ch":8,"section":"RQ","q":"How many bones fuse in adulthood to form the hip bone?","a":"B. 3","opts":["A. 2","B. 3","C. 4","D. 5"]},{"id":"m3-c8-q21","ch":8,"section":"RQ","q":"Which component forms the superior part of the hip bone?","a":"A. ilium","opts":["A. ilium","B. pubis","C. ischium","D. sacrum"]},{"id":"m3-c8-q22","ch":8,"section":"RQ","q":"Which of the following supports body weight when sitting?","a":"B. ischial tuberosity","opts":["A. iliac crest","B. ischial tuberosity","C. ischiopubic ramus","D. pubic body"]},{"id":"m3-c8-q23","ch":8,"section":"RQ","q":"The ischial spine is found between which of the following structures?","a":"C. lesser sciatic notch and greater sciatic notch","opts":["A. inferior pubic ramus and ischial ramus","B. pectineal line and arcuate line","C. lesser sciatic notch and greater sciatic notch","D. anterior superior iliac spine and posterior superior iliac spine"]},{"id":"m3-c8-q24","ch":8,"section":"RQ","q":"The pelvis ________.","a":"A. has a subpubic angle that is larger in females","opts":["A. has a subpubic angle that is larger in females","B. consists of the two hip bones, but does not include the sacrum or coccyx","C. has an obturator foramen, an opening that is defined in part by the sacrospinous and sacrotuberous ligaments","D. has a space located inferior to the pelvic brim called the greater pelvis"]},{"id":"m3-c8-q25","ch":8,"section":"RQ","q":"Which bony landmark of the femur serves as a site for muscle attachments?","a":"B. lesser trochanter","opts":["A. fovea capitis","B. lesser trochanter","C. head","D. medial condyle"]},{"id":"m3-c8-q26","ch":8,"section":"RQ","q":"What structure contributes to the knee joint?","a":"C. medial condyle of the tibia","opts":["A. lateral malleolus of the fibula","B. tibial tuberosity","C. medial condyle of the tibia","D. lateral epicondyle of the femur"]},{"id":"m3-c8-q27","ch":8,"section":"RQ","q":"Which tarsal bone articulates with the tibia and fibula?","a":"D. talus","opts":["A. calcaneus","B. cuboid","C. navicular","D. talus"]},{"id":"m3-c8-q28","ch":8,"section":"RQ","q":"What is the total number of bones found in the foot and toes?","a":"C. 26","opts":["A. 7","B. 14","C. 26","D. 30"]},{"id":"m3-c8-q29","ch":8,"section":"RQ","q":"The tibia ________.","a":"C. is firmly anchored to the fibula by an interosseous membrane","opts":["A. has an expanded distal end called the lateral malleolus","B. is not a weight-bearing bone","C. is firmly anchored to the fibula by an interosseous membrane","D. can be palpated only at its proximal and distal ends"]},{"id":"m3-c8-q30","ch":8,"section":"RQ","q":"Which event takes place during the seventh week of development?","a":"D. the rotation of the limbs","opts":["A. appearance of the upper and lower limb buds","B. flattening of the distal limb bud into a paddle shape","C. the first appearance of hyaline cartilage models of future bones","D. the rotation of the limbs"]},{"id":"m3-c8-q31","ch":8,"section":"RQ","q":"During endochondral ossification of a long bone, ________.","a":"C. growth of the epiphyseal plate will produce bone lengthening","opts":["A. a primary ossification center will develop within the epiphysis","B. mesenchyme will differentiate directly into bone tissue","C. growth of the epiphyseal plate will produce bone lengthening","D. all epiphyseal plates will disappear before birth"]},{"id":"m3-c8-q32","ch":8,"section":"RQ","q":"The clavicle ________.","a":"A. develops via intramembranous ossification","opts":["A. develops via intramembranous ossification","B. develops via endochondral ossification","C. is the last bone of the body to begin ossification","D. is fully ossified at the time of birth"]},{"id":"m3-c8-q33","ch":8,"section":"CT","q":"Describe the shape and palpable line formed by the clavicle and scapula.","a":"The clavicle extends laterally across the anterior shoulder and can be palpated along its entire length. At its lateral end, the clavicle articulates with the acromion of the scapula, which forms the bony tip of the shoulder. The acromion is continuous with the spine of the scapula, which can be palpated medially and posteriorly along its length. Together, the clavicle, acromion, and spine of the scapula form a V-shaped line that serves as an important area for muscle attachment."},{"id":"m3-c8-q34","ch":8,"section":"CT","q":"Discuss two possible injuries of the pectoral girdle that may occur following a strong blow to the shoulder or a hard fall onto an outstretched hand.","a":"A blow to the shoulder or falling onto an outstretched hand passes strong forces through the scapula to the clavicle and sternum. A hard fall may thus cause a fracture of the clavicle (broken collarbone) or may injure the ligaments of the acromioclavicular joint. In a severe case, the coracoclavicular ligament may also rupture, resulting in complete dislocation of the acromioclavicular joint (a “shoulder separation”)."},{"id":"m3-c8-q35","ch":8,"section":"CT","q":"Your friend runs out of gas and you have to help push his car. Discuss the sequence of bones and joints that convey the forces passing from your hand, through your upper limb and your pectoral girdle, and to your axial skeleton.","a":"As you push against the car, forces will pass from the metacarpal bones of your hand into the carpal bones at the base of your hand. Forces will then pass through the midcarpal and radiocarpal joints into the radius and ulna bones of the forearm. These will pass the force through the elbow joint into the humerus of the arm, and then through the glenohumeral joint into the scapula. The force will travel through the acromioclavicular joint into the clavicle, and then through the sternoclavicular joint into the sternum, which is part of the axial skeleton."},{"id":"m3-c8-q36","ch":8,"section":"CT","q":"Name the bones in the wrist and hand, and describe or sketch out their locations and articulations.","a":"The base of the hand is formed by the eight carpal bones arranged in two rows (distal and proximal) of four bones each. The proximal row contains (from lateral to medial) the scaphoid, lunate, triquetrum, and pisiform bones. The distal row contains (from medial to lateral) the hamate, capitate, trapezoid, and trapezium bones. (Use the mnemonic “So Long To Pinky, Here Comes The Thumb” to remember this sequence). The rows of the proximal and distal carpal bones articulate with each other at the midcarpal joint. The palm of the hand contains the five metacarpal bones, which are numbered 1–5 starting on the thumb side. The proximal ends of the metacarpal bones articulate with the distal row of the carpal bones. The distal ends of the metacarpal bones articulate with the proximal phalanx bones of the thumb and fingers. The thumb (digit 1) has both a proximal and distal phalanx bone. The fingers (digits 2–5) all contain proximal, middle, and distal phalanges."},{"id":"m3-c8-q37","ch":8,"section":"CT","q":"Describe the articulations and ligaments that unite the four bones of the pelvis to each other.","a":"The pelvis is formed by the combination of the right and left hip bones, the sacrum, and the coccyx. The auricular surfaces of each hip bone articulate with the auricular surface of the sacrum to form the sacroiliac joint. This joint is supported on either side by the strong anterior and posterior sacroiliac ligaments. The right and left hip bones converge anteriorly, where the pubic bodies articulate with each other to form the pubic symphysis joint. The sacrum is also attached to the hip bone by the sacrospinous ligament, which spans the sacrum to the ischial spine, and the sacrotuberous ligament, which runs from the sacrum to the ischial tuberosity. The coccyx is attached to the inferior end of the sacrum."},{"id":"m3-c8-q38","ch":8,"section":"CT","q":"Discuss the ways in which the female pelvis is adapted for childbirth.","a":"Compared to the male, the female pelvis is wider to accommodate childbirth. Thus, the female pelvis has greater distances between the anterior superior iliac spines and between the ischial tuberosities. The greater width of the female pelvis results in a larger subpubic angle. This angle, formed by the anterior convergence of the right and left ischiopubic rami, is larger in females (greater than 80 degrees) than in males (less than 70 degrees). The female sacral promontory does not project anteriorly as far as it does in males, which gives the pelvic brim (pelvic inlet) of the female a rounded or oval shape. The lesser pelvic cavity is wider and more shallow in females, and the pelvic outlet is larger than in males. Thus, the greater width of the female pelvis, with its larger pelvic inlet, lesser pelvis, and pelvic outlet, are important for childbirth because the baby must pass through the pelvis during delivery."},{"id":"m3-c8-q39","ch":8,"section":"CT","q":"Define the regions of the lower limb, name the bones found in each region, and describe the bony landmarks that articulate together to form the hip, knee, and ankle joints.","a":"The lower limb is divided into three regions. The thigh is the region located between the hip and knee joints. It contains the femur and the patella. The hip joint is formed by the articulation between the acetabulum of the hip bone and the head of the femur. The leg is the region between the knee and ankle joints, and contains the tibia (medially) and the fibula (laterally). The knee joint is formed by the articulations between the medial and lateral condyles of the femur, and the medial and lateral condyles of the tibia. Also associated with the knee is the patella, which articulates with the patellar surface of the distal femur. The foot is found distal to the ankle and contains 26 bones. The ankle joint is formed by the articulations between the talus bone of the foot and the distal end of the tibia, the medial malleolus of the tibia, and the lateral malleolus of the fibula. The posterior foot contains the seven tarsal bones, which are the talus, calcaneus, navicular, cuboid, and the medial, intermediate, and lateral cuneiform bones. The anterior foot consists of the five metatarsal bones, which are numbered 1–5 starting on the medial side of the foot. The toes contain 14 phalanx bones, with the big toe (toe number 1) having a proximal and a distal phalanx, and the other toes having proximal, middle, and distal phalanges."},{"id":"m3-c8-q40","ch":8,"section":"CT","q":"The talus bone of the foot receives the weight of the body from the tibia. The talus bone then distributes this weight toward the ground in two directions: one-half of the body weight is passed in a posterior direction and one-half of the weight is passed in an anterior direction. Describe the arrangement of the tarsal and metatarsal bones that are involved in both the posterior and anterior distribution of body weight.","a":"The talus bone articulates superiorly with the tibia and fibula at the ankle joint, with body weight passed from the tibia to the talus. Body weight from the talus is transmitted to the ground by both ends of the medial and lateral longitudinal foot arches. Weight is passed posteriorly through both arches to the calcaneus bone, which forms the heel of the foot and is in contact with the ground. On the medial side of the foot, body weight is passed anteriorly from the talus bone to the navicular bone, and then to the medial, intermediate, and lateral cuneiform bones. The cuneiform bones pass the weight anteriorly to the first, second, and third metatarsal bones, whose heads (distal ends) are in contact with the ground. On the lateral side, body weight is passed anteriorly from the talus through the calcaneus, cuboid, and fourth and fifth metatarsal bones. The talus bone thus transmits body weight posteriorly to the calcaneus and anteriorly through the navicular, cuneiform, and cuboid bones, and metatarsals one through five."},{"id":"m3-c8-q41","ch":8,"section":"CT","q":"How can a radiograph of a child’s femur be used to determine the approximate age of that child?","a":"A radiograph (X-ray image) of a child’s femur will show the epiphyseal plates associated with each secondary ossification center. These plates of hyaline cartilage will appear dark in comparison to the white imaging of the ossified bone. Since each epiphyseal plate appears and disappears at a different age, the presence or absence of these plates can be used to give an approximate age for the child. For example, the epiphyseal plate located at the base of the lesser trochanter of the femur appears at age 9–10 years and disappears at puberty (approximately 11 years of age). Thus, a child’s radiograph that shows the presence of the lesser trochanter epiphyseal plate indicates an approximate age of 10 years."},{"id":"m3-c8-q42","ch":8,"section":"CT","q":"How does the development of the clavicle differ from the development of other appendicular skeleton bones?","a":"Unlike other bones of the appendicular skeleton, the clavicle develops by the process of intramembranous ossification. In this process, embryonic mesenchyme accumulates at the site of the future bone and then differentiates directly into bone-producing tissue. Because of this direct and early production of bone, the clavicle is the first bone of the skeleton to begin to ossify. However, the growth and enlargement of the clavicle continues throughout childhood and adolescence, and thus, it is not fully ossified until 25 years of age."},{"id":"m3-c9-q20","ch":9,"section":"RQ","q":"The joint between adjacent vertebrae that includes an invertebral disc is classified as which type of joint?","a":"C. amphiarthrosis","opts":["A. diarthrosis","B. multiaxial","C. amphiarthrosis","D. synarthrosis"]},{"id":"m3-c9-q21","ch":9,"section":"RQ","q":"Which of these joints is classified as a synarthrosis?","a":"B. the manubriosternal joint","opts":["A. the pubic symphysis","B. the manubriosternal joint","C. an invertebral disc","D. the shoulder joint"]},{"id":"m3-c9-q22","ch":9,"section":"RQ","q":"Which of these joints is classified as a biaxial diarthrosis?","a":"A. the metacarpophalangeal joint","opts":["A. the metacarpophalangeal joint","B. the hip joint","C. the elbow joint","D. the pubic symphysis"]},{"id":"m3-c9-q23","ch":9,"section":"RQ","q":"Synovial joints ________.","a":"D. are joints where the bones articulate with each other within a fluid-filled joint cavity","opts":["A. may be functionally classified as a synarthrosis","B. are joints where the bones are connected to each other by hyaline cartilage","C. may be functionally classified as an amphiarthrosis","D. are joints where the bones articulate with each other within a fluid-filled joint cavity"]},{"id":"m3-c9-q24","ch":9,"section":"RQ","q":"Which type of fibrous joint connects the tibia and fibula?","a":"A. syndesmosis","opts":["A. syndesmosis","B. symphysis","C. suture","D. gomphosis"]},{"id":"m3-c9-q25","ch":9,"section":"RQ","q":"An example of a wide fibrous joint is ________.","a":"A. the interosseous membrane of the forearm","opts":["A. the interosseous membrane of the forearm","B. a gomphosis","C. a suture joint","D. a synostosis"]},{"id":"m3-c9-q26","ch":9,"section":"RQ","q":"A gomphosis ________.","a":"D. anchors a tooth to the jaw","opts":["A. is formed by an interosseous membrane","B. connects the tibia and fibula bones of the leg","C. contains a joint cavity","D. anchors a tooth to the jaw"]},{"id":"m3-c9-q27","ch":9,"section":"RQ","q":"A syndesmosis is ________.","a":"C. a fibrous joint that unites parallel bones","opts":["A. a narrow fibrous joint","B. the type of joint that unites bones of the skull","C. a fibrous joint that unites parallel bones","D. the type of joint that anchors the teeth in the jaws"]},{"id":"m3-c9-q28","ch":9,"section":"RQ","q":"A cartilaginous joint ________.","a":"B. is called a symphysis when the bones are united by fibrocartilage","opts":["A. has a joint cavity","B. is called a symphysis when the bones are united by fibrocartilage","C. anchors the teeth to the jaws","D. is formed by a wide sheet of fibrous connective tissue"]},{"id":"m3-c9-q29","ch":9,"section":"RQ","q":"A synchondrosis is ________.","a":"D. found at the first sternocostal joint of the thoracic cage","opts":["A. found at the pubic symphysis","B. where bones are connected together with fibrocartilage","C. a type of fibrous joint","D. found at the first sternocostal joint of the thoracic cage"]},{"id":"m3-c9-q30","ch":9,"section":"RQ","q":"Which of the following are joined by a symphysis?","a":"A. adjacent vertebrae","opts":["A. adjacent vertebrae","B. the first rib and the sternum","C. the end and shaft of a long bone","D. the radius and ulna bones"]},{"id":"m3-c9-q31","ch":9,"section":"RQ","q":"The epiphyseal plate of a growing long bone in a child is classified as a ________.","a":"A. synchondrosis","opts":["A. synchondrosis","B. synostosis","C. symphysis","D. syndesmosis"]},{"id":"m3-c9-q32","ch":9,"section":"RQ","q":"Which type of joint provides the greatest range of motion?","a":"A. ball-and-socket","opts":["A. ball-and-socket","B. hinge","C. condyloid","D. plane"]},{"id":"m3-c9-q33","ch":9,"section":"RQ","q":"Which type of joint allows for only uniaxial movement?","a":"B. hinge joint","opts":["A. saddle joint","B. hinge joint","C. condyloid joint","D. ball-and-socket joint"]},{"id":"m3-c9-q34","ch":9,"section":"RQ","q":"Which of the following is a type of synovial joint?","a":"C. a plane joint","opts":["A. a synostosis","B. a suture","C. a plane joint","D. a synchondrosis"]},{"id":"m3-c9-q35","ch":9,"section":"RQ","q":"A bursa ________.","a":"C. prevents friction between skin and bone, or a muscle tendon and bone","opts":["A. surrounds a tendon at the point where the tendon crosses a joint","B. secretes the lubricating fluid for a synovial joint","C. prevents friction between skin and bone, or a muscle tendon and bone","D. is the strong band of connective tissue that holds bones together at a synovial joint"]},{"id":"m3-c9-q36","ch":9,"section":"RQ","q":"At synovial joints, ________.","a":"D. the joint cavity is filled with a thick, lubricating fluid","opts":["A. the articulating ends of the bones are directly connected by fibrous connective tissue","B. the ends of the bones are enclosed within a space called a subcutaneous bursa","C. intrinsic ligaments are located entirely inside of the articular capsule","D. the joint cavity is filled with a thick, lubricating fluid"]},{"id":"m3-c9-q37","ch":9,"section":"RQ","q":"At a synovial joint, the synovial membrane ________.","a":"D. secretes the lubricating synovial fluid","opts":["A. forms the fibrous connective walls of the joint cavity","B. is the layer of cartilage that covers the articulating surfaces of the bones","C. forms the intracapsular ligaments","D. secretes the lubricating synovial fluid"]},{"id":"m3-c9-q38","ch":9,"section":"RQ","q":"Condyloid joints ________.","a":"B. include the radiocarpal joint","opts":["A. are a type of ball-and-socket joint","B. include the radiocarpal joint","C. are a uniaxial diarthrosis joint","D. are found at the proximal radioulnar joint"]},{"id":"m3-c9-q39","ch":9,"section":"RQ","q":"A meniscus is ________.","a":"A. a fibrocartilage pad that provides padding between bones","opts":["A. a fibrocartilage pad that provides padding between bones","B. a fluid-filled space that prevents friction between a muscle tendon and underlying bone","C. the articular cartilage that covers the ends of a bone at a synovial joint","D. the lubricating fluid within a synovial joint"]},{"id":"m3-c9-q40","ch":9,"section":"RQ","q":"The joints between the articular processes of adjacent vertebrae can contribute to which movement?","a":"A. lateral flexion","opts":["A. lateral flexion","B. circumduction","C. dorsiflexion","D. abduction"]},{"id":"m3-c9-q41","ch":9,"section":"RQ","q":"Which motion moves the bottom of the foot away from the midline of the body?","a":"C. eversion","opts":["A. elevation","B. dorsiflexion","C. eversion","D. plantar flexion"]},{"id":"m3-c9-q42","ch":9,"section":"RQ","q":"Movement of a body region in a circular movement at a condyloid joint is what type of motion?","a":"D. circumduction","opts":["A. rotation","B. elevation","C. abduction","D. circumduction"]},{"id":"m3-c9-q43","ch":9,"section":"RQ","q":"Supination is the motion that moves the ________.","a":"A. hand from the palm backward position to the palm forward position","opts":["A. hand from the palm backward position to the palm forward position","B. foot so that the bottom of the foot faces the midline of the body","C. hand from the palm forward position to the palm backward position","D. scapula in an upward direction"]},{"id":"m3-c9-q44","ch":9,"section":"RQ","q":"Movement at the shoulder joint that moves the upper limb laterally away from the body is called ________.","a":"C. abduction","opts":["A. elevation","B. eversion","C. abduction","D. lateral rotation"]},{"id":"m3-c9-q45","ch":9,"section":"RQ","q":"The primary support for the glenohumeral joint is provided by the ________.","a":"C. rotator cuff muscles","opts":["A. coracohumeral ligament","B. glenoid labrum","C. rotator cuff muscles","D. subacromial bursa"]},{"id":"m3-c9-q46","ch":9,"section":"RQ","q":"The proximal radioulnar joint ________.","a":"A. is supported by the annular ligament","opts":["A. is supported by the annular ligament","B. contains an articular disc that strongly unites the bones","C. is supported by the ulnar collateral ligament","D. is a hinge joint that allows for flexion/extension of the forearm"]},{"id":"m3-c9-q47","ch":9,"section":"RQ","q":"Which statement is true concerning the knee joint?","a":"D. The medial meniscus is attached to the tibial collateral ligament.","opts":["A. The lateral meniscus is an intrinsic ligament located on the lateral side of the knee joint.","B. Hyperextension is resisted by the posterior cruciate ligament.","C. The anterior cruciate ligament supports the knee when it is flexed and weight bearing.","D. The medial meniscus is attached to the tibial collateral ligament."]},{"id":"m3-c9-q48","ch":9,"section":"RQ","q":"The ankle joint ________.","a":"C. is a uniaxial hinge joint","opts":["A. is also called the subtalar joint","B. allows for gliding movements that produce inversion/eversion of the foot","C. is a uniaxial hinge joint","D. is supported by the tibial collateral ligament on the lateral side"]},{"id":"m3-c9-q49","ch":9,"section":"RQ","q":"Which region of the vertebral column has the greatest range of motion for rotation?","a":"D. thoracic","opts":["A. sacral","B. cervical","C. lumbar","D. thoracic"]},{"id":"m3-c9-q50","ch":9,"section":"RQ","q":"Intramembranous ossification ________.","a":"B. produces the bones of the top and sides of the skull","opts":["A. gives rise to the bones of the limbs","B. produces the bones of the top and sides of the skull","C. produces the bones of the face and base of the skull","D. involves the conversion of a hyaline cartilage model into bone"]},{"id":"m3-c9-q51","ch":9,"section":"RQ","q":"Synovial joints ________.","a":"C. develop at an interzone site","opts":["A. are derived from fontanelles","B. are produced by intramembranous ossification","C. develop at an interzone site","D. are produced by endochondral ossification"]},{"id":"m3-c9-q52","ch":9,"section":"RQ","q":"Endochondral ossification is ________.","a":"A. the process that replaces hyaline cartilage with bone tissue","opts":["A. the process that replaces hyaline cartilage with bone tissue","B. the process by which mesenchyme differentiates directly into bone tissue","C. completed before birth","D. the process that gives rise to the joint interzone and future joint cavity"]},{"id":"m3-c9-q53","ch":9,"section":"CT","q":"Define how joints are classified based on function. Describe and give an example for each functional type of joint.","a":"Functional classification of joints is based on the degree of mobility exhibited by the joint. A synarthrosis is an immobile or nearly immobile joint. An example is the manubriosternal joint or the joints between the skull bones surrounding the brain. An amphiarthrosis is a slightly moveable joint, such as the pubic symphysis or an intervertebral cartilaginous joint. A diarthrosis is a freely moveable joint. These are subdivided into three categories. A uniaxial diarthrosis allows movement within a single anatomical plane or axis of motion. The elbow joint is an example. A biaxial diarthrosis, such as the metacarpophalangeal joint, allows for movement along two planes or axes. The hip and shoulder joints are examples of a multiaxial diarthrosis. These allow movements along three planes or axes."},{"id":"m3-c9-q54","ch":9,"section":"CT","q":"Explain the reasons for why joints differ in their degree of mobility.","a":"The functional needs of joints vary and thus joints differ in their degree of mobility. A synarthrosis, which is an immobile joint, serves to strongly connect bones thus protecting internal organs such as the heart or brain. A slightly moveable amphiarthrosis provides for small movements, which in the vertebral column can add together to yield a much larger overall movement. The freedom of movement provided by a diarthrosis can allow for large movements, such as is seen with most joints of the limbs."},{"id":"m3-c9-q55","ch":9,"section":"CT","q":"Distinguish between a narrow and wide fibrous joint and give an example of each.","a":"Narrow fibrous joints are found at a suture, gomphosis, or syndesmosis. A suture is the fibrous joint that joins the bones of the skull to each other (except the mandible). A gomphosis is the fibrous joint that anchors each tooth to its bony socket within the upper or lower jaw. The tooth is connected to the bony jaw by periodontal ligaments. A narrow syndesmosis is found at the distal tibiofibular joint where the bones are united by fibrous connective tissue and ligaments. A syndesmosis can also form a wide fibrous joint where the shafts of two parallel bones are connected by a broad interosseous membrane. The radius and ulna bones of the forearm and the tibia and fibula bones of the leg are united by interosseous membranes."},{"id":"m3-c9-q56","ch":9,"section":"CT","q":"The periodontal ligaments are made of collagen fibers and are responsible for connecting the roots of the teeth to the jaws. Describe how scurvy, a disease that inhibits collagen production, can affect the teeth.","a":"The teeth are anchored into their sockets within the bony jaws by the periodontal ligaments. This is a gomphosis type of fibrous joint. In scurvy, collagen production is inhibited and the periodontal ligaments become weak. This will cause the teeth to become loose or even to fall out."},{"id":"m3-c9-q57","ch":9,"section":"CT","q":"Describe the two types of cartilaginous joints and give examples of each.","a":"Cartilaginous joints are where the adjacent bones are joined by cartilage. At a synchondrosis, the bones are united by hyaline cartilage. The epiphyseal plate of growing long bones and the first sternocostal joint that unites the first rib to the sternum are examples of synchondroses. At a symphysis, the bones are joined by fibrocartilage, which is strong and flexible. Symphysis joints include the intervertebral symphysis between adjacent vertebrae and the pubic symphysis that joins the pubic portions of the right and left hip bones."},{"id":"m3-c9-q58","ch":9,"section":"CT","q":"Both functional and structural classifications can be used to describe an individual joint. Define the first sternocostal joint and the pubic symphysis using both functional and structural characteristics.","a":"The first sternocostal joint is a synchondrosis type of cartilaginous joint in which hyaline cartilage unites the first rib to the manubrium of the sternum. This forms an immobile (synarthrosis) type of joint. The pubic symphysis is a slightly mobile (amphiarthrosis) cartilaginous joint, where the pubic portions of the right and left hip bones are united by fibrocartilage, thus forming a symphysis."},{"id":"m3-c9-q59","ch":9,"section":"CT","q":"Describe the characteristic structures found at all synovial joints.","a":"All synovial joints have a joint cavity filled with synovial fluid that is the site at which the bones of the joint articulate with each other. The articulating surfaces of the bones are covered by articular cartilage, a thin layer of hyaline cartilage. The walls of the joint cavity are formed by the connective tissue of the articular capsule. The synovial membrane lines the interior surface of the joint cavity and secretes the synovial fluid. Synovial joints are directly supported by ligaments, which span between the bones of the joint. These may be located outside of the articular capsule (extrinsic ligaments), incorporated or fused to the wall of the articular capsule (intrinsic ligaments), or found inside of the articular capsule (intracapsular ligaments). Ligaments hold the bones together and also serve to resist or prevent excessive or abnormal movements of the joint."},{"id":"m3-c9-q60","ch":9,"section":"CT","q":"Describe the structures that provide direct and indirect support for a synovial joint.","a":"Direct support for a synovial joint is provided by ligaments that strongly unite the bones of the joint and serve to resist excessive or abnormal movements. Some joints, such as the sternoclavicular joint, have an articular disc that is attached to both bones, where it provides direct support by holding the bones together. Indirect joint support is provided by the muscles and their tendons that act across a joint. Muscles will increase their contractile force to help support the joint by resisting forces acting on it."},{"id":"m3-c9-q61","ch":9,"section":"CT","q":"Briefly define the types of joint movements available at a ball-and-socket joint.","a":"Ball-and-socket joints are multiaxial joints that allow for flexion and extension, abduction and adduction, circumduction, and medial and lateral rotation."},{"id":"m3-c9-q62","ch":9,"section":"CT","q":"Discuss the joints involved and movements required for you to cross your arms together in front of your chest.","a":"To cross your arms, you need to use both your shoulder and elbow joints. At the shoulder, the arm would need to flex and medially rotate. At the elbow, the forearm would need to be flexed."},{"id":"m3-c9-q63","ch":9,"section":"CT","q":"Discuss the structures that contribute to support of the shoulder joint.","a":"The shoulder joint allows for a large range of motion. The primary support for the shoulder joint is provided by the four rotator cuff muscles. These muscles serve as “dynamic ligaments” and thus can modulate their strengths of contraction as needed to hold the head of the humerus in position at the glenoid fossa. Additional but weaker support comes from the coracohumeral ligament, an intrinsic ligament that supports the superior aspect of the shoulder joint, and the glenohumeral ligaments, which are intrinsic ligaments that support the anterior side of the joint."},{"id":"m3-c9-q64","ch":9,"section":"CT","q":"Describe the sequence of injuries that may occur if the extended, weight-bearing knee receives a very strong blow to the lateral side of the knee.","a":"A strong blow to the lateral side of the extended knee will cause the medial side of the knee joint to open, resulting in a sequence of three injuries. First will be damage to the tibial collateral ligament. Since the medial meniscus is attached to the tibial collateral ligament, the meniscus is also injured. The third structure injured would be the anterior cruciate ligament."},{"id":"m3-c9-q65","ch":9,"section":"CT","q":"Describe how synovial joints develop within the embryonic limb.","a":"Mesenchyme gives rise to cartilage models of the future limb bones. An area called the joint interzone located between adjacent cartilage models will become a synovial joint. The cells at the center of the interzone die, thus producing the joint cavity. Additional mesenchyme cells at the periphery of the interzone become the articular capsule."},{"id":"m3-c9-q66","ch":9,"section":"CT","q":"Differentiate between endochondral and intramembranous ossification.","a":"Intramembranous ossification is the process by which mesenchymal cells differentiate directly into bone producing cells. This process produces the bones that form the top and sides of the skull. The remaining skull bones and the bones of the limbs are formed by endochondral ossification. In this, mesenchymal cells differentiate into hyaline cartilage cells that produce a cartilage model of the future bone. The cartilage is then gradually replaced by bone tissue over a period of many years, during which the cartilage of the epiphyseal plate can continue to grow to allow for enlargement or lengthening of the bone."},{"id":"m3-c7-mc1","ch":7,"section":"MC","q":"A membrane that stabilizes the position of the brain is attached to the","a":"A. crista galli.","opts":["A. crista galli.","B. pterygoid processes.","C. styloid process.","D. perpendicular plate.","E. cribriform plate."]},{"id":"m3-c7-mc2","ch":7,"section":"MC","q":"A skull bone that could be described as looking like a bat with wings extended is the","a":"C. sphenoid.","opts":["A. maxilla.","B. crista galli.","C. sphenoid.","D. ethmoid.","E. cribriform."]},{"id":"m3-c7-mc3","ch":7,"section":"MC","q":"An exaggerated lateral curvature is termed","a":"C. scoliosis.","opts":["A. kyphosis.","B. lordosis.","C. scoliosis.","D. gomphosis.","E. mentosis."]},{"id":"m3-c7-mc4","ch":7,"section":"MC","q":"How many bones make up the axial skeleton?","a":"D. 80","opts":["A. 50","B. 60","C. 70","D. 80","E. 90"]},{"id":"m3-c7-mc5","ch":7,"section":"MC","q":"Humans normally have ________ pairs of ribs.","a":"D. 12","opts":["A. 2","B. 6","C. 10","D. 12","E. 24"]},{"id":"m3-c7-mc6","ch":7,"section":"MC","q":"Identify the structure the occipital bone surrounds.","a":"B. foramen magnum","opts":["A. magnum maximus","B. foramen magnum","C. foramen magnus","D. foramina maximus","E. maximus minimus"]},{"id":"m3-c7-mc7","ch":7,"section":"MC","q":"Ligaments that support the hyoid bone are attached to the","a":"A. styloid process.","opts":["A. styloid process.","B. mastoid process.","C. articular tubercle.","D. posterior clinoid process.","E. middle concha."]},{"id":"m3-c7-mc8","ch":7,"section":"MC","q":"Lumbar vertebrae are ________ massive and ________ mobile.","a":"E. most; least","opts":["A. least; most","B. most; most","C. least; least","D. not; excessively","E. most; least"]},{"id":"m3-c7-mc9","ch":7,"section":"MC","q":"The ________ passes through the ________.","a":"D. internal jugular vein; jugular foramen","opts":["A. vagus nerve; foramen magnum","B. optic nerve; foramen ovale","C. vestibulocochlear nerve; external acoustic meatus","D. internal jugular vein; jugular foramen","E. internal carotid artery; jugular foramen"]},{"id":"m3-c7-mc10","ch":7,"section":"MC","q":"The alveolar process of the mandible","a":"B. supports the lower teeth.","opts":["A. supports the upper teeth.","B. supports the lower teeth.","C. anchors the tongue.","D. is part of the temporomandibular joint.","E. articulates with the hyoid bone."]},{"id":"m3-c7-mc11","ch":7,"section":"MC","q":"The bony portion of the nasal septum is formed by the","a":"C. perpendicular plate of the ethmoid and vomer bone.","opts":["A. nasal bones.","B. perpendicular plate of the ethmoid bone.","C. perpendicular plate of the ethmoid and vomer bone.","D. vomer and sphenoid bone.","E. perpendicular plate of the ethmoid and sphenoid bone."]},{"id":"m3-c7-mc12","ch":7,"section":"MC","q":"The calvaria (or skullcap) is formed by the ________ bones.","a":"B. frontal, parietal, and occipital","opts":["A. frontal, temporal, and parietal","B. frontal, parietal, and occipital","C. temporal, parietal, and occipital","D. frontal, temporal, and occipital","E. frontal, temporal, parietal, and occipital"]},{"id":"m3-c7-mc13","ch":7,"section":"MC","q":"The distinguishing feature of a cervical vertebra is the","a":"C. transverse foramen.","opts":["A. costal facet.","B. vertebral arch.","C. transverse foramen.","D. spinous process.","E. pedicle."]},{"id":"m3-c7-mc14","ch":7,"section":"MC","q":"The foramen magnum is found in the ________ bone.","a":"D. occipital","opts":["A. frontal","B. parietal","C. sphenoid","D. occipital","E. temporal"]},{"id":"m3-c7-mc15","ch":7,"section":"MC","q":"The four curves of the adult spinal column are not all present at birth. Which of the following are the secondary curves, those that do not appear until several months later?","a":"A. cervical and lumbar","opts":["A. cervical and lumbar","B. thoracic and lumbar","C. sacral and lumbar","D. thoracic and sacral","E. cervical and sacral"]},{"id":"m3-c7-mc16","ch":7,"section":"MC","q":"The function of the hyoid bone is to","a":"B. anchor the tongue muscles.","opts":["A. support the stomach.","B. anchor the tongue muscles.","C. protect the trachea.","D. attach to ribs.","E. support the mandible."]},{"id":"m3-c7-mc17","ch":7,"section":"MC","q":"The four spinal curves include all but one of the following. Identify the exception.","a":"D. axial","opts":["A. thoracic","B. cervical","C. lumbar","D. axial","E. sacral"]},{"id":"m3-c7-mc18","ch":7,"section":"MC","q":"The hyoid bone","a":"E. All of the answers are correct.","opts":["A. attaches to tongue muscles.","B. is linked to the styloid process by a ligament.","C. is superior to the larynx.","D. does not directly articulate with other bones.","E. All of the answers are correct."]},{"id":"m3-c7-mc19","ch":7,"section":"MC","q":"The hard palate of the roof of the mouth is mostly formed by the","a":"A. palatine process of the maxillae.","opts":["A. palatine process of the maxillae.","B. sphenoid bone.","C. nasal bones.","D. zygomatic process.","E. palatine bones."]},{"id":"m3-c7-mc20","ch":7,"section":"MC","q":"The hyoid bone is suspended by ________ ligaments.","a":"D. stylohyoid","opts":["A. sutural","B. styloid","C. hyoid","D. stylohyoid","E. sternocleidomastoid"]},{"id":"m3-c7-mc21","ch":7,"section":"MC","q":"The largest sinus is within which bone?","a":"E. maxilla","opts":["A. nasal","B. sphenoid","C. ethmoid","D. frontal","E. maxilla"]},{"id":"m3-c7-mc22","ch":7,"section":"MC","q":"The nasal conchae","a":"C. create turbulence in the nasal passageways.","opts":["A. attach muscles that move the eye.","B. contain the nerves for olfaction.","C. create turbulence in the nasal passageways.","D. protect the pituitary gland.","E. attach muscles that move the eyelids."]},{"id":"m3-c7-mc23","ch":7,"section":"MC","q":"The occipital condyles of the skull articulate with the","a":"A. atlas.","opts":["A. atlas.","B. mandible.","C. first thoracic vertebra.","D. occipital bone.","E. axis."]},{"id":"m3-c7-mc24","ch":7,"section":"MC","q":"The primary spinal curves","a":"B. accommodate the thoracic and abdominopelvic viscera.","opts":["A. are also called compensation curves.","B. accommodate the thoracic and abdominopelvic viscera.","C. develop several months after birth.","D. develop several months after birth to accommodate the growing viscera in the thoracic cavity.","E. All of the answers are correct."]},{"id":"m3-c7-mc25","ch":7,"section":"MC","q":"The ribs articulate with the","a":"B. thoracic vertebrae.","opts":["A. cervical vertebrae.","B. thoracic vertebrae.","C. lumbar vertebrae.","D. sacrum.","E. hyoid bone."]},{"id":"m3-c7-mc26","ch":7,"section":"MC","q":"The skull contains ________ bones.","a":"B. 22","opts":["A. 32","B. 22","C. 42","D. 12","E. 27"]},{"id":"m3-c7-mc27","ch":7,"section":"MC","q":"The smallest facial bones are the","a":"B. lacrimal bones.","opts":["A. ethmoid bones.","B. lacrimal bones.","C. lacerum bones.","D. nasal bones.","E. zygomatic bones."]},{"id":"m3-c7-mc28","ch":7,"section":"MC","q":"The sternum contains","a":"E. All of the answers are correct.","opts":["A. the manubrium.","B. the jugular notch.","C. the body.","D. the xiphoid process.","E. All of the answers are correct."]},{"id":"m3-c7-mc29","ch":7,"section":"MC","q":"The true ribs are","a":"E. ribs 1-7 and are called verterbrosternal ribs.","opts":["A. ribs 1-7.","B. called vertebrosternal ribs.","C. ribs 8-12.","D. called vertebrochondral ribs.","E. ribs 1-7 and are called verterbrosternal ribs."]},{"id":"m3-c7-mc30","ch":7,"section":"MC","q":"The vertebral column contains ________ lumbar vertebrae.","a":"B. 5","opts":["A. 4","B. 5","C. 7","D. 12","E. 31"]},{"id":"m3-c7-mc31","ch":7,"section":"MC","q":"The vertebral column contains ________ thoracic vertebrae.","a":"D. 12","opts":["A. 4","B. 5","C. 7","D. 12","E. 31"]},{"id":"m3-c7-mc32","ch":7,"section":"MC","q":"Which bone(s) include(s) a manubrium?","a":"C. sternum","opts":["A. scapula","B. clavicle","C. sternum","D. cervical vertebrae #1 and #2","E. all of the vertebrae"]},{"id":"m3-c7-mc33","ch":7,"section":"MC","q":"What organ is located in the lacrimal fossa?","a":"C. tear gland","opts":["A. the pituitary gland","B. the inner ear","C. tear gland","D. the lacrimal ramus","E. the frontal sinus"]},{"id":"m3-c7-mc34","ch":7,"section":"MC","q":"Which of the following articulate in the mandibular fossa?","a":"A. condylar process","opts":["A. condylar process","B. mastoid process","C. acromion process","D. coronoid process","E. zygomatic process"]},{"id":"m3-c7-mc35","ch":7,"section":"MC","q":"The widest intervertebral discs are found in the ________ region.","a":"C. lumbar","opts":["A. cervical","B. thoracic","C. lumbar","D. sacral","E. coccygeal"]},{"id":"m3-c8-mc1","ch":8,"section":"MC","q":"A male has a ________ pelvic outlet when compared to the woman's pelvic outlet.","a":"C. smaller","opts":["A. larger","B. longer","C. smaller","D. wider","E. deeper"]},{"id":"m3-c8-mc2","ch":8,"section":"MC","q":"Another name for the first toe is","a":"A. hallux.","opts":["A. hallux.","B. pollex.","C. hyoid.","D. lateral cuneiform.","E. phalanx."]},{"id":"m3-c8-mc3","ch":8,"section":"MC","q":"Compared to the hand, the foot","a":"D. contains arches that help distribute body weight.","opts":["A. has more phalanges.","B. has fewer metatarsals than the hand has metacarpals.","C. has more tarsal bones than the hand has carpal bones.","D. contains arches that help distribute body weight.","E. has the same number of tarsal bones as the hand has carpal bones."]},{"id":"m3-c8-mc4","ch":8,"section":"MC","q":"Compared to the male pelvis, the female pelvis","a":"C. has a greater angle inferior to the pubic symphysis.","opts":["A. is larger.","B. is heavier.","C. has a greater angle inferior to the pubic symphysis.","D. has a thicker ischial tuberosity.","E. has deep acetabula."]},{"id":"m3-c8-mc5","ch":8,"section":"MC","q":"Each coxal bone consists of the following three fused bones:","a":"B. ilium, ischium, and pubis","opts":["A. ulna, radius, and humerus","B. ilium, ischium, and pubis","C. femur, tibia, and fibula","D. hamate, capitate, and trapezium","E. femur, patella, and tibia"]},{"id":"m3-c8-mc6","ch":8,"section":"MC","q":"In the anatomical position, the ulna is located ________ to the radius.","a":"C. medial","opts":["A. distal","B. proximal","C. medial","D. superior","E. lateral"]},{"id":"m3-c8-mc7","ch":8,"section":"MC","q":"The Achilles tendon attaches to which anatomical structure?","a":"B. calcaneus","opts":["A. cuboid bone","B. calcaneus","C. talus","D. lesser trochanter","E. patella."]},{"id":"m3-c8-mc8","ch":8,"section":"MC","q":"The ________ of the radius helps stabilize the wrist joint.","a":"C. styloid process","opts":["A. olecranon process","B. coronoid process","C. styloid process","D. radial tuberosity","E. capitulum"]},{"id":"m3-c8-mc9","ch":8,"section":"MC","q":"The bones that form the fingers are the","a":"E. phalanges.","opts":["A. carpals.","B. tarsals.","C. metacarpals.","D. metatarsals.","E. phalanges."]},{"id":"m3-c8-mc10","ch":8,"section":"MC","q":"The clavicle articulates with the","a":"E. acromial process and the manubrium.","opts":["A. coracoid process and the humerus.","B
