"id":"s2x-c20-31","ch":20,"section":"Arteries","q":"What is the diameter of elastic arteries?","a":"Up to 2.5 cm."},{"id":"s2x-c20-32","ch":20,"section":"Arteries","q":"Where is elastin found in elastic arteries?","a":"In all three tunics."},{"id":"s2x-c20-33","ch":20,"section":"Arteries","q":"How do elastic arteries respond to the cardiac cycle?","a":"They stretch during ventricular systole and rebound during ventricular diastole."},{"id":"s2x-c20-34","ch":20,"section":"Arteries","q":"Are elastic arteries involved in systemic vasoconstriction?","a":"No."},{"id":"s2x-c20-35","ch":20,"section":"Arteries","q":"What are muscular arteries also called, and what is their function?","a":"Also called distribution arteries; they transport blood to organs and tissues."},{"id":"s2x-c20-36","ch":20,"section":"Arteries","q":"What is the diameter range of muscular arteries?","a":"From 10 mm down to 0.3 mm."},{"id":"s2x-c20-37","ch":20,"section":"Arteries","q":"How does the tunica media of muscular arteries compare to that of elastic arteries?","a":"Muscular arteries have more smooth muscle and less elastin in the tunica media."},{"id":"s2x-c20-38","ch":20,"section":"Arteries","q":"Are muscular arteries involved in systemic vasoconstriction?","a":"Yes, via sympathetic stimulation."},{"id":"s2x-c20-39","ch":20,"section":"Arteries","q":"What are arterioles also called, and what do they connect?","a":"Also called resistance vessels; they connect the blood supply to the capillary beds."},{"id":"s2x-c20-40","ch":20,"section":"Arteries","q":"What is the diameter range of arterioles?","a":"From 300 µm down to 10 µm."},{"id":"s2x-c20-41","ch":20,"section":"Arteries","q":"Describe the tunics of arterioles.","a":"All three tunics are thin with few elastic fibers."},{"id":"s2x-c20-42","ch":20,"section":"Arteries","q":"How are arterioles involved in vasoconstriction?","a":"In local vasoconstriction via endocrine or sympathetic stimulation."},{"id":"s2x-c20-43","ch":20,"section":"Arteries","q":"What is vasoconstriction?","a":"Narrowing of a vessel's lumen due to contraction of smooth muscle in the wall (in arteries, from sympathetic stimulation)."},{"id":"s2x-c20-44","ch":20,"section":"Arteries","q":"What is vasodilation?","a":"Widening of a vessel's lumen due to relaxation of the smooth muscle in the wall."},{"id":"s2x-c20-45","ch":20,"section":"Arteries","q":"What are pressure points?","a":"Locations where a muscular artery runs near the body surface over a bone, allowing a pulse to be felt and pressure to be applied to control bleeding."},{"id":"s2x-c20-46","ch":20,"section":"Arterial problems","q":"What is an aneurysm?","a":"A bulge or ballooning in a weakened arterial wall that can rupture."},{"id":"s2x-c20-47","ch":20,"section":"Arterial problems","q":"What is arteriosclerosis?","a":"A general hardening and thickening (loss of elasticity) of arterial walls."},{"id":"s2x-c20-48","ch":20,"section":"Arterial problems","q":"What is focal calcification?","a":"Localized deposition of calcium in an arterial wall, a form of arteriosclerosis that stiffens the vessel."},{"id":"s2x-c20-49","ch":20,"section":"Arterial problems","q":"What is atherosclerosis?","a":"A form of arteriosclerosis in which lipid (plaque) deposits build up in the arterial wall, narrowing the lumen."},{"id":"s2x-c20-50","ch":20,"section":"Arterial problems","q":"What is a CVA?","a":"A cerebrovascular accident (stroke) — interruption of blood flow to the brain, often from arterial disease such as atherosclerosis."},{"id":"s2x-c20-51","ch":20,"section":"Capillaries","q":"What are capillaries designed to do?","a":"Allow diffusion to and from the tissues."},{"id":"s2x-c20-52","ch":20,"section":"Capillaries","q":"Which tunic(s) make up a capillary wall?","a":"Only the tunica intima (endothelium plus basal lamina)."},{"id":"s2x-c20-53","ch":20,"section":"Capillaries","q":"What is the diameter of a capillary?","a":"About 8 µm."},{"id":"s2x-c20-54","ch":20,"section":"Capillaries","q":"What are the three types of capillaries?","a":"Continuous capillaries, fenestrated capillaries, and sinusoids."},{"id":"s2x-c20-55","ch":20,"section":"Capillaries","q":"What are continuous capillaries and their structure?","a":"The most common type; a complete endothelium joined by tight junctions, allowing normal diffusion to all tissues except epithelium and cartilage."},{"id":"s2x-c20-56","ch":20,"section":"Capillaries","q":"What are fenestrated capillaries and what do they allow?","a":"Capillaries with pores (fenestrations) spanning the endothelium, allowing high-volume fluid or large-solute transfer."},{"id":"s2x-c20-57","ch":20,"section":"Capillaries","q":"Where are fenestrated capillaries found?","a":"Choroid plexus, endocrine organs, intestine, and kidney."},{"id":"s2x-c20-58","ch":20,"section":"Capillaries","q":"What are sinusoids and what do they allow?","a":"Capillaries with gaps between endothelial cells, allowing exchange of cells or large proteins."},{"id":"s2x-c20-59","ch":20,"section":"Capillaries","q":"Where are sinusoids found?","a":"Liver, bone marrow, and lymphoid tissues."},{"id":"s2x-c20-60","ch":20,"section":"Capillaries","q":"How are capillaries organized, and where do capillary beds sit?","a":"Into capillary beds located between an arteriole and a venule."},{"id":"s2x-c20-61","ch":20,"section":"Capillaries","q":"What is a precapillary sphincter?","a":"A ring of smooth muscle at the entrance to a capillary that controls blood flow into the capillary bed."},{"id":"s2x-c20-62","ch":20,"section":"Capillaries","q":"What is vasomotion?","a":"The cyclic opening and closing of precapillary sphincters that intermittently controls blood flow through a capillary bed."},{"id":"s2x-c20-63","ch":20,"section":"Veins","q":"What are veins designed to do, and what additional role can they serve?","a":"They return blood to the heart and can serve as a blood reservoir; they have thin walls but large lumens."},{"id":"s2x-c20-64","ch":20,"section":"Veins","q":"Describe the tunica media of veins.","a":"A thin tunica media with little smooth muscle or elastin."},{"id":"s2x-c20-65","ch":20,"section":"Veins","q":"What does the tunica externa of veins contain?","a":"Elastin and smooth muscle."},{"id":"s2x-c20-66","ch":20,"section":"Veins","q":"What structure does the tunica intima of veins contain, and what is its purpose?","a":"Valves, which prevent backflow of blood."},{"id":"s2x-c20-67","ch":20,"section":"Veins","q":"What are the three sizes of veins?","a":"Venules, medium veins, and large veins."},{"id":"s2x-c20-68","ch":20,"section":"Veins","q":"What is the function of a venule?","a":"To collect blood from the capillary beds."},{"id":"s2x-c20-69","ch":20,"section":"Veins","q":"What is the average diameter of a venule, and its range?","a":"Average about 20 µm, with a range of 8 µm to 1.5 mm."},{"id":"s2x-c20-70","ch":20,"section":"Veins","q":"What do the smallest venules lack?","a":"A tunica media."},{"id":"s2x-c20-71","ch":20,"section":"Veins","q":"What is the diameter range of a medium vein?","a":"2–9 mm."},{"id":"s2x-c20-72","ch":20,"section":"Veins","q":"What is the diameter of a large vein?","a":"Up to 3 cm."},{"id":"s2x-c20-73","ch":20,"section":"Veins","q":"What are venous valves and why are they important?","a":"Flaps of tunica intima that prevent backflow of blood, helping return blood to the heart against gravity."},{"id":"s2x-c20-74","ch":20,"section":"Venous problems","q":"What are varicose veins?","a":"Enlarged, twisted superficial veins resulting from failed venous valves and pooling of blood."},{"id":"s2x-c20-75","ch":20,"section":"Venous problems","q":"What are hemorrhoids?","a":"Varicose (swollen) veins in the anal/rectal region."},{"id":"s2x-c20-76","ch":20,"section":"Anastomoses","q":"What are anastomoses and their function?","a":"Bypass routes between vessels that provide alternate pathways for blood flow."},{"id":"s2x-c20-77","ch":20,"section":"Anastomoses","q":"In which organs are anastomoses NOT present?","a":"The retina, kidney, and spleen."},{"id":"s2x-c20-78","ch":20,"section":"Anastomoses","q":"Are anastomoses more common in arteries or veins?","a":"More common in veins."},{"id":"s2x-c20-79","ch":20,"section":"Circulation","q":"What is blood flow?","a":"The volume of blood moving through a vessel, organ, or the whole circulation per unit time."},{"id":"s2x-c20-80","ch":20,"section":"Circulation","q":"What is blood pressure?","a":"The force blood exerts against the vessel walls, which drives blood flow through the circulation."},{"id":"s2x-c20-81","ch":20,"section":"Circulation","q":"What is resistance in the context of circulation?","a":"The opposition to blood flow, largely determined by vessel diameter."},{"id":"s2x-c20-82","ch":20,"section":"Circulation","q":"How do vasoconstriction and vasodilation affect resistance and flow?","a":"Vasoconstriction increases resistance and decreases flow; vasodilation decreases resistance and increases flow."},{"id":"s2x-c20-83","ch":20,"section":"Systemic blood pressure","q":"What is systolic pressure?","a":"The peak arterial pressure during ventricular systole (ventricular contraction)."},{"id":"s2x-c20-84","ch":20,"section":"Systemic blood pressure","q":"What is diastolic pressure?","a":"The lowest arterial pressure during ventricular diastole (ventricular relaxation)."},{"id":"s2x-c20-85","ch":20,"section":"Systemic blood pressure","q":"What is hypertension?","a":"Chronically elevated systemic blood pressure (high blood pressure)."},{"id":"s2x-c20-86","ch":20,"section":"Capillary exchange","q":"What is filtration in capillary exchange?","a":"The movement of fluid out of the capillary into the interstitial space, driven by blood hydrostatic pressure."},{"id":"s2x-c20-87","ch":20,"section":"Capillary exchange","q":"What is blood hydrostatic pressure and its role in capillary exchange?","a":"The pressure blood exerts against the capillary wall; it drives filtration, pushing fluid out of the capillary."},{"id":"s2x-c20-88","ch":20,"section":"Capillary exchange","q":"What is diffusion in capillary exchange?","a":"The movement of solutes (e.g., O2, CO2, nutrients) across the capillary wall down their concentration gradients."},{"id":"s2x-c20-89","ch":20,"section":"Capillary exchange","q":"What is edema?","a":"Accumulation of excess fluid in the interstitial space, for example when filtration exceeds reabsorption."},{"id":"s2x-c20-90","ch":20,"section":"Autoregulation","q":"What is autoregulation, and at what structure does it act?","a":"Local control of blood flow through a single capillary bed via action at a precapillary sphincter."},{"id":"s2x-c20-91","ch":20,"section":"Autoregulation","q":"What is the overall effect of local vasodilators?","a":"They increase blood flow by relaxing precapillary sphincters/smooth muscle."},{"id":"s2x-c20-92","ch":20,"section":"Autoregulation","q":"How do CO2 and O2 levels act as local vasodilators?","a":"Increased CO2 or decreased O2 promotes local vasodilation."},{"id":"s2x-c20-93","ch":20,"section":"Autoregulation","q":"How does lactic acid act in local regulation?","a":"It acts as a local vasodilator, increasing blood flow."},{"id":"s2x-c20-94","ch":20,"section":"Autoregulation","q":"How do K+ and H+ act as local vasodilators?","a":"Increased K+ or increased H+ promotes local vasodilation."},{"id":"s2x-c20-95","ch":20,"section":"Autoregulation","q":"Which inflammation-related substances act as local vasodilators?","a":"Histamine and nitric oxide (NO)."},{"id":"s2x-c20-96","ch":20,"section":"Autoregulation","q":"How does temperature act as a local vasodilator?","a":"Elevated (increased) temperature promotes local vasodilation."},{"id":"s2x-c20-97","ch":20,"section":"Autoregulation","q":"What is the overall effect of local vasoconstrictors?","a":"They decrease blood flow."},{"id":"s2x-c20-98","ch":20,"section":"Autoregulation","q":"What are the three local vasoconstrictors?","a":"Prostaglandins, thromboxanes, and endothelins."},{"id":"s2x-c20-99","ch":20,"section":"Neural regulation","q":"Where are the cardiovascular centers located?","a":"In the medulla oblongata."},{"id":"s2x-c20-100","ch":20,"section":"Neural regulation","q":"What does the cardioacceleratory center do and via which division?","a":"It increases cardiac output (CO) via the sympathetic division."},{"id":"s2x-c20-101","ch":20,"section":"Neural regulation","q":"What does the cardioinhibitory center do and via which division?","a":"It decreases cardiac output (CO) via the parasympathetic division."},{"id":"s2x-c20-102","ch":20,"section":"Neural regulation","q":"What division controls the vasomotor centers, and what neurotransmitter do they use?","a":"The sympathetic division; they release norepinephrine (NE)."},{"id":"s2x-c20-103","ch":20,"section":"Neural regulation","q":"What effect does norepinephrine (NE) from the vasomotor centers produce?","a":"Vasoconstriction."},{"id":"s2x-c20-104","ch":20,"section":"Neural regulation","q":"What do baroreceptor reflexes monitor and what do they trigger?","a":"They monitor blood pressure and trigger the cardiovascular centers to adjust it."},{"id":"s2x-c20-105","ch":20,"section":"Neural regulation","q":"What do chemoreceptor reflexes monitor and what do they trigger?","a":"They monitor blood and CSF CO2, O2, and pH, and trigger the respiratory and cardiac centers."},{"id":"s2x-c20-106","ch":20,"section":"Hormonal regulation","q":"Where is ADH released from, and what triggers its release?","a":"From the pituitary gland, in response to low blood volume."},{"id":"s2x-c20-107","ch":20,"section":"Hormonal regulation","q":"What does antidiuretic hormone (ADH) cause?","a":"Vasoconstriction and water conservation (reabsorption) at the kidney."},{"id":"s2x-c20-108","ch":20,"section":"Hormonal regulation","q":"Where is angiotensin II produced and what triggers it?","a":"From the kidney, in response to low blood pressure."},{"id":"s2x-c20-109","ch":20,"section":"Hormonal regulation","q":"What are the main effects of angiotensin II?","a":"Na+ retention and K+ loss at the kidney; stimulates ADH release, thirst, and cardiac output (CO); and stimulates arteriole constriction."},{"id":"s2x-c20-110","ch":20,"section":"Hormonal regulation","q":"Where is erythropoietin (EPO) produced and what triggers it?","a":"From the kidney, in response to low O2."},{"id":"s2x-c20-111","ch":20,"section":"Hormonal regulation","q":"What does erythropoietin (EPO) do?","a":"Stimulates the production and maturation of red blood cells (RBCs)."},{"id":"s2x-c20-112","ch":20,"section":"Hormonal regulation","q":"Where is atrial natriuretic peptide (ANP) produced and what triggers it?","a":"From the atria, in response to stretching of the atrial walls."},{"id":"s2x-c20-113","ch":20,"section":"Hormonal regulation","q":"What are the effects of atrial natriuretic peptide (ANP)?","a":"Increased Na+ and H2O loss at the kidney, reduced thirst, blocks ADH release, and stimulates vasodilation."},{"id":"s2x-c20-114","ch":20,"section":"Hormonal regulation","q":"Compare the vascular effects of ADH/angiotensin II versus ANP.","a":"ADH and angiotensin II raise blood pressure/volume (vasoconstriction, water and Na+ retention, thirst), whereas ANP lowers it (vasodilation, Na+ and water loss, reduced thirst, blocked ADH)."},{"id":"s2x-c20-115","ch":20,"section":"Hemorrhaging","q":"What are the short-term responses to hemorrhaging?","a":"Increased cardiac output (CO), venoconstriction, and release of NE, ADH, and angiotensin II."},{"id":"s2x-c20-116","ch":20,"section":"Hemorrhaging","q":"Why does venoconstriction help in the short-term response to hemorrhage?","a":"It mobilizes blood from the venous reservoir to maintain venous return and blood pressure."},{"id":"s2x-c20-117","ch":20,"section":"Hemorrhaging","q":"What are the long-term responses to hemorrhaging?","a":"Fluid recall, ADH release, increased thirst, and EPO release."},{"id":"s2x-c20-118","ch":20,"section":"Hemorrhaging","q":"What is the role of EPO in the long-term response to hemorrhage?","a":"It stimulates production and maturation of RBCs to replace those lost."},{"id":"s2x-c20-119","ch":20,"section":"Shock","q":"What is circulatory shock?","a":"Circulatory collapse — a state in which blood flow/pressure is inadequate to meet tissue needs."},{"id":"s2x-c20-120","ch":20,"section":"Aging","q":"How does hematocrit change with aging?","a":"Hematocrit decreases."},{"id":"s2x-c20-121","ch":20,"section":"Aging","q":"How does thrombus risk change with aging?","a":"Thrombus (clot) formation increases."},{"id":"s2x-c20-122","ch":20,"section":"Aging","q":"How does valve function change with aging?","a":"Valve function decreases."},{"id":"s2x-c20-123","ch":20,"section":"Aging","q":"How does maximum cardiac output change with aging?","a":"Maximum cardiac output (CO) decreases."},{"id":"s2x-c20-124","ch":20,"section":"Aging","q":"How does arteriosclerosis change with aging?","a":"Arteriosclerosis increases."}]},{"key":"s2m3","name":"Module 3","sub":"Lymphatic/Immune (21) · Respiratory (22) · Digestive (23)","semester":2,"cards":[{"id":"s2-c21-rq5","ch":21,"section":"RQ","q":"Which of the following cells is phagocytic?","opts":["A. plasma cell","B. macrophage","C. B cell","D. NK cell"],"a":"B. macrophage"},{"id":"s2-c21-rq6","ch":21,"section":"RQ","q":"Which structure allows lymph from the lower right limb to enter the bloodstream?","opts":["A. thoracic duct","B. right lymphatic duct","C. right lymphatic trunk","D. left lymphatic trunk"],"a":"A. thoracic duct"},{"id":"s2-c21-rq7","ch":21,"section":"RQ","q":"Which of the following cells is important in the innate immune response?","opts":["A. B cells","B. T cells","C. macrophages","D. plasma cells"],"a":"C. macrophages"},{"id":"s2-c21-rq8","ch":21,"section":"RQ","q":"Which of the following cells would be most active in early, antiviral immune responses the first time one is exposed to pathogen?","opts":["A. macrophage","B. T cell","C. neutrophil","D. natural killer cell"],"a":"D. natural killer cell"},{"id":"s2-c21-rq9","ch":21,"section":"RQ","q":"Which of the lymphoid nodules is most likely to see food antigens first?","opts":["A. tonsils","B. Peyer’s patches","C. bronchus-associated lymphoid tissue","D. mucosa-associated lymphoid tissue"],"a":"A. tonsils"},{"id":"s2-c21-rq10","ch":21,"section":"RQ","q":"Which of the following signs is not characteristic of inflammation?","opts":["A. redness","B. pain","C. cold","D. swelling"],"a":"C. cold"},{"id":"s2-c21-rq11","ch":21,"section":"RQ","q":"Which of the following is not important in the antiviral innate immune response?","opts":["A. interferons","B. natural killer cells","C. complement","D. microphages"],"a":"D. microphages"},{"id":"s2-c21-rq12","ch":21,"section":"RQ","q":"Enhanced phagocytosis of a cell by the binding of a specific protein is called ________. 968     21 • Review Questions Access for free at openstax.org","opts":["A. endocytosis","B. opsonization","C. anaphylaxis","D. complement activation"],"a":"B. opsonization"},{"id":"s2-c21-rq13","ch":21,"section":"RQ","q":"Which of the following leads to the redness of inflammation?","opts":["A. increased vascular permeability","B. anaphylactic shock","C. increased blood flow","D. complement activation"],"a":"C. increased blood flow"},{"id":"s2-c21-rq14","ch":21,"section":"RQ","q":"T cells that secrete cytokines that help antibody responses are called ________.","opts":["A. Th1","B. Th2","C. regulatory T cells","D. thymocytes"],"a":"B. Th2"},{"id":"s2-c21-rq15","ch":21,"section":"RQ","q":"The taking in of antigen and digesting it for later presentation is called ________.","opts":["A. antigen presentation","B. antigen processing","C. endocytosis","D. exocytosis"],"a":"B. antigen processing"},{"id":"s2-c21-rq16","ch":21,"section":"RQ","q":"Why is clonal expansion so important?","opts":["A. to select for specific cells","B. to secrete cytokines","C. to kill target cells","D. to increase the numbers of specific cells"],"a":"D. to increase the numbers of specific cells"},{"id":"s2-c21-rq17","ch":21,"section":"RQ","q":"The elimination of self-reactive thymocytes is called ________.","opts":["A. positive selection.","B. negative selection.","C. tolerance.","D. clonal selection."],"a":"B. negative selection."},{"id":"s2-c21-rq18","ch":21,"section":"RQ","q":"Which type of T cell is most effective against viruses?","opts":["A. Th1","B. Th2","C. cytotoxic T cells","D. regulatory T cells"],"a":"C. cytotoxic T cells"},{"id":"s2-c21-rq19","ch":21,"section":"RQ","q":"Removing functionality from a B cell without killing it is called ________.","opts":["A. clonal selection","B. clonal expansion","C. clonal deletion","D. clonal anergy"],"a":"D. clonal anergy"},{"id":"s2-c21-rq20","ch":21,"section":"RQ","q":"Which class of antibody crosses the placenta in pregnant people?","opts":["A. IgM","B. IgA","C. IgE","D. IgG 21 • Review Questions     969"],"a":"D. IgG 21 • Review Questions     969"},{"id":"s2-c21-rq21","ch":21,"section":"RQ","q":"Which class of antibody has no known function other than as an antigen receptor?","opts":["A. IgM","B. IgA","C. IgE","D. IgD"],"a":"D. IgD"},{"id":"s2-c21-rq22","ch":21,"section":"RQ","q":"When does class switching occur?","opts":["A. primary response","B. secondary response","C. tolerance","D. memory response"],"a":"A. primary response"},{"id":"s2-c21-rq23","ch":21,"section":"RQ","q":"Which class of antibody is found in mucus?","opts":["A. IgM","B. IgA","C. IgE","D. IgD"],"a":"B. IgA"},{"id":"s2-c21-rq24","ch":21,"section":"RQ","q":"Which enzymes in macrophages are important for clearing intracellular bacteria?","opts":["A. metabolic","B. mitochondrial","C. nuclear","D. lysosomal"],"a":"D. lysosomal"},{"id":"s2-c21-rq25","ch":21,"section":"RQ","q":"What type of chronic lung disease is caused by a Mycobacterium?","opts":["A. asthma","B. emphysema","C. tuberculosis","D. leprosy"],"a":"C. tuberculosis"},{"id":"s2-c21-rq26","ch":21,"section":"RQ","q":"Which type of immune response is most directly effective against bacteria?","opts":["A. natural killer cells","B. complement","C. cytotoxic T cells","D. helper T cells"],"a":"B. complement"},{"id":"s2-c21-rq27","ch":21,"section":"RQ","q":"What is the reason that you have to be immunized with a new influenza vaccine each year?","opts":["A. the vaccine is only protective for a year","B. mutation","C. macrophage oxidative metabolism","D. memory response"],"a":"B. mutation"},{"id":"s2-c21-rq28","ch":21,"section":"RQ","q":"Which type of immune response works in concert with cytotoxic T cells against virally infected cells?","opts":["A. natural killer cells","B. complement","C. antibodies","D. memory"],"a":"A. natural killer cells"},{"id":"s2-c21-rq29","ch":21,"section":"RQ","q":"Which type of hypersensitivity involves soluble antigen-antibody complexes?","opts":["A. type I","B. type II","C. type III","D. type IV 970     21 • Review Questions Access for free at openstax.org"],"a":"C. type III"},{"id":"s2-c21-rq30","ch":21,"section":"RQ","q":"What causes the delay in delayed hypersensitivity?","opts":["A. inflammation","B. cytokine release","C. recruitment of immune cells","D. histamine release"],"a":"C. recruitment of immune cells"},{"id":"s2-c21-rq31","ch":21,"section":"RQ","q":"Which of the following is a critical feature of immediate hypersensitivity?","opts":["A. inflammation","B. cytotoxic T cells","C. recruitment of immune cells","D. histamine release"],"a":"D. histamine release"},{"id":"s2-c21-rq32","ch":21,"section":"RQ","q":"Which of the following is an autoimmune disease of the heart?","opts":["A. rheumatoid arthritis","B. lupus","C. rheumatic fever","D. Hashimoto’s thyroiditis"],"a":"C. rheumatic fever"},{"id":"s2-c21-rq33","ch":21,"section":"RQ","q":"What drug is used to counteract the effects of anaphylactic shock?","opts":["A. epinephrine","B. antihistamines","C. antibiotics","D. aspirin"],"a":"A. epinephrine"},{"id":"s2-c21-rq34","ch":21,"section":"RQ","q":"Which of the following terms means “many genes”?","opts":["A. polymorphism","B. polygeny","C. polypeptide","D. multiple alleles"],"a":"B. polygeny"},{"id":"s2-c21-rq35","ch":21,"section":"RQ","q":"Why do we have natural antibodies?","opts":["A. We don’t know why.","B. immunity to environmental bacteria","C. immunity to transplants","D. from clonal selection"],"a":"B. immunity to environmental bacteria"},{"id":"s2-c21-rq36","ch":21,"section":"RQ","q":"Which type of cancer is associated with HIV disease?","opts":["A. Kaposi’s sarcoma","B. melanoma","C. lymphoma","D. renal cell carcinoma"],"a":"A. Kaposi’s sarcoma"},{"id":"s2-c21-rq37","ch":21,"section":"RQ","q":"How does cyclosporine A work?","opts":["A. suppresses antibodies","B. suppresses T cells","C. suppresses macrophages","D. suppresses neutrophils"],"a":"B. suppresses T cells"},{"id":"s2-c21-rq38","ch":21,"section":"RQ","q":"What disease is associated with bone marrow transplants?","opts":["A. diabetes mellitus type I","B. melanoma","C. headache","D. graft-versus-host disease 21 • Review Questions     971"],"a":"D. graft-versus-host disease 21 • Review Questions     971"},{"id":"s2-c21-ct39","ch":21,"section":"CT","q":"Describe the flow of lymph from its origins in interstitial fluid to its emptying into the venous bloodstream.","a":"The lymph enters through lymphatic capillaries, and then into larger lymphatic vessels. The lymph can only go in one direction due to valves in the vessels. The larger lymphatics merge to form trunks that enter into the blood via lymphatic ducts."},{"id":"s2-c21-ct40","ch":21,"section":"CT","q":"Describe the process of inflammation in an area that has been traumatized, but not infected.","a":"The cell debris and damaged cells induce macrophages to begin to clean them up. Macrophages release cytokines that attract neutrophils, followed by more macrophages. Other mediators released by mast cells increase blood flow to the area and also vascular permeability, allowing the recruited cells to get from the blood to the site of infection, where they can phagocytose the dead cells and debris, preparing the site for wound repair."},{"id":"s2-c21-ct41","ch":21,"section":"CT","q":"Describe two early induced responses and what pathogens they affect.","a":"Interferons are produced in virally infected cells and cause them to secrete signals for surrounding cells to make antiviral proteins. C-reactive protein is induced to be made by the liver and will opsonize certain species of bacteria."},{"id":"s2-c21-ct42","ch":21,"section":"CT","q":"Describe the processing and presentation of an intracellular antigen.","a":"The antigen is digested by the proteasome, brought into the endoplasmic reticulum by the TAP transporter system, where it binds to class I MHC molecules. These are taken to the cell surface by transport vesicles."},{"id":"s2-c21-ct43","ch":21,"section":"CT","q":"Describe clonal selection and expansion.","a":"Antigen-specific clones are stimulated as their antigen receptor binds to antigen. They are then activated and proliferate, expanding their numbers. The result is a large number of antigen-specific lymphocytes."},{"id":"s2-c21-ct44","ch":21,"section":"CT","q":"Describe how secondary B cell responses are developed.","a":"B cells activated during a primary response differentiate either into terminally differentiated plasma cells or into memory B cells. These memory B cells are what respond during a secondary or memory antibody response."},{"id":"s2-c21-ct45","ch":21,"section":"CT","q":"Describe the role of IgM in immunity.","a":"IgM is an antigen receptor on naïve B cells. Upon activation, naïve B cells make IgM first. IgM is good at binding complement and thus has good antibacterial effects. IgM is replaced with other classes of antibodies later on in the primary response due to class switching."},{"id":"s2-c21-ct46","ch":21,"section":"CT","q":"Describe how seroconversion works in HIV disease.","a":"Seroconversion is the clearance of virus in the serum due to the increase in specific serum antibody levels. Seroconversion happens in the early stages of HIV disease. Unfortunately, the antibody cannot completely clear the virus from the body and thus it most often progresses to AIDS."},{"id":"s2-c21-ct47","ch":21,"section":"CT","q":"Describe tuberculosis and the innocent bystander effect.","a":"Tuberculosis is caused by bacteria resistant to lysosomal enzymes in alveolar macrophages, resulting in chronic infection. The immune response to these bacteria actually causes most of the lung damage that is characteristic of this life-threatening disease."},{"id":"s2-c21-ct48","ch":21,"section":"CT","q":"Describe anaphylactic shock in someone sensitive to peanuts?","a":"The peanuts cause high levels of mast cell degranulation in the throats of these individuals. The histamine released increases vascular permeability, causing edema and (swelling), making breathing difficult. This must be treated with epinephrine as soon as possible."},{"id":"s2-c21-ct49","ch":21,"section":"CT","q":"Describe rheumatic fever and how tolerance is broken.","a":"Antibody response to the cell walls of β-Streptococcus cross-reacts with the heart muscle. Complement is then activated and the heart is damaged, leading to abnormal function. Tolerance is broken because heart myosin antigens are similar to antigens on the β- Streptococcus bacteria."},{"id":"s2-c21-ct50","ch":21,"section":"CT","q":"Describe how stress affects immune responses.","a":"Stress causes the release of hormones and the activation of nerves that suppress the immune response. Short-term stress has little effect on the health of an already healthy individual, whereas chronic stress does lead to increases in disease in such people. Anatomy &amp; Physiology Unit 5: Energy, Maintenance, and Environmental Exchange"},{"id":"s2-c22-rq4","ch":22,"section":"RQ","q":"Which of the following anatomical structures is not part of the conducting zone?","opts":["A. pharynx","B. nasal cavity","C. alveoli","D. bronchi"],"a":"C. alveoli"},{"id":"s2-c22-rq5","ch":22,"section":"RQ","q":"What is the function of the conchae in the nasal cavity?","opts":["A. increase surface area","B. exchange gases","C. maintain surface tension","D. maintain air pressure"],"a":"A. increase surface area"},{"id":"s2-c22-rq6","ch":22,"section":"RQ","q":"The fauces connects which of the following structures to the oropharynx?","opts":["A. nasopharynx","B. laryngopharynx","C. nasal cavity","D. oral cavity"],"a":"D. oral cavity"},{"id":"s2-c22-rq7","ch":22,"section":"RQ","q":"Which of the following are structural features of the trachea?","opts":["A. C-shaped cartilage","B. smooth muscle fibers","C. cilia","D. all of the above"],"a":"A. C-shaped cartilage"},{"id":"s2-c22-rq8","ch":22,"section":"RQ","q":"Which of the following structures is the most distal (or last) component of the bronchial tree?","opts":["A. alveoli","B. bronchi","C. terminal bronchioles","D. respiratory bronchioles"],"a":"C. terminal bronchioles"},{"id":"s2-c22-rq9","ch":22,"section":"RQ","q":"What is the role of alveolar macrophages?","opts":["A. to secrete pulmonary surfactant","B. to secrete antimicrobial proteins","C. to remove pathogens and debris","D. to facilitate gas exchange"],"a":"C. to remove pathogens and debris"},{"id":"s2-c22-rq10","ch":22,"section":"RQ","q":"Which of the following structures separates the lung into lobes?","opts":["A. mediastinum","B. fissure","C. root","D. pleura"],"a":"B. fissure"},{"id":"s2-c22-rq11","ch":22,"section":"RQ","q":"A section of the lung that receives its own tertiary bronchus is called the ________.","opts":["A. bronchopulmonary segment","B. pulmonary lobule","C. interpulmonary segment","D. respiratory segment"],"a":"A. bronchopulmonary segment"},{"id":"s2-c22-rq12","ch":22,"section":"RQ","q":"The ________ circulation picks up oxygen for cellular use and drops off carbon dioxide for removal from the body.","opts":["A. pulmonary 1018     22 • Review Questions Access for free at openstax.org","B. interlobular","C. respiratory","D. bronchial"],"a":"C. respiratory"},{"id":"s2-c22-rq13","ch":22,"section":"RQ","q":"The pleura that surrounds the lungs consists of two layers, the ________.","opts":["A. visceral and parietal pleurae.","B. mediastinum and parietal pleurae.","C. visceral and mediastinum pleurae.","D. none of the above"],"a":"A. visceral and parietal pleurae."},{"id":"s2-c22-rq14","ch":22,"section":"RQ","q":"Which of the following processes does atmospheric pressure play a role in?","opts":["A. pulmonary ventilation","B. production of pulmonary surfactant","C. resistance","D. surface tension"],"a":"A. pulmonary ventilation"},{"id":"s2-c22-rq15","ch":22,"section":"RQ","q":"A decrease in volume leads to a(n) ________ pressure.","opts":["A. decrease in","B. equalization of","C. increase in","D. zero"],"a":"C. increase in"},{"id":"s2-c22-rq16","ch":22,"section":"RQ","q":"The pressure difference between the intra-alveolar and intrapleural pressures is called ________.","opts":["A. atmospheric pressure","B. pulmonary pressure","C. negative pressure","D. transpulmonary pressure"],"a":"D. transpulmonary pressure"},{"id":"s2-c22-rq17","ch":22,"section":"RQ","q":"Gas flow decreases as ________ increases.","opts":["A. resistance","B. pressure","C. airway diameter","D. friction"],"a":"A. resistance"},{"id":"s2-c22-rq18","ch":22,"section":"RQ","q":"Contraction of the external intercostal muscles causes which of the following to occur?","opts":["A. The diaphragm moves downward.","B. The rib cage is compressed.","C. The thoracic cavity volume decreases.","D. The ribs and sternum move upward."],"a":"D. The ribs and sternum move upward."},{"id":"s2-c22-rq19","ch":22,"section":"RQ","q":"Which of the following prevents the alveoli from collapsing?","opts":["A. residual volume","B. tidal volume","C. expiratory reserve volume","D. inspiratory reserve volume"],"a":"A. residual volume"},{"id":"s2-c22-rq20","ch":22,"section":"RQ","q":"Gas moves from an area of ________ partial pressure to an area of ________ partial pressure.","opts":["A. low; high","B. low; low","C. high; high","D. high; low"],"a":"D. high; low"},{"id":"s2-c22-rq21","ch":22,"section":"RQ","q":"When ventilation is not sufficient, which of the following occurs? 22 • Review Questions     1019","opts":["A. The capillary constricts.","B. The capillary dilates.","C. The partial pressure of oxygen in the affected alveolus increases.","D. The bronchioles dilate."],"a":"A. The capillary constricts."},{"id":"s2-c22-rq22","ch":22,"section":"RQ","q":"Gas exchange that occurs at the level of the tissues is called ________.","opts":["A. external respiration","B. interpulmonary respiration","C. internal respiration","D. pulmonary ventilation"],"a":"C. internal respiration"},{"id":"s2-c22-rq23","ch":22,"section":"RQ","q":"The partial pressure of carbon dioxide is 45 mm Hg in the blood and 40 mm Hg in the alveoli. What happens to the carbon dioxide?","opts":["A. It diffuses into the blood.","B. It diffuses into the alveoli.","C. The gradient is too small for carbon dioxide to diffuse.","D. It decomposes into carbon and oxygen."],"a":"B. It diffuses into the alveoli."},{"id":"s2-c22-rq24","ch":22,"section":"RQ","q":"Oxyhemoglobin forms by a chemical reaction between which of the following?","opts":["A. hemoglobin and carbon dioxide","B. carbonic anhydrase and carbon dioxide","C. hemoglobin and oxygen","D. carbonic anhydrase and oxygen"],"a":"C. hemoglobin and oxygen"},{"id":"s2-c22-rq25","ch":22,"section":"RQ","q":"Which of the following factors play a role in the oxygen–hemoglobin saturation/dissociation curve?","opts":["A. temperature","B. pH","C. BPG","D. all of the above"],"a":"D. all of the above"},{"id":"s2-c22-rq26","ch":22,"section":"RQ","q":"Which of the following occurs during the chloride shift?","opts":["A. Chloride is removed from the erythrocyte.","B. Chloride is exchanged for bicarbonate.","C. Bicarbonate is removed from the erythrocyte.","D. Bicarbonate is removed from the blood."],"a":"B. Chloride is exchanged for bicarbonate."},{"id":"s2-c22-rq27","ch":22,"section":"RQ","q":"A low partial pressure of oxygen promotes hemoglobin binding to carbon dioxide. This is an example of the ________.","opts":["A. Haldane effect","B. Bohr effect","C. Dalton’s law","D. Henry’s law"],"a":"A. Haldane effect"},{"id":"s2-c22-rq28","ch":22,"section":"RQ","q":"Increased ventilation that results in an increase in blood pH is called ________.","opts":["A. hyperventilation","B. hyperpnea","C. acclimatization","D. apnea"],"a":"A. hyperventilation"},{"id":"s2-c22-rq29","ch":22,"section":"RQ","q":"Exercise can trigger symptoms of AMS due to which of the following?","opts":["A. low partial pressure of oxygen","B. low atmospheric pressure","C. abnormal neural signals 1020     22 • Review Questions Access for free at openstax.org","D. small venous reserve of oxygen"],"a":"D. small venous reserve of oxygen"},{"id":"s2-c22-rq30","ch":22,"section":"RQ","q":"Which of the following stimulates the production of erythrocytes?","opts":["A. AMS","B. high blood levels of carbon dioxide","C. low atmospheric pressure","D. erythropoietin"],"a":"D. erythropoietin"},{"id":"s2-c22-rq31","ch":22,"section":"RQ","q":"The olfactory pits form from which of the following?","opts":["A. mesoderm","B. cartilage","C. ectoderm","D. endoderm"],"a":"C. ectoderm"},{"id":"s2-c22-rq32","ch":22,"section":"RQ","q":"A full complement of mature alveoli are present by ________.","opts":["A. early childhood, around 8 years of age","B. birth","C. 37 weeks","D. 16 weeks"],"a":"A. early childhood, around 8 years of age"},{"id":"s2-c22-rq33","ch":22,"section":"RQ","q":"If a baby is born prematurely before type II cells produce sufficient pulmonary surfactant, which of the following might you expect?","opts":["A. difficulty expressing fluid","B. difficulty inflating the lungs","C. difficulty with pulmonary capillary flow","D. no difficulty as type I cells can provide enough surfactant for normal breathing"],"a":"B. difficulty inflating the lungs"},{"id":"s2-c22-rq34","ch":22,"section":"RQ","q":"When do fetal breathing movements begin?","opts":["A. around week 20","B. around week 37","C. around week 16","D. after birth"],"a":"A. around week 20"},{"id":"s2-c22-rq35","ch":22,"section":"RQ","q":"What happens to the fluid that remains in the lungs after birth?","opts":["A. It reduces the surface tension of the alveoli.","B. It is expelled shortly after birth.","C. It is absorbed shortly after birth.","D. It lubricates the pleurae."],"a":"C. It is absorbed shortly after birth."},{"id":"s2-c22-ct36","ch":22,"section":"CT","q":"Describe the three regions of the pharynx and their functions.","a":"The pharynx has three major regions. The first region is the nasopharynx, which is connected to the posterior nasal cavity and functions as an airway. The second region is the oropharynx, which is continuous with the nasopharynx and is connected to the oral cavity at the fauces. The laryngopharynx is connected to the oropharynx and the esophagus and trachea. Both the oropharynx and laryngopharynx are passageways for air and food and drink"},{"id":"s2-c22-ct37","ch":22,"section":"CT","q":"If a person sustains an injury to the epiglottis, what would be the physiological result?","a":"The epiglottis is a region of the larynx that is important during the swallowing of food or drink. As a person swallows, the pharynx moves upward and the epiglottis closes over the trachea, preventing food or drink from entering the trachea. If a person’s epiglottis were injured, this mechanism would be impaired. As a result, the person may have problems with food or drink entering the trachea, and possibly, the lungs. Over time, this may cause infections such as pneumonia to set in."},{"id":"s2-c22-ct38","ch":22,"section":"CT","q":"Compare and contrast the conducting and respiratory zones.","a":"The conducting zone of the respiratory system includes the organs and structures that are not directly involved in gas exchange, but perform other duties such as providing a passageway for air, trapping and removing debris and pathogens, and warming and humidifying incoming air. Such structures include the nasal cavity, pharynx, larynx, trachea, and most of the bronchial tree. The respiratory zone includes all the organs and structures that are directly involved in gas exchange, including the respiratory bronchioles, alveolar ducts, and alveoli."},{"id":"s2-c22-ct39","ch":22,"section":"CT","q":"Compare and contrast the right and left lungs.","a":"The right and left lungs differ in size and shape to accommodate other organs that encroach on the thoracic region. The right lung consists of three lobes and is shorter than the left lung, due to the position of the liver underneath it. The left lung consist of two lobes and is longer and narrower than the right lung. The left lung has a concave region on the mediastinal surface called the cardiac notch that allows space for the heart."},{"id":"s2-c22-ct40","ch":22,"section":"CT","q":"Why are the pleurae not damaged during normal breathing?","a":"There is a cavity, called the pleural cavity, between the parietal and visceral layers of the pleura. Mesothelial cells produce and secrete pleural fluid into the pleural cavity that acts as a lubricant. Therefore, as you breathe, the pleural fluid prevents the two layers of the pleura from rubbing against each other and causing damage due to friction."},{"id":"s2-c22-ct41","ch":22,"section":"CT","q":"Describe what is meant by the term “lung compliance.”","a":"Lung compliance refers to the ability of lung tissue to stretch under pressure, which is determined in part by the surface tension of the alveoli and the ability of the connective tissue to stretch. Lung compliance plays a role in determining how much the lungs can change in volume, which in turn helps to determine pressure and air movement."},{"id":"s2-c22-ct42","ch":22,"section":"CT","q":"Outline the steps involved in quiet breathing.","a":"Quiet breathing occurs at rest and without active thought. During quiet breathing, the diaphragm and external intercostal muscles work at different extents, depending on the situation. For inspiration, the diaphragm contracts, causing the diaphragm to flatten and drop towards the abdominal cavity, helping to expand the thoracic cavity. The external intercostal muscles contract as well, causing the rib cage to expand, and the rib cage and sternum to move outward, also expanding the thoracic cavity. Expansion of the thoracic cavity also causes the lungs to expand, due to the adhesiveness of the pleural fluid. As a result, the pressure within the lungs drops below that of the atmosphere, causing air to rush into the lungs. In contrast, expiration is a passive process. As the diaphragm and intercostal muscles relax, the lungs and thoracic tissues recoil, and the volume of the lungs decreases. This causes the pressure within the lungs to increase above that of the atmosphere, causing air to leave the lungs."},{"id":"s2-c22-ct43","ch":22,"section":"CT","q":"What is respiratory rate and how is it controlled?","a":"Respiratory rate is defined as the number of breaths taken per minute. Respiratory rate is controlled by the respiratory center, located in the medulla oblongata. Conscious thought can alter the normal respiratory rate through control by skeletal muscle, although one cannot consciously stop the rate altogether. A typical resting respiratory rate is about 14 breaths per minute."},{"id":"s2-c22-ct44","ch":22,"section":"CT","q":"Compare and contrast Dalton’s law and Henry’s law.","a":"Both Dalton’s and Henry’s laws describe the behavior of gases. Dalton’s law states that any gas in a mixture of gases exerts force as if it were not in a mixture. Henry’s law states that gas molecules dissolve in a liquid proportional to their partial pressure."},{"id":"s2-c22-ct45","ch":22,"section":"CT","q":"A smoker develops damage to several alveoli that then can no longer function. How does this affect gas exchange?","a":"The damaged alveoli will have insufficient ventilation, causing the partial pressure of oxygen in the alveoli to decrease. As a result, the pulmonary capillaries serving these alveoli will constrict, redirecting blood flow to other alveoli that are receiving sufficient ventilation."},{"id":"s2-c22-ct46","ch":22,"section":"CT","q":"Compare and contrast adult hemoglobin and fetal hemoglobin.","a":"Both adult and fetal hemoglobin transport oxygen via iron molecules. However, fetal hemoglobin has about a 20-fold greater affinity for oxygen than does adult hemoglobin. This is due to a difference in structure; fetal hemoglobin has two subunits that have a slightly different structure than the subunits of adult hemoglobin."},{"id":"s2-c22-ct47","ch":22,"section":"CT","q":"Describe the relationship between the partial pressure of oxygen and the binding of oxygen to hemoglobin.","a":"The relationship between the partial pressure of oxygen and the binding of hemoglobin to oxygen is described by the oxygen–hemoglobin saturation/dissociation curve. As the partial pressure of oxygen increases, the number of oxygen molecules bound by hemoglobin increases, thereby increasing the saturation of hemoglobin."},{"id":"s2-c22-ct48","ch":22,"section":"CT","q":"Describe three ways in which carbon dioxide can be transported.","a":"Carbon dioxide can be transported by three mechanisms: dissolved in plasma, as bicarbonate, or as carbaminohemoglobin. Dissolved in plasma, carbon dioxide molecules simply diffuse into the blood from the tissues. Bicarbonate is created by a chemical reaction that occurs mostly in erythrocytes, joining carbon dioxide and water by carbonic anhydrase, producing carbonic acid, which breaks down into bicarbonate and hydrogen ions. Carbaminohemoglobin is the bound form of hemoglobin and carbon dioxide"},{"id":"s2-c22-ct49","ch":22,"section":"CT","q":"Describe the neural factors involved in increasing ventilation during exercise.","a":"There are three neural factors that play a role in the increased ventilation observed during exercise. Because this increased ventilation occurs at the beginning of exercise, it is unlikely that only blood oxygen and carbon dioxide levels are involved. The first neural factor is the psychological stimulus of making a conscious decision to exercise. The second neural factor is the stimulus of motor neuron activation by the skeletal muscles, which are involved in exercise. The third neural factor is activation of the proprioceptors located in the muscles, joints, and tendons that stimulate activity in the respiratory centers."},{"id":"s2-c22-ct50","ch":22,"section":"CT","q":"What is the major mechanism that results in acclimatization?","a":"A major mechanism involved in acclimatization is the increased production of erythrocytes. A drop in tissue levels of oxygen stimulates the kidneys to produce the hormone erythropoietin, which signals the bone marrow to produce erythrocytes. As a result, individuals exposed to a high altitude for long periods of time have a greater number of circulating erythrocytes than do individuals at lower altitudes."},{"id":"s2-c22-ct51","ch":22,"section":"CT","q":"During what timeframe does a fetus have enough mature structures to breathe on its own if born prematurely? Describe the other structures that develop during this phase.","a":"At about week 28, enough alveolar precursors have matured so that a baby born prematurely at this time can usually breathe on its own. Other structures that develop about this time are pulmonary capillaries, expanding to create a large surface area for gas exchange. Alveolar ducts and alveolar precursors have also developed."},{"id":"s2-c22-ct52","ch":22,"section":"CT","q":"Describe fetal breathing movements and their purpose.","a":"Fetal breathing movements occur due to the contraction of respiratory muscles, causing the fetus to inhale and exhale amniotic fluid. It is thought that these movements are a way to “practice” breathing, which results in toning the muscles in preparation for breathing after birth. In addition, fetal breathing movements may help alveoli to form and mature. Anatomy &amp; Physiology Unit 5: Energy, Maintenance, and Environmental Exchange"},{"id":"s2-c23-rq8","ch":23,"section":"RQ","q":"Which of these organs is not considered an accessory digestive structure?","opts":["A. mouth","B. salivary glands","C. pancreas","D. liver"],"a":"A. mouth"},{"id":"s2-c23-rq9","ch":23,"section":"RQ","q":"Which of the following organs is supported by a layer of adventitia rather than serosa?","opts":["A. esophagus","B. stomach","C. small intestine","D. large intestine"],"a":"A. esophagus"},{"id":"s2-c23-rq10","ch":23,"section":"RQ","q":"Which of the following membranes covers the stomach?","opts":["A. falciform ligament","B. mesocolon","C. parietal peritoneum","D. visceral peritoneum"],"a":"D. visceral peritoneum"},{"id":"s2-c23-rq11","ch":23,"section":"RQ","q":"Which of these processes occurs in the mouth?","opts":["A. ingestion","B. mechanical digestion","C. chemical digestion","D. all of the above"],"a":"D. all of the above"},{"id":"s2-c23-rq12","ch":23,"section":"RQ","q":"Which of these processes occurs throughout most of the alimentary canal?","opts":["A. ingestion","B. propulsion","C. segmentation","D. absorption"],"a":"B. propulsion"},{"id":"s2-c23-rq13","ch":23,"section":"RQ","q":"Which of the following stimuli activates sensors in the walls of digestive organs?","opts":["A. breakdown products of digestion","B. distension","C. pH of chyme","D. all of the above"],"a":"D. all of the above"},{"id":"s2-c23-rq14","ch":23,"section":"RQ","q":"Which of these statements about reflexes in the GI tract is false? 23 • Review Questions     1081","opts":["A. Short reflexes are provoked by nerves near the GI tract.","B. Short reflexes are mediated by the enteric nervous system.","C. Food that distends the stomach initiates long reflexes.","D. Long reflexes can be provoked by stimuli originating outside the GI tract."],"a":"A. Short reflexes are provoked by nerves near the GI tract."},{"id":"s2-c23-rq15","ch":23,"section":"RQ","q":"Which of these ingredients in saliva is responsible for activating salivary amylase?","opts":["A. mucus","B. phosphate ions","C. chloride ions","D. urea"],"a":"C. chloride ions"},{"id":"s2-c23-rq16","ch":23,"section":"RQ","q":"Which of these statements about the pharynx is true?","opts":["A. It extends from the nasal and oral cavities superiorly to the esophagus anteriorly.","B. The oropharynx is continuous superiorly with the nasopharynx.","C. The nasopharynx is involved in digestion.","D. The laryngopharynx is composed partially of cartilage."],"a":"B. The oropharynx is continuous superiorly with the nasopharynx."},{"id":"s2-c23-rq17","ch":23,"section":"RQ","q":"Which structure is located where the esophagus penetrates the diaphragm?","opts":["A. esophageal hiatus","B. cardiac orifice","C. upper esophageal sphincter","D. lower esophageal sphincter"],"a":"A. esophageal hiatus"},{"id":"s2-c23-rq18","ch":23,"section":"RQ","q":"Which phase of deglutition involves contraction of the longitudinal muscle layer of the muscularis?","opts":["A. voluntary phase","B. buccal phase","C. pharyngeal phase","D. esophageal phase"],"a":"D. esophageal phase"},{"id":"s2-c23-rq19","ch":23,"section":"RQ","q":"Which of these cells secrete hormones?","opts":["A. parietal cells","B. mucous neck cells","C. enteroendocrine cells","D. chief cells"],"a":"C. enteroendocrine cells"},{"id":"s2-c23-rq20","ch":23,"section":"RQ","q":"Where does the majority of chemical digestion in the stomach occur?","opts":["A. fundus and body","B. cardia and fundus","C. body and pylorus","D. body"],"a":"A. fundus and body"},{"id":"s2-c23-rq21","ch":23,"section":"RQ","q":"During gastric emptying, chyme is released into the duodenum through the ________.","opts":["A. esophageal hiatus","B. pyloric antrum","C. pyloric canal","D. pyloric sphincter"],"a":"D. pyloric sphincter"},{"id":"s2-c23-rq22","ch":23,"section":"RQ","q":"Parietal cells secrete ________.","opts":["A. gastrin","B. hydrochloric acid","C. pepsin","D. pepsinogen 1082     23 • Review Questions Access for free at openstax.org"],"a":"B. hydrochloric acid"},{"id":"s2-c23-rq23","ch":23,"section":"RQ","q":"In which part of the alimentary canal does most digestion occur?","opts":["A. stomach","B. proximal small intestine","C. distal small intestine","D. ascending colon"],"a":"B. proximal small intestine"},{"id":"s2-c23-rq24","ch":23,"section":"RQ","q":"Which of these is most associated with villi?","opts":["A. haustra","B. lacteals","C. bacterial flora","D. intestinal glands"],"a":"B. lacteals"},{"id":"s2-c23-rq25","ch":23,"section":"RQ","q":"What is the role of the small intestine’s MALT?","opts":["A. secreting mucus","B. buffering acidic chyme","C. activating pepsin","D. preventing bacteria from entering the bloodstream"],"a":"D. preventing bacteria from entering the bloodstream"},{"id":"s2-c23-rq26","ch":23,"section":"RQ","q":"Which part of the large intestine attaches to the appendix?","opts":["A. cecum","B. ascending colon","C. transverse colon","D. descending colon"],"a":"A. cecum"},{"id":"s2-c23-rq27","ch":23,"section":"RQ","q":"Which of these statements about bile is true?","opts":["A. About 500 mL is secreted daily.","B. Its main function is the denaturation of proteins.","C. It is synthesized in the gallbladder.","D. Bile salts are recycled."],"a":"D. Bile salts are recycled."},{"id":"s2-c23-rq28","ch":23,"section":"RQ","q":"Pancreatic juice ________.","opts":["A. deactivates bile.","B. is secreted by pancreatic islet cells.","C. buffers chyme.","D. is released into the cystic duct."],"a":"C. buffers chyme."},{"id":"s2-c23-rq29","ch":23,"section":"RQ","q":"Where does the chemical digestion of starch begin?","opts":["A. mouth","B. esophagus","C. stomach","D. small intestine"],"a":"A. mouth"},{"id":"s2-c23-rq30","ch":23,"section":"RQ","q":"Which of these is involved in the chemical digestion of protein?","opts":["A. pancreatic amylase","B. trypsin","C. sucrase","D. pancreatic nuclease"],"a":"B. trypsin"},{"id":"s2-c23-rq31","ch":23,"section":"RQ","q":"Where are most fat-digesting enzymes produced?","opts":["A. small intestine","B. gallbladder","C. liver","D. pancreas 23 • Review Questions     1083"],"a":"D. pancreas 23 • Review Questions     1083"},{"id":"s2-c23-rq32","ch":23,"section":"RQ","q":"Which of these nutrients is absorbed mainly in the duodenum?","opts":["A. glucose","B. iron","C. sodium","D. water"],"a":"B. iron"},{"id":"s2-c23-ct33","ch":23,"section":"CT","q":"Explain how the enteric nervous system supports the digestive system. What might occur that could result in the autonomic nervous system having a negative impact on digestion?","a":"The enteric nervous system helps regulate alimentary canal motility and the secretion of digestive juices, thus facilitating digestion. If a person becomes overly anxious, sympathetic innervation of the alimentary canal is stimulated, which can result in a slowing of digestive activity."},{"id":"s2-c23-ct34","ch":23,"section":"CT","q":"What layer of the alimentary canal tissue is capable of helping to protect the body against disease, and through what mechanism?","a":"The lamina propria of the mucosa contains lymphoid tissue that makes up the MALT and responds to pathogens encountered in the alimentary canal."},{"id":"s2-c23-ct35","ch":23,"section":"CT","q":"Offer a theory to explain why segmentation occurs and peristalsis slows in the small intestine.","a":"The majority of digestion and absorption occurs in the small intestine. By slowing the transit of chyme, segmentation and a reduced rate of peristalsis allow time for these processes to occur."},{"id":"s2-c23-ct36","ch":23,"section":"CT","q":"It has been several hours since you last ate. Walking past a bakery, you catch a whiff of freshly baked bread. What type of reflex is triggered, and what is the result?","a":"The smell of food initiates long reflexes, which result in the secretion of digestive juices."},{"id":"s2-c23-ct37","ch":23,"section":"CT","q":"The composition of saliva varies from gland to gland. Discuss how saliva produced by the parotid gland differs in action from saliva produced by the sublingual gland.","a":"Parotid gland saliva is watery with little mucus but a lot of amylase, which allows it to mix freely with food during mastication and begin the digestion of carbohydrates. In contrast, sublingual gland saliva has a lot of mucus with the least amount of amylase of all the salivary glands. The high mucus content serves to lubricate the food for swallowing."},{"id":"s2-c23-ct38","ch":23,"section":"CT","q":"During a hockey game, the puck hits a player in the mouth, knocking out all eight of his most anterior teeth. Which teeth did the player lose and how does this loss affect food ingestion?","a":"The incisors. Since these teeth are used for tearing off pieces of food during ingestion, the player will need to ingest foods that have already been cut into bite-sized pieces until the broken teeth are replaced."},{"id":"s2-c23-ct39","ch":23,"section":"CT","q":"What prevents swallowed food from entering the airways?","a":"Usually when food is swallowed, involuntary muscle contractions cause the soft palate to rise and close off the nasopharynx. The larynx also is pulled up, and the epiglottis folds over the glottis. These actions block off the air passages."},{"id":"s2-c23-ct40","ch":23,"section":"CT","q":"Explain the mechanism responsible for gastroesophageal reflux.","a":"If the lower esophageal sphincter does not close completely, the stomach’s acidic contents can back up into the esophagus, a phenomenon known as GERD."},{"id":"s2-c23-ct41","ch":23,"section":"CT","q":"Describe the three processes involved in the esophageal phase of deglutition.","a":"Peristalsis moves the bolus down the esophagus and toward the stomach. Esophageal glands secrete mucus that lubricates the bolus and reduces friction. When the bolus nears the stomach, the lower esophageal sphincter relaxes, allowing the bolus to pass into the stomach."},{"id":"s2-c23-ct42","ch":23,"section":"CT","q":"Explain how the stomach is protected from self-digestion and why this is necessary.","a":"The mucosal barrier protects the stomach from self-digestion. It includes a thick coating of bicarbonate-rich mucus; the mucus is physically protective, and bicarbonate neutralizes gastric acid. Epithelial cells meet at tight junctions, which block gastric juice from penetrating the underlying tissue layers, and stem cells quickly replace sloughed off epithelial mucosal cells."},{"id":"s2-c23-ct43","ch":23,"section":"CT","q":"Describe unique anatomical features that enable the stomach to perform digestive functions.","a":"The stomach has an additional inner oblique smooth muscle layer that helps the muscularis churn and mix food. The epithelium includes gastric glands that secrete gastric fluid. The gastric fluid consists mainly of mucous, HCl, and the enzyme pepsin released as pepsinogen."},{"id":"s2-c23-ct44","ch":23,"section":"CT","q":"Explain how nutrients absorbed in the small intestine pass into the general circulation.","a":"Nutrients from the breakdown of carbohydrates and proteins are absorbed through a capillary bed in the villi of the small intestine. Lipid breakdown products are absorbed into a lacteal in the villi, and transported via the lymphatic system to the bloodstream."},{"id":"s2-c23-ct45","ch":23,"section":"CT","q":"Why is it important that chyme from the stomach is delivered to the small intestine slowly and in small amounts?","a":"If large quantities of chyme were forced into the small intestine, it would result in osmotic water loss from the blood into the intestinal lumen that could cause potentially life-threatening low blood volume and erosion of the duodenum."},{"id":"s2-c23-ct46","ch":23,"section":"CT","q":"Describe three of the differences between the walls of the large and small intestines.","a":"The mucosa of the small intestine includes circular folds, villi, and microvilli. The wall of the large intestine has a thick mucosal layer, and deeper and more abundant mucus-secreting glands that facilitate the smooth passage of feces. There are three features that are unique to the large intestine: teniae coli, haustra, and epiploic appendages."},{"id":"s2-c23-ct47","ch":23,"section":"CT","q":"Why does the pancreas secrete some enzymes in their inactive forms, and where are these enzymes activated?","a":"The pancreas secretes protein-digesting enzymes in their inactive forms. If secreted in their active forms, they would self-digest the pancreas. These enzymes are activated in the duodenum."},{"id":"s2-c23-ct48","ch":23,"section":"CT","q":"Describe the location of hepatocytes in the liver and how this arrangement enhances their function.","a":"The hepatocytes are the main cell type of the liver. They process, store, and release nutrients into the blood. Radiating out from the central vein, they are tightly packed around the hepatic sinusoids, allowing the hepatocytes easy access to the blood flowing through the sinusoids."},{"id":"s2-c23-ct49","ch":23,"section":"CT","q":"Explain the role of bile salts and lecithin in the emulsification of lipids (fats).","a":"Bile salts and lecithin can emulsify large lipid globules because they are amphipathic; they have a nonpolar (hydrophobic) region that attaches to the large fat molecules as well as a polar (hydrophilic) region that interacts with the watery chime in the intestine."},{"id":"s2-c23-ct50","ch":23,"section":"CT","q":"How is vitamin B12 absorbed?","a":"Intrinsic factor secreted in the stomach binds to the large B12 compound, creating a combination that can bind to mucosal receptors in the ileum. Anatomy &amp; Physiology Unit 5: Energy, Maintenance, and Environmental Exchange"}]},{"key":"s2m4","name":"Module 4","sub":"Metabolism (24) · Urinary (25) · Fluid/Electrolyte (26)","semester":2,"cards":[{"id":"s2-c24-rq1","ch":24,"section":"RQ","q":"A monosaccharide is formed from a polysaccharide in what kind of reaction?","opts":["A. oxidation–reduction reaction","B. anabolic reaction","C. catabolic reaction","D. biosynthetic reaction"],"a":"C. catabolic reaction"},{"id":"s2-c24-rq2","ch":24,"section":"RQ","q":"If anabolic reactions exceed catabolic reactions, the result will be ________.","opts":["A. weight loss","B. weight gain","C. metabolic rate change","D. development of disease"],"a":"B. weight gain"},{"id":"s2-c24-rq3","ch":24,"section":"RQ","q":"When NAD becomes NADH, the coenzyme has been ________.","opts":["A. reduced","B. oxidized","C. metabolized","D. hydrolyzed"],"a":"A. reduced"},{"id":"s2-c24-rq4","ch":24,"section":"RQ","q":"Anabolic reactions use energy by ________. 1132     24 • Review Questions Access for free at openstax.org","opts":["A. turning ADP into ATP","B. removing a phosphate group from ATP","C. producing heat","D. breaking down molecules into smaller parts"],"a":"B. removing a phosphate group from ATP"},{"id":"s2-c24-rq5","ch":24,"section":"RQ","q":"Glycolysis results in the production of two ________ molecules from a single molecule of glucose. In the absence of ________, the end product of glycolysis is ________.","opts":["A. acetyl CoA, pyruvate, lactate","B. ATP, carbon, pyruvate","C. pyruvate, oxygen, lactate","D. pyruvate, carbon, acetyl CoA"],"a":"C. pyruvate, oxygen, lactate"},{"id":"s2-c24-rq6","ch":24,"section":"RQ","q":"The Krebs cycle converts ________ through a cycle of reactions. In the process, ATP, ________, and ________ are produced.","opts":["A. acetyl CoA; FAD, NAD","B. acetyl CoA; FADH2; NADH","C. pyruvate; NAD; FADH2","D. pyruvate; oxygen; oxaloacetate"],"a":"B. acetyl CoA; FADH2; NADH"},{"id":"s2-c24-rq7","ch":24,"section":"RQ","q":"Which pathway produces the most ATP molecules?","opts":["A. lactic acid fermentation","B. the Krebs cycle","C. the electron transport chain","D. glycolysis"],"a":"C. the electron transport chain"},{"id":"s2-c24-rq8","ch":24,"section":"RQ","q":"Aerobic cellular respiration results in the production of these two products.","opts":["A. NADH and FADH2","B. ATP and pyruvate","C. ATP and glucose","D. ATP and H2O"],"a":"D. ATP and H2O"},{"id":"s2-c24-rq9","ch":24,"section":"RQ","q":"When NAD+ becomes NADH, the coenzyme has been ________.","opts":["A. reduced","B. oxidized","C. metabolized","D. hydrolyzed"],"a":"A. reduced"},{"id":"s2-c24-rq10","ch":24,"section":"RQ","q":"Lipids in the diet can be ________.","opts":["A. broken down into energy for the body","B. stored as triglycerides for later use","C. converted into acetyl CoA","D. all of the above"],"a":"D. all of the above"},{"id":"s2-c24-rq11","ch":24,"section":"RQ","q":"The gallbladder provides ________ that aid(s) in transport of lipids across the intestinal membrane.","opts":["A. lipases","B. cholesterol","C. proteins","D. bile salts"],"a":"D. bile salts"},{"id":"s2-c24-rq12","ch":24,"section":"RQ","q":"Triglycerides are transported by chylomicrons because ________.","opts":["A. they cannot move easily in the blood stream because they are fat based, while the blood is water based","B. they are too small to move by themselves","C. the chylomicrons contain enzymes they need for anabolism 24 • Review Questions     1133","D. they cannot fit across the intestinal membrane"],"a":"A. they cannot move easily in the blood stream because they are fat based, while the blood is water based"},{"id":"s2-c24-rq13","ch":24,"section":"RQ","q":"Which molecule produces the most ATP?","opts":["A. carbohydrates","B. FADH2","C. triglycerides","D. NADH"],"a":"C. triglycerides"},{"id":"s2-c24-rq14","ch":24,"section":"RQ","q":"Which molecules can enter the Krebs cycle?","opts":["A. chylomicrons","B. acetyl CoA","C. monoglycerides","D. ketone bodies"],"a":"B. acetyl CoA"},{"id":"s2-c24-rq15","ch":24,"section":"RQ","q":"Acetyl CoA can be converted to all of the following except ________.","opts":["A. ketone bodies","B. fatty acids","C. polysaccharides","D. triglycerides"],"a":"C. polysaccharides"},{"id":"s2-c24-rq16","ch":24,"section":"RQ","q":"Digestion of proteins begins in the ________ where ________ and ________ mix with food to break down protein into ________.","opts":["A. stomach; amylase; HCl; amino acids","B. mouth; pepsin; HCl; fatty acids","C. stomach; lipase; HCl; amino acids","D. stomach; pepsin; HCl; amino acids"],"a":"D. stomach; pepsin; HCl; amino acids"},{"id":"s2-c24-rq17","ch":24,"section":"RQ","q":"Amino acids are needed to ________.","opts":["A. build new proteins","B. serve as fat stores","C. supply energy for the cell","D. create red blood cells"],"a":"A. build new proteins"},{"id":"s2-c24-rq18","ch":24,"section":"RQ","q":"If an amino acid is not used to create new proteins, it can be ________.","opts":["A. converted to acetyl CoA","B. converted to glucose or ketones","C. converted to nitrogen","D. stored to be used later"],"a":"B. converted to glucose or ketones"},{"id":"s2-c24-rq19","ch":24,"section":"RQ","q":"During the absorptive state, glucose levels are ________, insulin levels are ________, and glucagon levels ________.","opts":["A. high; low; stay the same","B. low; low; stay the same","C. high; high; are high","D. high; high; are low"],"a":"D. high; high; are low"},{"id":"s2-c24-rq20","ch":24,"section":"RQ","q":"Starvation sets in after 3 to 4 days without food. Which hormones change in response to low glucose levels?","opts":["A. glucagon and insulin","B. ketones and glucagon","C. insulin, glucose, and glucagon","D. insulin and ketones"],"a":"A. glucagon and insulin"},{"id":"s2-c24-rq21","ch":24,"section":"RQ","q":"The postabsorptive state relies on stores of ________ in the ________. 1134     24 • Review Questions Access for free at openstax.org","opts":["A. insulin; pancreas","B. glucagon; pancreas","C. glycogen; liver","D. glucose; liver"],"a":"C. glycogen; liver"},{"id":"s2-c24-rq22","ch":24,"section":"RQ","q":"The body’s temperature is controlled by the ________. This temperature is always kept between ________.","opts":["A. pituitary; 36.5–37.5 °C","B. hypothalamus; 97.7–99.5 °F","C. hypothalamus; 36.5–37.5 °F","D. pituitary; 97.7–99.5 °F"],"a":"B. hypothalamus; 97.7–99.5 °F"},{"id":"s2-c24-rq23","ch":24,"section":"RQ","q":"Fever increases the body temperature and can induce chills to help cool the temperature back down. What other mechanisms are in place to regulate the body temperature?","opts":["A. shivering","B. sweating","C. erection of the hairs on the arms and legs","D. all of the above"],"a":"D. all of the above"},{"id":"s2-c24-rq24","ch":24,"section":"RQ","q":"The heat you feel on your chair when you stand up was transferred from your skin via ________.","opts":["A. conduction","B. convection","C. radiation","D. evaporation"],"a":"A. conduction"},{"id":"s2-c24-rq25","ch":24,"section":"RQ","q":"A crowded room warms up through the mechanism of ________.","opts":["A. conduction","B. convection","C. radiation","D. evaporation"],"a":"C. radiation"},{"id":"s2-c24-rq26","ch":24,"section":"RQ","q":"A deficiency in vitamin A can result in ________.","opts":["A. improper bone development","B. scurvy","C. improper eye development or sight","D. all of the above"],"a":"C. improper eye development or sight"},{"id":"s2-c24-rq27","ch":24,"section":"RQ","q":"Rickets results in improper bone development in children that arises from the malabsorption of calcium and a deficiency in ________.","opts":["A. vitamin D","B. vitamin C","C. vitamin B12","D. niacin"],"a":"A. vitamin D"},{"id":"s2-c24-rq28","ch":24,"section":"RQ","q":"Consuming which type of food will help the most with weight loss?","opts":["A. fats","B. vegetables","C. lean meats","D. fruits"],"a":"C. lean meats"},{"id":"s2-c24-rq29","ch":24,"section":"RQ","q":"Which of the following is stored in the body?","opts":["A. thiamine","B. phosphorous","C. folic acid 24 • Review Questions     1135","D. vitamin C"],"a":"B. phosphorous"},{"id":"s2-c24-ct30","ch":24,"section":"CT","q":"Describe how metabolism can be altered.","a":"An increase or decrease in lean muscle mass will result in an increase or decrease in metabolism."},{"id":"s2-c24-ct31","ch":24,"section":"CT","q":"Describe how Addison’s disease can be treated.","a":"Addison’s disease is characterized by low cortisol levels. One way to treat the disease is by giving cortisol to the patient."},{"id":"s2-c24-ct32","ch":24,"section":"CT","q":"Explain how glucose is metabolized to yield ATP.","a":"Glucose is oxidized during glycolysis, creating pyruvate, which is processed through the Krebs cycle to produce NADH, FADH2, ATP, and CO2. The FADH2 and NADH yield ATP."},{"id":"s2-c24-ct33","ch":24,"section":"CT","q":"Insulin is released when food is ingested and stimulates the uptake of glucose into the cell. Discuss the mechanism cells employ to create a concentration gradient to ensure continual uptake of glucose from the bloodstream.","a":"Upon entry into the cell, hexokinase or glucokinase phosphorylates glucose, converting it into glucose-6-phosphate. In this form, glucose-6-phosphate is trapped in the cell. Because all of the glucose has been phosphorylated, new glucose molecules can be transported into the cell according to its concentration gradient."},{"id":"s2-c24-ct34","ch":24,"section":"CT","q":"Discuss how carbohydrates can be stored as fat.","a":"Carbohydrates are converted into pyruvate during glycolysis. This pyruvate is converted into acetyl CoA and proceeds through the Krebs cycle. When excess acetyl CoA is produced that cannot be processed through the Krebs cycle, the acetyl CoA is converted into triglycerides and fatty acids to be stored in the liver and adipose tissue."},{"id":"s2-c24-ct35","ch":24,"section":"CT","q":"If a diabetic’s breath smells like alcohol, what could this mean?","a":"If diabetes is uncontrolled, the glucose in the blood is not being taken up and processed by the cells. Although blood glucose levels are high, there is no glucose available to the cells to be converted into energy. Because glucose is lacking, the body turns to other energy sources, including ketones. A side effect of using ketones as fuel is a sweet alcohol smell on the breath."},{"id":"s2-c24-ct36","ch":24,"section":"CT","q":"Amino acids are not stored in the body. Describe how excess amino acids are processed in the cell.","a":"Amino acids are not stored in the body. The individual amino acids are broken down into pyruvate, acetyl CoA, or intermediates of the Krebs cycle, and used for energy or for lipogenesis reactions to be stored as fats."},{"id":"s2-c24-ct37","ch":24,"section":"CT","q":"Release of trypsin and chymotrypsin in their active form can result in the digestion of the pancreas or small intestine itself. What mechanism does the body employ to prevent its self-destruction?","a":"Trypsin and chymotrypsin are released as inactive proenzymes. They are only activated in the small intestine, where they act upon ingested proteins in the food. This helps avoid unintended breakdown of the pancreas or small intestine."},{"id":"s2-c24-ct38","ch":24,"section":"CT","q":"In type II diabetes, insulin is produced but is nonfunctional. These patients are described as “starving in a sea of plenty,” because their blood glucose levels are high, but none of the glucose is transported into the cells. Describe how this leads to malnutrition.","a":"Insulin stimulates the uptake of glucose into the cells. In diabetes, the insulin does not function properly; therefore, the blood glucose is unable to be transported across the cell membrane for processing. These patients are unable to process the glucose in their blood and therefore must rely on other sources of fuel. If the disease is not controlled properly, this inability to process the glucose can lead to starvation states even though the patient is eating."},{"id":"s2-c24-ct39","ch":24,"section":"CT","q":"Ketone bodies are used as an alternative source of fuel during starvation. Describe how ketones are synthesized.","a":"When triglycerides and fatty acids are broken down, acetyl CoA is created. If excess acetyl CoA is generated in this process, the excess is used in ketogenesis or the creation of ketones. This creation results from the conversion of acetyl CoA by thiolase into acetoacetyl CoA. This acetoacetyl CoA is subsequently converted into β-hydroxybutyrate, the most common ketone in the body"},{"id":"s2-c24-ct40","ch":24,"section":"CT","q":"How does vasoconstriction help increase the core temperature of the body?","a":"When blood flows to the outer layers of the skin or to the extremities, heat is lost to the environment by the mechanisms of conduction, convection, or radiation. This will cool the blood and the body. Vasoconstriction helps increase the core body temperature by preventing the flow of blood to the outer layer of the skin and outer parts of the extremities."},{"id":"s2-c24-ct41","ch":24,"section":"CT","q":"How can the ingestion of food increase the body temperature?","a":"The ingestion of food stimulates digestion and processing of the carbohydrates, proteins, and fats. This breakdown of food triggers glycolysis, the Krebs cycle, the electron transport chain, fatty acid oxidation, lipogenesis, and amino acid oxidation to produce energy. Heat is a byproduct of those reactions."},{"id":"s2-c24-ct42","ch":24,"section":"CT","q":"Weight loss and weight gain are complex processes. What are some of the main factors that influence weight gain in people?","a":"Factors that influence weight gain are food intake (both quantity and quality), environmental factors, height, exercise level, some drugs or disease states, and genes."},{"id":"s2-c24-ct43","ch":24,"section":"CT","q":"Some low-fat or non-fat foods contain a large amount of sugar to replace the fat content of the food. Discuss how this leads to increased fat in the body (and weight gain) even though the item is non-fat.","a":"Although these foods technically do not have fat added, many times a significant amount of sugar is added to sweeten the food and make it taste better. These foods are non-fat; however, they can lead to significant fat storage or weight gain because the excess sugar is broken down into pyruvate, but overloads the Krebs cycle. When this happens, the sugar is converted into fat through lipogenesis and stored in adipose tissues. Anatomy &amp; Physiology Unit 5: Energy, Maintenance, and Environmental Exchange"},{"id":"s2-c25-rq1","ch":25,"section":"RQ","q":"Diabetes insipidus or diabetes mellitus would most likely be indicated by ________.","opts":["A. anuria","B. polyuria","C. oliguria","D. none of the above"],"a":"B. polyuria"},{"id":"s2-c25-rq2","ch":25,"section":"RQ","q":"The color of urine is determined mainly by ________.","opts":["A. diet","B. filtration rate","C. byproducts of red blood cell breakdown","D. filtration efficiency"],"a":"C. byproducts of red blood cell breakdown"},{"id":"s2-c25-rq3","ch":25,"section":"RQ","q":"Production of less than 50 mL/day of urine is called ________.","opts":["A. normal","B. polyuria","C. oliguria","D. anuria 25 • Review Questions     1179"],"a":"D. anuria 25 • Review Questions     1179"},{"id":"s2-c25-rq4","ch":25,"section":"RQ","q":"Peristaltic contractions occur in the ________.","opts":["A. urethra","B. bladder","C. ureters","D. urethra, bladder, and ureters"],"a":"C. ureters"},{"id":"s2-c25-rq5","ch":25,"section":"RQ","q":"Somatic motor neurons must be ________ to relax the external urethral sphincter to allow urination.","opts":["A. stimulated","B. inhibited"],"a":"B. inhibited"},{"id":"s2-c25-rq6","ch":25,"section":"RQ","q":"Which part of the urinary system is not completely retroperitoneal?","opts":["A. kidneys","B. ureters","C. bladder","D. nephrons"],"a":"C. bladder"},{"id":"s2-c25-rq7","ch":25,"section":"RQ","q":"The renal pyramids are separated from each other by extensions of the renal cortex called ________.","opts":["A. renal medulla","B. minor calyces","C. medullary cortices","D. renal columns"],"a":"D. renal columns"},{"id":"s2-c25-rq8","ch":25,"section":"RQ","q":"The primary structure found within the medulla is the ________.","opts":["A. loop of Henle","B. minor calyces","C. portal system","D. ureter"],"a":"A. loop of Henle"},{"id":"s2-c25-rq9","ch":25,"section":"RQ","q":"The right kidney is slightly lower because ________.","opts":["A. it is displaced by the liver","B. it is displace by the heart","C. it is slightly smaller","D. it needs protection of the lower ribs"],"a":"A. it is displaced by the liver"},{"id":"s2-c25-rq10","ch":25,"section":"RQ","q":"Blood filtrate is captured in the lumen of the ________.","opts":["A. glomerulus","B. Bowman’s capsule","C. calyces","D. renal papillae"],"a":"B. Bowman’s capsule"},{"id":"s2-c25-rq11","ch":25,"section":"RQ","q":"What are the names of the capillaries following the efferent arteriole?","opts":["A. arcuate and medullary","B. interlobar and interlobular","C. peritubular and vasa recta","D. peritubular and medullary"],"a":"C. peritubular and vasa recta"},{"id":"s2-c25-rq12","ch":25,"section":"RQ","q":"The functional unit of the kidney is called ________.","opts":["A. the renal hilus","B. the renal corpuscle","C. the nephron","D. Bowman’s capsule"],"a":"C. the nephron"},{"id":"s2-c25-rq13","ch":25,"section":"RQ","q":"________ pressure must be greater on the capillary side of the filtration membrane to achieve filtration. 1180     25 • Review Questions Access for free at openstax.org","opts":["A. Osmotic","B. Hydrostatic"],"a":"B. Hydrostatic"},{"id":"s2-c25-rq14","ch":25,"section":"RQ","q":"Production of urine to modify plasma makeup is the result of ________.","opts":["A. filtration","B. absorption","C. secretion","D. filtration, absorption, and secretion"],"a":"D. filtration, absorption, and secretion"},{"id":"s2-c25-rq15","ch":25,"section":"RQ","q":"Systemic blood pressure must stay above 60 so that the proper amount of filtrati
