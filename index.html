ase of a twitch in a muscle fiber is tension the greatest?", "a": "C. contraction phase", "opts": ["A. resting phase", "B. repolarization phase", "C. contraction phase", "D. relaxation phase"]}, {"id": "m4-c10-q16", "ch": 10, "section": "RQ", "q": "Muscle fatigue is caused by ________.", "a": "B. exhaustion of energy reserves and buildup of lactic acid levels", "opts": ["A. buildup of ATP and lactic acid levels", "B. exhaustion of energy reserves and buildup of lactic acid levels", "C. buildup of ATP and pyruvic acid levels", "D. exhaustion of energy reserves and buildup of pyruvic acid levels"]}, {"id": "m4-c10-q17", "ch": 10, "section": "RQ", "q": "A sprinter would experience muscle fatigue sooner than a marathon runner due to ________.", "a": "A. anaerobic metabolism in the muscles of the sprinter", "opts": ["A. anaerobic metabolism in the muscles of the sprinter", "B. anaerobic metabolism in the muscles of the marathon runner", "C. aerobic metabolism in the muscles of the sprinter", "D. glycolysis in the muscles of the marathon runner"]}, {"id": "m4-c10-q18", "ch": 10, "section": "RQ", "q": "What aspect of creatine phosphate allows it to supply energy to muscles?", "a": "B. phosphate bonds", "opts": ["A. ATPase activity", "B. phosphate bonds", "C. carbon bonds", "D. hydrogen bonds"]}, {"id": "m4-c10-q19", "ch": 10, "section": "RQ", "q": "Drug X blocks ATP regeneration from ADP and phosphate. How will muscle cells respond to this drug?", "a": "D. none of the above", "opts": ["A. by absorbing ATP from the bloodstream", "B. by using ADP as an energy source", "C. by using glycogen as an energy source", "D. none of the above"]}, {"id": "m4-c10-q20", "ch": 10, "section": "RQ", "q": "The muscles of a professional sprinter are most likely to have ________.", "a": "A. 80 percent fast-twitch muscle fibers and 20 percent slow-twitch muscle fibers", "opts": ["A. 80 percent fast-twitch muscle fibers and 20 percent slow-twitch muscle fibers", "B. 20 percent fast-twitch muscle fibers and 80 percent slow-twitch muscle fibers", "C. 50 percent fast-twitch muscle fibers and 50 percent slow-twitch muscle fibers", "D. 40 percent fast-twitch muscle fibers and 60 percent slow-twitch muscle fibers"]}, {"id": "m4-c10-q21", "ch": 10, "section": "RQ", "q": "The muscles of a professional marathon runner are most likely to have ________.", "a": "B. 20 percent fast-twitch muscle fibers and 80 percent slow-twitch muscle fibers", "opts": ["A. 80 percent fast-twitch muscle fibers and 20 percent slow-twitch muscle fibers", "B. 20 percent fast-twitch muscle fibers and 80 percent slow-twitch muscle fibers", "C. 50 percent fast-twitch muscle fibers and 50 percent slow-twitch muscle fibers", "D. 40 percent fast-twitch muscle fibers and 60 percent slow-twitch muscle fibers"]}, {"id": "m4-c10-q22", "ch": 10, "section": "RQ", "q": "Which of the following statements is true?", "a": "C. Fast fibers have large glycogen reserves", "opts": ["A. Fast fibers have a small diameter", "B. Fast fibers contain loosely packed myofibrils", "C. Fast fibers have large glycogen reserves", "D. Fast fibers have many mitochondria"]}, {"id": "m4-c10-q23", "ch": 10, "section": "RQ", "q": "Which of the following statements is false?", "a": "A. Slow fibers have a small network of capillaries", "opts": ["A. Slow fibers have a small network of capillaries", "B. Slow fibers contain the pigment myoglobin", "C. Slow fibers contain a large number of mitochondria", "D. Slow fibers contract for extended periods"]}, {"id": "m4-c10-q24", "ch": 10, "section": "RQ", "q": "Cardiac muscles differ from skeletal muscles in that they ________.", "a": "D. contain intercalated discs", "opts": ["A. are striated", "B. utilize aerobic metabolism", "C. contain myofibrils", "D. contain intercalated discs"]}, {"id": "m4-c10-q25", "ch": 10, "section": "RQ", "q": "If cardiac muscle cells were prevented from undergoing aerobic metabolism, they ultimately would ________.", "a": "C. stop contracting", "opts": ["A. undergo glycolysis", "B. synthesize ATP", "C. stop contracting", "D. start contracting"]}, {"id": "m4-c10-q26", "ch": 10, "section": "RQ", "q": "Smooth muscles differ from skeletal and cardiac muscles in that they ________.", "a": "A. lack myofibrils", "opts": ["A. lack myofibrils", "B. are under voluntary control", "C. lack myosin", "D. lack actin"]}, {"id": "m4-c10-q27", "ch": 10, "section": "RQ", "q": "Which of the following statements describes smooth muscle cells?", "a": "A. They are resistant to fatigue", "opts": ["A. They are resistant to fatigue", "B. They have a rapid onset of contractions", "C. They cannot exhibit tetanus", "D. They primarily use anaerobic metabolism"]}, {"id": "m4-c10-q28", "ch": 10, "section": "RQ", "q": "From which embryonic cell type does muscle tissue develop?", "a": "C. myoblast cells", "opts": ["A. ganglion cells", "B. myotube cells", "C. myoblast cells", "D. satellite cells"]}, {"id": "m4-c10-q29", "ch": 10, "section": "RQ", "q": "Which cell type helps to repair injured muscle fibers?", "a": "D. satellite cells", "opts": ["A. ganglion cells", "B. myotube cells", "C. myoblast cells", "D. satellite cells"]}, {"id": "m4-c10-q30", "ch": 10, "section": "CT", "q": "Why is elasticity an important quality of muscle tissue?", "a": "It allows muscle to return to its original length during relaxation after contraction."}, {"id": "m4-c10-q31", "ch": 10, "section": "CT", "q": "What would happen to skeletal muscle if the epimysium were destroyed?", "a": "Muscles would lose their integrity during powerful movements, resulting in muscle damage."}, {"id": "m4-c10-q32", "ch": 10, "section": "CT", "q": "Describe how tendons facilitate body movement.", "a": "When a muscle contracts, the force of movement is transmitted through the tendon, which pulls on the bone to produce skeletal movement."}, {"id": "m4-c10-q33", "ch": 10, "section": "CT", "q": "What are the five primary functions of skeletal muscle?", "a": "Produce movement of the skeleton, maintain posture and body position, support soft tissues, encircle openings of the digestive, urinary, and other tracts, and maintain body temperature."}, {"id": "m4-c10-q34", "ch": 10, "section": "CT", "q": "What are the opposite roles of voltage-gated sodium channels and voltage-gated potassium channels?", "a": "The opening of voltage-gated sodium channels, followed by the influx of Na+ , transmits an Action Potential after the membrane has sufficiently depolarized. The delayed opening of potassium channels allows K+ to exit the cell, to repolarize the membrane."}, {"id": "m4-c10-q35", "ch": 10, "section": "CT", "q": "How would muscle contractions be affected if skeletal muscle fibers did not have T-tubules?", "a": "Without T-tubules, action potential conduction into the interior of the cell would happen much more slowly, causing delays between neural stimulation and muscle contraction, resulting in slower, weaker contractions."}, {"id": "m4-c10-q36", "ch": 10, "section": "CT", "q": "What causes the striated appearance of skeletal muscle tissue?", "a": "Dark A bands and light I bands repeat along myofibrils, and the alignment of myofibrils in the cell cause the entire cell to appear striated."}, {"id": "m4-c10-q37", "ch": 10, "section": "CT", "q": "How would muscle contractions be affected if ATP was completely depleted in a muscle fiber?", "a": "Without ATP, the myosin heads cannot detach from the actin-binding sites. All of the “stuck” cross-bridges result in muscle stiffness. In a live person, this can cause a condition like “writer’s cramps.” In a recently dead person, it results in rigor mortis."}, {"id": "m4-c10-q38", "ch": 10, "section": "CT", "q": "Why does a motor unit of the eye have few muscle fibers compared to a motor unit of the leg?", "a": "Eyes require fine movements and a high degree of control, which is permitted by having fewer muscle fibers associated with a neuron."}, {"id": "m4-c10-q39", "ch": 10, "section": "CT", "q": "What factors contribute to the amount of tension produced in an individual muscle fiber?", "a": "The length, size and types of muscle fiber and the frequency of neural stimulation contribute to the amount of tension produced in an individual muscle fiber."}, {"id": "m4-c10-q40", "ch": 10, "section": "CT", "q": "Why do muscle cells use creatine phosphate instead of glycolysis to supply ATP for the first few seconds of muscle contraction?", "a": "Creatine phosphate is used because creatine phosphate and ADP are converted very quickly into ATP by creatine kinase. Glycolysis cannot generate ATP as quickly as creatine phosphate."}, {"id": "m4-c10-q41", "ch": 10, "section": "CT", "q": "Is aerobic respiration more or less efficient than glycolysis? Explain your answer.", "a": "Aerobic respiration is much more efficient than anaerobic glycolysis, yielding 36 ATP per molecule of glucose, as opposed to two ATP produced by glycolysis."}, {"id": "m4-c10-q42", "ch": 10, "section": "CT", "q": "What changes occur at the cellular level in response to endurance training?", "a": "Endurance training modifies slow fibers to make them more efficient by producing more mitochondria to enable more aerobic metabolism and more ATP production. Endurance exercise can also increase the amount of myoglobin in a cell and formation of more extensive capillary networks around the fiber."}, {"id": "m4-c10-q43", "ch": 10, "section": "CT", "q": "What changes occur at the cellular level in response to resistance training?", "a": "Resistance exercises affect muscles by causing the formation of more actin and myosin, increasing the structure of muscle fibers."}, {"id": "m4-c10-q44", "ch": 10, "section": "CT", "q": "What would be the drawback of cardiac contractions being the same duration as skeletal muscle contractions?", "a": "An action potential could reach a cardiac muscle cell before it has entered the relaxation phase, resulting in the sustained contractions of tetanus. If this happened, the heart would not beat regularly."}, {"id": "m4-c10-q45", "ch": 10, "section": "CT", "q": "How are cardiac muscle cells similar to and different from skeletal muscle cells?", "a": "Cardiac and skeletal muscle cells both contain ordered myofibrils and are striated. Cardiac muscle cells are branched and contain intercalated discs, which skeletal muscles do not have."}, {"id": "m4-c10-q46", "ch": 10, "section": "CT", "q": "Why can smooth muscles contract over a wider range of resting lengths than skeletal and cardiac muscle?", "a": "Smooth muscles can contract over a wider range of resting lengths because the actin and myosin filaments in smooth muscle are not as rigidly organized as those in skeletal and cardiac muscle."}, {"id": "m4-c10-q47", "ch": 10, "section": "CT", "q": "Describe the differences between single-unit smooth muscle and multiunit smooth muscle.", "a": "Single-unit smooth muscle is found in the walls of hollow organs; multiunit smooth muscle is found in airways to the lungs and large arteries. Single-unit smooth muscle cells contract synchronously, they are coupled by gap junctions, and they exhibit spontaneous action potential. Multiunit smooth cells lack gap junctions, and their contractions are not synchronous."}, {"id": "m4-c10-q48", "ch": 10, "section": "CT", "q": "Why is muscle that has sustained significant damage unable to produce the same amount of power as it could before being damaged?", "a": "If the damage exceeds what can be repaired by satellite cells, the damaged tissue is replaced by scar tissue, which cannot contract."}, {"id": "m4-c10-q49", "ch": 10, "section": "CT", "q": "Which muscle type(s) (skeletal, smooth, or cardiac) can regenerate new muscle cells/fibers? Explain your answer.", "a": "Smooth muscle tissue can regenerate from stem cells called pericytes, cells found in some small blood vessels. These allow smooth muscle cells to regenerate and repair much more readily than skeletal and cardiac muscle tissue."}, {"id": "m4-c11-q1", "ch": 11, "section": "RQ", "q": "Which of the following is unique to the muscles of facial expression?", "a": "D. They insert into the skin.", "opts": ["A. They all originate from the scalp musculature.", "B. They insert onto the cartilage found around the face.", "C. They only insert onto the facial bones.", "D. They insert into the skin."]}, {"id": "m4-c11-q2", "ch": 11, "section": "RQ", "q": "Which of the following helps an agonist work?", "a": "A. a synergist", "opts": ["A. a synergist", "B. a fixator", "C. an insertion", "D. an antagonist"]}, {"id": "m4-c11-q3", "ch": 11, "section": "RQ", "q": "Which of the following statements is correct about what happens during flexion?", "a": "B. The angle between bones is decreased.", "opts": ["A. The angle between bones is increased.", "B. The angle between bones is decreased.", "C. The bone moves away from the body.", "D. The bone moves toward the center of the body."]}, {"id": "m4-c11-q4", "ch": 11, "section": "RQ", "q": "Which is moved the least during muscle contraction?", "a": "A. the origin", "opts": ["A. the origin", "B. the insertion", "C. the ligaments", "D. the joints"]}, {"id": "m4-c11-q5", "ch": 11, "section": "RQ", "q": "Which muscle has a convergent pattern of fascicles?", "a": "C. pectoralis major", "opts": ["A. biceps brachii", "B. gluteus maximus", "C. pectoralis major", "D. rectus femoris"]}, {"id": "m4-c11-q6", "ch": 11, "section": "RQ", "q": "A muscle that has a pattern of fascicles running along the long axis of the muscle has which of the following fascicle arrangements?", "a": "C. parallel", "opts": ["A. circular", "B. pennate", "C. parallel", "D. rectus"]}, {"id": "m4-c11-q7", "ch": 11, "section": "RQ", "q": "Which arrangement best describes a bipennate muscle?", "a": "A. The muscle fibers feed in on an angle to a long tendon from both sides.", "opts": ["A. The muscle fibers feed in on an angle to a long tendon from both sides.", "B. The muscle fibers feed in on an angle to a long tendon from all directions.", "C. The muscle fibers feed in on an angle to a long tendon from one side.", "D. The muscle fibers on one side of a tendon feed into it at a certain angle and muscle fibers on the other side of the tendon feed into it at the opposite angle."]}, {"id": "m4-c11-q8", "ch": 11, "section": "RQ", "q": "The location of a muscle’s insertion and origin can determine ________.", "a": "A. action", "opts": ["A. action", "B. the force of contraction", "C. muscle name", "D. the load a muscle can carry"]}, {"id": "m4-c11-q9", "ch": 11, "section": "RQ", "q": "Where is the temporalis muscle located?", "a": "C. on the side of the head", "opts": ["A. on the forehead", "B. in the neck", "C. on the side of the head", "D. on the chin"]}, {"id": "m4-c11-q10", "ch": 11, "section": "RQ", "q": "Which muscle name does not make sense?", "a": "D. extensor minimus longus", "opts": ["A. extensor digitorum", "B. gluteus minimus", "C. biceps femoris", "D. extensor minimus longus"]}, {"id": "m4-c11-q11", "ch": 11, "section": "RQ", "q": "Which of the following terms would be used in the name of a muscle that moves the leg away from the body?", "a": "D. abductor", "opts": ["A. flexor", "B. adductor", "C. extensor", "D. abductor"]}, {"id": "m4-c11-q12", "ch": 11, "section": "RQ", "q": "Which of the following is a prime mover in head flexion?", "a": "C. sternocleidomastoid", "opts": ["A. occipitofrontalis", "B. corrugator supercilii", "C. sternocleidomastoid", "D. masseter"]}, {"id": "m4-c11-q13", "ch": 11, "section": "RQ", "q": "Where is the inferior oblique muscle located?", "a": "B. in the eye socket", "opts": ["A. in the abdomen", "B. in the eye socket", "C. in the anterior neck", "D. in the face"]}, {"id": "m4-c11-q14", "ch": 11, "section": "RQ", "q": "What is the action of the masseter?", "a": "B. chewing", "opts": ["A. swallowing", "B. chewing", "C. moving the lips", "D. closing the eye"]}, {"id": "m4-c11-q15", "ch": 11, "section": "RQ", "q": "The names of the extrinsic tongue muscles commonly end in ________.", "a": "B. -glossus", "opts": ["A. -glottis", "B. -glossus", "C. -gluteus", "D. -hyoid"]}, {"id": "m4-c11-q16", "ch": 11, "section": "RQ", "q": "What is the function of the erector spinae?", "a": "C. postural support", "opts": ["A. movement of the arms", "B. stabilization of the pelvic girdle", "C. postural support", "D. rotating of the vertebral column"]}, {"id": "m4-c11-q17", "ch": 11, "section": "RQ", "q": "Which of the following abdominal muscles is not a part of the anterior abdominal wall?", "a": "A. quadratus lumborum", "opts": ["A. quadratus lumborum", "B. rectus abdominis", "C. interior oblique", "D. exterior oblique"]}, {"id": "m4-c11-q18", "ch": 11, "section": "RQ", "q": "Which muscle pair plays a role in respiration?", "a": "D. diaphragm, scalene", "opts": ["A. intertransversarii, interspinales", "B. semispinalis cervicis, semispinalis thoracis", "C. trapezius, rhomboids", "D. diaphragm, scalene"]}, {"id": "m4-c11-q19", "ch": 11, "section": "RQ", "q": "What is the linea alba?", "a": "B. a long tendon that runs down the middle of the rectus abdominis", "opts": ["A. a small muscle that helps with compression of the abdominal organs", "B. a long tendon that runs down the middle of the rectus abdominis", "C. a long band of collagen fibers that connects the hip to the knee", "D. another name for the tendinous inscription"]}, {"id": "m4-c11-q20", "ch": 11, "section": "RQ", "q": "The rhomboid major and minor muscles are deep to the ________.", "a": "C. trapezius", "opts": ["A. rectus abdominis", "B. scalene muscles", "C. trapezius", "D. ligamentum nuchae"]}, {"id": "m4-c11-q21", "ch": 11, "section": "RQ", "q": "Which muscle extends the forearm?", "a": "B. triceps brachii", "opts": ["A. biceps brachii", "B. triceps brachii", "C. brachialis", "D. deltoid"]}, {"id": "m4-c11-q22", "ch": 11, "section": "RQ", "q": "What is the origin of the wrist flexors?", "a": "B. the medial epicondyle of the humerus", "opts": ["A. the lateral epicondyle of the humerus", "B. the medial epicondyle of the humerus", "C. the carpal bones of the wrist", "D. the deltoid tuberosity of the humerus"]}, {"id": "m4-c11-q23", "ch": 11, "section": "RQ", "q": "Which muscles stabilize the pectoral girdle?", "a": "A. axial and scapular", "opts": ["A. axial and scapular", "B. axial", "C. appendicular", "D. axial and appendicular"]}, {"id": "m4-c11-q24", "ch": 11, "section": "RQ", "q": "The large muscle group that attaches the leg to the pelvic girdle and produces extension of the hip joint is the ________ group.", "a": "A. gluteal", "opts": ["A. gluteal", "B. obturator", "C. adductor", "D. abductor"]}, {"id": "m4-c11-q25", "ch": 11, "section": "RQ", "q": "Which muscle produces movement that allows you to cross your legs?", "a": "D. the sartorius", "opts": ["A. the gluteus maximus", "B. the piriformis", "C. the gracilis", "D. the sartorius"]}, {"id": "m4-c11-q26", "ch": 11, "section": "RQ", "q": "What is the largest muscle in the lower leg?", "a": "B. gastrocnemius", "opts": ["A. soleus", "B. gastrocnemius", "C. tibialis anterior", "D. tibialis posterior"]}, {"id": "m4-c11-q27", "ch": 11, "section": "RQ", "q": "The vastus intermedius muscle is deep to which of the following muscles?", "a": "B. rectus femoris", "opts": ["A. biceps femoris", "B. rectus femoris", "C. vastus medialis", "D. vastus lateralis"]}, {"id": "m4-c11-q28", "ch": 11, "section": "CT", "q": "What effect does fascicle arrangement have on a muscle’s action?", "a": "Fascicle arrangements determine what type of movement a muscle can make. For instance, circular muscles act as sphincters, closing orifices."}, {"id": "m4-c11-q29", "ch": 11, "section": "CT", "q": "Movements of the body occur at joints. Describe how muscles are arranged around the joints of the body.", "a": "Muscles work in pairs to facilitate movement of the bones around the joints. Agonists are the prime movers while antagonists oppose or resist the movements of the agonists. Synergists assist the agonists, and fixators stabilize a muscle’s origin."}, {"id": "m4-c11-q30", "ch": 11, "section": "CT", "q": "Explain how a synergist assists an agonist by being a fixator.", "a": "Agonists are the prime movers while antagonists oppose or resist the movements of the agonists. Synergists assist the agonists, and fixators stabilize a muscle’s origin."}, {"id": "m4-c11-q31", "ch": 11, "section": "CT", "q": "Describe the different criteria that contribute to how skeletal muscles are named.", "a": "In anatomy and physiology, many word roots are Latin or Greek. Portions, or roots, of the word give us clues about the function, shape, action, or location of a muscle."}, {"id": "m4-c11-q32", "ch": 11, "section": "CT", "q": "Explain the difference between axial and appendicular muscles.", "a": "Axial muscles originate on the axial skeleton (the bones in the head, neck, and core of the body), whereas appendicular muscles originate on the bones that make up the body’s limbs."}, {"id": "m4-c11-q33", "ch": 11, "section": "CT", "q": "Describe the muscles of the anterior neck.", "a": "The muscles of the anterior neck are arranged to facilitate swallowing and speech. They work on the hyoid bone, with the suprahyoid muscles pulling up and the infrahyoid muscles pulling down."}, {"id": "m4-c11-q34", "ch": 11, "section": "CT", "q": "Why are the muscles of the face different from typical skeletal muscle?", "a": "Most skeletal muscles create movement by actions on the skeleton. Facial muscles are different in that they create facial movements and expressions by pulling on the skin—no bone movements are involved."}, {"id": "m4-c11-q35", "ch": 11, "section": "CT", "q": "Describe the fascicle arrangement in the muscles of the abdominal wall. How do they relate to each other?", "a": "Arranged into layers, the muscles of the abdominal wall are the internal and external obliques, which run on diagonals, the rectus abdominis, which runs straight down the midline of the body, and the transversus abdominis, which wraps across the trunk of the body."}, {"id": "m4-c11-q36", "ch": 11, "section": "CT", "q": "What are some similarities and differences between the diaphragm and the pelvic diaphragm?", "a": "Both diaphragms are thin sheets of skeletal muscle that horizontally span areas of the trunk. The diaphragm separating the thoracic and abdominal cavities is the primary muscle of breathing. The pelvic diaphragm, consisting of two paired muscles, the coccygeus and the levator ani, forms the pelvic floor at the inferior end of the trunk."}, {"id": "m4-c11-q37", "ch": 11, "section": "CT", "q": "The tendons of which muscles form the rotator cuff? Why is the rotator cuff important?", "a": "Tendons of the infraspinatus, supraspinatus, teres minor, and the subscapularis form the rotator cuff, which forms a foundation on which the arms and shoulders can be stabilized and move."}, {"id": "m4-c11-q38", "ch": 11, "section": "CT", "q": "List the general muscle groups of the shoulders and upper limbs as well as their subgroups.", "a": "The muscles that make up the shoulders and upper limbs include the muscles that position the pelvic girdle, the muscles that move the humerus, the muscles that move the forearm, and the muscles that move the wrists, hands, and fingers."}, {"id": "m4-c11-q39", "ch": 11, "section": "CT", "q": "Which muscles form the hamstrings? How do they function together?", "a": "The biceps femoris, semimembranosus, and semitendinosus form the hamstrings. The hamstrings flex the leg at the knee joint."}, {"id": "m4-c11-q40", "ch": 11, "section": "CT", "q": "Which muscles form the quadriceps? How do they function together?", "a": "The rectus femoris, vastus medialis, vastus lateralis, and vastus intermedius form the quadriceps. The quadriceps muscles extend the leg at the knee joint."}]}, {"key": "m5", "name": "Module 5", "sub": "Ch 12–14 · Nervous Tissue · Spinal Cord · Brain", "cards": [{"id": "m5-c12-q9", "ch": 12, "section": "RQ", "q": "Which of the following cavities contains a component of the central nervous system?", "a": "C. cranial", "opts": ["A. abdominal", "B. pelvic", "C. cranial", "D. thoracic"]}, {"id": "m5-c12-q10", "ch": 12, "section": "RQ", "q": "Which structure predominates in the white matter of the brain?", "a": "A. myelinated axons", "opts": ["A. myelinated axons", "B. neuronal cell bodies", "C. ganglia of the parasympathetic nerves", "D. bundles of dendrites from the enteric nervous system"]}, {"id": "m5-c12-q11", "ch": 12, "section": "RQ", "q": "Which part of a neuron transmits an electrical signal to a target cell?", "a": "D. axon", "opts": ["A. dendrites", "B. soma", "C. cell body", "D. axon"]}, {"id": "m5-c12-q12", "ch": 12, "section": "RQ", "q": "Which term describes a bundle of axons in the peripheral nervous system?", "a": "D. nerve", "opts": ["A. nucleus", "B. ganglion", "C. tract", "D. nerve"]}, {"id": "m5-c12-q13", "ch": 12, "section": "RQ", "q": "Which functional division of the nervous system would be responsible for the physiological changes seen during exercise (e.g., increased heart rate and sweating)?", "a": "B. autonomic", "opts": ["A. somatic", "B. autonomic", "C. enteric", "D. central"]}, {"id": "m5-c12-q14", "ch": 12, "section": "RQ", "q": "What type of glial cell provides myelin for the axons in a tract?", "a": "A. oligodendrocyte", "opts": ["A. oligodendrocyte", "B. astrocyte", "C. Schwann cell", "D. satellite cell"]}, {"id": "m5-c12-q15", "ch": 12, "section": "RQ", "q": "Which part of a neuron contains the nucleus?", "a": "B. soma", "opts": ["A. dendrite", "B. soma", "C. axon", "D. synaptic end bulb"]}, {"id": "m5-c12-q16", "ch": 12, "section": "RQ", "q": "Which of the following substances is least able to cross the blood-brain barrier?", "a": "D. white blood cells", "opts": ["A. water", "B. sodium ions", "C. glucose", "D. white blood cells"]}, {"id": "m5-c12-q17", "ch": 12, "section": "RQ", "q": "What type of glial cell is the resident macrophage behind the blood-brain barrier?", "a": "A. microglia", "opts": ["A. microglia", "B. astrocyte", "C. Schwann cell", "D. satellite cell"]}, {"id": "m5-c12-q18", "ch": 12, "section": "RQ", "q": "What two types of macromolecules are the main components of myelin?", "a": "C. lipids and proteins", "opts": ["A. carbohydrates and lipids", "B. proteins and nucleic acids", "C. lipids and proteins", "D. carbohydrates and nucleic acids"]}, {"id": "m5-c12-q19", "ch": 12, "section": "RQ", "q": "If a thermoreceptor is sensitive to temperature sensations, what would a chemoreceptor be sensitive to?", "a": "C. molecules", "opts": ["A. light", "B. sound", "C. molecules", "D. vibration"]}, {"id": "m5-c12-q20", "ch": 12, "section": "RQ", "q": "Which of these locations is where the greatest level of integration is taking place in the example of testing the temperature of the shower?", "a": "D. cerebral cortex", "opts": ["A. skeletal muscle", "B. spinal cord", "C. thalamus", "D. cerebral cortex"]}, {"id": "m5-c12-q21", "ch": 12, "section": "RQ", "q": "How long does all the signaling through the sensory pathway, within the central nervous system, and through the motor command pathway take?", "a": "C. fraction of a second", "opts": ["A. 1 to 2 minutes", "B. 1 to 2 seconds", "C. fraction of a second", "D. varies with graded potential"]}, {"id": "m5-c12-q22", "ch": 12, "section": "RQ", "q": "What is the target of an upper motor neuron?", "a": "B. lower motor neuron", "opts": ["A. cerebral cortex", "B. lower motor neuron", "C. skeletal muscle", "D. thalamus"]}, {"id": "m5-c12-q23", "ch": 12, "section": "RQ", "q": "What ion enters a neuron causing depolarization of the cell membrane?", "a": "A. sodium", "opts": ["A. sodium", "B. chloride", "C. potassium", "D. phosphate"]}, {"id": "m5-c12-q24", "ch": 12, "section": "RQ", "q": "Voltage-gated Na+ channels open upon reaching what state?", "a": "B. threshold", "opts": ["A. resting potential", "B. threshold", "C. repolarization", "D. overshoot"]}, {"id": "m5-c12-q25", "ch": 12, "section": "RQ", "q": "What does a ligand-gated channel require in order to open?", "a": "B. binding of a neurotransmitter", "opts": ["A. increase in concentration of Na+ ions", "B. binding of a neurotransmitter", "C. increase in concentration of K+ ions", "D. depolarization of the membrane"]}, {"id": "m5-c12-q26", "ch": 12, "section": "RQ", "q": "What does a mechanically gated channel respond to?", "a": "A. physical stimulus", "opts": ["A. physical stimulus", "B. chemical stimulus", "C. increase in resistance", "D. decrease in resistance"]}, {"id": "m5-c12-q27", "ch": 12, "section": "RQ", "q": "Which of the following voltages would most likely be measured during the relative refractory period?", "a": "D. -80 mV", "opts": ["A. +30 mV", "B. 0 mV", "C. -45 mV", "D. -80 mV"]}, {"id": "m5-c12-q28", "ch": 12, "section": "RQ", "q": "Which of the following is probably going to propagate an action potential fastest?", "a": "D. a thick, myelinated axon", "opts": ["A. a thin, unmyelinated axon", "B. a thin, myelinated axon", "C. a thick, unmyelinated axon", "D. a thick, myelinated axon"]}, {"id": "m5-c12-q29", "ch": 12, "section": "RQ", "q": "How much of a change in the membrane potential is necessary for the summation of postsynaptic potentials to result in an action potential being generated?", "a": "B. +15 mV", "opts": ["A. +30 mV", "B. +15 mV", "C. +10 mV", "D. -15 mV"]}, {"id": "m5-c12-q30", "ch": 12, "section": "RQ", "q": "A channel opens on a postsynaptic membrane that causes a negative ion to enter the cell. What type of graded potential is this?", "a": "C. hyperpolarizing", "opts": ["A. depolarizing", "B. repolarizing", "C. hyperpolarizing", "D. non-polarizing"]}, {"id": "m5-c12-q31", "ch": 12, "section": "RQ", "q": "What neurotransmitter is released at the neuromuscular junction?", "a": "D. acetylcholine", "opts": ["A. norepinephrine", "B. serotonin", "C. dopamine", "D. acetylcholine"]}, {"id": "m5-c12-q32", "ch": 12, "section": "RQ", "q": "What type of receptor requires an effector protein to initiate a signal?", "a": "D. metabotropic receptor", "opts": ["A. biogenic amine", "B. ionotropic receptor", "C. cholinergic system", "D. metabotropic receptor"]}, {"id": "m5-c12-q33", "ch": 12, "section": "RQ", "q": "Which of the following neurotransmitters is associated with inhibition exclusively?", "a": "A. GABA", "opts": ["A. GABA", "B. acetylcholine", "C. glutamate", "D. norepinephrine"]}, {"id": "m5-c12-q34", "ch": 12, "section": "CT", "q": "What responses are generated by the nervous system when you run on a treadmill? Include an example of each type of tissue that is under nervous system control.", "a": "Running on a treadmill involves contraction of the skeletal muscles in the legs, increase in contraction of the cardiac muscle of the heart, and the production and secretion of sweat in the skin to stay cool."}, {"id": "m5-c12-q35", "ch": 12, "section": "CT", "q": "When eating food, what anatomical and functional divisions of the nervous system are involved in the perceptual experience?", "a": "The sensation of taste associated with eating is sensed by nerves in the periphery that are involved in sensory and somatic functions."}, {"id": "m5-c12-q36", "ch": 12, "section": "CT", "q": "Multiple sclerosis is a demyelinating disease affecting the central nervous system. What type of cell would be the most likely target of this disease? Why?", "a": "The disease would target oligodendrocytes. In the CNS, oligodendrocytes provide the myelin for axons."}, {"id": "m5-c12-q37", "ch": 12, "section": "CT", "q": "Which type of neuron, based on its shape, is best suited for relaying information directly from one neuron to another? Explain why.", "a": "Bipolar cells, because they have one dendrite that receives input and one axon that provides output, would be a direct relay between two other cells."}, {"id": "m5-c12-q38", "ch": 12, "section": "CT", "q": "Sensory fibers, or pathways, are referred to as “afferent.” Motor fibers, or pathways, are referred to as “efferent.” What can you infer about the meaning of these two terms (afferent and efferent) in a structural or anatomical context?", "a": "Afferent means “toward,” as in sensory information traveling from the periphery into the CNS. Efferent means “away from,” as in motor commands that travel from the brain down the spinal cord and out into the periphery."}, {"id": "m5-c12-q39", "ch": 12, "section": "CT", "q": "If a person has a motor disorder and cannot move their arm voluntarily, but their muscles have tone, which motor neuron—upper or lower—is probably affected? Explain why.", "a": "The upper motor neuron would be affected because it is carrying the command from the brain down."}, {"id": "m5-c12-q40", "ch": 12, "section": "CT", "q": "What does it mean for an action potential to be an “all or none” event?", "a": "The cell membrane must reach threshold before voltage-gated Na+ channels open. If threshold is not reached, those channels do not open, and the depolarizing phase of the action potential does not occur, the cell membrane will just go back to its resting state."}, {"id": "m5-c12-q41", "ch": 12, "section": "CT", "q": "The conscious perception of pain is often delayed because of the time it takes for the sensations to reach the cerebral cortex. Why would this be the case based on propagation of the axon potential?", "a": "Axons of pain sensing sensory neurons are thin and unmyelinated so that it takes longer for that sensation to reach the brain than other sensations."}, {"id": "m5-c12-q42", "ch": 12, "section": "CT", "q": "If a postsynaptic cell has synapses from five different cells, and three cause EPSPs and two of them cause IPSPs, give an example of a series of depolarizations and hyperpolarizations that would result in the neuron reaching threshold.", "a": "EPSP1 = +5 mV, EPSP2 = +7 mV, EPSP 3 = +10 mV, IPSP1 = -4 mV, IPSP2 = -3 mV. 5 + 7 + 10 – 4 – 3 = +15 mV."}, {"id": "m5-c12-q43", "ch": 12, "section": "CT", "q": "Why is the receptor the important element determining the effect a neurotransmitter has on a target cell?", "a": "Different neurotransmitters have different receptors. Thus, the type of receptor in the postsynaptic cell is what determines which ion channels open. Acetylcholine binding to the nicotinic receptor causes cations to cross the membrane. GABA binding to its receptor causes the anion chloride to cross the membrane."}, {"id": "m5-c13-q13", "ch": 13, "section": "RQ", "q": "Aside from the nervous system, which other organ system develops out of the ectoderm?", "a": "C. integumentary", "opts": ["A. digestive", "B. respiratory", "C. integumentary", "D. urinary"]}, {"id": "m5-c13-q14", "ch": 13, "section": "RQ", "q": "Which primary vesicle of the embryonic nervous system does not differentiate into more vesicles at the secondary stage?", "a": "B. mesencephalon", "opts": ["A. prosencephalon", "B. mesencephalon", "C. diencephalon", "D. rhombencephalon"]}, {"id": "m5-c13-q15", "ch": 13, "section": "RQ", "q": "Which adult structure(s) arises from the diencephalon?", "a": "A. thalamus, hypothalamus, retina", "opts": ["A. thalamus, hypothalamus, retina", "B. midbrain, pons, medulla", "C. pons and cerebellum", "D. cerebrum"]}, {"id": "m5-c13-q16", "ch": 13, "section": "RQ", "q": "Which non-nervous tissue develops from the neuroectoderm?", "a": "D. craniofacial bone", "opts": ["A. respiratory mucosa", "B. vertebral bone", "C. digestive lining", "D. craniofacial bone"]}, {"id": "m5-c13-q17", "ch": 13, "section": "RQ", "q": "Which structure is associated with the embryologic development of the peripheral nervous system?", "a": "A. neural crest", "opts": ["A. neural crest", "B. neuraxis", "C. rhombencephalon", "D. neural tube"]}, {"id": "m5-c13-q18", "ch": 13, "section": "RQ", "q": "Which lobe of the cerebral cortex is responsible for generating motor commands?", "a": "D. frontal", "opts": ["A. temporal", "B. parietal", "C. occipital", "D. frontal"]}, {"id": "m5-c13-q19", "ch": 13, "section": "RQ", "q": "What region of the diencephalon coordinates homeostasis?", "a": "C. hypothalamus", "opts": ["A. thalamus", "B. epithalamus", "C. hypothalamus", "D. subthalamus"]}, {"id": "m5-c13-q20", "ch": 13, "section": "RQ", "q": "What level of the brain stem is the major input to the cerebellum?", "a": "B. pons", "opts": ["A. midbrain", "B. pons", "C. medulla", "D. spinal cord"]}, {"id": "m5-c13-q21", "ch": 13, "section": "RQ", "q": "What region of the spinal cord contains motor neurons that direct the movement of skeletal muscles?", "a": "A. anterior horn", "opts": ["A. anterior horn", "B. posterior horn", "C. lateral horn", "D. alar plate"]}, {"id": "m5-c13-q22", "ch": 13, "section": "RQ", "q": "Brodmann’s areas map different regions of the ________ to particular functions.", "a": "B. cerebral cortex", "opts": ["A. cerebellum", "B. cerebral cortex", "C. basal forebrain", "D. corpus callosum"]}, {"id": "m5-c13-q23", "ch": 13, "section": "RQ", "q": "What blood vessel enters the cranium to supply the brain with fresh, oxygenated blood?", "a": "C. internal carotid artery", "opts": ["A. common carotid artery", "B. jugular vein", "C. internal carotid artery", "D. aorta"]}, {"id": "m5-c13-q24", "ch": 13, "section": "RQ", "q": "Which layer of the meninges surrounds and supports the sinuses that form the route through which blood drains from the CNS?", "a": "A. dura mater", "opts": ["A. dura mater", "B. arachnoid mater", "C. subarachnoid", "D. pia mater"]}, {"id": "m5-c13-q25", "ch": 13, "section": "RQ", "q": "What type of glial cell is responsible for filtering blood to produce CSF at the choroid plexus?", "a": "A. ependymal cell", "opts": ["A. ependymal cell", "B. astrocyte", "C. oligodendrocyte", "D. Schwann cell"]}, {"id": "m5-c13-q26", "ch": 13, "section": "RQ", "q": "Which portion of the ventricular system is found within the diencephalon?", "a": "B. third ventricle", "opts": ["A. lateral ventricles", "B. third ventricle", "C. cerebral aqueduct", "D. fourth ventricle"]}, {"id": "m5-c13-q27", "ch": 13, "section": "RQ", "q": "What condition causes a stroke?", "a": "D. disruption of blood to the brain", "opts": ["A. inflammation of meninges", "B. lumbar puncture", "C. infection of cerebral spinal fluid", "D. disruption of blood to the brain"]}, {"id": "m5-c13-q28", "ch": 13, "section": "RQ", "q": "What type of ganglion contains neurons that control homeostatic mechanisms of the body?", "a": "C. autonomic ganglion", "opts": ["A. sensory ganglion", "B. dorsal root ganglion", "C. autonomic ganglion", "D. cranial nerve ganglion"]}, {"id": "m5-c13-q29", "ch": 13, "section": "RQ", "q": "Which ganglion is responsible for cutaneous sensations of the face?", "a": "D. trigeminal ganglion", "opts": ["A. otic ganglion", "B. vestibular ganglion", "C. geniculate ganglion", "D. trigeminal ganglion"]}, {"id": "m5-c13-q30", "ch": 13, "section": "RQ", "q": "What is the name for a bundle of axons within a nerve?", "a": "A. fascicle", "opts": ["A. fascicle", "B. tract", "C. nerve root", "D. epineurium"]}, {"id": "m5-c13-q31", "ch": 13, "section": "RQ", "q": "Which cranial nerve does not control functions in the head and neck?", "a": "D. vagus", "opts": ["A. olfactory", "B. trochlear", "C. glossopharyngeal", "D. vagus"]}, {"id": "m5-c13-q32", "ch": 13, "section": "RQ", "q": "Which of these structures is not under direct control of the peripheral nervous system?", "a": "B. gastric plexus", "opts": ["A. trigeminal ganglion", "B. gastric plexus", "C. sympathetic chain ganglia", "D. cervical plexus"]}, {"id": "m5-c13-q33", "ch": 13, "section": "CT", "q": "Studying the embryonic development of the nervous system makes it easier to understand the complexity of the adult nervous system. Give one example of how development in the embryonic nervous system explains a more complex structure in the adult nervous system.", "a": "The retina, a PNS structure in the adult, grows from the diencephalon in the embryonic nervous system. The mature connections from the retina through the optic nerve/tract are to the hypothalamus and thalamus of the diencephalon, and to the midbrain, which developed directly adjacent to the diencephalon as the mesencephalon in the embryo."}, {"id": "m5-c13-q34", "ch": 13, "section": "CT", "q": "What happens in development that suggests that there is a special relationship between the skeletal structure of the head and the nervous system?", "a": "The neural crest gives rise to PNS structures (such as ganglia) and also to cartilage and bone of the face and cranium."}, {"id": "m5-c13-q35", "ch": 13, "section": "CT", "q": "Damage to specific regions of the cerebral cortex, such as through a stroke, can result in specific losses of function. What functions would likely be lost by a stroke in the temporal lobe?", "a": "The temporal lobe has sensory functions associated with hearing and vision, as well as being important for memory. A stroke in the temporal lobe can result in specific sensory deficits in these systems (known as agnosias) or losses in memory"}, {"id": "m5-c13-q36", "ch": 13, "section": "CT", "q": "Why do the anatomical inputs to the cerebellum suggest that it can compare motor commands and sensory feedback?", "a": "A copy of descending input from the cerebrum to the spinal cord, through the pons, and sensory feedback from the spinal cord and special senses like balance, through the medulla, both go to the cerebellum. It can therefore send output through the midbrain that will correct spinal cord control of skeletal muscle movements."}, {"id": "m5-c13-q37", "ch": 13, "section": "CT", "q": "Why can the circle of Willis maintain perfusion of the brain even if there is a blockage in one part of the structure?", "a": "The structure is a circular connection of blood vessels, so that blood coming up from one of the arteries can flow in either direction around the circle and avoid any blockage or narrowing of the blood vessels."}, {"id": "m5-c13-q38", "ch": 13, "section": "CT", "q": "Meningitis is an inflammation of the meninges that can have severe effects on neurological function. Why is infection of this structure potentially so dangerous?", "a": "The nerves that connect the periphery to the CNS pass through these layers of tissue and can be damaged by that inflammation, causing a loss of important neurological functions."}, {"id": "m5-c13-q39", "ch": 13, "section": "CT", "q": "Why are ganglia and nerves not surrounded by protective structures like the meninges of the CNS?", "a": "The peripheral nervous tissues are out in the body, sometimes part of other organ systems. There is not a privileged blood supply like there is to the brain and spinal cord, so peripheral nervous tissues do not need the same sort of protections."}, {"id": "m5-c13-q40", "ch": 13, "section": "CT", "q": "Testing for neurological function involves a series of tests of functions associated with the cranial nerves. What functions, and therefore which nerves, are being tested by asking a patient to follow the tip of a pen with their eyes?", "a": "The contraction of extraocular muscles is being tested, which is the function of the oculomotor, trochlear, and abducens nerves."}, {"id": "m5-c14-q12", "ch": 14, "section": "RQ", "q": "What type of receptor cell is responsible for transducing pain stimuli?", "a": "B. nociceptor", "opts": ["A. mechanoreceptor", "B. nociceptor", "C. osmoreceptor", "D. photoreceptor"]}, {"id": "m5-c14-q13", "ch": 14, "section": "RQ", "q": "Which of these cranial nerves is part of the gustatory system?", "a": "D. facial", "opts": ["A. olfactory", "B. trochlear", "C. trigeminal", "D. facial"]}, {"id": "m5-c14-q14", "ch": 14, "section": "RQ", "q": "Which submodality of taste is sensitive to the pH of saliva?", "a": "B. sour", "opts": ["A. umami", "B. sour", "C. bitter", "D. sweet"]}, {"id": "m5-c14-q15", "ch": 14, "section": "RQ", "q": "Axons from which neuron in the retina make up the optic nerve?", "a": "D. retinal ganglion cells", "opts": ["A. amacrine cells", "B. photoreceptors", "C. bipolar cells", "D. retinal ganglion cells"]}, {"id": "m5-c14-q16", "ch": 14, "section": "RQ", "q": "What type of receptor cell is involved in the sensations of sound and balance?", "a": "C. mechanoreceptor", "opts": ["A. photoreceptor", "B. chemoreceptor", "C. mechanoreceptor", "D. nociceptor"]}, {"id": "m5-c14-q17", "ch": 14, "section": "RQ", "q": "Which of these sensory modalities does not pass through the ventral posterior thalamus?", "a": "C. audition", "opts": ["A. gustatory", "B. proprioception", "C. audition", "D. nociception"]}, {"id": "m5-c14-q18", "ch": 14, "section": "RQ", "q": "Which nucleus in the medulla is connected to the inferior colliculus?", "a": "D. cochlear nucleus", "opts": ["A. solitary nucleus", "B. vestibular nucleus", "C. chief sensory nucleus", "D. cochlear nucleus"]}, {"id": "m5-c14-q19", "ch": 14, "section": "RQ", "q": "Visual stimuli in the upper-left visual field will be processed in what region of the primary visual cortex?", "a": "A. inferior right", "opts": ["A. inferior right", "B. inferior left", "C. superior right", "D. superior left"]}, {"id": "m5-c14-q20", "ch": 14, "section": "RQ", "q": "Which location on the body has the largest region of somatosensory cortex representing it, according to the sensory homunculus?", "a": "A. lips", "opts": ["A. lips", "B. thigh", "C. elbow", "D. neck"]}, {"id": "m5-c14-q21", "ch": 14, "section": "RQ", "q": "Which of the following is a direct target of the vestibular ganglion?", "a": "B. cerebellum", "opts": ["A. superior colliculus", "B. cerebellum", "C. thalamus", "D. optic chiasm"]}, {"id": "m5-c14-q22", "ch": 14, "section": "RQ", "q": "Which region of the frontal lobe is responsible for initiating movement by directly connecting to cranial and spinal motor neurons?", "a": "D. primary motor cortex", "opts": ["A. prefrontal cortex", "B. supplemental motor area", "C. premotor cortex", "D. primary motor cortex"]}, {"id": "m5-c14-q23", "ch": 14, "section": "RQ", "q": "Which extrapyramidal tract incorporates equilibrium sensations with motor commands to aid in posture and movement?", "a": "B. vestibulospinal tract", "opts": ["A. tectospinal tract", "B. vestibulospinal tract", "C. reticulospinal tract", "D. corticospinal tract"]}, {"id": "m5-c14-q24", "ch": 14, "section": "RQ", "q": "Which region of gray matter in the spinal cord contains motor neurons that innervate skeletal muscles?", "a": "A. ventral horn", "opts": ["A. ventral horn", "B. dorsal horn", "C. lateral horn", "D. lateral column"]}, {"id": "m5-c14-q25", "ch": 14, "section": "RQ", "q": "What type of reflex can protect the foot when a painful stimulus is sensed?", "a": "C. withdrawal reflex", "opts": ["A. stretch reflex", "B. gag reflex", "C. withdrawal reflex", "D. corneal reflex"]}, {"id": "m5-c14-q26", "ch": 14, "section": "RQ", "q": "What is the name for the topographical representation of the sensory input to the somatosensory cortex?", "a": "A. homunculus", "opts": ["A. homunculus", "B. homo sapiens", "C. postcentral gyrus", "D. primary cortex"]}, {"id": "m5-c14-q27", "ch": 14, "section": "CT", "q": "The sweetener known as stevia can replace glucose in food. What does the molecular similarity of stevia to glucose mean for the gustatory sense?", "a": "The stevia molecule is similar to glucose such that it will bind to the glucose receptor in sweet-sensitive taste buds. However, it is not a substrate for the ATP-generating metabolism within cells."}, {"id": "m5-c14-q28", "ch": 14, "section": "CT", "q": "Why does the blind spot from the optic disc in either eye not result in a blind spot in the visual field?", "a": "The visual field for each eye is projected onto the retina as light is focused by the lens. The visual information from the right visual field falls on the left side of the retina and vice versa. The optic disc in the right eye is on the medial side of the fovea, which would be the left side of the retina. However, the optic disc in the left eye would be on the right side of that fovea, so the right visual field falls on the side of the retina in the left field where there is no blind spot."}, {"id": "m5-c14-q29", "ch": 14, "section": "CT", "q": "Following a motorcycle accident, the victim loses the ability to move the right leg but has normal control over the left one, suggesting a hemisection somewhere in the thoracic region of the spinal cord. What sensory deficits would be expected in terms of touch versus pain? Explain your answer.", "a": "The right leg would feel painful stimuli, but not touch, because the spinothalamic tract decussates at the level of entry, which would be below the injury, whereas the dorsal column system does not decussate until reaching the brain stem, which would be above the injury and thus those fibers would be damaged."}, {"id": "m5-c14-q30", "ch": 14, "section": "CT", "q": "A pituitary tumor can cause perceptual losses in the lateral visual field. The pituitary gland is located directly inferior to the hypothalamus. Why would this happen?", "a": "As the tumor enlarges, it would press against the optic chiasm, and fibers from the medial retina would be disrupted. These fibers carry information about the lateral visual field because the visual scene is reversed as the light passes through the pupil and lens."}, {"id": "m5-c14-q31", "ch": 14, "section": "CT", "q": "The prefrontal lobotomy is a drastic—and largely out-of-practice—procedure used to disconnect that portion of the cerebral cortex from the rest of the frontal lobe and the diencephalon as a psychiatric therapy. Why would this have been thought necessary for someone with a potentially uncontrollable behavior?", "a": "The prefrontal cortex is involved in decision-making functions that lead to motor responses through connections to the more posterior motor regions. These early aspects of behavior are often associated with a person’s personality, so disrupting those connections will lead to severe changes in behavior."}, {"id": "m5-c14-q32", "ch": 14, "section": "CT", "q": "If a reflex is a limited circuit within the somatic system, why do physical and neurological exams include them to test the health of an individual?", "a": "Though reflexes are simple circuits within the nervous system, they are representative of the more involved circuits of the somatic nervous system and can be used to quickly assess the state of neurological function for a person."}]}];
const STORE_KEY = 'apbio_status_v1';
function loadStatus(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};} }
function saveStatus(s){ try{localStorage.setItem(STORE_KEY, JSON.stringify(s));}catch(e){} }
let status = loadStatus();
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(scr){ ['home','study','result'].forEach(s=>$(s).style.display=(s===scr?'block':'none')); }
function allCards(){ return MODULES.flatMap(m=>m.cards); }

function renderHome(){
  const cont=$('modules'); cont.innerHTML='';
  const groups=[{key:'all',name:'All Modules',sub:'Every chapter combined',cards:allCards()}].concat(MODULES);
  groups.forEach(m=>{
    const total=m.cards.length; let g=0,r=0,u=0;
    m.cards.forEach(c=>{const st=status[c.id]; if(st==='green')g++; else if(st==='red')r++; else u++;});
    const div=document.createElement('div'); div.className='module';
    div.innerHTML=
      '<h2>'+m.name+'</h2>'+
      '<div class="msub">'+m.sub+' &middot; '+total+' cards</div>'+
      '<div class="stats">'+
        '<span><span class="dot" style="background:var(--green)"></span><b>'+g+'</b> known</span>'+
        '<span><span class="dot" style="background:var(--red)"></span><b>'+r+'</b> missed</span>'+
        '<span><span class="dot" style="background:var(--muted)"></span><b>'+u+'</b> new</span>'+
      '</div>'+
      '<div class="row">'+
        '<button class="btn-all">Study all ('+total+')</button>'+
        '<button class="btn-missed"'+(r===0?' disabled':'')+'>Missed only ('+r+')</button>'+
      '</div>';
    const btns=div.querySelectorAll('button');
    btns[0].onclick=()=>startSession(m.cards.slice(), m.name, 'all');
    btns[1].onclick=()=>startSession(m.cards.filter(c=>status[c.id]==='red'), m.name+' &middot; misses', 'missed');
    cont.appendChild(div);
  });
}

let S=null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startSession(cards,name,mode){
  if(!cards.length) return;
  S={queue:shuffle(cards.slice()),idx:0,flipped:false,g:0,r:0,missed:[],name:name,mode:mode};
  show('study'); renderCard();
}
function setFace(toAnswer){
  const c=S.queue[S.idx]; S.flipped=toAnswer;
  if(toAnswer){
    $('qlabel').textContent='Answer';
    $('cardtext').textContent=c.a; $('cardtext').className='atext';
    $('cardopts').style.display='none';
    $('cardhint').textContent='tap card to flip back to question'; $('cardhint').style.display='block';
    $('flipBtn').style.display='none';
    $('controls').style.display='flex';
  } else {
    $('qlabel').textContent='Question'+(c.ch?(' · Ch '+c.ch):'');
    $('cardtext').textContent=c.q; $('cardtext').className='qtext';
    if(c.opts && c.opts.length){ $('cardopts').innerHTML=c.opts.map(o=>'<div class="opt">'+esc(o)+'</div>').join(''); $('cardopts').style.display='block'; }
    else { $('cardopts').style.display='none'; }
    $('cardhint').textContent='tap to reveal · space'; $('cardhint').style.display='block';
    $('flipBtn').style.display='block';
    $('controls').style.display='none';
  }
}
function renderCard(){
  $('poslabel').textContent=(S.idx+1)+' / '+S.queue.length;
  $('gtally').textContent=S.g; $('rtally').textContent=S.r;
  $('progbar').style.width=(S.idx/S.queue.length*100)+'%';
  setFace(false);
}
function flip(){ setFace(true); }
function toggleFlip(){ setFace(!S.flipped); }
function mark(ok){
  if(!S.flipped) return; const c=S.queue[S.idx];
  status[c.id]=ok?'green':'red'; saveStatus(status);
  if(ok) S.g++; else {S.r++; S.missed.push(c);}
  S.idx++;
  if(S.idx>=S.queue.length) endRound(); else renderCard();
}
function endRound(){
  $('progbar').style.width='100%';
  $('resG').textContent=S.g; $('resR').textContent=S.r;
  $('resTitle').textContent = S.r===0 ? 'Perfect round! 🎉' : 'Round complete';
  $('reviewMissedBtn').disabled=S.missed.length===0;
  $('reviewMissedBtn').textContent='Review missed ('+S.missed.length+')';
  show('result');
}
$('card').onclick=toggleFlip;
$('flipBtn').onclick=flip;
$('greenBtn').onclick=()=>mark(true);
$('redBtn').onclick=()=>mark(false);
$('quitBtn').onclick=()=>{renderHome(); show('home');};
$('homeBtn').onclick=()=>{renderHome(); show('home');};
$('reviewMissedBtn').onclick=()=>startSession(S.missed.slice(), S.name, 'missed');
$('againBtn').onclick=()=>startSession(S.queue.slice(), S.name, S.mode);
$('resetBtn').onclick=()=>{ if(confirm('Erase all green/red progress on this device?')){status={}; saveStatus(status); renderHome();} };
document.addEventListener('keydown',e=>{
  if($('study').style.display!=='block') return;
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); toggleFlip(); }
  else if(S.flipped && (e.key==='g'||e.key==='ArrowRight'||e.key==='1')) mark(true);
  else if(S.flipped && (e.key==='r'||e.key==='ArrowLeft'||e.key==='2')) mark(false);
});
renderHome(); show('home');
</script>
</body>
</html>
