differences between eccrine and apocrine sweat glands.", "a": "Eccrine sweat glands are all over the body, especially the forehead and palms of the hand. They release a watery sweat, mixed with some metabolic waste and antibodies. Apocrine glands are associated with hair follicles. They are larger than eccrine sweat glands and lie deeper in the dermis, sometimes even reaching the hypodermis. They release a thicker sweat that is often decomposed by bacteria on the skin, resulting in an unpleasant odor."}, {"id": "m2-c5-q28", "ch": 5, "section": "CT", "q": "Describe the structure and composition of nails.", "a": "Nails are composed of densely packed dead keratinocytes. They protect the fingers and toes from mechanical stress. The nail body is formed on the nail bed, which is at the nail root. Nail folds, folds of skin that overlap the nail on its side, secure the nail to the body. The crescent-shaped region at the base of the nail is the lunula."}, {"id": "m2-c5-q29", "ch": 5, "section": "CT", "q": "Why do people sweat excessively when exercising outside on a hot day?", "a": "Sweating cools the body when it becomes warm. When the body temperature rises, such as when exercising on a hot day, the dermal blood vessels dilate, and the sweat glands begin to secrete more sweat. The evaporation of the sweat from the surface of the skin cools the body by dissipating heat."}, {"id": "m2-c5-q30", "ch": 5, "section": "CT", "q": "Explain your skin’s response to a drop in body core temperature.", "a": "When the core body temperature drops, the body switches to heat-conservation mode. This can include an inhibition to excessive sweating and a decrease of blood flow to the papillary layers of the skin. This reduction of blood flow helps conserve body heat."}, {"id": "m2-c5-q31", "ch": 5, "section": "CT", "q": "Why do teenagers often experience acne?", "a": "Acne results from a blockage of sebaceous glands by sebum. The blockage causes blackheads to form, which are susceptible to infection. The infected tissue then becomes red and inflamed. Teenagers experience this at high rates because the sebaceous glands become active during puberty. Hormones that are especially active during puberty stimulate the release of sebum, leading in many cases to blockages."}, {"id": "m2-c5-q32", "ch": 5, "section": "CT", "q": "Why do scars look different from surrounding skin?", "a": "Scars are made of collagen and do not have the cellular structure of normal skin. The tissue is fibrous and does not allow for the regeneration of accessory structures, such as hair follicles, and sweat or sebaceous glands."}, {"id": "m2-c6-q1", "ch": 6, "section": "RQ", "q": "Which function of the skeletal system would be especially important if you were in a car accident?", "a": "B. protection of internal organs", "opts": ["A. storage of minerals", "B. protection of internal organs", "C. facilitation of movement", "D. fat storage"]}, {"id": "m2-c6-q2", "ch": 6, "section": "RQ", "q": "Bone tissue can be described as ________.", "a": "D. dense, hard connective tissue", "opts": ["A. dead calcified tissue", "B. cartilage", "C. the skeletal system", "D. dense, hard connective tissue"]}, {"id": "m2-c6-q3", "ch": 6, "section": "RQ", "q": "Without red marrow, bones would not be able to ________.", "a": "C. make blood cells", "opts": ["A. store phosphate", "B. store calcium", "C. make blood cells", "D. move like levers"]}, {"id": "m2-c6-q4", "ch": 6, "section": "RQ", "q": "Yellow marrow has been identified as ________.", "a": "A. an area of fat storage", "opts": ["A. an area of fat storage", "B. a point of attachment for muscles", "C. the hard portion of bone", "D. the cause of kyphosis"]}, {"id": "m2-c6-q5", "ch": 6, "section": "RQ", "q": "Which of the following can be found in areas of movement?", "a": "B. cartilage", "opts": ["A. hematopoiesis", "B. cartilage", "C. yellow marrow", "D. red marrow"]}, {"id": "m2-c6-q6", "ch": 6, "section": "RQ", "q": "The skeletal system is made of ________.", "a": "B. bones and cartilage", "opts": ["A. muscles and tendons", "B. bones and cartilage", "C. vitreous humor", "D. minerals and fat"]}, {"id": "m2-c6-q7", "ch": 6, "section": "RQ", "q": "Most of the bones of the arms and hands are long bones; however, the bones in the wrist are categorized as ________.", "a": "B. short bones", "opts": ["A. flat bones", "B. short bones", "C. sesamoid bones", "D. irregular bones"]}, {"id": "m2-c6-q8", "ch": 6, "section": "RQ", "q": "Sesamoid bones are found embedded in ________.", "a": "D. tendons", "opts": ["A. joints", "B. muscles", "C. ligaments", "D. tendons"]}, {"id": "m2-c6-q9", "ch": 6, "section": "RQ", "q": "Bones that surround the spinal cord are classified as ________ bones.", "a": "A. irregular", "opts": ["A. irregular", "B. sesamoid", "C. flat", "D. short"]}, {"id": "m2-c6-q10", "ch": 6, "section": "RQ", "q": "Which category of bone is among the most numerous in the skeleton?", "a": "A. long bone", "opts": ["A. long bone", "B. sesamoid bone", "C. short bone", "D. flat bone"]}, {"id": "m2-c6-q11", "ch": 6, "section": "RQ", "q": "Long bones enable body movement by acting as a ________.", "a": "C. lever", "opts": ["A. counterweight", "B. resistive force", "C. lever", "D. fulcrum"]}, {"id": "m2-c6-q12", "ch": 6, "section": "RQ", "q": "Which of the following occurs in the spongy bone of the epiphysis?", "a": "C. hematopoiesis", "opts": ["A. bone growth", "B. bone remodeling", "C. hematopoiesis", "D. shock absorption"]}, {"id": "m2-c6-q13", "ch": 6, "section": "RQ", "q": "The diaphysis contains ________.", "a": "B. fat stores", "opts": ["A. the metaphysis", "B. fat stores", "C. spongy bone", "D. compact bone"]}, {"id": "m2-c6-q14", "ch": 6, "section": "RQ", "q": "The fibrous membrane covering the outer surface of the bone is the ________.", "a": "A. periosteum", "opts": ["A. periosteum", "B. epiphysis", "C. endosteum", "D. diaphysis"]}, {"id": "m2-c6-q15", "ch": 6, "section": "RQ", "q": "Which of the following are incapable of undergoing mitosis?", "a": "C. osteoblasts and osteocytes", "opts": ["A. osteoblasts", "B. osteoclasts", "C. osteocytes", "D. osteogenic cells"]}, {"id": "m2-c6-q16", "ch": 6, "section": "RQ", "q": "Which cells do not originate from osteogenic cells?", "a": "D. osteoprogenitor cells", "opts": ["A. osteoblasts", "B. osteoclasts", "C. osteocytes", "D. osteoprogenitor cells"]}, {"id": "m2-c6-q17", "ch": 6, "section": "RQ", "q": "Which of the following are found in compact bone and cancellous bone?", "a": "C. lamellae", "opts": ["A. Haversian systems", "B. Haversian canals", "C. lamellae", "D. lacunae"]}, {"id": "m2-c6-q18", "ch": 6, "section": "RQ", "q": "Which of the following are only found in cancellous bone?", "a": "C. trabeculae", "opts": ["A. canaliculi", "B. Volkmann's canals", "C. trabeculae", "D. calcium salts"]}, {"id": "m2-c6-q19", "ch": 6, "section": "RQ", "q": "The area of a bone where the nutrient foramen passes forms what kind of bone marking?", "a": "A. a hole", "opts": ["A. a hole", "B. a facet", "C. a canal", "D. a fissure"]}, {"id": "m2-c6-q20", "ch": 6, "section": "RQ", "q": "Why is cartilage slow to heal?", "a": "C. because it does not have a blood supply", "opts": ["A. because it eventually develops into bone", "B. because it is semi-solid and flexible", "C. because it does not have a blood supply", "D. because endochondral ossification replaces all cartilage with bone"]}, {"id": "m2-c6-q21", "ch": 6, "section": "RQ", "q": "Why are osteocytes spread out in bone tissue?", "a": "D. Formation of osteoid spreads out the osteoblasts that formed the ossification centers.", "opts": ["A. They develop from mesenchymal cells.", "B. They are surrounded by osteoid.", "C. They travel through the capillaries.", "D. Formation of osteoid spreads out the osteoblasts that formed the ossification centers."]}, {"id": "m2-c6-q22", "ch": 6, "section": "RQ", "q": "In endochondral ossification, what happens to the chondrocytes?", "a": "B. They die in the calcified matrix that surrounds them and form the medullary cavity.", "opts": ["A. They develop into osteocytes.", "B. They die in the calcified matrix that surrounds them and form the medullary cavity.", "C. They grow and form the periosteum.", "D. They group together to form the primary ossification center."]}, {"id": "m2-c6-q23", "ch": 6, "section": "RQ", "q": "Which of the following bones is (are) formed by intramembranous ossification?", "a": "D. the flat bones of the cranium", "opts": ["A. the metatarsals", "B. the femur", "C. the ribs", "D. the flat bones of the cranium"]}, {"id": "m2-c6-q24", "ch": 6, "section": "RQ", "q": "Bones grow in length due to activity in the ________.", "a": "A. epiphyseal plate", "opts": ["A. epiphyseal plate", "B. perichondrium", "C. periosteum", "D. medullary cavity"]}, {"id": "m2-c6-q25", "ch": 6, "section": "RQ", "q": "Bones grow in diameter due to bone formation ________.", "a": "B. beneath the periosteum", "opts": ["A. in the medullary cavity", "B. beneath the periosteum", "C. in the epiphyseal plate", "D. within the metaphysis"]}, {"id": "m2-c6-q26", "ch": 6, "section": "RQ", "q": "Which of the following represents the correct sequence of zones in the epiphyseal plate?", "a": "C. calcification, maturation, proliferation, reserved", "opts": ["A. proliferation, reserved, maturation, calcification", "B. maturation, proliferation, reserved, calcification", "C. calcification, maturation, proliferation, reserved", "D. calcification, reserved, proliferation, maturation"]}, {"id": "m2-c6-q27", "ch": 6, "section": "RQ", "q": "A fracture can be both ________.", "a": "B. open and transverse", "opts": ["A. open and closed", "B. open and transverse", "C. transverse and greenstick", "D. greenstick and comminuted"]}, {"id": "m2-c6-q28", "ch": 6, "section": "RQ", "q": "How can a fractured diaphysis release fat globules into the bloodstream?", "a": "B. The yellow marrow in the diaphysis is exposed and damaged.", "opts": ["A. The bone pierces fat stores in the skin.", "B. The yellow marrow in the diaphysis is exposed and damaged.", "C. The injury triggers the body to release fat from healthy bones.", "D. The red marrow in the fractured bone releases fat to heal the fracture."]}, {"id": "m2-c6-q29", "ch": 6, "section": "RQ", "q": "In a compound fracture, ________.", "a": "D. broken bone pierces the skin", "opts": ["A. the break occurs at an angle to the bone", "B. the broken bone does not tear the skin", "C. one fragment of broken bone is compressed into the other", "D. broken bone pierces the skin"]}, {"id": "m2-c6-q30", "ch": 6, "section": "RQ", "q": "The internal and external calli are replaced by ________.", "a": "B. trabecular bone", "opts": ["A. hyaline cartilage", "B. trabecular bone", "C. osteogenic cells", "D. osteoclasts"]}, {"id": "m2-c6-q31", "ch": 6, "section": "RQ", "q": "The first type of bone to form during fracture repair is ________ bone.", "a": "C. spongy", "opts": ["A. compact", "B. lamellar", "C. spongy", "D. dense"]}, {"id": "m2-c6-q32", "ch": 6, "section": "RQ", "q": "Wolff’s law, which describes the effect of mechanical forces in bone modeling/remodeling, would predict that ________", "a": "A. a right-handed pitcher will have thicker bones in his right arm compared to his left.", "opts": ["A. a right-handed pitcher will have thicker bones in his right arm compared to his left.", "B. a right-handed cyclist will have thicker bones in her right leg compared to her left.", "C. a broken bone will heal thicker than it was before the fracture.", "D. a bed-ridden patient will have thicker bones than an athlete."]}, {"id": "m2-c6-q33", "ch": 6, "section": "RQ", "q": "Calcium cannot be absorbed from the small intestine if ________ is lacking.", "a": "A. vitamin D", "opts": ["A. vitamin D", "B. vitamin K", "C. calcitonin", "D. fluoride"]}, {"id": "m2-c6-q34", "ch": 6, "section": "RQ", "q": "Which one of the following foods is best for bone health? a", "a": "C. leafy green vegetables", "opts": ["A. carrots", "B. liver", "C. leafy green vegetables", "D. oranges"]}, {"id": "m2-c6-q35", "ch": 6, "section": "RQ", "q": "Which of the following hormones are responsible for the adolescent growth spurt?", "a": "A. estrogen and testosterone", "opts": ["A. estrogen and testosterone", "B. calcitonin and calcitriol", "C. growth hormone and parathyroid hormone", "D. thyroxine and progesterone"]}, {"id": "m2-c6-q36", "ch": 6, "section": "RQ", "q": "With respect to their direct effects on osseous tissue, which pair of hormones has actions that oppose each other?", "a": "D. calcitonin and parathyroid hormone", "opts": ["A. estrogen and testosterone", "B. calcitonin and calcitriol", "C. estrogen and progesterone", "D. calcitonin and parathyroid hormone"]}, {"id": "m2-c6-q37", "ch": 6, "section": "RQ", "q": "When calcium levels are too high or too low, which body system is primarily affected?", "a": "D. nervous system", "opts": ["A. skeletal system", "B. endocrine system", "C. digestive system", "D. nervous system"]}, {"id": "m2-c6-q38", "ch": 6, "section": "RQ", "q": "All of the following play a role in calcium homeostasis except", "a": "A. thyroxine", "opts": ["A. thyroxine", "B. calcitonin", "C. parathyroid hormone", "D. vitamin D"]}, {"id": "m2-c6-q39", "ch": 6, "section": "RQ", "q": "Which of the following is most likely to be released when blood calcium levels are elevated?", "a": "B. calcitonin", "opts": ["A. thyroxine", "B. calcitonin", "C. parathyroid hormone", "D. vitamin D"]}, {"id": "m2-c6-q40", "ch": 6, "section": "CT", "q": "The skeletal system is composed of bone and cartilage and has many functions. Choose three of these functions and discuss what features of the skeletal system allow it to accomplish these functions.", "a": "It supports the body. The rigid, yet flexible skeleton acts as a framework to support the other organs of the body. It facilitates movement. The movable joints allow the skeleton to change shape and positions; that is, move. It protects internal organs. Parts of the skeleton enclose or partly enclose various organs of the body including our brain, ears, heart, and lungs. Any trauma to these organs has to be mediated through the skeletal system. It produces blood cells. The central cavity of long bones is filled with marrow. The red marrow is responsible for forming red and white blood cells. It stores and releases minerals and fat. The mineral component of bone, in addition to providing hardness to bone, provides a mineral reservoir that can be tapped as needed. Additionally, the yellow marrow, which is found in the central cavity of long bones along with red marrow, serves as a storage site for fat."}, {"id": "m2-c6-q41", "ch": 6, "section": "CT", "q": "What are the structural and functional differences between a tarsal and a metatarsal?", "a": "Structurally, a tarsal is a short bone, meaning its length, width, and thickness are about equal, while a metatarsal is a long bone whose length is greater than its width. Functionally, the tarsal provides limited motion, while the metatarsal acts as a lever."}, {"id": "m2-c6-q42", "ch": 6, "section": "CT", "q": "What are the structural and functional differences between the femur and the patella?", "a": "Structurally, the femur is a long bone, meaning its length is greater than its width, while the patella, a sesamoid bone, is small and round. Functionally, the femur acts as a lever, while the patella protects the patellar tendon from compressive forces."}, {"id": "m2-c6-q43", "ch": 6, "section": "CT", "q": "If the articular cartilage at the end of one of your long bones were to degenerate, what symptoms do you think you would experience? Why?", "a": "If the articular cartilage at the end of one of your long bones were to deteriorate, which is actually what happens in osteoarthritis, you would experience joint pain at the end of that bone and limitation of motion at that joint because there would be no cartilage to reduce friction between adjacent bones and there would be no cartilage to act as a shock absorber."}, {"id": "m2-c6-q44", "ch": 6, "section": "CT", "q": "In what ways is the structural makeup of compact and spongy bone well suited to their respective functions?", "a": "The densely packed concentric rings of matrix in compact bone are ideal for resisting compressive forces, which is the function of compact bone. The open spaces of the trabeculated network of spongy bone allow spongy bone to support shifts in weight distribution, which is the function of spongy bone."}, {"id": "m2-c6-q45", "ch": 6, "section": "CT", "q": "In what ways do intramembranous and endochondral ossification differ?", "a": "In intramembranous ossification, bone develops directly from sheets of mesenchymal connective tissue, but in endochondral ossification, bone develops by replacing hyaline cartilage. Intramembranous ossification is complete by the end of the adolescent growth spurt, while endochondral ossification lasts into young adulthood. The flat bones of the face, most of the cranial bones, and a good deal of the clavicles (collarbones) are formed via intramembranous ossification, while bones at the base of the skull and the long bones form via endochondral ossification."}, {"id": "m2-c6-q46", "ch": 6, "section": "CT", "q": "Considering how a long bone develops, what are the similarities and differences between a primary and a secondary ossification center?", "a": "A single primary ossification center is present, during endochondral ossification, deep in the periosteal collar. Like the primary ossification center, secondary ossification centers are present during endochondral ossification, but they form later, and there are two of them, one in each epiphysis"}, {"id": "m2-c6-q47", "ch": 6, "section": "CT", "q": "What is the difference between closed reduction and open reduction? In what type of fracture would closed reduction most likely occur? In what type of fracture would open reduction most likely occur?", "a": "In closed reduction, the broken ends of a fractured bone can be reset without surgery. Open reduction requires surgery to return the broken ends of the bone to their correct anatomical position. A partial fracture would likely require closed reduction. A compound fracture would require open reduction."}, {"id": "m2-c6-q48", "ch": 6, "section": "CT", "q": "In terms of origin and composition, what are the differences between an internal callus and an external callus?", "a": "The internal callus is produced by cells in the endosteum and is composed of a fibrocartilaginous matrix. The external callus is produced by cells in the periosteum and consists of hyaline cartilage and bone."}, {"id": "m2-c6-q49", "ch": 6, "section": "CT", "q": "If you were a dietician who had a young female patient with a family history of osteoporosis, what foods would you suggest she include in her diet? Why?", "a": "Since maximum bone mass is achieved by age 30, I would want this patient to have adequate calcium and vitamin D in her diet. To do this, I would recommend ingesting milk and other dairy foods, green leafy vegetables, and intact canned sardines so she receives sufficient calcium. Intact salmon would be a good source for calcium and vitamin D. Other fatty fish would also be a good vitamin D source."}, {"id": "m2-c6-q50", "ch": 6, "section": "CT", "q": "During the early years of space exploration our astronauts, who had been floating in space, would return to earth showing significant bone loss dependent on how long they were in space. Discuss how this might happen and what could be done to alleviate this condition.", "a": "Astronauts floating in space were not exerting significant pressure on their bones; they were “weightless.” Without the force of gravity exerting pressure on the bones, bone mass was lost. To alleviate this condition, astronauts now do resistive exercise designed to apply forces to the bones and thus help keep them healthy."}, {"id": "m2-c6-q51", "ch": 6, "section": "CT", "q": "An individual with very low levels of vitamin D presents themselves to you complaining of seemingly fragile bones. Explain how these might be connected.", "a": "Vitamin D is required for calcium absorption by the gut. Low vitamin D could lead to insufficient levels of calcium in the blood so the calcium is being released from the bones. The reduction of calcium from the bones can make them weak and subject to fracture."}, {"id": "m2-c6-q52", "ch": 6, "section": "CT", "q": "Describe the effects caused when the parathyroid gland fails to respond to calcium bound to its receptors.", "a": "Under “normal” conditions, receptors in the parathyroid glands bind blood calcium. When the receptors are full, the parathyroid gland stops secreting PTH. In the condition described, the parathyroid glands are not responding to the signal that there is sufficient calcium in the blood and they keep releasing PTH, which causes the bone to release more calcium into the blood. Ultimately, the bones become fragile and hypercalcemia can result."}]}, {"key": "m3", "name": "Module 3", "sub": "Ch 7–9 · Axial · Appendicular · Joints", "cards": [{"id": "m3-c7-q7", "ch": 7, "section": "RQ", "q": "Which of the following is part of the axial skeleton?", "a": "D. vertebral column", "opts": ["A. shoulder bones", "B. thigh bone", "C. foot bones", "D. vertebral column"]}, {"id": "m3-c7-q8", "ch": 7, "section": "RQ", "q": "Which of the following is a function of the axial skeleton?", "a": "C. supports trunk of body", "opts": ["A. allows for movement of the wrist and hand", "B. protects nerves and blood vessels at the elbow", "C. supports trunk of body", "D. allows for movements of the ankle and foot"]}, {"id": "m3-c7-q9", "ch": 7, "section": "RQ", "q": "The axial skeleton ________.", "a": "B. forms the vertical axis of the body", "opts": ["A. consists of 126 bones", "B. forms the vertical axis of the body", "C. includes all bones of the body trunk and limbs", "D. includes only the bones of the lower limbs"]}, {"id": "m3-c7-q10", "ch": 7, "section": "RQ", "q": "Which of the following is a bone of the brain case?", "a": "A. parietal bone", "opts": ["A. parietal bone", "B. zygomatic bone", "C. maxillary bone", "D. lacrimal bone"]}, {"id": "m3-c7-q11", "ch": 7, "section": "RQ", "q": "The lambdoid suture joins the parietal bone to the ________.", "a": "B. occipital bone", "opts": ["A. frontal bone", "B. occipital bone", "C. other parietal bone", "D. temporal bone"]}, {"id": "m3-c7-q12", "ch": 7, "section": "RQ", "q": "The middle cranial fossa ________.", "a": "D. has the foramen rotundum, foramen ovale, and foramen spinosum", "opts": ["A. is bounded anteriorly by the petrous ridge", "B. is bounded posteriorly by the lesser wing of the sphenoid bone", "C. is divided at the midline by a small area of the ethmoid bone", "D. has the foramen rotundum, foramen ovale, and foramen spinosum"]}, {"id": "m3-c7-q13", "ch": 7, "section": "RQ", "q": "The paranasal sinuses are ________.", "a": "A. air-filled spaces found within the frontal, maxilla, sphenoid, and ethmoid bones only", "opts": ["A. air-filled spaces found within the frontal, maxilla, sphenoid, and ethmoid bones only", "B. air-filled spaces found within all bones of the skull", "C. not connected to the nasal cavity", "D. divided at the midline by the nasal septum"]}, {"id": "m3-c7-q14", "ch": 7, "section": "RQ", "q": "Parts of the sphenoid bone include the ________.", "a": "A. sella turcica", "opts": ["A. sella turcica", "B. squamous portion", "C. glabella", "D. zygomatic process"]}, {"id": "m3-c7-q15", "ch": 7, "section": "RQ", "q": "The bony openings of the skull include the ________.", "a": "D. hypoglossal canal, which is located in the posterior cranial fossa", "opts": ["A. carotid canal, which is located in the anterior cranial fossa", "B. superior orbital fissure, which is located at the superior margin of the anterior orbit", "C. mental foramen, which is located just below the orbit", "D. hypoglossal canal, which is located in the posterior cranial fossa"]}, {"id": "m3-c7-q16", "ch": 7, "section": "RQ", "q": "The cervical region of the vertebral column consists of ________.", "a": "A. seven vertebrae", "opts": ["A. seven vertebrae", "B. 12 vertebrae", "C. five vertebrae", "D. a single bone derived from the fusion of five vertebrae"]}, {"id": "m3-c7-q17", "ch": 7, "section": "RQ", "q": "The primary curvatures of the vertebral column ________.", "a": "B. are remnants of the original fetal curvature", "opts": ["A. include the lumbar curve", "B. are remnants of the original fetal curvature", "C. include the cervical curve", "D. develop after the time of birth"]}, {"id": "m3-c7-q18", "ch": 7, "section": "RQ", "q": "A typical vertebra has ________.", "a": "C. lamina that spans between the transverse process and spinous process", "opts": ["A. a vertebral foramen that passes through the body", "B. a superior articular process that projects downward to articulate with the superior portion of the next lower vertebra", "C. lamina that spans between the transverse process and spinous process", "D. a pair of laterally projecting spinous processes"]}, {"id": "m3-c7-q19", "ch": 7, "section": "RQ", "q": "A typical lumbar vertebra has ________.", "a": "A. a short, rounded spinous process", "opts": ["A. a short, rounded spinous process", "B. a bifid spinous process", "C. articulation sites for ribs", "D. a transverse foramen"]}, {"id": "m3-c7-q20", "ch": 7, "section": "RQ", "q": "Which is found only in the cervical region of the vertebral column?", "a": "A. nuchal ligament", "opts": ["A. nuchal ligament", "B. ligamentum flavum", "C. supraspinous ligament", "D. anterior longitudinal ligament"]}, {"id": "m3-c7-q21", "ch": 7, "section": "RQ", "q": "The sternum ________.", "a": "B. has the sternal angle located between the manubrium and body", "opts": ["A. consists of only two parts, the manubrium and xiphoid process", "B. has the sternal angle located between the manubrium and body", "C. receives direct attachments from the costal cartilages of all 12 pairs of ribs", "D. articulates directly with the thoracic vertebrae"]}, {"id": "m3-c7-q22", "ch": 7, "section": "RQ", "q": "The sternal angle is the ________.", "a": "D. junction between the manubrium and body", "opts": ["A. junction between the body and xiphoid process", "B. site for attachment of the clavicle", "C. site for attachment of the floating ribs", "D. junction between the manubrium and body"]}, {"id": "m3-c7-q23", "ch": 7, "section": "RQ", "q": "The tubercle of a rib ________.", "a": "A. is for articulation with the transverse process of a thoracic vertebra", "opts": ["A. is for articulation with the transverse process of a thoracic vertebra", "B. is for articulation with the body of a thoracic vertebra", "C. provides for passage of blood vessels and a nerve", "D. is the area of greatest rib curvature"]}, {"id": "m3-c7-q24", "ch": 7, "section": "RQ", "q": "True ribs are ________.", "a": "D. attached via their costal cartilage directly to the sternum", "opts": ["A. ribs 8–12", "B. attached via their costal cartilage to the next higher rib", "C. made entirely of bone, and thus do not have a costal cartilage", "D. attached via their costal cartilage directly to the sternum"]}, {"id": "m3-c7-q25", "ch": 7, "section": "RQ", "q": "Embryonic development of the axial skeleton involves ________.", "a": "B. endochondral ossification, which forms the ribs and sternum", "opts": ["A. intramembranous ossification, which forms the facial bones", "B. endochondral ossification, which forms the ribs and sternum", "C. the notochord, which produces the cartilage models for the vertebrae", "D. the formation of hyaline cartilage models, which give rise to the flat bones of the skull"]}, {"id": "m3-c7-q26", "ch": 7, "section": "RQ", "q": "A fontanelle ________.", "a": "D. is the area of fibrous connective tissue found at birth between the brain case bones", "opts": ["A. is the cartilage model for a vertebra that later is converted into bone", "B. gives rise to the facial bones and vertebrae", "C. is the rod-like structure that runs the length of the early embryo", "D. is the area of fibrous connective tissue found at birth between the brain case bones"]}, {"id": "m3-c7-q27", "ch": 7, "section": "CT", "q": "Define the two divisions of the skeleton.", "a": "The axial skeleton forms the vertical axis of the body and includes the bones of the head, neck, back, and chest of the body. It consists of 80 bones that include the skull, vertebral column, and thoracic cage. The appendicular skeleton consists of 126 bones and includes all bones of the upper and lower limbs."}, {"id": "m3-c7-q28", "ch": 7, "section": "CT", "q": "Discuss the functions of the axial skeleton", "a": "The axial skeleton supports the head, neck, back, and chest of the body and allows for movements of these body regions. It also gives bony protections for the brain, spinal cord, heart, and lungs; stores fat and minerals; and houses the blood-cell producing tissue."}, {"id": "m3-c7-q29", "ch": 7, "section": "CT", "q": "Define and list the bones that form the brain case or support the facial structures.", "a": "The brain case is that portion of the skull that surrounds and protects the brain. It is subdivided into the rounded top of the skull, called the calvaria, and the base of the skull. There are eight bones that form the brain case. These are the paired parietal and temporal bones, plus the unpaired frontal, occipital, sphenoid, and ethmoid bones. The facial bones support the facial structures, and form the upper and lower jaws, nasal cavity, nasal septum, and orbit. There are 14 facial bones. These are the paired maxillary, palatine, zygomatic, nasal, lacrimal, and inferior nasal conchae bones, and the unpaired vomer and mandible bones."}, {"id": "m3-c7-q30", "ch": 7, "section": "CT", "q": "Identify the major sutures of the skull, their locations, and the bones united by each.", "a": "The coronal suture passes across the top of the anterior skull. It unites the frontal bone anteriorly with the right and left parietal bones. The sagittal suture runs at the midline on the top of the skull. It unites the right and left parietal bones with each other. The squamous suture is a curved suture located on the lateral side of the skull. It unites the squamous portion of the temporal bone to the parietal bone. The lambdoid suture is located on the posterior skull and has an inverted V-shape. It unites the occipital bone with the right and left parietal bones."}, {"id": "m3-c7-q31", "ch": 7, "section": "CT", "q": "Describe the anterior, middle, and posterior cranial fossae and their boundaries, and give the midline structure that divides each into right and left areas.", "a": "The anterior cranial fossa is the shallowest of the three cranial fossae. It extends from the frontal bone anteriorly to the lesser wing of the sphenoid bone posteriorly. It is divided at the midline by the crista galli and cribriform plates of the ethmoid bone. The middle cranial fossa is located in the central skull, and is deeper than the anterior fossa. The middle fossa extends from the lesser wing of the sphenoid bone anteriorly to the petrous ridge posteriorly. It is divided at the midline by the sella turcica. The posterior cranial fossa is the deepest fossa. It extends from the petrous ridge anteriorly to the occipital bone posteriorly. The large foramen magnum is located at the midline of the posterior fossa."}, {"id": "m3-c7-q32", "ch": 7, "section": "CT", "q": "Describe the parts of the nasal septum in both the dry and living skull.", "a": "There are two bony parts of the nasal septum in the dry skull. The perpendicular plate of the ethmoid bone forms the superior part of the septum. The vomer bone forms the inferior and posterior parts of the septum. In the living skull, the septal cartilage completes the septum by filling in the anterior area between the bony components and extending outward into the nose."}, {"id": "m3-c7-q33", "ch": 7, "section": "CT", "q": "Describe the vertebral column and define each region.", "a": "The adult vertebral column consists of 24 vertebrae, plus the sacrum and coccyx. The vertebrae are subdivided into cervical, thoracic, and lumbar regions. There are seven cervical vertebrae (C1–C7), 12 thoracic vertebrae (T1–T12), and five lumbar vertebrae (L1–L5). The sacrum is derived from the fusion of five sacral vertebrae and the coccyx is formed by the fusion of four small coccygeal vertebrae."}, {"id": "m3-c7-q34", "ch": 7, "section": "CT", "q": "Describe a typical vertebra.", "a": "A typical vertebra consists of an anterior body and a posterior vertebral arch. The body serves for weight bearing. The vertebral arch surrounds and protects the spinal cord. The vertebral arch is formed by the pedicles, which are attached to the posterior side of the vertebral body, and the lamina, which come together to form the top of the arch. A pair of transverse processes extends laterally from the vertebral arch, at the junction between each pedicle and lamina. The spinous process extends posteriorly from the top of the arch. A pair of superior articular processes project upward and a pair of inferior articular processes project downward. Together, the notches found in the margins of the pedicles of adjacent vertebrae form an intervertebral foramen."}, {"id": "m3-c7-q35", "ch": 7, "section": "CT", "q": "Describe the sacrum.", "a": "The sacrum is a single, triangular-shaped bone formed by the fusion of five sacral vertebrae. On the posterior sacrum, the median sacral crest is derived from the fused spinous processes, and the lateral sacral crest results from the fused transverse processes. The sacral canal contains the sacral spinal nerves, which exit via the anterior (ventral) and posterior (dorsal) sacral foramina. The sacral promontory is the anterior lip. The sacrum also forms the posterior portion of the pelvis."}, {"id": "m3-c7-q36", "ch": 7, "section": "CT", "q": "Describe the structure and function of an intervertebral disc.", "a": "An intervertebral disc fills in the space between adjacent vertebrae, where it provides padding and weight-bearing ability, and allows for movements between the vertebrae. It consists of an outer anulus fibrosus and an inner nucleus pulposus. The anulus fibrosus strongly anchors the adjacent vertebrae to each other, and the high water content of the nucleus pulposus resists compression for weight bearing and can change shape to allow for vertebral column movements."}, {"id": "m3-c7-q37", "ch": 7, "section": "CT", "q": "Define the ligaments of the vertebral column.", "a": "The anterior longitudinal ligament is attached to the vertebral bodies on the anterior side of the vertebral column. The supraspinous ligament is located on the posterior side, where it interconnects the thoracic and lumbar spinous processes. In the posterior neck, this ligament expands to become the nuchal ligament, which attaches to the cervical spinous processes and the base of the skull. The posterior longitudinal ligament and ligamentum flavum are located inside the vertebral canal. The posterior longitudinal ligament unites the posterior sides of the vertebral bodies. The ligamentum flavum unites the lamina of adjacent vertebrae."}, {"id": "m3-c7-q38", "ch": 7, "section": "CT", "q": "Define the parts and functions of the thoracic cage.", "a": "The thoracic cage is formed by the 12 pairs of ribs with their costal cartilages and the sternum. The ribs are attached posteriorly to the 12 thoracic vertebrae and most are anchored anteriorly either directly or indirectly to the sternum. The thoracic cage functions to protect the heart and lungs."}, {"id": "m3-c7-q39", "ch": 7, "section": "CT", "q": "Describe the parts of the sternum.", "a": "The sternum consists of the manubrium, body, and xiphoid process. The manubrium forms the expanded, superior end of the sternum. It has a jugular (suprasternal) notch, a pair of clavicular notches for articulation with the clavicles, and receives the costal cartilage of the first rib. The manubrium is joined to the body of the sternum at the sternal angle, which is also the site for attachment of the second rib costal cartilages. The body receives the costal cartilage attachments for ribs 3–7. The small xiphoid process forms the inferior tip of the sternum."}, {"id": "m3-c7-q40", "ch": 7, "section": "CT", "q": "Discuss the parts of a typical rib.", "a": "A typical rib is a flattened, curved bone. The head of a rib is attached posteriorly to the costal facets of the thoracic vertebrae. The rib tubercle articulates with the transverse process of a thoracic vertebra. The angle is the area of greatest rib curvature and forms the largest portion of the thoracic cage. The body (shaft) of a rib extends anteriorly and terminates at the attachment to its costal cartilage. The shallow costal groove runs along the inferior margin of a rib and carries blood vessels and a nerve."}, {"id": "m3-c7-q41", "ch": 7, "section": "CT", "q": "Define the classes of ribs.", "a": "Ribs are classified based on if and how their costal cartilages attach to the sternum. True (vertebrosternal) ribs are ribs 1–7. The costal cartilage for each of these attaches directly to the sternum. False (vertebrochondral) ribs, 8–12, are attached either indirectly or not at all to the sternum. Ribs 8–10 are attached indirectly to the sternum. For these ribs, the costal cartilage of each attaches to the cartilage of the next higher rib. The last false ribs (11–12) are also called floating (vertebral) ribs, because these ribs do not attach to the sternum at all. Instead, the ribs and their small costal cartilages terminate within the muscles of the lateral abdominal wall."}, {"id": "m3-c7-q42", "ch": 7, "section": "CT", "q": "Discuss the processes by which the brain-case bones of the skull are formed and grow during skull enlargement.", "a": "The brain-case bones that form the top and sides of the skull are produced by intramembranous ossification. In this, mesenchyme from the sclerotome portion of the somites accumulates at the site of the future bone and differentiates into bone-producing cells. These generate areas of bone that are initially separated by wide regions of fibrous connective tissue called fontanelles. After birth, as the bones enlarge, the fontanelles disappear. However, the bones remain separated by the sutures, where bone and skull growth can continue until the adult size is obtained."}, {"id": "m3-c7-q43", "ch": 7, "section": "CT", "q": "Discuss the process that gives rise to the base and facial bones of the skull.", "a": "The facial bones and base of the skull arise via the process of endochondral ossification. This process begins with the localized accumulation of mesenchyme tissue at the sites of the future bones. The mesenchyme differentiates into hyaline cartilage, which forms a cartilage model of the future bone. The cartilage allows for growth and enlargement of the model. It is gradually converted into bone over time."}, {"id": "m3-c7-q44", "ch": 7, "section": "CT", "q": "Discuss the development of the vertebrae, ribs, and sternum.", "a": "The vertebrae, ribs, and sternum all develop via the process of endochondral ossification. Mesenchyme tissue from the sclerotome portion of the somites accumulates on either side of the notochord and produces hyaline cartilage models for each vertebra. In the thorax region, a portion of this cartilage model splits off to form the ribs. Similarly, mesenchyme forms cartilage models for the right and left halves of the sternum. The ribs then become attached anteriorly to the developing sternum, and the two halves of sternum fuse together. Ossification of the cartilage model into bone occurs within these structures over time. This process continues until each is converted into bone, except for the sternal ends of the ribs, which remain as the costal cartilages."}, {"id": "m3-c8-q10", "ch": 8, "section": "RQ", "q": "Which part of the clavicle articulates with the manubrium?", "a": "B. sternal end", "opts": ["A. shaft", "B. sternal end", "C. acromial end", "D. coracoid process"]}, {"id": "m3-c8-q11", "ch": 8, "section": "RQ", "q": "A shoulder separation results from injury to the ________.", "a": "C. acromioclavicular joint", "opts": ["A. glenohumeral joint", "B. costoclavicular joint", "C. acromioclavicular joint", "D. sternoclavicular joint"]}, {"id": "m3-c8-q12", "ch": 8, "section": "RQ", "q": "Which feature lies between the spine and superior border of the scapula?", "a": "D. supraspinous fossa", "opts": ["A. suprascapular notch", "B. glenoid cavity", "C. superior angle", "D. supraspinous fossa"]}, {"id": "m3-c8-q13", "ch": 8, "section": "RQ", "q": "What structure is an extension of the spine of the scapula?", "a": "A. acromion", "opts": ["A. acromion", "B. coracoid process", "C. supraglenoid tubercle", "D. glenoid cavity"]}, {"id": "m3-c8-q14", "ch": 8, "section": "RQ", "q": "Name the short, hook-like bony process of the scapula that projects anteriorly.", "a": "C. coracoid process", "opts": ["A. acromial process", "B. clavicle", "C. coracoid process", "D. glenoid fossa"]}, {"id": "m3-c8-q15", "ch": 8, "section": "RQ", "q": "How many bones are there in the upper limbs combined?", "a": "D. 60", "opts": ["A. 20", "B. 30", "C. 40", "D. 60"]}, {"id": "m3-c8-q16", "ch": 8, "section": "RQ", "q": "Which bony landmark is located on the lateral side of the proximal humerus?", "a": "A. greater tubercle", "opts": ["A. greater tubercle", "B. trochlea", "C. lateral epicondyle", "D. lesser tubercle"]}, {"id": "m3-c8-q17", "ch": 8, "section": "RQ", "q": "Which region of the humerus articulates with the radius as part of the elbow joint?", "a": "C. capitulum", "opts": ["A. trochlea", "B. styloid process", "C. capitulum", "D. olecranon process"]}, {"id": "m3-c8-q18", "ch": 8, "section": "RQ", "q": "Which is the lateral-most carpal bone of the proximal row?", "a": "D. scaphoid", "opts": ["A. trapezium", "B. hamate", "C. pisiform", "D. scaphoid"]}, {"id": "m3-c8-q19", "ch": 8, "section": "RQ", "q": "The radius bone ________.", "a": "B. has a head that articulates with the radial notch of the ulna", "opts": ["A. is found on the medial side of the forearm", "B. has a head that articulates with the radial notch of the ulna", "C. does not articulate with any of the carpal bones", "D. has the radial tuberosity located near its distal end"]}, {"id": "m3-c8-q20", "ch": 8, "section": "RQ", "q": "How many bones fuse in adulthood to form the hip bone?", "a": "B. 3", "opts": ["A. 2", "B. 3", "C. 4", "D. 5"]}, {"id": "m3-c8-q21", "ch": 8, "section": "RQ", "q": "Which component forms the superior part of the hip bone?", "a": "A. ilium", "opts": ["A. ilium", "B. pubis", "C. ischium", "D. sacrum"]}, {"id": "m3-c8-q22", "ch": 8, "section": "RQ", "q": "Which of the following supports body weight when sitting?", "a": "B. ischial tuberosity", "opts": ["A. iliac crest", "B. ischial tuberosity", "C. ischiopubic ramus", "D. pubic body"]}, {"id": "m3-c8-q23", "ch": 8, "section": "RQ", "q": "The ischial spine is found between which of the following structures?", "a": "C. lesser sciatic notch and greater sciatic notch", "opts": ["A. inferior pubic ramus and ischial ramus", "B. pectineal line and arcuate line", "C. lesser sciatic notch and greater sciatic notch", "D. anterior superior iliac spine and posterior superior iliac spine"]}, {"id": "m3-c8-q24", "ch": 8, "section": "RQ", "q": "The pelvis ________.", "a": "A. has a subpubic angle that is larger in females", "opts": ["A. has a subpubic angle that is larger in females", "B. consists of the two hip bones, but does not include the sacrum or coccyx", "C. has an obturator foramen, an opening that is defined in part by the sacrospinous and sacrotuberous ligaments", "D. has a space located inferior to the pelvic brim called the greater pelvis"]}, {"id": "m3-c8-q25", "ch": 8, "section": "RQ", "q": "Which bony landmark of the femur serves as a site for muscle attachments?", "a": "B. lesser trochanter", "opts": ["A. fovea capitis", "B. lesser trochanter", "C. head", "D. medial condyle"]}, {"id": "m3-c8-q26", "ch": 8, "section": "RQ", "q": "What structure contributes to the knee joint?", "a": "C. medial condyle of the tibia", "opts": ["A. lateral malleolus of the fibula", "B. tibial tuberosity", "C. medial condyle of the tibia", "D. lateral epicondyle of the femur"]}, {"id": "m3-c8-q27", "ch": 8, "section": "RQ", "q": "Which tarsal bone articulates with the tibia and fibula?", "a": "D. talus", "opts": ["A. calcaneus", "B. cuboid", "C. navicular", "D. talus"]}, {"id": "m3-c8-q28", "ch": 8, "section": "RQ", "q": "What is the total number of bones found in the foot and toes?", "a": "C. 26", "opts": ["A. 7", "B. 14", "C. 26", "D. 30"]}, {"id": "m3-c8-q29", "ch": 8, "section": "RQ", "q": "The tibia ________.", "a": "C. is firmly anchored to the fibula by an interosseous membrane", "opts": ["A. has an expanded distal end called the lateral malleolus", "B. is not a weight-bearing bone", "C. is firmly anchored to the fibula by an interosseous membrane", "D. can be palpated only at its proximal and distal ends"]}, {"id": "m3-c8-q30", "ch": 8, "section": "RQ", "q": "Which event takes place during the seventh week of development?", "a": "D. the rotation of the limbs", "opts": ["A. appearance of the upper and lower limb buds", "B. flattening of the distal limb bud into a paddle shape", "C. the first appearance of hyaline cartilage models of future bones", "D. the rotation of the limbs"]}, {"id": "m3-c8-q31", "ch": 8, "section": "RQ", "q": "During endochondral ossification of a long bone, ________.", "a": "C. growth of the epiphyseal plate will produce bone lengthening", "opts": ["A. a primary ossification center will develop within the epiphysis", "B. mesenchyme will differentiate directly into bone tissue", "C. growth of the epiphyseal plate will produce bone lengthening", "D. all epiphyseal plates will disappear before birth"]}, {"id": "m3-c8-q32", "ch": 8, "section": "RQ", "q": "The clavicle ________.", "a": "A. develops via intramembranous ossification", "opts": ["A. develops via intramembranous ossification", "B. develops via endochondral ossification", "C. is the last bone of the body to begin ossification", "D. is fully ossified at the time of birth"]}, {"id": "m3-c8-q33", "ch": 8, "section": "CT", "q": "Describe the shape and palpable line formed by the clavicle and scapula.", "a": "The clavicle extends laterally across the anterior shoulder and can be palpated along its entire length. At its lateral end, the clavicle articulates with the acromion of the scapula, which forms the bony tip of the shoulder. The acromion is continuous with the spine of the scapula, which can be palpated medially and posteriorly along its length. Together, the clavicle, acromion, and spine of the scapula form a V-shaped line that serves as an important area for muscle attachment."}, {"id": "m3-c8-q34", "ch": 8, "section": "CT", "q": "Discuss two possible injuries of the pectoral girdle that may occur following a strong blow to the shoulder or a hard fall onto an outstretched hand.", "a": "A blow to the shoulder or falling onto an outstretched hand passes strong forces through the scapula to the clavicle and sternum. A hard fall may thus cause a fracture of the clavicle (broken collarbone) or may injure the ligaments of the acromioclavicular joint. In a severe case, the coracoclavicular ligament may also rupture, resulting in complete dislocation of the acromioclavicular joint (a “shoulder separation”)."}, {"id": "m3-c8-q35", "ch": 8, "section": "CT", "q": "Your friend runs out of gas and you have to help push his car. Discuss the sequence of bones and joints that convey the forces passing from your hand, through your upper limb and your pectoral girdle, and to your axial skeleton.", "a": "As you push against the car, forces will pass from the metacarpal bones of your hand into the carpal bones at the base of your hand. Forces will then pass through the midcarpal and radiocarpal joints into the radius and ulna bones of the forearm. These will pass the force through the elbow joint into the humerus of the arm, and then through the glenohumeral joint into the scapula. The force will travel through the acromioclavicular joint into the clavicle, and then through the sternoclavicular joint into the sternum, which is part of the axial skeleton."}, {"id": "m3-c8-q36", "ch": 8, "section": "CT", "q": "Name the bones in the wrist and hand, and describe or sketch out their locations and articulations.", "a": "The base of the hand is formed by the eight carpal bones arranged in two rows (distal and proximal) of four bones each. The proximal row contains (from lateral to medial) the scaphoid, lunate, triquetrum, and pisiform bones. The distal row contains (from medial to lateral) the hamate, capitate, trapezoid, and trapezium bones. (Use the mnemonic “So Long To Pinky, Here Comes The Thumb” to remember this sequence). The rows of the proximal and distal carpal bones articulate with each other at the midcarpal joint. The palm of the hand contains the five metacarpal bones, which are numbered 1–5 starting on the thumb side. The proximal ends of the metacarpal bones articulate with the distal row of the carpal bones. The distal ends of the metacarpal bones articulate with the proximal phalanx bones of the thumb and fingers. The thumb (digit 1) has both a proximal and distal phalanx bone. The fingers (digits 2–5) all contain proximal, middle, and distal phalanges."}, {"id": "m3-c8-q37", "ch": 8, "section": "CT", "q": "Describe the articulations and ligaments that unite the four bones of the pelvis to each other.", "a": "The pelvis is formed by the combination of the right and left hip bones, the sacrum, and the coccyx. The auricular surfaces of each hip bone articulate with the auricular surface of the sacrum to form the sacroiliac joint. This joint is supported on either side by the strong anterior and posterior sacroiliac ligaments. The right and left hip bones converge anteriorly, where the pubic bodies articulate with each other to form the pubic symphysis joint. The sacrum is also attached to the hip bone by the sacrospinous ligament, which spans the sacrum to the ischial spine, and the sacrotuberous ligament, which runs from the sacrum to the ischial tuberosity. The coccyx is attached to the inferior end of the sacrum."}, {"id": "m3-c8-q38", "ch": 8, "section": "CT", "q": "Discuss the ways in which the female pelvis is adapted for childbirth.", "a": "Compared to the male, the female pelvis is wider to accommodate childbirth. Thus, the female pelvis has greater distances between the anterior superior iliac spines and between the ischial tuberosities. The greater width of the female pelvis results in a larger subpubic angle. This angle, formed by the anterior convergence of the right and left ischiopubic rami, is larger in females (greater than 80 degrees) than in males (less than 70 degrees). The female sacral promontory does not project anteriorly as far as it does in males, which gives the pelvic brim (pelvic inlet) of the female a rounded or oval shape. The lesser pelvic cavity is wider and more shallow in females, and the pelvic outlet is larger than in males. Thus, the greater width of the female pelvis, with its larger pelvic inlet, lesser pelvis, and pelvic outlet, are important for childbirth because the baby must pass through the pelvis during delivery."}, {"id": "m3-c8-q39", "ch": 8, "section": "CT", "q": "Define the regions of the lower limb, name the bones found in each region, and describe the bony landmarks that articulate together to form the hip, knee, and ankle joints.", "a": "The lower limb is divided into three regions. The thigh is the region located between the hip and knee joints. It contains the femur and the patella. The hip joint is formed by the articulation between the acetabulum of the hip bone and the head of the femur. The leg is the region between the knee and ankle joints, and contains the tibia (medially) and the fibula (laterally). The knee joint is formed by the articulations between the medial and lateral condyles of the femur, and the medial and lateral condyles of the tibia. Also associated with the knee is the patella, which articulates with the patellar surface of the distal femur. The foot is found distal to the ankle and contains 26 bones. The ankle joint is formed by the articulations between the talus bone of the foot and the distal end of the tibia, the medial malleolus of the tibia, and the lateral malleolus of the fibula. The posterior foot contains the seven tarsal bones, which are the talus, calcaneus, navicular, cuboid, and the medial, intermediate, and lateral cuneiform bones. The anterior foot consists of the five metatarsal bones, which are numbered 1–5 starting on the medial side of the foot. The toes contain 14 phalanx bones, with the big toe (toe number 1) having a proximal and a distal phalanx, and the other toes having proximal, middle, and distal phalanges."}, {"id": "m3-c8-q40", "ch": 8, "section": "CT", "q": "The talus bone of the foot receives the weight of the body from the tibia. The talus bone then distributes this weight toward the ground in two directions: one-half of the body weight is passed in a posterior direction and one-half of the weight is passed in an anterior direction. Describe the arrangement of the tarsal and metatarsal bones that are involved in both the posterior and anterior distribution of body weight.", "a": "The talus bone articulates superiorly with the tibia and fibula at the ankle joint, with body weight passed from the tibia to the talus. Body weight from the talus is transmitted to the ground by both ends of the medial and lateral longitudinal foot arches. Weight is passed posteriorly through both arches to the calcaneus bone, which forms the heel of the foot and is in contact with the ground. On the medial side of the foot, body weight is passed anteriorly from the talus bone to the navicular bone, and then to the medial, intermediate, and lateral cuneiform bones. The cuneiform bones pass the weight anteriorly to the first, second, and third metatarsal bones, whose heads (distal ends) are in contact with the ground. On the lateral side, body weight is passed anteriorly from the talus through the calcaneus, cuboid, and fourth and fifth metatarsal bones. The talus bone thus transmits body weight posteriorly to the calcaneus and anteriorly through the navicular, cuneiform, and cuboid bones, and metatarsals one through five."}, {"id": "m3-c8-q41", "ch": 8, "section": "CT", "q": "How can a radiograph of a child’s femur be used to determine the approximate age of that child?", "a": "A radiograph (X-ray image) of a child’s femur will show the epiphyseal plates associated with each secondary ossification center. These plates of hyaline cartilage will appear dark in comparison to the white imaging of the ossified bone. Since each epiphyseal plate appears and disappears at a different age, the presence or absence of these plates can be used to give an approximate age for the child. For example, the epiphyseal plate located at the base of the lesser trochanter of the femur appears at age 9–10 years and disappears at puberty (approximately 11 years of age). Thus, a child’s radiograph that shows the presence of the lesser trochanter epiphyseal plate indicates an approximate age of 10 years."}, {"id": "m3-c8-q42", "ch": 8, "section": "CT", "q": "How does the development of the clavicle differ from the development of other appendicular skeleton bones?", "a": "Unlike other bones of the appendicular skeleton, the clavicle develops by the process of intramembranous ossification. In this process, embryonic mesenchyme accumulates at the site of the future bone and then differentiates directly into bone-producing tissue. Because of this direct and early production of bone, the clavicle is the first bone of the skeleton to begin to ossify. However, the growth and enlargement of the clavicle continues throughout childhood and adolescence, and thus, it is not fully ossified until 25 years of age."}, {"id": "m3-c9-q20", "ch": 9, "section": "RQ", "q": "The joint between adjacent vertebrae that includes an invertebral disc is classified as which type of joint?", "a": "C. amphiarthrosis", "opts": ["A. diarthrosis", "B. multiaxial", "C. amphiarthrosis", "D. synarthrosis"]}, {"id": "m3-c9-q21", "ch": 9, "section": "RQ", "q": "Which of these joints is classified as a synarthrosis?", "a": "B. the manubriosternal joint", "opts": ["A. the pubic symphysis", "B. the manubriosternal joint", "C. an invertebral disc", "D. the shoulder joint"]}, {"id": "m3-c9-q22", "ch": 9, "section": "RQ", "q": "Which of these joints is classified as a biaxial diarthrosis?", "a": "A. the metacarpophalangeal joint", "opts": ["A. the metacarpophalangeal joint", "B. the hip joint", "C. the elbow joint", "D. the pubic symphysis"]}, {"id": "m3-c9-q23", "ch": 9, "section": "RQ", "q": "Synovial joints ________.", "a": "D. are joints where the bones articulate with each other within a fluid-filled joint cavity", "opts": ["A. may be functionally classified as a synarthrosis", "B. are joints where the bones are connected to each other by hyaline cartilage", "C. may be functionally classified as an amphiarthrosis", "D. are joints where the bones articulate with each other within a fluid-filled joint cavity"]}, {"id": "m3-c9-q24", "ch": 9, "section": "RQ", "q": "Which type of fibrous joint connects the tibia and fibula?", "a": "A. syndesmosis", "opts": ["A. syndesmosis", "B. symphysis", "C. suture", "D. gomphosis"]}, {"id": "m3-c9-q25", "ch": 9, "section": "RQ", "q": "An example of a wide fibrous joint is ________.", "a": "A. the interosseous membrane of the forearm", "opts": ["A. the interosseous membrane of the forearm", "B. a gomphosis", "C. a suture joint", "D. a synostosis"]}, {"id": "m3-c9-q26", "ch": 9, "section": "RQ", "q": "A gomphosis ________.", "a": "D. anchors a tooth to the jaw", "opts": ["A. is formed by an interosseous membrane", "B. connects the tibia and fibula bones of the leg", "C. contains a joint cavity", "D. anchors a tooth to the jaw"]}, {"id": "m3-c9-q27", "ch": 9, "section": "RQ", "q": "A syndesmosis is ________.", "a": "C. a fibrous joint that unites parallel bones", "opts": ["A. a narrow fibrous joint", "B. the type of joint that unites bones of the skull", "C. a fibrous joint that unites parallel bones", "D. the type of joint that anchors the teeth in the jaws"]}, {"id": "m3-c9-q28", "ch": 9, "section": "RQ", "q": "A cartilaginous joint ________.", "a": "B. is called a symphysis when the bones are united by fibrocartilage", "opts": ["A. has a joint cavity", "B. is called a symphysis when the bones are united by fibrocartilage", "C. anchors the teeth to the jaws", "D. is formed by a wide sheet of fibrous connective tissue"]}, {"id": "m3-c9-q29", "ch": 9, "section": "RQ", "q": "A synchondrosis is ________.", "a": "D. found at the first sternocostal joint of the thoracic cage", "opts": ["A. found at the pubic symphysis", "B. where bones are connected together with fibrocartilage", "C. a type of fibrous joint", "D. found at the first sternocostal joint of the thoracic cage"]}, {"id": "m3-c9-q30", "ch": 9, "section": "RQ", "q": "Which of the following are joined by a symphysis?", "a": "A. adjacent vertebrae", "opts": ["A. adjacent vertebrae", "B. the first rib and the sternum", "C. the end and shaft of a long bone", "D. the radius and ulna bones"]}, {"id": "m3-c9-q31", "ch": 9, "section": "RQ", "q": "The epiphyseal plate of a growing long bone in a child is classified as a ________.", "a": "A. synchondrosis", "opts": ["A. synchondrosis", "B. synostosis", "C. symphysis", "D. syndesmosis"]}, {"id": "m3-c9-q32", "ch": 9, "section": "RQ", "q": "Which type of joint provides the greatest range of motion?", "a": "A. ball-and-socket", "opts": ["A. ball-and-socket", "B. hinge", "C. condyloid", "D. plane"]}, {"id": "m3-c9-q33", "ch": 9, "section": "RQ", "q": "Which type of joint allows for only uniaxial movement?", "a": "B. hinge joint", "opts": ["A. saddle joint", "B. hinge joint", "C. condyloid joint", "D. ball-and-socket joint"]}, {"id": "m3-c9-q34", "ch": 9, "section": "RQ", "q": "Which of the following is a type of synovial joint?", "a": "C. a plane joint", "opts": ["A. a synostosis", "B. a suture", "C. a plane joint", "D. a synchondrosis"]}, {"id": "m3-c9-q35", "ch": 9, "section": "RQ", "q": "A bursa ________.", "a": "C. prevents friction between skin and bone, or a muscle tendon and bone", "opts": ["A. surrounds a tendon at the point where the tendon crosses a joint", "B. secretes the lubricating fluid for a synovial joint", "C. prevents friction between skin and bone, or a muscle tendon and bone", "D. is the strong band of connective tissue that holds bones together at a synovial joint"]}, {"id": "m3-c9-q36", "ch": 9, "section": "RQ", "q": "At synovial joints, ________.", "a": "D. the joint cavity is filled with a thick, lubricating fluid", "opts": ["A. the articulating ends of the bones are directly connected by fibrous connective tissue", "B. the ends of the bones are enclosed within a space called a subcutaneous bursa", "C. intrinsic ligaments are located entirely inside of the articular capsule", "D. the joint cavity is filled with a thick, lubricating fluid"]}, {"id": "m3-c9-q37", "ch": 9, "section": "RQ", "q": "At a synovial joint, the synovial membrane ________.", "a": "D. secretes the lubricating synovial fluid", "opts": ["A. forms the fibrous connective walls of the joint cavity", "B. is the layer of cartilage that covers the articulating surfaces of the bones", "C. forms the intracapsular ligaments", "D. secretes the lubricating synovial fluid"]}, {"id": "m3-c9-q38", "ch": 9, "section": "RQ", "q": "Condyloid joints ________.", "a": "B. include the radiocarpal joint", "opts": ["A. are a type of ball-and-socket joint", "B. include the radiocarpal joint", "C. are a uniaxial diarthrosis joint", "D. are found at the proximal radioulnar joint"]}, {"id": "m3-c9-q39", "ch": 9, "section": "RQ", "q": "A meniscus is ________.", "a": "A. a fibrocartilage pad that provides padding between bones", "opts": ["A. a fibrocartilage pad that provides padding between bones", "B. a fluid-filled space that prevents friction between a muscle tendon and underlying bone", "C. the articular cartilage that covers the ends of a bone at a synovial joint", "D. the lubricating fluid within a synovial joint"]}, {"id": "m3-c9-q40", "ch": 9, "section": "RQ", "q": "The joints between the articular processes of adjacent vertebrae can contribute to which movement?", "a": "A. lateral flexion", "opts": ["A. lateral flexion", "B. circumduction", "C. dorsiflexion", "D. abduction"]}, {"id": "m3-c9-q41", "ch": 9, "section": "RQ", "q": "Which motion moves the bottom of the foot away from the midline of the body?", "a": "C. eversion", "opts": ["A. elevation", "B. dorsiflexion", "C. eversion", "D. plantar flexion"]}, {"id": "m3-c9-q42", "ch": 9, "section": "RQ", "q": "Movement of a body region in a circular movement at a condyloid joint is what type of motion?", "a": "D. circumduction", "opts": ["A. rotation", "B. elevation", "C. abduction", "D. circumduction"]}, {"id": "m3-c9-q43", "ch": 9, "section": "RQ", "q": "Supination is the motion that moves the ________.", "a": "A. hand from the palm backward position to the palm forward position", "opts": ["A. hand from the palm backward position to the palm forward position", "B. foot so that the bottom of the foot faces the midline of the body", "C. hand from the palm forward position to the palm backward position", "D. scapula in an upward direction"]}, {"id": "m3-c9-q44", "ch": 9, "section": "RQ", "q": "Movement at the shoulder joint that moves the upper limb laterally away from the body is called ________.", "a": "C. abduction", "opts": ["A. elevation", "B. eversion", "C. abduction", "D. lateral rotation"]}, {"id": "m3-c9-q45", "ch": 9, "section": "RQ", "q": "The primary support for the glenohumeral joint is provided by the ________.", "a": "C. rotator cuff muscles", "opts": ["A. coracohumeral ligament", "B. glenoid labrum", "C. rotator cuff muscles", "D. subacromial bursa"]}, {"id": "m3-c9-q46", "ch": 9, "section": "RQ", "q": "The proximal radioulnar joint ________.", "a": "A. is supported by the annular ligament", "opts": ["A. is supported by the annular ligament", "B. contains an articular disc that strongly unites the bones", "C. is supported by the ulnar collateral ligament", "D. is a hinge joint that allows for flexion/extension of the forearm"]}, {"id": "m3-c9-q47", "ch": 9, "section": "RQ", "q": "Which statement is true concerning the knee joint?", "a": "D. The medial meniscus is attached to the tibial collateral ligament.", "opts": ["A. The lateral meniscus is an intrinsic ligament located on the lateral side of the knee joint.", "B. Hyperextension is resisted by the posterior cruciate ligament.", "C. The anterior cruciate ligament supports the knee when it is flexed and weight bearing.", "D. The medial meniscus is attached to the tibial collateral ligament."]}, {"id": "m3-c9-q48", "ch": 9, "section": "RQ", "q": "The ankle joint ________.", "a": "C. is a uniaxial hinge joint", "opts": ["A. is also called the subtalar joint", "B. allows for gliding movements that produce inversion/eversion of the foot", "C. is a uniaxial hinge joint", "D. is supported by the tibial collateral ligament on the lateral side"]}, {"id": "m3-c9-q49", "ch": 9, "section": "RQ", "q": "Which region of the vertebral column has the greatest range of motion for rotation?", "a": "D. thoracic", "opts": ["A. sacral", "B. cervical", "C. lumbar", "D. thoracic"]}, {"id": "m3-c9-q50", "ch": 9, "section": "RQ", "q": "Intramembranous ossification ________.", "a": "B. produces the bones of the top and sides of the skull", "opts": ["A. gives rise to the bones of the limbs", "B. produces the bones of the top and sides of the skull", "C. produces the bones of the face and base of the skull", "D. involves the conversion of a hyaline cartilage model into bone"]}, {"id": "m3-c9-q51", "ch": 9, "section": "RQ", "q": "Synovial joints ________.", "a": "C. develop at an interzone site", "opts": ["A. are derived from fontanelles", "B. are produced by intramembranous ossification", "C. develop at an interzone site", "D. are produced by endochondral ossification"]}, {"id": "m3-c9-q52", "ch": 9, "section": "RQ", "q": "Endochondral ossification is ________.", "a": "A. the process that replaces hyaline cartilage with bone tissue", "opts": ["A. the process that replaces hyaline cartilage with bone tissue", "B. the process by which mesenchyme differentiates directly into bone tissue", "C. completed before birth", "D. the process that gives rise to the joint interzone and future joint cavity"]}, {"id": "m3-c9-q53", "ch": 9, "section": "CT", "q": "Define how joints are classified based on function. Describe and give an example for each functional type of joint.", "a": "Functional classification of joints is based on the degree of mobility exhibited by the joint. A synarthrosis is an immobile or nearly immobile joint. An example is the manubriosternal joint or the joints between the skull bones surrounding the brain. An amphiarthrosis is a slightly moveable joint, such as the pubic symphysis or an intervertebral cartilaginous joint. A diarthrosis is a freely moveable joint. These are subdivided into three categories. A uniaxial diarthrosis allows movement within a single anatomical plane or axis of motion. The elbow joint is an example. A biaxial diarthrosis, such as the metacarpophalangeal joint, allows for movement along two planes or axes. The hip and shoulder joints are examples of a multiaxial diarthrosis. These allow movements along three planes or axes."}, {"id": "m3-c9-q54", "ch": 9, "section": "CT", "q": "Explain the reasons for why joints differ in their degree of mobility.", "a": "The functional needs of joints vary and thus joints differ in their degree of mobility. A synarthrosis, which is an immobile joint, serves to strongly connect bones thus protecting internal organs such as the heart or brain. A slightly moveable amphiarthrosis provides for small movements, which in the vertebral column can add together to yield a much larger overall movement. The freedom of movement provided by a diarthrosis can allow for large movements, such as is seen with most joints of the limbs."}, {"id": "m3-c9-q55", "ch": 9, "section": "CT", "q": "Distinguish between a narrow and wide fibrous joint and give an example of each.", "a": "Narrow fibrous joints are found at a suture, gomphosis, or syndesmosis. A suture is the fibrous joint that joins the bones of the skull to each other (except the mandible). A gomphosis is the fibrous joint that anchors each tooth to its bony socket within the upper or lower jaw. The tooth is connected to the bony jaw by periodontal ligaments. A narrow syndesmosis is found at the distal tibiofibular joint where the bones are united by fibrous connective tissue and ligaments. A syndesmosis can also form a wide fibrous joint where the shafts of two parallel bones are connected by a broad interosseous membrane. The radius and ulna bones of the forearm and the tibia and fibula bones of the leg are united by interosseous membranes."}, {"id": "m3-c9-q56", "ch": 9, "section": "CT", "q": "The periodontal ligaments are made of collagen fibers and are responsible for connecting the roots of the teeth to the jaws. Describe how scurvy, a disease that inhibits collagen production, can affect the teeth.", "a": "The teeth are anchored into their sockets within the bony jaws by the periodontal ligaments. This is a gomphosis type of fibrous joint. In scurvy, collagen production is inhibited and the periodontal ligaments become weak. This will cause the teeth to become loose or even to fall out."}, {"id": "m3-c9-q57", "ch": 9, "section": "CT", "q": "Describe the two types of cartilaginous joints and give examples of each.", "a": "Cartilaginous joints are where the adjacent bones are joined by cartilage. At a synchondrosis, the bones are united by hyaline cartilage. The epiphyseal plate of growing long bones and the first sternocostal joint that unites the first rib to the sternum are examples of synchondroses. At a symphysis, the bones are joined by fibrocartilage, which is strong and flexible. Symphysis joints include the intervertebral symphysis between adjacent vertebrae and the pubic symphysis that joins the pubic portions of the right and left hip bones."}, {"id": "m3-c9-q58", "ch": 9, "section": "CT", "q": "Both functional and structural classifications can be used to describe an individual joint. Define the first sternocostal joint and the pubic symphysis using both functional and structural characteristics.", "a": "The first sternocostal joint is a synchondrosis type of cartilaginous joint in which hyaline cartilage unites the first rib to the manubrium of the sternum. This forms an immobile (synarthrosis) type of joint. The pubic symphysis is a slightly mobile (amphiarthrosis) cartilaginous joint, where the pubic portions of the right and left hip bones are united by fibrocartilage, thus forming a symphysis."}, {"id": "m3-c9-q59", "ch": 9, "section": "CT", "q": "Describe the characteristic structures found at all synovial joints.", "a": "All synovial joints have a joint cavity filled with synovial fluid that is the site at which the bones of the joint articulate with each other. The articulating surfaces of the bones are covered by articular cartilage, a thin layer of hyaline cartilage. The walls of the joint cavity are formed by the connective tissue of the articular capsule. The synovial membrane lines the interior surface of the joint cavity and secretes the synovial fluid. Synovial joints are directly supported by ligaments, which span between the bones of the joint. These may be located outside of the articular capsule (extrinsic ligaments), incorporated or fused to the wall of the articular capsule (intrinsic ligaments), or found inside of the articular capsule (intracapsular ligaments). Ligaments hold the bones together and also serve to resist or prevent excessive or abnormal movements of the joint."}, {"id": "m3-c9-q60", "ch": 9, "section": "CT", "q": "Describe the structures that provide direct and indirect support for a synovial joint.", "a": "Direct support for a synovial joint is provided by ligaments that strongly unite the bones of the joint and serve to resist excessive or abnormal movements. Some joints, such as the sternoclavicular joint, have an articular disc that is attached to both bones, where it provides direct support by holding the bones together. Indirect joint support is provided by the muscles and their tendons that act across a joint. Muscles will increase their contractile force to help support the joint by resisting forces acting on it."}, {"id": "m3-c9-q61", "ch": 9, "section": "CT", "q": "Briefly define the types of joint movements available at a ball-and-socket joint.", "a": "Ball-and-socket joints are multiaxial joints that allow for flexion and extension, abduction and adduction, circumduction, and medial and lateral rotation."}, {"id": "m3-c9-q62", "ch": 9, "section": "CT", "q": "Discuss the joints involved and movements required for you to cross your arms together in front of your chest.", "a": "To cross your arms, you need to use both your shoulder and elbow joints. At the shoulder, the arm would need to flex and medially rotate. At the elbow, the forearm would need to be flexed."}, {"id": "m3-c9-q63", "ch": 9, "section": "CT", "q": "Discuss the structures that contribute to support of the shoulder joint.", "a": "The shoulder joint allows for a large range of motion. The primary support for the shoulder joint is provided by the four rotator cuff muscles. These muscles serve as “dynamic ligaments” and thus can modulate their strengths of contraction as needed to hold the head of the humerus in position at the glenoid fossa. Additional but weaker support comes from the coracohumeral ligament, an intrinsic ligament that supports the superior aspect of the shoulder joint, and the glenohumeral ligaments, which are intrinsic ligaments that support the anterior side of the joint."}, {"id": "m3-c9-q64", "ch": 9, "section": "CT", "q": "Describe the sequence of injuries that may occur if the extended, weight-bearing knee receives a very strong blow to the lateral side of the knee.", "a": "A strong blow to the lateral side of the extended knee will cause the medial side of the knee joint to open, resulting in a sequence of three injuries. First will be damage to the tibial collateral ligament. Since the medial meniscus is attached to the tibial collateral ligament, the meniscus is also injured. The third structure injured would be the anterior cruciate ligament."}, {"id": "m3-c9-q65", "ch": 9, "section": "CT", "q": "Describe how synovial joints develop within the embryonic limb.", "a": "Mesenchyme gives rise to cartilage models of the future limb bones. An area called the joint interzone located between adjacent cartilage models will become a synovial joint. The cells at the center of the interzone die, thus producing the joint cavity. Additional mesenchyme cells at the periphery of the interzone become the articular capsule."}, {"id": "m3-c9-q66", "ch": 9, "section": "CT", "q": "Differentiate between endochondral and intramembranous ossification.", "a": "Intramembranous ossification is the process by which mesenchymal cells differentiate directly into bone producing cells. This process produces the bones that form the top and sides of the skull. The remaining skull bones and the bones of the limbs are formed by endochondral ossification. In this, mesenchymal cells differentiate into hyaline cartilage cells that produce a cartilage model of the future bone. The cartilage is then gradually replaced by bone tissue over a period of many years, during which the cartilage of the epiphyseal plate can continue to grow to allow for enlargement or lengthening of the bone."}]}, {"key": "m4", "name": "Module 4", "sub": "Ch 10–11 · Muscle Tissue · Muscular System", "cards": [{"id": "m4-c10-q4", "ch": 10, "section": "RQ", "q": "Muscle that has a striped appearance is described as being ________.", "a": "D. striated", "opts": ["A. elastic", "B. nonstriated", "C. excitable", "D. striated"]}, {"id": "m4-c10-q5", "ch": 10, "section": "RQ", "q": "Which element is important in directly triggering contraction?", "a": "B. calcium (Ca++)", "opts": ["A. sodium (Na+)", "B. calcium (Ca++)", "C. potassium (K+)", "D. chloride (Cl-)"]}, {"id": "m4-c10-q6", "ch": 10, "section": "RQ", "q": "Which of the following properties is not common to all three muscle tissues?", "a": "C. at rest, uses shielding proteins to cover actin-binding sites", "opts": ["A. excitability", "B. the need for ATP", "C. at rest, uses shielding proteins to cover actin-binding sites", "D. elasticity"]}, {"id": "m4-c10-q7", "ch": 10, "section": "RQ", "q": "The correct order for the smallest to the largest unit of organization in muscle tissue is ________.", "a": "B. filament, myofibril, muscle fiber, fascicle", "opts": ["A. fascicle, filament, muscle fiber, myofibril", "B. filament, myofibril, muscle fiber, fascicle", "C. muscle fiber, fascicle, filament, myofibril", "D. myofibril, muscle fiber, filament, fascicle"]}, {"id": "m4-c10-q8", "ch": 10, "section": "RQ", "q": "Depolarization of the sarcolemma means ________.", "a": "A. the inside of the membrane has become less negative as sodium ions accumulate", "opts": ["A. the inside of the membrane has become less negative as sodium ions accumulate", "B. the outside of the membrane has become less negative as sodium ions accumulate", "C. the inside of the membrane has become more negative as sodium ions accumulate", "D. the sarcolemma has completely lost any electrical charge"]}, {"id": "m4-c10-q9", "ch": 10, "section": "RQ", "q": "In relaxed muscle, the myosin-binding site on actin is blocked by ________.", "a": "D. tropomyosin", "opts": ["A. titin", "B. troponin", "C. myoglobin", "D. tropomyosin"]}, {"id": "m4-c10-q10", "ch": 10, "section": "RQ", "q": "According to the sliding filament model, binding sites on actin open when ________.", "a": "D. calcium ion levels rise", "opts": ["A. creatine phosphate levels rise", "B. ATP levels rise", "C. acetylcholine levels rise", "D. calcium ion levels rise"]}, {"id": "m4-c10-q11", "ch": 10, "section": "RQ", "q": "The cell membrane of a muscle fiber is called ________.", "a": "B. sarcolemma", "opts": ["A. myofibril", "B. sarcolemma", "C. sarcoplasm", "D. myofilament"]}, {"id": "m4-c10-q12", "ch": 10, "section": "RQ", "q": "Muscle relaxation occurs when ________.", "a": "C. calcium ions are actively transported into the sarcoplasmic reticulum", "opts": ["A. calcium ions are actively transported out of the sarcoplasmic reticulum", "B. calcium ions diffuse out of the sarcoplasmic reticulum", "C. calcium ions are actively transported into the sarcoplasmic reticulum", "D. calcium ions diffuse into the sarcoplasmic reticulum"]}, {"id": "m4-c10-q13", "ch": 10, "section": "RQ", "q": "During muscle contraction, the cross-bridge detaches when ________.", "a": "C. calcium ions bind to troponin", "opts": ["A. the myosin head binds to an ADP molecule", "B. the myosin head binds to an ATP molecule", "C. calcium ions bind to troponin", "D. calcium ions bind to actin"]}, {"id": "m4-c10-q14", "ch": 10, "section": "RQ", "q": "Thin and thick filaments are organized into functional units called ________.", "a": "D. sarcomeres", "opts": ["A. myofibrils", "B. myofilaments", "C. T-tubules", "D. sarcomeres"]}, {"id": "m4-c10-q15", "ch": 10, "section": "RQ", "q": "During which ph
