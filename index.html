on occurs.","opts":["A. true","B. false"],"a":"B. false"},{"id":"s2-c25-rq16","ch":25,"section":"RQ","q":"Aquaporin channels are only found in the collecting duct.","opts":["A. true","B. false"],"a":"B. false"},{"id":"s2-c25-rq17","ch":25,"section":"RQ","q":"Most absorption and secretion occurs in this part of the nephron.","opts":["A. proximal convoluted tubule","B. descending loop of Henle","C. ascending loop of Henle","D. distal convoluted tubule","E. collecting ducts"],"a":"A. proximal convoluted tubule"},{"id":"s2-c25-rq18","ch":25,"section":"RQ","q":"The fine tuning of water recovery or disposal occurs in ________.","opts":["A. the proximal convoluted tubule","B. the collecting ducts","C. the ascending loop of Henle","D. the distal convoluted tubule"],"a":"B. the collecting ducts"},{"id":"s2-c25-rq19","ch":25,"section":"RQ","q":"Vasodilation of blood vessels to the kidneys is due to ________.","opts":["A. more frequent action potentials","B. less frequent action potentials"],"a":"B. less frequent action potentials"},{"id":"s2-c25-rq20","ch":25,"section":"RQ","q":"When blood pressure increases, blood vessels supplying the kidney will ________ to mount a steady rate of filtration.","opts":["A. contract","B. relax"],"a":"A. contract"},{"id":"s2-c25-rq21","ch":25,"section":"RQ","q":"Which of these three paracrine chemicals cause vasodilation?","opts":["A. ATP","B. adenosine","C. nitric oxide"],"a":"C. nitric oxide"},{"id":"s2-c25-rq22","ch":25,"section":"RQ","q":"What hormone directly opposes the actions of natriuretic hormones?","opts":["A. renin","B. nitric oxide","C. dopamine","D. aldosterone"],"a":"D. aldosterone"},{"id":"s2-c25-rq23","ch":25,"section":"RQ","q":"Which of these is a vasoconstrictor?","opts":["A. nitric oxide","B. natriuretic hormone 25 • Review Questions     1181","C. bradykinin","D. angiotensin II"],"a":"D. angiotensin II"},{"id":"s2-c25-rq24","ch":25,"section":"RQ","q":"What signal causes the heart to secrete atrial natriuretic hormone?","opts":["A. increased blood pressure","B. decreased blood pressure","C. increased Na+ levels","D. decreased Na+ levels"],"a":"A. increased blood pressure"},{"id":"s2-c25-rq25","ch":25,"section":"RQ","q":"Which of these beverages does not have a diuretic effect?","opts":["A. tea","B. coffee","C. alcohol","D. milk"],"a":"D. milk"},{"id":"s2-c25-rq26","ch":25,"section":"RQ","q":"Progesterone can bind to receptors for which hormone that, when released, activates water retention?","opts":["A. aldosterone","B. ADH","C. PTH","D. ANH"],"a":"A. aldosterone"},{"id":"s2-c25-rq27","ch":25,"section":"RQ","q":"Renin is released in response to ________.","opts":["A. increased blood pressure","B. decreased blood pressure","C. ACE","D. diuretics"],"a":"B. decreased blood pressure"},{"id":"s2-c25-rq28","ch":25,"section":"RQ","q":"Which step in vitamin D production does the kidney perform?","opts":["A. converts cholecalciferol into calcidiol","B. converts calcidiol into calcitriol","C. stores vitamin D","D. none of these"],"a":"B. converts calcidiol into calcitriol"},{"id":"s2-c25-rq29","ch":25,"section":"RQ","q":"Which hormone does the kidney produce that stimulates red blood cell production?","opts":["A. thrombopoietin","B. vitamin D","C. EPO","D. renin"],"a":"C. EPO"},{"id":"s2-c25-rq30","ch":25,"section":"RQ","q":"If there were no aquaporin channels in the collecting duct, ________.","opts":["A. you would develop systemic edema","B. you would retain excess Na+","C. you would lose vitamins and electrolytes","D. you would suffer severe dehydration"],"a":"D. you would suffer severe dehydration"},{"id":"s2-c25-ct31","ch":25,"section":"CT","q":"What is suggested by the presence of white blood cells found in the urine?","a":"The presence of white blood cells found in the urine suggests urinary tract infection."},{"id":"s2-c25-ct32","ch":25,"section":"CT","q":"Both diabetes mellitus and diabetes insipidus produce large urine volumes, but how would other characteristics of the urine differ between the two diseases?","a":"Diabetes mellitus would result in urine containing glucose, and diabetes insipidus would produce urine with very low osmolarity (low specific gravity, dilute)."},{"id":"s2-c25-ct33","ch":25,"section":"CT","q":"Why are females more likely to contract bladder infections than males?","a":"The longer urethra of males means bacteria must travel farther to the bladder to cause an infection."},{"id":"s2-c25-ct34","ch":25,"section":"CT","q":"Describe how forceful urination is accomplished.","a":"Forceful urination is accomplished by contraction of abdominal muscles."},{"id":"s2-c25-ct35","ch":25,"section":"CT","q":"What anatomical structures provide protection to the kidney?","a":"Retroperitoneal anchoring, renal fat pads, and ribs provide protection to the kidney."},{"id":"s2-c25-ct36","ch":25,"section":"CT","q":"How does the renal portal system differ from the hypothalamo–hypophyseal and digestive portal systems?","a":"The renal portal system has an artery between the first and second capillary bed. The others have a vein."},{"id":"s2-c25-ct37","ch":25,"section":"CT","q":"Name the structures found in the renal hilum.","a":"The structures found in the renal hilum are arteries, veins, ureters, lymphatics, and nerves."},{"id":"s2-c25-ct38","ch":25,"section":"CT","q":"Which structures make up the renal corpuscle?","a":"The structures that make up the renal corpuscle are the glomerulus, Bowman’s capsule, and PCT."},{"id":"s2-c25-ct39","ch":25,"section":"CT","q":"What are the major structures comprising the filtration membrane?","a":"The major structures comprising the filtration membrane are fenestrations and podocyte fenestra, fused basement membrane, and filtration slits."},{"id":"s2-c25-ct40","ch":25,"section":"CT","q":"Give the formula for net filtration pressure.","a":"Net filtration pressure (NFP) = glomerular blood hydrostatic pressure (GBHP) – [capsular hydrostatic pressure (CHP) + blood colloid osmotic pressure (BCOP)]"},{"id":"s2-c25-ct41","ch":25,"section":"CT","q":"Name at least five symptoms of kidney failure.","a":"Symptoms of kidney failure are weakness, lethargy, shortness of breath, widespread edema, anemia, metabolic acidosis or alkalosis, heart arrhythmias, uremia, loss of appetite, fatigue, excessive urination, and oliguria."},{"id":"s2-c25-ct42","ch":25,"section":"CT","q":"Which vessels and what part of the nephron are involved in countercurrent multiplication?","a":"The vasa recta and loop of Henle are involved in countercurrent multiplication."},{"id":"s2-c25-ct43","ch":25,"section":"CT","q":"Give the approximate osmolarity of fluid in the proximal convoluted tubule, deepest part of the loop of Henle, distal convoluted tubule, and the collecting ducts.","a":"The approximate osmolarities are: CT = 300; deepest loop = 1200; DCT = 100; and collecting ducts = 100–1200."},{"id":"s2-c25-ct44","ch":25,"section":"CT","q":"Explain what happens to Na+ concentration in the nephron when GFR increases.","a":"Sodium concentration in the filtrate increases when GFR increases; it will decrease when GFR decreases."},{"id":"s2-c25-ct45","ch":25,"section":"CT","q":"If you want the kidney to excrete more Na+ in the urine, what do you want the blood flow to do?","a":"To excrete more Na+ in the urine, increase the flow rate."},{"id":"s2-c25-ct46","ch":25,"section":"CT","q":"What organs produce which hormones or enzymes in the renin–angiotensin system?","a":"The liver produces angiotensinogen, the lungs produce ACE, and the kidneys produce renin."},{"id":"s2-c25-ct47","ch":25,"section":"CT","q":"PTH affects absorption and reabsorption of what?","a":"PTH affects absorption and reabsorption of calcium."},{"id":"s2-c25-ct48","ch":25,"section":"CT","q":"Why is ADH also called vasopressin?","a":"When first discovered, it was named for its known activity—vasoconstriction."},{"id":"s2-c25-ct49","ch":25,"section":"CT","q":"How can glucose be a diuretic?","a":"In cases of diabetes mellitus, there is more glucose present than the kidney can recover and the excess glucose is lost in the urine. It possesses osmotic character so that it attracts water to the forming urine."},{"id":"s2-c25-ct50","ch":25,"section":"CT","q":"How does lack of protein in the blood cause edema?","a":"Protein has osmotic properties. If there is not enough protein in the blood, water will be attracted to the interstitial space and the cell cytoplasm resulting in tissue edema."},{"id":"s2-c25-ct51","ch":25,"section":"CT","q":"Which three electrolytes are most closely regulated by the kidney?","a":"The three electrolytes are most closely regulated by the kidney are calcium, sodium, and potassium. Anatomy &amp; Physiology Unit 5: Energy, Maintenance, and Environmental Exchange"},{"id":"s2-c26-rq5","ch":26,"section":"RQ","q":"Solute contributes to the movement of water between cells and the surrounding medium by ________.","opts":["A. osmotic pressure","B. hydrostatic pressure","C. Brownian movement","D. random motion"],"a":"A. osmotic pressure"},{"id":"s2-c26-rq6","ch":26,"section":"RQ","q":"A cation has a(n) ________ charge.","opts":["A. neutral","B. positive","C. alternating","D. negative"],"a":"B. positive"},{"id":"s2-c26-rq7","ch":26,"section":"RQ","q":"Interstitial fluid (IF) is ________.","opts":["A. the fluid in the cytosol of the cells","B. the fluid component of blood","C. the fluid that bathes all of the body’s cells except for blood cells","D. the intracellular fluids found between membranes"],"a":"C. the fluid that bathes all of the body’s cells except for blood cells"},{"id":"s2-c26-rq8","ch":26,"section":"RQ","q":"The largest amount of water comes into the body via ________.","opts":["A. metabolism 26 • Interactive Link Questions     1211","B. foods","C. liquids","D. humidified air"],"a":"C. liquids"},{"id":"s2-c26-rq9","ch":26,"section":"RQ","q":"The largest amount of water leaves the body via ________.","opts":["A. the GI tract","B. the skin as sweat","C. expiration","D. urine"],"a":"D. urine"},{"id":"s2-c26-rq10","ch":26,"section":"RQ","q":"Insensible water loss is water lost via ________.","opts":["A. skin evaporation and in air from the lungs","B. urine","C. excessive sweating","D. vomiting or diarrhea"],"a":"A. skin evaporation and in air from the lungs"},{"id":"s2-c26-rq11","ch":26,"section":"RQ","q":"How soon after drinking a large glass of water will a person start increasing their urine output?","opts":["A. 5 minutes","B. 30 minutes","C. 1 hour","D. 3 hours"],"a":"B. 30 minutes"},{"id":"s2-c26-rq12","ch":26,"section":"RQ","q":"Bone serves as a mineral reserve for which two ions?","opts":["A. sodium and potassium","B. calcium and phosphate","C. chloride and bicarbonate","D. calcium and bicarbonate"],"a":"B. calcium and phosphate"},{"id":"s2-c26-rq13","ch":26,"section":"RQ","q":"Electrolytes are lost mostly through ________.","opts":["A. renal function","B. sweating","C. feces","D. respiration"],"a":"A. renal function"},{"id":"s2-c26-rq14","ch":26,"section":"RQ","q":"The major cation in extracellular fluid is ________.","opts":["A. sodium","B. potassium","C. chloride","D. bicarbonate"],"a":"A. sodium"},{"id":"s2-c26-rq15","ch":26,"section":"RQ","q":"The major cation in intracellular fluid is ________.","opts":["A. sodium","B. potassium","C. chloride","D. bicarbonate"],"a":"B. potassium"},{"id":"s2-c26-rq16","ch":26,"section":"RQ","q":"The major anion in extracellular fluid is ________.","opts":["A. sodium","B. potassium","C. chloride","D. bicarbonate"],"a":"C. chloride"},{"id":"s2-c26-rq17","ch":26,"section":"RQ","q":"Most of the body’s calcium is found in ________. 1212     26 • Review Questions Access for free at openstax.org","opts":["A. teeth","B. bone","C. plasma","D. extracellular fluids"],"a":"B. bone"},{"id":"s2-c26-rq18","ch":26,"section":"RQ","q":"Abnormally increased blood levels of sodium are termed ________.","opts":["A. hyperkalemia","B. hyperchloremia","C. hypernatremia","D. hypercalcemia"],"a":"C. hypernatremia"},{"id":"s2-c26-rq19","ch":26,"section":"RQ","q":"The ion with the lowest blood level is ________.","opts":["A. sodium","B. potassium","C. chloride","D. bicarbonate"],"a":"B. potassium"},{"id":"s2-c26-rq20","ch":26,"section":"RQ","q":"Which two ions are most affected by aldosterone?","opts":["A. sodium and potassium","B. chloride and bicarbonate","C. calcium and phosphate","D. sodium and phosphate"],"a":"A. sodium and potassium"},{"id":"s2-c26-rq21","ch":26,"section":"RQ","q":"Which of the following is the most important buffer inside red blood cells?","opts":["A. plasma proteins","B. hemoglobin","C. phosphate buffers","D. bicarbonate: carbonic acid buffer"],"a":"B. hemoglobin"},{"id":"s2-c26-rq22","ch":26,"section":"RQ","q":"Which explanation best describes why plasma proteins can function as buffers?","opts":["A. Plasma proteins combine with bicarbonate to make a stronger buffer.","B. Plasma proteins are immune to damage from acids.","C. Proteins have both positive and negative charges on their surface.","D. Proteins are alkaline."],"a":"C. Proteins have both positive and negative charges on their surface."},{"id":"s2-c26-rq23","ch":26,"section":"RQ","q":"The buffer that is adjusted to control acid-base balance is ________.","opts":["A. plasma protein","B. hemoglobin","C. phosphate buffer","D. bicarbonate: carbonic acid buffer"],"a":"D. bicarbonate: carbonic acid buffer"},{"id":"s2-c26-rq24","ch":26,"section":"RQ","q":"Carbonic acid levels are controlled through the ________.","opts":["A. respiratory system","B. renal system","C. digestive system","D. metabolic rate of cells"],"a":"A. respiratory system"},{"id":"s2-c26-rq25","ch":26,"section":"RQ","q":"Bicarbonate ion concentrations in the blood are controlled through the ________.","opts":["A. respiratory system","B. renal system","C. digestive system","D. metabolic rate of cells 26 • Review Questions     1213"],"a":"B. renal system"},{"id":"s2-c26-rq26","ch":26,"section":"RQ","q":"Which reaction is catalyzed by carbonic anhydrase?","a":"CO2 + H2 O ↔ H2CO3"},{"id":"s2-c26-rq27","ch":26,"section":"RQ","q":"Which of the following is a cause of metabolic acidosis?","opts":["A. excessive HCl loss","B. increased aldosterone","C. diarrhea","D. prolonged use of diuretics"],"a":"C. diarrhea"},{"id":"s2-c26-rq28","ch":26,"section":"RQ","q":"Which of the following is a cause of respiratory acidosis?","opts":["A. emphysema","B. low blood K+","C. increased aldosterone","D. increased blood ketones"],"a":"A. emphysema"},{"id":"s2-c26-rq29","ch":26,"section":"RQ","q":"At a pH of 7.40, the carbonic acid ratio is ________.","opts":["A. 35:1","B. 4:1","C. 20:1","D. 3:1"],"a":"C. 20:1"},{"id":"s2-c26-rq30","ch":26,"section":"RQ","q":"Which of the following is characterized as metabolic alkalosis?","opts":["A. increased pH, decreased pCO2, decreased HCO3–","B. increased pH, increased pCO2, increased HCO3–","C. decreased pH, decreased pCO2, decreased HCO3–","D. decreased pH, increased pCO2, increased HCO3–"],"a":"B. increased pH, increased pCO2, increased HCO3–"},{"id":"s2-c26-ct31","ch":26,"section":"CT","q":"Plasma contains more sodium than chloride. How can this be if individual ions of sodium and chloride exactly balance each other out, and plasma is electrically neutral?","a":"There are additional negatively charged molecules in plasma besides chloride. The additional sodium balances the total negative charges."},{"id":"s2-c26-ct32","ch":26,"section":"CT","q":"How is fluid moved from compartment to compartment?","a":"Fluid is moved by a combination of osmotic and hydrostatic pressures. The osmotic pressure results from differences in solute concentrations across cell membranes. Hydrostatic pressure results from the pressure of blood as it enters a capillary system, forcing some fluid out of the vessel into the surrounding tissues."},{"id":"s2-c26-ct33","ch":26,"section":"CT","q":"Describe the effect of ADH on renal collecting tubules.","a":"ADH constricts the arterioles in the peripheral circulation, limiting blood to the extremities and increasing the blood supply to the core of the body. ADH also causes the epithelial cells lining the renal collecting tubules to move water channel proteins called aquaporins from the sides of the cells to the apical surface. This greatly increases the passage of water from the renal filtrate through the wall of the collecting tubule as well as the reabsorption of water into the bloodstream."},{"id":"s2-c26-ct34","ch":26,"section":"CT","q":"Why is it important for the amount of water intake to equal the amount of water output?","a":"Any imbalance of water entering or leaving the body will create an osmotic imbalance that will adversely affect cell and tissue function."},{"id":"s2-c26-ct35","ch":26,"section":"CT","q":"Explain how the CO2 generated by cells and exhaled in the lungs is carried as bicarbonate in the blood.","a":"Very little of the carbon dioxide in the blood is carried dissolved in the plasma. It is transformed into carbonic acid and then into bicarbonate in order to mix in plasma for transportation to the lungs, where it reverts back to its gaseous form."},{"id":"s2-c26-ct36","ch":26,"section":"CT","q":"How can one have an imbalance in a substance, but not actually have elevated or deficient levels of that substance in the body?","a":"Without having an absolute excess or deficiency of a substance, one can have too much or too little of that substance in a given compartment. Such a relative increase or decrease is due to a redistribution of water or the ion in the body’s compartments. This may be due to the loss of water in the blood, leading to a hemoconcentration or dilution of the ion in tissues due to edema."},{"id":"s2-c26-ct37","ch":26,"section":"CT","q":"Describe the conservation of bicarbonate ions in the renal system.","a":"Bicarbonate ions are freely filtered through the glomerulus. They cannot pass freely into the renal tubular cells and must be converted into CO2 in the filtrate, which can pass through the cell membrane. Sodium ions are reabsorbed at the membrane, and hydrogen ions are expelled into the filtrate. The hydrogen ions combine with bicarbonate, forming carbonic acid, which dissociates into CO2 gas and water. The gas diffuses into the renal cells where carbonic anhydrase catalyzes its conversion back into a bicarbonate ion, which enters the blood."},{"id":"s2-c26-ct38","ch":26,"section":"CT","q":"Describe the control of blood carbonic acid levels through the respiratory system.","a":"Carbonic acid blood levels are controlled through the respiratory system by the expulsion of CO2 from the lungs. The formula for the production of bicarbonate ions is reversible if the concentration of CO2 decreases. As this happens in the lungs, carbonic acid is converted into a gas, and the concentration of the acid decreases. The rate of respiration determines the amount of CO2 exhaled. If the rate increases, less acid is in the blood; if the rate decreases, the blood can become more acidic."},{"id":"s2-c26-ct39","ch":26,"section":"CT","q":"Case Study: Bob is a 64-year-old male admitted to the emergency room for asthma. His laboratory results are as follows: pH 7.31, pCO2 higher than normal, and total HCO3 – also higher than normal. Classify his acid-base balance as acidosis or alkalosis, and as metabolic or respiratory. Is there evidence of compensation? Propose the mechanism by which asthma contributed to the lab results seen.","a":"Respiratory acidosis is present as evidenced by the decreased pH and increased pCO2, with some compensation as shown by the increased total HCO3 – . His asthma has compromised his respiratory functions, and excess CO2 is being retained in his blood."},{"id":"s2-c26-ct40","ch":26,"section":"CT","q":"Case Study: Kim is a 38-year-old women admitted to the hospital for bulimia. Her laboratory results are as follows: pH 7.48, pCO2 in the normal range, and total HCO3 – higher than normal. Classify her acid-base balance as acidosis or alkalosis, and as metabolic or respiratory. Is there evidence of compensation? Propose the mechanism by which bulimia contributed to the lab results seen.","a":"Metabolic alkalosis is present as evidenced by the increased pH and increased HCO3 – , without compensation as seen in the normal pCO2. The bulimia has caused excessive loss of hydrochloric acid from the stomach and a loss of hydrogen ions from the body, resulting in an excess of bicarbonate ions in the blood. Anatomy &amp; Physiology Unit 6: Human Development and the Continuity of Life"}]},{"key":"s2m5","name":"Module 5","sub":"Reproductive (27)","semester":2,"cards":[{"id":"s2-c27-rq6","ch":27,"section":"RQ","q":"What are male gametes called?","opts":["A. ova","B. sperm","C. testes","D. testosterone"],"a":"B. sperm"},{"id":"s2-c27-rq7","ch":27,"section":"RQ","q":"Leydig cells ________.","opts":["A. secrete testosterone","B. activate the sperm flagellum","C. support spermatogenesis","D. secrete seminal fluid 27 • Interactive Link Questions     1249"],"a":"A. secrete testosterone"},{"id":"s2-c27-rq8","ch":27,"section":"RQ","q":"Which hypothalamic hormone contributes to the regulation of the male reproductive system?","opts":["A. luteinizing hormone","B. gonadotropin-releasing hormone","C. follicle-stimulating hormone","D. androgens"],"a":"B. gonadotropin-releasing hormone"},{"id":"s2-c27-rq9","ch":27,"section":"RQ","q":"What is the function of the epididymis?","opts":["A. sperm maturation and storage","B. produces the bulk of seminal fluid","C. provides nitric oxide needed for erections","D. spermatogenesis"],"a":"A. sperm maturation and storage"},{"id":"s2-c27-rq10","ch":27,"section":"RQ","q":"Spermatogenesis takes place in the ________.","opts":["A. prostate gland","B. glans penis","C. seminiferous tubules","D. ejaculatory duct"],"a":"C. seminiferous tubules"},{"id":"s2-c27-rq11","ch":27,"section":"RQ","q":"What are the female gonads called?","opts":["A. oocytes","B. ova","C. oviducts","D. ovaries"],"a":"D. ovaries"},{"id":"s2-c27-rq12","ch":27,"section":"RQ","q":"When do the oogonia undergo mitosis?","opts":["A. before birth","B. at puberty","C. at the beginning of each menstrual cycle","D. during fertilization"],"a":"A. before birth"},{"id":"s2-c27-rq13","ch":27,"section":"RQ","q":"From what structure does the corpus luteum originate?","opts":["A. uterine corpus","B. dominant follicle","C. fallopian tube","D. corpus albicans"],"a":"B. dominant follicle"},{"id":"s2-c27-rq14","ch":27,"section":"RQ","q":"Where does fertilization of the egg by the sperm typically occur?","opts":["A. vagina","B. uterus","C. uterine tube","D. ovary"],"a":"C. uterine tube"},{"id":"s2-c27-rq15","ch":27,"section":"RQ","q":"Why do estrogen levels fall after menopause?","opts":["A. The ovaries degrade.","B. There are no follicles left to produce estrogen.","C. The pituitary secretes a menopause-specific hormone.","D. The cells of the endometrium degenerate."],"a":"B. There are no follicles left to produce estrogen."},{"id":"s2-c27-rq16","ch":27,"section":"RQ","q":"The vulva includes the ________.","opts":["A. lactiferous duct, rugae, and hymen","B. lactiferous duct, endometrium, and bulbourethral glands","C. mons pubis, endometrium, and hymen","D. mons pubis, labia majora, and Bartholin’s glands 1250     27 • Review Questions Access for free at openstax.org"],"a":"D. mons pubis, labia majora, and Bartholin’s glands 1250     27 • Review Questions Access for free at openstax.org"},{"id":"s2-c27-rq17","ch":27,"section":"RQ","q":"What controls whether an embryo will develop testes or ovaries?","opts":["A. pituitary gland","B. hypothalamus","C. Y chromosome","D. presence or absence of estrogen"],"a":"C. Y chromosome"},{"id":"s2-c27-rq18","ch":27,"section":"RQ","q":"Without SRY expression, an embryo will develop ________.","opts":["A. male reproductive structures","B. female reproductive structures","C. no reproductive structures","D. male reproductive structures 50 percent of the time and female reproductive structures 50 percent of the time"],"a":"B. female reproductive structures"},{"id":"s2-c27-rq19","ch":27,"section":"RQ","q":"The timing of puberty can be influenced by which of the following?","opts":["A. genes","B. stress","C. amount of body fat","D. all of the above"],"a":"D. all of the above"},{"id":"s2-c27-ct20","ch":27,"section":"CT","q":"Briefly explain why mature gametes carry only one set of chromosomes.","a":"A single gamete must combine with a gamete from an individual of the opposite sex to produce a fertilized egg, which has a complete set of chromosomes and is the first cell of a new individual."},{"id":"s2-c27-ct21","ch":27,"section":"CT","q":"What special features are evident in sperm cells but not in somatic cells, and how do these specializations function?","a":"Unlike somatic cells, sperm are haploid. They also have very little cytoplasm. They have a head with a compact nucleus covered by an acrosome filled with enzymes, and a mid-piece filled with mitochondria that power their movement. They are motile because of their tail, a structure containing a flagellum, which is specialized for movement."},{"id":"s2-c27-ct22","ch":27,"section":"CT","q":"What do each of the three male accessory glands contribute to the semen?","a":"The three accessory glands make the following contributions to semen: the seminal vesicle contributes about 60 percent of the semen volume, with fluid that contains large amounts of fructose to power the movement of sperm; the prostate gland contributes substances critical to sperm maturation; and the bulbourethral glands contribute a thick fluid that lubricates the ends of the urethra and the vagina and helps to clean urine residues from the urethra."},{"id":"s2-c27-ct23","ch":27,"section":"CT","q":"Describe how penile erection occurs.","a":"During sexual arousal, nitric oxide (NO) is released from nerve endings near blood vessels within the corpora cavernosa and corpus spongiosum. The release of NO activates a signaling pathway that results in relaxation of the smooth muscles that surround the penile arteries, causing them to dilate. This dilation increases the amount of blood that can enter the penis, and induces the endothelial cells in the penile arterial walls to secrete NO, perpetuating the vasodilation. The rapid increase in blood volume fills the erectile chambers, and the increased pressure of the filled chambers compresses the thin-walled penile venules, preventing venous drainage of the penis. An erection is the result of this increased blood flow to the penis and reduced blood return from the penis."},{"id":"s2-c27-ct24","ch":27,"section":"CT","q":"While anabolic steroids (synthetic testosterone) bulk up muscles, they can also affect testosterone production in the testis. Using what you know about negative feedback, describe what would happen to testosterone production in the testis if a male takes large amounts of synthetic testosterone","a":"Testosterone production by the body would be reduced if a male were taking anabolic steroids. This is because the hypothalamus responds to rising testosterone levels by reducing its secretion of GnRH, which would in turn reduce the anterior pituitary’s release of LH, finally reducing the manufacture of testosterone in the testes."},{"id":"s2-c27-ct25","ch":27,"section":"CT","q":"Follow the path of ejaculated sperm from the vagina to the oocyte. Include all structures of the female reproductive tract that the sperm must swim through to reach the egg.","a":"The sperm must swim upward in the vagina, through the cervix, and then through the body of the uterus to one or the other of the two uterine tubes. Fertilization generally occurs in the uterine tube."},{"id":"s2-c27-ct26","ch":27,"section":"CT","q":"Identify some differences between meiosis in men and women.","a":"Meiosis in the man results in four viable haploid sperm, whereas meiosis in the woman results in a secondary oocyte and, upon completion following fertilization by a sperm, one viable haploid ovum with abundant cytoplasm and up to three polar bodies with little cytoplasm that are destined to die."},{"id":"s2-c27-ct27","ch":27,"section":"CT","q":"Explain the hormonal regulation of the phases of the menstrual cycle.","a":"As a result of the degradation of the corpus luteum, a decline in progesterone concentrations triggers the shedding of the endometrial lining, marking the menses phase of the menstrual cycle. Low progesterone levels also reduce the negative feedback that had been occurring at the hypothalamus and pituitary, and result in the release of GnRH and, subsequently, FSH and LH. FSH stimulates tertiary follicles to grow and granulosa and theca cells begin to produce increased amounts of estrogen. High estrogen concentrations stimulate the endometrial lining to rebuild, marking the proliferative phase of the menstrual cycle. The high estrogen concentrations will eventually lead to a decrease in FSH because of negative feedback, resulting in atresia of all but one of the developing tertiary follicles. The switch to positive feedback that occurs with elevated estrogen production from the dominant follicle stimulates the LH surge that will trigger ovulation. The luteinization of the granulosa cells of the collapsed follicle forms the progesterone-producing corpus luteum. Progesterone from the corpus luteum causes the endometrium to prepare for implantation, in part by secreting nutrient-rich fluid. This marks the secretory phase of the menstrual cycle. Finally, in a non-fertile cycle, the corpus luteum will degrade and menses will occur."},{"id":"s2-c27-ct28","ch":27,"section":"CT","q":"Endometriosis is a disorder in which endometrial cells implant and proliferate outside of the uterus—in the uterine tubes, on the ovaries, or even in the pelvic cavity. Offer a theory as to why endometriosis increases a woman’s risk of infertility.","a":"Endometrial tissue proliferating outside of the endometrium—for example, in the uterine tubes, on the ovaries, or within the pelvic cavity—could block the passage of sperm, ovulated oocytes, or a zygote, thus reducing fertility."},{"id":"s2-c27-ct29","ch":27,"section":"CT","q":"Identify the changes in sensitivity that occur in the hypothalamus, pituitary, and gonads as a boy or girl approaches puberty. Explain how these changes lead to the increases of sex steroid hormone secretions that drive many pubertal changes.","a":"As an individual approaches puberty, two changes in sensitivity occur. The first is a decrease of sensitivity in the hypothalamus and pituitary to negative feedback, meaning that it takes increasingly larger concentrations of sex steroid hormones to stop the production of LH and FSH. The second change in sensitivity is an increase in the sensitivity of the gonads to the FSH and LH signals, meaning that the gonads of adults are more responsive to gonadotropins than are the gonads of children. As a result of these two changes, the levels of LH and FSH slowly increase and lead to the enlargement and maturation of the gonads, which in turn leads to secretion of higher levels of sex hormones and the initiation of spermatogenesis and folliculogenesis."},{"id":"s2-c27-ct30","ch":27,"section":"CT","q":"Explain how the internal female and male reproductive structures develop from two different duct systems.","a":"The internal reproductive structures form from one of two rudimentary duct systems in the embryo. Testosterone secretion stimulates growth of the male tract, the Wolffian duct. Secretions of sustentacular cells trigger a degradation of the female tract, the Müllerian duct. Without these stimuli, the Müllerian duct will develop and the Wolffian duct will degrade, resulting in a female embryo."},{"id":"s2-c27-ct31","ch":27,"section":"CT","q":"Explain what would occur during fetal development to an XY individual with a mutation causing a nonfunctional SRY gene.","a":"If the SRY gene were not functional, the XY individual would be genetically a male, but would develop female reproductive structures. Anatomy &amp; Physiology Unit 6: Human Development and the Continuity of Life"}]}];
const STORE_KEY = 'apbio_status_v1';
function loadStatus(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};} }
function saveStatus(s){ try{localStorage.setItem(STORE_KEY, JSON.stringify(s));}catch(e){} }
let status = loadStatus();
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(scr){ ['semesters','home','study','result'].forEach(s=>$(s).style.display=(s===scr?'block':'none')); }
function allCards(){ return MODULES.flatMap(m=>m.cards); }

let curSem=1;
function semDecks(sem){ return MODULES.filter(m=>(m.semester||1)===sem); }
function semCards(sem){ return semDecks(sem).flatMap(m=>m.cards); }
function renderSemesters(){
  const cont=$('semList'); cont.innerHTML='';
  [{n:1,name:'Semester 1',sub:'Anatomy &amp; Physiology I &middot; Ch 1–14'},{n:2,name:'Semester 2',sub:'Anatomy &amp; Physiology II (BIO 232) &middot; Ch 14–27'}].forEach(s=>{
    const decks=semDecks(s.n), cards=decks.flatMap(d=>d.cards); let g=0,r=0;
    cards.forEach(c=>{const st=status[c.id]; if(st==='green')g++; else if(st==='red')r++;});
    const div=document.createElement('div'); div.className='module';
    div.innerHTML='<h2>'+s.name+'</h2><div class="msub">'+s.sub+' &middot; '+decks.length+' decks &middot; '+cards.length+' cards</div><div class="stats"><span><span class="dot" style="background:var(--green)"></span><b>'+g+'</b> known</span><span><span class="dot" style="background:var(--red)"></span><b>'+r+'</b> missed</span></div><div class="row"><button class="btn-all">Open '+s.name+' &rarr;</button></div>';
    div.querySelector('button').onclick=()=>{curSem=s.n; renderHome(); show('home');};
    cont.appendChild(div);
  });
}
function renderHome(){
  $('homeTitle').innerHTML = curSem===2 ? 'Anatomy &amp; Physiology II' : 'BIO 231 &mdash; Anatomy &amp; Physiology I';
  $('homeSub').innerHTML = (curSem===2?'Second semester (BIO 232) &middot; Ch 14–27':'First semester &middot; Ch 1–14')+' &middot; tap a card to flip &middot; mark green/red &middot; misses saved on this device';
  const cont=$('modules'); cont.innerHTML='';
  const decks=semDecks(curSem);
  const groups=[{key:'all',name:'All Modules',sub:'Everything in this semester combined',cards:semCards(curSem)}].concat(decks);
  groups.forEach(m=>{
    const total=m.cards.length; let g=0,r=0,u=0;
    m.cards.forEach(c=>{const st=status[c.id]; if(st==='green')g++; else if(st==='red')r++; else u++;});
    const div=document.createElement('div'); div.className='module';
    div.innerHTML=
      '<h2>'+m.name+'</h2>'+
      '<div class="msub">'+m.sub+' &middot; '+total+' cards</div>'+
      '<div class="stats">'+
        '<span><span class="dot" style="background:var(--green)"></span><b>'+g+'</b> known</span>'+
        '<span><span class="dot" style="background:var(--red)"></span><b>'+r+'</b> missed</span>'+
        '<span><span class="dot" style="background:var(--muted)"></span><b>'+u+'</b> new</span>'+
      '</div>'+
      '<div class="row">'+
        '<button class="btn-all">Study all ('+total+')</button>'+
        '<button class="btn-missed"'+(r===0?' disabled':'')+'>Missed only ('+r+')</button>'+
      '</div>';
    const btns=div.querySelectorAll('button');
    btns[0].onclick=()=>startSession(m.cards.slice(), m.name, 'all');
    btns[1].onclick=()=>startSession(m.cards.filter(c=>status[c.id]==='red'), m.name+' &middot; misses', 'missed');
    cont.appendChild(div);
  });
}

let S=null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startSession(cards,name,mode){
  if(!cards.length) return;
  S={queue:shuffle(cards.slice()),idx:0,flipped:false,g:0,r:0,missed:[],name:name,mode:mode};
  show('study'); renderCard();
}
function setFace(toAnswer){
  const c=S.queue[S.idx]; S.flipped=toAnswer;
  if(toAnswer){
    $('qlabel').textContent='Answer';
    // Show labeled version (imgBack) on answer face if present; else hide image
    if(c.imgBack){
      $('cardimgsrc').src=c.imgBack;
      $('cardimg').style.display='block';
    } else {
      $('cardimg').style.display='none';
    }
    $('cardtext').textContent=c.a; $('cardtext').className='atext'; $('cardtext').style.display='block';
    $('cardopts').style.display='none';
    $('cardhint').textContent='tap card to flip back to question'; $('cardhint').style.display='block';
    $('flipBtn').style.display='none';
    $('controls').style.display='flex';
  } else {
    $('qlabel').textContent='Question'+(c.ch?(' · Ch '+c.ch):'');
    if(c.img){
      $('cardimgsrc').src=c.img;
      $('cardimg').style.display='block';
      if(c.q){ $('cardtext').textContent=c.q; $('cardtext').className='qtext'; $('cardtext').style.display='block'; }
      else { $('cardtext').textContent='Identify this tissue'; $('cardtext').className='qtext'; $('cardtext').style.display='block'; }
    } else {
      $('cardimg').style.display='none';
      $('cardtext').textContent=c.q; $('cardtext').className='qtext'; $('cardtext').style.display='block';
    }
    if(c.opts && c.opts.length){ $('cardopts').innerHTML=c.opts.map(o=>'<div class="opt">'+esc(o)+'</div>').join(''); $('cardopts').style.display='block'; }
    else { $('cardopts').style.display='none'; }
    $('cardhint').textContent='tap to reveal · space'; $('cardhint').style.display='block';
    $('flipBtn').style.display='block';
    $('controls').style.display='none';
  }
}
function renderCard(){
  $('poslabel').textContent=(S.idx+1)+' / '+S.queue.length;
  $('gtally').textContent=S.g; $('rtally').textContent=S.r;
  $('progbar').style.width=(S.idx/S.queue.length*100)+'%';
  setFace(false);
}
function flip(){ setFace(true); }
function toggleFlip(){ setFace(!S.flipped); }
function mark(ok){
  if(!S.flipped) return; const c=S.queue[S.idx];
  status[c.id]=ok?'green':'red'; saveStatus(status);
  if(ok) S.g++; else {S.r++; S.missed.push(c);}
  S.idx++;
  if(S.idx>=S.queue.length) endRound(); else renderCard();
}
function endRound(){
  $('progbar').style.width='100%';
  $('resG').textContent=S.g; $('resR').textContent=S.r;
  $('resTitle').textContent = S.r===0 ? 'Perfect round! 🎉' : 'Round complete';
  $('reviewMissedBtn').disabled=S.missed.length===0;
  $('reviewMissedBtn').textContent='Review missed ('+S.missed.length+')';
  show('result');
}
$('card').onclick=toggleFlip;
$('flipBtn').onclick=flip;
$('greenBtn').onclick=()=>mark(true);
$('redBtn').onclick=()=>mark(false);
$('quitBtn').onclick=()=>{renderHome(); show('home');};
$('homeBtn').onclick=()=>{renderHome(); show('home');};
$('backToSem').onclick=()=>{renderSemesters(); show('semesters');};
$('reviewMissedBtn').onclick=()=>startSession(S.missed.slice(), S.name, 'missed');
$('againBtn').onclick=()=>startSession(S.queue.slice(), S.name, S.mode);
$('resetBtn').onclick=()=>{ if(confirm('Erase all green/red progress on this device?')){status={}; saveStatus(status); renderHome();} };
document.addEventListener('keydown',e=>{
  if($('study').style.display!=='block') return;
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); toggleFlip(); }
  else if(S.flipped && (e.key==='g'||e.key==='ArrowRight'||e.key==='1')) mark(true);
  else if(S.flipped && (e.key==='r'||e.key==='ArrowLeft'||e.key==='2')) mark(false);
});
function setOfflineStatus(text,ready){
  const el=$('offlineStatus'); if(!el) return;
  el.textContent=text;
  el.className='offline-status'+(ready?' ready':'');
}
function offlineAssets(){
  const urls=new Set(['./','./index.html','./service-worker.js']);
  allCards().forEach(c=>{ if(c.img) urls.add(c.img); if(c.imgBack) urls.add(c.imgBack); });
  return Array.from(urls);
}
function setupOfflineCache(){
  if(!('serviceWorker' in navigator) || !('caches' in window)){
    setOfflineStatus('Offline cache: not supported in this browser',false); return;
  }
  const urls=offlineAssets();
  const controlled=!!navigator.serviceWorker.controller;
  if(!navigator.onLine){ setOfflineStatus('Offline mode: saved cards and images are available',true); return; }
  setOfflineStatus(controlled?'Offline ready: saved cards and images are available':'Offline cache: preparing '+urls.length+' files...',controlled);
  const registrationReady=navigator.serviceWorker.getRegistration()
    .then(reg=>reg||navigator.serviceWorker.register('./service-worker.js'))
    .then(()=>navigator.serviceWorker.ready);
  Promise.race([registrationReady,new Promise(resolve=>setTimeout(()=>resolve(null),6000))])
    .then(reg=>new Promise(resolve=>{
      if(!reg){ resolve({cached:controlled?urls.length:0,total:urls.length}); return; }
      const worker=reg.active||reg.waiting||reg.installing;
      if(!worker){ resolve({cached:0,total:urls.length}); return; }
      const channel=new MessageChannel();
      const timer=setTimeout(()=>resolve({cached:0,total:urls.length,timeout:true}),45000);
      channel.port1.onmessage=e=>{ clearTimeout(timer); resolve(e.data||{}); };
      worker.postMessage({type:'CACHE_URLS',urls:urls},[channel.port2]);
    }))
    .then(data=>{
      const total=data.total||urls.length, cached=data.cached||0;
      if(cached>=total) setOfflineStatus('Offline ready: '+cached+' files saved on this device',true);
      else setOfflineStatus('Offline cache: saved '+cached+' of '+total+' files; keep this page open online once',false);
    })
    .catch(()=>setOfflineStatus(controlled?'Offline ready: saved cards and images are available':'Offline cache: open this page online once before the flight',controlled));
}
window.addEventListener('online',setupOfflineCache);
window.addEventListener('offline',()=>setOfflineStatus('Offline mode: saved cards and images are available',true));
setupOfflineCache();
renderSemesters(); show('semesters');
</script>
