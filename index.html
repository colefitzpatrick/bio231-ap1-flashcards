. glenoid cavity and scapular spine.","C. acromial and coracoid processes.","D. manubrium and xiphoid process.","E. acromial process and the manubrium."]},{"id":"m3-c8-mc11","ch":8,"section":"MC","q":"The clavicle articulates with the scapula","a":"C. distally with the acromion.","opts":["A. distally with the coracoid process.","B. distally with the glenoid cavity.","C. distally with the acromion.","D. distally with the manubrium.","E. proximally with the coracoid cavity."]},{"id":"m3-c8-mc12","ch":8,"section":"MC","q":"The condition known as \"flat feet\" is due to a lower-than-normal longitudinal arch in the foot. A problem with which of the following would most likely contribute to this condition?","a":"C. weakness in the ligaments that attach the calcaneus to the distal ends of the metatarsals","opts":["A. a loose Achilles tendon","B. weak tarsometatarsal joints","C. weakness in the ligaments that attach the calcaneus to the distal ends of the metatarsals","D. weakness in the ligaments that attach the talus to the tibia","E. poor alignment of the phalanges with the metatarsals"]},{"id":"m3-c8-mc13","ch":8,"section":"MC","q":"The condyle of the humerus consists of the","a":"C. capitulum and trochlea.","opts":["A. medial and lateral epicondyles.","B. trochlea and olecranon fossa.","C. capitulum and trochlea.","D. head and neck.","E. capitulum and coronoid process."]},{"id":"m3-c8-mc14","ch":8,"section":"MC","q":"The coxal bone and sacrum combine to form the","a":"A. pelvis.","opts":["A. pelvis.","B. pelvic girdle.","C. hips.","D. pectoral girdle.","E. pubic symphysis."]},{"id":"m3-c8-mc15","ch":8,"section":"MC","q":"The distal end of the tibia articulates with the","a":"A. talus.","opts":["A. talus.","B. fibula.","C. patella.","D. calcaneus.","E. coxal bone."]},{"id":"m3-c8-mc16","ch":8,"section":"MC","q":"The foot has ________ ankle bones and ________ bones in the sole.","a":"B. 7; 5","opts":["A. 5; 5","B. 7; 5","C. 8; 4","D. 8; 5","E. 4; 5"]},{"id":"m3-c8-mc17","ch":8,"section":"MC","q":"The greater sciatic notch is a feature on the","a":"A. ilium.","opts":["A. ilium.","B. ischium.","C. pubis.","D. femur.","E. patella."]},{"id":"m3-c8-mc18","ch":8,"section":"MC","q":"The glenohumeral joint, or shoulder joint, is an articulation between which two bones?","a":"B. scapula and humerus","opts":["A. humerus and ulna","B. scapula and humerus","C. clavicle and scapula","D. clavicle and humerus","E. clavicle and sternum"]},{"id":"m3-c8-mc19","ch":8,"section":"MC","q":"The hand has ________ wrist and ________ palm bones.","a":"D. 8; 5","opts":["A. 5; 5","B. 10; 5","C. 8; 4","D. 8; 5","E. 4; 5"]},{"id":"m3-c8-mc20","ch":8,"section":"MC","q":"The head of the humerus articulates with the","a":"B. glenoid cavity.","opts":["A. trochlear notch.","B. glenoid cavity.","C. acetabulum.","D. carpal bones.","E. coxal bone."]},{"id":"m3-c8-mc21","ch":8,"section":"MC","q":"The head of the radius articulates with the","a":"B. capitulum.","opts":["A. trochlea.","B. capitulum.","C. carpals.","D. olecranon process.","E. styloid process."]},{"id":"m3-c8-mc22","ch":8,"section":"MC","q":"The ilium, ischium, and pubis fuse into a single bone called the","a":"E. coxal bone.","opts":["A. patella.","B. pelvis.","C. pectoral girdle.","D. coccyx.","E. coxal bone."]},{"id":"m3-c8-mc23","ch":8,"section":"MC","q":"The largest component of the coxal bone is the","a":"C. ilium.","opts":["A. pubis.","B. ischium.","C. ilium.","D. femur.","E. tibia."]},{"id":"m3-c8-mc24","ch":8,"section":"MC","q":"The lateral malleolus is found on the","a":"C. fibula.","opts":["A. femur.","B. tibia.","C. fibula.","D. patella.","E. calcaneus."]},{"id":"m3-c8-mc25","ch":8,"section":"MC","q":"The linea aspera is located on the","a":"D. femur.","opts":["A. humerus.","B. tibia.","C. ischium.","D. femur.","E. scapula."]},{"id":"m3-c8-mc26","ch":8,"section":"MC","q":"The longest bone is the","a":"D. femur.","opts":["A. coxal bone.","B. sternum.","C. humerus.","D. femur.","E. tibia."]},{"id":"m3-c8-mc27","ch":8,"section":"MC","q":"The longest and heaviest bone in the body is the","a":"B. femur.","opts":["A. humerus.","B. femur.","C. tibia.","D. fibula.","E. coxal bone."]},{"id":"m3-c8-mc28","ch":8,"section":"MC","q":"The medial border of the fibula is bound to the ________ by the interosseous membrane.","a":"B. tibia","opts":["A. femur","B. tibia","C. patella","D. navicular","E. femur and the tibia"]},{"id":"m3-c8-mc29","ch":8,"section":"MC","q":"The only direct connection between the pectoral girdle and the axial skeleton is where the","a":"B. clavicle articulates with the manubrium of the sternum.","opts":["A. clavicle articulates with the humerus.","B. clavicle articulates with the manubrium of the sternum.","C. coxal bones articulate with the femur.","D. vertebral column articulates with the sacrum.","E. clavicle articulates with the xiphoid process."]},{"id":"m3-c8-mc30","ch":8,"section":"MC","q":"The sacrum articulates with the","a":"A. ilium.","opts":["A. ilium.","B. ischium.","C. pubis.","D. ilium and ischium.","E. ischium and pubis."]},{"id":"m3-c8-mc31","ch":8,"section":"MC","q":"The talus contacts the","a":"E. tibia, calcaneus, and navicular bones.","opts":["A. calcaneus.","B. navicular bone.","C. tibia.","D. calcaneus and navicular bones.","E. tibia, calcaneus, and navicular bones."]},{"id":"m3-c8-mc32","ch":8,"section":"MC","q":"The three sides of this bone form a broad triangle.","a":"E. scapula","opts":["A. radius","B. clavicle","C. vertebra","D. sternum","E. scapula"]},{"id":"m3-c8-mc33","ch":8,"section":"MC","q":"The weight of the body is supported by the","a":"E. distal metacarpals and the calcaneus.","opts":["A. distal metacarpals.","B. proximal metatarsals.","C. distal ends of the metatarsals.","D. calcaneus.","E. distal metacarpals and the calcaneus."]},{"id":"m3-c8-mc34","ch":8,"section":"MC","q":"What bone articulates with the coxal bone at the acetabulum?","a":"B. femur","opts":["A. sacrum","B. femur","C. humerus","D. tibia","E. fibula"]},{"id":"m3-c8-mc35","ch":8,"section":"MC","q":"When seated, the weight of the body is borne by the","a":"A. ischial tuberosities.","opts":["A. ischial tuberosities.","B. posterior inferior iliac spines.","C. iliac crests.","D. obturator foramina.","E. inferior rami of the pubis."]},{"id":"m3-c8-mc36","ch":8,"section":"MC","q":"When standing normally, most of your weight is transmitted to the ground by the","a":"A. distal ends of the metatarsals and calcaneus.","opts":["A. distal ends of the metatarsals and calcaneus.","B. talus and proximal metatarsals.","C. calcaneus and talus.","D. talus and cuneiforms.","E. calcaneus and proximal metatarsals."]},{"id":"m3-c9-mc1","ch":9,"section":"MC","q":"A ________ occurs when articulating surfaces are forced out of position. (fill in the blank)","a":"dislocation"},{"id":"m3-c9-mc2","ch":9,"section":"MC","q":"A freely movable joint is a(n)","a":"B. diarthrosis.","opts":["A. synarthrosis.","B. diarthrosis.","C. amphiarthrosis.","D. syndesmosis.","E. symphysis."]},{"id":"m3-c9-mc3","ch":9,"section":"MC","q":"A herniated disc occurs when the","a":"A. nucleus pulposus breaks through the anulus fibrosus.","opts":["A. nucleus pulposus breaks through the anulus fibrosus.","B. disc slips out from between the adjacent vertebrae.","C. adjacent bones fuse.","D. knee is hyperextended.","E. inner core of the disc is squeezed to one side."]},{"id":"m3-c9-mc4","ch":9,"section":"MC","q":"A joint where bones fuse together with bone tissue is called a","a":"C. synostosis.","opts":["A. synchondrosis.","B. syndesmosis.","C. synostosis.","D. symphysis.","E. suture."]},{"id":"m3-c9-mc5","ch":9,"section":"MC","q":"A movement away from the midline of the body is termed","a":"B. abduction.","opts":["A. inversion.","B. abduction.","C. adduction.","D. flexion.","E. extension."]},{"id":"m3-c9-mc6","ch":9,"section":"MC","q":"A slightly movable joint is a(n)","a":"C. amphiarthrosis.","opts":["A. synarthrosis.","B. diarthrosis.","C. amphiarthrosis.","D. gomphosis.","E. synostosis."]},{"id":"m3-c9-mc7","ch":9,"section":"MC","q":"A suture is an example of a(n)","a":"A. synarthrosis.","opts":["A. synarthrosis.","B. syndesmosis.","C. symphysis.","D. diarthrosis.","E. amphiarthrosis."]},{"id":"m3-c9-mc8","ch":9,"section":"MC","q":"A synovial joint is an example of a(n)","a":"C. diarthrosis.","opts":["A. synarthrosis.","B. amphiarthrosis.","C. diarthrosis.","D. symphysis.","E. syndesmosis."]},{"id":"m3-c9-mc9","ch":9,"section":"MC","q":"A twisting motion of the foot that turns the sole of the foot outward is known as","a":"C. eversion.","opts":["A. inversion.","B. plantar flexion.","C. eversion.","D. dorsiflexion.","E. pronation."]},{"id":"m3-c9-mc10","ch":9,"section":"MC","q":"An epiphyseal line is an example of a","a":"C. synostosis.","opts":["A. gomphosis.","B. synchondrosis.","C. synostosis.","D. symphysis.","E. syndesmosis."]},{"id":"m3-c9-mc11","ch":9,"section":"MC","q":"An example of a synchondrosis is the articulation of the","a":"A. ribs with the sternum.","opts":["A. ribs with the sternum.","B. radius and the ulna.","C. femur with the acetabulum.","D. atlas and the axis.","E. navicular bone with the cuniform bones."]},{"id":"m3-c9-mc12","ch":9,"section":"MC","q":"An extension past the anatomical position is known as","a":"E. hyperextension.","opts":["A. double-jointed.","B. extension.","C. flexion.","D. rotation.","E. hyperextension."]},{"id":"m3-c9-mc13","ch":9,"section":"MC","q":"An immovable joint is a(n)","a":"A. synarthrosis.","opts":["A. synarthrosis.","B. diarthrosis.","C. amphiarthrosis.","D. syndesmosis.","E. symphysis."]},{"id":"m3-c9-mc14","ch":9,"section":"MC","q":"Ankle extension is also called","a":"D. plantar flexion.","opts":["A. dorsiflexion.","B. inversion.","C. eversion.","D. plantar flexion.","E. protraction."]},{"id":"m3-c9-mc15","ch":9,"section":"MC","q":"Bursae are found in all of the following areas, except","a":"D. around blood vessels.","opts":["A. tendon sheaths.","B. beneath the skin covering a bone.","C. within connective tissue exposed to friction or pressure.","D. around blood vessels.","E. around many synovial joints."]},{"id":"m3-c9-mc16","ch":9,"section":"MC","q":"Extending a body part past the anatomical position is called ________. (fill in the blank)","a":"hyperextension"},{"id":"m3-c9-mc17","ch":9,"section":"MC","q":"In a triaxial articulation","a":"A. movement can occur in all three axes.","opts":["A. movement can occur in all three axes.","B. movement can occur in only two axes.","C. movement can occur in only one axis.","D. only circumduction is possible.","E. no movement is possible."]},{"id":"m3-c9-mc18","ch":9,"section":"MC","q":"Joints can be classified structurally as","a":"E. All of the answers are correct.","opts":["A. bony.","B. fibrous.","C. cartilaginous.","D. synovial.","E. All of the answers are correct."]},{"id":"m3-c9-mc19","ch":9,"section":"MC","q":"In the knee joint, the medial and lateral menisci","a":"B. act as cushions and conform to the shape of the articulating surfaces.","opts":["A. are cartilages that bind the knee to the tibia.","B. act as cushions and conform to the shape of the articulating surfaces.","C. take the place of bursae.","D. are found between the patella and femur.","E. are fat pads to protect the articulating bones."]},{"id":"m3-c9-mc20","ch":9,"section":"MC","q":"Monaxial joints are known as ________ joints.","a":"E. hinge","opts":["A. saddle","B. gliding","C. ball-and-socket","D. condylar","E. hinge"]},{"id":"m3-c9-mc21","ch":9,"section":"MC","q":"Nodding your head \"yes\" is an example of","a":"C. flexion and extension.","opts":["A. lateral and medial rotation.","B. circumduction.","C. flexion and extension.","D. pronation and supination.","E. protraction and retraction."]},{"id":"m3-c9-mc22","ch":9,"section":"MC","q":"The \"rotator cuff\" of the shoulder functions to","a":"E. reinforce the joint capsule and limit the range of movements.","opts":["A. reinforce the joint capsule.","B. limit the range of movements.","C. allow biaxial movement.","D. allow monaxial movement.","E. reinforce the joint capsule and limit the range of movements."]},{"id":"m3-c9-mc23","ch":9,"section":"MC","q":"The ankle joint is an example of a(n) ________ joint.","a":"C. hinge","opts":["A. condylar","B. saddle","C. hinge","D. ball-and-socket","E. gliding"]},{"id":"m3-c9-mc24","ch":9,"section":"MC","q":"The elbow joint is an example of a(n) ________ joint.","a":"D. hinge","opts":["A. saddle","B. gliding","C. condylar","D. hinge","E. pivot"]},{"id":"m3-c9-mc25","ch":9,"section":"MC","q":"The elbow joint is extremely stable because","a":"A. the ulna and humerus interlock.","opts":["A. the ulna and humerus interlock.","B. the articular capsule is thin.","C. the capsule lacks ligaments.","D. several muscles support the joint capsule.","E. the joint lacks bursae."]},{"id":"m3-c9-mc26","ch":9,"section":"MC","q":"The intervertebral disc joint is called a","a":"E. symphysis.","opts":["A. synarthrosis.","B. glide joint.","C. condylar joint.","D. synchondrosis.","E. symphysis."]},{"id":"m3-c9-mc27","ch":9,"section":"MC","q":"The joint between the carpals is a/an ________ joint.","a":"D. gliding","opts":["A. condylar","B. pivot","C. hinge","D. gliding","E. amphiarthrosis"]},{"id":"m3-c9-mc28","ch":9,"section":"MC","q":"The joint between the forearm bones and the wrist is a","a":"D. condylar joint.","opts":["A. saddle joint.","B. glide joint.","C. hinge joint.","D. condylar joint.","E. pivot joint."]},{"id":"m3-c9-mc29","ch":9,"section":"MC","q":"The joints between vertebrae are examples of ________ joints.","a":"E. gliding","opts":["A. saddle","B. pivot","C. condylar","D. hinge","E. gliding"]},{"id":"m3-c9-mc30","ch":9,"section":"MC","q":"The knee joint is stabilized by ________ major ligaments. (fill in the blank)","a":"7"},{"id":"m3-c9-mc31","ch":9,"section":"MC","q":"The knuckle joint is classified as a ________ joint.","a":"A. condylar","opts":["A. condylar","B. hinge","C. glide","D. saddle","E. pivot"]},{"id":"m3-c9-mc32","ch":9,"section":"MC","q":"The radiocarpal joint is a(n) ________ joint.","a":"E. condylar","opts":["A. saddle","B. immovable","C. hinge","D. gliding","E. condylar"]},{"id":"m3-c9-mc33","ch":9,"section":"MC","q":"The surface of articular cartilage is","a":"E. both slick and smooth.","opts":["A. slick.","B. flat.","C. smooth.","D. rough.","E. both slick and smooth."]},{"id":"m3-c9-mc34","ch":9,"section":"MC","q":"The synarthrosis that binds the teeth to the bony sockets is a","a":"B. gomphosis.","opts":["A. suture.","B. gomphosis.","C. synchondrosis.","D. synotosis.","E. syndesmosis."]},{"id":"m3-c7-lab1","ch":7,"section":"Lab","q":"The internal acoustic meatus is in the ________ bone.","a":"temporal bone"},{"id":"m3-c7-lab2","ch":7,"section":"Lab","q":"The occipital condyles of the skull articulate with the ________.","a":"the atlas (first cervical vertebra, C1)"},{"id":"m3-c7-lab3","ch":7,"section":"Lab","q":"The hard palate of the roof of the mouth is mostly formed by the palatine process of the ________.","a":"maxilla (maxillae)"},{"id":"m3-c7-lab4","ch":7,"section":"Lab","q":"The foramen magnum is found in the ________ bone.","a":"occipital bone"},{"id":"m3-c7-lab5","ch":7,"section":"Lab","q":"The suture that forms the articulation of the parietal bones with the frontal bone is the ________ suture.","a":"coronal suture"},{"id":"m3-c7-lab6","ch":7,"section":"Lab","q":"The calvaria (or skullcap) is formed by the frontal, parietal, and ________ bones.","a":"occipital bones"},{"id":"m3-c7-lab7","ch":7,"section":"Lab","q":"The zygomatic arch is formed by the union of processes from the ________ and zygomatic bones.","a":"temporal bone (temporal process of zygomatic + zygomatic process of temporal)"},{"id":"m3-c7-lab8","ch":7,"section":"Lab","q":"The prominent bulge just posterior and inferior to the external auditory meatus is the ________ process.","a":"mastoid process"},{"id":"m3-c7-lab9","ch":7,"section":"Lab","q":"What organ is in the lacrimal fossa?","a":"the lacrimal gland (tear gland)"},{"id":"m3-c7-lab10","ch":7,"section":"Lab","q":"A point of attachment for muscles that rotate or extend the head is the ________ process.","a":"mastoid process"},{"id":"m3-c7-lab11","ch":7,"section":"Lab","q":"Ligaments that support the hyoid bone are attached to the ________ process.","a":"styloid process"},{"id":"m3-c7-lab12","ch":7,"section":"Lab","q":"The hypophyseal fossa of the sella turcica contains the ________ gland.","a":"pituitary (hypophyseal) gland"},{"id":"m3-c7-lab13","ch":7,"section":"Lab","q":"A membrane that stabilizes the position of the brain is attached to the ________.","a":"crista galli"},{"id":"m3-c7-lab14","ch":7,"section":"Lab","q":"The ________ process of the mandible supports the lower teeth.","a":"alveolar process"},{"id":"m3-c7-lab15","ch":7,"section":"Lab","q":"The function of the ________ bone is to anchor the tongue muscles.","a":"hyoid bone"},{"id":"m3-c8-lab1","ch":8,"section":"Lab","q":"The only direct connection between the pectoral girdle and the axial skeleton is where the ________ articulates with the manubrium of the sternum.","a":"clavicle"},{"id":"m3-c8-lab2","ch":8,"section":"Lab","q":"The clavicle articulates with the ________ process and the manubrium.","a":"acromial (acromion) process"},{"id":"m3-c8-lab3","ch":8,"section":"Lab","q":"What constitutes the pectoral and pelvic girdle?","a":"Pectoral girdle = clavicles + scapulae; pelvic girdle = the two hip (coxal) bones, each formed by the fused ilium, ischium, and pubis."},{"id":"m3-c8-lab4","ch":8,"section":"Lab","q":"The depression on the posterior surface at the distal end of the humerus is the ________ fossa. The head of the humerus articulates with the ________ cavity.","a":"olecranon fossa; glenoid cavity"},{"id":"m3-c8-lab5","ch":8,"section":"Lab","q":"The glenohumeral (shoulder) joint is an articulation between which two bones?","a":"the scapula and the humerus"},{"id":"m3-c8-lab6","ch":8,"section":"Lab","q":"In the anatomical position, the ulna is located ________ to the radius.","a":"medial"},{"id":"m3-c8-lab7","ch":8,"section":"Lab","q":"The bones that form the fingers are the ________.","a":"phalanges"},{"id":"m3-c8-lab8","ch":8,"section":"Lab","q":"The rough surface feature present along the lateral border of the shaft of the humerus is the ________ tuberosity.","a":"deltoid tuberosity"},{"id":"m3-c8-lab9","ch":8,"section":"Lab","q":"The head of the radius articulates with the ________.","a":"capitulum (of the humerus)"},{"id":"m3-c8-lab10","ch":8,"section":"Lab","q":"What bone articulates with the coxal bone at the acetabulum?","a":"the femur"},{"id":"m3-c8-lab11","ch":8,"section":"Lab","q":"When seated, the weight of the body is borne by this bone: ________.","a":"the ischium (ischial tuberosities)"},{"id":"m3-c8-lab12","ch":8,"section":"Lab","q":"A male has a ________ pelvic outlet when compared to the woman's pelvic outlet.","a":"smaller"},{"id":"m3-c8-lab13","ch":8,"section":"Lab","q":"Each coxal bone consists of the following three fused bones: ________, ischium, and pubis.","a":"ilium"},{"id":"m3-c8-lab14","ch":8,"section":"Lab","q":"The superior border of the ilium that acts as a point of attachment for both ligaments and muscles is the ________ crest.","a":"iliac crest"},{"id":"m3-c8-lab15","ch":8,"section":"Lab","q":"The longest and heaviest bone in the body is the ________.","a":"femur"},{"id":"m3-c8-lab16","ch":8,"section":"Lab","q":"The distal end of the tibia articulates with the ________.","a":"talus"},{"id":"m3-c8-lab17","ch":8,"section":"Lab","q":"The lateral malleolus is found on the ________.","a":"fibula"},{"id":"m3-c9-lab1","ch":9,"section":"Lab","q":"Joints can be classified structurally as bony, fibrous, cartilaginous and ________.","a":"synovial"},{"id":"m3-c9-lab2","ch":9,"section":"Lab","q":"The synarthrosis that binds the teeth to the bony sockets is a ________.","a":"gomphosis"},{"id":"m3-c9-lab3","ch":9,"section":"Lab","q":"A slightly movable joint is a(n) ________. A synovial joint is an example of a(n) ________.","a":"amphiarthrosis; diarthrosis"},{"id":"m3-c9-lab4","ch":9,"section":"Lab","q":"A ligamentous connection such as an interosseous ligament (e.g., between the radius and ulna) is termed a ________.","a":"syndesmosis"},{"id":"m3-c9-lab5","ch":9,"section":"Lab","q":"An example of a ________ is the articulation of the ribs with the sternum.","a":"synchondrosis"},{"id":"m3-c9-lab6","ch":9,"section":"Lab","q":"A freely movable joint is a(n) ________.","a":"diarthrosis"},{"id":"m3-c9-lab7","ch":9,"section":"Lab","q":"The intervertebral disc joint is called a ________. A joint where bones fuse together with bone tissue is called a ________.","a":"symphysis; synostosis"},{"id":"m3-c9-lab8","ch":9,"section":"Lab","q":"Mike falls off his skateboard and sprains his ankle. What occurs with this type of accident?","a":"A sprain — the ligaments supporting the joint are overstretched and/or partially or completely torn, while the articulating bones remain in place."},{"id":"m3-c9-lab9","ch":9,"section":"Lab","q":"The knuckle (metacarpophalangeal) joint is classified as a ________ joint.","a":"condylar (condyloid / ellipsoid)"},{"id":"m3-c9-lab10","ch":9,"section":"Lab","q":"Ankle extension is also called plantar ________. A twisting motion of the foot that turns the sole outward is known as ________.","a":"flexion (plantar flexion); eversion"},{"id":"m3-c9-lab11","ch":9,"section":"Lab","q":"The joint between the carpals is a/an ________ joint. The ankle joint is a(n) ________ joint. The joints connecting the four fingers with the metacarpals are ________ joints.","a":"gliding (plane); hinge; condylar (condyloid)"},{"id":"m3-c9-lab12","ch":9,"section":"Lab","q":"A movement away from the midline of the body is termed ________. Bringing the tip of the thumb to touch the fingertips of the same hand is called ________.","a":"abduction; opposition"},{"id":"m3-c9-lab13","ch":9,"section":"Lab","q":"The elbow joint is an example of a(n) ________ joint.","a":"hinge"},{"id":"m3-c9-lab14","ch":9,"section":"Lab","q":"In a ________ articulation, movement can occur in all three axes.","a":"triaxial (multiaxial)"},{"id":"m3-c9-lab15","ch":9,"section":"Lab","q":"An extension past the anatomical position is known as ________.","a":"hyperextension"},{"id":"m3-c9-lab16","ch":9,"section":"Lab","q":"Which foot movement enables a ballet dancer to stand on her toes?","a":"plantar flexion"},{"id":"m3-c9-lab17","ch":9,"section":"Lab","q":"Label this synovial joint: name the main structural features shared by all synovial joints.","a":"Articular cartilage, articular (joint) capsule, synovial membrane, a joint cavity filled with synovial fluid, and supporting ligaments (some also have menisci/articular discs, bursae, and fat pads)."}]},{"key":"m4","name":"Module 4","sub":"Ch 10–11 · Muscle Tissue · Muscular System","cards":[{"id":"m4-c10-q4","ch":10,"section":"RQ","q":"Muscle that has a striped appearance is described as being ________.","a":"D. striated","opts":["A. elastic","B. nonstriated","C. excitable","D. striated"]},{"id":"m4-c10-q5","ch":10,"section":"RQ","q":"Which element is important in directly triggering contraction?","a":"B. calcium (Ca++)","opts":["A. sodium (Na+)","B. calcium (Ca++)","C. potassium (K+)","D. chloride (Cl-)"]},{"id":"m4-c10-q6","ch":10,"section":"RQ","q":"Which of the following properties is not common to all three muscle tissues?","a":"C. at rest, uses shielding proteins to cover actin-binding sites","opts":["A. excitability","B. the need for ATP","C. at rest, uses shielding proteins to cover actin-binding sites","D. elasticity"]},{"id":"m4-c10-q7","ch":10,"section":"RQ","q":"The correct order for the smallest to the largest unit of organization in muscle tissue is ________.","a":"B. filament, myofibril, muscle fiber, fascicle","opts":["A. fascicle, filament, muscle fiber, myofibril","B. filament, myofibril, muscle fiber, fascicle","C. muscle fiber, fascicle, filament, myofibril","D. myofibril, muscle fiber, filament, fascicle"]},{"id":"m4-c10-q8","ch":10,"section":"RQ","q":"Depolarization of the sarcolemma means ________.","a":"A. the inside of the membrane has become less negative as sodium ions accumulate","opts":["A. the inside of the membrane has become less negative as sodium ions accumulate","B. the outside of the membrane has become less negative as sodium ions accumulate","C. the inside of the membrane has become more negative as sodium ions accumulate","D. the sarcolemma has completely lost any electrical charge"]},{"id":"m4-c10-q9","ch":10,"section":"RQ","q":"In relaxed muscle, the myosin-binding site on actin is blocked by ________.","a":"D. tropomyosin","opts":["A. titin","B. troponin","C. myoglobin","D. tropomyosin"]},{"id":"m4-c10-q10","ch":10,"section":"RQ","q":"According to the sliding filament model, binding sites on actin open when ________.","a":"D. calcium ion levels rise","opts":["A. creatine phosphate levels rise","B. ATP levels rise","C. acetylcholine levels rise","D. calcium ion levels rise"]},{"id":"m4-c10-q11","ch":10,"section":"RQ","q":"The cell membrane of a muscle fiber is called ________.","a":"B. sarcolemma","opts":["A. myofibril","B. sarcolemma","C. sarcoplasm","D. myofilament"]},{"id":"m4-c10-q12","ch":10,"section":"RQ","q":"Muscle relaxation occurs when ________.","a":"C. calcium ions are actively transported into the sarcoplasmic reticulum","opts":["A. calcium ions are actively transported out of the sarcoplasmic reticulum","B. calcium ions diffuse out of the sarcoplasmic reticulum","C. calcium ions are actively transported into the sarcoplasmic reticulum","D. calcium ions diffuse into the sarcoplasmic reticulum"]},{"id":"m4-c10-q13","ch":10,"section":"RQ","q":"During muscle contraction, the cross-bridge detaches when ________.","a":"B. the myosin head binds to an ATP molecule","opts":["A. the myosin head binds to an ADP molecule","B. the myosin head binds to an ATP molecule","C. calcium ions bind to troponin","D. calcium ions bind to actin"]},{"id":"m4-c10-q14","ch":10,"section":"RQ","q":"Thin and thick filaments are organized into functional units called ________.","a":"D. sarcomeres","opts":["A. myofibrils","B. myofilaments","C. T-tubules","D. sarcomeres"]},{"id":"m4-c10-q15","ch":10,"section":"RQ","q":"During which phase of a twitch in a muscle fiber is tension the greatest?","a":"C. contraction phase","opts":["A. resting phase","B. repolarization phase","C. contraction phase","D. relaxation phase"]},{"id":"m4-c10-q16","ch":10,"section":"RQ","q":"Muscle fatigue is caused by ________.","a":"B. exhaustion of energy reserves and buildup of lactic acid levels","opts":["A. buildup of ATP and lactic acid levels","B. exhaustion of energy reserves and buildup of lactic acid levels","C. buildup of ATP and pyruvic acid levels","D. exhaustion of energy reserves and buildup of pyruvic acid levels"]},{"id":"m4-c10-q17","ch":10,"section":"RQ","q":"A sprinter would experience muscle fatigue sooner than a marathon runner due to ________.","a":"A. anaerobic metabolism in the muscles of the sprinter","opts":["A. anaerobic metabolism in the muscles of the sprinter","B. anaerobic metabolism in the muscles of the marathon runner","C. aerobic metabolism in the muscles of the sprinter","D. glycolysis in the muscles of the marathon runner"]},{"id":"m4-c10-q18","ch":10,"section":"RQ","q":"What aspect of creatine phosphate allows it to supply energy to muscles?","a":"B. phosphate bonds","opts":["A. ATPase activity","B. phosphate bonds","C. carbon bonds","D. hydrogen bonds"]},{"id":"m4-c10-q19","ch":10,"section":"RQ","q":"Drug X blocks ATP regeneration from ADP and phosphate. How will muscle cells respond to this drug?","a":"D. none of the above","opts":["A. by absorbing ATP from the bloodstream","B. by using ADP as an energy source","C. by using glycogen as an energy source","D. none of the above"]},{"id":"m4-c10-q20","ch":10,"section":"RQ","q":"The muscles of a professional sprinter are most likely to have ________.","a":"A. 80 percent fast-twitch muscle fibers and 20 percent slow-twitch muscle fibers","opts":["A. 80 percent fast-twitch muscle fibers and 20 percent slow-twitch muscle fibers","B. 20 percent fast-twitch muscle fibers and 80 percent slow-twitch muscle fibers","C. 50 percent fast-twitch muscle fibers and 50 percent slow-twitch muscle fibers","D. 40 percent fast-twitch muscle fibers and 60 percent slow-twitch muscle fibers"]},{"id":"m4-c10-q21","ch":10,"section":"RQ","q":"The muscles of a professional marathon runner are most likely to have ________.","a":"B. 20 percent fast-twitch muscle fibers and 80 percent slow-twitch muscle fibers","opts":["A. 80 percent fast-twitch muscle fibers and 20 percent slow-twitch muscle fibers","B. 20 percent fast-twitch muscle fibers and 80 percent slow-twitch muscle fibers","C. 50 percent fast-twitch muscle fibers and 50 percent slow-twitch muscle fibers","D. 40 percent fast-twitch muscle fibers and 60 percent slow-twitch muscle fibers"]},{"id":"m4-c10-q22","ch":10,"section":"RQ","q":"Which of the following statements is true?","a":"C. Fast fibers have large glycogen reserves","opts":["A. Fast fibers have a small diameter","B. Fast fibers contain loosely packed myofibrils","C. Fast fibers have large glycogen reserves","D. Fast fibers have many mitochondria"]},{"id":"m4-c10-q23","ch":10,"section":"RQ","q":"Which of the following statements is false?","a":"A. Slow fibers have a small network of capillaries","opts":["A. Slow fibers have a small network of capillaries","B. Slow fibers contain the pigment myoglobin","C. Slow fibers contain a large number of mitochondria","D. Slow fibers contract for extended periods"]},{"id":"m4-c10-q24","ch":10,"section":"RQ","q":"Cardiac muscles differ from skeletal muscles in that they ________.","a":"D. contain intercalated discs","opts":["A. are striated","B. utilize aerobic metabolism","C. contain myofibrils","D. contain intercalated discs"]},{"id":"m4-c10-q25","ch":10,"section":"RQ","q":"If cardiac muscle cells were prevented from undergoing aerobic metabolism, they ultimately would ________.","a":"C. stop contracting","opts":["A. undergo glycolysis","B. synthesize ATP","C. stop contracting","D. start contracting"]},{"id":"m4-c10-q26","ch":10,"section":"RQ","q":"Smooth muscles differ from skeletal and cardiac muscles in that they ________.","a":"A. lack myofibrils","opts":["A. lack myofibrils","B. are under voluntary control","C. lack myosin","D. lack actin"]},{"id":"m4-c10-q27","ch":10,"section":"RQ","q":"Which of the following statements describes smooth muscle cells?","a":"A. They are resistant to fatigue","opts":["A. They are resistant to fatigue","B. They have a rapid onset of contractions","C. They cannot exhibit tetanus","D. They primarily use anaerobic metabolism"]},{"id":"m4-c10-q28","ch":10,"section":"RQ","q":"From which embryonic cell type does muscle tissue develop?","a":"C. myoblast cells","opts":["A. ganglion cells","B. myotube cells","C. myoblast cells","D. satellite cells"]},{"id":"m4-c10-q29","ch":10,"section":"RQ","q":"Which cell type helps to repair injured muscle fibers?","a":"D. satellite cells","opts":["A. ganglion cells","B. myotube cells","C. myoblast cells","D. satellite cells"]},{"id":"m4-c10-q30","ch":10,"section":"CT","q":"Why is elasticity an important quality of muscle tissue?","a":"It allows muscle to return to its original length during relaxation after contraction."},{"id":"m4-c10-q31","ch":10,"section":"CT","q":"What would happen to skeletal muscle if the epimysium were destroyed?","a":"Muscles would lose their integrity during powerful movements, resulting in muscle damage."},{"id":"m4-c10-q32","ch":10,"section":"CT","q":"Describe how tendons facilitate body movement.","a":"When a muscle contracts, the force of movement is transmitted through the tendon, which pulls on the bone to produce skeletal movement."},{"id":"m4-c10-q33","ch":10,"section":"CT","q":"What are the five primary functions of skeletal muscle?","a":"Produce movement of the skeleton, maintain posture and body position, support soft tissues, encircle openings of the digestive, urinary, and other tracts, and maintain body temperature."},{"id":"m4-c10-q34","ch":10,"section":"CT","q":"What are the opposite roles of voltage-gated sodium channels and voltage-gated potassium channels?","a":"The opening of voltage-gated sodium channels, followed by the influx of Na+ , transmits an Action Potential after the membrane has sufficiently depolarized. The delayed opening of potassium channels allows K+ to exit the cell, to repolarize the membrane."},{"id":"m4-c10-q35","ch":10,"section":"CT","q":"How would muscle contractions be affected if skeletal muscle fibers did not have T-tubules?","a":"Without T-tubules, action potential conduction into the interior of the cell would happen much more slowly, causing delays between neural stimulation and muscle contraction, resulting in slower, weaker contractions."},{"id":"m4-c10-q36","ch":10,"section":"CT","q":"What causes the striated appearance of skeletal muscle tissue?","a":"Dark A bands and light I bands repeat along myofibrils, and the alignment of myofibrils in the cell cause the entire cell to appear striated."},{"id":"m4-c10-q37","ch":10,"section":"CT","q":"How would muscle contractions be affected if ATP was completely depleted in a muscle fiber?","a":"Without ATP, the myosin heads cannot detach from the actin-binding sites. All of the “stuck” cross-bridges result in muscle stiffness. In a live person, this can cause a condition like “writer’s cramps.” In a recently dead person, it results in rigor mortis."},{"id":"m4-c10-q38","ch":10,"section":"CT","q":"Why does a motor unit of the eye have few muscle fibers compared to a motor unit of the leg?","a":"Eyes require fine movements and a high degree of control, which is permitted by having fewer muscle fibers associated with a neuron."},{"id":"m4-c10-q39","ch":10,"section":"CT","q":"What factors contribute to the amount of tension produced in an individual muscle fiber?","a":"The length, size and types of muscle fiber and the frequency of neural stimulation contribute to the amount of tension produced in an individual muscle fiber."},{"id":"m4-c10-q40","ch":10,"section":"CT","q":"Why do muscle cells use creatine phosphate instead of glycolysis to supply ATP for the first few seconds of muscle contraction?","a":"Creatine phosphate is used because creatine phosphate and ADP are converted very quickly into ATP by creatine kinase. Glycolysis cannot generate ATP as quickly as creatine phosphate."},{"id":"m4-c10-q41","ch":10,"section":"CT","q":"Is aerobic respiration more or less efficient than glycolysis? Explain your answer.","a":"Aerobic respiration is much more efficient than anaerobic glycolysis, yielding 36 ATP per molecule of glucose, as opposed to two ATP produced by glycolysis."},{"id":"m4-c10-q42","ch":10,"section":"CT","q":"What changes occur at the cellular level in response to endurance training?","a":"Endurance training modifies slow fibers to make them more efficient by producing more mitochondria to enable more aerobic metabolism and more ATP production. Endurance exercise can also increase the amount of myoglobin in a cell and formation of more extensive capillary networks around the fiber."},{"id":"m4-c10-q43","ch":10,"section":"CT","q":"What changes occur at the cellular level in response to resistance training?","a":"Resistance exercises affect muscles by causing the formation of more actin and myosin, increasing the structure of muscle fibers."},{"id":"m4-c10-q44","ch":10,"section":"CT","q":"What would be the drawback of cardiac contractions being the same duration as skeletal muscle contractions?","a":"An action potential could reach a cardiac muscle cell before it has entered the relaxation phase, resulting in the sustained contractions of tetanus. If this happened, the heart would not beat regularly."},{"id":"m4-c10-q45","ch":10,"section":"CT","q":"How are cardiac muscle cells similar to and different from skeletal muscle cells?","a":"Cardiac and skeletal muscle cells both contain ordered myofibrils and are striated. Cardiac muscle cells are branched and contain intercalated discs, which skeletal muscles do not have."},{"id":"m4-c10-q46","ch":10,"section":"CT","q":"Why can smooth muscles contract over a wider range of resting lengths than skeletal and cardiac muscle?","a":"Smooth muscles can contract over a wider range of resting lengths because the actin and myosin filaments in smooth muscle are not as rigidly organized as those in skeletal and cardiac muscle."},{"id":"m4-c10-q47","ch":10,"section":"CT","q":"Describe the differences between single-unit smooth muscle and multiunit smooth muscle.","a":"Single-unit smooth muscle is found in the walls of hollow organs; multiunit smooth muscle is found in airways to the lungs and large arteries. Single-unit smooth muscle cells contract synchronously, they are coupled by gap junctions, and they exhibit spontaneous action potential. Multiunit smooth cells lack gap junctions, and their contractions are not synchronous."},{"id":"m4-c10-q48","ch":10,"section":"CT","q":"Why is muscle that has sustained significant damage unable to produce the same amount of power as it could before being damaged?","a":"If the damage exceeds what can be repaired by satellite cells, the damaged tissue is replaced by scar tissue, which cannot contract."},{"id":"m4-c10-q49","ch":10,"section":"CT","q":"Which muscle type(s) (skeletal, smooth, or cardiac) can regenerate new muscle cells/fibers? Explain your answer.","a":"Smooth muscle tissue can regenerate from stem cells called pericytes, cells found in some small blood vessels. These allow smooth muscle cells to regenerate and repair much more readily than skeletal and cardiac muscle tissue."},{"id":"m4-c11-q1","ch":11,"section":"RQ","q":"Which of the following is unique to the muscles of facial expression?","a":"D. They insert into the skin.","opts":["A. They all originate from the scalp musculature.","B. They insert onto the cartilage found around the face.","C. They only insert onto the facial bones.","D. They insert into the skin."]},{"id":"m4-c11-q2","ch":11,"section":"RQ","q":"Which of the following helps an agonist work?","a":"A. a synergist","opts":["A. a synergist","B. a fixator","C. an insertion","D. an antagonist"]},{"id":"m4-c11-q3","ch":11,"section":"RQ","q":"Which of the following statements is correct about what happens during flexion?","a":"B. The angle between bones is decreased.","opts":["A. The angle between bones is increased.","B. The angle between bones is decreased.","C. The bone moves away from the body.","D. The bone moves toward the center of the body."]},{"id":"m4-c11-q4","ch":11,"section":"RQ","q":"Which is moved the least during muscle contraction?","a":"A. the origin","opts":["A. the origin","B. the insertion","C. the ligaments","D. the joints"]},{"id":"m4-c11-q5","ch":11,"section":"RQ","q":"Which muscle has a convergent pattern of fascicles?","a":"C. pectoralis major","opts":["A. biceps brachii","B. gluteus maximus","C. pectoralis major","D. rectus femoris"]},{"id":"m4-c11-q6","ch":11,"section":"RQ","q":"A muscle that has a pattern of fascicles running along the long axis of the muscle has which of the following fascicle arrangements?","a":"C. parallel","opts":["A. circular","B. pennate","C. parallel","D. rectus"]},{"id":"m4-c11-q7","ch":11,"section":"RQ","q":"Which arrangement best describes a bipennate muscle?","a":"A. The muscle fibers feed in on an angle to a long tendon from both sides.","opts":["A. The muscle fibers feed in on an angle to a long tendon from both sides.","B. The muscle fibers feed in on an angle to a long tendon from all directions.","C. The muscle fibers feed in on an angle to a long tendon from one side.","D. The muscle fibers on one side of a tendon feed into it at a certain angle and muscle fibers on the other side of the tendon feed into it at the opposite angle."]},{"id":"m4-c11-q8","ch":11,"section":"RQ","q":"The location of a muscle’s insertion and origin can determine ________.","a":"A. action","opts":["A. action","B. the force of contraction","C. muscle name","D. the load a muscle can carry"]},{"id":"m4-c11-q9","ch":11,"section":"RQ","q":"Where is the temporalis muscle located?","a":"C. on the side of the head","opts":["A. on the forehead","B. in the neck","C. on the side of the head","D. on the chin"]},{"id":"m4-c11-q10","ch":11,"section":"RQ","q":"Which muscle name does not make sense?","a":"D. extensor minimus longus","opts":["A. extensor digitorum","B. gluteus minimus","C. biceps femoris","D. extensor minimus longus"]},{"id":"m4-c11-q11","ch":11,"section":"RQ","q":"Which of the following terms would be used in the name of a muscle that moves the leg away from the body?","a":"D. abductor","opts":["A. flexor","B. adductor","C. extensor","D. abductor"]},{"id":"m4-c11-q12","ch":11,"section":"RQ","q":"Which of the following is a prime mover in head flexion?","a":"C. sternocleidomastoid","opts":["A. occipitofrontalis","B. corrugator supercilii","C. sternocleidomastoid","D. masseter"]},{"id":"m4-c11-q13","ch":11,"section":"RQ","q":"Where is the inferior oblique muscle located?","a":"B. in the eye socket","opts":["A. in the abdomen","B. in the eye socket","C. in the anterior neck","D. in the face"]},{"id":"m4-c11-q14","ch":11,"section":"RQ","q":"What is the action of the masseter?","a":"B. chewing","opts":["A. swallowing","B. chewing","C. moving the lips","D. closing the eye"]},{"id":"m4-c11-q15","ch":11,"section":"RQ","q":"The names of the extrinsic tongue muscles commonly end in ________.","a":"B. -glossus","opts":["A. -glottis","B. -glossus","C. -gluteus","D. -hyoid"]},{"id":"m4-c11-q16","ch":11,"section":"RQ","q":"What is the function of the erector spinae?","a":"C. postural support","opts":["A. movement of the arms","B. stabilization of the pelvic girdle","C. postural support","D. rotating of the vertebral column"]},{"id":"m4-c11-q17","ch":11,"section":"RQ","q":"Which of the following abdominal muscles is not a part of the anterior abdominal wall?","a":"A. quadratus lumborum","opts":["A. quadratus lumborum","B. rectus abdominis","C. interior oblique","D. exterior oblique"]},{"id":"m4-c11-q18","ch":11,"section":"RQ","q":"Which muscle pair plays a role in respiration?","a":"D. diaphragm, scalene","opts":["A. intertransversarii, interspinales","B. semispinalis cervicis, semispinalis thoracis","C. trapezius, rhomboids","D. diaphragm, scalene"]},{"id":"m4-c11-q19","ch":11,"section":"RQ","q":"What is the linea alba?","a":"B. a long tendon that runs down the middle of the rectus abdominis","opts":["A. a small muscle that helps with compression of the abdominal organs","B. a long tendon that runs down the middle of the rectus abdominis","C. a long band of collagen fibers that connects the hip to the knee","D. another name for the tendinous inscription"]},{"id":"m4-c11-q20","ch":11,"section":"RQ","q":"The rhomboid major and minor muscles are deep to the ________.","a":"C. trapezius","opts":["A. rectus abdominis","B. scalene muscles","C. trapezius","D. ligamentum nuchae"]},{"id":"m4-c11-q21","ch":11,"section":"RQ","q":"Which muscle extends the forearm?","a":"B. triceps brachii","opts":["A. biceps brachii","B. triceps brachii","C. brachialis","D. deltoid"]},{"id":"m4-c11-q22","ch":11,"section":"RQ","q":"What is the origin of the wrist flexors?","a":"B. the medial epicondyle of the humerus","opts":["A. the lateral epicondyle of the humerus","B. the medial epicondyle of the humerus","C. the carpal bones of the wrist","D. the deltoid tuberosity of the humerus"]},{"id":"m4-c11-q23","ch":11,"section":"RQ","q":"Which muscles stabilize the pectoral girdle?","a":"A. axial and scapular","opts":["A. axial and scapular","B. axial","C. appendicular","D. axial and appendicular"]},{"id":"m4-c11-q24","ch":11,"section":"RQ","q":"The large muscle group that attaches the leg to the pelvic girdle and produces extension of the hip joint is the ________ group.","a":"A. gluteal","opts":["A. gluteal","B. obturator","C. adductor","D. abductor"]},{"id":"m4-c11-q25","ch":11,"section":"RQ","q":"Which muscle produces movement that allows you to cross your legs?","a":"D. the sartorius","opts":["A. the gluteus maximus","B. the piriformis","C. the gracilis","D. the sartorius"]},{"id":"m4-c11-q26","ch":11,"section":"RQ","q":"What is the largest muscle in the lower leg?","a":"B. gastrocnemius","opts":["A. soleus","B. gastrocnemius","C. tibialis anterior","D. tibialis posterior"]},{"id":"m4-c11-q27","ch":11,"section":"RQ","q":"The vastus intermedius muscle is deep to which of the following muscles?","a":"B. rectus femoris","opts":["A. biceps femoris","B. rectus femoris","C. vastus medialis","D. vastus lateralis"]},{"id":"m4-c11-q28","ch":11,"section":"CT","q":"What effect does fascicle arrangement have on a muscle’s action?","a":"Fascicle arrangements determine what type of movement a muscle can make. For instance, circular muscles act as sphincters, closing orifices."},{"id":"m4-c11-q29","ch":11,"section":"CT","q":"Movements of the body occur at joints. Describe how muscles are arranged around the joints of the body.","a":"Muscles work in pairs to facilitate movement of the bones around the joints. Agonists are the prime movers while antagonists oppose or resist the movements of the agonists. Synergists assist the agonists, and fixators stabilize a muscle’s origin."},{"id":"m4-c11-q30","ch":11,"section":"CT","q":"Explain how a synergist assists an agonist by being a fixator.","a":"Agonists are the prime movers while antagonists oppose or resist the movements of the agonists. Synergists assist the agonists, and fixators stabilize a muscle’s origin."},{"id":"m4-c11-q31","ch":11,"section":"CT","q":"Describe the different criteria that contribute to how skeletal muscles are named.","a":"In anatomy and physiology, many word roots are Latin or Greek. Portions, or roots, of the word give us clues about the function, shape, action, or location of a muscle."},{"id":"m4-c11-q32","ch":11,"section":"CT","q":"Explain the difference between axial and appendicular muscles.","a":"Axial muscles originate on the axial skeleton (the bones in the head, neck, and core of the body), whereas appendicular muscles originate on the bones that make up the body’s limbs."},{"id":"m4-c11-q33","ch":11,"section":"CT","q":"Describe the muscles of the anterior neck.","a":"The muscles of the anterior neck are arranged to facilitate swallowing and speech. They work on the hyoid bone, with the suprahyoid muscles pulling up and the infrahyoid muscles pulling down."},{"id":"m4-c11-q34","ch":11,"section":"CT","q":"Why are the muscles of the face different from typical skeletal muscle?","a":"Most skeletal muscles create movement by actions on the skeleton. Facial muscles are different in that they create facial movements and expressions by pulling on the skin—no bone movements are involved."},{"id":"m4-c11-q35","ch":11,"section":"CT","q":"Describe the fascicle arrangement in the muscles of the abdominal wall. How do they relate to each other?","a":"Arranged into layers, the muscles of the abdominal wall are the internal and external obliques, which run on diagonals, the rectus abdominis, which runs straight down the midline of the body, and the transversus abdominis, which wraps across the trunk of the body."},{"id":"m4-c11-q36","ch":11,"section":"CT","q":"What are some similarities and differences between the diaphragm and the pelvic diaphragm?","a":"Both diaphragms are thin sheets of skeletal muscle that horizontally span areas of the trunk. The diaphragm separating the thoracic and abdominal cavities is the primary muscle of breathing. The pelvic diaphragm, consisting of two paired muscles, the coccygeus and the levator ani, forms the pelvic floor at the inferior end of the trunk."},{"id":"m4-c11-q37","ch":11,"section":"CT","q":"The tendons of which muscles form the rotator cuff? Why is the rotator cuff important?","a":"Tendons of the infraspinatus, supraspinatus, teres minor, and the subscapularis form the rotator cuff, which forms a foundation on which the arms and shoulders can be stabilized and move."},{"id":"m4-c11-q38","ch":11,"section":"CT","q":"List the general muscle groups of the shoulders and upper limbs as well as their subgroups.","a":"The muscles that make up the shoulders and upper limbs include the muscles that position the pelvic girdle, the muscles that move the humerus, the muscles that move the forearm, and the muscles that move the wrists, hands, and fingers."},{"id":"m4-c11-q39","ch":11,"section":"CT","q":"Which muscles form the hamstrings? How do they function together?","a":"The biceps femoris, semimembranosus, and semitendinosus form the hamstrings. The hamstrings flex the leg at the knee joint."},{"id":"m4-c11-q40","ch":11,"section":"CT","q":"Which muscles form the quadriceps? How do they function together?","a":"The rectus femoris, vastus medialis, vastus lateralis, and vastus intermedius form the quadriceps. The quadriceps muscles extend the leg at the knee joint."},{"id":"m4-c10-mc1","ch":10,"section":"MC","q":"A fascicle is","a":"A. a group of muscle fibers that are encased in the perimysium.","opts":["A. a group of muscle fibers that are encased in the perimysium.","B. the belly of a muscle.","C. a group of muscle fibers that are all part of the same motor unit.","D. a group of muscle fibers and motor neurons.","E. a collection of myofibrils in a muscle fiber."]},{"id":"m4-c10-mc2","ch":10,"section":"MC","q":"A resting muscle generates most of its ATP by","a":"C. aerobic metabolism of fatty acids.","opts":["A. hydrolysis of creatine phosphate.","B. anaerobic respiration.","C. aerobic metabolism of fatty acids.","D. glycogenolysis.","E. the tricarboxylic acid cycle."]},{"id":"m4-c10-mc3","ch":10,"section":"MC","q":"Active sites on the actin become available for binding after","a":"C. calcium binds to troponin.","opts":["A. actin binds to troponin.","B. troponin binds to tropomyosin.","C. calcium binds to troponin.","D. calcium binds to tropomyosin.","E. myosin binds to troponin."]},{"id":"m4-c10-mc4","ch":10,"section":"MC","q":"Aerobic metabolism normally provides ________ percent of the ATP demands of a resting muscle cell.","a":"D. 95","opts":["A. 25","B. 50","C. 70","D. 95","E. 100"]},{"id":"m4-c10-mc5","ch":10,"section":"MC","q":"At each end of the muscle, the collagen fibers of the epimysium, and each perimysium and endomysium, come together to form a","a":"A. tendon.","opts":["A. tendon.","B. satellite cell.","C. ligament.","D. tenosynovium.","E. sheath."]},{"id":"m4-c10-mc6","ch":10,"section":"MC","q":"Cross-bridges are portions of","a":"B. myosin molecules.","opts":["A. actin molecules.","B. myosin molecules.","C. troponin molecules.","D. tropomyosin molecules.","E. calcium ions."]},{"id":"m4-c10-mc7","ch":10,"section":"MC","q":"During anaerobic glycolysis","a":"E. All of the answers are correct.","opts":["A. ATP is produced.","B. pyruvic acid is produced.","C. oxygen is not consumed.","D. carbohydrate is metabolized.","E. All of the answers are correct."]},{"id":"m4-c10-mc8","ch":10,"section":"MC","q":"Each skeletal muscle fiber contains ________ myofibrils.","a":"E. hundreds to thousands","opts":["A. 50 to 100","B. 100 to 150","C. 150 to 200","D. 200 to 500","E. hundreds to thousands"]},{"id":"m4-c10-mc9","ch":10,"section":"MC","q":"Each thin filament consists of","a":"A. two actin protein strands coiled helically around each other.","opts":["A. two actin protein strands coiled helically around each other.","B. chains of myosin molecules.","C. six molecules coiled into a helical structure.","D. a rod-shaped structure with \"heads\" projecting from each end.","E. a double strand of myosin molecules."]},{"id":"m4-c10-mc10","ch":10,"section":"MC","q":"Fast fibers","a":"E. have low resistance to fatigue and have quick twitches.","opts":["A. have low resistance to fatigue.","B. rely on aerobic metabolism.","C. have many mitochondria.","D. have twitches with a very brief contraction phase.","E. have low resistance to fatigue and have quick twitches."]},{"id":"m4-c10-mc11","ch":10,"section":"MC","q":"Each skeletal muscle fiber is controlled by a motor neuron at a single","a":"C. neuromuscular junction.","opts":["A. synaptic knob.","B. sarcomere.","C. neuromuscular junction.","D. synaptic cleft.","E. transverse tubule."]},{"id":"m4-c10-mc12","ch":10,"section":"MC","q":"In a sarcomere, thick filaments are linked laterally by proteins of the","a":"B. M line.","opts":["A. Z line.","B. M line.","C. H band.","D. A band.","E. I band."]},{"id":"m4-c10-mc13","ch":10,"section":"MC","q":"In an isotonic contraction,","a":"A. muscle tension exceeds the load and the muscle lifts the load.","opts":["A. muscle tension exceeds the load and the muscle lifts the load.","B. tension rises and falls but the muscle length is constant.","C. the peak tension is less than the load.","D. many twitches always fuse into one.","E. postural muscles stabilize the vertebrae."]},{"id":"m4-c10-mc14","ch":10,"section":"MC","q":"Muscle tissue, one of the four basic tissue groups, consists chiefly of cells that are highly specialized for","a":"B. contraction.","opts":["A. conduction.","B. contraction.","C. peristalsis.","D. cushioning.","E. secretion."]},{"id":"m4-c10-mc15","ch":10,"section":"MC","q":"Receptors for acetylcholine are located on the","a":"B. motor end plate.","opts":["A. synaptic knob.","B. motor end plate.","C. sarcomere.","D. synaptic cleft.","E. transverse tubule."]},{"id":"m4-c10-mc16","ch":10,"section":"MC","q":"Since each myofibril is attached at either end of the muscle fiber, when sarcomeres shorten, the muscle fiber","a":"B. shortens.","opts":["A. lengthens.","B. shortens.","C. strengthens.","D. weakens.","E. pulls from the middle."]},{"id":"m4-c10-mc17","ch":10,"section":"MC","q":"The action potential is conducted into a skeletal muscle fiber by","a":"C. transverse tubules.","opts":["A. motor end plates.","B. neuromuscular junctions.","C. transverse tubules.","D. triads.","E. sarcoplasmic reticulum."]},{"id":"m4-c10-mc18","ch":10,"section":"MC","q":"The advantage of having many nuclei in a skeletal muscle fiber is","a":"D. the ability to produce large amounts of the muscle proteins needed for growth and repair.","opts":["A. the ability to contract.","B. the ability to produce more ATP with little oxygen.","C. the ability to store extra DNA for metabolism.","D. the ability to produce large amounts of the muscle proteins needed for growth and repair.","E. the ability to produce nutrients for muscle contraction."]},{"id":"m4-c10-mc19","ch":10,"section":"MC","q":"The contraction of a muscle exerts a pull on a bone because","a":"C. muscles are attached to bones by tendons.","opts":["A. muscles are attached to bones by ligaments.","B. muscles are attached to bones by bursae.","C. muscles are attached to bones by tendons.","D. muscle fibers directly attach to the periosteum of bone.","E. muscles elongate upon contraction."]},{"id":"m4-c10-mc20","ch":10,"section":"MC","q":"The bundle of collagen fibers at the end of a skeletal muscle that attaches the muscle to bone is called a(n)","a":"B. tendon.","opts":["A. fascicle.","B. tendon.","C. ligament.","D. epimysium.","E. myofibril."]},{"id":"m4-c10-mc21","ch":10,"section":"MC","q":"The dense layer of connective tissue that surrounds an entire skeletal muscle is the","a":"B. epimysium.","opts":["A. tendon.","B. epimysium.","C. endomysium.","D. perimysium.","E. fascicle."]},{"id":"m4-c10-mc22","ch":10,"section":"MC","q":"The delicate connective tissue that surrounds the skeletal muscle fibers and ties adjacent muscle fibers together is the","a":"A. endomysium.","opts":["A. endomysium.","B. perimysium.","C. epimysium.","D. superficial fascia.","E. periosteum."]},{"id":"m4-c10-mc23","ch":10,"section":"MC","q":"The plasma membrane of a skeletal muscle fiber is called the","a":"A. sarcolemma.","opts":["A. sarcolemma.","B. sarcomere.","C. sarcosome.","D. sarcoplasmic reticulum.","E. sarcoplasm."]},{"id":"m4-c10-mc24","ch":10,"section":"MC","q":"The region of the sarcomere containing the thick filaments is the","a":"D. A band.","opts":["A. Z line.","B. M line.","C. H band.","D. A band.","E. I band."]},{"id":"m4-c10-mc25","ch":10,"section":"MC","q":"The region of the sarcomere that always contains thin filaments is the","a":"E. I band.","opts":["A. Z line.","B. M line.","C. H band.","D. A band.","E. I band."]},{"id":"m4-c10-mc26","ch":10,"section":"MC","q":"The repeating unit of a skeletal muscle fiber is the","a":"B. sarcomere.","opts":["A. sarcolemma.","B. sarcomere.","C. sarcoplasmic reticulum.","D. myofibril.","E. myofilament."]},{"id":"m4-c10-mc27","ch":10,"section":"MC","q":"The skeletal muscle complex known as the triad consists of","a":"B. a transverse tubule and two terminal cisternae.","opts":["A. actin, myosin, and filaments.","B. a transverse tubule and two terminal cisternae.","C. filaments, myofibrils, and sarcomeres.","D. A bands, H bands, and I bands.","E. actin, myosin, and sarcomeres."]},{"id":"m4-c10-mc28","ch":10,"section":"MC","q":"The type of contraction in which the muscle fibers do not shorten is called","a":"E. isometric.","opts":["A. tetany.","B. treppe.","C. concentric.","D. isotonic.","E. isometric."]},{"id":"m4-c10-mc29","ch":10,"section":"MC","q":"When calcium ion binds to troponin,","a":"A. tropomyosin moves into the groove between the helical actin strands.","opts":["A. tropomyosin moves into the groove between the helical actin strands.","B. active sites on the myosin are exposed.","C. actin heads will bind to myosin.","D. muscle relaxation occurs.","E. myosin shortens."]},{"id":"m4-c10-mc30","ch":10,"section":"MC","q":"When a skeletal muscle fiber contracts,","a":"E. All of the answers are correct.","opts":["A. the H bands and I bands get smaller.","B. the zones of overlap get larger.","C. the Z lines get closer together.","D. the width of the A band remains constant.","E. All of the answers are correct."]},{"id":"m4-c10-mc31","ch":10,"section":"MC","q":"When contraction occurs,","a":"E. All of the answers are correct.","opts":["A. the H bands get smaller.","B. the Z lines move closer together.","C. the width of the A band remains constant.","D. the I bands get smaller.","E. All of the answers are correct."]},{"id":"m4-c10-mc32","ch":10,"section":"MC","q":"The series of membranous channels that surround each myofibril is the","a":"A. sarcoplasmic reticulum.","opts":["A. sarcoplasmic reticulum.","B. sarcoplasm.","C. sarcomere.","D. sarcolemma.","E. endomysium."]},{"id":"m4-c10-mc33","ch":10,"section":"MC","q":"The thin filaments of striated muscle are made primarily of which protein(s)?","a":"E. All of the answers are correct.","opts":["A. actin","B. tropomyosin","C. troponin","D. nebulin","E. All of the answers are correct."]},{"id":"m4-c11-mc1","ch":11,"section":"MC","q":"A muscle that assists the muscle that is primarily responsible for a given action is a(n)","a":"C. synergist.","opts":["A. agonist.","B. antagonist.","C. synergist.","D. originator.","E. levator."]},{"id":"m4-c11-mc2","ch":11,"section":"MC","q":"A muscle that dorsiflexes the foot is the","a":"A. tibialis anterior.","opts":["A. tibialis anterior.","B. tibialis posterior.","C. peroneus brevis.","D. soleus.","E. gastrocnemius."]},{"id":"m4-c11-mc3","ch":11,"section":"MC","q":"A muscle that flexes the spinal column is the","a":"E. rectus abdominis.","opts":["A. spinalis.","B. longissimus.","C. iliocostalis.","D. sacrospinalis.","E. rectus abdominis."]},{"id":"m4-c11-mc4","ch":11,"section":"MC","q":"A muscle that inserts on the body of the mandible is probably involved in","a":"C. chewing.","opts":["A. kissing.","B. blowing.","C. chewing.","D. frowning.","E. spitting."]},{"id":"m4-c11-mc5","ch":11,"section":"MC","q":"A muscle whose name ends in the suffix -glossus would be found within or attached to the","a":"D. tongue.","opts":["A. chin.","B. cheek.","C. jaw.","D. tongue.","E. lips."]},{"id":"m4-c11-mc6","ch":11,"section":"MC","q":"An antagonist to the gastrocnemius is the","a":"E. tibialis anterior.","opts":["A. peroneus.","B. extensor digitorum longus.","C. soleus.","D. tibialis posterior.","E. tibialis anterior."]},{"id":"m4-c11-mc7","ch":11,"section":"MC","q":"In a ________ muscle, the fascicles are concentrically arranged around an opening.","a":"E. circular","opts":["A. convergent","B. parallel","C. straight","D. pennate","E. circular"]},{"id":"m4-c11-mc8","ch":11,"section":"MC","q":"Medial rotation of the eyeball is performed by the ________ muscle.","a":"C. medial rectus","opts":["A. inferior rectus","B. lateral rectus","C. medial rectus","D. superior rectus","E. inferior oblique"]},{"id":"m4-c11-mc9","ch":11,"section":"MC","q":"Most of the skeletal muscles in the body are","a":"B. parallel muscles.","opts":["A. convergent muscles.","B. parallel muscles.","C. straight muscles.","D. pennate muscles.","E. circular muscles."]},{"id":"m4-c11-mc10","ch":11,"section":"MC","q":"Muscles located close to the midline of the body may be called","a":"D. medialis.","opts":["A. rectus.","B. distalis.","C. proximal.","D. medialis.","E. lateralis."]},{"id":"m4-c11-mc11","ch":11,"section":"MC","q":"Muscles located entirely within an organ are called","a":"D. intrinsic.","opts":["A. internus.","B. extrinsic.","C. profundus.","D. intrinsic.","E. externus."]},{"id":"m4-c11-mc12","ch":11,"section":"MC","q":"Muscles that are long and round in cross section are termed","a":"B. teres.","opts":["A. longus.","B. teres.","C. longissimus.","D. maximus.","E. brevis."]},{"id":"m4-c11-mc13","ch":11,"section":"MC","q":"Muscles that guard entrances and exits of internal passageways are ________ muscles.","a":"E. circular","opts":["A. parallel","B. convergent","C. pennate","D. bipennate","E. circular"]},{"id":"m4-c11-mc14","ch":11,"section":"MC","q":"Muscles with fibers that run at an angle to the long axis of the body are called","a":"D. oblique.","opts":["A. lateralis.","B. transversus.","C. rectus.","D. oblique.","E. medialis."]},{"id":"m4-c11-mc15","ch":11,"section":"MC","q":"Muscles with fibers that run perpendicular to the long axis of the body are called","a":"B. transversus.","opts":["A. lateralis.","B. transversus.","C. rectus.","D. oblique.","E. medialis."]},{"id":"m4-c11-mc16","ch":11,"section":"MC","q":"Muscular walls of the thorax and abdomen are composed of","a":"C. oblique and rectus muscles.","opts":["A. spinal erector muscles.","B. muscles of mastication.","C. oblique and rectus muscles.","D. glossal muscles.","E. pectoralis muscles."]},{"id":"m4-c11-mc17","ch":11,"section":"MC","q":"The ________ allows you to look up.","a":"D. superior rectus","opts":["A. inferior rectus","B. medial rectus","C. lateral rectus","D. superior rectus","E. inferior oblique"]},{"id":"m4-c11-mc18","ch":11,"section":"MC","q":"The \"kissing muscle\" that purses the lips is the","a":"B. orbicularis oris.","opts":["A. zygomaticus.","B. orbicularis oris.","C. buccinator.","D. levator labii.","E. procerus."]},{"id":"m4-c11-mc19","ch":11,"section":"MC","q":"Superficial muscles that position or stabilize an organ are called","a":"B. extrinsic.","opts":["A. internus.","B. extrinsic.","C. profundus.","D. intrinsic.","E. externus."]},{"id":"m4-c11-mc20","ch":11,"section":"MC","q":"The ________ extends the neck.","a":"C. spinalis cervicis","opts":["A. spinalis thoracis","B. splenius capitis","C. spinalis cervicis","D. splenius","E. splenius cervicis"]},{"id":"m4-c11-mc21","ch":11,"section":"MC","q":"The ________ muscle is the strongest jaw muscle.","a":"E. masseter","opts":["A. lateral pterygoid","B. digastric","C. pterygoid","D. medial pterygoid","E. masseter"]},{"id":"m4-c11-mc22","ch":11,"section":"MC","q":"The muscle that extends the arm while doing push-ups is the","a":"D. triceps.","opts":["A. deltoid.","B. pectorals.","C. brachialis.","D. triceps.","E. biceps."]},{"id":"m4-c11-mc23","ch":11,"section":"MC","q":"The muscle that pronates the forearm is the","a":"C. pronator quadratus.","opts":["A. brachialis.","B. triceps brachii medial head.","C. pronator quadratus.","D. anconeus.","E. latissimus dorsi."]},{"id":"m4-c11-mc24","ch":11,"section":"MC","q":"The sternocleidomastoid inserts on the","a":"C. mastoid process.","opts":["A. occipital bone.","B. clavicle.","C. mastoid process.","D. sternum.","E. mandible."]},{"id":"m4-c11-mc25","ch":11,"section":"MC","q":"The vastus lateralis, vastus medialis, and vastus intermedius muscles originate on the ________ of the femur.","a":"D. linea aspera","opts":["A. greater trochanter","B. medial epicondyle","C. lesser trochanter","D. linea aspera","E. capitulum"]},{"id":"m4-c11-mc26","ch":11,"section":"MC","q":"The ________ covers the anterior surface of the neck.","a":"E. platysma","opts":["A. buccinator","B. epicranium","C. occipitofrontalis","D. orbicularis oris","E. platysma"]},{"id":"m4-c11-mc27","ch":11,"section":"MC","q":"The ________ muscle allows you to look down.","a":"A. inferior rectus","opts":["A. inferior rectus","B. medial rectus","C. lateral rectus","D. superior rectus","E. inferior oblique"]},{"id":"m4-c11-mc28","ch":11,"section":"MC","q":"All of the following originate on the scapula, except the","a":"A. pectoralis major.","opts":["A. pectoralis major.","B. teres major.","C. teres minor.","D. subscapularis.","E. supraspinatus."]},{"id":"m4-c11-mc29","ch":11,"section":"MC","q":"Damage to which of the following muscles would interfere most with the ability to breathe?","a":"C. intercostals","opts":["A. pterygoid","B. rectus abdominis","C. intercostals","D. platysma","E. digastric"]},{"id":"m4-c11-mc30","ch":11,"section":"MC","q":"Deep muscles are called","a":"C. profundus.","opts":["A. superficialis.","B. extrinsic.","C. profundus.","D. intrinsic.","E. externus."]},{"id":"m4-c10-lab1","ch":10,"section":"Lab","q":"Muscle tissue, one of the four basic tissue groups, consists chiefly of cells highly specialized for ________.","a":"contraction"},{"id":"m4-c10-lab2","ch":10,"section":"Lab","q":"Write the main functions of skeletal muscle.","a":"Produce movement/locomotion, maintain posture, stabilize joints, and generate heat (also guard entrances/exits)."},{"id":"m4-c10-lab3","ch":10,"section":"Lab","q":"At each end of the muscle, the collagen fibers of the epimysium, perimysium, and endomysium come together to form a ________. The dense layer of connective tissue that surrounds an entire skeletal muscle is the ________.","a":"tendon; epimysium"},{"id":"m4-c10-lab4","ch":10,"section":"Lab","q":"Nerves and blood vessels that service a muscle fiber are in the connective tissues of its ________.","a":"perimysium (and endomysium)"},{"id":"m4-c10-lab5","ch":10,"section":"Lab","q":"A ________ is a group of muscle fibers that are encased in the perimysium.","a":"fascicle"},{"id":"m4-c10-lab6","ch":10,"section":"Lab","q":"The delicate connective tissue that surrounds the skeletal muscle fibers and ties adjacent muscle fibers together is the ________.","a":"endomysium"},{"id":"m4-c10-lab7","ch":10,"section":"Lab","q":"Interactions between actin and myosin filaments of the sarcomere are responsible for muscle ________.","a":"contraction"},{"id":"m4-c10-lab8","ch":10,"section":"Lab","q":"The advantage of having many ________ in a skeletal muscle fiber is the ability to produce substantial amounts of the muscle proteins needed for growth and repair.","a":"nuclei"},{"id":"m4-c10-lab9","ch":10,"section":"Lab","q":"The repeating unit of a skeletal muscle fiber is the ________. The plasma membrane of a skeletal muscle fiber is called the ________.","a":"sarcomere; sarcolemma"},{"id":"m4-c10-lab10","ch":10,"section":"Lab","q":"The region of the sarcomere containing the thick filaments is the ________ band. The skeletal muscle complex known as the ________ consists of a transverse tubule and two terminal cisternae. Cross-bridges are portions of ________ molecules.","a":"A band; triad; myosin"},{"id":"m4-c10-lab11","ch":10,"section":"Lab","q":"Since each myofibril is attached at either end of the muscle fiber, when sarcomeres shorten, the muscle fiber ________.","a":"shortens"},{"id":"m4-c10-lab12","ch":10,"section":"Lab","q":"In response to action potentials arriving along the transverse tubules, the sarcoplasmic reticulum releases ________ ions.","a":"calcium (Ca2+)"},{"id":"m4-c10-lab13","ch":10,"section":"Lab","q":"Each skeletal muscle fiber is controlled by a motor neuron at a single neuromuscular junction. The action potential is conducted into a skeletal muscle fiber by ________ tubules.","a":"transverse (T) tubules"},{"id":"m4-c10-lab14","ch":10,"section":"Lab","q":"The cytoplasm of the neuromuscular terminal contains vesicles filled with molecules of the neurotransmitter ________. (Myasthenia gravis results from loss of these receptors in the end-plate membrane.)","a":"acetylcholine (ACh)"},{"id":"m4-c10-lab15","ch":10,"section":"Lab","q":"Label these diagrams (muscle cell and organ): name the connective-tissue layers and the parts of a sarcomere.","a":"Layers: epimysium (whole muscle) > perimysium (fascicle) > endomysium (fiber). Sarcomere: Z lines (ends), A band (thick/myosin), I band (thin/actin, split by Z line), H band, M line; plus sarcolemma, T tubules, sarcoplasmic reticulum, myofibrils."}]},{"key":"m5","name":"Module 5","sub":"Ch 12–14 · Nervous Tissue · Spinal Cord · Brain","cards":[{"id":"m5-c12-q9","ch":12,"section":"RQ","q":"Which of the following cavities contains a component of the central nervous system?","a":"C. cranial","opts":["A. abdominal","B. pelvic","C. cranial","D. thoracic"]},{"id":"m5-c12-q10","ch":12,"section":"RQ","q":"Which structure predominates in the white matter of the brain?","a":"A. myelinated axons","opts":["A. myelinated axons","B. neuronal cell bodies","C. ganglia of the parasympathetic nerves","D. bundles of dendrites from the enteric nervous system"]},{"id":"m5-c12-q11","ch":12,"section":"RQ","q":"Which part of a neuron transmits an electrical signal to a target cell?","a":"D. axon","opts":["A. dendrites","B. soma","C. cell body","D. axon"]},{"id":"m5-c12-q12","ch":12,"section":"RQ","q":"Which term describes a bundle of axons in the peripheral nervous system?","a":"D. nerve","opts":["A. nucleus","B. ganglion","C. tract","D. nerve"]},{"id":"m5-c12-q13","ch":12,"section":"RQ","q":"Which functional division of the nervous system would be responsible for the physiological changes seen during exercise (e.g., increased heart rate and sweating)?","a":"B. autonomic","opts":["A. somatic","B. autonomic","C. enteric","D. central"]},{"id":"m5-c12-q14","ch":12,"section":"RQ","q":"What type of glial cell provides myelin for the axons in a tract?","a":"A. oligodendrocyte","opts":["A. oligodendrocyte","B. astrocyte","C. Schwann cell","D. satellite cell"]},{"id":"m5-c12-q15","ch":12,"section":"RQ","q":"Which part of a neuron contains the nucleus?","a":"B. soma","opts":["A. dendrite","B. soma","C. axon","D. synaptic end bulb"]},{"id":"m5-c12-q16","ch":12,"section":"RQ","q":"Which of the following substances is least able to cross the blood-brain barrier?","a":"D. white blood cells","opts":["A. water","B. sodium ions","C. glucose","D. white blood cells"]},{"id":"m5-c12-q17","ch":12,"section":"RQ","q":"What type of glial cell is the resident macrophage behind the blood-brain barrier?","a":"A. microglia","opts":["A. microglia","B. astrocyte","C. Schwann cell","D. satellite cell"]},{"id":"m5-c12-q18","ch":12,"section":"RQ","q":"What two types of macromolecules are the main components of myelin?","a":"C. lipids and proteins","opts":["A. carbohydrates and lipids","B. proteins and nucleic acids","C. lipids and proteins","D. carbohydrates and nucleic acids"]},{"id":"m5-c12-q19","ch":12,"section":"RQ","q":"If a thermoreceptor is sensitive to temperature sensations, what would a chemoreceptor be sensitive to?","a":"C. molecules","opts":["A. light","B. sound","C. molecules","D. vibration"]},{"id":"m5-c12-q20","ch":12,"section":"RQ","q":"Which of these locations is where the greatest level of integration is taking place in the example of testing the temperature of the shower?","a":"D. cerebral cortex","opts":["A. skeletal muscle","B. spinal cord","C. thalamus","D. cerebral cortex"]},{"id":"m5-c12-q21","ch":12,"section":"RQ","q":"How long does all the signaling through the sensory pathway, within the central nervous system, and through the motor command pathway take?","a":"C. fraction of a second","opts":["A. 1 to 2 minutes","B. 1 to 2 seconds","C. fraction of a second","D. varies with graded potential"]},{"id":"m5-c12-q22","ch":12,"section":"RQ","q":"What is the target of an upper motor neuron?","a":"B. lower motor neuron","opts":["A. cerebral cortex","B. lower motor neuron","C. skeletal muscle","D. thalamus"]},{"id":"m5-c12-q23","ch":12,"section":"RQ","q":"What ion enters a neuron causing depolarization of the cell membrane?","a":"A. sodium","opts":["A. sodium","B. chloride","C. potassium","D. phosphate"]},{"id":"m5-c12-q24","ch":12,"section":"RQ","q":"Voltage-gated Na+ channels open upon reaching what state?","a":"B. threshold","opts":["A. resting potential","B. threshold","C. repolarization","D. overshoot"]},{"id":"m5-c12-q25","ch":12,"section":"RQ","q":"What does a ligand-gated channel require in order to open?","a":"B. binding of a neurotransmitter","opts":["A. increase in concentration of Na+ ions","B. binding of a neurotransmitter","C. increase in concentration of K+ ions","D. depolarization of the membrane"]},{"id":"m5-c12-q26","ch":12,"section":"RQ","q":"What does a mechanically gated channel respond to?","a":"A. physical stimulus","opts":["A. physical stimulus","B. chemical stimulus","C. increase in resistance","D. decrease in resistance"]},{"id":"m5-c12-q27","ch":12,"section":"RQ","q":"Which of the following voltages would most likely be measured during the relative refractory period?","a":"D. -80 mV","opts":["A. +30 mV","B. 0 mV","C. -45 mV","D. -80 mV"]},{"id":"m5-c12-q28","ch":12,"section":"RQ","q":"Which of the following is probably going to propagate an action potential fastest?","a":"D. a thick, myelinated axon","opts":["A. a thin, unmyelinated axon","B. a thin, myelinated axon","C. a thick, unmyelinated axon","D. a thick, myelinated axon"]},{"id":"m5-c12-q29","ch":12,"section":"RQ","q":"How much of a change in the membrane potential is necessary for the summation of postsynaptic potentials to result in an action potential being generated?","a":"B. +15 mV","opts":["A. +30 mV","B. +15 mV","C. +10 mV","D. -15 mV"]},{"id":"m5-c12-q30","ch":12,"section":"RQ","q":"A channel opens on a postsynaptic membrane that causes a negative ion to enter the cell. What type of graded potential is this?","a":"C. hyperpolarizing","opts":["A. depolarizing","B. repolarizing","C. hyperpolarizing","D. non-polarizing"]},{"id":"m5-c12-q31","ch":12,"section":"RQ","q":"What neurotransmitter is released at the neuromuscular junction?","a":"D. acetylcholine","opts":["A. norepinephrine","B. serotonin","C. dopamine","D. acetylcholine"]},{"id":"m5-c12-q32","ch":12,"section":"RQ","q":"What type of receptor requires an effector protein to initiate a signal?","a":"D. metabotropic receptor","opts":["A. biogenic amine","B. ionotropic receptor","C. cholinergic system","D. metabotropic receptor"]},{"id":"m5-c12-q33","ch":12,"section":"RQ","q":"Which of the following neurotransmitters is associated with inhibition exclusively?","a":"A. GABA","opts":["A. GABA","B. acetylcholine","C. glutamate","D. norepinephrine"]},{"id":"m5-c12-q34","ch":12,"section":"CT","q":"What responses are generated by the nervous system when you run on a treadmill? Include an example of each type of tissue that is under nervous system control.","a":"Running on a treadmill involves contraction of the skeletal muscles in the legs, increase in contraction of the cardiac muscle of the heart, and the production and secretion of sweat in the skin to stay cool."},{"id":"m5-c12-q35","ch":12,"section":"CT","q":"When eating food, what anatomical and functional divisions of the nervous system are involved in the perceptual experience?","a":"The sensation of taste associated with eating is sensed by nerves in the periphery that are involved in sensory and somatic functions."},{"id":"m5-c12-q36","ch":12,"section":"CT","q":"Multiple sclerosis is a demyelinating disease affecting the central nervous system. What type of cell would be the most likely target of this disease? Why?","a":"The disease would target oligodendrocytes. In the CNS, oligodendrocytes provide the myelin for axons."},{"id":"m5-c12-q37","ch":12,"section":"CT","q":"Which type of neuron, based on its shape, is best suited for relaying information directly from one neuron to another? Explain why.","a":"Bipolar cells, because they have one dendrite that receives input and one axon that provides output, would be a direct relay between two other cells."},{"id":"m5-c12-q38","ch":12,"section":"CT","q":"Sensory fibers, or pathways, are referred to as “afferent.” Motor fibers, or pathways, are referred to as “efferent.” What can you infer about the meaning of these two terms (afferent and efferent) in a structural or anatomical context?","a":"Afferent means “toward,” as in sensory information traveling from the periphery into the CNS. Efferent means “away from,” as in motor commands that travel from the brain down the spinal cord and out into the periphery."},{"id":"m5-c12-q39","ch":12,"section":"CT","q":"If a person has a motor disorder and cannot move their arm voluntarily, but their muscles have tone, which motor neuron—upper or lower—is probably affected? Explain why.","a":"The upper motor neuron would be affected because it is carrying the command from the brain down."},{"id":"m5-c12-q40","ch":12,"section":"CT","q":"What does it mean for an action potential to be an “all or none” event?","a":"The cell membrane must reach threshold before voltage-gated Na+ channels open. If threshold is not reached, those channels do not open, and the depolarizing phase of the action potential does not occur, the cell membrane will just go back to its resting state."},{"id":"m5-c12-q41","ch":12,"section":"CT","q":"The conscious perception of pain is often delayed because of the time it takes for the sensations to reach the cerebral cortex. Why would this be the case based on propagation of the axon potential?","a":"Axons of pain sensing sensory neurons are thin and unmyelinated so that it takes longer for that sensation to reach the brain than other sensations."},{"id":"m5-c12-q42","ch":12,"section":"CT","q":"If a postsynaptic cell has synapses from five different cells, and three cause EPSPs and two of them cause IPSPs, give an example of a series of depolarizations and hyperpolarizations that would result in the neuron reaching threshold.","a":"EPSP1 = +5 mV, EPSP2 = +7 mV, EPSP 3 = +10 mV, IPSP1 = -4 mV, IPSP2 = -3 mV. 5 + 7 + 10 – 4 – 3 = +15 mV."},{"id":"m5-c12-q43","ch":12,"section":"CT","q":"Why is the receptor the important element determining the effect a neurotransmitter has on a target cell?","a":"Different neurotransmitters have different receptors. Thus, the type of receptor in the postsynaptic cell is what determines which ion channels open. Acetylcholine binding to the nicotinic receptor causes cations to cross the membrane. GABA binding to its receptor causes the anion chloride to cross the membrane."},{"id":"m5-c13-q13","ch":13,"section":"RQ","q":"Aside from the nervous system, which other organ system develops out of the ectoderm?","a":"C. integumentary","opts":["A. digestive","B. respiratory","C. integumentary","D. urinary"]},{"id":"m5-c13-q14","ch":13,"section":"RQ","q":"Which primary vesicle of the embryonic nervous system does not differentiate into more vesicles at the secondary stage?","a":"B. mesencephalon","opts":["A. prosencepha
