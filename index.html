"],"a":"B. tunica media"},{"id":"s2-step-v45","ch":20,"section":"Step","q":"Which blood vessel feature directly contributes to the formation of pulse felt at the skin?","opts":["A. thin walls in capillaries","B. valves in veins","C. lack of smooth muscle","D. elastic fibers in arteries (elastic arteries)"],"a":"D. elastic fibers in arteries (elastic arteries)"},{"id":"s2-step-v46","ch":20,"section":"Step","q":"Which blood vessels drain deoxygenated blood from the capillary beds back toward the heart?","opts":["A. arterioles","B. arterioles and arteries","C. arteries","D. venules/veins"],"a":"D. venules/veins"},{"id":"s2-step-v47","ch":20,"section":"Step","q":"Which type of vessel has the largest lumen and typically carries blood under the lowest pressure?","opts":["A. veins","B. arterioles","C. capillaries","D. arteries"],"a":"A. veins"},{"id":"s2-step-v48","ch":20,"section":"Step","q":"What structural feature distinguishes arteries from veins most prominently?","opts":["A. presence of valves in arteries","B. longer walls in veins","C. larger lumen in arteries","D. thicker tunica media in arteries"],"a":"D. thicker tunica media in arteries"},{"id":"s2-step-v49","ch":20,"section":"Step","q":"What is the thin layer that lines the interior surface of all blood vessels called?","opts":["A. tunica externa","B. tunica media","C. endothelium","D. epithelium"],"a":"C. endothelium"},{"id":"s2-step-v50","ch":20,"section":"Step","q":"Which vessels are the site of gas exchange between blood and tissues?","opts":["A. arteries","B. capillaries","C. arterioles","D. venules"],"a":"B. capillaries"},{"id":"s2-step-v51","ch":20,"section":"Step","q":"Which vessels are the primary site of nutrient and gas exchange with tissues?","opts":["A. arteries","B. veins","C. capillaries","D. arterioles"],"a":"C. capillaries"},{"id":"s2-step-v52","ch":20,"section":"Step","q":"Which of the following factors contributes to venous pooling when standing for long periods?","opts":["A. tight arterial walls","B. rapid heart rate","C. high arterial pressure","D. gravity and valves preventing backflow"],"a":"D. gravity and valves preventing backflow"},{"id":"s2-step-v53","ch":20,"section":"Step","q":"Which of the following best describes venous return to the heart?","opts":["A. dependent only on heartbeats","B. driven solely by arterial pressure","C. to be aided by valves and surrounding skeletal muscle contractions","D. unidirectional unidirectional flow without valves"],"a":"C. to be aided by valves and surrounding skeletal muscle contractions"},{"id":"s2-step-v54","ch":20,"section":"Step","q":"Which layer of a vessel forms the immediate boundary with circulating blood?","opts":["A. tunica externa","B. tunica media","C. endothelium","D. tunica intima"],"a":"D. tunica intima"},{"id":"s2-step-v55","ch":20,"section":"Step","q":"What is the main driving force that pushes blood through the circulatory system?","opts":["A. osmotic pressure","B. respiratory pressure","C. muscular contraction of veins only","D. cardiac output"],"a":"D. cardiac output"},{"id":"s2-step-v56","ch":20,"section":"Step","q":"Which of the following best describes the composition of capillary walls?","opts":["A. thick connective tissue coat","B. multiple smooth muscle layers","C. a single endothelium layer with a basement membrane","D. three-layered wall like arteries"],"a":"C. a single endothelium layer with a basement membrane"},{"id":"s2-step-v57","ch":20,"section":"Step","q":"Which vessels have the richest nerve supply to regulate diameter?","opts":["A. capillaries","B. veins","C. venules","D. arteries (especially muscular arteries)"],"a":"D. arteries (especially muscular arteries)"},{"id":"s2-step-v58","ch":20,"section":"Step","q":"Identify A in histology slide","opts":["A. Correct: vein","B. artery","C. capillary","D. nerve"],"a":"A. Correct: vein","img":"images/step/m2_vessels_img08.png"},{"id":"s2-step-v59","ch":20,"section":"Step","q":"Identify B in histology slide","opts":["A. vein","B. Correct: artery","C. capillary","D. nerve"],"a":"B. Correct: artery","img":"images/step/m2_vessels_img09.png"},{"id":"s2-step-v60","ch":20,"section":"Step","q":"Identify vein A in diagram.","opts":["A. Incorrect: carotid","B. jugular","C. vertebral","D. cervical"],"a":"B. jugular","img":"images/step/m2_vessels_img10.png"},{"id":"s2-step-v61","ch":20,"section":"Step","q":"Identify vein A in diagram.","opts":["A. Incorrect: carotid","B. jugular","C. vertebral","D. cervical"],"a":"B. jugular","img":"images/step/m2_vessels_img11.png"},{"id":"s2-step-v62","ch":20,"section":"Step","q":"Identify artery A in diagram.","opts":["A. Incorrect: Jugular","B. Carotid","C. Cervical","D. Cleidomastoid"],"a":"B. Carotid","img":"images/step/m2_vessels_img12.png"},{"id":"s2-step-v64","ch":20,"section":"Step","q":"What does label A represent?","opts":["A. Aorta","B. alveolar capillary","C. inferior vena cava","D. brachial artery"],"a":"A. Aorta","img":"images/step/m2_vessels_img14.png"},{"id":"s2-c18-lab1","ch":18,"section":"Lab","q":"What is the function of blood?","a":"Transportation (O2, CO2, nutrients, hormones, wastes, heat), regulation (pH, body temperature, fluid/water balance), and protection (clotting to stop blood loss; WBCs & antibodies against disease)."},{"id":"s2-c18-lab2","ch":18,"section":"Lab","q":"Whole blood for lab testing is usually collected from a superficial ____; to check gas-exchange efficiency it may be drawn from an ____.","a":"a superficial VEIN; and for checking gas-exchange efficiency, an ARTERY (arterial blood)."},{"id":"s2-c18-lab3","ch":18,"section":"Lab","q":"Plasma is closest in composition to ____ fluid. Its most abundant component is ____; its most abundant proteins are ____; and the ____ secretes most plasma proteins.","a":"INTERSTITIAL fluid; most abundant component = WATER (~92%); most abundant plasma proteins = ALBUMINS; the LIVER secretes most plasma proteins."},{"id":"s2-c18-lab4","ch":18,"section":"Lab","q":"A person with low blood volume is said to be ____. A(n) ____ provides information on the abundance of formed elements.","a":"HYPOVOLEMIC (low blood volume); a COMPLETE BLOOD COUNT (CBC) gives the abundance of formed elements."},{"id":"s2-c18-lab5","ch":18,"section":"Lab","q":"The plasma proteins essential in body defense are the ____.","a":"The IMMUNOGLOBULINS (antibodies / gamma globulins)."},{"id":"s2-c18-lab6","ch":18,"section":"Lab","q":"All circulating RBCs in an adult originate in the ____ bone marrow, and RBC production is regulated by the hormone ____.","a":"RED bone marrow; RBC production is regulated by the hormone ERYTHROPOIETIN (EPO), made by the kidneys."},{"id":"s2-c18-lab7","ch":18,"section":"Lab","q":"Name the proteins that store or transport iron.","a":"TRANSFERRIN transports iron in the blood; FERRITIN and HEMOSIDERIN store iron."},{"id":"s2-c18-lab8","ch":18,"section":"Lab","q":"Sickle cell anemia results when the gene for adult ____ is abnormal.","a":"HEMOGLOBIN (specifically the beta-globin chain of adult hemoglobin A)."},{"id":"s2-c18-lab9","ch":18,"section":"Lab","q":"Mary's hemoglobin is 16 g/dL. Is this normal, and what is the normal range?","a":"Normal. (A hemoglobin of 16 g/dL falls within the normal adult range — roughly 12-16 g/dL for women and 13.5-17.5 g/dL for men.)"},{"id":"s2-c18-lab10","ch":18,"section":"Lab","q":"The function of red blood cells is to carry ____ to the cells and help carry away carbon dioxide.","a":"OXYGEN (carried to the cells; then they help carry CO2 away)."},{"id":"s2-c18-lab11","ch":18,"section":"Lab","q":"____ is a condition in which the oxygen-carrying capacity of the blood is reduced.","a":"ANEMIA (reduced oxygen-carrying capacity of the blood)."},{"id":"s2-c18-lab12","ch":18,"section":"Lab","q":"A bruise turns greenish because the heme group of hemoglobin breaks down into ____.","a":"BILIVERDIN (the green heme breakdown pigment; later converted to yellow bilirubin)."},{"id":"s2-c18-lab13","ch":18,"section":"Lab","q":"Aged and damaged erythrocytes are broken down by macrophages in the ____, liver, and bone marrow.","a":"The SPLEEN (plus the liver and bone marrow)."},{"id":"s2-c18-lab14","ch":18,"section":"Lab","q":"____ are immature erythrocytes present in the circulation.","a":"RETICULOCYTES."},{"id":"s2-c18-lab15","ch":18,"section":"Lab","q":"Bill's blood agglutinates with anti-A serum but not with anti-B or anti-D. What is his blood type?","a":"Bill is blood type A, Rh-negative (A-). Agglutination with anti-A serum shows the A antigen is present; no reaction with anti-B means no B antigen; no reaction with anti-D (anti-Rh) means he is Rh-negative."},{"id":"s2-c18-lab16","ch":18,"section":"Lab","q":"A person's blood type is determined by the presence of specific ____ on the RBC membrane.","a":"ANTIGENS (surface glycoproteins, also called agglutinogens) on the RBC membrane."},{"id":"s2-c18-lab17","ch":18,"section":"Lab","q":"Type AB is the 'universal recipient' because its blood lacks A and B ____.","a":"ANTIBODIES (agglutinins). Type AB plasma has neither anti-A nor anti-B antibodies, so it can receive any ABO type."},{"id":"s2-c18-lab18","ch":18,"section":"Lab","q":"Antigens on the RBC surface are also called ____, and antibodies in the plasma are also called ____.","a":"Surface antigens = AGGLUTINOGENS; plasma antibodies = AGGLUTININS."},{"id":"s2-c18-lab19","ch":18,"section":"Lab","q":"The most numerous WBCs are the ____; WBCs that release histamine are ____; eosinophils destroy antibody-labeled ____.","a":"Most numerous = NEUTROPHILS; release histamine = BASOPHILS (and mast cells); eosinophils destroy antibody-labeled ANTIGENS / foreign particles (and parasites)."},{"id":"s2-c18-lab20","ch":18,"section":"Lab","q":"Non-specific immunity such as phagocytosis is a function of which blood cells?","a":"NEUTROPHILS and MONOCYTES/MACROPHAGES (the phagocytic white blood cells; eosinophils phagocytize to a lesser degree)."},{"id":"s2-c18-labimg1","ch":18,"section":"Lab","q":"Identify this white blood cell (Wright-stained blood smear) and give its key features.","a":"NEUTROPHIL - multilobed nucleus (3-5 lobes joined by strands), pale lilac cytoplasm with fine granules; ~12-14 um. The MOST numerous WBC (50-70%). First responder to bacterial infection; phagocytoses bacteria.","img":"images/bloodlab/m2_lab_img01.jpeg"},{"id":"s2-c18-labimg2","ch":18,"section":"Lab","q":"Identify this white blood cell and give its key features.","a":"EOSINOPHIL - bilobed nucleus with large RED/orange-staining granules; ~12-17 um. Attacks parasites, moderates allergic/inflammatory reactions, and destroys antibody-labeled antigens.","img":"images/bloodlab/m2_lab_img02.jpeg"},{"id":"s2-c18-labimg3","ch":18,"section":"Lab","q":"Identify this white blood cell and give its key features.","a":"BASOPHIL - bilobed nucleus usually hidden by dense, deep blue/purple-black granules; ~14-16 um. The RAREST WBC. Releases histamine (inflammation) and heparin (anticoagulant); has IgE receptors.","img":"images/bloodlab/m2_lab_img03.jpeg"},{"id":"s2-c18-labimg4","ch":18,"section":"Lab","q":"Identify this white blood cell and give its key features.","a":"LYMPHOCYTE - large round nucleus filling most of the cell with only a thin rim of pale-blue cytoplasm; often barely bigger than a RBC. 2nd most common WBC (20-50%). B-cells make antibodies; T-cells attack viruses, cancer & transplants.","img":"images/bloodlab/m2_lab_img04.jpeg"},{"id":"s2-c18-labimg5","ch":18,"section":"Lab","q":"Identify this white blood cell and give its key features.","a":"MONOCYTE - the LARGEST WBC (up to ~20 um), with an indented kidney/horseshoe-shaped nucleus and abundant gray-blue cytoplasm. Leaves the blood to become a MACROPHAGE (phagocytosis & antigen presentation).","img":"images/bloodlab/m2_lab_img05.jpeg"},{"id":"s2-c18-labimg6","ch":18,"section":"Lab","q":"Read this ABO chart: for each blood type, what antigens are on the RBC and what antibodies are in the plasma?","a":"Type A: A antigen, anti-B antibody. Type B: B antigen, anti-A antibody. Type AB: A and B antigens, NO antibodies -> universal RECIPIENT. Type O: NO antigens, both anti-A and anti-B antibodies -> universal DONOR.","img":"images/bloodlab/m2_lab_img06.png"},{"id":"s2-c18-labimg7","ch":18,"section":"Lab","q":"What test does this tube show, and what do its layers represent?","a":"HEMATOCRIT (packed cell volume). Centrifuged blood separates into: bottom RED layer = packed RBCs (the hematocrit %, normally ~42% in women, ~47% in men), a thin buffy coat = WBCs + platelets, and the top YELLOW layer = plasma. Here the RBC column reads ~45%.","img":"images/bloodlab/m2_lab_img07.png"},{"id":"s2-c18-labimg8","ch":18,"section":"Lab","q":"These are the lab's blood-cell models in size order. Name them left to right.","a":"Erythrocyte (RBC), neutrophil, eosinophil, basophil, mature lymphocyte, immature lymphocyte, and monocyte (the largest).","img":"images/bloodlab/m2_lab_img09.jpeg"}]},{"key":"s2m2x","name":"Module 2 Extra","sub":"Lecture-outline deep study · Blood · Heart · Blood Vessels","semester":2,"cards":[{"id":"s2x-c18-1","ch":18,"section":"Cardiovascular overview","q":"What three components make up the cardiovascular system as a circulating transport system?","a":"A pump (the heart), a conducting system (blood vessels), and a fluid medium (blood)."},{"id":"s2x-c18-2","ch":18,"section":"Cardiovascular overview","q":"What type of tissue is blood classified as?","a":"Blood is a specialized fluid connective tissue that contains cells suspended in a fluid matrix to transport materials to and from cells."},{"id":"s2x-c18-3","ch":18,"section":"Cardiovascular overview","q":"What substances does blood carry TO cells and tissues?","a":"Nourishment, electrolytes, hormones, vitamins, antibodies, oxygen, and heat."},{"id":"s2x-c18-4","ch":18,"section":"Cardiovascular overview","q":"What substances does blood carry AWAY from cells and tissues?","a":"Wastes and carbon dioxide."},{"id":"s2x-c18-5","ch":18,"section":"Functions of Blood","q":"What are the five main functions of blood?","a":"Transport of dissolved substances; regulation of pH and ions; restriction of fluid losses at injury sites; defense against toxins and pathogens; and stabilization of body temperature."},{"id":"s2x-c18-6","ch":18,"section":"Functions of Blood","q":"How does blood help protect the body at injury sites?","a":"It restricts fluid losses at injury sites (through clotting)."},{"id":"s2x-c18-7","ch":18,"section":"Functions of Blood","q":"Which blood function involves defending against toxins and pathogens?","a":"The immune/defense function, carried out largely by white blood cells and antibodies."},{"id":"s2x-c18-8","ch":18,"section":"Physical Characteristics","q":"What two major components make up whole blood?","a":"Plasma and formed elements."},{"id":"s2x-c18-9","ch":18,"section":"Physical Characteristics","q":"What is plasma composed of?","a":"A fluid consisting of water, dissolved plasma proteins, and other solutes."},{"id":"s2x-c18-10","ch":18,"section":"Physical Characteristics","q":"What are the 'formed elements' of blood?","a":"All the cells and solids of blood: red blood cells, white blood cells, and platelets."},{"id":"s2x-c18-11","ch":18,"section":"Formed Elements","q":"What are the three types of formed elements in blood?","a":"Red blood cells (erythrocytes), white blood cells (leukocytes), and platelets."},{"id":"s2x-c18-12","ch":18,"section":"Formed Elements","q":"What is the primary function of red blood cells (erythrocytes)?","a":"To transport oxygen."},{"id":"s2x-c18-13","ch":18,"section":"Formed Elements","q":"What is the role of white blood cells (leukocytes)?","a":"They are part of the immune system."},{"id":"s2x-c18-14","ch":18,"section":"Formed Elements","q":"What are platelets and what do they do?","a":"Platelets are cell fragments involved in clotting."},{"id":"s2x-c18-15","ch":18,"section":"Hemopoiesis","q":"What is hemopoiesis (hematopoiesis)?","a":"The process of producing formed elements from myeloid and lymphoid stem cells in bone marrow."},{"id":"s2x-c18-16","ch":18,"section":"Hemopoiesis","q":"Where do hematopoietic stem cells (HSCs) reside, and what is special about them?","a":"They reside in the medulla of the bone (bone marrow) and have the unique ability to give rise to all of the different mature blood cell types and tissues."},{"id":"s2x-c18-17","ch":18,"section":"Fractionation","q":"What is fractionation?","a":"The process of separating whole blood for clinical analysis into plasma and formed elements."},{"id":"s2x-c18-18","ch":18,"section":"Physical Characteristics","q":"What is the normal temperature of blood?","a":"38 C (100.4 F)."},{"id":"s2x-c18-19","ch":18,"section":"Physical Characteristics","q":"How does the viscosity of blood compare to water?","a":"Blood has high viscosity (it is thicker/more viscous than water)."},{"id":"s2x-c18-20","ch":18,"section":"Physical Characteristics","q":"What is the normal pH range of blood, and is it acidic or alkaline?","a":"7.35 to 7.45 — slightly alkaline."},{"id":"s2x-c18-21","ch":18,"section":"Blood Volume","q":"Blood volume is approximately what percentage of body weight?","a":"About 7% of body weight (in kilograms)."},{"id":"s2x-c18-22","ch":18,"section":"Blood Volume","q":"What is the typical blood volume of an adult male versus an adult female?","a":"Adult male: 5 to 6 liters; adult female: 4 to 5 liters."},{"id":"s2x-c18-23","ch":18,"section":"Plasma","q":"What percentage of blood volume is plasma, and how much of plasma is water?","a":"Plasma makes up 50–60% of blood volume, and more than 90% of plasma is water."},{"id":"s2x-c18-24","ch":18,"section":"Plasma","q":"Do plasma proteins pass through capillary walls?","a":"No — plasma proteins do not pass through capillary walls."},{"id":"s2x-c18-25","ch":18,"section":"Plasma Proteins","q":"What are the three main plasma proteins and their approximate percentages?","a":"Albumins (60%), globulins (35%), and fibrinogen (4%)."},{"id":"s2x-c18-26","ch":18,"section":"Plasma Proteins","q":"What is the function of albumins, the most abundant plasma protein?","a":"They transport substances such as fatty acids, thyroid hormones, and steroid hormones (and contribute to osmotic pressure)."},{"id":"s2x-c18-27","ch":18,"section":"Plasma Proteins","q":"What are globulins and what do they include?","a":"Globulins (35% of plasma proteins) include antibodies (immunoglobulins) and transport globulins such as hormone-binding proteins, metalloproteins, apolipoproteins (lipoproteins), and steroid-binding proteins."},{"id":"s2x-c18-28","ch":18,"section":"Plasma Proteins","q":"What is the function of fibrinogen?","a":"Fibrinogen molecules form clots and produce long, insoluble strands of fibrin."},{"id":"s2x-c18-29","ch":18,"section":"Plasma Proteins","q":"What is serum, and how does it differ from plasma?","a":"Serum is the liquid part of a blood sample in which dissolved fibrinogen has converted to solid fibrin; it is similar in composition to plasma but excludes the clotting factors."},{"id":"s2x-c18-30","ch":18,"section":"Plasma Proteins","q":"Besides albumins, globulins, and fibrinogen, what other proteins are found in plasma?","a":"Enzymes, hormones, and prohormones."},{"id":"s2x-c18-31","ch":18,"section":"Plasma Proteins","q":"Where are most plasma proteins made?","a":"Over 90% are made in the liver; antibodies are made by plasma cells; and peptide hormones are made by endocrine organs."},{"id":"s2x-c18-32","ch":18,"section":"Red Blood Cells","q":"What percentage of blood's formed elements are red blood cells?","a":"99.9%."},{"id":"s2x-c18-33","ch":18,"section":"Red Blood Cells","q":"What is hemoglobin and what gives whole blood its color?","a":"Hemoglobin is the red pigment that gives whole blood its color; it binds and transports oxygen and carbon dioxide."},{"id":"s2x-c18-34","ch":18,"section":"Red Blood Cells","q":"What is a red blood cell count?","a":"The number of RBCs in 1 microliter of whole blood."},{"id":"s2x-c18-35","ch":18,"section":"Red Blood Cells","q":"What are the normal RBC counts for males and females?","a":"Male: 4.5–6.3 million per microliter; Female: 4.2–5.5 million per microliter."},{"id":"s2x-c18-36","ch":18,"section":"Hematocrit","q":"What is hematocrit (packed cell volume, PCV)?","a":"The percentage of RBCs in centrifuged whole blood."},{"id":"s2x-c18-37","ch":18,"section":"Hematocrit","q":"What are the normal hematocrit ranges for males and females?","a":"Male: 40–54; Female: 37–47."},{"id":"s2x-c18-38","ch":18,"section":"RBC Structure","q":"Describe the structure of a red blood cell.","a":"RBCs are small, highly specialized biconcave discs — thin in the middle and thicker at the edge."},{"id":"s2x-c18-39","ch":18,"section":"RBC Structure","q":"Why is the RBC's shape and high surface-to-volume ratio important?","a":"The high surface-to-volume ratio lets RBCs quickly absorb and release oxygen."},{"id":"s2x-c18-40","ch":18,"section":"RBC Structure","q":"What are rouleaux and what do they do?","a":"Rouleaux are stacks that discs (RBCs) form, which smooth the flow of blood through narrow blood vessels."},{"id":"s2x-c18-41","ch":18,"section":"RBC Structure","q":"How do RBCs pass through capillaries smaller than themselves?","a":"They bend and flex; a 7.8 µm RBC can pass through a 4 µm capillary."},{"id":"s2x-c18-42","ch":18,"section":"RBC Lifespan","q":"Why do RBCs have no repair mechanism, and how long do they live?","a":"They lack nuclei, mitochondria, and ribosomes, so they have no repair mechanism; they live about 120 days."},{"id":"s2x-c18-43","ch":18,"section":"Hemoglobin","q":"What is hemoglobin's basic role?","a":"It is a protein molecule that transports respiratory gases (oxygen and carbon dioxide)."},{"id":"s2x-c18-44","ch":18,"section":"Hemoglobin","q":"Describe the structure of hemoglobin.","a":"It has a complex quaternary structure with four globular protein subunits, each with one molecule of heme, and each heme contains one iron ion."},{"id":"s2x-c18-45","ch":18,"section":"Hemoglobin","q":"What are oxyhemoglobin and deoxyhemoglobin?","a":"Oxyhemoglobin is hemoglobin whose iron ions are associated with (bound to) oxygen; deoxyhemoglobin is hemoglobin that has dissociated from (released) oxygen."},{"id":"s2x-c18-46","ch":18,"section":"Hemoglobin","q":"What is carbaminohemoglobin?","a":"Hemoglobin bound to carbon dioxide; after releasing oxygen to low-oxygen tissues, hemoglobin binds CO2 and carries it to the lungs as carbaminohemoglobin."},{"id":"s2x-c18-47","ch":18,"section":"RBC Turnover","q":"What fraction of circulating RBCs wear out each day, and how many RBCs are made per second?","a":"About 1% wear out per day, and about 3 million RBCs are made per second."},{"id":"s2x-c18-48","ch":18,"section":"RBC Turnover","q":"Which cells monitor and remove aging RBCs, and where are they located?","a":"Macrophages of the liver, spleen, and bone marrow; they engulf RBCs before their membranes rupture (hemolyze)."},{"id":"s2x-c18-49","ch":18,"section":"Hemoglobin Recycling","q":"How do phagocytes break down hemoglobin?","a":"They break the globular proteins into amino acids and break heme into biliverdin and iron."},{"id":"s2x-c18-50","ch":18,"section":"Hemoglobin Recycling","q":"What is hemoglobinuria?","a":"Hemoglobin breakdown products in the urine due to excess hemolysis in the bloodstream."},{"id":"s2x-c18-51","ch":18,"section":"Hemoglobin Recycling","q":"What is hematuria, and how does it differ from hemoglobinuria?","a":"Hematuria is whole red blood cells in the urine due to kidney or tissue damage, whereas hemoglobinuria is hemoglobin breakdown products in urine from excess hemolysis."},{"id":"s2x-c18-52","ch":18,"section":"Hemoglobin Recycling","q":"What happens to iron during heme breakdown?","a":"Iron is removed from heme (and recycled), leaving biliverdin behind."},{"id":"s2x-c18-53","ch":18,"section":"Hemoglobin Recycling","q":"What color change occurs when biliverdin is converted to bilirubin?","a":"Biliverdin (green) is converted to bilirubin (yellow)."},{"id":"s2x-c18-54","ch":18,"section":"Hemoglobin Recycling","q":"How is bilirubin excreted, and what causes jaundice?","a":"Bilirubin is excreted by the liver in bile; jaundice is caused by bilirubin buildup."},{"id":"s2x-c18-55","ch":18,"section":"Hemoglobin Recycling","q":"What do intestinal bacteria convert bilirubin into?","a":"Urobilins and stercobilins."},{"id":"s2x-c18-56","ch":18,"section":"RBC Production","q":"What is erythropoiesis and where does it occur in adults?","a":"Erythropoiesis is RBC production; in adults it occurs only in myeloid tissue (red bone marrow), where stem cells mature to become RBCs."},{"id":"s2x-c18-57","ch":18,"section":"RBC Production","q":"What are hemocytoblasts?","a":"Stem cells in myeloid tissue that divide to produce myeloid stem cells and lymphoid stem cells."},{"id":"s2x-c18-58","ch":18,"section":"RBC Production","q":"What do myeloid stem cells versus lymphoid stem cells become?","a":"Myeloid stem cells become RBCs and some WBCs; lymphoid stem cells become lymphocytes."},{"id":"s2x-c18-59","ch":18,"section":"RBC Production","q":"What are the stages of RBC maturation in order?","a":"Myeloid stem cell → proerythroblast → erythroblasts → reticulocyte → mature RBC."},{"id":"s2x-c18-60","ch":18,"section":"RBC Production","q":"What nutrients are required to build red blood cells?","a":"Amino acids, iron, and vitamins B12, B6, and folic acid."},{"id":"s2x-c18-61","ch":18,"section":"RBC Production","q":"What is pernicious anemia?","a":"Low RBC production due to the unavailability of vitamin B12."},{"id":"s2x-c18-62","ch":18,"section":"RBC Production","q":"What is erythropoietin (EPO) and when is it secreted?","a":"EPO (erythropoiesis-stimulating hormone) is secreted when oxygen in peripheral tissues is low (hypoxia), such as from disease or high altitude, and it stimulates RBC production."},{"id":"s2x-c18-63","ch":18,"section":"Blood Typing","q":"Who discovered the ABO blood group and when?","a":"Karl Landsteiner discovered the ABO blood group in 1900."},{"id":"s2x-c18-64","ch":18,"section":"Blood Typing","q":"What do the antigens on the surfaces of blood and body cells do?","a":"They are capable of stimulating an immune response in another person, which is the basis for blood typing and transfusion reactions."},{"id":"s2x-c18-65","ch":18,"section":"Blood Typing","q":"What are agglutinogens?","a":"The antigens on the surface of RBCs that determine blood type; they are named for their role in agglutination during mismatched blood transfusions."},{"id":"s2x-c18-66","ch":18,"section":"Blood Typing","q":"What are agglutinins?","a":"Plasma antibodies that react against agglutinogens (RBC surface antigens); they attack and agglutinate (clump) foreign antigens."},{"id":"s2x-c18-67","ch":18,"section":"Blood Typing","q":"How many antigens can RBCs have?","a":"More than 50 antigens."},{"id":"s2x-c18-68","ch":18,"section":"Blood Typing","q":"Which RBC surface antigens genetically determine the common blood types?","a":"Antigens A, B, and Rh (or D)."},{"id":"s2x-c18-69","ch":18,"section":"Blood Typing","q":"What are the four basic blood types and their surface antigens?","a":"A (antigen A), B (antigen B), AB (antigens A and B), and O (neither A nor B)."},{"id":"s2x-c18-70","ch":18,"section":"Blood Typing","q":"Which plasma antibodies does each ABO blood type carry?","a":"Type A has anti-B antibodies; Type B has anti-A antibodies; Type O has both anti-A and anti-B antibodies; Type AB has neither antibody."},{"id":"s2x-c18-71","ch":18,"section":"Blood Typing","q":"Why does type O plasma contain both A and B antibodies?","a":"Because type O RBCs have neither the A nor B antigen, the plasma can carry antibodies against both without attacking its own cells."},{"id":"s2x-c18-72","ch":18,"section":"Rh Factor","q":"What is the Rh factor, and what are the two possible statuses?","a":"The Rh factor is also called the D antigen; a person is either Rh positive (Rh+) or Rh negative (Rh-)."},{"id":"s2x-c18-73","ch":18,"section":"Transfusions","q":"What is a cross-reaction (transfusion reaction)?","a":"When a plasma antibody meets its specific surface antigen, the blood will agglutinate and hemolyze; it occurs if donor and recipient blood types are not compatible."},{"id":"s2x-c18-74","ch":18,"section":"Transfusions","q":"What is cross-match testing, and who is the universal donor without it?","a":"Cross-match testing is performed on donor and recipient blood to check compatibility; without a cross-match, type O- is the universal donor."},{"id":"s2x-c18-75","ch":18,"section":"White Blood Cells","q":"How do white blood cells differ from red blood cells structurally?","a":"WBCs do not have hemoglobin, but they do have nuclei and other organelles."},{"id":"s2x-c18-76","ch":18,"section":"White Blood Cells","q":"How do WBCs compare with RBCs in number and lifespan?","a":"WBCs are far less numerous than RBCs, and most are short-lived."},{"id":"s2x-c18-77","ch":18,"section":"White Blood Cells","q":"What are the three general functions of WBCs?","a":"Defend against pathogens, remove toxins and wastes, and attack abnormal cells."},{"id":"s2x-c18-78","ch":18,"section":"White Blood Cells","q":"Where are most WBCs found?","a":"In connective tissue proper and lymphoid system organs, with only small numbers in the blood."},{"id":"s2x-c18-79","ch":18,"section":"White Blood Cells","q":"What is the normal WBC count range?","a":"5,000 to 10,000 per microliter."},{"id":"s2x-c18-80","ch":18,"section":"White Blood Cells","q":"What is positive chemotaxis in WBCs?","a":"The attraction of WBCs toward chemical stimuli."},{"id":"s2x-c18-81","ch":18,"section":"White Blood Cells","q":"What special movement abilities do circulating WBCs have?","a":"They can migrate out of the bloodstream and have amoeboid movement."},{"id":"s2x-c18-82","ch":18,"section":"White Blood Cells","q":"Which WBCs are phagocytic?","a":"Neutrophils, eosinophils, and monocytes."},{"id":"s2x-c18-83","ch":18,"section":"White Blood Cells","q":"What are the five types of white blood cells?","a":"Neutrophils, eosinophils, basophils, monocytes, and lymphocytes."},{"id":"s2x-c18-84","ch":18,"section":"White Blood Cells","q":"What mnemonic helps remember the five WBC types?","a":"'Never Let Monkeys Eat Bananas' — Neutrophils, Lymphocytes, Monocytes, Eosinophils, Basophils."},{"id":"s2x-c18-85","ch":18,"section":"White Blood Cells","q":"How are granulocytes and agranulocytes distinguished, and which cells belong to each?","a":"Granulocytes (neutrophils, eosinophils, basophils) have a granular appearance under the microscope; agranulocytes (lymphocytes and monocytes) do not appear granular."},{"id":"s2x-c18-86","ch":18,"section":"Granulocytes","q":"Describe the neutrophil's structure and function.","a":"Neutrophils have fine granules containing antimicrobial agents and lobed nuclei; they function in phagocytosis of bacteria and release of antimicrobial agents."},{"id":"s2x-c18-87","ch":18,"section":"Granulocytes","q":"Describe the eosinophil's staining, nucleus, and function.","a":"Eosinophils have coarse cytoplasmic granules that stain orange-pink with eosin dye and a bilobed nucleus; they phagocytize antigen-antibody complexes, allergens, and inflammatory chemicals, and aggregate near parasites, releasing enzymes to destroy them."},{"id":"s2x-c18-88","ch":18,"section":"Granulocytes","q":"Describe the basophil's nucleus, staining, and secretions.","a":"Basophils have a U- or S-shaped nucleus and coarse granules that stain purple with basic dye; they release histamine (a vasodilator) and heparin (an anticoagulant), increasing blood flow and promoting the mobility of other WBCs."},{"id":"s2x-c18-89","ch":18,"section":"Granulocytes","q":"What two substances do basophils release, and what are their effects?","a":"Histamine, a vasodilator that increases blood flow to an area, and heparin, an anticoagulant."},{"id":"s2x-c18-90","ch":18,"section":"Agranulocytes","q":"Describe lymphocytes and their functions.","a":"Lymphocytes are only slightly larger than RBCs with a rounded nucleus; they secrete antibodies (B cells), destroy foreign or cancer cells (T cells), or secrete chemicals to enhance other immune cells (helper T cells)."},{"id":"s2x-c18-91","ch":18,"section":"Agranulocytes","q":"Describe monocytes and what they become.","a":"Monocytes are the largest formed elements, with variably-shaped nuclei and clear cytoplasm; they differentiate into macrophages that phagocytize foreign particles and debris and activate other immune cells."},{"id":"s2x-c18-92","ch":18,"section":"WBC Count Abnormalities","q":"What is leukopenia and what can cause it?","a":"Leukopenia is an abnormally low WBC count (below the normal 5,000–10,000 per mm3); it can result from toxic chemicals, drugs, or certain diseases."},{"id":"s2x-c18-93","ch":18,"section":"WBC Count Abnormalities","q":"What is leukocytosis and what does it indicate?","a":"Leukocytosis is an abnormally high WBC count; it indicates an infection, allergy, dehydration, or emotional disturbance."},{"id":"s2x-c18-94","ch":18,"section":"WBC Count Abnormalities","q":"What is leukemia?","a":"An extremely high WBC count."},{"id":"s2x-c18-95","ch":18,"section":"WBC Count Abnormalities","q":"What is a differential WBC count, and why is it useful?","a":"It identifies the relative abundance of each type of white cell; for example, a high neutrophil count indicates a bacterial infection (as in appendicitis), and numerous eosinophils indicate allergies or parasites."},{"id":"s2x-c18-96","ch":18,"section":"Lymphocytes","q":"What are the three classes of lymphocytes?","a":"T cells, B cells, and natural killer (NK) cells."},{"id":"s2x-c18-97","ch":18,"section":"Lymphocytes","q":"What do T cells do?","a":"They provide cell-mediated immunity, attacking foreign cells directly."},{"id":"s2x-c18-98","ch":18,"section":"Lymphocytes","q":"What do B cells do?","a":"They provide humoral immunity, differentiating into plasma cells that synthesize antibodies."},{"id":"s2x-c18-99","ch":18,"section":"Lymphocytes","q":"What do natural killer (NK) cells do?","a":"They detect and destroy abnormal tissue cells (cancers)."},{"id":"s2x-c18-100","ch":18,"section":"WBC Production","q":"From what cells do all blood cells originate?","a":"All blood cells originate from hemocytoblasts, which produce myeloid stem cells and lymphoid stem cells."},{"id":"s2x-c18-101","ch":18,"section":"WBC Production","q":"What do myeloid stem cells produce in WBC formation?","a":"They differentiate into progenitor cells, which produce all WBCs."},{"id":"s2x-c18-102","ch":18,"section":"WBC Production","q":"What is lymphopoiesis?","a":"The production of lymphocytes (from lymphoid stem cells)."},{"id":"s2x-c18-103","ch":18,"section":"WBC Production","q":"Where do WBCs develop, and which is the exception?","a":"WBCs develop fully in bone marrow, except monocytes, which develop into macrophages in peripheral tissues."},{"id":"s2x-c18-104","ch":18,"section":"WBC Regulation","q":"What are colony-stimulating factors (CSFs)?","a":"Hormones that regulate blood cell populations (WBC production)."},{"id":"s2x-c18-105","ch":18,"section":"WBC Regulation","q":"What does M-CSF stimulate?","a":"Monocyte production."},{"id":"s2x-c18-106","ch":18,"section":"WBC Regulation","q":"What does G-CSF stimulate?","a":"Granulocyte (neutrophil, eosinophil, and basophil) production."},{"id":"s2x-c18-107","ch":18,"section":"WBC Regulation","q":"What does GM-CSF stimulate?","a":"Granulocyte and monocyte production."},{"id":"s2x-c18-108","ch":18,"section":"WBC Regulation","q":"What does Multi-CSF accelerate?","a":"The production of granulocytes, monocytes, platelets, and RBCs."},{"id":"s2x-c18-109","ch":18,"section":"Platelets","q":"What are platelets, how long do they circulate, and where are they removed?","a":"Platelets are cell fragments involved in the clotting system; they circulate for 9–12 days and are removed by the spleen."},{"id":"s2x-c18-110","ch":18,"section":"Platelets","q":"What fraction of platelets is reserved for emergencies?","a":"Two-thirds (2/3)."},{"id":"s2x-c18-111","ch":18,"section":"Platelets","q":"What is the normal platelet count?","a":"150,000 to 500,000 per microliter."},{"id":"s2x-c18-112","ch":18,"section":"Platelets","q":"What are thrombocytopenia and thrombocytosis?","a":"Thrombocytopenia is an abnormally low platelet count; thrombocytosis is an abnormally high platelet count."},{"id":"s2x-c18-113","ch":18,"section":"Platelets","q":"What are the three functions of platelets?","a":"Release important clotting chemicals, temporarily patch damaged vessel walls, and actively contract tissue after clot formation."},{"id":"s2x-c18-114","ch":18,"section":"Platelet Production","q":"What is thrombocytopoiesis and where does it occur?","a":"It is platelet production, occurring in the bone marrow."},{"id":"s2x-c18-115","ch":18,"section":"Platelet Production","q":"What are megakaryocytes?","a":"Giant cells in the bone marrow that manufacture platelets from their cytoplasm."},{"id":"s2x-c18-116","ch":18,"section":"Platelet Production","q":"What hormones control platelet production?","a":"Thrombopoietin (TPO), Interleukin-6 (IL-6), and Multi-CSF."},{"id":"s2x-c18-117","ch":18,"section":"Hemostasis","q":"What is hemostasis, and what are its three phases?","a":"Hemostasis is the cessation of bleeding; its three phases are the vascular phase, the platelet phase, and the coagulation phase."},{"id":"s2x-c18-118","ch":18,"section":"Vascular Phase","q":"What triggers the prompt constriction of a broken vessel in the vascular phase?","a":"Nervous impulses (pain pathway), injury to the smooth muscle within the vessel wall, and serotonin (a vasoconstrictor) released from platelets."},{"id":"s2x-c18-119","ch":18,"section":"Vascular Phase","q":"What is the purpose of vascular spasm?","a":"It is maintained long enough for platelet plug formation and coagulation to take effect."},{"id":"s2x-c18-120","ch":18,"section":"Platelet Phase","q":"What causes platelets to stick to an injured vessel wall?","a":"When a vessel is injured, collagen fibers in its wall are exposed, causing platelets to stick to them."},{"id":"s2x-c18-121","ch":18,"section":"Platelet Phase","q":"How do platelets help draw a broken vessel together?","a":"They extend spiny pseudopods that adhere to the broken vessel; these contract and draw the walls of the vessel together."},{"id":"s2x-c18-122","ch":18,"section":"Platelet Phase","q":"What is a platelet plug and what can it accomplish?","a":"As more platelets join in, a platelet plug forms, which can stop minor bleeding."},{"id":"s2x-c18-123","ch":18,"section":"Platelet Phase","q":"What is degranulation in the platelet phase?","a":"As platelets aggregate they undergo degranulation, releasing substances that promote hemostasis."},{"id":"s2x-c18-124","ch":18,"section":"Coagulation Phase","q":"Why is coagulation described as the most effective yet most complex method of hemostasis?","a":"It is the most effective method of hemostasis but the most complex, involving over 30 chemical reactions."},{"id":"s2x-c18-125","ch":18,"section":"Coagulation Phase","q":"What is the objective of coagulation?","a":"To convert soluble fibrinogen into insoluble fibrin, so that blood cells and platelets get stuck in the fibrin net, stopping blood loss."},{"id":"s2x-c18-126","ch":18,"section":"Coagulation Phase","q":"What are the two reaction pathways of coagulation, and how is each initiated?","a":"The extrinsic mechanism, initiated by chemicals released from damaged tissue, and the intrinsic mechanism, initiated by factors (such as clots) within the vessel itself."},{"id":"s2x-c18-127","ch":18,"section":"Coagulation Phase","q":"What are clotting factors (procoagulants), where are they made, and how do they act?","a":"Clotting factors are called procoagulants, are produced in the liver, and normally circulate in the plasma in inactive form; one factor activates the next in a reaction cascade."},{"id":"s2x-c18-128","ch":18,"section":"Coagulation Phase","q":"How does the extrinsic mechanism initiate coagulation?","a":"Damaged tissue releases tissue thromboplastin, which, along with calcium ions, activates the next step; the cascade acts like an amplifying mechanism to ensure rapid clotting."},{"id":"s2x-c18-129","ch":18,"section":"Coagulation Phase","q":"After factor X is activated, what does it combine with to form prothrombin activator?","a":"Factor X combines with factors III and V (with calcium and PF3) to produce prothrombin activator."},{"id":"s2x-c18-130","ch":18,"section":"Coagulation Phase","q":"What does prothrombin activator do, and then what does thrombin do?","a":"Prothrombin activator converts prothrombin to thrombin, and thrombin then converts fibrinogen to fibrin."},{"id":"s2x-c18-131","ch":18,"section":"Coagulation Phase","q":"At what point do the extrinsic and intrinsic pathways become identical?","a":"Once factor X is activated, the sequence of events is the same for both mechanisms."},{"id":"s2x-c18-132","ch":18,"section":"Coagulation Phase","q":"How long should a finger stick normally take to stop bleeding, and how can it be accelerated?","a":"About 2–3 minutes; massaging the area to release more tissue thromboplastin should accelerate the process."},{"id":"s2x-c18-133","ch":18,"section":"Fate of Blood Clots","q":"What is clot retraction and when does it occur?","a":"Clot retraction occurs within 30 minutes after a clot forms; platelets and endothelial cells secrete a stimulant causing fibroblasts and smooth muscle cells to multiply and repair the vessel, and fibroblasts invade and strengthen the clot."},{"id":"s2x-c18-134","ch":18,"section":"Fate of Blood Clots","q":"What is fibrinolysis and what enzyme carries it out?","a":"Fibrinolysis is the dissolving of a clot once tissue repair is complete; it involves a cascade of reactions ending in the production of plasmin, a fibrin-dissolving enzyme."},{"id":"s2x-c19-1","ch":19,"section":"CV overview","q":"What three components make up the cardiovascular system?","a":"The heart, the blood vessels, and the approximately 5 liters of blood that the vessels transport."},{"id":"s2x-c19-2","ch":19,"section":"CV overview","q":"What substances does the cardiovascular system transport throughout the body?","a":"Oxygen, nutrients, hormones, and cellular waste products."},{"id":"s2x-c19-3","ch":19,"section":"CV overview","q":"Which organ powers the cardiovascular system, and how is it described?","a":"The heart, described as the body's hardest-working organ."},{"id":"s2x-c19-4","ch":19,"section":"Circuits","q":"What does the pulmonary circuit do?","a":"Carries blood to and from the gas exchange surfaces of the lungs."},{"id":"s2x-c19-5","ch":19,"section":"Circuits","q":"What does the systemic circuit do?","a":"Carries blood to and from the body."},{"id":"s2x-c19-6","ch":19,"section":"Circuits","q":"How does blood move between the two circuits?","a":"Blood alternates between the pulmonary circuit and the systemic circuit."},{"id":"s2x-c19-7","ch":19,"section":"Blood vessels","q":"What are the three types of blood vessels?","a":"Arteries, veins, and capillaries."},{"id":"s2x-c19-8","ch":19,"section":"Blood vessels","q":"What is the function of arteries?","a":"They carry blood away from the heart."},{"id":"s2x-c19-9","ch":19,"section":"Blood vessels","q":"What is the function of veins?","a":"They carry blood to the heart."},{"id":"s2x-c19-10","ch":19,"section":"Blood vessels","q":"What are capillaries?","a":"Networks of vessels between arteries and veins."},{"id":"s2x-c19-11","ch":19,"section":"Blood vessels","q":"Why are capillaries called exchange vessels?","a":"They exchange materials between the blood and tissues, including dissolved gases, nutrients, and wastes."},{"id":"s2x-c19-12","ch":19,"section":"Heart chambers","q":"What are the four chambers of the heart?","a":"The right atrium, right ventricle, left atrium, and left ventricle."},{"id":"s2x-c19-13","ch":19,"section":"Heart chambers","q":"What does the right atrium do?","a":"Collects blood from the systemic circuit."},{"id":"s2x-c19-14","ch":19,"section":"Heart chambers","q":"What does the right ventricle do?","a":"Pumps blood to the pulmonary circuit."},{"id":"s2x-c19-15","ch":19,"section":"Heart chambers","q":"What does the left atrium do?","a":"Collects blood from the pulmonary circuit."},{"id":"s2x-c19-16","ch":19,"section":"Heart chambers","q":"What does the left ventricle do?","a":"Pumps blood to the systemic circuit."},{"id":"s2x-c19-17","ch":19,"section":"Heart anatomy","q":"What is found at the base of the heart, and what is the pointed tip called?","a":"The great veins and arteries are at the base; the pointed tip is the apex."},{"id":"s2x-c19-18","ch":19,"section":"Heart anatomy","q":"Where does the heart sit in the thoracic cavity?","a":"Surrounded by the pericardial sac, between the two pleural cavities, in the mediastinum."},{"id":"s2x-c19-19","ch":19,"section":"Pericardium","q":"What is the pericardium?","a":"The double lining of the pericardial cavity."},{"id":"s2x-c19-20","ch":19,"section":"Pericardium","q":"What is the parietal pericardium?","a":"The outer layer of the pericardium, which forms the inner layer of the pericardial sac."},{"id":"s2x-c19-21","ch":19,"section":"Pericardium","q":"What is the visceral pericardium?","a":"The inner layer of the pericardium (also called the epicardium, covering the heart)."},{"id":"s2x-c19-22","ch":19,"section":"Pericardium","q":"What is the pericardial cavity and what does it contain?","a":"The space between the parietal and visceral layers; it contains pericardial fluid."},{"id":"s2x-c19-23","ch":19,"section":"Pericardium","q":"What is the pericardial sac?","a":"Fibrous tissue that surrounds and stabilizes the heart."},{"id":"s2x-c19-24","ch":19,"section":"Superficial anatomy","q":"Describe the atria and their outer appendage.","a":"The atria are thin-walled and have an expandable outer auricle (atrial appendage)."},{"id":"s2x-c19-25","ch":19,"section":"Superficial anatomy","q":"What is the coronary sulcus?","a":"A sulcus that divides the atria from the ventricles."},{"id":"s2x-c19-26","ch":19,"section":"Superficial anatomy","q":"What do the anterior and posterior interventricular sulci do?","a":"They separate the left and right ventricles and contain the blood vessels of the cardiac muscle."},{"id":"s2x-c19-27","ch":19,"section":"Heart wall","q":"What are the three layers of the heart wall?","a":"The epicardium (outer), myocardium (middle), and endocardium (inner)."},{"id":"s2x-c19-28","ch":19,"section":"Heart wall","q":"What is the epicardium?","a":"The outer layer of the heart wall; it is the visceral pericardium and covers the heart."},{"id":"s2x-c19-29","ch":19,"section":"Heart wall","q":"What is the myocardium, and what is it made of?","a":"The muscular wall of the heart, made of concentric layers of cardiac muscle tissue."},{"id":"s2x-c19-30","ch":19,"section":"Heart wall","q":"What does the atrial myocardium wrap around, and how many divisions does the ventricular myocardium have?","a":"The atrial myocardium wraps around the great vessels; the ventricular myocardium has two divisions."},{"id":"s2x-c19-31","ch":19,"section":"Heart wall","q":"What tissue type makes up the endocardium?","a":"Simple squamous epithelium."},{"id":"s2x-c19-32","ch":19,"section":"Cardiac muscle tissue","q":"What are intercalated discs, and what secures/links the cells there?","a":"Structures that interconnect cardiac muscle cells; desmosomes secure them mechanically and gap junctions link them electrically."},{"id":"s2x-c19-33","ch":19,"section":"Cardiac muscle tissue","q":"What is the function of intercalated discs?","a":"They convey the force of contraction and propagate action potentials between cells."},{"id":"s2x-c19-34","ch":19,"section":"Cardiac muscle tissue","q":"What are the key characteristics of cardiac muscle cells?","a":"Small size, a single central nucleus, and branching interconnections between cells via intercalated discs."},{"id":"s2x-c19-35","ch":19,"section":"Internal anatomy","q":"What is the interatrial septum?","a":"The wall that separates the two atria."},{"id":"s2x-c19-36","ch":19,"section":"Internal anatomy","q":"What is the interventricular septum?","a":"The wall that separates the two ventricles."},{"id":"s2x-c19-37","ch":19,"section":"AV valves","q":"What do atrioventricular (AV) valves connect?","a":"The right atrium to the right ventricle, and the left atrium to the left ventricle."},{"id":"s2x-c19-38","ch":19,"section":"AV valves","q":"What are the AV valves made of and how many cusps do they have?","a":"Fibrous flaps forming the bicuspid (2-cusp) and tricuspid (3-cusp) valves."},{"id":"s2x-c19-39","ch":19,"section":"AV valves","q":"In what direction do AV valves permit blood flow?","a":"One direction only: from the atria to the ventricles."},{"id":"s2x-c19-40","ch":19,"section":"Right atrium","q":"What does the superior vena cava drain?","a":"Blood from the head, neck, upper limbs, and chest."},{"id":"s2x-c19-41","ch":19,"section":"Right atrium","q":"What does the inferior vena cava drain?","a":"Blood from the trunk, viscera, and lower limbs."},{"id":"s2x-c19-42","ch":19,"section":"Right atrium","q":"What is the coronary sinus and where does it open?","a":"The vessel into which the cardiac veins return blood; it opens into the right atrium."},{"id":"s2x-c19-43","ch":19,"section":"Right atrium","q":"What is the foramen ovale before birth?","a":"An opening through the interatrial septum that connects the two atria."},{"id":"s2x-c19-44","ch":19,"section":"Right atrium","q":"What happens to the foramen ovale at birth?","a":"It seals off, forming the fossa ovalis."},{"id":"s2x-c19-45","ch":19,"section":"Right atrium","q":"What are pectinate muscles and where are they found?","a":"Prominent muscular ridges on the anterior atrial wall and the inner surfaces of the right auricle."},{"id":"s2x-c19-46","ch":19,"section":"Right ventricle","q":"What are chordae tendineae and what do they attach to?","a":"Fibrous cords whose free edges attach to the papillary muscles of the ventricle; they prevent the valve from opening backward."},{"id":"s2x-c19-47","ch":19,"section":"Right ventricle","q":"What is the other name for the right AV valve, and how many cusps does it have?","a":"The tricuspid valve; it has three cusps that prevent backflow (from right atrium to right ventricle)."},{"id":"s2x-c19-48","ch":19,"section":"Right ventricle","q":"What are trabeculae carneae?","a":"Muscular ridges on the internal surface of the right (and left) ventricle."},{"id":"s2x-c19-49","ch":19,"section":"Right ventricle","q":"What is the moderator band and what does it contain?","a":"A ridge that contains part of the conducting system, which coordinates contractions of cardiac muscle cells."},{"id":"s2x-c19-50","ch":19,"section":"Pulmonary circuit","q":"What is the conus arteriosus and where does it lead?","a":"The superior end of the right ventricle; it leads to the pulmonary trunk."},{"id":"s2x-c19-51","ch":19,"section":"Pulmonary circuit","q":"What does the pulmonary trunk divide into?","a":"The left and right pulmonary arteries."},{"id":"s2x-c19-52","ch":19,"section":"Pulmonary circuit","q":"Through which valve does blood flow from the right ventricle to the pulmonary trunk, and how many cusps does it have?","a":"The pulmonary valve, which has three semilunar cusps."},{"id":"s2x-c19-53","ch":19,"section":"Left atrium","q":"How does blood reach the left atrium?","a":"Blood gathers into the left and right pulmonary veins, which deliver it to the left atrium."},{"id":"s2x-c19-54","ch":19,"section":"Left atrium","q":"What are the two names for the left AV valve, and how many cusps does it have?","a":"The bicuspid valve or mitral valve; it has two cusps."},{"id":"s2x-c19-55","ch":19,"section":"Left ventricle","q":"How does the left ventricle compare to the right ventricle in volume and muscle?","a":"It holds the same volume, but is larger with thicker, more powerful muscle."},{"id":"s2x-c19-56","ch":19,"section":"Left ventricle","q":"How is the left ventricle similar to and different from the right ventricle internally?","a":"It is similar internally but does not have a moderator band."},{"id":"s2x-c19-57","ch":19,"section":"Systemic circulation","q":"Through which valve does blood leave the left ventricle, and where does it go?","a":"Through the aortic valve into the ascending aorta."},{"id":"s2x-c19-58","ch":19,"section":"Systemic circulation","q":"What is the path of the aorta from the ascending aorta?","a":"The ascending aorta turns (aortic arch) and becomes the descending aorta."},{"id":"s2x-c19-59","ch":19,"section":"Ventricle comparison","q":"How does the right ventricle wall compare to the left in thickness and pressure?","a":"The right ventricle wall is thinner and develops less pressure than the left ventricle."},{"id":"s2x-c19-60","ch":19,"section":"Ventricle comparison","q":"Compare the shapes of the right and left ventricles.","a":"The right ventricle is pouch-shaped; the left ventricle is round."},{"id":"s2x-c19-61","ch":19,"section":"Heart valves","q":"What is the overall function of the two pairs of one-way heart valves?","a":"They prevent backflow of blood during contraction."},{"id":"s2x-c19-62","ch":19,"section":"Heart valves","q":"How are the AV valves closed during ventricular contraction?","a":"Blood pressure closes the valve cusps during ventricular contraction."},{"id":"s2x-c19-63","ch":19,"section":"Heart valves","q":"What is the role of the papillary muscles and chordae tendineae during contraction?","a":"Papillary muscles tense the chordae tendineae to prevent the valves from swinging into the atria."},{"id":"s2x-c19-64","ch":19,"section":"Semilunar valves","q":"What are the two semilunar valves?","a":"The pulmonary valve and the aortic valve."},{"id":"s2x-c19-65","ch":19,"section":"Semilunar valves","q":"What do the semilunar valves prevent?","a":"Backflow from the pulmonary trunk and aorta into the ventricles."},{"id":"s2x-c19-66","ch":19,"section":"Semilunar valves","q":"How are semilunar valves supported, given they have no muscular support?","a":"They have three cusps that support each other like a tripod."},{"id":"s2x-c19-67","ch":19,"section":"Aortic sinuses","q":"Where are the aortic sinuses located and what is their function?","a":"At the base of the ascending aorta; they are sacs that prevent the valve cusps from sticking to the aorta."},{"id":"s2x-c19-68","ch":19,"section":"Aortic sinuses","q":"What originates at the aortic sinuses?","a":"The right and left coronary arteries."},{"id":"s2x-c19-69","ch":19,"section":"Cardiac skeleton","q":"What is the general role of the connective tissues (cardiac/fibrous skeleton) of the heart?","a":"They physically support the cardiac muscle fibers."},{"id":"s2x-c19-70","ch":19,"section":"Cardiac skeleton","q":"What functions do the connective tissues of the heart perform?","a":"Distribute forces of contraction, add strength, prevent overexpansion, and (via elastic fibers) return the heart to its original shape after contraction."},{"id":"s2x-c19-71","ch":19,"section":"Cardiac skeleton","q":"Describe the structure of the cardiac (fibrous) skeleton.","a":"Four bands around the heart valves and the bases of the pulmonary trunk and aorta."},{"id":"s2x-c19-72","ch":19,"section":"Cardiac skeleton","q":"What are the functions of the four fibrous bands of the cardiac skeleton?","a":"They stabilize the valves and electrically insulate the ventricular cells from the atrial cells."},{"id":"s2x-c19-73","ch":19,"section":"Coronary circulation","q":"What vessels supply blood to the muscle tissue of the heart?","a":"The coronary arteries and cardiac veins."},{"id":"s2x-c19-74","ch":19,"section":"Coronary circulation","q":"Where do the coronary arteries originate?","a":"At the aortic sinuses."},{"id":"s2x-c19-75","ch":19,"section":"Coronary circulation","q":"How is blood forced through the coronary arteries between contractions?","a":"High blood pressure and elastic rebound force blood through the coronary arteries between contractions."},{"id":"s2x-c19-76","ch":19,"section":"Coronary arteries","q":"What regions does the right coronary artery supply?","a":"The right atrium, portions of both ventricles, and the cells of the SA and AV nodes."},{"id":"s2x-c19-77","ch":19,"section":"Coronary arteries","q":"What are two branches of the right coronary artery?","a":"The marginal arteries (surface of the right ventricle) and the posterior interventricular artery."},{"id":"s2x-c19-78","ch":19,"section":"Coronary arteries","q":"What regions does the left coronary artery supply?","a":"The left ventricle, left atrium, and interventricular septum."},{"id":"s2x-c19-79","ch":19,"section":"Coronary arteries","q":"What are the two main branches of the left coronary artery?","a":"The circumflex artery and the anterior interventricular artery."},{"id":"s2x-c19-80","ch":19,"section":"Coronary arteries","q":"What is the function of arterial anastomoses in the heart?","a":"They interconnect the anterior and posterior interventricular arteries to stabilize the blood supply to the cardiac muscle."},{"id":"s2x-c19-81","ch":19,"section":"Cardiac veins","q":"What does the great cardiac vein drain, and where does it empty?","a":"It drains blood from the area of the anterior interventricular artery into the coronary sinus."},{"id":"s2x-c19-82","ch":19,"section":"Cardiac veins","q":"Where do the anterior cardiac veins empty?","a":"Into the right atrium."},{"id":"s2x-c19-83","ch":19,"section":"Cardiac veins","q":"Where do the posterior, middle, and small cardiac veins empty?","a":"Into the great cardiac vein or the coronary sinus."},{"id":"s2x-c19-84","ch":19,"section":"Conducting system","q":"What is a heartbeat?","a":"A single contraction of the heart."},{"id":"s2x-c19-85","ch":19,"section":"Conducting system","q":"In what order do the chambers of the heart contract?","a":"First the atria, then the ventricles (the entire heart contracts in series)."},{"id":"s2x-c19-86","ch":19,"section":"Conducting system","q":"What are the two types of cardiac muscle cells and their roles?","a":"Conducting system cells, which control and coordinate the heartbeat, and contractile cells, which produce the contractions that propel blood."},{"id":"s2x-c19-87","ch":19,"section":"Cardiac cycle","q":"Where and how does the cardiac cycle begin?","a":"It begins with an action potential at the SA node, transmitted through the conducting system, producing action potentials in the contractile cardiac muscle cells."},{"id":"s2x-c19-88","ch":19,"section":"Conducting system","q":"What does the specialized system of cardiac muscle cells do?","a":"It initiates and distributes the electrical impulses that stimulate contraction."},{"id":"s2x-c19-89","ch":19,"section":"ECG","q":"What is an electrocardiogram (ECG)?","a":"A recording of the electrical events in the cardiac cycle."},{"id":"s2x-c19-90","ch":19,"section":"Automaticity","q":"What is automaticity?","a":"The property by which cardiac muscle tissue contracts automatically, without external stimulation."},{"id":"s2x-c19-91","ch":19,"section":"Conducting structures","q":"Where is the sinoatrial (SA) node located?","a":"In the wall of the right atrium (posterior wall)."},{"id":"s2x-c19-92","ch":19,"section":"Conducting structures","q":"Where is the atrioventricular (AV) node located?","a":"At the junction between the atria and ventricles (floor of the right atrium)."},{"id":"s2x-c19-93","ch":19,"section":"Conducting structures","q":"Where are conducting cells found and what do they do?","a":"Throughout the myocardium; they interconnect the SA and AV nodes and distribute the stimulus through the atrial myocardium."},{"id":"s2x-c19-94","ch":19,"section":"Conducting structures","q":"What are the internodal pathways, and how does the impulse travel in the ventricles?","a":"The internodal pathways are conducting pathways in the atria; in the ventricles the impulse travels via the AV bundle and the bundle branches."},{"id":"s2x-c19-95","ch":19,"section":"Prepotential","q":"What is the prepotential (pacemaker potential)?","a":"The resting potential of conducting cells that gradually depolarizes toward threshold."},{"id":"s2x-c19-96","ch":19,"section":"Prepotential","q":"Which structure depolarizes first, and what does that establish?","a":"The SA node depolarizes first, establishing the heart rate."},{"id":"s2x-c19-97","ch":19,"section":"Heart rate","q":"How many action potentials per minute does the SA node generate?","a":"80 to 100 action potentials per minute."},{"id":"s2x-c19-98","ch":19,"section":"Heart rate","q":"How many action potentials per minute does the AV node generate?","a":"40 to 60 action potentials per minute."},{"id":"s2x-c19-99","ch":19,"section":"Heart rate","q":"What effect does parasympathetic stimulation have on heart rate?","a":"It slows the heart rate."},{"id":"s2x-c19-100","ch":19,"section":"SA node","q":"Where is the SA node located and what cells does it contain?","a":"In the posterior wall of the right atrium; it contains pacemaker cells."},{"id":"s2x-c19-101","ch":19,"section":"SA node","q":"What is Step 1 of impulse conduction, performed by the SA node?","a":"The SA node begins atrial activation (it is connected to the AV node by internodal pathways)."},{"id":"s2x-c19-102","ch":19,"section":"AV node","q":"What is the AV node's Step 2 role?","a":"Located in the floor of the right atrium, it receives the impulse from the SA node."},{"id":"s2x-c19-103","ch":19,"section":"AV node","q":"What is Step 3 at the AV node?","a":"The AV node delays the impulse, and atrial contraction begins."},{"id":"s2x-c19-104","ch":19,"section":"AV bundle","q":"What does the AV bundle do (Step 4)?","a":"Located in the septum, it carries the impulse to the left and right bundle branches, which conduct to the Purkinje fibers, and to the moderator band, which conducts to the papillary muscles."},{"id":"s2x-c19-105","ch":19,"section":"Purkinje fibers","q":"What do the Purkinje fibers do (Step 5)?","a":"They distribute the impulse through the ventricles; atrial contraction is completed and ventricular contraction begins."},{"id":"s2x-c19-106","ch":19,"section":"Abnormal pacemaker","q":"What is bradycardia?","a":"An abnormally slow heart rate."},{"id":"s2x-c19-107","ch":19,"section":"Abnormal pacemaker","q":"What is tachycardia?","a":"An abnormally fast heart rate."},{"id":"s2x-c19-108","ch":19,"section":"Abnormal pacemaker","q":"What is an ectopic pacemaker?","a":"Abnormal cells that generate a high rate of action potentials, bypass the conducting system, and disrupt ventricular contractions."},{"id":"s2x-c19-109","ch":19,"section":"ECG","q":"How is an ECG (EKG) obtained, and what is its diagnostic use?","a":"It is obtained by electrodes at specific body locations; abnormal patterns help diagnose heart damage."},{"id":"s2x-c19-110","ch":19,"section":"ECG waves","q":"What does the P wave represent?","a":"Atrial depolarization."},{"id":"s2x-c19-111","ch":19,"section":"ECG waves","q":"What does the QRS complex represent?","a":"Ventricular depolarization."},{"id":"s2x-c19-112","ch":19,"section":"ECG waves","q":"What does the T wave represent?","a":"Ventricular repolarization."},{"id":"s2x-c19-113","ch":19,"section":"ECG intervals","q":"What does the P–R interval measure?","a":"From the start of atrial depolarization to the start of the QRS complex."},{"id":"s2x-c19-114","ch":19,"section":"ECG intervals","q":"What does the Q–T interval measure?","a":"From ventricular depolarization to ventricular repolarization."},{"id":"s2x-c19-115","ch":19,"section":"Contractile cells","q":"What distributes the stimulus to the contractile cells, and what fraction of heart muscle do they make up?","a":"Purkinje fibers distribute the stimulus; contractile cells make up most of the muscle cells in the heart."},{"id":"s2x-c19-116","ch":19,"section":"Contractile cells","q":"What is the resting potential of a ventricular contractile cell?","a":"About –90 mV."},{"id":"s2x-c19-117","ch":19,"section":"Contractile cells","q":"What is the resting potential of an atrial cell?","a":"About –80 mV."},{"id":"s2x-c19-118","ch":19,"section":"Refractory period","q":"What happens during the absolute refractory period?","a":"It is long, and cardiac muscle cells cannot respond to any stimulus."},{"id":"s2x-c19-119","ch":19,"section":"Refractory period","q":"What happens during the relative refractory period?","a":"It is short, and the response depends on the degree of the stimulus."},{"id":"s2x-c19-120","ch":19,"section":"Refractory period","q":"How long is the cardiac action potential in a ventricular cell?","a":"About 250–300 milliseconds, roughly 30 times longer than a skeletal muscle fiber's."},{"id":"s2x-c19-121","ch":19,"section":"Refractory period","q":"Why is the long refractory period important?","a":"It prevents summation and tetany in cardiac muscle."},{"id":"s2x-c19-122","ch":19,"section":"Calcium in contraction","q":"What produces contraction of a cardiac muscle cell?","a":"An increase in calcium ion concentration around the myofibrils."},{"id":"s2x-c19-123","ch":19,"section":"Calcium in contraction","q":"What percentage of the calcium ions needed for contraction enters from outside the cell?","a":"About 20% (the extracellular calcium)."},{"id":"s2x-c19-124","ch":19,"section":"Calcium in contraction","q":"During which phase do calcium ions enter across the plasma membrane?","a":"During the plateau phase."},{"id":"s2x-c19-125","ch":19,"section":"Calcium in contraction","q":"What does the arrival of extracellular Ca2+ trigger?","a":"The release of calcium ion reserves from the sarcoplasmic reticulum."},{"id":"s2x-c19-126","ch":19,"section":"Calcium in contraction","q":"What happens to intracellular Ca2+ as the slow calcium channels close?","a":"It is absorbed by the SR or pumped out of the cell."},{"id":"s2x-c19-127","ch":19,"section":"Calcium in contraction","q":"To what is cardiac muscle tissue very sensitive?","a":"Extracellular Ca2+ concentrations."},{"id":"s2x-c19-128","ch":19,"section":"Cardiac energy","q":"How does the heart obtain energy for contraction?","a":"Through aerobic metabolism, from mitochondrial breakdown of fatty acids and glucose."},{"id":"s2x-c19-129","ch":19,"section":"Cardiac energy","q":"Where does the heart get oxygen, and how does it store it?","a":"Oxygen comes from circulating hemoglobin, and cardiac muscle stores oxygen in myoglobin."},{"id":"s2x-c19-130","ch":19,"section":"Cardiac cycle","q":"What is the cardiac cycle?","a":"The period between the start of one heartbeat and the beginning of the next, including both contraction and relaxation."},{"id":"s2x-c19-131","ch":19,"section":"Cardiac cycle","q":"What is systole?","a":"Contraction of a heart chamber."},{"id":"s2x-c19-132","ch":19,"section":"Cardiac cycle","q":"What is diastole?","a":"Relaxation of a heart chamber."},{"id":"s2x-c19-133","ch":19,"section":"Cardiac cycle","q":"How does blood pressure in a chamber change during systole and diastole?","a":"It rises during systole and falls during diastole."},{"id":"s2x-c19-134","ch":19,"section":"Cardiac cycle","q":"What determines the direction of blood flow in the heart?","a":"Blood flows from high to low pressure, controlled by the timing of contractions and directed by one-way valves."},{"id":"s2x-c19-135","ch":19,"section":"Cardiac cycle","q":"At a heart rate of 75 beats per minute, how long does the cardiac cycle last?","a":"About 800 milliseconds."},{"id":"s2x-c19-136","ch":19,"section":"Cardiac cycle","q":"When heart rate increases, which phase of the cardiac cycle shortens the most?","a":"All phases shorten, but diastole shortens particularly."},{"id":"s2x-c19-137","ch":19,"section":"Cardiac cycle steps","q":"What happens at the start of atrial systole?","a":"Atrial contraction begins and the right and left AV valves are open."},{"id":"s2x-c19-138","ch":19,"section":"Cardiac cycle steps","q":"What do the atria do during atrial systole?","a":"They eject blood into the ventricles, filling them."},{"id":"s2x-c19-139","ch":19,"section":"Cardiac cycle steps","q":"What happens as atrial systole ends?","a":"The AV valves close, and the ventricles contain their maximum blood volume, known as the end-diastolic volume (EDV)."},{"id":"s2x-c19-140","ch":19,"section":"Cardiac cycle steps","q":"What is end-diastolic volume (EDV)?","a":"The maximum blood volume in the ventricles at the end of atrial systole (before ventricular contraction)."},{"id":"s2x-c19-141","ch":19,"section":"Cardiac cycle steps","q":"What happens at the beginning of ventricular systole?","a":"Isovolumetric ventricular contraction: pressure in the ventricles rises and the AV valves are shut."},{"id":"s2x-c19-142","ch":19,"section":"Cardiac cycle steps","q":"What happens during ventricular ejection?","a":"The semilunar valves open and blood flows into the pulmonary and aortic trunks."},{"id":"s2x-c19-143","ch":19,"section":"Cardiac cycle steps","q":"Stroke volume equals what percentage of end-diastolic volume?","a":"About 60% of the end-diastolic volume."},{"id":"s2x-c19-144","ch":19,"section":"Cardiac cycle steps","q":"What happens as ventricular pressure falls after ejection?","a":"The semilunar valves close, and the ventricles contain the end-systolic volume (ESV)."},{"id":"s2x-c19-145","ch":19,"section":"Cardiac cycle steps","q":"What percentage of end-diastolic volume is the end-systolic volume (ESV)?","a":"About 40% of the end-diastolic volume."},{"id":"s2x-c19-146","ch":19,"section":"Cardiac cycle steps","q":"During ventricular diastole (isovolumetric relaxation), what is the pressure relationship and valve status?","a":"Ventricular pressure is higher than atrial pressure and all heart valves are closed."},{"id":"s2x-c19-147","ch":19,"section":"Cardiac cycle steps","q":"What happens once atrial pressure exceeds ventricular pressure?","a":"The AV valves open, allowing passive atrial and ventricular filling, and the cardiac cycle ends."},{"id":"s2x-c19-148","ch":19,"section":"Heart sounds","q":"What produces the first heart sound (S1)?","a":"The AV valves; S1 is a loud sound."},{"id":"s2x-c19-149","ch":19,"section":"Heart sounds","q":"What produces the second heart sound (S2)?","a":"The semilunar valves; S2 is a loud sound."},{"id":"s2x-c19-150","ch":19,"section":"Heart sounds","q":"What produces the S3 and S4 heart sounds?","a":"Soft sounds from blood flow into the ventricles (S3) and atrial contraction (S4)."},{"id":"s2x-c19-151","ch":19,"section":"Heart sounds","q":"What is a heart murmur?","a":"A sound produced by regurgitation of blood through the valves."},{"id":"s2x-c19-152","ch":19,"section":"Cardiodynamics","q":"What is cardiodynamics?","a":"The movement and force generated by cardiac contractions."},{"id":"s2x-c19-153","ch":19,"section":"Cardiodynamics","q":"How is stroke volume (SV) calculated?","a":"SV = EDV – ESV (end-diastolic volume minus end-systolic volume)."},{"id":"s2x-c19-154","ch":19,"section":"Cardiodynamics","q":"What is cardiac output (CO)?","a":"The volume of blood pumped by the left ventricle in one minute."},{"id":"s2x-c19-155","ch":19,"section":"Cardiodynamics","q":"What is the formula for cardiac output?","a":"CO = HR × SV, where HR is heart rate (beats/min) and SV is stroke volume (mL/beat), giving CO in mL/min."},{"id":"s2x-c19-156","ch":19,"section":"Cardiodynamics","q":"By what two variables can cardiac output be adjusted?","a":"By changes in heart rate or stroke volume."},{"id":"s2x-c19-157","ch":19,"section":"Cardiodynamics","q":"How is heart rate adjusted?","a":"By the autonomic nervous system or hormones."},{"id":"s2x-c19-158","ch":19,"section":"Cardiodynamics","q":"How is stroke volume adjusted?","a":"By changing the EDV or the ESV."},{"id":"s2x-c19-159","ch":19,"section":"Heart rate control","q":"What are the cardiac plexuses?","a":"Autonomic nerve networks that innervate the heart."},{"id":"s2x-c19-160","ch":19,"section":"Heart rate control","q":"What do the vagus nerves (cranial nerve X) carry to the heart?","a":"Parasympathetic preganglionic fibers to small ganglia in the cardiac plexus."},{"id":"s2x-c19-161","ch":19,"section":"Heart rate control","q":"Where are the cardiac centers located?","a":"In the medulla oblongata."},{"id":"s2x-c19-162","ch":19,"section":"Heart rate control","q":"What does the cardioacceleratory center do?","a":"It controls sympathetic neurons and increases heart rate."},{"id":"s2x-c19-163","ch":19,"section":"Heart rate control","q":"What does the cardioinhibitory center do?","a":"It controls parasympathetic neurons and slows heart rate."},{"id":"s2x-c19-164","ch":19,"section":"Heart rate control","q":"What do baroreceptors monitor for the cardiac centers?","a":"Blood pressure."},{"id":"s2x-c19-165","ch":19,"section":"Heart rate control","q":"What do chemoreceptors monitor for the cardiac centers?","a":"Arterial oxygen and carbon dioxide levels."},{"id":"s2x-c19-166","ch":19,"section":"Heart rate control","q":"What is autonomic tone in the heart?","a":"The dual innervation that maintains resting tone by releasing acetylcholine (ACh) and norepinephrine (NE)."},{"id":"s2x-c19-167","ch":19,"section":"Cardiac reserve","q":"What is cardiac reserve?","a":"The difference between resting and maximal cardiac output."},{"id":"s2x-c19-168","ch":19,"section":"CV regulation","q":"What is the purpose of cardiovascular regulation?","a":"To ensure adequate circulation to the body tissues."},{"id":"s2x-c19-169","ch":19,"section":"CV regulation","q":"What do the cardiovascular centers control?","a":"The heart and the peripheral blood vessels."},{"id":"s2x-c19-170","ch":19,"section":"CV regulation","q":"To what does the cardiovascular system respond?","a":"Changing activity patterns and circulatory emergencies."},{"id":"s2x-c20-1","ch":20,"section":"Vessel classes","q":"What are the six main classes of blood vessels?","a":"Arteries, arterioles, capillaries, venules, veins, and anastomoses."},{"id":"s2x-c20-2","ch":20,"section":"Vessel classes","q":"What do arteries do, and how do they change as they branch?","a":"They carry blood away from the heart; as they branch they decrease in diameter."},{"id":"s2x-c20-3","ch":20,"section":"Vessel classes","q":"What are arterioles?","a":"The smallest arterial branches; they connect arteries to capillaries."},{"id":"s2x-c20-4","ch":20,"section":"Vessel classes","q":"What are capillaries and what happens in them?","a":"Tiny vessels where diffusion occurs between the blood and the interstitial fluid."},{"id":"s2x-c20-5","ch":20,"section":"Vessel classes","q":"What are venules?","a":"The smallest veins; they collect blood from (connect to) capillaries."},{"id":"s2x-c20-6","ch":20,"section":"Vessel classes","q":"What do veins do, and how do they change as they converge?","a":"They return blood to the heart; as they converge they increase in diameter."},{"id":"s2x-c20-7","ch":20,"section":"Vessel classes","q":"What are anastomoses?","a":"Bypass connections between vessels."},{"id":"s2x-c20-8","ch":20,"section":"Wall structure","q":"What are the three tunics of a blood vessel wall, from inner to outer?","a":"Tunica intima (interna), tunica media, and tunica externa (adventitia)."},{"id":"s2x-c20-9","ch":20,"section":"Wall structure","q":"What is the tunica intima and what does it contain?","a":"The innermost layer; endothelial cells with a basal lamina of loose connective tissue containing elastic fibers (elastin)."},{"id":"s2x-c20-10","ch":20,"section":"Wall structure","q":"What is the endothelium?","a":"Simple squamous epithelial-like cells connected by tight junctions that line the tunica intima."},{"id":"s2x-c20-11","ch":20,"section":"Wall structure","q":"What is the internal elastic membrane and where is it found?","a":"An extra layer of elastic fibers at the outer edge of the tunica intima, found in arteries."},{"id":"s2x-c20-12","ch":20,"section":"Wall structure","q":"What is the tunica media and what does it contain?","a":"The middle layer; smooth muscle cells in loose connective tissue with sheets of elastin."},{"id":"s2x-c20-13","ch":20,"section":"Wall structure","q":"What is the external elastic membrane and where is it found?","a":"An extra layer of elastic fibers at the outer edge of the tunica media, found in arteries."},{"id":"s2x-c20-14","ch":20,"section":"Wall structure","q":"What is the tunica externa and what does it contain?","a":"The outermost layer; a collagen-rich external connective tissue sheath infiltrated with nerve fibers and lymphatic vessels."},{"id":"s2x-c20-15","ch":20,"section":"Wall structure","q":"What is the vasa vasorum and where is it found?","a":"Small 'vessels of the vessels' within the tunica externa of large vessels that supply blood to the vessel wall itself."},{"id":"s2x-c20-16","ch":20,"section":"Wall structure","q":"How does the tunica externa differ between arteries and veins?","a":"In arteries it has more collagen and scattered elastic fiber bands; in veins it has extensive elastic fiber networks and bundles of smooth muscle cells."},{"id":"s2x-c20-17","ch":20,"section":"Wall structure","q":"What is the relationship of blood vessels to the lymphatic system in the vessel wall?","a":"The tunica externa is infiltrated with nerve fibers and lymphatic vessels, linking the blood vessel to the lymphatic system."},{"id":"s2x-c20-18","ch":20,"section":"Arteries vs. Veins","q":"How do artery and vein wall thickness compare?","a":"Arteries have thicker walls; veins have thinner walls."},{"id":"s2x-c20-19","ch":20,"section":"Arteries vs. Veins","q":"How does the tunica media compare between arteries and veins?","a":"Arteries have more elastin and smooth muscle in the tunica media; veins have less."},{"id":"s2x-c20-20","ch":20,"section":"Arteries vs. Veins","q":"Which tunic is thickest in arteries versus veins?","a":"In arteries the thickest tunic is the tunica media; in veins the thickest is the tunica externa."},{"id":"s2x-c20-21","ch":20,"section":"Arteries vs. Veins","q":"How do artery and vein walls behave with respect to recoil and the lumen?","a":"Artery walls are elastic and recoil, constricting the lumen without blood pressure; veins have an open lumen with no recoil."},{"id":"s2x-c20-22","ch":20,"section":"Arteries vs. Veins","q":"How do arteries and veins appear in cross section?","a":"Arteries are circular in cross section; veins collapse flat."},{"id":"s2x-c20-23","ch":20,"section":"Arteries vs. Veins","q":"Which vessel type has valves, and what are they?","a":"Veins have valves (flaps of tunica intima that prevent backflow); arteries have no valves."},{"id":"s2x-c20-24","ch":20,"section":"Arteries vs. Veins","q":"How does the endothelium differ between arteries and veins?","a":"Arteries have a pleated endothelium; veins have a smooth endothelium."},{"id":"s2x-c20-25","ch":20,"section":"Arteries vs. Veins","q":"Which vessel type has internal and external elastic membranes?","a":"Arteries have internal and external elastic membranes; veins have no elastic membranes."},{"id":"s2x-c20-26","ch":20,"section":"Arteries","q":"What are arteries designed to do, and what are their general wall features?","a":"They are designed to change diameter; they are elastic and muscular with thick walls."},{"id":"s2x-c20-27","ch":20,"section":"Arteries","q":"What does the tunica externa of arteries contain?","a":"Collagen."},{"id":"s2x-c20-28","ch":20,"section":"Arteries","q":"What causes vasoconstriction in arteries?","a":"Sympathetic stimulation of the smooth muscle."},{"id":"s2x-c20-29","ch":20,"section":"Arteries","q":"What causes vasodilation in arteries?","a":"Relaxation of the smooth muscle."},{"id":"s2x-c20-30","ch":20,"section":"Arteries","q":"What are elastic arteries also called, and what is their function?","a":"Also called conducting arteries; they transport large volumes of blood away from the heart."},{
