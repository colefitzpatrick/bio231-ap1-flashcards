lon","B. mesencephalon","C. diencephalon","D. rhombencephalon"]},{"id":"m5-c13-q15","ch":13,"section":"RQ","q":"Which adult structure(s) arises from the diencephalon?","a":"A. thalamus, hypothalamus, retina","opts":["A. thalamus, hypothalamus, retina","B. midbrain, pons, medulla","C. pons and cerebellum","D. cerebrum"]},{"id":"m5-c13-q16","ch":13,"section":"RQ","q":"Which non-nervous tissue develops from the neuroectoderm?","a":"D. craniofacial bone","opts":["A. respiratory mucosa","B. vertebral bone","C. digestive lining","D. craniofacial bone"]},{"id":"m5-c13-q17","ch":13,"section":"RQ","q":"Which structure is associated with the embryologic development of the peripheral nervous system?","a":"A. neural crest","opts":["A. neural crest","B. neuraxis","C. rhombencephalon","D. neural tube"]},{"id":"m5-c13-q18","ch":13,"section":"RQ","q":"Which lobe of the cerebral cortex is responsible for generating motor commands?","a":"D. frontal","opts":["A. temporal","B. parietal","C. occipital","D. frontal"]},{"id":"m5-c13-q19","ch":13,"section":"RQ","q":"What region of the diencephalon coordinates homeostasis?","a":"C. hypothalamus","opts":["A. thalamus","B. epithalamus","C. hypothalamus","D. subthalamus"]},{"id":"m5-c13-q20","ch":13,"section":"RQ","q":"What level of the brain stem is the major input to the cerebellum?","a":"B. pons","opts":["A. midbrain","B. pons","C. medulla","D. spinal cord"]},{"id":"m5-c13-q21","ch":13,"section":"RQ","q":"What region of the spinal cord contains motor neurons that direct the movement of skeletal muscles?","a":"A. anterior horn","opts":["A. anterior horn","B. posterior horn","C. lateral horn","D. alar plate"]},{"id":"m5-c13-q22","ch":13,"section":"RQ","q":"Brodmann’s areas map different regions of the ________ to particular functions.","a":"B. cerebral cortex","opts":["A. cerebellum","B. cerebral cortex","C. basal forebrain","D. corpus callosum"]},{"id":"m5-c13-q23","ch":13,"section":"RQ","q":"What blood vessel enters the cranium to supply the brain with fresh, oxygenated blood?","a":"C. internal carotid artery","opts":["A. common carotid artery","B. jugular vein","C. internal carotid artery","D. aorta"]},{"id":"m5-c13-q24","ch":13,"section":"RQ","q":"Which layer of the meninges surrounds and supports the sinuses that form the route through which blood drains from the CNS?","a":"A. dura mater","opts":["A. dura mater","B. arachnoid mater","C. subarachnoid","D. pia mater"]},{"id":"m5-c13-q25","ch":13,"section":"RQ","q":"What type of glial cell is responsible for filtering blood to produce CSF at the choroid plexus?","a":"A. ependymal cell","opts":["A. ependymal cell","B. astrocyte","C. oligodendrocyte","D. Schwann cell"]},{"id":"m5-c13-q26","ch":13,"section":"RQ","q":"Which portion of the ventricular system is found within the diencephalon?","a":"B. third ventricle","opts":["A. lateral ventricles","B. third ventricle","C. cerebral aqueduct","D. fourth ventricle"]},{"id":"m5-c13-q27","ch":13,"section":"RQ","q":"What condition causes a stroke?","a":"D. disruption of blood to the brain","opts":["A. inflammation of meninges","B. lumbar puncture","C. infection of cerebral spinal fluid","D. disruption of blood to the brain"]},{"id":"m5-c13-q28","ch":13,"section":"RQ","q":"What type of ganglion contains neurons that control homeostatic mechanisms of the body?","a":"C. autonomic ganglion","opts":["A. sensory ganglion","B. dorsal root ganglion","C. autonomic ganglion","D. cranial nerve ganglion"]},{"id":"m5-c13-q29","ch":13,"section":"RQ","q":"Which ganglion is responsible for cutaneous sensations of the face?","a":"D. trigeminal ganglion","opts":["A. otic ganglion","B. vestibular ganglion","C. geniculate ganglion","D. trigeminal ganglion"]},{"id":"m5-c13-q30","ch":13,"section":"RQ","q":"What is the name for a bundle of axons within a nerve?","a":"A. fascicle","opts":["A. fascicle","B. tract","C. nerve root","D. epineurium"]},{"id":"m5-c13-q31","ch":13,"section":"RQ","q":"Which cranial nerve does not control functions in the head and neck?","a":"D. vagus","opts":["A. olfactory","B. trochlear","C. glossopharyngeal","D. vagus"]},{"id":"m5-c13-q32","ch":13,"section":"RQ","q":"Which of these structures is not under direct control of the peripheral nervous system?","a":"B. gastric plexus","opts":["A. trigeminal ganglion","B. gastric plexus","C. sympathetic chain ganglia","D. cervical plexus"]},{"id":"m5-c13-q33","ch":13,"section":"CT","q":"Studying the embryonic development of the nervous system makes it easier to understand the complexity of the adult nervous system. Give one example of how development in the embryonic nervous system explains a more complex structure in the adult nervous system.","a":"The retina, a PNS structure in the adult, grows from the diencephalon in the embryonic nervous system. The mature connections from the retina through the optic nerve/tract are to the hypothalamus and thalamus of the diencephalon, and to the midbrain, which developed directly adjacent to the diencephalon as the mesencephalon in the embryo."},{"id":"m5-c13-q34","ch":13,"section":"CT","q":"What happens in development that suggests that there is a special relationship between the skeletal structure of the head and the nervous system?","a":"The neural crest gives rise to PNS structures (such as ganglia) and also to cartilage and bone of the face and cranium."},{"id":"m5-c13-q35","ch":13,"section":"CT","q":"Damage to specific regions of the cerebral cortex, such as through a stroke, can result in specific losses of function. What functions would likely be lost by a stroke in the temporal lobe?","a":"The temporal lobe has sensory functions associated with hearing and vision, as well as being important for memory. A stroke in the temporal lobe can result in specific sensory deficits in these systems (known as agnosias) or losses in memory"},{"id":"m5-c13-q36","ch":13,"section":"CT","q":"Why do the anatomical inputs to the cerebellum suggest that it can compare motor commands and sensory feedback?","a":"A copy of descending input from the cerebrum to the spinal cord, through the pons, and sensory feedback from the spinal cord and special senses like balance, through the medulla, both go to the cerebellum. It can therefore send output through the midbrain that will correct spinal cord control of skeletal muscle movements."},{"id":"m5-c13-q37","ch":13,"section":"CT","q":"Why can the circle of Willis maintain perfusion of the brain even if there is a blockage in one part of the structure?","a":"The structure is a circular connection of blood vessels, so that blood coming up from one of the arteries can flow in either direction around the circle and avoid any blockage or narrowing of the blood vessels."},{"id":"m5-c13-q38","ch":13,"section":"CT","q":"Meningitis is an inflammation of the meninges that can have severe effects on neurological function. Why is infection of this structure potentially so dangerous?","a":"The nerves that connect the periphery to the CNS pass through these layers of tissue and can be damaged by that inflammation, causing a loss of important neurological functions."},{"id":"m5-c13-q39","ch":13,"section":"CT","q":"Why are ganglia and nerves not surrounded by protective structures like the meninges of the CNS?","a":"The peripheral nervous tissues are out in the body, sometimes part of other organ systems. There is not a privileged blood supply like there is to the brain and spinal cord, so peripheral nervous tissues do not need the same sort of protections."},{"id":"m5-c13-q40","ch":13,"section":"CT","q":"Testing for neurological function involves a series of tests of functions associated with the cranial nerves. What functions, and therefore which nerves, are being tested by asking a patient to follow the tip of a pen with their eyes?","a":"The contraction of extraocular muscles is being tested, which is the function of the oculomotor, trochlear, and abducens nerves."},{"id":"m5-c14-q12","ch":14,"section":"RQ","q":"What type of receptor cell is responsible for transducing pain stimuli?","a":"B. nociceptor","opts":["A. mechanoreceptor","B. nociceptor","C. osmoreceptor","D. photoreceptor"]},{"id":"m5-c14-q13","ch":14,"section":"RQ","q":"Which of these cranial nerves is part of the gustatory system?","a":"D. facial","opts":["A. olfactory","B. trochlear","C. trigeminal","D. facial"]},{"id":"m5-c14-q14","ch":14,"section":"RQ","q":"Which submodality of taste is sensitive to the pH of saliva?","a":"B. sour","opts":["A. umami","B. sour","C. bitter","D. sweet"]},{"id":"m5-c14-q15","ch":14,"section":"RQ","q":"Axons from which neuron in the retina make up the optic nerve?","a":"D. retinal ganglion cells","opts":["A. amacrine cells","B. photoreceptors","C. bipolar cells","D. retinal ganglion cells"]},{"id":"m5-c14-q16","ch":14,"section":"RQ","q":"What type of receptor cell is involved in the sensations of sound and balance?","a":"C. mechanoreceptor","opts":["A. photoreceptor","B. chemoreceptor","C. mechanoreceptor","D. nociceptor"]},{"id":"m5-c14-q17","ch":14,"section":"RQ","q":"Which of these sensory modalities does not pass through the ventral posterior thalamus?","a":"C. audition","opts":["A. gustatory","B. proprioception","C. audition","D. nociception"]},{"id":"m5-c14-q18","ch":14,"section":"RQ","q":"Which nucleus in the medulla is connected to the inferior colliculus?","a":"D. cochlear nucleus","opts":["A. solitary nucleus","B. vestibular nucleus","C. chief sensory nucleus","D. cochlear nucleus"]},{"id":"m5-c14-q19","ch":14,"section":"RQ","q":"Visual stimuli in the upper-left visual field will be processed in what region of the primary visual cortex?","a":"A. inferior right","opts":["A. inferior right","B. inferior left","C. superior right","D. superior left"]},{"id":"m5-c14-q20","ch":14,"section":"RQ","q":"Which location on the body has the largest region of somatosensory cortex representing it, according to the sensory homunculus?","a":"A. lips","opts":["A. lips","B. thigh","C. elbow","D. neck"]},{"id":"m5-c14-q21","ch":14,"section":"RQ","q":"Which of the following is a direct target of the vestibular ganglion?","a":"B. cerebellum","opts":["A. superior colliculus","B. cerebellum","C. thalamus","D. optic chiasm"]},{"id":"m5-c14-q22","ch":14,"section":"RQ","q":"Which region of the frontal lobe is responsible for initiating movement by directly connecting to cranial and spinal motor neurons?","a":"D. primary motor cortex","opts":["A. prefrontal cortex","B. supplemental motor area","C. premotor cortex","D. primary motor cortex"]},{"id":"m5-c14-q23","ch":14,"section":"RQ","q":"Which extrapyramidal tract incorporates equilibrium sensations with motor commands to aid in posture and movement?","a":"B. vestibulospinal tract","opts":["A. tectospinal tract","B. vestibulospinal tract","C. reticulospinal tract","D. corticospinal tract"]},{"id":"m5-c14-q24","ch":14,"section":"RQ","q":"Which region of gray matter in the spinal cord contains motor neurons that innervate skeletal muscles?","a":"A. ventral horn","opts":["A. ventral horn","B. dorsal horn","C. lateral horn","D. lateral column"]},{"id":"m5-c14-q25","ch":14,"section":"RQ","q":"What type of reflex can protect the foot when a painful stimulus is sensed?","a":"C. withdrawal reflex","opts":["A. stretch reflex","B. gag reflex","C. withdrawal reflex","D. corneal reflex"]},{"id":"m5-c14-q26","ch":14,"section":"RQ","q":"What is the name for the topographical representation of the sensory input to the somatosensory cortex?","a":"A. homunculus","opts":["A. homunculus","B. homo sapiens","C. postcentral gyrus","D. primary cortex"]},{"id":"m5-c14-q27","ch":14,"section":"CT","q":"The sweetener known as stevia can replace glucose in food. What does the molecular similarity of stevia to glucose mean for the gustatory sense?","a":"The stevia molecule is similar to glucose such that it will bind to the glucose receptor in sweet-sensitive taste buds. However, it is not a substrate for the ATP-generating metabolism within cells."},{"id":"m5-c14-q28","ch":14,"section":"CT","q":"Why does the blind spot from the optic disc in either eye not result in a blind spot in the visual field?","a":"The visual field for each eye is projected onto the retina as light is focused by the lens. The visual information from the right visual field falls on the left side of the retina and vice versa. The optic disc in the right eye is on the medial side of the fovea, which would be the left side of the retina. However, the optic disc in the left eye would be on the right side of that fovea, so the right visual field falls on the side of the retina in the left field where there is no blind spot."},{"id":"m5-c14-q29","ch":14,"section":"CT","q":"Following a motorcycle accident, the victim loses the ability to move the right leg but has normal control over the left one, suggesting a hemisection somewhere in the thoracic region of the spinal cord. What sensory deficits would be expected in terms of touch versus pain? Explain your answer.","a":"The right leg would feel painful stimuli, but not touch, because the spinothalamic tract decussates at the level of entry, which would be below the injury, whereas the dorsal column system does not decussate until reaching the brain stem, which would be above the injury and thus those fibers would be damaged."},{"id":"m5-c14-q30","ch":14,"section":"CT","q":"A pituitary tumor can cause perceptual losses in the lateral visual field. The pituitary gland is located directly inferior to the hypothalamus. Why would this happen?","a":"As the tumor enlarges, it would press against the optic chiasm, and fibers from the medial retina would be disrupted. These fibers carry information about the lateral visual field because the visual scene is reversed as the light passes through the pupil and lens."},{"id":"m5-c14-q31","ch":14,"section":"CT","q":"The prefrontal lobotomy is a drastic—and largely out-of-practice—procedure used to disconnect that portion of the cerebral cortex from the rest of the frontal lobe and the diencephalon as a psychiatric therapy. Why would this have been thought necessary for someone with a potentially uncontrollable behavior?","a":"The prefrontal cortex is involved in decision-making functions that lead to motor responses through connections to the more posterior motor regions. These early aspects of behavior are often associated with a person’s personality, so disrupting those connections will lead to severe changes in behavior."},{"id":"m5-c14-q32","ch":14,"section":"CT","q":"If a reflex is a limited circuit within the somatic system, why do physical and neurological exams include them to test the health of an individual?","a":"Though reflexes are simple circuits within the nervous system, they are representative of the more involved circuits of the somatic nervous system and can be used to quickly assess the state of neurological function for a person."},{"id":"m5-c12-mc1","ch":12,"section":"MC","q":"A neuron that receives neurotransmitter from another neuron is called","a":"E. the postsynaptic neuron.","opts":["A. the presynaptic neuron.","B. the motor neuron.","C. an oligodendrocyte.","D. an interneuron.","E. the postsynaptic neuron."]},{"id":"m5-c12-mc2","ch":12,"section":"MC","q":"A stimulus that changes a postsynaptic neuron's membrane from resting potential to -85 mV is:","a":"E. an inhibitory stimulus","opts":["A. an excitatory stimulus","B. a depolarizing stimulus","C. a temporal stimulus","D. a saltatory stimulus","E. an inhibitory stimulus"]},{"id":"m5-c12-mc3","ch":12,"section":"MC","q":"A threshold stimulus is the","a":"A. depolarization necessary to cause an action potential.","opts":["A. depolarization necessary to cause an action potential.","B. peak of an action potential.","C. hyperpolarization of an axon.","D. resting potential.","E. electrical current that crosses the synaptic cleft."]},{"id":"m5-c12-mc4","ch":12,"section":"MC","q":"Adrenergic synapses release the neurotransmitter","a":"B. norepinephrine.","opts":["A. acetylcholine.","B. norepinephrine.","C. dopamine.","D. serotonin.","E. GABA."]},{"id":"m5-c12-mc5","ch":12,"section":"MC","q":"After a stroke, what type of glial cell accumulates within the affected brain region?","a":"D. microglia","opts":["A. Schwann cells","B. satellite cells","C. oligodendrocytes","D. microglia","E. ependymal cells"]},{"id":"m5-c12-mc6","ch":12,"section":"MC","q":"Axons terminate in a series of fine extensions known as","a":"A. telodendria.","opts":["A. telodendria.","B. terminals.","C. collaterals.","D. dendrites.","E. synapses."]},{"id":"m5-c12-mc7","ch":12,"section":"MC","q":"Branches that may occur along an axon are called","a":"C. collaterals.","opts":["A. telodendria.","B. synaptic terminals.","C. collaterals.","D. hillocks.","E. synapses."]},{"id":"m5-c12-mc8","ch":12,"section":"MC","q":"Clusters of RER and free ribosomes in neurons are called","a":"D. Nissl bodies.","opts":["A. neurofilaments.","B. neurofibrils.","C. perikaryon.","D. Nissl bodies.","E. microglia."]},{"id":"m5-c12-mc9","ch":12,"section":"MC","q":"Damage to ependymal cells would most likely affect the","a":"B. formation of cerebrospinal fluid.","opts":["A. formation of myelin sheaths.","B. formation of cerebrospinal fluid.","C. formation of ganglia.","D. repair of axons.","E. transport of neurotransmitters within axons."]},{"id":"m5-c12-mc10","ch":12,"section":"MC","q":"Extensive damage to oligodendrocytes in the CNS could result in","a":"E. loss of sensation and motor control.","opts":["A. loss of the structural framework of the brain.","B. a breakdown of the blood-brain barrier.","C. inability to produce scar tissue at the site of an injury.","D. decreased production of cerebrospinal fluid.","E. loss of sensation and motor control."]},{"id":"m5-c12-mc11","ch":12,"section":"MC","q":"Glial cells that surround the neurons in ganglia are","a":"B. satellite cells.","opts":["A. astrocytes.","B. satellite cells.","C. oligodendrocytes.","D. microglia.","E. ependymal cells."]},{"id":"m5-c12-mc12","ch":12,"section":"MC","q":"Functions of astrocytes include all of the following, except","a":"B. conducting action potentials.","opts":["A. maintaining the blood-brain barrier.","B. conducting action potentials.","C. guiding neuron development.","D. responding to neural tissue damage.","E. forming a three-dimensional framework for the CNS."]},{"id":"m5-c12-mc13","ch":12,"section":"MC","q":"Graded potentials","a":"C. may be either a depolarization or a hyperpolarization.","opts":["A. produce an effect that increases with distance from the point of stimulation.","B. produce an effect that spreads actively across the membrane surface.","C. may be either a depolarization or a hyperpolarization.","D. are often all-or-none.","E. cause repolarization."]},{"id":"m5-c12-mc14","ch":12,"section":"MC","q":"If the axolemma becomes more permeable to potassium ion:","a":"B. a stronger stimulus will be required to cause an action potential","opts":["A. the membrane will depolarize to threshold","B. a stronger stimulus will be required to cause an action potential","C. the membrane will depolarize to +30 mV","D. sodium ions will enter the cell to replace the lost potassium ions","E. the inside of the membrane will have a positive charge"]},{"id":"m5-c12-mc15","ch":12,"section":"MC","q":"Ion channels that are always open are called ________ channels.","a":"C. leak","opts":["A. active","B. gated","C. leak","D. regulated","E. local"]},{"id":"m5-c12-mc16","ch":12,"section":"MC","q":"Many medications introduced into the bloodstream cannot directly affect the neurons of the CNS because","a":"B. the endothelium of CNS capillaries forms a blood-brain barrier.","opts":["A. oligodendrocytes form a continuous myelin sheath around the axons.","B. the endothelium of CNS capillaries forms a blood-brain barrier.","C. the neurolemma is impermeable to most molecules.","D. ependymal cells restrict the flow of interstitial fluid between the capillaries and the neurons.","E. astrocytes form a capsule around neurons."]},{"id":"m5-c12-mc17","ch":12,"section":"MC","q":"Most CNS neurons lack centrioles. This observation explains","a":"B. why CNS neurons cannot divide to regenerate damaged tissue.","opts":["A. why CNS neurons grow such long axons.","B. why CNS neurons cannot divide to regenerate damaged tissue.","C. the ability of neurons to generate an action potential.","D. the ability of neurons to communicate with each other.","E. the ability of neurons to produce a resting potential."]},{"id":"m5-c12-mc18","ch":12,"section":"MC","q":"Neurons in which dendritic and axonal processes are continuous and the soma lies off to one side are called","a":"B. unipolar.","opts":["A. anaxonic.","B. unipolar.","C. bipolar.","D. tripolar.","E. multipolar."]},{"id":"m5-c12-mc19","ch":12,"section":"MC","q":"Neurons that are rare, small, and lack features that distinguish dendrites from axons are called","a":"A. anaxonic.","opts":["A. anaxonic.","B. unipolar.","C. bipolar.","D. tripolar.","E. multipolar."]},{"id":"m5-c12-mc20","ch":12,"section":"MC","q":"Neurons that have one axon and one dendrite, with the soma in between, are called","a":"C. bipolar.","opts":["A. anaxonic.","B. unipolar.","C. bipolar.","D. tripolar.","E. multipolar."]},{"id":"m5-c12-mc21","ch":12,"section":"MC","q":"Neurons that have several dendrites and a single axon are called","a":"E. multipolar.","opts":["A. anaxonic.","B. unipolar.","C. bipolar.","D. tripolar.","E. multipolar."]},{"id":"m5-c12-mc22","ch":12,"section":"MC","q":"Neurotransmitters ready for release are stored in synaptic","a":"C. vesicles.","opts":["A. telodendria.","B. terminals.","C. vesicles.","D. mitochondria.","E. neurosomes."]},{"id":"m5-c12-mc23","ch":12,"section":"MC","q":"Opening of sodium channels in the axon membrane causes","a":"A. depolarization.","opts":["A. depolarization.","B. repolarization.","C. hyperpolarization.","D. increased negative charge inside the membrane.","E. inhibition."]},{"id":"m5-c12-mc24","ch":12,"section":"MC","q":"Opioids relieve pain by blocking the release of","a":"B. substance P.","opts":["A. substance O.","B. substance P.","C. substance Q.","D. substance X.","E. None of the answers are correct."]},{"id":"m5-c12-mc25","ch":12,"section":"MC","q":"Rapid impulse conduction from \"node\" to \"node\" is called","a":"B. saltatory propagation.","opts":["A. spatial propagation.","B. saltatory propagation.","C. divergent propagation.","D. synaptic transmission.","E. continuous propagation."]},{"id":"m5-c12-mc26","ch":12,"section":"MC","q":"Sensory neurons of the PNS are","a":"A. unipolar.","opts":["A. unipolar.","B. bipolar.","C. anaxonic.","D. multipolar.","E. tripolar."]},{"id":"m5-c12-mc27","ch":12,"section":"MC","q":"Small, wandering cells that engulf cell debris and pathogens in the CNS are called","a":"D. microglia.","opts":["A. astrocytes.","B. satellite cells.","C. oligodendrocytes.","D. microglia.","E. ependymal cells."]},{"id":"m5-c12-mc28","ch":12,"section":"MC","q":"The ________ nervous system controls the skeletal muscles.","a":"D. somatic","opts":["A. sympathetic","B. parasympathetic","C. afferent","D. somatic","E. autonomic"]},{"id":"m5-c12-mc29","ch":12,"section":"MC","q":"The ________ nervous system is composed of the brain and spinal cord.","a":"C. central","opts":["A. autonomic","B. peripheral","C. central","D. efferent","E. afferent"]},{"id":"m5-c12-mc30","ch":12,"section":"MC","q":"The all-or-none principle states that","a":"B. all stimuli great enough to bring the membrane to threshold will produce identical action potentials.","opts":["A. all stimuli will produce identical action potentials.","B. all stimuli great enough to bring the membrane to threshold will produce identical action potentials.","C. the greater the magnitude of the stimuli, the greater the magnitude of the action potential.","D. only sensory stimuli can activate action potentials.","E. only motor stimuli can activate action potentials."]},{"id":"m5-c12-mc31","ch":12,"section":"MC","q":"The axon is connected to the soma at the","a":"D. axon hillock.","opts":["A. telodendria.","B. synaptic terminal.","C. collaterals.","D. axon hillock.","E. synapse."]},{"id":"m5-c12-mc32","ch":12,"section":"MC","q":"The cytoplasm that surrounds the nucleus of a neuron is called the","a":"E. perikaryon.","opts":["A. protoplasm.","B. nucleoplasm.","C. sarcoplasm.","D. neuroplasm.","E. perikaryon."]},{"id":"m5-c12-mc33","ch":12,"section":"MC","q":"The most abundant class of neuron in the central nervous system is","a":"C. multipolar.","opts":["A. anaxonic.","B. bipolar.","C. multipolar.","D. pseudopolar.","E. unipolar."]},{"id":"m5-c12-mc34","ch":12,"section":"MC","q":"The myelin sheath that covers many CNS axons is formed by","a":"C. oligodendrocytes.","opts":["A. astrocytes.","B. satellite cells.","C. oligodendrocytes.","D. microglia.","E. ependymal cells."]},{"id":"m5-c12-mc35","ch":12,"section":"MC","q":"The neurilemma of axons in the peripheral nervous system is formed by","a":"E. Schwann cells.","opts":["A. astrocytes.","B. satellite cells.","C. oligodendrocytes.","D. microglia.","E. Schwann cells."]},{"id":"m5-c12-mc36","ch":12,"section":"MC","q":"The neuroglial cells that participate in maintaining the blood-brain barrier are the","a":"A. astrocytes.","opts":["A. astrocytes.","B. ependymal cells.","C. microglia.","D. oligodendrocytes.","E. Schwann cells."]},{"id":"m5-c12-mc37","ch":12,"section":"MC","q":"The part of the peripheral nervous system that carries sensory information to the CNS is designated","a":"B. afferent.","opts":["A. motor.","B. afferent.","C. efferent.","D. autonomic.","E. somatic."]},{"id":"m5-c12-mc38","ch":12,"section":"MC","q":"Type ________ fibers have the largest diameter axons.","a":"C. A","opts":["A. S","B. F","C. A","D. B","E. C"]},{"id":"m5-c12-mc39","ch":12,"section":"MC","q":"Voltage-gated channels are present","a":"C. in the membrane that covers axons.","opts":["A. at the motor end plate.","B. on the surface of dendrites.","C. in the membrane that covers axons.","D. on the soma of neurons.","E. along the perikaryon of neurons."]},{"id":"m5-c12-mc40","ch":12,"section":"MC","q":"What triggers the release of acetylcholine from a synaptic terminal?","a":"E. diffusion of calcium ions into the synaptic terminal","opts":["A. release of calcium ions from the synaptic vesicles","B. graded potentials in the synaptic terminal","C. synaptic vesicles fuse to dendrites","D. diffusion of sodium ions out of the synaptic terminal","E. diffusion of calcium ions into the synaptic terminal"]},{"id":"m5-c12-mc41","ch":12,"section":"MC","q":"When cholinergic receptors are stimulated,","a":"A. sodium ions enter the postsynaptic neuron.","opts":["A. sodium ions enter the postsynaptic neuron.","B. sodium ions leave the postsynaptic neuron.","C. chloride ions enter the postsynaptic neuron.","D. chloride ions leave the postsynaptic neuron.","E. norepinephrine deactivates acetylcholine."]},{"id":"m5-c12-mc42","ch":12,"section":"MC","q":"________ are the most numerous type of neuron in the CNS.","a":"E. Interneurons","opts":["A. Sensory neurons","B. Motor neurons","C. Unipolar neurons","D. Bipolar neurons","E. Interneurons"]},{"id":"m5-c12-mc43","ch":12,"section":"MC","q":"________ account for roughly half of the volume of the nervous system.","a":"C. Neuroglia","opts":["A. Axons","B. Dendrites","C. Neuroglia","D. Synapses","E. Efferent fibers"]},{"id":"m5-c12-mc44","ch":12,"section":"MC","q":"________ line the brain ventricles and spinal canal.","a":"E. Ependymal cells","opts":["A. Astrocytes","B. Satellite cells","C. Oligodendrocytes","D. Microglia","E. Ependymal cells"]},{"id":"m5-c12-mc45","ch":12,"section":"MC","q":"________ neurons are short, with a cell body between dendrite and axon, and occur in special sense organs.","a":"D. Bipolar","opts":["A. Multipolar","B. Anaxonic","C. Unipolar","D. Bipolar","E. Motor"]},{"id":"m5-c12-mc46","ch":12,"section":"MC","q":"________ neurons are the most common class in the CNS.","a":"A. Multipolar","opts":["A. Multipolar","B. Anaxonic","C. Unipolar","D. Bipolar","E. Sensory"]},{"id":"m5-c12-mc47","ch":12,"section":"MC","q":"________ neurons form the afferent division of the PNS.","a":"B. Sensory","opts":["A. Visceral sensory","B. Sensory","C. Neural sensory","D. Somatic sensory","E. Motor"]},{"id":"m5-c12-mc48","ch":12,"section":"MC","q":"________ neurons are small and have no anatomical features that distinguish dendrites from axons.","a":"B. Anaxonic","opts":["A. Multipolar","B. Anaxonic","C. Unipolar","D. Bipolar","E. Sensory"]},{"id":"m5-c12-mc49","ch":12,"section":"MC","q":"________ open or close in response to binding specific molecules.","a":"C. Chemically-gated channels","opts":["A. Leak channels","B. Activated channels","C. Chemically-gated channels","D. Voltage-gated channels","E. Voltage-gated and chemically-gated channels"]},{"id":"m5-c12-mc50","ch":12,"section":"MC","q":"Which type of synapse is most common in the nervous system?","a":"A. chemical","opts":["A. chemical","B. electrical","C. mechanical","D. processing","E. radiative"]},{"id":"m5-c13-mc1","ch":13,"section":"MC","q":"A dorsal and ventral root of each spinal segment unite to form a","a":"C. spinal nerve.","opts":["A. cervical enlargement.","B. lumbar enlargement.","C. spinal nerve.","D. spinal meninx.","E. spinal ganglion."]},{"id":"m5-c13-mc2","ch":13,"section":"MC","q":"As the ________ nerve approaches the knee, it divides into two branches, the fibular nerve and the tibial nerve.","a":"E. sciatic","opts":["A. perineal","B. femoral","C. brachial","D. pudendal","E. sciatic"]},{"id":"m5-c13-mc3","ch":13,"section":"MC","q":"Axons crossing from one side of the spinal cord to the other within the gray matter are found in the","a":"D. gray commissures.","opts":["A. anterior gray horns.","B. lateral gray horns.","C. posterior gray horns.","D. gray commissures.","E. white commissures."]},{"id":"m5-c13-mc4","ch":13,"section":"MC","q":"Blood vessels that supply the spinal cord run along the surface of the","a":"A. pia mater.","opts":["A. pia mater.","B. dura mater.","C. epidural space.","D. subdural space.","E. subarachnoid space."]},{"id":"m5-c13-mc5","ch":13,"section":"MC","q":"Blood vessels traveling within the ________ space deliver oxygen and nutrients to the spinal cord.","a":"subarachnoid"},{"id":"m5-c13-mc6","ch":13,"section":"MC","q":"Cerebrospinal fluid flows within the","a":"B. subarachnoid space.","opts":["A. filum terminale.","B. subarachnoid space.","C. dura mater.","D. pia mater.","E. arachnoid mater."]},{"id":"m5-c13-mc7","ch":13,"section":"MC","q":"Each of the following nerves originates in the lumbar plexus, except the ________ nerve.","a":"B. sciatic","opts":["A. saphenous","B. sciatic","C. femoral","D. obturator","E. genitofemoral"]},{"id":"m5-c13-mc8","ch":13,"section":"MC","q":"In which plexus does the ulnar nerve arise?","a":"C. brachial","opts":["A. cranial","B. cervical","C. brachial","D. lumbar","E. sacral"]},{"id":"m5-c13-mc9","ch":13,"section":"MC","q":"In the spinal cord, white matter is separated into ascending and descending tracts organized as","a":"C. columns.","opts":["A. nuclei.","B. ganglia.","C. columns.","D. nerves.","E. horns."]},{"id":"m5-c13-mc10","ch":13,"section":"MC","q":"In meningitis,","a":"E. All of the answers are correct.","opts":["A. inflammation of the meninges occurs.","B. bacteria can be the cause.","C. viruses can be the cause.","D. CSF flow can be disrupted.","E. All of the answers are correct."]},{"id":"m5-c13-mc11","ch":13,"section":"MC","q":"In an adult, the conus medullaris is found at about","a":"C. L1.","opts":["A. T6.","B. T10.","C. L1.","D. L5.","E. C1."]},{"id":"m5-c13-mc12","ch":13,"section":"MC","q":"In the condition ________, a virus infects dorsal root ganglia, causing a painful rash whose distribution corresponds to that of the affected sensory nerves as seen in their dermatomes.","a":"C. shingles","opts":["A. myasthenia gravis","B. neuronal damage","C. shingles","D. chickenpox","E. Hodgkin's disease"]},{"id":"m5-c13-mc13","ch":13,"section":"MC","q":"If the dorsal root of a spinal nerve is severed,","a":"E. sensory input would be blocked.","opts":["A. output to skeletal muscles would be blocked.","B. output to visceral organs would be blocked.","C. the spinal cord would not be able to process information at that level.","D. the brain would not be able to communicate with that level of the spinal cord.","E. sensory input would be blocked."]},{"id":"m5-c13-mc14","ch":13,"section":"MC","q":"If a person has a crush injury to the C3-C5 spinal segments, you would expect that he","a":"A. might be unable to breathe on his own.","opts":["A. might be unable to breathe on his own.","B. could walk without difficulty.","C. would have full range of motion in all extremities.","D. would be in a coma.","E. would have difficulty chewing and moving the tongue."]},{"id":"m5-c13-mc15","ch":13,"section":"MC","q":"Nerve tracts or fasciculi make up the","a":"D. white columns.","opts":["A. central canal.","B. posterior gray horns.","C. gray commissures.","D. white columns.","E. anterior gray horns."]},{"id":"m5-c13-mc16","ch":13,"section":"MC","q":"Muscles of the neck and shoulder are innervated by spinal nerves from the ________ region.","a":"A. cervical","opts":["A. cervical","B. thoracic","C. lumbar","D. sacral","E. coccygeal"]},{"id":"m5-c13-mc17","ch":13,"section":"MC","q":"Spinal nerves are","a":"C. both sensory and motor.","opts":["A. purely sensory.","B. purely motor.","C. both sensory and motor.","D. interneuronal.","E. involuntary."]},{"id":"m5-c13-mc18","ch":13,"section":"MC","q":"Samples of CSF for diagnostic purposes are normally obtained by placing the tip of a needle in the","a":"D. subarachnoid space.","opts":["A. dura mater.","B. arachnoid mater.","C. epidural space.","D. subarachnoid space.","E. cerebral ventricles."]},{"id":"m5-c13-mc19","ch":13,"section":"MC","q":"Spinal nerves from the sacral region of the cord innervate the ________ muscles.","a":"D. leg","opts":["A. shoulder","B. intercostal","C. abdominal","D. leg","E. facial"]},{"id":"m5-c13-mc20","ch":13,"section":"MC","q":"The ________ innervates the ventrolateral body surface, structures in the body wall, and the limbs.","a":"D. ventral ramus","opts":["A. white rami communicantes","B. gray rami communicantes","C. dorsal ramus","D. ventral ramus","E. dermatomes"]},{"id":"m5-c13-mc21","ch":13,"section":"MC","q":"The ________ nerve, which arises in the cervical plexus, innervates the diaphragm.","a":"D. phrenic","opts":["A. ansa cervicalis","B. lesser occipital","C. radial","D. phrenic","E. sciatic"]},{"id":"m5-c13-mc22","ch":13,"section":"MC","q":"The ________ of each spinal nerve innervates the skin and muscles of the back.","a":"C. dorsal ramus","opts":["A. white ramus communicantes","B. gray ramus communicantes","C. dorsal ramus","D. ventral ramus","E. dermatome"]},{"id":"m5-c13-mc23","ch":13,"section":"MC","q":"The dorsal root of a spinal nerve contains","a":"B. axons of sensory neurons.","opts":["A. axons of motor neurons.","B. axons of sensory neurons.","C. cell bodies of motor neurons.","D. cell bodies of sensory neurons.","E. interneurons."]},{"id":"m5-c13-mc24","ch":13,"section":"MC","q":"The brachial plexus gives rise to all of the following nerves, except the","a":"E. phrenic.","opts":["A. radial.","B. median.","C. ulnar.","D. musculocutaneous.","E. phrenic."]},{"id":"m5-c13-mc25","ch":13,"section":"MC","q":"The anterior horns of the spinal cord contain mainly","a":"B. somatic motor nuclei.","opts":["A. sensory nuclei.","B. somatic motor nuclei.","C. autonomic motor nuclei.","D. nerve tracts.","E. sympathetic nuclei."]},{"id":"m5-c13-mc26","ch":13,"section":"MC","q":"The layer of the meninges in direct contact with the spinal cord is the","a":"D. pia mater.","opts":["A. dura mater.","B. subarachnoid space.","C. arachnoid.","D. pia mater.","E. choroid plexus."]},{"id":"m5-c13-mc27","ch":13,"section":"MC","q":"The obturator nerve is distributed to the","a":"A. adductors of the hip.","opts":["A. adductors of the hip.","B. skin over the perineum.","C. extensors of the hip.","D. skin over buttocks.","E. biceps femoris."]},{"id":"m5-c13-mc28","ch":13,"section":"MC","q":"The layer of connective tissue that surrounds a fascicle within a peripheral nerve is the","a":"A. perineurium.","opts":["A. perineurium.","B. epineurium.","C. endoneurium.","D. epimysium.","E. endosteum."]},{"id":"m5-c13-mc29","ch":13,"section":"MC","q":"The layer of connective tissue that surrounds individual axons within a peripheral nerve is termed the","a":"A. endoneurium.","opts":["A. endoneurium.","B. perineurium.","C. aponeurium.","D. metaneurium.","E. subneurium."]},{"id":"m5-c13-mc30","ch":13,"section":"MC","q":"The gray horns of the spinal cord contain mainly","a":"D. nerve cell bodies.","opts":["A. nerve tracts.","B. columns.","C. meninges.","D. nerve cell bodies.","E. funiculi."]},{"id":"m5-c13-mc31","ch":13,"section":"MC","q":"The outermost connective-tissue covering of nerves is the","a":"D. epineurium.","opts":["A. endoneurium.","B. endomysium.","C. perineurium.","D. epineurium.","E. epimysium."]},{"id":"m5-c13-mc32","ch":13,"section":"MC","q":"The outward projections from the central gray matter of the spinal cord are called","a":"B. horns.","opts":["A. wings.","B. horns.","C. pyramids.","D. fibers.","E. tracts."]},{"id":"m5-c13-mc33","ch":13,"section":"MC","q":"The posterior horns of the spinal cord contain mainly","a":"A. sensory nuclei.","opts":["A. sensory nuclei.","B. somatic motor nuclei.","C. autonomic motor nuclei.","D. nerve tracts.","E. sympathetic nuclei."]},{"id":"m5-c13-mc34","ch":13,"section":"MC","q":"The postganglionic fibers that connect an autonomic ganglion in the thoracic or lumbar region with the spinal nerve and contain postganglionic fibers that innervate glands in the body wall or limbs are","a":"B. gray rami communicantes.","opts":["A. white rami communicantes.","B. gray rami communicantes.","C. dorsal ramus.","D. ventral ramus.","E. dermatomes."]},{"id":"m5-c13-mc35","ch":13,"section":"MC","q":"The preganglionic fibers that connect a spinal nerve with an autonomic ganglion in the thoracic and lumbar region of the spinal cord and carries visceral motor fibers that are myelinated form the","a":"A. white rami communicantes.","opts":["A. white rami communicantes.","B. gray rami communicantes.","C. dorsal ramus.","D. ventral ramus.","E. dermatomes."]},{"id":"m5-c13-mc36","ch":13,"section":"MC","q":"The spinal cord consists of five regions and ________ segments.","a":"D. 31","opts":["A. 5","B. 12","C. 25","D. 31","E. The number varies widely among individuals."]},{"id":"m5-c13-mc37","ch":13,"section":"MC","q":"The spinal cord continues to elongate until about age","a":"C. 4 years.","opts":["A. 20 years.","B. 10 years.","C. 4 years.","D. 6 months.","E. 2 months."]},{"id":"m5-c13-mc38","ch":13,"section":"MC","q":"The spinal cord is part of the","a":"C. central nervous system.","opts":["A. peripheral nervous system.","B. somatic nervous system.","C. central nervous system.","D. autonomic nervous system.","E. afferent nervous system."]},{"id":"m5-c13-mc39","ch":13,"section":"MC","q":"The subdural space lies between","a":"C. the dura mater and the arachnoid mater.","opts":["A. the arachnoid mater and the pia mater.","B. the pia mater and the dura mater.","C. the dura mater and the arachnoid mater.","D. the pia mater and the subarachnoid space.","E. the endosteum and the periosteum."]},{"id":"m5-c13-mc40","ch":13,"section":"MC","q":"The tough, fibrous, outermost covering of the spinal cord is the","a":"C. dura mater.","opts":["A. arachnoid.","B. pia mater.","C. dura mater.","D. epidural block.","E. periosteum."]},{"id":"m5-c13-mc41","ch":13,"section":"MC","q":"The ventral root of a spinal nerve contains","a":"A. axons of motor neurons.","opts":["A. axons of motor neurons.","B. axons of sensory neurons.","C. cell bodies of motor neurons.","D. cell bodies of sensory neurons.","E. interneurons."]},{"id":"m5-c13-mc42","ch":13,"section":"MC","q":"The white matter of the spinal cord contains","a":"A. bundles of axons with common origins, destinations, and functions.","opts":["A. bundles of axons with common origins, destinations, and functions.","B. bundles of dendrites with common origins, destinations, and functions.","C. sensory and motor nuclei.","D. both axons and dendrites.","E. interneurons."]},{"id":"m5-c14-mc1","ch":14,"section":"MC","q":"A neural cortex is found on the surface of the","a":"A. cerebrum.","opts":["A. cerebrum.","B. pons.","C. thalamus.","D. midbrain.","E. pons."]},{"id":"m5-c14-mc2","ch":14,"section":"MC","q":"A person with a damaged visual association area may be","a":"D. able to see letters but unable to associate them into words.","opts":["A. unable to see rows of letters.","B. declared legally blind.","C. unable to recognize letters but able to identify whole words and their meanings.","D. able to see letters but unable to associate them into words.","E. unable to understand spoken words."]},{"id":"m5-c14-mc3","ch":14,"section":"MC","q":"A tract of white matter that connects the hippocampus with the hypothalamus is the","a":"E. fornix.","opts":["A. amygdaloid body.","B. cingulate gyrus.","C. mamillary bodies.","D. hippocampus.","E. fornix."]},{"id":"m5-c14-mc4","ch":14,"section":"MC","q":"A(n) ________ is a printed record of the brain's electrical activity over a period of time.","a":"B. electroencephalogram","opts":["A. electrocardiogram","B. electroencephalogram","C. x-ray","D. MRI","E. CT scan"]},{"id":"m5-c14-mc5","ch":14,"section":"MC","q":"As CSF circulates, ________ between it and the interstitial fluid of the CNS is unrestricted between and across the ependyma.","a":"C. diffusion","opts":["A. osmosis","B. perfusion","C. diffusion","D. convection","E. conduction"]},{"id":"m5-c14-mc6","ch":14,"section":"MC","q":"At the optic chiasm","a":"A. axons from the nasal halves of each retina cross.","opts":["A. axons from the nasal halves of each retina cross.","B. axons from the temporal halves of each retina cross.","C. axons from the retinae synapse on those from the other half.","D. the olfactory nerve crosses to the opposite side of the brain.","E. the optic nerve enters the cerebellum."]},{"id":"m5-c14-mc7","ch":14,"section":"MC","q":"As you ascend from the medulla oblongata to the cerebrum, the functions of each successive level become","a":"A. more complex.","opts":["A. more complex.","B. simpler.","C. better understood.","D. more crucial to visceral functions.","E. critical to reflexes."]},{"id":"m5-c14-mc8","ch":14,"section":"MC","q":"Autonomic centers that control blood pressure, heart rate, and digestion are located in the","a":"A. medulla oblongata.","opts":["A. medulla oblongata.","B. pons.","C. mesencephalon.","D. diencephalon.","E. cerebellum."]},{"id":"m5-c14-mc9","ch":14,"section":"MC","q":"Cerebrospinal fluid","a":"A. is secreted by ependymal cells.","opts":["A. is secreted by ependymal cells.","B. is formed by a passive process.","C. is normally produced twice as fast as it is removed.","D. has almost the same composition as blood plasma.","E. contains blood cells and blood plasma."]},{"id":"m5-c14-mc10","ch":14,"section":"MC","q":"Cerebrospinal fluid enters the blood circulation at the","a":"C. arachnoid granulations.","opts":["A. jugular veins.","B. dural drain.","C. arachnoid granulations.","D. tentorium cerebelli.","E. frontal sinus."]},{"id":"m5-c14-mc11","ch":14,"section":"MC","q":"Cerebrospinal fluid enters the subarachnoid space through the","a":"D. lateral and median apertures.","opts":["A. interventricular foramina.","B. aqueduct of Sylvius.","C. dural sinus.","D. lateral and median apertures.","E. falx cerebri."]},{"id":"m5-c14-mc12","ch":14,"section":"MC","q":"Damage to the corpora quadrigemina would interfere with","a":"C. visual and auditory reflex movements of the head and neck.","opts":["A. control of autonomic function.","B. regulation of body temperature.","C. visual and auditory reflex movements of the head and neck.","D. conscious control of skeletal muscles.","E. control of breathing."]},{"id":"m5-c14-mc13","ch":14,"section":"MC","q":"Damage to the pyramidal cells of the cerebral cortex would directly affect","a":"C. voluntary motor activity.","opts":["A. perception of pain.","B. sight.","C. voluntary motor activity.","D. hearing.","E. sense of touch."]},{"id":"m5-c14-mc14","ch":14,"section":"MC","q":"Damage to the superior colliculi would interfere with the reflex ability to","a":"C. react to a bright light.","opts":["A. express rage.","B. voluntarily move the arm.","C. react to a bright light.","D. react to loud noises.","E. maintain proper posture."]},{"id":"m5-c14-mc15","ch":14,"section":"MC","q":"Difficulty in swallowing may be a sign of damage to which cranial nerve(s)?","a":"E. glossopharyngeal and vagus","opts":["A. vagus","B. facial","C. glossopharyngeal","D. hypoglossal","E. glossopharyngeal and vagus"]},{"id":"m5-c14-mc16","ch":14,"section":"MC","q":"Droopy eyelids and double vision can result from injury to the ________ nerve.","a":"B. oculomotor","opts":["A. optic","B. oculomotor","C. trochlear","D. olfactory","E. abducens"]},{"id":"m5-c14-mc17","ch":14,"section":"MC","q":"Ependymal cells work to","a":"E. All of the answers are correct.","opts":["A. surround the capillaries of the choroid plexus.","B. secrete CSF into the ventricles.","C. remove waste products from CSF.","D. adjust the composition of CSF.","E. All of the answers are correct."]},{"id":"m5-c14-mc18","ch":14,"section":"MC","q":"Excitation of neurons in the basal nuclei would lead to","a":"A. increased muscle tone.","opts":["A. increased muscle tone.","B. loss of consciousness.","C. inability to sense pain.","D. sexual arousal.","E. involuntary speech production."]},{"id":"m5-c14-mc19","ch":14,"section":"MC","q":"Higher-order functions","a":"E. All of the answers are correct.","opts":["A. can be adjusted over time based on experience.","B. involve complex interactions among areas of the cortex.","C. combine both conscious and unconscious information processing.","D. occur in the cerebrum.","E. All of the answers are correct."]},{"id":"m5-c14-mc20","ch":14,"section":"MC","q":"Hydrocephalus or \"water on the brain\" may result from","a":"E. blockage of CSF circulation or excessive CSF production.","opts":["A. deficient production of cerebrospinal fluid.","B. excessive production of cerebrospinal fluid.","C. blockage of circulation of CSF.","D. excessive water intake.","E. blockage of CSF circulation or excessive CSF production."]},{"id":"m5-c14-mc21","ch":14,"section":"MC","q":"Male brains are typically ________ compared to female brains.","a":"A. larger","opts":["A. larger","B. smaller","C. the same size","D. very smooth","E. more convoluted"]},{"id":"m5-c14-mc22","ch":14,"section":"MC","q":"Olfactory receptors send axons through the cribriform plate and synapse on neurons in the","a":"D. olfactory bulb.","opts":["A. medulla.","B. thalamus.","C. cerebral cortex.","D. olfactory bulb.","E. olfactory tract."]},{"id":"m5-c14-mc23","ch":14,"section":"MC","q":"Parkinson's disease is the result of","a":"C. inadequate production of dopamine by substantia nigra neurons.","opts":["A. inadequate production of GABA by neurons in the basal nuclei.","B. decreased levels of acetylcholine from neurons in the substantia nigra.","C. inadequate production of dopamine by substantia nigra neurons.","D. hyperactivity of the limbic system.","E. weak response of the red nuclei of the mesencephalon."]},{"id":"m5-c14-mc24","ch":14,"section":"MC","q":"Sensory information is processed and relayed to the cerebrum by the","a":"D. thalamus.","opts":["A. medulla oblongata.","B. pons.","C. midbrain.","D. thalamus.","E. cerebellum."]},{"id":"m5-c14-mc25","ch":14,"section":"MC","q":"The ________ filters and relays sensory information to cerebral cortex.","a":"B. thalamus","opts":["A. cerebrum","B. thalamus","C. pons","D. medulla oblongata","E. cerebellum"]},{"id":"m5-c14-mc26","ch":14,"section":"MC","q":"The ________ is important in storage and recall of new long-term memories.","a":"D. hippocampus","opts":["A. amygdaloid body","B. cingulate gyrus","C. mamillary bodies","D. hippocampus","E. fornix"]},{"id":"m5-c14-mc27","ch":14,"section":"MC","q":"The ________ is located at the tip of the tail of the caudate nucleus.","a":"A. amygdaloid body","opts":["A. amygdaloid body","B. claustrum","C. putamen","D. globus pallidus","E. corpus striatum"]},{"id":"m5-c14-mc28","ch":14,"section":"MC","q":"The ________ receive visual input from the lateral geniculates.","a":"D. superior colliculi","opts":["A. substantia nigra","B. red nuclei","C. cerebral peduncles","D. superior colliculi","E. inferior colliculi"]},{"id":"m5-c14-mc29","ch":14,"section":"MC","q":"The ________ relay auditory information to the auditory cortex.","a":"C. medial geniculates","opts":["A. pulvinar","B. lateral geniculates","C. medial geniculates","D. supraoptic nuclei","E. paraventricular nuclei"]},{"id":"m5-c14-mc30","ch":14,"section":"MC","q":"The auditory cortex is located in the","a":"C. temporal lobe.","opts":["A. frontal lobe.","B. parietal lobe.","C. temporal lobe.","D. occipital lobe.","E. insula."]},{"id":"m5-c14-mc31","ch":14,"section":"MC","q":"The basal nuclei","a":"B. provide the general pattern and rhythm for movements such as walking.","opts":["A. plan and coordinate voluntary muscle activity.","B. provide the general pattern and rhythm for movements such as walking.","C. coordinate sensory information.","D. control the secretions of the pituitary gland.","E. control respiration and blood pressure."]},{"id":"m5-c14-mc32","ch":14,"section":"MC","q":"The brain requires a substantial blood supply. The vessels that deliver blood to the brain are the","a":"D. internal carotid and vertebral arteries.","opts":["A. external carotid arteries.","B. facial arteries.","C. jugular veins.","D. internal carotid and vertebral arteries.","E. dural sinuses."]},{"id":"m5-c14-mc33","ch":14,"section":"MC","q":"The cerebral area posterior to the central sulcus is the","a":"A. parietal lobe.","opts":["A. parietal lobe.","B. temporal lobe.","C. frontal lobe.","D. occipital lobe.","E. insula."]},{"id":"m5-c14-mc34","ch":14,"section":"MC","q":"The control of heart rate and blood pressure is based in the","a":"D. medulla oblongata.","opts":["A. cerebrum.","B. cerebellum.","C. diencephalon.","D. medulla oblongata.","E. heart."]},{"id":"m5-c14-mc35","ch":14,"section":"MC","q":"The corpus callosum is composed of","a":"D. commissural fibers.","opts":["A. arcuate fibers.","B. longitudinal fasciculi.","C. association fibers.","D. commissural fibers.","E. projection fibers."]},{"id":"m5-c14-mc36","ch":14,"section":"MC","q":"The dural sinuses are located in the","a":"D. dural folds.","opts":["A. paranasal cavity.","B. arachnoid.","C. pia mater.","D. dural folds.","E. tentorium cerebelli."]},{"id":"m5-c14-mc37","ch":14,"section":"MC","q":"The floor of the diencephalon is formed by the","a":"A. hypothalamus.","opts":["A. hypothalamus.","B. thalamus.","C. brain stem.","D. mesencephalon.","E. myelencephalon."]},{"id":"m5-c14-mc38","ch":14,"section":"MC","q":"The general interpretive area","a":"D. allows us to interpret what is read or heard.","opts":["A. is the speech center of the brain.","B. is responsible for predicting future consequences.","C. is the site of long-term memory storage.","D. allows us to interpret what is read or heard.","E. may be damaged by even a small stroke."]},{"id":"m5-c14-mc39","ch":14,"section":"MC","q":"The highest levels of information processing occur in the","a":"A. cerebrum.","opts":["A. cerebrum.","B. diencephalon.","C. cerebellum.","D. medulla oblongata.","E. corpus callosum."]},{"id":"m5-c14-mc40","ch":14,"section":"MC","q":"The mamillary bodies of the hypothalamus","a":"C. control feeding reflexes.","opts":["A. regulate lactation.","B. secrete oxytocin.","C. control feeding reflexes.","D. control heart rate and blood pressure.","E. secrete antidiuretic hormone."]},{"id":"m5-c14-mc41","ch":14,"section":"MC","q":"The medial nuclei of the thalamus","a":"B. connect emotional centers in the hypothalamus with the frontal lobe.","opts":["A. are part of the limbic system.","B. connect emotional centers in the hypothalamus with the frontal lobe.","C. produce the hormone oxytocin.","D. process visual information.","E. process olfactory information."]},{"id":"m5-c14-mc42","ch":14,"section":"MC","q":"The layer of the meninges that closely follows every gyrus and sulcus is the","a":"A. pia mater.","opts":["A. pia mater.","B. dura mater.","C. arachnoid membrane.","D. neural cortex.","E. subarachnoid mater."]},{"id":"m5-c14-mc43","ch":14,"section":"MC","q":"The internal capsule of the cerebrum is composed of","a":"E. projection fibers.","opts":["A. arcuate fibers.","B. longitudinal fasciculi.","C. association fibers.","D. commissural fibers.","E. projection fibers."]},{"id":"m5-c14-mc44","ch":14,"section":"MC","q":"The medulla oblongata relays auditory information to the","a":"E. inferior colliculi.","opts":["A. substantia nigra.","B. red nuclei.","C. cerebral peduncles.","D. superior colliculi.","E. inferior colliculi."]},{"id":"m5-c14-mc45","ch":14,"section":"MC","q":"The primary motor cortex is the surface of the","a":"B. precentral gyrus.","opts":["A. insula.","B. precentral gyrus.","C. postcentral gyrus.","D. arcuate gyrus.","E. corpus callosum."]},{"id":"m5-c14-mc46","ch":14,"section":"MC","q":"The presence of many large, highly-branched Purkinje cells in a sample of brain tissue indicates that it came from the","a":"D. cerebellar cortex.","opts":["A. pons.","B. medulla.","C. cerebral cortex.","D. cerebellar cortex.","E. arbor vitae."]},{"id":"m5-c14-mc47","ch":14,"section":"MC","q":"The reflex movement of the head toward a loud noise is directed by the mesencephalon. Which nuclei accomplish this?","a":"E. inferior colliculi","opts":["A. substantia nigra","B. red nuclei","C. tectum","D. superior colliculi","E. inferior colliculi"]},{"id":"m5-c14-mc48","ch":14,"section":"MC","q":"The region of the brain responsible for predicting the consequence of events or actions is the","a":"A. prefrontal cerebral cortex.","opts":["A. prefrontal cerebral cortex.","B. occipital association cortex.","C. reticular formation.","D. temporal lobe.","E. cerebral ganglia."]},{"id":"m5-c14-mc49","ch":14,"section":"MC","q":"The respiratory rhythmicity center is located in","a":"C. the medulla oblongata.","opts":["A. the pons.","B. the cerebrum.","C. the medulla oblongata.","D. the cerebellum.","E. the midbrain."]},{"id":"m5-c14-mc50","ch":14,"section":"MC","q":"The thin partition that separates the first and second ventricles is the","a":"B. septum pellucidum.","opts":["A. falx cerebri.","B. septum pellucidum.","C. septum insula.","D. interventricular foramina.","E. cerebral aqueduct."]},{"id":"m5-c14-mc51","ch":14,"section":"MC","q":"The third and fourth ventricles are linked by a slender canal designated as the","a":"C. cerebral aqueduct.","opts":["A. central canal.","B. tentorium cerebelli.","C. cerebral aqueduct.","D. interventricular foramina.","E. pontine canal."]},{"id":"m5-c14-mc52","ch":14,"section":"MC","q":"The tympanic reflex","a":"B. restricts the movement of auditory ossicles.","opts":["A. produces rapid blinking when something comes into contact with the cornea.","B. restricts the movement of auditory ossicles.","C. triggers a blink in response to sudden noises.","D. causes the eyes to move in the opposite direction of a rotational movement of the head.","E. causes the pupil of the eye to constrict when subjected to a bright light."]},{"id":"m5-c14-mc53","ch":14,"section":"MC","q":"The visual cortex is located in the","a":"D. occipital lobe.","opts":["A. frontal lobe.","B. parietal lobe.","C. temporal lobe.","D. occipital lobe.","E. insula."]},{"id":"m5-c14-mc54","ch":14,"section":"MC","q":"The white matter of the cerebellum forms the","a":"B. arbor vitae.","opts":["A. flocculonodular lobe.","B. arbor vitae.","C. folia.","D. vermis.","E. pyramid."]},{"id":"m5-c14-mc55","ch":14,"section":"MC","q":"The ventricle associated with the pons and upper medulla is the","a":"D. fourth.","opts":["A. first.","B. second.","C. third.","D. fourth.","E. lateral."]},{"id":"m5-c14-mc56","ch":14,"section":"MC","q":"The two cerebral hemispheres are separated by the","a":"A. longitudinal fissure.","opts":["A. longitudinal fissure.","B. central sulcus.","C. transverse fissure.","D. parieto-occipital sulcus.","E. postcentral sulcus."]},{"id":"m5-c14-mc57","ch":14,"section":"MC","q":"There are ________ pairs of cranial nerves.","a":"C. 12","opts":["A. 2","B. 6","C. 12","D. 22","E. 31"]},{"id":"m5-c14-mc58","ch":14,"section":"MC","q":"What contains a spider web-like network of cells and fibers through which cerebrospinal fluid flows?","a":"D. subarachnoid space","opts":["A. subdural space","B. dural sinus","C. falx cerebri","D. subarachnoid space","E. pia mater"]},{"id":"m5-c14-mc59","ch":14,"section":"MC","q":"What structure is covered by many blood vessels and adheres tightly to the surface of the brain?","a":"A. pia mater","opts":["A. pia mater","B. arachnoid","C. dura mater","D. cranial plexus","E. choroid plexus"]},{"id":"m5-c14-mc60","ch":14,"section":"MC","q":"________ centers receive information from many association areas and direct extremely complex motor activities such as speech.","a":"B. Integrative","opts":["A. Frontal","B. Integrative","C. Communication","D. Terminal","E. Vocal"]},{"id":"m5-c14-mc61","ch":14,"section":"MC","q":"________ is a disorder affecting the ability to speak or read.","a":"A. Aphasia","opts":["A. Aphasia","B. Ataxia","C. Apraxia","D. Bell's palsy","E. Dysphagia"]},{"id":"m5-c14-mc62","ch":14,"section":"MC","q":"________ is a temporary cerebral disorder accompanied by abnormal movements, unusual sensations, and/or inappropriate behavior.","a":"E. A seizure","opts":["A. Dyslexia","B. Apraxia","C. Aphasia","D. Parkinson's disease","E. A seizure"]},{"id":"m5-c12-lab1","ch":12,"section":"Lab","q":"The ________ nervous system is composed of the brain and spinal cord. The nervous tissue outside the CNS composes the ________ nervous system. The basic functional unit of the nervous system is the ________. Neuron cell bodies in the PNS are clustered together in masses called ________.","a":"central (CNS); peripheral (PNS); neuron; ganglia"},{"id":"m5-c12-lab2","ch":12,"section":"Lab","q":"The part of the PNS that carries sensory information to the CNS is designated ________ and the part that carries motor information from the CNS is called ________ (innervates skeletal, smooth, and cardiac muscle and glands).","a":"afferent (sensory division); efferent (motor division)"},{"id":"m5-c12-lab3","ch":12,"section":"Lab","q":"The cytoplasm that surrounds the nucleus of a neuron is called the ________. Clusters of RER and free ribosomes in neurons are called ________ bodies. The axon is connected to the soma at the axon ________. Branches that may occur along an axon are called ________. Axons terminate in a series of fine extensions known as ________. The site of intercellular communication between a neuron and another cell is the ________.","a":"perikaryon (cell body cytoplasm); Nissl bodies (chromatophilic substance); hillock (axon hillock); collaterals; axon terminals (telodendria); synapse"},{"id":"m5-c12-lab4","ch":12,"section":"Lab","q":"Neurons in which dendritic and axonal processes are continuous and the soma lies off to one side are called ________. Neurons that have one axon and one dendrite with the soma in between are called ________. Neurons that have several dendrites and a single axon are called ________ (the most common class in the CNS).","a":"unipolar (pseudounipolar); bipolar; multipolar"},{"id":"m5-c12-lab5","ch":12,"section":"Lab","q":"Sensory neurons of the PNS are ________ (they form the afferent division of the PNS).","a":"unipolar (pseudounipolar)"},{"id":"m5-c12-lab6","ch":12,"section":"Lab","q":"Most CNS neurons lack ________, which explains why they cannot divide to regenerate damaged tissue.","a":"centrioles"},{"id":"m5-c12-lab7","ch":12,"section":"Lab","q":"Label the major parts of a multipolar (motor) neuron.","a":"Dendrites; cell body / soma (with nucleus, nucleolus, and Nissl bodies); axon hillock; axon (nerve fiber); myelin sheath (made by Schwann cells in the PNS); nodes of Ranvier; axon terminals (synaptic bulbs/boutons)"},{"id":"m5-c12-lab8","ch":12,"section":"Lab","q":"Deteriorating changes in the distal segment of an axon because of a break between it and the soma is called ________ degeneration.","a":"Wallerian degeneration"},{"id":"m5-c12-lab9","ch":12,"section":"Lab","q":"________ account for about half of the volume of the nervous system. The largest and most numerous glial cells in the CNS are the ________. A type of glial cell found in the PNS are ________ cells. ________ cells line the brain ventricles and spinal canal.","a":"Neuroglia (glial cells); astrocytes; Schwann (and satellite) cells; ependymal cells"},{"id":"m5-c12-lab10","ch":12,"section":"Lab","q":"The neuroglial cells that participate in maintaining the blood-brain barrier are the ________. The myelin sheath that covers many CNS axons is formed by ________.","a":"astrocytes; oligodendrocytes"},{"id":"m5-c12-lab11","ch":12,"section":"Lab","q":"Small, wandering cells that engulf cell debris and pathogens in the CNS are called ________. The neurilemma of axons in the PNS is formed by ________ cells. Glial cells that surround the neurons in ganglia are ________ cells.","a":"microglia; Schwann cells; satellite cells"},{"id":"m5-c12-lab12","ch":12,"section":"Lab","q":"Many medications introduced into the bloodstream cannot directly affect the neurons of the CNS because the endothelium of CNS capillaries forms a ________ barrier.","a":"blood-brain barrier"},{"id":"m5-c12-lab13","ch":12,"section":"Lab","q":"Extensive damage to ________ in the CNS could result in loss of sensation and motor control. Damage to ________ cells would affect the formation of cerebrospinal fluid.","a":"neurons; ependymal cells"},{"id":"m5-c12-lab15","ch":12,"section":"Lab","q":"Ion channels that are always open are called ________ channels. Opening of sodium channels in the axon membrane causes ________.","a":"leak (leakage) channels; depolarization"},{"id":"m5-c12-lab16","ch":12,"section":"Lab","q":"The ________ ion exchange pump moves sodium and potassium opposite to the direction of their electrochemical gradients.","a":"sodium-potassium (Na+/K+) pump"},{"id":"m5-c12-lab17","ch":12,"section":"Lab","q":"During repolarization of a neuron, ________ ions move out of the cell.","a":"potassium (K+)"},{"id":"m5-c13-lab1","ch":13,"section":"Lab","q":"The spinal cord is part of the ________ nervous system. The spinal cord consists of five regions and ________ segments.","a":"central (CNS); 31"},{"id":"m5-c13-lab2","ch":13,"section":"Lab","q":"The filum ________ is a strand of fibrous tissue that provides longitudinal support as a component of the coccygeal ligament.","a":"terminale"},{"id":"m5-c13-lab3","ch":13,"section":"Lab","q":"The dorsal root ganglia contain ________ of sensory neurons. The dorsal root of a spinal nerve contains ________ of sensory neurons.","a":"cell bodies (somata); axons"},{"id":"m5-c13-lab4","ch":13,"section":"Lab","q":"The ventral root of a spinal nerve contains axons of ________ neurons. A dorsal and ventral root of each spinal segment unite to form a ________ nerve.","a":"motor (somatic motor / efferent); spinal"},{"id":"m5-c13-lab5","ch":13,"section":"Lab","q":"The specialized membranes that surround the spinal cord are the spinal ________. The tough, fibrous, outermost covering is the ________ mater. The subdural space lies between the dura mater and the ________ mater. The layer in direct contact with the spinal cord is the ________ mater. Inflammation of the meninges from bacteria or virus is ________. CSF flows within the ________ space.","a":"meninges; dura mater; arachnoid mater; pia mater; meningitis; subarachnoid space"},{"id":"m5-c13-lab6","ch":13,"section":"Lab","q":"An ________ block is commonly used for pain control during labor and delivery. Samples of CSF for diagnostic purposes are normally obtained by placing the tip of a needle in the ________ space.","a":"epidural; subarachnoid (lumbar puncture / spinal tap)"},{"id":"m5-c13-lab7","ch":13,"section":"Lab","q":"Ben contracts a viral disease that destroys cells in the posterior (dorsal) gray horns of his spinal cord. As a result, which of the following would you expect?","a":"Loss of sensation (sensory deficits) in the body regions served by those segments. The posterior/dorsal horns process incoming sensory information; motor function is preserved because somatic motor neurons are in the anterior (ventral) horns."},{"id":"m5-c13-lab8","ch":13,"section":"Lab","q":"The ________ matter of the spinal cord is myelinated and unmyelinated axons. The outward projections from the central gray matter are called ________. The gray horns contain nerve cell bodies. The posterior horns contain mainly ________ nuclei. The anterior horns contain somatic ________ nuclei.","a":"white; (gray) horns; sensory; motor"},{"id":"m5-c13-lab9","ch":13,"section":"Lab","q":"In the spinal cord, white matter is separated into ascending and descending tracts organized as ________ columns.","a":"white columns (funiculi) - the posterior, lateral, and anterior funiculi"},{"id":"m5-c13-lab10","ch":13,"section":"Lab","q":"Axons crossing from one side of the spinal cord to the other within the gray matter are found in the gray ________.","a":"commissure (the anterior and posterior gray commissures, which enclose the central canal)"},{"id":"m5-c13-lab11","ch":13,"section":"Lab","q":"Muscles of the neck and shoulder are innervated by spinal nerves from the ________ cervical region. The ventral rami of spinal nerves C5 to T1 contribute fibers to the ________ plexus.","a":"cervical (cervical plexus, C1-C5); brachial"},{"id":"m5-c13-lab12","ch":13,"section":"Lab","q":"The ulnar nerve arises from the ________ plexus. Spinal nerves from the sacral region of the cord innervate the ________ muscles.","a":"brachial; lower limb / leg (via the sciatic nerve of the sacral plexus)"},{"id":"m5-c13-lab13","ch":13,"section":"Lab","q":"In the condition ________, a virus infects dorsal root ganglia, causing a painful rash whose distribution corresponds to the dermatomes of the affected sensory nerves.","a":"shingles (herpes zoster)"},{"id":"m5-c13-lab14","ch":13,"section":"Lab","q":"The layer of connective tissue that surrounds a fascicle within a peripheral nerve is the ________. The layer of connective tissue that surrounds individual axons within a peripheral nerve is the ________.","a":"perineurium; endoneurium"},{"id":"m5-c13-lab15","ch":13,"section":"Lab","q":"The complex, interwoven network formed by contributions from the ventral rami of neighboring spinal nerves is termed a ________.","a":"(nerve) plexus"}]},{"key":"m1x","name":"Module 1 Extra","sub":"Regions · Quadrants · Organ Systems · Prefixes/Roots/Suffixes","cards":[{"id":"m1x-extra1","ch":1,"section":"Extra","q":"What organs are in the RIGHT HYPOCHONDRIAC region?","a":"Liver (right lobe), gallbladder"},{"id":"m1x-extra2","ch":1,"section":"Extra","q":"What organs are in the EPIGASTRIC region?","a":"Stomach (most), part of liver, pancreas, duodenum"},{"id":"m1x-extra3","ch":1,"section":"Extra","q":"What organs are in the LEFT HYPOCHONDRIAC region?","a":"Spleen, part of stomach, tail of pancreas, left kidney"},{"id":"m1x-extra4","ch":1,"section":"Extra","q":"What organs are in the RIGHT LUMBAR region?","a":"Ascending colon, right kidney"},{"id":"m1x-extra5","ch":1,"section":"Extra","q":"What organs are in the UMBILICAL region?","a":"Small intestine (jejunum, ileum), transverse colon"},{"id":"m1x-extra6","ch":1,"section":"Extra","q":"What organs are in the LEFT LUMBAR region?","a":"Descending colon, left kidney"},{"id":"m1x-extra7","ch":1,"section":"Extra","q":"What organs are in the RIGHT ILIAC (INGUINAL) region?","a":"Cecum, appendix, end of ascending colon"},{"id":"m1x-extra8","ch":1,"section":"Extra","q":"What organs are in the HYPOGASTRIC (PUBIC) region?","a":"Urinary bladder, sigmoid colon, rectum; uterus (female)"},{"id":"m1x-extra9","ch":1,"section":"Extra","q":"What organs are in the LEFT ILIAC (INGUINAL) region?","a":"Sigmoid colon, end of descending colon"},{"id":"m1x-extra10","ch":1,"section":"Extra","q":"What organs are in the RUQ (Right Upper Quadrant)?","a":"Liver (right lobe), gallbladder, right kidney, part of stomach, duodenum, part of pancreas, hepatic flexure of colon"},{"id":"m1x-extra11","ch":1,"section":"Extra","q":"What organs are in the LUQ (Left Upper Quadrant)?","a":"Spleen, stomach (most), left lobe of liver, pancreas (body & tail), left kidney, splenic flexure of colon"},{"id":"m1x-extra12","ch":1,"section":"Extra","q":"What organs are in the RLQ (Right Lower Quadrant)?","a":"Cecum, appendix, ascending colon (start), parts of small intestine, right ovary & fallopian tube (female), right ureter"},{"id":"m1x-extra13","ch":1,"section":"Extra","q":"What organs are in the LLQ (Left Lower Quadrant)?","a":"Descending colon, sigmoid colon, parts of small intestine, left ovary & fallopian tube (female), left ureter"},{"id":"m1x-extra14","ch":1,"section":"Extra","q":"Name the major organs and function of the INTEGUMENTARY SYSTEM.","a":"Organs: skin, hair, nails, sweat & sebaceous glands. Function: protection, thermoregulation, vitamin D synthesis, sensation."},{"id":"m1x-extra15","ch":1,"section":"Extra","q":"Name the major organs and function of the SKELETAL SYSTEM.","a":"Organs: bones, cartilage, joints, ligaments, tendons. Function: support, movement, protection, mineral storage (Ca), hematopoiesis."},{"id":"m1x-extra16","ch":1,"section":"Extra","q":"Name the major organs and function of the MUSCULAR SYSTEM.","a":"Organs: skeletal muscles. Function: movement, posture, heat production."},{"id":"m1x-extra17","ch":1,"section":"Extra","q":"Name the major organs and function of the NERVOUS SYSTEM.","a":"Organs: brain, spinal cord, nerves. Function: fast electrical control; sensation; information processing."},{"id":"m1x-extra18","ch":1,"section":"Extra","q":"Name the major organs and function of the ENDOCRINE SYSTEM.","a":"Organs: thyroid, pancreas, adrenal, pituitary, gonads (testes/ovaries). Function: hormonal control of body functions; maintains homeostasis."},{"id":"m1x-extra19","ch":1,"section":"Extra","q":"Name the major organs and function of the CARDIOVASCULAR SYSTEM.","a":"Organs: heart, blood vessels, blood. Function: transport of O₂, nutrients, wastes, hormones."},{"id":"m1x-extra20","ch":1,"section":"Extra","q":"Name the major organs and function of the LYMPHATIC / IMMUNE SYSTEM.","a":"Organs: lymph nodes & vessels, spleen, thymus, tonsils. Function: immunity, fluid balance, fights infection."},{"id":"m1x-extra21","ch":1,"section":"Extra","q":"Name the major organs and function of the RESPIRATORY SYSTEM.","a":"Organs: nasal cavity, pharynx, larynx, trachea, bronchi, lungs. Function: gas exchange (O₂ in, CO₂ out); blood pH; voice."},{"id":"m1x-extra22","ch":1,"section":"Extra","q":"Name the major organs and function of the DIGESTIVE SYSTEM.","a":"Organs: oral cavity, esophagus, stomach, intestines, liver, gallbladder, pancreas, salivary glands. Function: break down food, absorb nutrients, eliminate waste."},{"id":"m1x-extra23","ch":1,"section":"Extra","q":"Name the major organs and function of the URINARY SYSTEM.","a":"Organs: kidneys, ureters, bladder, urethra. Function: remove wastes; fluid/electrolyte/pH balance."},{"id":"m1x-extra24","ch":1,"section":"Extra","q":"Name the major organs and function of the REPRODUCTIVE SYSTEM.","a":"Male: testes, ducts, prostate, seminal vesicles, penis, scrotum. Female: ovaries, fallopian tubes, uterus, cervix, vagina, mammary glands. Function: produce gametes and sex hormones; female: house developing fetus, lactation."},{"id":"m1x-extra25","ch":1,"section":"Extra","q":"Which organ system contains the SPLEEN and TONSILS?","a":"Lymphatic / Immune system"},{"id":"m1x-extra26","ch":1,"section":"Extra","q":"Which organ system contains the THYROID and ADRENAL GLANDS?","a":"Endocrine system"},{"id":"m1x-extra27","ch":1,"section":"Extra","q":"Which organ system contains the KIDNEYS and URETERS?","a":"Urinary system"},{"id":"m1x-extra28","ch":1,"section":"Extra","q":"Which organ system contains the LIVER?","a":"Digestive system"},{"id":"m1x-extra29","ch":1,"section":"Extra","q":"Which organ system contains BLOOD and BLOOD VESSELS?","a":"Cardiovascular system"},{"id":"m1x-extra30","ch":1,"section":"Extra","q":"Which organ system contains SKIN, HAIR, and NAILS?","a":"Integumentary system"},{"id":"m1x-extra31","ch":1,"section":"Extra","q":"Which organ system contains the BRAIN and SPINAL CORD?","a":"Nervous system"},{"id":"m1x-extra32","ch":1,"section":"Extra","q":"Which organ system contains the LUNGS and TRACHEA?","a":"Respiratory system"},{"id":"m1x-extra33","ch":1,"section":"Extra","q":"Which organ system contains BONES and JOINTS?","a":"Skeletal system"},{"id":"m1x-extra34","ch":1,"section":"Extra","q":"Why do TESTES and OVARIES belong to TWO organ systems?","a":"They are part of BOTH the reproductive system (produce gametes) AND the endocrine system (produce sex hormones)."},{"id":"m1x-extra35","ch":1,"section":"Extra","q":"The PANCREAS belongs to TWO organ systems — which?","a":"Digestive system (produces digestive enzymes) AND endocrine system (produces insulin and glucagon)."},{"id":"m1x-extra36","ch":1,"section":"Extra","q":"What does the prefix 'a-' or 'an-' mean?","a":"Without, lack of (e.g., anemia = lack of blood cells)"},{"id":"m1x-extra37","ch":1,"section":"Extra","q":"What does the prefix 'ab-' mean?","a":"Away from (e.g., abduction = move away from midline)"},{"id":"m1x-extra38","ch":1,"section":"Extra","q":"What does the prefix 'ad-' mean?","a":"Toward (e.g., adduction = move toward midline)"},{"id":"m1x-extra39","ch":1,"section":"Extra","q":"What does the prefix 'ante-' mean?","a":"Before, in front of (e.g., antecubital = front of elbow)"},{"id":"m1x-extra40","ch":1,"section":"Extra","q":"What does the prefix 'anti-' mean?","a":"Against (e.g., antibiotic = against bacteria)"},{"id":"m1x-extra41","ch":1,"section":"Extra","q":"What does the root 'arthr/o-' mean?","a":"Joint (e.g., arthritis = joint inflammation)"},{"id":"m1x-extra42","ch":1,"section":"Extra","q":"What does the prefix 'bi-' mean?","a":"Two (e.g., biceps = two heads)"},{"id":"m1x-extra43","ch":1,"section":"Extra","q":"What does the prefix 'brady-' mean?","a":"Slow (e.g., bradycardia = slow heart rate)"},{"id":"m1x-extra44","ch":1,"section":"Extra","q":"What does the root 'cardi/o-' mean?","a":"Heart (e.g., cardiomyopathy = heart muscle disease)"},{"id":"m1x-extra45","ch":1,"section":"Extra","q":"What does the root 'cephal/o-' mean?","a":"Head (e.g., cephalic = pertaining to the head)"},{"id":"m1x-extra46","ch":1,"section":"Extra","q":"What does the root 'chondr/o-' mean?","a":"Cartilage (e.g., chondrocyte = cartilage cell)"},{"id":"m1x-extra47","ch":1,"section":"Extra","q":"What does the prefix 'circum-' mean?","a":"Around (e.g., circumduction = circular movement)"},{"id":"m1x-extra48","ch":1,"section":"Extra","q":"What does the prefix 'contra-' mean?","a":"Opposite, against (e.g., contralateral = opposite side)"},{"id":"m1x-extra49","ch":1,"section":"Extra","q":"What does 'cyt/o-' or '-cyte' mean?","a":"Cell (e.g., cytology = study of cells; leukocyte = white blood cell)"},{"id":"m1x-extra50","ch":1,"section":"Extra","q":"What does 'derm/o-' or 'dermat/o-' mean?","a":"Skin (e.g., dermatology = study of skin)"},{"id":"m1x-extra51","ch":1,"section":"Extra","q":"What does the prefix 'dys-' mean?","a":"Bad, difficult, abnormal (e.g., dyspnea = difficult breathing)"},{"id":"m1x-extra52","ch":1,"section":"Extra","q":"What does the suffix '-ectomy' mean?","a":"Surgical removal (e.g., appendectomy = removal of appendix)"},{"id":"m1x-extra53","ch":1,"section":"Extra","q":"What does the suffix '-emia' mean?","a":"Blood condition (e.g., hyperglycemia = high blood sugar)"},{"id":"m1x-extra54","ch":1,"section":"Extra","q":"What does the prefix 'endo-' mean?","a":"Within, inside (e.g., endocrine = secrete within the body)"},{"id":"m1x-extra55","ch":1,"section":"Extra","q":"What does the prefix 'epi-' mean?","a":"Upon, over, on top of (e.g., epidermis = upon the skin)"},{"id":"m1x-extra56","ch":1,"section":"Extra","q":"What does the root 'erythr/o-' mean?","a":"Red (e.g., erythrocyte = red blood cell)"},{"id":"m1x-extra57","ch":1,"section":"Extra","q":"What does the prefix 'extra-' mean?","a":"Outside of (e.g., extracellular = outside the cell)"},{"id":"m1x-extra58","ch":1,"section":"Extra","q":"What does the root 'gastr/o-' mean?","a":"Stomach (e.g., gastritis = stomach inflammation)"},{"id":"m1x-extra59","ch":1,"section":"Extra","q":"What does the prefix 'hemi-' mean?","a":"Half (e.g., hemisphere = half a sphere)"},{"id":"m1x-extra60","ch":1,"section":"Extra","q":"What does 'hem/o-' or 'hemat/o-' mean?","a":"Blood (e.g., hematology = study of blood)"},{"id":"m1x-extra61","ch":1,"section":"Extra","q":"What does the root 'hepat/o-' mean?","a":"Liver (e.g., hepatitis = liver inflammation)"},{"id":"m1x-extra62","ch":1,"section":"Extra","q":"What does the prefix 'hyper-' mean?","a":"Above, excessive, over (e.g., hypertension = high blood pressure)"},{"id":"m1x-extra63","ch":1,"section":"Extra","q":"What does the prefix 'hypo-' mean?","a":"Below, deficient, under (e.g., hypothermia = low body temperature)"},{"id":"m1x-extra64","ch":1,"section":"Extra","q":"What does the prefix 'infra-' mean?","a":"Below, beneath (e.g., infraorbital = below the eye)"},{"id":"m1x-extra65","ch":1,"section":"Extra","q":"What does the prefix 'inter-' mean?","a":"Between (e.g., intercostal = between the ribs)"},{"id":"m1x-extra66","ch":1,"section":"Extra","q":"What does the prefix 'intra-' mean?","a":"Within (e.g., intracellular = within the cell)"},{"id":"m1x-extra67","ch":1,"section":"Extra","q":"What does the suffix '-itis' mean?","a":"Inflammation (e.g., arthritis = joint inflammation)"},{"id":"m1x-extra68","ch":1,"section":"Extra","q":"What does the root 'leuk/o-' mean?","a":"White (e.g., leukocyte = white blood cell)"},{"id":"m1x-extra69","ch":1,"section":"Extra","q":"What does the prefix 'macro-' mean?","a":"Large (e.g., macrophage = large eating cell)"},{"id":"m1x-extra70","ch":1,"section":"Extra","q":"What does the prefix 'micro-' mean?","a":"Small (e.g., microscope = device to see small things)"},{"id":"m1x-extra71","ch":1,"section":"Extra","q":"What does the root 'my/o-' mean?","a":"Muscle (e.g., myocardium = heart muscle)"},{"id":"m1x-extra72","ch":1,"section":"Extra","q":"What does the root 'neur/o-' mean?","a":"Nerve (e.g., neuron = nerve cell)"},{"id":"m1x-extra73","ch":1,"section":"Extra","q":"What does the suffix '-ology' or '-logy' mean?","a":"Study of (e.g., physiology = study of function)"},{"id":"m1x-extra74","ch":1,"section":"Extra","q":"What does the suffix '-oma' mean?","a":"Tumor, mass (e.g., carcinoma = epithelial cancer)"},{"id":"m1x-extra75","ch":1,"section":"Extra","q":"What does the root 'oste/o-' mean?","a":"Bone (e.g., osteoporosis = bone disease)"},{"id":"m1x-extra76","ch":1,"section":"Extra","q":"What does the prefix 'para-' mean?","a":"Beside, near (e.g., parathyroid = beside the thyroid)"},{"id":"m1x-extra77","ch":1,"section":"Extra","q":"What does the prefix 'peri-' mean?","a":"Around (e.g., pericardium = around the heart)"},{"id":"m1x-extra78","ch":1,"section":"Extra","q":"What does the root 'phag/o-' mean?","a":"Eating, engulfing (e.g., phagocytosis = cell eating)"},{"id":"m1x-e
