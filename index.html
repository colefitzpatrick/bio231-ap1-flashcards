<!DOCTYPE html>
<html lang="en">
<head>

<title>BIO 231 A&P I — Flashcards</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#273449;--text:#e2e8f0;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--accent:#38bdf8;--border:#334155;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px;}
h1{font-size:20px;margin:6px 0 2px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
.module{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.module h2{font-size:16px;margin:0 0 2px;}
.module .msub{color:var(--muted);font-size:12px;margin-bottom:10px;}
.stats{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap;}
.stats b{color:var(--text);}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-weight:600;}
.btn-all{background:var(--accent);color:#04222e;flex:1;min-width:120px;}
.btn-missed{background:var(--panel2);color:var(--text);border:1px solid var(--border);flex:1;min-width:120px;}
button:disabled{opacity:.4;cursor:not-allowed;}
.link{background:none;color:var(--muted);text-decoration:underline;padding:6px;font-weight:500;font-size:13px;}
#study,#result{display:none;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);}
.tally .g{color:var(--green);font-weight:700;}
.tally .r{color:var(--red);font-weight:700;}
.progress{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:14px;}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px;text-align:center;cursor:pointer;user-select:none;}
.qlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.qtext{font-size:20px;line-height:1.45;}
.atext{font-size:19px;line-height:1.5;color:#bbf7d0;}
.opts{margin-top:16px;text-align:left;}
.opt{font-size:16px;line-height:1.55;color:#cbd5e1;padding:3px 2px;}
.hint{color:var(--muted);font-size:12px;margin-top:18px;}
.controls{display:flex;gap:12px;margin-top:14px;}
.btn-green{background:var(--green);color:#052e16;flex:1;padding:16px;font-size:16px;}
.btn-red{background:var(--red);color:#450a0a;flex:1;padding:16px;font-size:16px;}
.btn-flip{background:var(--accent);color:#04222e;width:100%;padding:16px;font-size:16px;margin-top:14px;}
.result-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center;}
.result-box h2{margin:0 0 6px;}
.big{font-size:34px;font-weight:800;margin:12px 0;}
.big .mut{color:var(--muted);font-size:20px;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div id="home">
    <h1>BIO 231 &mdash; Anatomy &amp; Physiology I</h1>
    <div class="sub">Practice-bank flashcards &middot; tap a card to flip &middot; mark green/red &middot; your misses are saved on this device</div>
    <div id="modules"></div>
    <button class="link" id="resetBtn">Reset all progress</button>
  </div>

  <div id="study">
    <div class="topbar">
      <button class="link" id="quitBtn">&larr; Menu</button>
      <span id="poslabel"></span>
      <span class="tally"><span class="g" id="gtally">0</span> &middot; <span class="r" id="rtally">0</span></span>
    </div>
    <div class="progress"><div id="progbar"></div></div>
    <div class="card" id="card">
      <div>
        <div class="qlabel" id="qlabel">Question</div>
        <div id="cardtext" class="qtext"></div>
        <div id="cardopts" class="opts" style="display:none;"></div>
        <div class="hint" id="cardhint">tap to reveal &middot; space</div>
      </div>
    </div>
    <button class="btn-flip" id="flipBtn">Show Answer</button>
    <div class="controls" id="controls" style="display:none;">
      <button class="btn-red" id="redBtn">&#10007; Missed</button>
      <button class="btn-green" id="greenBtn">&#10003; Knew it</button>
    </div>
  </div>

  <div id="result">
    <div class="result-box">
      <h2 id="resTitle">Round complete</h2>
      <div class="big"><span class="g" id="resG">0</span> <span class="mut">knew</span> &middot; <span class="r" id="resR">0</span> <span class="mut">missed</span></div>
      <div class="row" style="margin-top:18px;">
        <button class="btn-all" id="reviewMissedBtn">Review missed</button>
        <button class="btn-missed" id="againBtn">Study round again</button>
      </div>
      <button class="link" id="homeBtn" style="margin-top:14px;">&larr; Back to modules</button>
    </div>
  </div>
</div>
<script>
const MODULES = [{"key": "m1", "name": "Module 1", "sub": "Ch 1–3 · Intro · Chemical · Cellular", "cards": [{"id": "m1-c1-q6", "ch": 1, "section": "RQ", "q": "Which of the following specialties might focus on studying all of the structures of the ankle and foot?", "a": "C. regional anatomy", "opts": ["A. microscopic anatomy", "B. muscle anatomy", "C. regional anatomy", "D. systemic anatomy"]}, {"id": "m1-c1-q7", "ch": 1, "section": "RQ", "q": "A scientist wants to study how the body uses foods and fluids during a marathon run. This scientist is most likely a(n) ________.", "a": "A. exercise physiologist", "opts": ["A. exercise physiologist", "B. microscopic anatomist", "C. regional physiologist", "D. systemic anatomist"]}, {"id": "m1-c1-q8", "ch": 1, "section": "RQ", "q": "The smallest independently functioning unit of an organism is a(n) ________.", "a": "A. cell", "opts": ["A. cell", "B. molecule", "C. organ", "D. tissue"]}, {"id": "m1-c1-q9", "ch": 1, "section": "RQ", "q": "A collection of similar tissues that performs a specific function is an ________.", "a": "A. organ", "opts": ["A. organ", "B. organelle", "C. organism", "D. organ system"]}, {"id": "m1-c1-q10", "ch": 1, "section": "RQ", "q": "The body system responsible for structural support and movement is the ________.", "a": "D. skeletal system", "opts": ["A. cardiovascular system", "B. endocrine system", "C. muscular system", "D. skeletal system"]}, {"id": "m1-c1-q11", "ch": 1, "section": "RQ", "q": "Metabolism can be defined as the ________.", "a": "D. sum of all chemical reactions in an organism", "opts": ["A. adjustment by an organism to external or internal changes", "B. process whereby all unspecialized cells become specialized to perform distinct functions", "C. process whereby new cells are formed to replace worn-out cells", "D. sum of all chemical reactions in an organism"]}, {"id": "m1-c1-q12", "ch": 1, "section": "RQ", "q": "Adenosine triphosphate (ATP) is an important molecule because it ________.", "a": "C. stores energy for use by body cells", "opts": ["A. is the result of catabolism", "B. releases energy in uncontrolled bursts", "C. stores energy for use by body cells", "D. All of the above"]}, {"id": "m1-c1-q13", "ch": 1, "section": "RQ", "q": "Cancer cells can be characterized as “generic” cells that perform no specialized body function. Thus cancer cells lack ________.", "a": "A. differentiation", "opts": ["A. differentiation", "B. reproduction", "C. responsiveness", "D. both reproduction and responsiveness"]}, {"id": "m1-c1-q14", "ch": 1, "section": "RQ", "q": "Humans have the most urgent need for a continuous supply of ________.", "a": "C. oxygen", "opts": ["A. food", "B. nitrogen", "C. oxygen", "D. water"]}, {"id": "m1-c1-q15", "ch": 1, "section": "RQ", "q": "Which of the following statements about nutrients is true?", "a": "A. All classes of nutrients are essential to human survival", "opts": ["A. All classes of nutrients are essential to human survival", "B. Because the body cannot store any micronutrients, they need to be consumed nearly every day", "C. Carbohydrates, lipids, and proteins are micronutrients", "D. Macronutrients are vitamins and minerals"]}, {"id": "m1-c1-q16", "ch": 1, "section": "RQ", "q": "C.J. is stuck in her car during a bitterly cold blizzard. Her body responds to the cold by ________.", "a": "C. breaking down stored energy", "opts": ["A. increasing the blood to the hands and feet", "B. becoming lethargic to conserve heat", "C. breaking down stored energy", "D. significantly increasing blood oxygen levels"]}, {"id": "m1-c1-q17", "ch": 1, "section": "RQ", "q": "After you eat lunch, nerve cells in your stomach respond to the distension (the stimulus) resulting from the food. They relay this information to ________.", "a": "A. a control center", "opts": ["A. a control center", "B. a set point", "C. effectors", "D. sensors"]}, {"id": "m1-c1-q18", "ch": 1, "section": "RQ", "q": "Stimulation of the heat-loss center causes ________.", "a": "C. sweat glands to increase their output", "opts": ["A. blood vessels in the skin to constrict", "B. breathing to become slow and shallow", "C. sweat glands to increase their output", "D. All of the above"]}, {"id": "m1-c1-q19", "ch": 1, "section": "RQ", "q": "Which of the following is an example of a normal physiologic process that uses a positive feedback loop?", "a": "B. childbirth", "opts": ["A. blood pressure regulation", "B. childbirth", "C. regulation of fluid balance", "D. temperature regulation"]}, {"id": "m1-c1-q20", "ch": 1, "section": "RQ", "q": "What is the position of the body when it is in the “normal anatomical position?”", "a": "D. None of the above", "opts": ["A. The person is prone with upper limbs, including palms, touching sides and lower limbs touching at sides", "B. The person is standing facing the observer, with upper limbs extended out at a ninety-degree angle from the torso and lower limbs in a wide stance with feet pointing laterally", "C. The person is supine with upper limbs, including palms, touching sides and lower limbs touching at sides", "D. None of the above"]}, {"id": "m1-c1-q21", "ch": 1, "section": "RQ", "q": "To make a banana split, you halve a banana into two long, thin, right and left sides along the ________.", "a": "C. midsagittal plane", "opts": ["A. coronal plane", "B. longitudinal plane", "C. midsagittal plane", "D. transverse plane"]}, {"id": "m1-c1-q22", "ch": 1, "section": "RQ", "q": "The lumbar region is ________.", "a": "D. superior to the popliteal region", "opts": ["A. inferior to the gluteal region", "B. inferior to the umbilical region", "C. superior to the cervical region", "D. superior to the popliteal region"]}, {"id": "m1-c1-q23", "ch": 1, "section": "RQ", "q": "The heart is within the ________.", "a": "B. mediastinum", "opts": ["A. cranial cavity", "B. mediastinum", "C. posterior (dorsal) cavity", "D. All of the above"]}, {"id": "m1-c1-q24", "ch": 1, "section": "RQ", "q": "In 1901, Wilhelm Röntgen was the first person to win the Nobel Prize for physics. For what discovery did he win?", "a": "D. X-rays", "opts": ["A. nuclear physics", "B. radiopharmaceuticals", "C. the link between radiation and cancer", "D. X-rays"]}, {"id": "m1-c1-q25", "ch": 1, "section": "RQ", "q": "Which of the following imaging techniques would be best to use to study the uptake of nutrients by rapidly multiplying cancer cells?", "a": "C. PET", "opts": ["A. CT", "B. MRI", "C. PET", "D. ultrasonography"]}, {"id": "m1-c1-q26", "ch": 1, "section": "RQ", "q": "Which of the following imaging studies can be used most safely during pregnancy?", "a": "C. ultrasound", "opts": ["A. CT scans", "B. PET scans", "C. ultrasounds", "D. X-rays"]}, {"id": "m1-c1-q27", "ch": 1, "section": "RQ", "q": "What are two major disadvantages of MRI scans?", "a": "B. high cost and the need for shielding from the magnetic signals", "opts": ["A. release of radiation and poor quality images", "B. high cost and the need for shielding from the magnetic signals", "C. can only view metabolically active tissues and inadequate availability of equipment", "D. release of radiation and the need for a patient to be confined to metal tube for up to 30 minutes"]}, {"id": "m1-c1-q28", "ch": 1, "section": "CT", "q": "Name at least three reasons to study anatomy and physiology.", "a": "An understanding of anatomy and physiology is essential for any career in the health professions. It can also help you make choices that promote your health, respond appropriately to signs of illness, make sense of health-related news, and help you in your roles as a parent, spouse, partner, friend, colleague, and caregiver."}, {"id": "m1-c1-q29", "ch": 1, "section": "CT", "q": "For whom would an appreciation of the structural characteristics of the human heart come more easily: an alien who lands on Earth, abducts a human, and dissects his heart, or an anatomy and physiology student performing a dissection of the heart on her very first day of class? Why?", "a": "A student would more readily appreciate the structures revealed in the dissection. Even though the student has not yet studied the workings of the heart and blood vessels in her class, she has experienced her heart beating every moment of her life, has probably felt her pulse, and likely has at least a basic understanding of the role of the heart in pumping blood throughout her body. This understanding of the heart’s function (physiology) would support her study of the heart’s form (anatomy)."}, {"id": "m1-c1-q30", "ch": 1, "section": "CT", "q": "Name the six levels of organization of the human body", "a": "Chemical, cellular, tissue, organ, organ system, organism."}, {"id": "m1-c1-q31", "ch": 1, "section": "CT", "q": "The female ovaries and the male testes are a part of which body system? Can these organs be members of more than one organ system? Why or why not?", "a": "The female ovaries and the male testes are parts of the reproductive system. But they also secrete hormones, as does the endocrine system, therefore ovaries and testes function within both the endocrine and reproductive systems."}, {"id": "m1-c1-q32", "ch": 1, "section": "CT", "q": "Explain why the smell of smoke when you are sitting at a campfire does not trigger alarm, but the smell of smoke in your residence hall does.", "a": "When you are sitting at a campfire, your sense of smell adapts to the smell of smoke. Only if that smell were to suddenly and dramatically intensify would you be likely to notice and respond. In contrast, the smell of even a trace of smoke would be new and highly unusual in your residence hall, and would be perceived as danger."}, {"id": "m1-c1-q33", "ch": 1, "section": "CT", "q": "Identify three different ways that growth can occur in the human body.", "a": "Growth can occur by increasing the number of existing cells, increasing the size of existing cells, or increasing the amount of non-cellular material around cells."}, {"id": "m1-c1-q34", "ch": 1, "section": "CT", "q": "When you open a bottle of sparkling water, the carbon dioxide gas in the bottle form bubbles. If the bottle is left open, the water will eventually “go flat.” Explain these phenomena in terms of atmospheric pressure.", "a": "In a sealed bottle of sparkling water, carbon dioxide gas is kept dissolved in the water under a very high pressure. When you open the bottle, the pressure of the gas above the liquid changes from artificially high to normal atmospheric pressure. The dissolved carbon dioxide gas expands, and rises in bubbles to the surface. When a bottle of sparkling water is left open, it eventually goes flat because its gases continue to move out of solution until the pressure in the water is approximately equal to atmospheric pressure."}, {"id": "m1-c1-q35", "ch": 1, "section": "CT", "q": "On his midsummer trek through the desert, Josh ran out of water. Why is this particularly dangerous?", "a": "The primary way that the body responds to high environmental heat is by sweating; however, sweating requires water, which comes from body fluids, including blood plasma. If Josh becomes dehydrated, he will be unable to sweat adequately to cool his body, and he will be at risk for heat stroke as his blood pressure drops too much from the loss of water from the blood plasma."}, {"id": "m1-c1-q36", "ch": 1, "section": "CT", "q": "Identify the four components of a negative feedback loop and explain what would happen if secretion of a body chemical controlled by a negative feedback system became too great.", "a": "The four components of a negative feedback loop are: stimulus, sensor, control center, and effector. If too great a quantity of the chemical were excreted, sensors would activate a control center, which would in turn activate an effector. In this case, the effector (the secreting cells) would be adjusted downward."}, {"id": "m1-c1-q37", "ch": 1, "section": "CT", "q": "What regulatory processes would your body use if you were trapped by a blizzard in an unheated, uninsulated cabin in the woods?", "a": "Any prolonged exposure to extreme cold would activate the brain’s heat-gain center. This would reduce blood flow to your skin, and shunt blood returning from your limbs away from the digits and into a network of deep veins. Your brain’s heat-gain center would also increase your muscle contraction, causing you to shiver. This increases the energy consumption of skeletal muscle and generates more heat. Your body would also produce thyroid hormone and epinephrine, chemicals that promote increased metabolism and heat production."}, {"id": "m1-c1-q38", "ch": 1, "section": "CT", "q": "In which direction would an MRI scanner move to produce sequential images of the body in the frontal plane, and in which direction would an MRI scanner move to produce sequential images of the body in the sagittal plane?", "a": "If the body were supine or prone, the MRI scanner would move from top to bottom to produce frontal sections, which would divide the body into anterior and posterior portions, as in “cutting” a deck of cards. Again, if the body were supine or prone, to produce sagittal sections, the scanner would move from left to right or from right to left to divide the body lengthwise into left and right portions."}, {"id": "m1-c1-q39", "ch": 1, "section": "CT", "q": "If a bullet were to penetrate a lung, which three anterior thoracic body cavities would it enter, and which layer of the serous membrane would it encounter first?", "a": "The bullet would enter the ventral, thoracic, and pleural cavities, and it would encounter the parietal layer of serous membrane first."}, {"id": "m1-c1-q40", "ch": 1, "section": "CT", "q": "Which medical imaging technique is most dangerous to use repeatedly, and why?", "a": "CT scanning subjects patients to much higher levels of radiation than X-rays, and should not be performed repeatedly."}, {"id": "m1-c1-q41", "ch": 1, "section": "CT", "q": "Explain why ultrasound imaging is the technique of choice for studying fetal growth and development.", "a": "Ultrasonography does not expose a mother or fetus to radiation, to radiopharmaceuticals, or to magnetic fields. At this time, there are no known medical risks of ultrasonography."}, {"id": "m1-c2-q4", "ch": 2, "section": "RQ", "q": "Together, just four elements make up more than 95 percent of the body’s mass. These include ________.", "a": "D. oxygen, carbon, hydrogen, and nitrogen", "opts": ["A. calcium, magnesium, iron, and carbon", "B. oxygen, calcium, iron, and nitrogen", "C. sodium, chlorine, carbon, and hydrogen", "D. oxygen, carbon, hydrogen, and nitrogen"]}, {"id": "m1-c2-q5", "ch": 2, "section": "RQ", "q": "The smallest unit of an element that still retains the distinctive behavior of that element is an ________.", "a": "B. atom", "opts": ["A. electron", "B. atom", "C. elemental particle", "D. isotope"]}, {"id": "m1-c2-q6", "ch": 2, "section": "RQ", "q": "The characteristic that gives an element its distinctive properties is its number of ________.", "a": "A. protons", "opts": ["A. protons", "B. neutrons", "C. electrons", "D. atoms"]}, {"id": "m1-c2-q7", "ch": 2, "section": "RQ", "q": "On the periodic table of the elements, mercury (Hg) has an atomic number of 80 and a mass number of 200.59. It has seven stable isotopes. The most abundant of these probably have ________.", "a": "C. more than 80 neutrons each", "opts": ["A. about 80 neutrons each", "B. fewer than 80 neutrons each", "C. more than 80 neutrons each", "D. more electrons than neutrons"]}, {"id": "m1-c2-q8", "ch": 2, "section": "RQ", "q": "Nitrogen has an atomic number of seven. How many electron shells does it likely have?", "a": "B. two", "opts": ["A. one", "B. two", "C. three", "D. four"]}, {"id": "m1-c2-q9", "ch": 2, "section": "RQ", "q": "Which of the following is a molecule, but not a compound?", "a": "C. H2", "opts": ["A. H2O", "B. 2H", "C. H2", "D. H+"]}, {"id": "m1-c2-q10", "ch": 2, "section": "RQ", "q": "A molecule of ammonia contains one atom of nitrogen and three atoms of hydrogen. These are linked with ________.", "a": "C. polar covalent bonds", "opts": ["A. ionic bonds", "B. nonpolar covalent bonds", "C. polar covalent bonds", "D. hydrogen bonds"]}, {"id": "m1-c2-q11", "ch": 2, "section": "RQ", "q": "When an atom donates an electron to another atom, it becomes", "a": "A. an ion", "opts": ["A. an ion", "B. an anion", "C. nonpolar", "D. all of the above"]}, {"id": "m1-c2-q12", "ch": 2, "section": "RQ", "q": "A substance formed of crystals of equal numbers of cations and anions held together by ionic bonds is called a(n) ________.", "a": "B. salt", "opts": ["A. noble gas", "B. salt", "C. electrolyte", "D. dipole"]}, {"id": "m1-c2-q13", "ch": 2, "section": "RQ", "q": "Which of the following statements about chemical bonds is true?", "a": "A. Covalent bonds are stronger than ionic bonds.", "opts": ["A. Covalent bonds are stronger than ionic bonds in biological systems", "B. Hydrogen bonds occur between two atoms of hydrogen", "C. Bonding readily occurs between nonpolar and polar molecules", "D. A molecule of water is unlikely to bond with an ion"]}, {"id": "m1-c2-q14", "ch": 2, "section": "RQ", "q": "The energy stored in a foot of snow on a steep roof is ________.", "a": "A. potential energy", "opts": ["A. potential energy", "B. kinetic energy", "C. radiant energy", "D. activation energy"]}, {"id": "m1-c2-q15", "ch": 2, "section": "RQ", "q": "The bonding of calcium, phosphorus, and other elements produces mineral crystals that are found in bone. This is an example of a(n) ________ reaction.", "a": "B. synthesis", "opts": ["A. catabolic", "B. synthesis", "C. decomposition", "D. exchange"]}, {"id": "m1-c2-q16", "ch": 2, "section": "RQ", "q": "AB → A + B is a general notation for a(n) ________ reaction.", "a": "C. decomposition", "opts": ["A. anabolic", "B. endergonic", "C. decomposition", "D. exchange"]}, {"id": "m1-c2-q17", "ch": 2, "section": "RQ", "q": "________ reactions release energy.", "a": "D. Catabolic, exergonic, and decomposition", "opts": ["A. Catabolic", "B. Exergonic", "C. Decomposition", "D. Catabolic, exergonic, and decomposition"]}, {"id": "m1-c2-q18", "ch": 2, "section": "RQ", "q": "Which of the following combinations of atoms is most likely to result in a chemical reaction?", "a": "A. hydrogen and hydrogen", "opts": ["A. hydrogen and hydrogen", "B. hydrogen and helium", "C. helium and helium", "D. neon and helium"]}, {"id": "m1-c2-q19", "ch": 2, "section": "RQ", "q": "Chewing a bite of bread mixes it with saliva and facilitates its chemical breakdown. This is most likely due to the fact that ________.", "a": "D. saliva contains enzymes", "opts": ["A. the inside of the mouth maintains a very high temperature", "B. chewing stores potential energy", "C. chewing facilitates synthesis reactions", "D. saliva contains enzymes"]}, {"id": "m1-c2-q20", "ch": 2, "section": "RQ", "q": "CH4 is methane. This compound is ________.", "a": "B. organic", "opts": ["A. inorganic", "B. organic", "C. reactive", "D. a crystal"]}, {"id": "m1-c2-q21", "ch": 2, "section": "RQ", "q": "Which of the following is most likely to be found evenly distributed in water in a homogeneous solution?", "a": "A. sodium ions and chloride ions", "opts": ["A. sodium ions and chloride ions", "B. NaCl molecules", "C. salt crystals", "D. red blood cells"]}, {"id": "m1-c2-q22", "ch": 2, "section": "RQ", "q": "Jenny mixes up a batch of pancake batter, then stirs in some chocolate chips. As she is waiting for the first few pancakes to cook, she notices the chocolate chips sinking to the bottom of the clear glass mixing bowl. The chocolate-chip batter is an example of a ________.", "a": "D. suspension", "opts": ["A. solvent", "B. solute", "C. solution", "D. suspension"]}, {"id": "m1-c2-q23", "ch": 2, "section": "RQ", "q": "A substance dissociates into K+ and Cl- in solution. The substance is a(n) ________.", "a": "C. salt", "opts": ["A. acid", "B. base", "C. salt", "D. buffer"]}, {"id": "m1-c2-q24", "ch": 2, "section": "RQ", "q": "Ty is three years old and as a result of a “stomach bug” has been vomiting for about 24 hours. His blood pH is 7.48. What does this mean?", "a": "B. Ty's blood is slightly alkaline", "opts": ["A. Ty's blood is slightly acidic", "B. Ty's blood is slightly alkaline", "C. Ty's blood is highly acidic", "D. Ty's blood is within the normal range"]}, {"id": "m1-c2-q25", "ch": 2, "section": "RQ", "q": "C6 H12 O6 is the chemical formula for a ________.", "a": "C. hexose monosaccharide", "opts": ["A. polymer of carbohydrate", "B. pentose monosaccharide", "C. hexose monosaccharide", "D. all of the above"]}, {"id": "m1-c2-q26", "ch": 2, "section": "RQ", "q": "What organic compound do brain cells primarily rely on for fuel?", "a": "A. glucose", "opts": ["A. glucose", "B. glycogen", "C. galactose", "D. glycerol"]}, {"id": "m1-c2-q27", "ch": 2, "section": "RQ", "q": "Which of the following is a functional group that is part of a building block of proteins?", "a": "C. amino", "opts": ["A. phosphate", "B. adenine", "C. amino", "D. ribose"]}, {"id": "m1-c2-q28", "ch": 2, "section": "RQ", "q": "A pentose sugar is a part of the monomer used to build which type of macromolecule?", "a": "B. nucleic acids", "opts": ["A. polysaccharides", "B. nucleic acids", "C. phosphorylated glucose", "D. glycogen"]}, {"id": "m1-c2-q29", "ch": 2, "section": "RQ", "q": "A phospholipid ________.", "a": "A. has both polar and nonpolar regions", "opts": ["A. has both polar and nonpolar regions", "B. is made up of a triglyceride bonded to a phosphate group", "C. is a building block of ATP", "D. can donate both cations and anions in solution"]}, {"id": "m1-c2-q30", "ch": 2, "section": "RQ", "q": "In DNA, nucleotide bonding forms a compound with a characteristic shape known as a(n) ________.", "a": "D. double helix", "opts": ["A. beta chain", "B. pleated sheet", "C. alpha helix", "D. double helix"]}, {"id": "m1-c2-q31", "ch": 2, "section": "RQ", "q": "Uracil ________.", "a": "D. all of the above (contains nitrogen, is a pyrimidine, is found in RNA)", "opts": ["A. contains nitrogen", "B. is a pyrimidine", "C. is found in RNA", "D. all of the above"]}, {"id": "m1-c2-q32", "ch": 2, "section": "RQ", "q": "The ability of an enzyme’s active sites to bind only substrates of compatible shape and charge is known as ________.", "a": "B. specificity", "opts": ["A. selectivity", "B. specificity", "C. subjectivity", "D. specialty"]}, {"id": "m1-c2-q33", "ch": 2, "section": "CT", "q": "The most abundant elements in the foods and beverages you consume are oxygen, carbon, hydrogen, and nitrogen. Why might having these elements in consumables be useful?", "a": "These four elements—oxygen, carbon, hydrogen, and nitrogen—together make up more than 95 percent of the mass of the human body, and the body cannot make elements, so it is helpful to have them in consumables."}, {"id": "m1-c2-q34", "ch": 2, "section": "CT", "q": "Oxygen, whose atomic number is eight, has three stable isotopes: 16O, 17O, and 18O. Explain what this means in terms of the number of protons and neutrons.", "a": "Oxygen has eight protons. In its most abundant stable form, it has eight neutrons, too, for a mass number of 16. In contrast, 17O has nine neutrons, and 18O has 10 neutrons."}, {"id": "m1-c2-q35", "ch": 2, "section": "CT", "q": "Magnesium is an important element in the human body, especially in bones. Magnesium’s atomic number is 12. Is it stable or reactive? Why? If it were to react with another atom, would it be more likely to accept or to donate one or more electrons?", "a": "Magnesium’s 12 electrons are distributed as follows: two in the first shell, eight in the second shell, and two in its valence shell. According to the octet rule, magnesium is unstable (reactive) because its valence shell has just two electrons. It is therefore likely to participate in chemical reactions in which it donates two electrons."}, {"id": "m1-c2-q36", "ch": 2, "section": "CT", "q": "Explain why CH4 is one of the most common molecules found in nature. Are the bonds between the atoms ionic or covalent?", "a": "A carbon atom has four electrons in its valence shell. According to the octet rule, it will readily participate in chemical reactions that result in its valence shell having eight electrons. Hydrogen, with one electron, will complete its valence shell with two. Electron sharing between an atom of carbon and four atoms of hydrogen meets the requirements of all atoms. The bonds are covalent because the electrons are shared: although hydrogen often participates in ionic bonds, carbon does not because it is highly unlikely to donate or accept four electrons."}, {"id": "m1-c2-q37", "ch": 2, "section": "CT", "q": "In a hurry one day, you merely rinse your lunch dishes with water. As you are drying your salad bowl, you notice that it still has an oily film. Why was the water alone not effective in cleaning the bowl?", "a": "Water is a polar molecule. It has a region of weakly positive charge and a region of weakly negative charge. These regions are attracted to ions as well as to other polar molecules. Oils are nonpolar, and are repelled by water."}, {"id": "m1-c2-q38", "ch": 2, "section": "CT", "q": "Could two atoms of oxygen engage in ionic bonding? Why or why not?", "a": "Identical atoms have identical electronegativity and cannot form ionic bonds. Oxygen, for example, has six electrons in its valence shell. Neither donating nor accepting the valence shell electrons of the other will result in the oxygen atoms completing their valence shells. Two atoms of the same element always form covalent bonds."}, {"id": "m1-c2-q39", "ch": 2, "section": "CT", "q": "AB + CD → AD + BE Is this a legitimate example of an exchange reaction? Why or why not?", "a": "It is not. An exchange reaction might be AB + CD → AC + BD or AB + CD → AD + BC. In all chemical reactions, including exchange reactions, the components of the reactants are identical to the components of the products. A component present among the reactants cannot disappear, nor can a component not present in the reactants suddenly appear in the products."}, {"id": "m1-c2-q40", "ch": 2, "section": "CT", "q": "When you do a load of laundry, why do you not just drop a bar of soap into the washing machine? In other words, why is laundry detergent sold as a liquid or powder?", "a": "Recall that the greater the surface area of the reactants, the more quickly and easily they will interact. It takes energy to separate particles of a substance. Powder and liquid laundry detergents, with relatively more surface area per unit, can quickly dissolve into their reactive components when added to the water."}, {"id": "m1-c2-q41", "ch": 2, "section": "CT", "q": "The pH of lemon juice is 2, and the pH of orange juice is 4. Which of these is more acidic, and by how much? What does this mean?", "a": "Lemon juice is one hundred times more acidic than orange juice. This means that lemon juice has a one hundred-fold greater concentration of hydrogen ions."}, {"id": "m1-c2-q42", "ch": 2, "section": "CT", "q": "During a party, Eli loses a bet and is forced to drink a bottle of lemon juice. Not long thereafter, he begins complaining of having difficulty breathing, and his friends take him to the local emergency room. There, he is given an intravenous solution of bicarbonate. Why?", "a": "Lemon juice, like any acid, releases hydrogen ions in solution. As excessive H+ enters the digestive tract and is absorbed into blood, Eli’s blood pH falls below 7.35. Recall that bicarbonate is a buffer, a weak base that accepts hydrogen ions. By administering bicarbonate intravenously, the emergency department physician helps raise Eli’s blood pH back toward neutral."}, {"id": "m1-c2-q43", "ch": 2, "section": "CT", "q": "If the disaccharide maltose is formed from two glucose monosaccharides, which are hexose sugars, how many atoms of carbon, hydrogen, and oxygen does maltose contain and why?", "a": "Maltose contains 12 atoms of carbon, but only 22 atoms of hydrogen and 11 atoms of oxygen, because a molecule of water is removed during its formation via dehydration synthesis."}, {"id": "m1-c2-q44", "ch": 2, "section": "CT", "q": "Once dietary fats are digested and absorbed, why can they not be released directly into the bloodstream?", "a": "All lipids are hydrophobic and unable to dissolve in the watery environment of blood. They are packaged into lipoproteins, whose outer protein envelope enables them to transport fats in the bloodstream."}, {"id": "m1-c3-q6", "ch": 3, "section": "RQ", "q": "Because they are embedded within the membrane, ion channels are examples of ________.", "a": "B. integral proteins", "opts": ["A. receptor proteins", "B. integral proteins", "C. peripheral proteins", "D. glycoproteins"]}, {"id": "m1-c3-q7", "ch": 3, "section": "RQ", "q": "The diffusion of substances within a solution tends to move those substances ________ their ________ gradient.", "a": "D. down; concentration", "opts": ["A. up; electrical", "B. up; electrochemical", "C. down; pressure", "D. down; concentration"]}, {"id": "m1-c3-q8", "ch": 3, "section": "RQ", "q": "Ion pumps and phagocytosis are both examples of ________.", "a": "C. active transport", "opts": ["A. endocytosis", "B. passive transport", "C. active transport", "D. facilitated diffusion"]}, {"id": "m1-c3-q9", "ch": 3, "section": "RQ", "q": "Choose the answer that best completes the following analogy: Diffusion is to ________ as endocytosis is to ________.", "a": "B. osmosis; pinocytosis", "opts": ["A. filtration; phagocytosis", "B. osmosis; pinocytosis", "C. solutes; fluid", "D. gradient; chemical energy"]}, {"id": "m1-c3-q10", "ch": 3, "section": "RQ", "q": "Choose the term that best completes the following analogy: Cytoplasm is to cytosol as a swimming pool containing chlorine and flotation toys is to ________.", "a": "D. the water", "opts": ["A. the walls of the pool", "B. the pool water containing chlorine", "C. the flotation toys", "D. the water"]}, {"id": "m1-c3-q11", "ch": 3, "section": "RQ", "q": "The rough ER has its name due to what associated structures?", "a": "B. ribosomes", "opts": ["A. Golgi apparatus", "B. ribosomes", "C. lysosomes", "D. proteins"]}, {"id": "m1-c3-q12", "ch": 3, "section": "RQ", "q": "Which of the following is a function of the rough ER?", "a": "A. production of proteins", "opts": ["A. production of proteins", "B. detoxification of certain substances", "C. synthesis of steroid hormones", "D. regulation of intracellular calcium concentration"]}, {"id": "m1-c3-q13", "ch": 3, "section": "RQ", "q": "Which of the following is a feature common to all three components of the cytoskeleton?", "a": "C. They are all polymers of protein subunits", "opts": ["A. They all serve to scaffold the organelles within the cell", "B. They are all characterized by roughly the same diameter", "C. They are all polymers of protein subunits", "D. They all help the cell resist compression and tension"]}, {"id": "m1-c3-q14", "ch": 3, "section": "RQ", "q": "Which of the following organelles produces large quantities of ATP when both glucose and oxygen are available to the cell?", "a": "A. mitochondria", "opts": ["A. mitochondria", "B. peroxisomes", "C. lysosomes", "D. ER"]}, {"id": "m1-c3-q15", "ch": 3, "section": "RQ", "q": "The nucleus and mitochondria share which of the following features?", "a": "B. a double cell membrane", "opts": ["A. protein-lined membrane pores", "B. a double cell membrane", "C. the synthesis of ribosomes", "D. the production of cellular energy"]}, {"id": "m1-c3-q16", "ch": 3, "section": "RQ", "q": "Which of the following structures could be found within the nucleolus?", "a": "C. ribosomes", "opts": ["A. chromatin", "B. histones", "C. ribosomes", "D. nucleosomes"]}, {"id": "m1-c3-q17", "ch": 3, "section": "RQ", "q": "Which of the following sequences on a DNA molecule would be complementary to GCTTATAT?", "a": "C. CGAATATA", "opts": ["A. TAGGCGCG", "B. ATCCGCGC", "C. CGAATATA", "D. TGCCTCTC"]}, {"id": "m1-c3-q18", "ch": 3, "section": "RQ", "q": "Place the following structures in order from least to most complex organization: chromatin, nucleosome, DNA, chromosome", "a": "A. DNA, nucleosome, chromatin, chromosome", "opts": ["A. DNA, nucleosome, chromatin, chromosome", "B. nucleosome, DNA, chromosome, chromatin", "C. DNA, chromatin, nucleosome, chromosome", "D. nucleosome, chromatin, DNA, chromosome"]}, {"id": "m1-c3-q19", "ch": 3, "section": "RQ", "q": "Which of the following is part of the elongation step of DNA synthesis?", "a": "B. attaching complementary nucleotides to the template strand", "opts": ["A. pulling apart the two DNA strands", "B. attaching complementary nucleotides to the template strand", "C. untwisting the DNA helix", "D. none of the above"]}, {"id": "m1-c3-q20", "ch": 3, "section": "RQ", "q": "Which of the following is not a difference between DNA and RNA?", "a": "C. DNA contains alternating sugar-phosphate molecules whereas RNA does not contain sugars", "opts": ["A. DNA contains thymine whereas RNA contains uracil", "B. DNA contains deoxyribose and RNA contains ribose", "C. DNA contains alternating sugar-phosphate molecules whereas RNA does not contain sugars", "D. RNA is single stranded and DNA is double stranded"]}, {"id": "m1-c3-q21", "ch": 3, "section": "RQ", "q": "Transcription and translation take place in the ________ and ________, respectively.", "a": "A. nucleus; cytoplasm", "opts": ["A. nucleus; cytoplasm", "B. nucleolus; nucleus", "C. nucleolus; cytoplasm", "D. cytoplasm; nucleus"]}, {"id": "m1-c3-q22", "ch": 3, "section": "RQ", "q": "How many “letters” of an RNA molecule, in sequence, does it take to provide the code for a single amino acid?", "a": "C. 3", "opts": ["A. 1", "B. 2", "C. 3", "D. 4"]}, {"id": "m1-c3-q23", "ch": 3, "section": "RQ", "q": "Which of the following is not made out of RNA?", "a": "B. the ribosome", "opts": ["A. the carriers that shuttle amino acids to a growing polypeptide strand", "B. the ribosome", "C. the messenger molecule that provides the code for protein synthesis", "D. the intron"]}, {"id": "m1-c3-q24", "ch": 3, "section": "RQ", "q": "Which of the following phases is characterized by preparation for DNA synthesis?", "a": "B. G1", "opts": ["A. G0", "B. G1", "C. G2", "D. S"]}, {"id": "m1-c3-q25", "ch": 3, "section": "RQ", "q": "A mutation in the gene for a cyclin protein might result in which of the following?", "a": "D. any of the above (a cell with additional genetic material than normal, cancer, a cell with less genetic material than normal)", "opts": ["A. a cell with additional genetic material than normal", "B. cancer", "C. a cell with less genetic material than normal", "D. any of the above"]}, {"id": "m1-c3-q26", "ch": 3, "section": "RQ", "q": "What is a primary function of tumor suppressor genes?", "a": "B. stop certain cells from dividing", "opts": ["A. stop all cells from dividing", "B. stop certain cells from dividing", "C. help oncogenes produce oncoproteins", "D. allow the cell to skip certain phases of the cell cycle"]}, {"id": "m1-c3-q27", "ch": 3, "section": "RQ", "q": "Arrange the following terms in order of increasing specialization: oligopotency, pleuripotency, unipotency, multipotency.", "a": "D. pleuripotency, multipotency, oligopotency, unipotency", "opts": ["A. multipotency, pleuripotency, oligopotency, unipotency", "B. pleuripotency, oligopotency, multipotency unipotency", "C. oligopotency, pleuripotency, unipotency, multipotency", "D. pleuripotency, multipotency, oligopotency, unipotency"]}, {"id": "m1-c3-q28", "ch": 3, "section": "RQ", "q": "Which type of stem cell gives rise to red and white blood cells?", "a": "C. hematopoietic", "opts": ["A. endothelial", "B. epithelial", "C. hematopoietic", "D. mesenchymal"]}, {"id": "m1-c3-q29", "ch": 3, "section": "RQ", "q": "What multipotent stem cells from children sometimes banked by parents?", "a": "C. cells from the umbilical cord and from baby teeth", "opts": ["A. fetal stem cells", "B. embryonic stem cells", "C. cells from the umbilical cord and from baby teeth", "D. hematopoietic stem cells from red and white blood cells"]}, {"id": "m1-c3-q30", "ch": 3, "section": "CT", "q": "What materials can easily diffuse through the lipid bilayer, and why?", "a": "Only materials that are relatively small and nonpolar can easily diffuse through the lipid bilayer. Large particles cannot fit in between the individual phospholipids that are packed together, and polar molecules are repelled by the hydrophobic/nonpolar lipids that line the inside of the bilayer."}, {"id": "m1-c3-q31", "ch": 3, "section": "CT", "q": "Why is receptor-mediated endocytosis said to be more selective than phagocytosis or pinocytosis?", "a": "Receptor-mediated endocytosis is more selective because the substances that are brought into the cell are the specific ligands that could bind to the receptors being endocytosed. Phagocytosis or pinocytosis, on the other hand, have no such receptor-ligand specificity, and bring in whatever materials happen to be close to the membrane when it is enveloped."}, {"id": "m1-c3-q32", "ch": 3, "section": "CT", "q": "What do osmosis, diffusion, filtration, and the movement of ions away from like charge all have in common? In what way do they differ?", "a": "These four phenomena are similar in the sense that they describe the movement of substances down a particular type of gradient. Osmosis and diffusion involve the movement of water and other substances down their concentration gradients, respectively. Filtration describes the movement of particles down a pressure gradient, and the movement of ions away from like charge describes their movement down their electrical gradient."}, {"id": "m1-c3-q33", "ch": 3, "section": "CT", "q": "Explain why the structure of the ER, mitochondria, and Golgi apparatus assist their respective functions.", "a": "The structure of the Golgi apparatus is suited to its function because it is a series of flattened membranous discs; substances are modified and packaged in sequential steps as they travel from one disc to the next. The structure of Golgi apparatus also involves a receiving face and a sending face, which organize cellular products as they enter and leave the Golgi apparatus. The ER and the mitochondria both have structural specializations that increase their surface area. In the mitochondria, the inner membrane is extensively folded, which increases surface area for ATP production. Likewise, the ER is elaborately wound throughout the cell, increasing its surface area for functions like lipid synthesis, Ca++ storage, and protein synthesis."}, {"id": "m1-c3-q34", "ch": 3, "section": "CT", "q": "Compare and contrast lysosomes with peroxisomes: name at least two similarities and one difference.", "a": "Peroxisomes and lysosomes are both cellular organelles bound by lipid bilayer membranes, and they both contain many enzymes. However, peroxisomes contain enzymes that detoxify substances by transferring hydrogen atoms and producing H2O2, whereas the enzymes in lysosomes function to break down and digest various unwanted materials."}, {"id": "m1-c3-q35", "ch": 3, "section": "CT", "q": "Explain in your own words why DNA replication is said to be “semiconservative”?", "a": "DNA replication is said to be semiconservative because, after replication is complete, one of the two parent DNA strands makes up half of each new DNA molecule. The other half is a newly synthesized strand. Therefore, half (“semi”) of each daughter DNA molecule is from the parent molecule and half is a new molecule."}, {"id": "m1-c3-q36", "ch": 3, "section": "CT", "q": "Why is it important that DNA replication take place before cell division? What would happen if cell division of a body cell took place without DNA replication, or when DNA replication was incomplete?", "a": "During cell division, one cell divides to produce two new cells. In order for all of the cells in your body to maintain a full genome, each cell must replicate its DNA before it divides so that a full genome can be allotted to each of its offspring cells. If DNA replication did not take place fully, or at all, the offspring cells would be missing some or all of the genome. This could be disastrous if a cell was missing genes necessary for its function and health."}, {"id": "m1-c3-q37", "ch": 3, "section": "CT", "q": "Briefly explain the similarities between transcription and DNA replication.", "a": "Transcription and DNA replication both involve the synthesis of nucleic acids. These processes share many common features—particularly, the similar processes of initiation, elongation, and termination. In both cases the DNA molecule must be untwisted and separated, and the coding (i.e., sense) strand will be used as a template. Also, polymerases serve to add nucleotides to the growing DNA or mRNA strand. Both processes are signaled to terminate when completed."}, {"id": "m1-c3-q38", "ch": 3, "section": "CT", "q": "Contrast transcription and translation. Name at least three differences between the two processes.", "a": "Transcription is really a “copy” process and translation is really an “interpretation” process, because transcription involves copying the DNA message into a very similar RNA message whereas translation involves converting the RNA message into the very different amino acid message. The two processes also differ in their location: transcription occurs in the nucleus and translation in the cytoplasm. The mechanisms by which the two processes are performed are also completely different: transcription utilizes polymerase enzymes to build mRNA whereas translation utilizes different kinds of RNA to build protein."}, {"id": "m1-c3-q39", "ch": 3, "section": "CT", "q": "What would happen if anaphase proceeded even though the sister chromatids were not properly attached to their respective microtubules and lined up at the metaphase plate?", "a": "One or both of the new daughter cells would accidently receive duplicate chromosomes and/or would be missing certain chromosomes."}, {"id": "m1-c3-q40", "ch": 3, "section": "CT", "q": "What are cyclins and cyclin-dependent kinases, and how do they interact?", "a": "A cyclin is one of the primary classes of cell cycle control molecules, while a cyclin-dependent kinase (is one of a group of molecules that work together with cyclins to determine progression past cell checkpoints. By interacting with many additional molecules, these triggers push the cell cycle forward unless prevented from doing so by “stop” signals, if for some reason the cell is not ready."}, {"id": "m1-c3-q41", "ch": 3, "section": "CT", "q": "Explain how a transcription factor ultimately determines whether or not a protein will be present in a given cell?", "a": "Transcription factors bind to DNA and either promote or inhibit the transcription of a gene. If they promote the transcription of a particular gene, then that gene will be transcribed and the mRNA subsequently translated into protein. If gene transcription is inhibited, then there will be no way of synthesizing the gene’s corresponding protein."}, {"id": "m1-c3-q42", "ch": 3, "section": "CT", "q": "Discuss two reasons why the therapeutic use of embryonic stem cells can present a problem.", "a": "Embryonic stem cells derive from human embryos, which are destroyed to obtain the cells. The destruction of human embryos is an ethical problem. And, the DNA in an embryonic stem cell would differ from the DNA of the person being treated, which could result in immune problems or rejected of tissue."}, {"id": "m1-c1-mc1", "ch": 1, "section": "MC", "q": "A midsagittal section of the body would pass through the", "a": "C. heart.", "opts": ["A. kidney.", "B. lung.", "C. heart.", "D. spleen.", "E. leg."]}, {"id": "m1-c1-mc2", "ch": 1, "section": "MC", "q": "A person experiencing hypothermia would have which of the following symptoms?", "a": "B. Low body temperature", "opts": ["A. High metabolism", "B. Low body temperature", "C. Elevated heart rate", "D. Excessive sweating"]}, {"id": "m1-c1-mc3", "ch": 1, "section": "MC", "q": "Which structure is part of the lymphatic system?", "a": "A. Spleen", "opts": ["A. Spleen", "B. Heart", "C. Lungs", "D. Liver"]}, {"id": "m1-c1-mc4", "ch": 1, "section": "MC", "q": "What does the term 'distal' refer to?", "a": "D. Farther from the point of attachment", "opts": ["A. Closer to the midline", "B. Nearer to the head", "C. Towards the front of the body", "D. Farther from the point of attachment"]}, {"id": "m1-c1-mc5", "ch": 1, "section": "MC", "q": "Which anatomical plane divides the body into anterior and posterior sections?", "a": "C. Frontal plane", "opts": ["A. Sagittal plane", "B. Midsagittal plane", "C. Frontal plane", "D. Transverse plane"]}, {"id": "m1-c1-mc6", "ch": 1, "section": "MC", "q": "What best describes a serous membrane?", "a": "D. Lines body cavities and covers organs", "opts": ["A. Supports organs by providing nutrients", "B. Connects muscles to bones", "C. Protects against mechanical injury", "D. Lines body cavities and covers organs"]}, {"id": "m1-c1-mc7", "ch": 1, "section": "MC", "q": "What does 'anatomical position' refer to?", "a": "A. Standing upright with arms at the side and palms facing forward", "opts": ["A. Standing upright with arms at the side and palms facing forward", "B. Lying face down", "C. Standing with arms raised above the head", "D. Seated with legs crossed"]}, {"id": "m1-c1-mc8", "ch": 1, "section": "MC", "q": "Which of the following is considered a negative feedback mechanism?", "a": "C. Regulation of blood sugar levels", "opts": ["A. Childbirth contractions", "B. Blood clotting", "C. Regulation of blood sugar levels", "D. Adrenaline rush"]}, {"id": "m1-c1-mc9", "ch": 1, "section": "MC", "q": "A person lying face down is in the ________ position.", "a": "prone"}, {"id": "m1-c1-mc10", "ch": 1, "section": "MC", "q": "A person lying on the bed and gazing at the ceiling is in the ________ position.", "a": "B. supine", "opts": ["A. prone", "B. supine", "C. anatomical", "D. dorsal", "E. caudal"]}, {"id": "m1-c1-mc11", "ch": 1, "section": "MC", "q": "A person who is standing facing forward with hands at the sides and palms facing forward is in the", "a": "C. anatomical position.", "opts": ["A. supine position.", "B. prone position.", "C. anatomical position.", "D. frontal position.", "E. sagittal position."]}, {"id": "m1-c1-mc12", "ch": 1, "section": "MC", "q": "An anatomical term that means the same as ventral:", "a": "D. anterior", "opts": ["A. posterior", "B. inferior", "C. abdominal", "D. anterior", "E. superior"]}, {"id": "m1-c1-mc13", "ch": 1, "section": "MC", "q": "An example of a receptor in a negative feedback loop controlling body temperature would be", "a": "A. temperature sensors on the skin that detect a stimulus.", "opts": ["A. temperature sensors on the skin that detect a stimulus.", "B. sweat glands that increase secretion.", "C. regulatory centers that send commands to an effector.", "D. effectors that cause blood vessels to dilate.", "E. sweat glands that act like effectors."]}, {"id": "m1-c1-mc14", "ch": 1, "section": "MC", "q": "Anatomy is to ________ as physiology is to ________.", "a": "C. structure; function", "opts": ["A. function; form", "B. form; structure", "C. structure; function", "D. structure; form", "E. growth; form"]}, {"id": "m1-c1-mc15", "ch": 1, "section": "MC", "q": "Anatomy uses a special language, called ________ terminology, that involves the use of word roots, prefixes, suffixes, and combining forms to construct terms related to the body in health and disease.", "a": "medical"}, {"id": "m1-c1-mc16", "ch": 1, "section": "MC", "q": "The chin is ________ to the nose.", "a": "D. inferior", "opts": ["A. anterior", "B. superior", "C. posterior", "D. inferior", "E. medial"]}, {"id": "m1-c1-mc17", "ch": 1, "section": "MC", "q": "While standing in the anatomical position,", "a": "E. All of the answers are correct.", "opts": ["A. front refers to anterior.", "B. front refers to ventral.", "C. back refers to posterior.", "D. back refers to dorsal.", "E. All of the answers are correct."]}, {"id": "m1-c1-mc18", "ch": 1, "section": "MC", "q": "Which organ system includes the spleen and the tonsils?", "a": "E. lymphatic", "opts": ["A. digestive", "B. endocrine", "C. nervous", "D. cardiovascular", "E. lymphatic"]}, {"id": "m1-c1-mc19", "ch": 1, "section": "MC", "q": "Which of the following terms refers to the foot?", "a": "E. pedal", "opts": ["A. cervical", "B. brachial", "C. antebrachial", "D. femoral", "E. pedal"]}, {"id": "m1-c1-mc20", "ch": 1, "section": "MC", "q": "Visceral pericardium is located", "a": "A. on the heart itself.", "opts": ["A. on the heart itself.", "B. lining the pleural cavity.", "C. lining the pericardial cavity.", "D. on the lung itself.", "E. lining the peritoneal cavity."]}, {"id": "m1-c1-mc21", "ch": 1, "section": "MC", "q": "This type of feedback exaggerates the effects of variations from normal.", "a": "B. positive", "opts": ["A. negative", "B. positive", "C. neutral", "D. depressing", "E. All of the answers are correct."]}, {"id": "m1-c1-mc22", "ch": 1, "section": "MC", "q": "The wrist is ________ to the elbow.", "a": "B. distal", "opts": ["A. proximal", "B. distal", "C. lateral", "D. medial", "E. horizontal"]}, {"id": "m1-c1-mc23", "ch": 1, "section": "MC", "q": "The thoracic cavity contains the", "a": "E. pericardial and pleural cavities.", "opts": ["A. coelom.", "B. pericardial cavity.", "C. pelvic cavity.", "D. pleural cavities.", "E. pericardial and pleural cavities."]}, {"id": "m1-c1-mc24", "ch": 1, "section": "MC", "q": "The study of the function of specific organ systems is called", "a": "A. systemic physiology.", "opts": ["A. systemic physiology.", "B. organ physiology.", "C. cell physiology.", "D. pathological physiology.", "E. histology."]}, {"id": "m1-c1-mc25", "ch": 1, "section": "MC", "q": "The heart is ________ to the lungs.", "a": "B. medial", "opts": ["A. lateral", "B. medial", "C. posterior", "D. proximal", "E. distal"]}, {"id": "m1-c1-mc26", "ch": 1, "section": "MC", "q": "The right pleural cavity contains:", "a": "D. right lung", "opts": ["A. heart", "B. trachea", "C. left lung", "D. right lung", "E. both lungs"]}, {"id": "m1-c1-mc27", "ch": 1, "section": "MC", "q": "The kidneys and ureters are organs of the ________ system.", "a": "D. urinary", "opts": ["A. endocrine", "B. digestive", "C. respiratory", "D. urinary", "E. lymphatic"]}, {"id": "m1-c1-mc28", "ch": 1, "section": "MC", "q": "The liver is primarily located in the ________ quadrant.", "a": "A. right upper", "opts": ["A. right upper", "B. left upper", "C. right lower", "D. left lower", "E. hepatic"]}, {"id": "m1-c1-mc29", "ch": 1, "section": "MC", "q": "The mediastinum", "a": "E. separates the pleural cavities and includes the pericardial cavity.", "opts": ["A. contains the pleural cavities.", "B. separates the pleural cavities.", "C. contains the pericardial cavity.", "D. contains the pleural cavities and pericardial cavity.", "E. separates the pleural cavities and includes the pericardial cavity."]}, {"id": "m1-c1-mc30", "ch": 1, "section": "MC", "q": "The pituitary gland and thyroid gland are organs of the ________ system.", "a": "A. endocrine", "opts": ["A. endocrine", "B. cardiovascular", "C. respiratory", "D. lymphatic", "E. digestive"]}, {"id": "m1-c1-mc31", "ch": 1, "section": "MC", "q": "The plane that separates the abdominal and the pelvic cavities is", "a": "C. transverse at the hips.", "opts": ["A. the mediastinum.", "B. sagittal on the brachium.", "C. transverse at the hips.", "D. midsagittal on the trunk.", "E. superior to the thorax."]}, {"id": "m1-c1-mc32", "ch": 1, "section": "MC", "q": "Skin, hair, and nails are associated with the ________ system.", "a": "C. integumentary", "opts": ["A. skeletal", "B. muscular", "C. integumentary", "D. endocrine", "E. immune"]}]}, {"key": "m2", "name": "Module 2", "sub": "Ch 4–6 · Tissue · Integumentary · Bone", "cards": [{"id": "m2-c4-q8", "ch": 4, "section": "RQ", "q": "Which of the following is not a type of tissue?", "a": "C. embryonic", "opts": ["A. muscle", "B. nervous", "C. embryonic", "D. epithelial"]}, {"id": "m2-c4-q9", "ch": 4, "section": "RQ", "q": "The process by which a less specialized cell matures into a more specialized cell is called ________.", "a": "A. differentiation", "opts": ["A. differentiation", "B. maturation", "C. modification", "D. specialization"]}, {"id": "m2-c4-q10", "ch": 4, "section": "RQ", "q": "Differentiated cells in a developing embryo derive from ________.", "a": "B. ectoderm, mesoderm, and endoderm", "opts": ["A. endothelium, mesothelium, and epithelium", "B. ectoderm, mesoderm, and endoderm", "C. connective tissue, epithelial tissue, and muscle tissue", "D. epidermis, mesoderm, and endothelium"]}, {"id": "m2-c4-q11", "ch": 4, "section": "RQ", "q": "Which of the following lines the body cavities exposed to the external environment?", "a": "D. mucosa", "opts": ["A. mesothelium", "B. lamina propria", "C. mesenteries", "D. mucosa"]}, {"id": "m2-c4-q12", "ch": 4, "section": "RQ", "q": "In observing epithelial cells under a microscope, the cells are arranged in a single layer and look tall and narrow, and the nucleus is located close to the basal side of the cell. The specimen is what type of epithelial tissue?", "a": "A. columnar", "opts": ["A. columnar", "B. stratified", "C. squamous", "D. transitional"]}, {"id": "m2-c4-q13", "ch": 4, "section": "RQ", "q": "Which of the following is the epithelial tissue that lines the interior of blood vessels?", "a": "C. simple squamous", "opts": ["A. columnar", "B. pseudostratified", "C. simple squamous", "D. transitional"]}, {"id": "m2-c4-q14", "ch": 4, "section": "RQ", "q": "Which type of epithelial tissue specializes in moving particles across its surface and is found in airways and lining of the oviduct?", "a": "B. stratified columnar", "opts": ["A. transitional", "B. stratified columnar", "C. pseudostratified ciliated columnar", "D. stratified squamous"]}, {"id": "m2-c4-q15", "ch": 4, "section": "RQ", "q": "The ________ exocrine gland stores its secretion until the glandular cell ruptures, whereas the ________ gland releases its apical region and reforms.", "a": "A. holocrine; apocrine", "opts": ["A. holocrine; apocrine", "B. eccrine; endocrine", "C. apocrine; holocrine", "D. eccrine; apocrine"]}, {"id": "m2-c4-q16", "ch": 4, "section": "RQ", "q": "Connective tissue is made of which three essential components?", "a": "B. cells, ground substance, and protein fibers", "opts": ["A. cells, ground substance, and carbohydrate fibers", "B. cells, ground substance, and protein fibers", "C. collagen, ground substance, and protein fibers", "D. matrix, ground substance, and fluid"]}, {"id": "m2-c4-q17", "ch": 4, "section": "RQ", "q": "Under the microscope, a tissue specimen shows cells located in spaces scattered in a transparent background. This is probably ________.", "a": "D. hyaline cartilage", "opts": ["A. loose connective tissue", "B. a tendon", "C. bone", "D. hyaline cartilage"]}, {"id": "m2-c4-q18", "ch": 4, "section": "RQ", "q": "Which connective tissue specializes in storage of fat?", "a": "B. adipose tissue", "opts": ["A. tendon", "B. adipose tissue", "C. reticular tissue", "D. dense connective tissue"]}, {"id": "m2-c4-q19", "ch": 4, "section": "RQ", "q": "Ligaments connect bones together and withstand a lot of stress. What type of connective tissue should you expect ligaments to contain?", "a": "C. dense regular connective tissue", "opts": ["A. areolar tissue", "B. adipose tissue", "C. dense regular connective tissue", "D. dense irregular connective tissue"]}, {"id": "m2-c4-q20", "ch": 4, "section": "RQ", "q": "In adults, new connective tissue cells originate from the ________.", "a": "B. mesenchyme", "opts": ["A. mesoderm", "B. mesenchyme", "C. ectoderm", "D. endoderm"]}, {"id": "m2-c4-q21", "ch": 4, "section": "RQ", "q": "In bone, the main cells are ________.", "a": "D. osteocytes", "opts": ["A. fibroblasts", "B. chondrocytes", "C. lymphocytes", "D. osteocytes"]}, {"id": "m2-c4-q22", "ch": 4, "section": "RQ", "q": "Striations, cylindrical cells, and multiple nuclei are observed in ________.", "a": "A. skeletal muscle only", "opts": ["A. skeletal muscle only", "B. cardiac muscle only", "C. smooth muscle only", "D. skeletal and cardiac muscles"]}, {"id": "m2-c4-q23", "ch": 4, "section": "RQ", "q": "The cells of muscles, myocytes, develop from ________.", "a": "A. myoblasts", "opts": ["A. myoblasts", "B. endoderm", "C. fibrocytes", "D. chondrocytes"]}, {"id": "m2-c4-q24", "ch": 4, "section": "RQ", "q": "Skeletal muscle is composed of very hard working cells. Which organelles do you expect to find in abundance in skeletal muscle cell?", "a": "D. mitochondria", "opts": ["A. nuclei", "B. striations", "C. golgi bodies", "D. mitochondria"]}, {"id": "m2-c4-q25", "ch": 4, "section": "RQ", "q": "The cells responsible for the transmission of the nerve impulse are ________.", "a": "A. neurons", "opts": ["A. neurons", "B. oligodendrocytes", "C. astrocytes", "D. microglia"]}, {"id": "m2-c4-q26", "ch": 4, "section": "RQ", "q": "The nerve impulse travels down a(n) ________, away from the cell body.", "a": "B. axon", "opts": ["A. dendrite", "B. axon", "C. microglia", "D. collagen fiber"]}, {"id": "m2-c4-q27", "ch": 4, "section": "RQ", "q": "Which of the following central nervous system cells regulate ions, regulate the uptake and/or breakdown of some neurotransmitters, and contribute to the formation of the blood-brain barrier?", "a": "D. astrocytes", "opts": ["A. microglia", "B. neuroglia", "C. oligodendrocytes", "D. astrocytes"]}, {"id": "m2-c4-q28", "ch": 4, "section": "RQ", "q": "Which of the following processes is not a cardinal sign of inflammation?", "a": "C. fever", "opts": ["A. redness", "B. heat", "C. fever", "D. swelling"]}, {"id": "m2-c4-q29", "ch": 4, "section": "RQ", "q": "When a mast cell reacts to an irritation, which of the following chemicals does it release?", "a": "B. histamine", "opts": ["A. collagen", "B. histamine", "C. hyaluronic acid", "D. meylin"]}, {"id": "m2-c4-q30", "ch": 4, "section": "RQ", "q": "Atrophy refers to ________.", "a": "B. loss of mass", "opts": ["A. loss of elasticity", "B. loss of mass", "C. loss of rigidity", "D. loss of permeability"]}, {"id": "m2-c4-q31", "ch": 4, "section": "RQ", "q": "Individuals can slow the rate of aging by modifying all of these lifestyle aspects except for ________.", "a": "C. genetic factors", "opts": ["A. diet", "B. exercise", "C. genetic factors", "D. stress"]}, {"id": "m2-c4-q32", "ch": 4, "section": "CT", "q": "Identify the four types of tissue in the body, and describe the major functions of each tissue.", "a": "The four types of tissue in the body are epithelial, connective, muscle, and nervous. Epithelial tissue is made of layers of cells that cover the surfaces of the body that come into contact with the exterior world, line internal cavities, and form glands. Connective tissue binds the cells and organs of the body together and performs many functions, especially in the protection, support, and integration of the body. Muscle tissue, which responds to stimulation and contracts to provide movement, is divided into three major types: skeletal (voluntary) muscles, smooth muscles, and the cardiac muscle in the heart. Nervous tissue allows the body to receive signals and transmit information as electric impulses from one region of the body to another."}, {"id": "m2-c4-q33", "ch": 4, "section": "CT", "q": "The zygote is described as totipotent because it ultimately gives rise to all the cells in your body including the highly specialized cells of your nervous system. Describe this transition, discussing the steps and processes that lead to these specialized cells.", "a": "The zygote divides into many cells. As these cells become specialized, they lose their ability to differentiate into all tissues. At first they form the three primary germ layers. Following the cells of the ectodermal germ layer, they too become more restricted in what they can form. Ultimately, some of these ectodermal cells become further restricted and differentiate in to nerve cells."}, {"id": "m2-c4-q34", "ch": 4, "section": "CT", "q": "What is the function of synovial membranes?", "a": "Synovial membranes are a type of connective tissue membrane that supports mobility in joints. The membrane lines the joint cavity and contains fibroblasts that produce hyaluronan, which leads to the production of synovial fluid, a natural lubricant that enables the bones of a joint to move freely against one another."}, {"id": "m2-c4-q35", "ch": 4, "section": "CT", "q": "The structure of a tissue usually is optimized for its function. Describe how the structure of individual cells and tissue arrangement of the intestine lining matches its main function, to absorb nutrients.", "a": "Columnar epithelia, which form the lining of the digestive tract, can be either simple or stratified. The cells are long and narrow. The nucleus is elongated and located on the basal side of the cell. Ciliated columnar epithelium is composed of simple columnar epithelial cells that display cilia on their apical surfaces."}, {"id": "m2-c4-q36", "ch": 4, "section": "CT", "q": "One of the main functions of connective tissue is to integrate organs and organ systems in the body. Discuss how blood fulfills this role.", "a": "Blood is a fluid connective tissue, a variety of specialized cells that circulate in a watery fluid containing salts, nutrients, and dissolved proteins in a liquid extracellular matrix. Blood contains formed elements derived from bone marrow. Erythrocytes, or red blood cells, transport the gases oxygen and carbon dioxide. Leukocytes, or white blood cells, are responsible for the defense of the organism against potentially harmful microorganisms or molecules. Platelets are cell fragments involved in blood clotting. Some cells have the ability to cross the endothelial layer that lines vessels and enter adjacent tissues. Nutrients, salts, and waste are dissolved in the liquid matrix and transported through the body."}, {"id": "m2-c4-q37", "ch": 4, "section": "CT", "q": "Why does an injury to cartilage, especially hyaline cartilage, heal much more slowly than a bone fracture?", "a": "A layer of dense irregular connective tissue covers cartilage. No blood vessels supply cartilage tissue. Injuries to cartilage heal very slowly because cells and nutrients needed for repair diffuse slowly to the injury site."}, {"id": "m2-c4-q38", "ch": 4, "section": "CT", "q": "You are watching cells in a dish spontaneously contract. They are all contracting at different rates; some fast, some slow. After a while, several cells link up and they begin contracting in synchrony. Discuss what is going on and what type of cells you are looking at.", "a": "The cells in the dish are cardiomyocytes, cardiac muscle cells. They have an intrinsic ability to contract. When they link up, they form intercalating discs that allow the cells to communicate with each other and begin contracting in synchrony."}, {"id": "m2-c4-q39", "ch": 4, "section": "CT", "q": "Why does skeletal muscle look striated?", "a": "Under the light microscope, cells appear striated due to the arrangement of the contractile proteins actin and myosin."}, {"id": "m2-c4-q40", "ch": 4, "section": "CT", "q": "Which morphological adaptations of neurons make them suitable for the transmission of nerve impulse?", "a": "Neurons are well suited for the transmission of nerve impulses because short extensions, dendrites, receive impulses from other neurons, while a long tail extension, an axon, carries electrical impulses away from the cell to other neurons."}, {"id": "m2-c4-q41", "ch": 4, "section": "CT", "q": "What are the functions of astrocytes?", "a": "Astrocytes regulate ions and uptake and/or breakdown of some neurotransmitters and contribute to the formation of the blood-brain-barrier."}, {"id": "m2-c4-q42", "ch": 4, "section": "CT", "q": "Why is it important to watch for increased redness, swelling and pain after a cut or abrasion has been cleaned and bandaged?", "a": "These symptoms would indicate that infection is present."}, {"id": "m2-c4-q43", "ch": 4, "section": "CT", "q": "Aspirin is a non-steroidal anti-inflammatory drug (NSAID) that inhibits the formation of blood clots and is taken regularly by individuals with a heart condition. Steroids such as cortisol are used to control some autoimmune diseases and severe arthritis by down regulating the inflammatory response. After reading the role of inflammation in the body’s response to infection, can you predict an undesirable consequence of taking anti-inflammatory drugs on a regular basis?", "a": "Since NSAIDs or other anti-inflammatory drugs inhibit the formation of blood clots, regular and prolonged use of these drugs may promote internal bleeding, such as bleeding in the stomach. Excessive levels of cortisol would suppress inflammation, which could slow the wound healing process."}, {"id": "m2-c4-q44", "ch": 4, "section": "CT", "q": "As an individual ages, a constellation of symptoms begins the decline to the point where an individual’s functioning is compromised. Identify and discuss two factors that have a role in factors leading to the compromised situation.", "a": "The genetic makeup and the lifestyle of each individual are factors which determine the degree of decline in cells, tissues, and organs as an individual ages."}, {"id": "m2-c4-q45", "ch": 4, "section": "CT", "q": "Discuss changes that occur in cells as a person ages.", "a": "All cells experience changes with aging. They become larger, and many cannot divide and regenerate. Because of alterations in cell membranes, transport of oxygen and nutrients into the cell and removal of carbon dioxide and waste products are not as efficient in the elderly. Cells lose their ability to function, or they begin to function abnormally, leading to disease and cancer."}, {"id": "m2-c5-q5", "ch": 5, "section": "RQ", "q": "The papillary layer of the dermis is most closely associated with which layer of the epidermis?", "a": "D. stratum basale", "opts": ["A. stratum spinosum", "B. stratum corneum", "C. stratum granulosum", "D. stratum basale"]}, {"id": "m2-c5-q6", "ch": 5, "section": "RQ", "q": "Langerhans cells are commonly found in the ________.", "a": "A. stratum spinosum", "opts": ["A. stratum spinosum", "B. stratum corneum", "C. stratum granulosum", "D. stratum basale"]}, {"id": "m2-c5-q7", "ch": 5, "section": "RQ", "q": "The papillary and reticular layers of the dermis are composed mainly of ________.", "a": "C. connective tissue", "opts": ["A. melanocytes", "B. keratinocytes", "C. connective tissue", "D. adipose tissue"]}, {"id": "m2-c5-q8", "ch": 5, "section": "RQ", "q": "Collagen lends ________ to the skin.", "a": "B. structure", "opts": ["A. elasticity", "B. structure", "C. color", "D. UV protection"]}, {"id": "m2-c5-q9", "ch": 5, "section": "RQ", "q": "Which of the following is not a function of the hypodermis?", "a": "C. source of blood vessels in the epidermis", "opts": ["A. protects underlying organs", "B. helps maintain body temperature", "C. source of blood vessels in the epidermis", "D. a site to long-term energy storage"]}, {"id": "m2-c5-q10", "ch": 5, "section": "RQ", "q": "In response to stimuli from the sympathetic nervous system, the arrector pili ________.", "a": "C. are responsible for goose bumps", "opts": ["A. are glands on the skin surface", "B. can lead to excessive sweating", "C. are responsible for goose bumps", "D. secrete sebum"]}, {"id": "m2-c5-q11", "ch": 5, "section": "RQ", "q": "The hair matrix contains ________.", "a": "D. a layer of basal cells", "opts": ["A. the hair follicle", "B. the hair shaft", "C. the glassy membrane", "D. a layer of basal cells"]}, {"id": "m2-c5-q12", "ch": 5, "section": "RQ", "q": "Eccrine sweat glands ________.", "a": "B. are present in the skin throughout the body and produce watery sweat", "opts": ["A. are present on hair", "B. are present in the skin throughout the body and produce watery sweat", "C. produce sebum", "D. act as a moisturizer"]}, {"id": "m2-c5-q13", "ch": 5, "section": "RQ", "q": "Sebaceous glands ________.", "a": "B. are associated with hair follicles", "opts": ["A. are a type of sweat gland", "B. are associated with hair follicles", "C. may function in response to touch", "D. release a watery solution of salt and metabolic waste"]}, {"id": "m2-c5-q14", "ch": 5, "section": "RQ", "q": "Similar to the hair, nails grow continuously throughout our lives. Which of the following is furthest from the nail growth center?", "a": "B. hyponychium", "opts": ["A. nail bed", "B. hyponychium", "C. nail root", "D. eponychium"]}, {"id": "m2-c5-q15", "ch": 5, "section": "RQ", "q": "In humans, exposure of the skin to sunlight is required for ________.", "a": "A. vitamin D synthesis", "opts": ["A. vitamin D synthesis", "B. arteriole constriction", "C. folate production", "D. thermoregulation"]}, {"id": "m2-c5-q16", "ch": 5, "section": "RQ", "q": "One of the functions of the integumentary system is protection. Which of the following does not directly contribute to that function?", "a": "C. folic acid synthesis", "opts": ["A. stratum lucidum", "B. desmosomes", "C. folic acid synthesis", "D. Merkel cells"]}, {"id": "m2-c5-q17", "ch": 5, "section": "RQ", "q": "An individual using a sharp knife notices a small amount of blood where he just cut himself. Which of the following layers of skin did he have to cut into in order to bleed?", "a": "C. papillary dermis", "opts": ["A. stratum corneum", "B. stratum basale", "C. papillary dermis", "D. stratum granulosum"]}, {"id": "m2-c5-q18", "ch": 5, "section": "RQ", "q": "As you are walking down the beach, you see a dead, dry, shriveled-up fish. Which layer of your epidermis keeps you from drying out?", "a": "A. stratum corneum", "opts": ["A. stratum corneum", "B. stratum basale", "C. stratum spinosum", "D. stratum granulosum"]}, {"id": "m2-c5-q19", "ch": 5, "section": "RQ", "q": "If you cut yourself and bacteria enter the wound, which of the following cells would help get rid of the bacteria?", "a": "C. Langerhans cells", "opts": ["A. Merkel cells", "B. keratinocytes", "C. Langerhans cells", "D. melanocytes"]}, {"id": "m2-c5-q20", "ch": 5, "section": "RQ", "q": "In general, skin cancers ________.", "a": "C. can be reduced by limiting exposure to the sun", "opts": ["A. are easily treatable and not a major health concern", "B. occur due to poor hygiene", "C. can be reduced by limiting exposure to the sun", "D. affect only the epidermis"]}, {"id": "m2-c5-q21", "ch": 5, "section": "RQ", "q": "Bedsores ________.", "a": "C. are preventable by eliminating pressure points", "opts": ["A. can be treated with topical moisturizers", "B. can result from deep massages", "C. are preventable by eliminating pressure points", "D. are caused by dry skin"]}, {"id": "m2-c5-q22", "ch": 5, "section": "RQ", "q": "An individual has spent too much time sun bathing. Not only is his skin painful to touch, but small blisters have appeared in the affected area. This indicates that he has damaged which layers of his skin?", "a": "D. epidermis and dermis", "opts": ["A. epidermis only", "B. hypodermis only", "C. epidermis and hypodermis", "D. epidermis and dermis"]}, {"id": "m2-c5-q23", "ch": 5, "section": "RQ", "q": "After a skin injury, the body initiates a wound-healing response. The first step of this response is the formation of a blood clot to stop bleeding. Which of the following would be the next response?", "a": "B. increased production of connective tissue", "opts": ["A. increased production of melanin by melanocytes", "B. increased production of connective tissue", "C. an increase in Pacinian corpuscles around the wound", "D. an increased activity in the stratum lucidum"]}, {"id": "m2-c5-q24", "ch": 5, "section": "RQ", "q": "Squamous cell carcinomas are the second most common of the skin cancers and are capable of metastasizing if not treated. This cancer affects which cells?", "a": "C. keratinocytes of the stratum spinosum", "opts": ["A. basal cells of the stratum basale", "B. melanocytes of the stratum basale", "C. keratinocytes of the stratum spinosum", "D. Langerhans cells of the stratum lucidum"]}, {"id": "m2-c5-q25", "ch": 5, "section": "CT", "q": "What determines the color of skin, and what is the process that darkens skin when it is exposed to UV light?", "a": "The pigment melanin, produced by melanocytes, is primarily responsible for skin color. Melanin comes in different shades of brown and black. Individuals with darker skin have darker, more abundant melanin, whereas fair-skinned individuals have a lighter shade of skin and less melanin. Exposure to UV irradiation stimulates the melanocytes to produce and secrete more melanin."}, {"id": "m2-c5-q26", "ch": 5, "section": "CT", "q": "Cells of the epidermis derive from stem cells of the stratum basale. Describe how the cells change as they become integrated into the different layers of the epidermis.", "a": "As the cells move into the stratum spinosum, they begin the synthesis of keratin and extend cell processes, desmosomes, which link the cells. As the stratum basale continues to produce new cells, the keratinocytes of the stratum spinosum are pushed into the stratum granulosum. The cells become flatter, their cell membranes thicken, and they generate large amounts of the proteins keratin and keratohyalin. The nuclei and other cell organelles disintegrate as the cells die, leaving behind the keratin, keratohyalin, and cell membranes that form the stratum lucidum and the stratum corneum. The keratinocytes in these layers are mostly dead and flattened. Cells in the stratum corneum are periodically shed."}, {"id": "m2-c5-q27", "ch": 5, "section": "CT", "q": "Explain the
